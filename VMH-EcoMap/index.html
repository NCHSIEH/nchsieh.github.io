<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VMH-EcoMap 知識管理系統｜越南現代醫院生態導入盤點器</title>
<meta name="description" content="VMH-EcoMap 越南現代醫院生態導入盤點器的線上知識管理系統：60 項能力模組、85 門商機、29 個夥伴角色、37 條法規門檻與 60 個月行動路線，可搜尋、可連結、可回溯。">
<meta name="author" content="謝楠楨 Nan-Chen Hsieh">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230b4f45'/%3E%3Ctext x='50' y='67' font-family='Georgia,serif' font-size='42' font-weight='700' fill='%23fff' text-anchor='middle'%3EVM%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/vmh.css">
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <a href="#/" style="text-decoration:none">
        <span class="brand__mark">VMH-EcoMap</span>
        <span class="brand__sub">越南現代醫院生態導入盤點器</span>
      </a>
    </div>
    <nav class="nav" id="nav" aria-label="主導覽"></nav>
    <div class="sidebar__foot" id="sidebarFoot">載入中…</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="topbar__title" id="topbarTitle">載入中…</span>
      <span class="topbar__spacer"></span>
      <button class="searchbtn" id="searchBtn" type="button">
        <span aria-hidden="true">⌕</span>
        <span>搜尋能力、商機、夥伴、法規…</span>
        <kbd>⌘K</kbd>
      </button>
      <button class="iconbtn" id="themeBtn" type="button" title="切換深淺色">☾</button>
    </header>

    <main class="content" id="content">
      <div class="empty">載入知識庫…</div>
    </main>
  </div>

</div>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="全站搜尋">
  <div class="palette__box">
    <label for="paletteInput" class="sr-only">搜尋</label>
    <input type="search" id="paletteInput" placeholder="搜尋能力、商機、夥伴、法規、風險、工作包…" autocomplete="off">
    <div class="palette__results" id="paletteResults"></div>
    <div class="palette__foot">↑↓ 選擇　·　Enter 開啟　·　Esc 關閉</div>
  </div>
</div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
