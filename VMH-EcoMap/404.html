<script>
function setMode(e,m){
 if(e)e.preventDefault();
 document.documentElement.setAttribute('data-mode', m);
 try{localStorage.setItem('vmh_mode', m);}catch(err){}
 document.querySelectorAll('.modesw a').forEach(function(a){a.classList.toggle('on', a.getAttribute('data-md')===m)});
 return false;
}
(function(){
 var LANGS=['zh','en','vi'];
 document.querySelectorAll('.langsw a[data-lang]').forEach(function(a){
   a.addEventListener('click', function(e){
     e.preventDefault();
     var target=a.getAttribute('data-lang');
     var path=location.pathname;
     var file=path.split('/').pop();
     var dir=path.slice(0, path.length-file.length);
     var m=file.match(/^(.*?)(\.(en|vi))?\.html$/);
     if(!m) return;
     var base=m[1];
     var newFile = target==='zh' ? base+'.html' : base+'.'+target+'.html';
     location.href = dir + newFile + location.hash;
   });
 });
 document.addEventListener('click', function(e){
   document.querySelectorAll('.setwrap.open').forEach(function(w){ if(!w.contains(e.target)) w.classList.remove('open'); });
 });
 try{
   var m=localStorage.getItem('vmh_mode')||'business';
   document.querySelectorAll('.modesw a[data-md="'+m+'"]').forEach(function(a){a.classList.add('on')});
 }catch(err){}
})();
</script></body></html>
