*{box-sizing:border-box;margin:0}
body{font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}

h2{font-size:1.05rem;color:var(--ink);margin:26px 0 4px}

.card{background:var(--sf);border-radius:13px;box-shadow:0 1px 5px rgba(16,26,45,.08);padding:18px 20px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

.kpi .v{font-size:1.75rem;font-weight:800;color:var(--ink);margin-top:2px}
.kpi .n{font-size:.72rem;color:var(--sub);margin-top:3px;line-height:1.45}
.kpi.alert .v{color:var(--crit)}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;color:var(--sub);margin-bottom:10px}
.lg span{display:flex;align-items:center;gap:5px}
.lg i{width:11px;height:11px;border-radius:3px;display:block}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:var(--line);color:var(--ink);font-size:.72rem;letter-spacing:.5px;padding:8px 9px;text-align:left;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-block}
.p-ok{background:rgba(12,163,12,.14);color:var(--ok)}
.p-warn{background:rgba(250,178,25,.18);color:#8a6100}

html[data-mode="dark"] .p-warn{color:var(--warn)}
.tipbox{position:fixed;pointer-events:none;background:var(--sf);color:var(--ink);border:1px solid var(--line);
 border-radius:9px;padding:8px 11px;font-size:.76rem;box-shadow:0 8px 24px rgba(10,20,40,.25);z-index:999;display:none;max-width:250px}
.bar{cursor:pointer}
.bar:hover{opacity:.85}
.note{background:rgba(31,56,100,.06);border-left:3px solid var(--navy);border-radius:0 8px 8px 0;
 padding:10px 13px;font-size:.8rem;color:var(--ink);margin-top:12px}
.empty{color:var(--sub);font-size:.85rem;padding:20px;text-align:center}
.i18nsw{position:fixed;right:14px;top:14px;z-index:9999;font-family:system-ui,sans-serif}
.i18btn{background:rgba(21,44,78,.94);color:#fff;border:0;border-radius:10px;padding:7px 13px;
 font-size:.8rem;font-weight:700;cursor:pointer;box-shadow:0 3px 14px rgba(0,0,0,.25)}
.i18btn:hover{background:#1F3864}
.i18panel{display:none;position:absolute;right:0;top:calc(100% + 8px);background:#fff;color:#232B37;
 border-radius:12px;box-shadow:0 8px 30px rgba(10,20,40,.28);padding:12px;width:212px;border:1px solid #E1E7EF}
.i18nsw.open .i18panel{display:block}
.i18gt{font-size:.64rem;font-weight:800;letter-spacing:1px;color:#6B7480;margin:9px 2px 6px}
.i18gt:first-child{margin-top:2px}
.i18home{display:block;font-size:.82rem;font-weight:700;color:#152C4E;text-decoration:none;
 padding:7px 9px;border-radius:7px;background:#F4F8FB;margin-bottom:2px}
.i18home:hover{background:#E7EEF6}
.i18row{display:flex;gap:4px;flex-wrap:wrap}
.i18row a{color:#232B37;background:#F4F8FB;text-decoration:none;padding:5px 9px;border-radius:7px;font-size:.74rem;font-weight:700}
.i18row a.on{background:#152C4E;color:#fff}
.i18modes a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:.78rem;
 color:#232B37;text-decoration:none;border:1px solid #E1E7EF;margin-bottom:3px}
.i18modes a i{width:12px;height:12px;border-radius:50%;display:block;flex:none;border:1px solid rgba(0,0,0,.12)}
.i18modes a.on{border-color:#152C4E;background:#F4F8FB;font-weight:700}
@media(max-width:640px){.i18nsw{top:auto;bottom:14px;right:14px}main{padding:16px 12px 50px}}

<main>

<div class="kpis" id="kpis"></div>

<h2>漏斗｜各階段現況</h2>
<p class="sub">外框長度＝案值合計（願望上限），實心長度＝加權案值（案值×階段機率，合理預期）。兩者落差愈大，代表管線愈集中在早期階段。</p>
<div class="card">
  <div class="lg">
    <span><i style="background:var(--s1l)"></i>案值合計</span>
    <span><i style="background:var(--s1)"></i>加權案值（案值×機率）</span>
  </div>
  <div id="funnel"></div>
</div>

<h2>停滯偵測</h2>
<p class="sub">停滯天數＝今天 − 上次更新日。超過該階段的警戒天數就轉紅——停滯是最誠實的警訊，比任何樂觀評語都準。</p>
<div class="card" style="overflow-x:auto"><div id="aging"></div></div>

<h2>案件清單</h2>
<p class="sub">點欄位標題可排序。</p>
<div class="card" style="overflow-x:auto"><div id="tbl"></div></div>

<div class="note" id="foot"></div>
</main>
<div class="tipbox" id="tip"></div>

<script src="../assets/xlsx.min.js"></script>
<script src="../assets/vmhdata.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const fmt=n=>(n==null||isNaN(n))?'—':Number(n).toLocaleString('zh-TW',{maximumFractionDigits:0});
const pct=n=>(n==null||isNaN(n))?'—':(n*100).toFixed(0)+'%';

const STAGES=[
 {code:'S1',name:'線索',p:.10,warn:45},{code:'S2',name:'接觸確認',p:.20,warn:45},
 {code:'S3',name:'需求成形',p:.35,warn:60},{code:'S4',name:'提案報價',p:.50,warn:45},
 {code:'S5',name:'短名單議價',p:.70,warn:45},{code:'S6',name:'決標簽約中',p:.90,warn:30},
 {code:'S7',name:'已簽約',p:1.0,warn:0}];

const DEMO=[
 {id:'P-001',name:'中央兒童醫院資料中心機房整建',cust:'國家兒童醫院',prov:'河內市',stage:'S4',
  val:1850,gm:.22,upd:'2026-08-12',owner:'陳',next:'追提案回覆，約下次技術澄清會',block:'',status:'進行中'},
 {id:'P-002',name:'峴港綜合醫院 UPS 與不斷電系統',cust:'峴港市綜合醫院',prov:'峴港市',stage:'S5',
  val:920,gm:.19,upd:'2026-08-14',owner:'林',next:'議價第二輪，準備讓步方案',block:'對方壓價 12%，逼近底價',status:'進行中'},
 {id:'P-003',name:'胡志明市醫學中心冷卻系統汰換',cust:'胡志明市醫學中心',prov:'胡志明市',stage:'S2',
  val:1400,gm:.20,upd:'2026-06-28',owner:'陳',next:'等對方年度預算定案',block:'預算尚未編列，卡在院方財務',status:'進行中'},
 {id:'P-004',name:'安沛省立醫院智慧病房 PPP 前期',cust:'安沛省立醫院',prov:'安沛省',stage:'S3',
  val:3200,gm:.16,upd:'2026-08-10',owner:'王',next:'協助院方寫可行性報告初稿',block:'',status:'進行中'}];

let ROWS=DEMO.slice(), ASOF=new Date('2026-08-18'), SORT={k:'stall',d:-1};

const stageOf=c=>STAGES.find(s=>s.code===c)||{code:c,name:c,p:0,warn:9999};
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return v;
  if(typeof v==='number')return new Date(Date.UTC(1899,11,30+v));
  const d=new Date(String(v).trim().replace(/\//g,'-')); return isNaN(d)?null:d;
}
const days=d=>d?Math.round((ASOF-d)/86400000):null;

function enrich(r){
  const st=stageOf(r.stage), d=parseDate(r.upd), stall=days(d);
  const wv=r.val*st.p;
  let lvl='ok';
  if(stall!=null&&st.warn&&stall>st.warn)lvl='crit'; else if(stall!=null&&stall>14)lvl='warn';
  return {...r,st,stall,wv,wgm:wv*(r.gm||0),lvl};
}
const alive=()=>ROWS.map(enrich).filter(r=>r.status==='進行中');

/* ── KPI ── */
function drawKpi(){
  const A=alive();
  const tot=A.reduce((a,r)=>a+r.val,0), w=A.reduce((a,r)=>a+r.wv,0),
        wg=A.reduce((a,r)=>a+r.wgm,0), st=A.filter(r=>r.lvl==='crit').length;
  const K=[
   ['進行中案件數',fmt(A.length),'件','' ],
   ['管線總值',fmt(tot),'千USD　案值加總，這是願望上限',''],
   ['加權管線值',fmt(w),'千USD　案值×階段機率，這才是合理預期',''],
   ['加權毛利',fmt(wg),'千USD　加權案值×我方毛利率',''],
   ['停滯案件',fmt(st),'件　超過該階段警戒天數未更新',st>0?'alert':''],
  ];
  document.getElementById('kpis').innerHTML=K.map(([k,v,n,cls])=>
   `<div class="kpi ${cls}"><div class="k">${esc(k)}</div><div class="v">${v}</div><div class="n">${esc(n)}</div></div>`).join('');
}

/* ── 漏斗 ── */
function drawFunnel(){
  const A=alive();
  const rows=STAGES.map(s=>{
    const L=A.filter(r=>r.stage===s.code);
    return {s,n:L.length,val:L.reduce((a,r)=>a+r.val,0),wv:L.reduce((a,r)=>a+r.wv,0),
            stall:L.length?L.reduce((a,r)=>a+(r.stall||0),0)/L.length:null};
  });
  const max=Math.max(1,...rows.map(r=>r.val));
  const W=880,LH=44,PADL=132,PADR=118,BW=W-PADL-PADR;
  const H=rows.length*LH+16;
  let sv=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="max-width:100%">`;
  rows.forEach((r,i)=>{
    const y=i*LH+8, bw=r.val/max*BW, ww=r.wv/max*BW;
    sv+=`<text x="${PADL-10}" y="${y+18}" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--ink)">${esc(r.s.code+' '+r.s.name)}</text>`;
    sv+=`<text x="${PADL-10}" y="${y+31}" text-anchor="end" font-size="10.5" fill="var(--sub)">機率 ${pct(r.s.p)}</text>`;
    if(r.val>0){
      sv+=`<rect class="bar" x="${PADL}" y="${y+4}" width="${bw}" height="26" rx="4" fill="var(--s1l)"
        data-t="${esc(r.s.code+' '+r.s.name)}｜${r.n} 件｜案值 ${fmt(r.val)}｜加權 ${fmt(r.wv)} 千USD"/>`;
      sv+=`<rect class="bar" x="${PADL}" y="${y+4}" width="${ww}" height="26" rx="4" fill="var(--s1)"
        data-t="加權案值 ${fmt(r.wv)} 千USD＝案值 ${fmt(r.val)} × 機率 ${pct(r.s.p)}"/>`;
      sv+=`<text x="${PADL+bw+8}" y="${y+22}" font-size="12" fill="var(--ink)"><tspan font-weight="700">${fmt(r.wv)}</tspan><tspan fill="var(--sub)" dx="5">/ ${fmt(r.val)}</tspan></text>`;
      sv+=`<text x="${PADL+6}" y="${y+22}" font-size="11" font-weight="700" fill="#fff">${r.n} 件</text>`;
    }else{
      sv+=`<line x1="${PADL}" y1="${y+17}" x2="${PADL+14}" y2="${y+17}" stroke="var(--axis)" stroke-width="2"/>`;
      sv+=`<text x="${PADL+22}" y="${y+22}" font-size="11.5" fill="var(--sub)">目前沒有案件</text>`;
    }
  });
  sv+='</svg>';
  document.getElementById('funnel').innerHTML=sv;
  bindTip('#funnel');
}

/* ── 停滯 ── */
function drawAging(){
  const A=alive().slice().sort((a,b)=>(b.stall||0)-(a.stall||0));
  if(!A.length){document.getElementById('aging').innerHTML='<div class="empty">沒有進行中的案件</div>';return;}
  const lbl={ok:['正常','p-ok'],warn:['注意','p-warn'],crit:['⚠ 停滯','p-crit']};
  document.getElementById('aging').innerHTML=
   `<table><thead><tr><th>案件</th><th>階段</th><th class="num">停滯天數</th><th class="num">警戒值</th><th>狀態</th><th>卡關原因／下一步</th></tr></thead><tbody>`+
   A.map(r=>{const[t,c]=lbl[r.lvl];return `<tr>
     <td><b>${esc(r.id)}</b> ${esc(r.name)}</td>
     <td>${esc(r.st.code+' '+r.st.name)}</td>
     <td class="num">${r.stall==null?'—':r.stall}</td>
     <td class="num" style="color:var(--sub)">${r.st.warn||'—'}</td>
     <td><span class="pill ${c}">${t}</span></td>
     <td>${esc(r.block||r.next||'')}</td></tr>`}).join('')+'</tbody></table>';
}

/* ── 案件表 ── */
const COLS=[['id','案件ID',0],['name','案件名稱',0],['cust','客戶',0],['stage','階段',0],
 ['val','案值',1],['gm','毛利率',1],['wv','加權案值',1],['stall','停滯',1],['owner','負責人',0],['next','下一步',0]];
function drawTbl(){
  const A=alive().slice().sort((a,b)=>{
    const k=SORT.k; let x=a[k],y=b[k];
    if(k==='stage'){x=a.st.code;y=b.st.code;}
    if(typeof x==='string')return SORT.d*x.localeCompare(y,'zh-Hant');
    return SORT.d*((x||0)-(y||0));
  });
  document.getElementById('tbl').innerHTML=
   `<table><thead><tr>`+COLS.map(([k,t,n])=>
     `<th class="${n?'num':''}" style="cursor:pointer" onclick="sortBy('${k}')">${esc(t)}${SORT.k===k?(SORT.d>0?' ▲':' ▼'):''}</th>`).join('')+
   `</tr></thead><tbody>`+A.map(r=>`<tr>
     <td><b>${esc(r.id)}</b></td><td>${esc(r.name)}</td><td>${esc(r.cust)}</td>
     <td>${esc(r.st.code+' '+r.st.name)}</td>
     <td class="num">${fmt(r.val)}</td><td class="num">${pct(r.gm)}</td>
     <td class="num"><b>${fmt(r.wv)}</b></td>
     <td class="num" style="color:${r.lvl==='crit'?'var(--crit)':'inherit'}">${r.stall==null?'—':r.stall}</td>
     <td>${esc(r.owner)}</td><td>${esc(r.next||'')}</td></tr>`).join('')+'</tbody></table>';
}
function sortBy(k){SORT.d=(SORT.k===k)?-SORT.d:-1;SORT.k=k;drawTbl();}

/* ── tooltip ── */
function bindTip(sel){
  const tip=document.getElementById('tip');
  document.querySelectorAll(sel+' [data-t]').forEach(el=>{
    el.addEventListener('mousemove',e=>{tip.textContent=el.getAttribute('data-t');
      tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-260)+'px';tip.style.top=(e.clientY+14)+'px';});
    el.addEventListener('mouseleave',()=>tip.style.display='none');
  });
}

function render(){drawKpi();drawFunnel();drawAging();drawTbl();
  const A=alive();
  document.getElementById('foot').innerHTML=
   `目前 ${A.length} 件進行中，資料基準日 ${ASOF.toISOString().slice(0,10)}。`+
   `加權管線值的準確度取決於階段機率，而階段機率要用 20 號檔「月度快照」的實際轉換率去校正——前三個月不準是正常的，重點是每月都記一次。`;
}

/* ── 讀 Excel ── */
function autoloadXlsx(relPath,onWB){
  if(location.protocol==='file:')return;
  fetch(relPath).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();})
   .then(b=>{const wb=XLSX.read(new Uint8Array(b),{type:'array'});onWB(wb,'資料主檔（站上發布版）');})
   .catch(()=>{});
}
function useWB(wb,label){
      const ws=wb.Sheets['01_案件登錄_Pipeline'];
      if(!ws)throw new Error('找不到「01_案件登錄_Pipeline」分頁');
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,range:3,defval:null});
      const H=rows[0].map(x=>String(x??'').replace(/\s/g,''));
      const ix=n=>H.findIndex(h=>h.indexOf(n)===0);
      const c={id:ix('案件ID'),name:ix('案件名稱'),cust:ix('客戶'),prov:ix('省市'),stage:ix('階段'),
        val:ix('預估案值'),gm:ix('我方毛利率'),upd:ix('上次更新日'),owner:ix('負責人'),
        next:ix('下一步動作'),block:ix('卡關原因'),status:ix('狀態')};
      const out=[];
      for(let i=1;i<rows.length;i++){
        const r=rows[i]; if(!r||!r[c.id])continue;
        out.push({id:r[c.id],name:r[c.name]||'',cust:r[c.cust]||'',prov:r[c.prov]||'',
          stage:String(r[c.stage]||'').trim().slice(0,2),
          val:Number(r[c.val])||0,gm:Number(r[c.gm])||0,upd:r[c.upd],
          owner:r[c.owner]||'',next:r[c.next]||'',block:r[c.block]||'',
          status:r[c.status]||'進行中'});
      }
      if(!out.length)throw new Error('這個檔案的案件登錄頁沒有資料列');
      // 階段定義（若存在就覆蓋預設機率與警戒天數）
      const sd=wb.Sheets['02_階段定義_Stages'];
      if(sd){
        const sr=XLSX.utils.sheet_to_json(sd,{header:1,range:3,defval:null});
        for(let i=1;i<sr.length;i++){
          const code=String(sr[i][0]||'').trim(); if(!code)continue;
          const t=STAGES.find(s=>s.code===code);
          if(t){if(sr[i][3]!=null)t.p=Number(sr[i][3]); if(sr[i][6]!=null)t.warn=Number(sr[i][6]);}
        }
      }
      ROWS=out; ASOF=new Date();
      document.getElementById('src').textContent=`已載入 ${label}（${out.length} 筆）`;
      render();
}
function loadX(file){
  if(!file)return;
  const rd=new FileReader();
  rd.onload=e=>{
    try{useWB(XLSX.read(new Uint8Array(e.target.result),{type:'array'}),file.name);}
    catch(err){document.getElementById('src').textContent='讀取失敗：'+err.message;}
  };
  rd.readAsArrayBuffer(file);
}
VMHData.resolve('t20',{published:'data/VMH-EcoMap-20.xlsx',onData:(wb,label,origin)=>{try{useWB(wb,label)}catch(e){}}});
function setMode(e,m){
 if(e)e.preventDefault();
 document.documentElement.setAttribute('data-mode',m);
 try{localStorage.setItem('vmh_mode',m);}catch(err){}
 document.querySelectorAll('.i18modes a').forEach(a=>a.classList.toggle('on',a.getAttribute('data-md')===m));
 return false;
}
(function(){
 document.querySelectorAll('.i18btn').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('open')));
 document.addEventListener('click',e=>{document.querySelectorAll('.i18nsw.open').forEach(w=>{if(!w.contains(e.target))w.classList.remove('open');});});
 try{const m=localStorage.getItem('vmh_mode')||'business';
   document.querySelectorAll('.i18modes a[data-md="'+m+'"]').forEach(a=>a.classList.add('on'));}catch(e){}
})();
render();
