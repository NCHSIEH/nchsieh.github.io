<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>VMH-EcoMap 知識管理系統｜越南現代醫院生態導入盤點器</title>
<meta name="description" content="VMH-EcoMap 越南現代醫院生態導入盤點器的線上知識管理系統：60 項能力模組、85 門商機、29 個夥伴角色、37 條法規門檻與 60 個月行動路線，可搜尋、可連結、可回溯。">
<meta name="author" content="謝楠楨 Nan-Chen Hsieh">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230b4f45'/%3E%3Ctext x='50' y='67' font-family='Georgia,serif' font-size='42' font-weight='700' fill='%23fff' text-anchor='middle'%3EVM%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   VMH-EcoMap 知識管理系統 — 樣式
   越南現代醫院生態導入盤點器｜Vietnam Modern Hospital Ecosystem Map
   自成一格、不影響主網站；顏色一律走 token
   ========================================================================== */

:root {
  --brand:       #0b4f45;
  --brand-deep:  #073830;
  --brand-tint:  rgba(11, 79, 69, .07);
  --on-brand:    #ffffff;

  --accent:      #0e7490;
  --accent-deep: #0b596e;
  --accent-tint: rgba(14, 116, 144, .12);

  --ink:    #14201d;
  --muted:  #4a5a56;
  --faint:  #74847f;

  --line:        #dfe6e3;
  --line-strong: #c2cecb;

  --surface:   #ffffff;
  --surface-2: #f2f8f6;
  --surface-3: #e8f1ee;
  --card:      #ffffff;

  /* 四種拼圖狀態 — 全站共同語言 */
  --lead-bg:   #cfe9e3;  --lead-fg:   #0b4f45;   /* ● 群晶主導 */
  --conf-bg:   #dbeafe;  --conf-fg:   #1e3a8a;   /* ◆ 夥伴已確認 */
  --talk-bg:   #fef3c7;  --talk-fg:   #78350f;   /* ◐ 夥伴洽談中 */
  --gap-bg:    #fee2e2;  --gap-fg:    #991b1b;   /* ○ 缺口-待尋找 */

  --ok-bg:     #dcfce7;  --ok-fg:     #14532d;
  --warn-bg:   #fef3c7;  --warn-fg:   #78350f;
  --danger-bg: #fee2e2;  --danger-fg: #991b1b;
  --info-bg:   #e0f2fe;  --info-fg:   #075985;
  --neutral-bg:#eef2f1;  --neutral-fg:#3f4d4a;

  --shadow-1: 0 1px 2px rgba(8, 30, 26, .05), 0 1px 3px rgba(8, 30, 26, .06);
  --shadow-2: 0 4px 6px -2px rgba(8, 30, 26, .04), 0 12px 24px -6px rgba(8, 30, 26, .10);
  --shadow-3: 0 24px 48px -12px rgba(8, 30, 26, .24);

  --radius:    12px;
  --radius-sm: 8px;
  --radius-lg: 18px;
  --maxw:      1440px;

  --font-sans: "Noto Sans TC", "Noto Sans", "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  color-scheme: light;
}

html[data-theme="dark"] {
  --brand:       #4db6a4;
  --brand-deep:  #7fd3c3;
  --brand-tint:  rgba(77, 182, 164, .12);
  --on-brand:    #06201c;

  --accent:      #56b6d4;
  --accent-deep: #8ad0e6;
  --accent-tint: rgba(86, 182, 212, .14);

  --ink:    #e6efec;
  --muted:  #a7b8b3;
  --faint:  #7e8f8a;

  --line:        #24322e;
  --line-strong: #35443f;

  --surface:   #0d1614;
  --surface-2: #121e1b;
  --surface-3: #182723;
  --card:      #121e1b;

  --lead-bg:   #10403a;  --lead-fg:   #8fe0cf;
  --conf-bg:   #1c2c53;  --conf-fg:   #a8c4f5;
  --talk-bg:   #40320f;  --talk-fg:   #f5d488;
  --gap-bg:    #4a1d1d;  --gap-fg:    #f6a9a9;

  --ok-bg:     #12351f;  --ok-fg:     #86e0a5;
  --warn-bg:   #40320f;  --warn-fg:   #f5d488;
  --danger-bg: #4a1d1d;  --danger-fg: #f6a9a9;
  --info-bg:   #12314a;  --info-fg:   #93cdf0;
  --neutral-bg:#1d2a27;  --neutral-fg:#a7b8b3;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 12px 24px -6px rgba(0, 0, 0, .5);
  --shadow-3: 0 24px 48px -12px rgba(0, 0, 0, .65);

  color-scheme: dark;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--surface-2);
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent-deep); text-decoration: none; }
a:hover { text-decoration: underline; }

h1, h2, h3, h4 { line-height: 1.3; margin: 0; font-weight: 700; }

code, .mono { font-family: var(--font-mono); font-size: .92em; }

/* --------------------------------------------------------------------------
   版面骨架：左側導覽 + 右側內容
   -------------------------------------------------------------------------- */
.shell {
  display: grid;
  grid-template-columns: 258px minmax(0, 1fr);
  min-height: 100vh;
}

.sidebar {
  background: var(--brand-deep);
  color: #dff0ec;
  padding: 22px 0 40px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
html[data-theme="dark"] .sidebar { background: #08120f; border-right: 1px solid var(--line); }

.brand { padding: 0 20px 18px; border-bottom: 1px solid rgba(255, 255, 255, .12); }
.brand__mark {
  font-size: 19px; font-weight: 700; letter-spacing: .04em;
  color: #fff; display: block;
}
.brand__sub { font-size: 12px; color: #9dc4bc; margin-top: 3px; display: block; }
html[data-theme="dark"] .brand__mark { color: var(--brand-deep); }

.nav { margin-top: 14px; }
.nav__group { padding: 12px 20px 5px; font-size: 11px; letter-spacing: .12em; color: #6f9a92; text-transform: uppercase; }
.nav a {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 20px; color: #cfe4e0; font-size: 14px; text-decoration: none;
  border-left: 3px solid transparent;
}
.nav a:hover { background: rgba(255, 255, 255, .06); color: #fff; text-decoration: none; }
.nav a.is-active {
  background: rgba(255, 255, 255, .10);
  border-left-color: var(--brand);
  color: #fff; font-weight: 500;
}
html[data-theme="dark"] .nav a.is-active { border-left-color: var(--brand); }
.nav__count {
  font-size: 11px; background: rgba(255, 255, 255, .13); color: #cfe4e0;
  border-radius: 999px; padding: 1px 7px; font-family: var(--font-mono);
}

.sidebar__foot {
  margin-top: 22px; padding: 16px 20px 0; border-top: 1px solid rgba(255, 255, 255, .12);
  font-size: 12px; color: #83aaa2; line-height: 1.7;
}
.sidebar__foot a { color: #a9d3cb; }

.main { min-width: 0; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 11px 26px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar__title { font-size: 15px; font-weight: 700; }
.topbar__spacer { flex: 1; }

.searchbtn {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: var(--surface); color: var(--muted); cursor: pointer;
  font-family: inherit; font-size: 13px; min-width: 210px;
}
.searchbtn:hover { border-color: var(--accent); color: var(--ink); }
.searchbtn kbd {
  margin-left: auto; font-family: var(--font-mono); font-size: 11px;
  background: var(--surface-3); border-radius: 4px; padding: 1px 5px; color: var(--faint);
}

.iconbtn {
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted);
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
}
.iconbtn:hover { border-color: var(--accent); color: var(--ink); }

.content { padding: 26px; max-width: var(--maxw); width: 100%; flex: 1; }

/* --------------------------------------------------------------------------
   通用元件
   -------------------------------------------------------------------------- */
.page-head { margin-bottom: 20px; }
.page-head h1 { font-size: 25px; letter-spacing: -.01em; }
.page-head p { color: var(--muted); margin: 7px 0 0; max-width: 76ch; font-size: 14px; }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-1);
}
.card__head {
  padding: 14px 18px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.card__head h2 { font-size: 15px; }
.card__head p { margin: 0; font-size: 12.5px; color: var(--faint); }
.card__body { padding: 18px; }
.card__body--flush { padding: 0; }

.grid { display: grid; gap: 16px; }
.grid--stats { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 15px 17px; box-shadow: var(--shadow-1);
}
.stat__label { font-size: 12px; color: var(--faint); display: block; }
.stat__value { font-size: 30px; font-weight: 700; line-height: 1.15; margin-top: 3px; letter-spacing: -.02em; }
.stat__note { font-size: 12px; color: var(--muted); margin-top: 3px; }
.stat--lead .stat__value { color: var(--brand); }
.stat--gap  .stat__value { color: var(--danger-fg); }
.stat--warn .stat__value { color: var(--warn-fg); }

/* 標籤 */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; line-height: 1.5; padding: 2px 8px; border-radius: 999px;
  background: var(--neutral-bg); color: var(--neutral-fg); white-space: nowrap;
}
.tag--lead   { background: var(--lead-bg);   color: var(--lead-fg); }
.tag--conf   { background: var(--conf-bg);   color: var(--conf-fg); }
.tag--talk   { background: var(--talk-bg);   color: var(--talk-fg); }
.tag--gap    { background: var(--gap-bg);    color: var(--gap-fg); font-weight: 600; }
.tag--ok     { background: var(--ok-bg);     color: var(--ok-fg); }
.tag--warn   { background: var(--warn-bg);   color: var(--warn-fg); }
.tag--danger { background: var(--danger-bg); color: var(--danger-fg); }
.tag--info   { background: var(--info-bg);   color: var(--info-fg); }
.tag--mono   { font-family: var(--font-mono); font-size: 11px; }

/* 表格 */
.tablewrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th, table.data td {
  text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top;
}
table.data thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-3); color: var(--muted);
  font-size: 11.5px; letter-spacing: .04em; font-weight: 600; white-space: nowrap;
}
table.data tbody tr:hover { background: var(--brand-tint); }
table.data td.num { text-align: right; font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
table.data .rowlink { font-weight: 600; color: var(--ink); }
table.data .rowlink:hover { color: var(--accent-deep); }
table.data .sub { display: block; color: var(--faint); font-size: 12px; margin-top: 1px; }

/* 篩選列 */
.filters {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.filters input[type="search"], .filters select {
  font-family: inherit; font-size: 13px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm); padding: 6px 10px;
}
.filters input[type="search"] { min-width: 220px; flex: 1 1 220px; max-width: 340px; }
.filters input:focus, .filters select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters__count { margin-left: auto; font-size: 12.5px; color: var(--faint); font-family: var(--font-mono); }

.chipbar { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font-family: inherit; font-size: 12.5px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted);
  border-radius: 999px; padding: 4px 11px;
}
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip.is-on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 500; }

/* 總藍圖矩陣 */
.blueprint { overflow-x: auto; }
table.matrix { border-collapse: separate; border-spacing: 3px; width: 100%; min-width: 1000px; }
table.matrix th, table.matrix td { vertical-align: top; }
table.matrix thead th {
  background: var(--surface-3); color: var(--muted); font-size: 12px; font-weight: 600;
  padding: 8px 9px; border-radius: var(--radius-sm); text-align: left; min-width: 120px;
}
table.matrix thead th small { display: block; font-weight: 400; color: var(--faint); font-size: 11px; }
table.matrix th.rowhead {
  background: var(--surface-3); font-size: 12.5px; font-weight: 600; color: var(--ink);
  padding: 8px 10px; border-radius: var(--radius-sm); text-align: left;
  width: 168px; min-width: 168px;
}
table.matrix th.rowhead small { display: block; font-weight: 400; color: var(--faint); font-size: 11px; }
.cell {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 5px; min-height: 40px; display: flex; flex-direction: column; gap: 3px;
}
.cell--empty { background: transparent; border-style: dashed; border-color: var(--line); }
.cell--empty::after { content: "—"; color: var(--faint); font-size: 12px; align-self: center; margin: auto; }
.cell a {
  display: block; font-size: 11.5px; line-height: 1.4; padding: 3px 6px; border-radius: 5px;
  text-decoration: none; color: inherit;
}
.cell a:hover { text-decoration: none; outline: 1px solid var(--accent); }
.cell a.s-lead { background: var(--lead-bg); color: var(--lead-fg); }
.cell a.s-conf { background: var(--conf-bg); color: var(--conf-fg); }
.cell a.s-talk { background: var(--talk-bg); color: var(--talk-fg); }
.cell a.s-gap  { background: var(--gap-bg);  color: var(--gap-fg); font-weight: 600; }
.cell a b { font-family: var(--font-mono); font-size: 10.5px; opacity: .8; font-weight: 500; }

.gaterow td {
  background: var(--surface-3); border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm); padding: 7px 8px; font-size: 11.5px; color: var(--muted);
}
.gaterow td strong { display: block; color: var(--ink); font-size: 11.5px; }

/* 甘特圖 */
.gantt { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 3px 10px; align-items: center; font-size: 13px; }
.gantt__label { padding: 5px 0; }
.gantt__label b { display: block; font-size: 13px; }
.gantt__label span { color: var(--faint); font-size: 11.5px; font-family: var(--font-mono); }
.gantt__track { position: relative; height: 22px; background: var(--surface-3); border-radius: 5px; }
.gantt__bar {
  position: absolute; top: 3px; bottom: 3px; border-radius: 4px;
  background: var(--brand); color: var(--on-brand);
  font-size: 10.5px; line-height: 16px; padding: 0 6px; overflow: hidden; white-space: nowrap;
}
.gantt__bar.g-G0, .gantt__bar.g-G1 { background: var(--accent); }
.gantt__bar.g-G2, .gantt__bar.g-G3 { background: var(--brand); }
.gantt__bar.g-G4 { background: #b8862b; }
.gantt__bar.g-G5 { background: #8b5cf6; }
.gantt__bar.g-G6 { background: #64748b; }
.gantt__scale { display: flex; font-size: 11px; color: var(--faint); font-family: var(--font-mono); }
.gantt__scale span { flex: 1; border-left: 1px solid var(--line); padding-left: 4px; }

/* 條狀分佈 */
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar { display: grid; grid-template-columns: 128px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar__track { display: block; height: 9px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.bar__fill { display: block; height: 100%; min-width: 2px; background: var(--brand); border-radius: 999px; }
.bar__val { text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

/* 明細頁 */
.detail { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.deflist { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 1px 14px; font-size: 13.5px; }
.deflist dt { color: var(--faint); font-size: 12.5px; padding: 6px 0; }
.deflist dd { margin: 0; padding: 6px 0; border-bottom: 1px solid var(--line); }
.deflist dt { border-bottom: 1px solid var(--line); }

.scorebar { display: flex; align-items: center; gap: 8px; }
.scorebar__track { display: block; flex: 1; height: 7px; background: var(--surface-3); border-radius: 999px; overflow: hidden; min-width: 44px; max-width: 150px; }
.scorebar__fill { display: block; height: 100%; min-width: 2px; border-radius: 999px; background: var(--brand); }
.scorebar__fill--ready { background: var(--accent); }
.scorebar b { font-family: var(--font-mono); font-size: 13px; }

.linklist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.linklist li { border-bottom: 1px solid var(--line); }
.linklist li:last-child { border-bottom: 0; }
.linklist a { display: block; padding: 9px 0; font-size: 13.5px; color: var(--ink); }
.linklist a:hover { color: var(--accent-deep); text-decoration: none; }
.linklist small { display: block; color: var(--faint); font-size: 12px; }

.quadrant { position: relative; height: 300px; background: var(--surface-2); border-radius: var(--radius-sm); border: 1px solid var(--line); }
.quadrant__axis { position: absolute; background: var(--line-strong); }
.quadrant__dot {
  position: absolute; width: 9px; height: 9px; border-radius: 50%; margin: -5px 0 0 -5px;
  border: 1.5px solid var(--surface); cursor: pointer;
}
.quadrant__label { position: absolute; font-size: 11px; color: var(--faint); }

.timeline { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 2px solid var(--line); }
.timeline li { position: relative; padding: 0 0 20px 16px; }
.timeline li::before {
  content: ""; position: absolute; left: -25px; top: 6px;
  width: 9px; height: 9px; border-radius: 50%; background: var(--brand);
  box-shadow: 0 0 0 3px var(--surface-2);
}
.timeline h3 { font-size: 14.5px; }
.timeline time { font-family: var(--font-mono); font-size: 12px; color: var(--faint); }
.timeline p { margin: 5px 0 0; font-size: 13.5px; color: var(--muted); }

.prose { max-width: 78ch; font-size: 14.5px; }
.prose h2 { font-size: 19px; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.prose h3 { font-size: 15.5px; margin: 22px 0 6px; }
.prose p { margin: 0 0 12px; color: var(--muted); }
.prose ul, .prose ol { margin: 0 0 12px; padding-left: 22px; color: var(--muted); }
.prose li { margin-bottom: 5px; }
.prose strong { color: var(--ink); }
.prose blockquote {
  margin: 0 0 14px; padding: 11px 15px; border-left: 3px solid var(--accent);
  background: var(--accent-tint); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--ink); font-size: 13.5px;
}

.callout {
  padding: 13px 16px; border-radius: var(--radius-sm); font-size: 13.5px;
  background: var(--info-bg); color: var(--info-fg); border: 1px solid transparent;
}
.callout--warn { background: var(--warn-bg); color: var(--warn-fg); }
.callout--gap  { background: var(--gap-bg);  color: var(--gap-fg); }
.callout strong { display: block; margin-bottom: 3px; }

.crumb { font-size: 12.5px; color: var(--faint); margin-bottom: 8px; }
.crumb a { color: var(--faint); }

.empty { padding: 40px 20px; text-align: center; color: var(--faint); font-size: 14px; }

/* 全站搜尋 */
.palette {
  position: fixed; inset: 0; z-index: 60; display: none;
  background: rgba(8, 24, 21, .5); backdrop-filter: blur(3px);
  padding: 9vh 16px 16px; justify-content: center; align-items: flex-start;
}
.palette.is-open { display: flex; }
.palette__box {
  width: min(680px, 100%); background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-3); overflow: hidden;
  display: flex; flex-direction: column; max-height: 74vh;
}
.palette__box input {
  border: 0; border-bottom: 1px solid var(--line); padding: 15px 18px;
  font-family: inherit; font-size: 15.5px; background: transparent; color: var(--ink);
}
.palette__box input:focus { outline: none; }
.palette__results { overflow-y: auto; padding: 6px; }
.palette__results a {
  display: flex; gap: 10px; align-items: baseline; padding: 8px 12px;
  border-radius: var(--radius-sm); color: var(--ink); text-decoration: none; font-size: 13.5px;
}
.palette__results a:hover, .palette__results a.is-sel { background: var(--brand-tint); text-decoration: none; }
.palette__results .kind {
  font-size: 10.5px; font-family: var(--font-mono); color: var(--faint);
  background: var(--surface-3); border-radius: 4px; padding: 1px 6px; flex: none;
}
.palette__results .hit { flex: 1; min-width: 0; }
.palette__results .hit b { display: block; font-weight: 500; }
.palette__results .hit small { color: var(--faint); font-size: 12px; display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette__foot { padding: 8px 16px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--faint); }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

/* --------------------------------------------------------------------------
   響應式
   -------------------------------------------------------------------------- */
@media (max-width: 1000px) {
  .detail { grid-template-columns: minmax(0, 1fr); }
}

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: static; height: auto; padding-bottom: 18px;
    max-height: none;
  }
  .nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .nav__group { grid-column: 1 / -1; }
  .sidebar__foot { grid-column: 1 / -1; }
  .content { padding: 18px 14px; }
  .searchbtn { min-width: 0; }
  .searchbtn span { display: none; }
  .deflist { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .deflist dt { border-bottom: 0; padding-bottom: 0; }
  .gantt { grid-template-columns: minmax(0, 1fr); }
}

@media print {
  .sidebar, .topbar, .filters, .palette { display: none !important; }
  .shell { grid-template-columns: 1fr; }
  .card { box-shadow: none; break-inside: avoid; }
  body { background: #fff; font-size: 11pt; }
}

const FILES = [

  'versions', 'portfolio'

/** 全域資料庫，載入後不再變動 */
const db = {};

/** 讀取所有 JSON 並建立交叉索引
 *
 *  兩種來源，優先用內嵌的：
 *    1. window.__VMH_DATA__ — 單檔版（tools/build_single_file.py 產生）把知識庫直接寫進 HTML，
 *       整站只有一個檔案，不需要伺服器也不需要維護資料夾結構。
 *    2. data/*.json — 一般版，資料與程式分開，方便逐檔比對修改歷程。
 */
async function load() {
  const embedded = typeof window !== 'undefined' ? window.__VMH_DATA__ : null;
  if (embedded) {
    FILES.forEach(name => { db[camel(name)] = embedded[name]; });
    buildIndexes();
    return db;
  }

  const results = await Promise.all(
    FILES.map(async name => {
      const res = await fetch(`data/${name}.json`, { cache: 'no-cache' });
      if (!res.ok) throw new Error(`讀取 data/${name}.json 失敗（HTTP ${res.status}）`);
      return [name, await res.json()];
    })
  );
  results.forEach(([name, payload]) => { db[camel(name)] = payload; });
  buildIndexes();
  return db;
}

function camel(name) {
  return name.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
}

/* --------------------------------------------------------------------------
   交叉索引 — 知識管理的價值在「連得起來」，不在「存得下來」
   -------------------------------------------------------------------------- */
function buildIndexes() {
  const idx = db.index = {
    capById:     new Map(),
    oppById:     new Map(),
    partnerById: new Map(),
    gateById:    new Map(),
    wpById:      new Map(),
    capsByOpp:   new Map(),   // OPP-xx → [能力]
    capsByPartner: new Map(), // P-xx   → [能力]
    capsByGate:  new Map(),   // 標準ID → [能力]
    risksByCap:  new Map(),   // CAP-xx → [風險]
    wpsByCap:    new Map(),   // CAP-xx → [工作包]
    dependents:  new Map()    // CAP-xx → [反向依賴的能力]
  };

  db.capabilities.forEach(c => idx.capById.set(c.id, c));
  db.opportunities.forEach(o => idx.oppById.set(o.id, o));
  db.partners.forEach(p => idx.partnerById.set(p.id, p));
  db.gates.forEach(g => idx.gateById.set(g.id, g));
  db.workpackages.forEach(w => idx.wpById.set(w.id, w));

  // 能力 ↔ 商機（多對多，來源是 16 能力商機矩陣）
  db.capabilities.forEach(cap => {
    const opps = db.capOpp[cap.id] || cap.opportunities || [];
    cap.opportunityIds = opps;
    opps.forEach(oid => push(idx.capsByOpp, oid, cap));
  });

  // 能力 ↔ 夥伴（候選夥伴欄的 "P-019 影像設備與PACS整合商"）
  db.capabilities.forEach(cap => {
    const pid = (cap.candidate || '').match(/P-\d+/);
    cap.partnerId = pid ? pid[0] : null;
    if (cap.partnerId) push(idx.capsByPartner, cap.partnerId, cap);
  });

  // 能力 ↔ 法規門檻
  db.capabilities.forEach(cap => {
    (cap.gates || []).forEach(gid => push(idx.capsByGate, gid, cap));
  });

  // 能力 ↔ 風險（08 的「關聯項目」欄）
  db.risks.forEach(risk => {
    (risk.links || []).forEach(link => {
      const m = String(link).match(/CAP-\d+/);
      if (m) push(idx.risksByCap, m[0], risk);
    });
  });

  // 能力 ↔ 工作包（06 的「對應能力 CAPs」可能寫成 "CAP-027 to CAP-032"）
  db.workpackages.forEach(wp => {
    wp.capIds = expandCapRange(wp.caps);
    wp.capIds.forEach(cid => push(idx.wpsByCap, cid, wp));
  });

  // 反向依賴：誰在等我
  db.capabilities.forEach(cap => {
    (cap.depends || []).forEach(dep => push(idx.dependents, dep, cap));
  });

  // 夥伴補上「被指名幾項能力」
  db.partners.forEach(p => {
    const caps = idx.capsByPartner.get(p.id) || [];
    p.capCount = caps.length;
    p.gapCount = caps.filter(c => c.puzzle === '缺口-待尋找').length;
    p.goCount  = caps.filter(c => c.decision === '立即推進 Go').length;
  });

  // 商機補上實際對應的能力統計（以矩陣為準，不依賴 Excel 的快照值）
  db.opportunities.forEach(o => {
    const caps = idx.capsByOpp.get(o.id) || [];
    o.caps = caps;
    o.gapCaps = caps.filter(c => c.puzzle === '缺口-待尋找');
  });

  // 商機清單補回完整商機物件
  db.pipeline.forEach(row => { row.opp = idx.oppById.get(row.oppId) || null; });
}

function push(map, key, value) {
  if (!map.has(key)) map.set(key, []);
  map.get(key).push(value);
}

/** 把 "CAP-027 to CAP-032" / "CAP-001; CAP-002" 展開成完整清單 */
function expandCapRange(text) {
  if (!text) return [];
  const out = new Set();
  String(text).split(/[;；]/).forEach(part => {
    const range = part.match(/CAP-(\d+)\s*(?:to|–|-|~|至)\s*CAP-(\d+)/i);
    if (range) {
      const [from, to] = [Number(range[1]), Number(range[2])];
      for (let n = from; n <= to; n++) out.add(`CAP-${String(n).padStart(3, '0')}`);
      return;
    }
    (part.match(/CAP-\d+/g) || []).forEach(id => out.add(id));
  });
  return [...out].filter(id => db.index.capById.has(id));
}

/* --------------------------------------------------------------------------
   統計 — 儀表板與總藍圖共用
   -------------------------------------------------------------------------- */
function stats() {
  const caps = db.capabilities;
  const byPuzzle = {};
  PUZZLE_ORDER.forEach(k => { byPuzzle[k] = caps.filter(c => c.puzzle === k).length; });

  const mandatoryGates = db.gates.filter(g => g.level === '強制');
  const highRisks = db.risks.filter(r => (r.score || 0) >= 12);

  return {
    capTotal:      caps.length,
    byPuzzle,
    gaps:          caps.filter(c => c.puzzle === '缺口-待尋找'),
    go:            caps.filter(c => c.decision === '立即推進 Go').length,
    prepare:       caps.filter(c => c.decision === '先補條件 Prepare').length,
    quickWin:      caps.filter(c => c.decision === '快速小案 Quick-win').length,
    backlog:       caps.filter(c => c.decision === '儲備觀察 Backlog').length,
    mandatory:     mandatoryGates.length,
    mandatoryOpen: mandatoryGates.filter(g => g.status === '待確認').length,
    highRisks,
    oppTotal:      db.opportunities.length,
    oppWhitespace: db.opportunities.filter(o => (o.vnMaturity || '').startsWith('③')).length,
    oppBlank:      db.opportunities.filter(o => (o.position || '').startsWith('★')).length,
    partnerTotal:  db.partners.length,
    partnerGaps:   db.partners.filter(p => (p.status || '').includes('缺口')).length,
    pipelineTotal: db.pipeline.length
  };
}

/** 總藍圖：領域 × 階段的每一格 */
function blueprintCell(domainId, stageId) {
  return db.capabilities.filter(
    c => (c.domain || '').startsWith(domainId) && c.stage === stageId
  );
}

/** 某階段適用、且尚未確認的強制法規 */
function gatesForStage(stageId) {
  return db.gates.filter(g => (g.stages || []).includes(stageId));
}

/** 拼圖狀態的顯示資訊，找不到就給中性樣式 */
function puzzleMeta(name) {
  return PUZZLE[name] || { key: 'none', symbol: '·', label: name || '未標記', note: '' };
}

function domainMeta(domainText) {
  const id = (domainText || '').slice(0, 3);
  return DOMAINS.find(d => d.id === id) || { id, short: domainText || '—', full: domainText || '—' };
}


/* ===== ui.js ===== */
/* ==========================================================================
   ui.js — 共用的畫面零件
   純函式：吃資料、吐 HTML 字串。不碰 DOM、不管路由。
   ========================================================================== */

/** 一律經過這裡輸出，避免資料裡的角括號破壞版面 */
function esc(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function dash(value) {
  return value === null || value === undefined || value === '' ? '<span style="color:var(--faint)">—</span>' : esc(value);
}

/** 拼圖狀態標籤：● ◆ ◐ ○ */
function puzzleTag(name) {
  const meta = puzzleMeta(name);
  return `<span class="tag tag--${meta.key}" title="${esc(meta.note)}">${meta.symbol} ${esc(meta.label)}</span>`;
}

/** 商業判斷標籤 */
function decisionTag(decision) {
  const map = {
    '立即推進 Go':      'ok',
    '快速小案 Quick-win': 'info',
    '先補條件 Prepare': 'warn',
    '儲備觀察 Backlog': 'neutral',
    '暫緩 Hold':        'danger'
  };
  const kind = map[decision] || 'neutral';
  return decision ? `<span class="tag tag--${kind}">${esc(decision)}</span>` : '';
}

/** 風險等級 / 法規狀態之類的通用狀態標籤 */
function statusTag(text, kind = 'neutral') {
  return text ? `<span class="tag tag--${kind}">${esc(text)}</span>` : '';
}

function riskTag(level) {
  const map = { '極高': 'danger', '高': 'warn', '中': 'info', '低': 'ok' };
  return statusTag(level, map[level] || 'neutral');
}

function gateTag(status) {
  const map = { '待確認': 'warn', '通過': 'ok', '不適用': 'neutral', '未通過': 'danger' };
  return statusTag(status, map[status] || 'neutral');
}

function levelTag(level) {
  const map = { '強制': 'danger', '契約': 'warn', '設計': 'info', '參考': 'neutral', '供應商': 'info', '依用途': 'neutral' };
  return statusTag(level, map[level] || 'neutral');
}

/** 越南現況：③ 尚未出現＝主動出擊的空間 */
function maturityTag(text) {
  if (!text) return '';
  const kind = text.startsWith('③') ? 'ok' : text.startsWith('②') ? 'info' : 'neutral';
  return `<span class="tag tag--${kind}">${esc(text)}</span>`;
}

/** 0–5 分的橫條，價值用主色、準備用強調色 */
function scoreBar(value, variant = '') {
  if (value === null || value === undefined) return '<span style="color:var(--faint)">—</span>';
  const pct = Math.max(0, Math.min(100, (Number(value) / 5) * 100));
  const cls = variant === 'ready' ? ' scorebar__fill--ready' : '';
  return `<span class="scorebar">
    <span class="scorebar__track"><span class="scorebar__fill${cls}" style="width:${pct}%"></span></span>
    <b>${Number(value).toFixed(1)}</b>
  </span>`;
}

/** 統計磚 */
function stat({ label, value, note, variant }) {
  return `<div class="stat${variant ? ` stat--${variant}` : ''}">
    <span class="stat__label">${esc(label)}</span>
    <div class="stat__value">${esc(value)}</div>
    ${note ? `<div class="stat__note">${note}</div>` : ''}
  </div>`;
}

/** 卡片外框 */
function card({ title, note, body, actions = '', flush = false }) {
  return `<section class="card">
    ${title ? `<div class="card__head">
      <h2>${esc(title)}</h2>
      ${note ? `<p>${esc(note)}</p>` : ''}
      ${actions ? `<div style="margin-left:auto">${actions}</div>` : ''}
    </div>` : ''}
    <div class="card__body${flush ? ' card__body--flush' : ''}">${body}</div>
  </section>`;
}

/** 排行條圖 */
function barList(items, { max } = {}) {
  const top = max || Math.max(1, ...items.map(i => i.value));
  return `<div class="bars">${items.map(item => `
    <div class="bar">
      <span>${item.href ? `<a href="${item.href}">${esc(item.label)}</a>` : esc(item.label)}</span>
      <span class="bar__track"><span class="bar__fill" style="width:${(item.value / top) * 100}%${item.color ? `;background:${item.color}` : ''}"></span></span>
      <span class="bar__val">${esc(item.value)}</span>
    </div>`).join('')}</div>`;
}

/** 麵包屑 */
function crumb(trail) {
  return `<nav class="crumb">${trail.map((t, i) =>
    (i ? ' › ' : '') + (t.href ? `<a href="${t.href}">${esc(t.label)}</a>` : esc(t.label))
  ).join('')}</nav>`;
}

/** 空狀態 */
function empty(message) {
  return `<div class="empty">${esc(message)}</div>`;
}

/** 表格：columns = [{ key, label, className, render }] */
function table(rows, columns, { emptyText = '沒有符合條件的資料' } = {}) {
  if (!rows.length) return empty(emptyText);
  const head = columns.map(c => `<th${c.className ? ` class="${c.className}"` : ''}>${esc(c.label)}</th>`).join('');
  const body = rows.map(row => `<tr>${columns.map(c => {
    const value = c.render ? c.render(row) : dash(row[c.key]);
    return `<td${c.className ? ` class="${c.className}"` : ''}>${value}</td>`;
  }).join('')}</tr>`).join('');
  return `<div class="tablewrap"><table class="data">
    <thead><tr>${head}</tr></thead><tbody>${body}</tbody>
  </table></div>`;
}

/** 定義清單 — 明細頁的體檢表 */
function defList(pairs) {
  const rows = pairs.filter(Boolean).map(([term, value]) =>
    `<dt>${esc(term)}</dt><dd>${value === '' || value === null || value === undefined ? dash(null) : value}</dd>`
  ).join('');
  return `<dl class="deflist">${rows}</dl>`;
}

/** 側欄的關聯清單 */
function linkList(items) {
  if (!items.length) return `<p style="color:var(--faint);font-size:13px;margin:0">目前沒有關聯項目。</p>`;
  return `<ul class="linklist">${items.map(i => `<li>
    <a href="${i.href}">${esc(i.label)}${i.note ? `<small>${esc(i.note)}</small>` : ''}</a>
  </li>`).join('')}</ul>`;
}

/** 能力卡連結（列表與矩陣共用） */
function capLink(cap) {
  return `<a href="#/cap/${cap.id}" class="rowlink">${esc(cap.name)}</a>`;
}

function fmtMoney(value) {
  if (value === null || value === undefined || value === '') return dash(null);
  const n = Number(value);
  if (Number.isNaN(n)) return esc(value);
  return `US$ ${n.toLocaleString('en-US')}`;
}

/* --------------------------------------------------------------------------

function filterBar(controls) {
  return `<div class="filters">
    ${controls.map(c => {
      if (c.type === 'search') {
        return `<input type="search" id="${c.id}" placeholder="${esc(c.placeholder)}" aria-label="${esc(c.placeholder)}">`;
      }
      return `<select id="${c.id}" aria-label="${esc(c.label)}">
        <option value="">${esc(c.label)}：全部</option>
        ${c.options.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('')}
      </select>`;
    }).join('')}
    <span class="filters__count" id="filterCount"></span>
  </div>`;
}

/** 把篩選列接起來：每次變動就重新畫表格 */
function wireFilters(controlIds, render) {
  const inputs = controlIds.map(id => document.getElementById(id)).filter(Boolean);
  const target = document.getElementById('filterTarget');
  const counter = document.getElementById('filterCount');

  const apply = () => {
    const values = {};
    inputs.forEach(el => { values[el.id] = el.value.trim(); });
    const { html, count, total } = render(values);
    target.innerHTML = html;
    if (counter) counter.textContent = count === total ? `共 ${total} 筆` : `${count} / ${total} 筆`;
  };

  inputs.forEach(el => {
    el.addEventListener(el.type === 'search' ? 'input' : 'change', apply);
  });
  apply();
}

function uniq(list) {
  return [...new Set(list.filter(Boolean))].sort();
}

function matches(haystack, needle) {
  if (!needle) return true;
  return haystack.toLowerCase().includes(needle.toLowerCase());
}

/* --------------------------------------------------------------------------
   總藍圖
   -------------------------------------------------------------------------- */
function blueprint() {
  const s = stats();

  const gateCells = STAGES.map(st => {
    const applicable = gatesForStage(st.id);
    const mandatory = applicable.filter(g => g.level === '強制');
    const open = mandatory.filter(g => g.status === '待確認');

    return `<td>
      <strong>${esc(names)}</strong>
      ${open.length ? `<span style="color:var(--danger-fg)">未確認 ${open.length} 項</span>` : '<span>強制法規均已確認</span>'}
    </td>`;
  }).join('');

  const bodyRows = DOMAINS.map(d => {
    const gapCount = db.capabilities.filter(c => (c.domain || '').startsWith(d.id) && c.puzzle === '缺口-待尋找').length;
    const cells = STAGES.map(st => {
      const caps = blueprintCell(d.id, st.id);
      if (!caps.length) return `<td><div class="cell cell--empty"></div></td>`;
      const links = caps.map(c => {
        const m = puzzleMeta(c.puzzle);
        return `<a href="#/cap/${c.id}" class="s-${m.key}" title="${esc(c.puzzle)}｜${esc(c.outcome || '')}">
          ${m.symbol} <b>${esc(c.id.replace('CAP-', ''))}</b> ${esc(c.name)}
        </a>`;
      }).join('');
      return `<td><div class="cell">${links}</div></td>`;
    }).join('');
    return `<tr>
      <th class="rowhead">
        <a href="#/caps?domain=${d.id}" style="color:inherit">${esc(d.full)}</a>
        <small>${gapCount ? `○ 缺口 ${gapCount} 項` : '無缺口'}</small>
      </th>
      ${cells}
    </tr>`;
  }).join('');

  const legend = PUZZLE_ORDER.map(name => {
    const m = puzzleMeta(name);
    return `<span class="tag tag--${m.key}">${m.symbol} ${esc(m.label)} ${s.byPuzzle[name]}</span>`;
  }).join(' ');

  return {
    title: '總藍圖',
    html: `
      <div class="page-head">
        <h1>01 總藍圖</h1>
        <p>橫軸走時間（A 軸 Stage-Gate），縱軸看領域（C 軸能力模組），最上面那一列是每個階段的法規門檻（B 軸）。
        三軸交會的每一格＝某個領域在某個階段的具體商機。<strong>紅色就是還沒有人的空白。</strong></p>
      </div>

      <div class="card" style="margin-bottom:16px">
        <div class="card__head"><h2>看圖三步</h2><p>① 找到你的領域列　② 看你在哪個階段有東西　③ ○ 紅色＝目前沒有人，就是機會</p></div>
        <div class="card__body"><div class="chipbar">${legend}</div></div>
      </div>

      <section class="card">
        <div class="card__body card__body--flush">
          <div class="blueprint" style="padding:14px">
            <table class="matrix">
              <thead>
                <tr>
                  <th class="rowhead">Y軸＝C 能力模組 ↓</th>
                  ${STAGES.map(st => `<th>${st.id} ${esc(st.name)}<small>${esc(st.months)}（示意）</small></th>`).join('')}
                </tr>
              </thead>
              <tbody>
                <tr class="gaterow">
                  <th class="rowhead">B軸 法規門檻<small>Gate checklist</small></th>
                  ${gateCells}
                </tr>
                ${bodyRows}
              </tbody>
            </table>
          </div>
        </div>
      </section>
    `
  };
}

function capabilities(params) {
  const all = db.capabilities;

    { type: 'search', id: 'fq', placeholder: '搜尋能力、成果、缺什麼…' },
    { type: 'select', id: 'fdomain',   label: '領域',     options: DOMAINS.map(d => d.full) },
    { type: 'select', id: 'fstage',    label: '階段',     options: STAGES.map(s => s.id) },
    { type: 'select', id: 'fpuzzle',   label: '拼圖狀態', options: PUZZLE_ORDER },
    { type: 'select', id: 'fdecision', label: '商業判斷', options: uniq(all.map(c => c.decision)) }
  ];

  const columns = [
    { key: 'id', label: '能力項目', render: c => `<a href="#/cap/${c.id}" class="rowlink">${esc(c.name)}</a><span class="sub">${esc(c.id)}　${esc(c.nameEn || '')}</span>` },
    { key: 'domain', label: '領域', render: c => `${esc(domainMeta(c.domain).short)}` },
    { key: 'stage', label: '階段', render: c => `<span class="tag tag--mono">${esc(c.stage)}</span>` },
    { key: 'puzzle', label: '拼圖狀態', render: c => puzzleTag(c.puzzle) },
    { key: 'candidate', label: '候選夥伴', render: c => c.partnerId
        ? `<a href="#/partner/${c.partnerId}">${esc(c.candidate)}</a>`
        : dash(c.candidate) },
    { key: 'value', label: '價值', className: 'num', render: c => scoreBar(c.value) },
    { key: 'ready', label: '準備', className: 'num', render: c => scoreBar(c.ready, 'ready') },
    { key: 'decision', label: '商業判斷', render: c => decisionTag(c.decision) }
  ];

  return {
    title: '能力總表',
    html: `
      <div class="page-head">
        <h1>03 能力總表</h1>
        <p>C 軸的 ${all.length} 項能力，是整套工具唯一的資料源：能做什麼／缺什麼／誰能做／值多少／多成熟。
        點任一列可以看到它的完整體檢表與所有關聯。</p>
      </div>
      <section class="card">
        ${filterBar(controls)}
        <div class="card__body card__body--flush" id="filterTarget"></div>
      </section>
    `,
    mount() {
      if (params.domain) {
        const d = DOMAINS.find(x => x.id === params.domain);
        if (d) document.getElementById('fdomain').value = d.full;
      }
      if (params.stage)  document.getElementById('fstage').value = params.stage;
      if (params.puzzle) document.getElementById('fpuzzle').value = params.puzzle;

      wireFilters(controls.map(c => c.id), values => {
        const rows = all.filter(c =>
          matches([c.id, c.name, c.nameEn, c.outcome, c.gapNext, c.deliverable, c.lead, c.candidate].join(' '), values.fq) &&
          (!values.fdomain   || c.domain === values.fdomain) &&
          (!values.fstage    || c.stage === values.fstage) &&
          (!values.fpuzzle   || c.puzzle === values.fpuzzle) &&
          (!values.fdecision || c.decision === values.fdecision)
        );
        return { html: table(rows, columns), count: rows.length, total: all.length };
      });
    }
  };
}

function capability(id) {

  const opps = (cap.opportunityIds || []).map(oid => db.index.oppById.get(oid)).filter(Boolean);

  const risks = db.index.risksByCap.get(cap.id) || [];
  const wps = db.index.wpsByCap.get(cap.id) || [];

      ${isGap ? `<div class="callout callout--gap" style="margin-bottom:16px">

      <div class="detail">
        <div style="display:grid;gap:16px">
          ${card({
            title: '體檢表',
            note: '值不值得做、缺什麼、誰負責',
            body: defList([
              ['預期成果', esc(cap.outcome)],
              ['業務線', dash(cap.bizLine)],
              ['主責角色', dash(cap.lead)],
              ['候選夥伴', partner ? `<a href="#/partner/${partner.id}">${esc(cap.candidate)}</a>` : dash(cap.candidate)],
              ['缺什麼／下一步', dash(cap.gapNext)],
              ['主要交付物', dash(cap.deliverable)],
              ['價值分', `${scoreBar(cap.value)} <span style="color:var(--faint);font-size:12px">政府 ${dash(cap.valueGov)}｜臨床 ${dash(cap.valueClinical)}｜商業 ${dash(cap.valueBusiness)}</span>`],
              ['準備分', `${scoreBar(cap.ready, 'ready')} <span style="color:var(--faint);font-size:12px">法規 ${dash(cap.readyReg)}｜夥伴 ${dash(cap.readyPartner)}｜資金 ${dash(cap.readyFunding)}</span>`],
              ['商業判斷', decisionTag(cap.decision)],
              ['證據／來源', dash(cap.evidence)],
              ['證據成熟度', cap.evidenceLevel

              ['資料／系統依賴', dash(cap.dataDeps)],

          ${card({

              { key: 'id', label: '代號', render: g => `<a href="#/gates" class="rowlink">${esc(g.id)}</a>` },
              { key: 'title', label: '要求／標準' },

        <div style="display:grid;gap:16px">

            title: `所屬商機（${opps.length}）`,
            note: '同一項能力可以同時卡進好幾門生意',
            body: linkList(opps.map(o => ({

              label: `${o.id} ${o.name}`,

function opportunities(params) {

    { key: 'rank', label: '順位', className: 'num', render: o => o.rank ? `<b>${o.rank}</b>` : '<span style="color:var(--faint)">—</span>' },

    { key: 'vnMaturity', label: '越南現況', render: o => maturityTag(o.vnMaturity) },
    { key: 'position', label: '聯盟能力對應', render: o => {
        const p = o.position || '';
        const kind = p.startsWith('★') ? 'danger' : p.startsWith('有缺口') ? 'warn' : 'ok';
        return statusTag(p, kind);
      } },
    { key: 'capCount', label: 'CAP', className: 'num', render: o => o.caps.length },
    { key: 'avgValue', label: '價值', className: 'num', render: o => o.avgValue ? scoreBar(o.avgValue) : '—' },
    { key: 'amountTier', label: '金額級距' },
    { key: 'txnMode', label: '交易模式' }
  ];

  const families = uniq(all.map(o => o.family));
  const familyBars = barList(families.map(f => ({
    label: f, value: all.filter(o => o.family === f).length
  })));

  return {
    title: '商機字典',
    html: `
      <div class="page-head">
        <h1>15 商機字典</h1>
        <p>越南醫院市場被拆成 ${all.length} 門可以獨立談的生意，分成 A~J 十個族群。每一門都寫清楚
        <strong>在賣什麼、誰付錢、大概多少錢、越南現況</strong>。標 ③ 尚未出現的，代表越南目前幾乎沒人在做 —— 先進場的人定規則。</p>
      </div>

      <div class="grid grid--stats" style="margin-bottom:16px">
        ${stat({ label: '商機總數', value: all.length })}
        ${stat({ label: '③ 越南幾乎空白', value: all.filter(o => (o.vnMaturity || '').startsWith('③')).length, note: '主動出擊的空間' })}
        ${stat({ label: '★ 白地商機', value: all.filter(o => (o.position || '').startsWith('★')).length, note: '聯盟目前無對應能力，是招募英雄帖', variant: 'gap' })}
        ${stat({ label: '有缺口可招募', value: all.filter(o => (o.position || '').startsWith('有缺口')).length })}
      </div>

      ${card({ title: '族群分佈', body: familyBars })}

      <section class="card" style="margin-top:16px">
        ${filterBar(controls)}
        <div class="card__body card__body--flush" id="filterTarget"></div>
      </section>
    `,
    mount() {
      if (params.family)   document.getElementById('ffamily').value = params.family;
      if (params.maturity) document.getElementById('fmaturity').value = params.maturity;

      wireFilters(controls.map(c => c.id), values => {
        const rows = all.filter(o =>
          matches([o.id, o.name, o.nameEn, o.whatWeSell, o.vnNotes, o.competitors, o.ourAngle].join(' '), values.fq) &&
          (!values.ffamily   || o.family === values.ffamily) &&
          (!values.fmaturity || o.vnMaturity === values.fmaturity) &&
          (!values.fposition || o.position === values.fposition) &&
          (!values.ftier     || o.amountTier === values.ftier)
        ).sort((a, b) => (a.rank || 999) - (b.rank || 999));
        return { html: table(rows, columns), count: rows.length, total: all.length };
      });
    }
  };
}

function opportunity(id) {

  const gateIds = uniq(caps.flatMap(c => c.gates || []));

  const partners = uniq(caps.map(c => c.partnerId).filter(Boolean))
    .map(pid => db.index.partnerById.get(pid)).filter(Boolean);
  const pipelineRow = db.pipeline.find(p => p.oppId === opp.id);

        <strong>斷點：這門生意需要的 ${gapCaps.length} 項能力目前沒有人。</strong>
        ${gapCaps.map(c => `<a href="#/cap/${c.id}" style="color:inherit;text-decoration:underline">${esc(c.id)} ${esc(c.name)}</a>`).join('、')}

              { key: 'puzzle', label: '誰在做', render: c => puzzleTag(c.puzzle) },
              { key: 'candidate', label: '候選夥伴', render: c => c.partnerId ? `<a href="#/partner/${c.partnerId}">${esc(c.candidate)}</a>` : dash(c.candidate) },

function roadmap() {
  const wps = db.workpackages;
  const horizon = Math.max(60, ...wps.map(w => w.endMonth || 0));

  const bars = wps.map(w => {
    const start = ((w.startMonth - 1) / horizon) * 100;
    const width = ((w.months || 1) / horizon) * 100;
    return `
      <div class="gantt__label">
        <b><a href="#/wp/${w.id}" style="color:inherit">${esc(w.id)} ${esc(w.name)}</a></b>
        <span>${esc(w.stage)}｜M${w.startMonth}–M${w.endMonth}｜${esc(w.lead || '')}</span>
      </div>
      <div class="gantt__track">
        <div class="gantt__bar g-${esc(w.stage)}" style="left:${start}%;width:${width}%" title="${esc(w.acceptance || '')}">
          ${w.months} 個月
        </div>
      </div>`;
  }).join('');

  const scale = `<div class="gantt__label"></div><div class="gantt__scale">
    ${[0, 12, 24, 36, 48].map(m => `<span>M${m || 1}</span>`).join('')}
  </div>`;

  return {
    title: '行動路線',
    html: `
      <div class="page-head">
        <h1>06 行動路線</h1>
        <p>A 軸的執行版：${wps.length} 個工作包＝可簽約、可驗收的行動單位，橫跨 60 個月。
        每個工作包都必須通過對應階段的法規門檻才能過關。<strong>時程為工具內建示意值，正式授權後以實際專案起始日重設。</strong></p>
      </div>

      ${card({
        title: '60 個月整合路線圖',
        note: '顏色代表階段：G0–G1 授權評估 · G2–G3 規劃採購 · G4 建置 · G5 開院 · G6 複製',
        body: `<div class="gantt">${scale}${bars}</div>`
      })}

      <div style="margin-top:16px">
        ${card({
          title: '工作包明細',
          flush: true,
          body: table(wps, [
            { key: 'id', label: 'WP', render: w => `<a href="#/wp/${w.id}" class="rowlink">${esc(w.id)}</a>` },
            { key: 'name', label: '工作包', render: w => `<a href="#/wp/${w.id}" class="rowlink">${esc(w.name)}</a><span class="sub">${esc(w.stage)}</span>` },
            { key: 'lead', label: '主責' },
            { key: 'startMonth', label: '起月', className: 'num', render: w => `M${w.startMonth}` },
            { key: 'months', label: '月數', className: 'num' },
            { key: 'acceptance', label: '驗收門檻' },
            { key: 'status', label: '狀態', render: w => statusTag(w.status, w.status === '已完成' ? 'ok' : w.status === '進行中' ? 'info' : 'neutral') },
            { key: 'capIds', label: '對應能力', className: 'num', render: w => w.capIds.length }
          ])
        })}
      </div>
    `
  };
}

/* ==========================================================================
   search.js — 全站搜尋（⌘K / Ctrl+K）
   知識管理系統與試算表最大的差別之一：一個搜尋框打穿所有分頁。
   ========================================================================== */


let corpus = [];

/** 把所有實體攤平成一份可搜尋的索引 */
function buildCorpus() {
  corpus = [];

  db.capabilities.forEach(c => corpus.push({
    kind: '能力', href: `#/cap/${c.id}`,
    title: `${c.id} ${c.name}`,
    sub: `${c.domain || ''}｜${c.stage || ''}｜${c.puzzle || ''}`,
    text: [c.id, c.name, c.nameEn, c.outcome, c.gapNext, c.deliverable, c.lead,
           c.candidate, c.domain, c.stage, c.puzzle, c.decision, c.bizLine].join(' ')
  }));

  db.opportunities.forEach(o => corpus.push({
    kind: '商機', href: `#/opp/${o.id}`,
    title: `${o.id} ${o.name}`,
    sub: `${o.family || ''}｜${o.vnMaturity || ''}`,
    text: [o.id, o.name, o.nameEn, o.family, o.whatWeSell, o.vnNotes,
           o.competitors, o.ourAngle, o.payer, o.txnMode, o.amountTier].join(' ')
  }));

  db.partners.forEach(p => corpus.push({
    kind: '夥伴', href: `#/partner/${p.id}`,
    title: `${p.id} ${p.name}`,
    sub: `${p.type || ''}｜${p.country || ''}｜${p.status || ''}`,
    text: [p.id, p.name, p.nameEn, p.type, p.country, p.role, p.nextAction, p.status].join(' ')
  }));

  db.gates.forEach(g => corpus.push({
    kind: '門檻', href: `#/gates`,
    title: `${g.id} ${g.title}`,
    sub: `${g.level || ''}｜${g.status || ''}｜${g.authority || ''}`,
    text: [g.id, g.title, g.authority, g.category, g.note, g.owner].join(' ')
  }));

  db.workpackages.forEach(w => corpus.push({
    kind: '工作包', href: `#/wp/${w.id}`,
    title: `${w.id} ${w.name}`,
    sub: `${w.stage || ''}｜M${w.startMonth}–M${w.endMonth}｜${w.lead || ''}`,
    text: [w.id, w.name, w.lead, w.acceptance, w.caps, (w.partners || []).join(' ')].join(' ')
  }));

  db.risks.forEach(r => corpus.push({
    kind: '風險', href: `#/risks`,
    title: `${r.id} ${r.statement || ''}`,
    sub: `${r.level || ''}｜${r.category || ''}｜${r.owner || ''}`,
    text: [r.id, r.statement, r.category, r.mitigation, r.owner, r.trigger].join(' ')
  }));

  db.kpis.forEach(k => corpus.push({
    kind: 'KPI', href: `#/kpis`,
    title: `${k.id} ${k.name || ''}`,
    sub: `${k.perspective || ''}｜${k.owner || ''}`,
    text: [k.id, k.name, k.perspective, k.formula, k.owner, k.dataSource].join(' ')
  }));

  db.decisions.forEach(d => corpus.push({
    kind: '決策', href: `#/history`,
    title: `${d.id} ${d.topic || ''}`,
    sub: `${d.date || ''}｜${d.by || ''}`,
    text: [d.id, d.topic, d.decision, d.by].join(' ')
  }));

  db.sources.forEach(s => corpus.push({
    kind: '來源', href: `#/history`,
    title: `${s.id} ${s.title || ''}`,
    sub: `${s.org || ''}｜${s.checked || ''}`,
    text: [s.id, s.title, s.org, s.purpose, s.note].join(' ')
  }));

  corpus.forEach(entry => { entry.haystack = entry.text.toLowerCase(); });
  return corpus;
}

/** 逐字比對；標題命中的排前面 */
function query(term, limit = 24) {
  const needle = term.trim().toLowerCase();
  if (!needle) return [];
  const words = needle.split(/\s+/);

  return corpus
    .map(entry => {
      if (!words.every(w => entry.haystack.includes(w))) return null;
      const inTitle = entry.title.toLowerCase().includes(needle);
      const atStart = entry.title.toLowerCase().startsWith(needle);
      return { entry, score: (atStart ? 100 : 0) + (inTitle ? 50 : 0) };
    })
    .filter(Boolean)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit)
    .map(r => r.entry);
}

/* --------------------------------------------------------------------------
   搜尋面板
   -------------------------------------------------------------------------- */
function initPalette() {
  const panel = document.getElementById('palette');
  const input = document.getElementById('paletteInput');
  const results = document.getElementById('paletteResults');
  let selected = 0;

  function open() {
    panel.classList.add('is-open');
    input.value = '';
    render([]);
    input.focus();
  }

  function close() {
    panel.classList.remove('is-open');
  }

  function render(items) {
    selected = 0;
    if (!items.length) {
      results.innerHTML = input.value.trim()
        ? `<div class="empty">沒有找到符合的項目</div>`
        : `<div class="empty">輸入關鍵字搜尋能力、商機、夥伴、法規、風險、工作包、決策與來源</div>`;
      return;
    }
    results.innerHTML = items.map((item, i) => `
      <a href="${item.href}" class="${i === 0 ? 'is-sel' : ''}" data-i="${i}">
        <span class="kind">${esc(item.kind)}</span>
        <span class="hit"><b>${esc(item.title)}</b><small>${esc(item.sub)}</small></span>
      </a>`).join('');
  }

  function move(step) {
    const links = [...results.querySelectorAll('a')];
    if (!links.length) return;
    links[selected]?.classList.remove('is-sel');
    selected = (selected + step + links.length) % links.length;
    links[selected].classList.add('is-sel');
    links[selected].scrollIntoView({ block: 'nearest' });
  }

  input.addEventListener('input', () => render(query(input.value)));

  input.addEventListener('keydown', event => {
    if (event.key === 'ArrowDown') { event.preventDefault(); move(1); }
    else if (event.key === 'ArrowUp') { event.preventDefault(); move(-1); }
    else if (event.key === 'Enter') {
      event.preventDefault();
      results.querySelectorAll('a')[selected]?.click();
    } else if (event.key === 'Escape') close();
  });

  results.addEventListener('click', event => {
    if (event.target.closest('a')) close();
  });

  panel.addEventListener('click', event => {
    if (event.target === panel) close();
  });

  document.getElementById('searchBtn').addEventListener('click', open);

  document.addEventListener('keydown', event => {
    if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      panel.classList.contains('is-open') ? close() : open();
    } else if (event.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      event.preventDefault();
      open();
    }
  });
}


/* ===== app.js ===== */
/* ==========================================================================
   app.js — 啟動、路由、導覽
   路由用 hash：#/cap/CAP-028 這種網址可以直接貼給夥伴，
   對方打開看到的永遠是最新版——這就是它取代「LINE 傳檔」的地方。
   ========================================================================== */




/* --------------------------------------------------------------------------
   主題（跟隨系統，可手動切換並記住）
   -------------------------------------------------------------------------- */
const THEME_KEY = 'vmh-theme';

function applyTheme(theme) {
  if (theme === 'light' || theme === 'dark') {
    document.documentElement.setAttribute('data-theme', theme);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
  const btn = document.getElementById('themeBtn');
  if (btn) {
    const isDark = theme === 'dark' ||
      (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
    btn.textContent = isDark ? '☀' : '☾';
    btn.title = isDark ? '切換為淺色' : '切換為深色';
  }
}

function initTheme() {
  applyTheme(localStorage.getItem(THEME_KEY) || '');
  document.getElementById('themeBtn').addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const isDark = current === 'dark' ||
      (!current && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const next = isDark ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });
}

/* --------------------------------------------------------------------------
   導覽
   -------------------------------------------------------------------------- */
const NAV = [
  { group: '決策視圖' },
  { href: '#/',          label: '總覽',       key: 'dashboard' },
  { href: '#/blueprint', label: '01 總藍圖',  key: 'blueprint' },
  { href: '#/gaps',      label: '11 缺口招募', key: 'gaps', count: () => stats().gaps.length, alert: true },

  { group: '知識庫' },
  { href: '#/caps',      label: '03 能力總表', key: 'caps',      count: () => db.capabilities.length },
  { href: '#/opps',      label: '15 商機字典', key: 'opps',      count: () => db.opportunities.length },
  { href: '#/partners',  label: '04 夥伴拼圖', key: 'partners',  count: () => db.partners.length },
  { href: '#/gates',     label: '05 法規門檻', key: 'gates',     count: () => db.gates.length },

  { group: '執行視圖' },
  { href: '#/roadmap',   label: '06 行動路線', key: 'roadmap',   count: () => db.workpackages.length },
  { href: '#/pipeline',  label: '14 商機清單', key: 'pipeline',  count: () => db.pipeline.length },
  { href: '#/portfolio', label: '07 整案量級', key: 'portfolio' },
  { href: '#/risks',     label: '08 風險清冊', key: 'risks',     count: () => db.risks.length },
  { href: '#/kpis',      label: '09 KPI 計分卡', key: 'kpis',    count: () => db.kpis.length },

  { group: '稽核與說明' },
  { href: '#/history',   label: '10 歷程',    key: 'history' },
  { href: '#/about',     label: '系統說明',   key: 'about' }
];

function renderNav() {
  document.getElementById('nav').innerHTML = NAV.map(item => {
    if (item.group) return `<div class="nav__group">${esc(item.group)}</div>`;
    const count = item.count ? item.count() : null;
    return `<a href="${item.href}" data-key="${item.key}">
      <span>${esc(item.label)}</span>
      ${count !== null ? `<span class="nav__count"${item.alert && count ? ' style="background:var(--gap-bg);color:var(--gap-fg)"' : ''}>${count}</span>` : ''}
    </a>`;
  }).join('');
}

function markActive(key) {
  document.querySelectorAll('#nav a').forEach(a => {
    a.classList.toggle('is-active', a.dataset.key === key);
  });
}

/* --------------------------------------------------------------------------
   路由表
   -------------------------------------------------------------------------- */
const ROUTES = [
  { pattern: /^\/?$/,                 key: 'dashboard', view: () => views.dashboard() },
  { pattern: /^\/blueprint$/,         key: 'blueprint', view: () => views.blueprint() },
  { pattern: /^\/caps$/,              key: 'caps',      view: (_, q) => views.capabilities(q) },
  { pattern: /^\/cap\/(.+)$/,         key: 'caps',      view: m => views.capability(m[1]) },
  { pattern: /^\/opps$/,              key: 'opps',      view: (_, q) => views.opportunities(q) },
  { pattern: /^\/opp\/(.+)$/,         key: 'opps',      view: m => views.opportunity(m[1]) },
  { pattern: /^\/partners$/,          key: 'partners',  view: () => views.partners() },
  { pattern: /^\/partner\/(.+)$/,     key: 'partners',  view: m => views.partner(m[1]) },
  { pattern: /^\/gates$/,             key: 'gates',     view: () => views.gates() },
  { pattern: /^\/roadmap$/,           key: 'roadmap',   view: () => views.roadmap() },
  { pattern: /^\/wp\/(.+)$/,          key: 'roadmap',   view: m => views.workpackage(m[1]) },
  { pattern: /^\/gaps$/,              key: 'gaps',      view: () => views.gaps() },
  { pattern: /^\/risks$/,             key: 'risks',     view: () => views.risks() },
  { pattern: /^\/kpis$/,              key: 'kpis',      view: () => views.kpis() },
  { pattern: /^\/pipeline$/,          key: 'pipeline',  view: () => views.pipeline() },
  { pattern: /^\/portfolio$/,         key: 'portfolio', view: () => views.portfolio() },
  { pattern: /^\/history$/,           key: 'history',   view: () => views.history() },
  { pattern: /^\/about$/,             key: 'about',     view: () => views.about() }
];

/** 解析 #/caps?domain=D05 這種網址 */
function parseHash() {
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, search = ''] = raw.split('?');
  const params = {};
  new URLSearchParams(search).forEach((value, key) => { params[key] = value; });
  return { path, params };
}

function route() {
  const { path, params } = parseHash();
  const match = ROUTES.find(r => r.pattern.test(path));

  const result = match
    ? match.view(path.match(match.pattern), params)
    : views.notFound('頁面', path, '#/');

  document.getElementById('content').innerHTML = result.html;
  document.getElementById('topbarTitle').textContent = result.title;
  document.title = `${result.title}｜VMH-EcoMap 知識管理系統`;
  markActive(match ? match.key : '');

  if (typeof result.mount === 'function') result.mount();
  window.scrollTo({ top: 0 });
}

/* --------------------------------------------------------------------------
   啟動
   -------------------------------------------------------------------------- */
async function boot() {
  initTheme();
  try {
    await load();
  } catch (error) {
    document.getElementById('content').innerHTML = `
      <div class="page-head"><h1>知識庫載入失敗</h1>
      <p>${esc(error.message)}</p></div>
      <div class="card"><div class="card__body">
        <p style="margin-top:0">本站以 <code>fetch()</code> 讀取 <code>data/*.json</code>，
        直接用 <code>file://</code> 開啟時瀏覽器會擋下這類請求。請改用本機伺服器：</p>
        <p><code>cd VMH-EcoMap &amp;&amp; python3 -m http.server 8000</code>，
        然後開啟 <code>http://localhost:8000/</code>。</p>
        <p style="margin-bottom:0">部署到 GitHub Pages 後不會有這個問題。</p>
      </div></div>`;
    return;
  }

  renderNav();
  buildCorpus();
  initPalette();

  window.addEventListener('hashchange', route);
  route();

  const foot = document.getElementById('sidebarFoot');
  if (foot) {
    foot.innerHTML = `主工具 v${esc(db.meta.toolVersion || '—')}<br>
      資料產出 ${esc(db.meta.generatedAt || '')}<br>
      <a href="../">← 回主網站</a>`;
  }
}

boot();

</script>
