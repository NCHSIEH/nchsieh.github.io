<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>MyAssets 即時看盤</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23dc2626'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/style.css?v=17">
<style>
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 6px;font-size:15px;color:var(--mute)}
.ctl select{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:13px;background:#fff}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#94a3b8;margin-right:4px}
.dot.on{background:#16a34a}
h2.sec{font-size:17px;color:var(--mute);margin:18px 0 8px;font-weight:600;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.q .n{font-size:16px;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.q .p{font-size:32px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.q .c{font-size:17px;font-variant-numeric:tabular-nums}
.q .s{font-size:14px;color:var(--mute);margin-top:3px}
.up{color:#dc2626}.dn{color:#16a34a}.fl{color:#475569}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row .nm{flex:1;min-width:0;font-weight:700;font-size:19px}
.row .nm small{color:var(--mute);font-weight:400;margin-left:4px}
.row .nm .s{display:block;font-size:14px;color:var(--mute);font-weight:400;margin-top:1px}
.row .px{min-width:110px}
.row .px b{font-size:25px;font-variant-numeric:tabular-nums}
.row .chg{min-width:120px;text-align:right;font-size:17px;font-variant-numeric:tabular-nums}
.row .nm small{font-size:15px}.foot{font-size:14px}
.flash{animation:fl .8s}
@keyframes fl{from{background:#fef9c3}to{background:var(--card)}}
.tag2{display:inline-block;font-size:12px;padding:1px 5px;border-radius:4px;background:#e2e8f0;color:#334155;margin-left:4px}
.tag2.live{background:#dcfce7;color:#15803d}.tag2.dly{background:#fff7ed;color:#9a3412}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="../">MyAssets<small>即時看盤</small></a>
  <a class="btn" href="../">持股體檢</a>
  <button class="btn primary" id="refresh" type="button">立即更新</button>
  <span id="auth"></span>
</div></header>

<main class="wrap">
  <div class="ctl">
    <label><input type="checkbox" id="auto" checked> 自動更新</label>
    <select id="every">
      <option value="15">每 15 秒</option>
      <option value="30" selected>每 30 秒</option>
      <option value="60">每 1 分鐘</option>
      <option value="300">每 5 分鐘</option>
    </select>
    <span><span class="dot" id="dot"></span><span id="status">載入中…</span></span>
    <label style="margin-left:auto"><input type="checkbox" id="onlyheld" checked> 只看持有</label>
  </div>
  <div id="banner"></div>

  <h2 class="sec">台股大盤與期貨</h2>
  <div class="grid" id="tw"></div>

  <h2 class="sec">美國四大指數</h2>
  <div class="grid" id="us"></div>

  <h2 class="sec">我的持股</h2>
  <div id="hold"><div class="loading">載入中…</div></div>

  <p class="foot">資料來源：鉅亨網報價（加權、台指期、美股四大指數、上市櫃持股；台股盤中約數秒至一分鐘延遲，美股依交易所規定可能延遲）。鉅亨連不上時，依序改用證交所、期交所、Yahoo Finance，最後用 FinMind 前一收盤價並標示「收盤」。僅供參考，不構成投資建議。紅漲綠跌。</p>
</main>

<script src="../assets/core.js?v=17"></script>
<script type="module" src="../assets/auth.js?v=17"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const TW_INDEX = { code:'t00', name:'加權指數' };
  const CN_US = {'^DJI':'GI:DJI:INDEX','^GSPC':'GI:INX:INDEX','^IXIC':'GI:IXIC:INDEX','^SOX':'GI:SOX:INDEX'};
  const US = [['^DJI','道瓊工業'],['^GSPC','S&P 500'],['^IXIC','那斯達克'],['^SOX','費城半導體']];
  let listInfo='', user=null, userDoc=null, items=[], timer=null, left=0, busy=false, prev={};

  /* ---------- 抓取：直連失敗時依序改走公開 CORS 中繼 ---------- */
  const ROUTES = [u=>u, u=>'https://corsproxy.io/?url='+encodeURIComponent(u), u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
  const okRoute = {};
  async function tfetch(url, opt, kind){
    const order = okRoute[kind]!=null ? [okRoute[kind], ...ROUTES.keys()].filter((v,i,a)=>a.indexOf(v)===i) : [...ROUTES.keys()];
    let err;
    for (const i of order){
      const ac = new AbortController(); const to = setTimeout(()=>ac.abort(), 8000);
      try {
        const r = await fetch(ROUTES[i](url), {...opt, signal:ac.signal, cache:'no-store'});
        clearTimeout(to);
        if (!r.ok) throw new Error('HTTP '+r.status);
        const t = await r.text(); const j = JSON.parse(t);
        okRoute[kind]=i; return j;
      } catch(e){ clearTimeout(to); err=e; }
    }
    throw err || new Error('連線失敗');
  }

  const num = v => { const x = parseFloat(String(v).replace(/,/g,'')); return isFinite(x)?x:null; };

  /* 主要來源：鉅亨網報價（一次查完指數、期貨、美股、上市櫃持股） */
  const CN_BASE = 'https://ws.api.cnyes.com/ws/api/v1/quote/quotes/';
  const CN_IDX = 'TWS:TSE01:INDEX', CN_FUT = 'TWF:TXF:FUTURES';
  const hms = t => t ? new Date(t*1000).toLocaleTimeString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'}) : '';
  async function getCN(syms){
    const out = {};
    for (let i=0;i<syms.length;i+=30){
      const j = await tfetch(CN_BASE+syms.slice(i,i+30).join(',')+'?_='+Date.now(), {}, 'cnyes');
      (j.data||[]).forEach(r => {
        const price = num(r['6']); if (price==null) return;
        const ch = num(r['11']);
        out[r['0']||r['800013']] = { price, prev:(ch!=null?price-ch:num(r['21'])), high:num(r['12']), low:num(r['13']), open:num(r['19']), vol:num(r['200013']), time:hms(r['200007']), name:r['200009'], live:true };
      });
    }
    return out;
  }

  async function getTW(codes){
    // 每檔同時查上市(tse)與上櫃(otc)，有成交或有昨收的那個為準
    const ex = ['tse_t00.tw'];
    codes.forEach(c => { ex.push('tse_'+c+'.tw','otc_'+c+'.tw'); });
    const out = {};
    for (let i=0;i<ex.length;i+=40){
      const url = 'https://mis.twse.com.tw/stock/api/getStockInfo.jsp?json=1&delay=0&ex_ch='+ex.slice(i,i+40).join('%7C')+'&_='+Date.now();
      const j = await tfetch(url, {}, 'mis');
      (j.msgArray||[]).forEach(m => {
        const y = num(m.y); if (y==null) return;
        let z = num(m.z);
        if (z==null){ const a=num(String(m.a||'').split('_')[0]), b=num(String(m.b||'').split('_')[0]); z = (a!=null&&b!=null)?(a+b)/2:(b!=null?b:a); }
        const key = m.c;
        if (!out[key] || (z!=null && out[key].price==null)) out[key] = { price:z, prev:y, open:num(m.o), high:num(m.h), low:num(m.l), vol:num(m.v), time:m.t, name:m.n, live:true };
      });
    }
    return out;
  }

  async function getFut(){
    const body = JSON.stringify({MarketType:'0',SymbolType:'F',KindID:'1',CID:'TXF',ExpireMonth:'',RowSize:'全部',PageNo:'',SortColumn:'',AscDesc:'A'});
    const j = await tfetch('https://mis.taifex.com.tw/futures/api/getQuoteList', {method:'POST',headers:{'Content-Type':'application/json'},body}, 'fut');
    const list = ((j.RtData||{}).QuoteList||[]).filter(q => /^TXF[A-L]\d-[FM]$/.test(q.SymbolID||'') && num(q.CLastPrice)!=null);
    if (!list.length) throw new Error('目前無期貨報價');
    const q = list[0], last = num(q.CLastPrice), ref = num(q.CRefPrice);
    return { price:last, prev:ref, high:num(q.CHighPrice), low:num(q.CLowPrice), open:num(q.COpenPrice), vol:num(q.CTotalVolume), time:q.CTime, tag:(q.SymbolID.endsWith('-M')?'夜盤':'日盤')+' '+(q.DispCName||q.SymbolID), live:true };
  }

  async function getUS(sym){
    const j = await tfetch('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)+'?interval=1m&range=1d', {}, 'yahoo');
    const m = (((j.chart||{}).result||[])[0]||{}).meta;
    if (!m || m.regularMarketPrice==null) throw new Error('無資料');
    return { price:m.regularMarketPrice, prev:m.chartPreviousClose??m.previousClose, high:m.regularMarketDayHigh, low:m.regularMarketDayLow, time:m.regularMarketTime?new Date(m.regularMarketTime*1000).toLocaleTimeString('zh-TW',{hour12:false,timeZone:'Asia/Taipei'})+'（台北時間）':'', live:true };
  }

  async function fmClose(code){
    const s = new Date(Date.now()-10*864e5).toISOString().slice(0,10);
    const r = await fetch('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockPrice&data_id='+code+'&start_date='+s);
    const j = await r.json(); const d = (j.data||[]).slice(-2);
    if (!d.length) throw new Error('查無資料');
    const a = d[d.length-1], b = d[d.length-2];
    return { price:a.close, prev:b?b.close:null, high:a.max, low:a.min, open:a.open, vol:Math.round((a.Trading_Volume||0)/1000), time:a.date, live:false };
  }

  /* ---------- 顯示 ---------- */
  const f = (x,d=2) => x==null?'—':Number(x).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
  function calc(q){
    if (!q || q.price==null) return {cls:'fl',chg:'—'};
    if (q.prev==null) return {cls:'fl',chg:'—'};
    const d = q.price-q.prev, p = d/q.prev*100, cls = d>0?'up':d<0?'dn':'fl';
    return { cls, chg:(d>0?'▲ ':d<0?'▼ ':'')+f(Math.abs(d))+'　('+(d>0?'+':d<0?'-':'')+f(Math.abs(p))+'%)' };
  }
  function card(id,name,q,err,tag){
    const c = calc(q);
    const flash = q && prev[id]!=null && prev[id]!==q.price ? ' flash':'';
    if (q) prev[id]=q.price;
    return '<div class="q'+flash+'"><div class="n"><span>'+name+'</span><span>'+(q&&q.tag||tag||'')+'</span></div>'
      +(q?'<div class="p '+c.cls+'">'+f(q.price)+'</div><div class="c '+c.cls+'">'+c.chg+'</div>'
          +'<div class="s">'+(q.time?'更新 '+q.time:'')+(q.high!=null?'　高 '+f(q.high,0)+' 低 '+f(q.low,0):'')+'</div>'
        :'<div class="p fl">—</div><div class="s err">'+(err||'無資料')+'</div>')+'</div>';
  }
  function rowHTML(it,q,err){
    const c = calc(q), flash = q && prev[it.code]!=null && prev[it.code]!==q.price ? ' flash':'';
    if (q) prev[it.code]=q.price;
    return '<div class="row'+flash+'"><div class="nm">'+(it.name||(q&&q.name)||it.code)+'<small>'+it.code+'</small>'
      +(it.held?'':'<span class="tag2">觀察</span>')
      +(q?'<span class="tag2 '+(q.live?'live':'dly')+'">'+(q.live?'即時':'收盤')+'</span>':'')
      +'<span class="s">'+(q?((q.time?q.time+'　':'')+(q.vol!=null?'量 '+Math.round(q.vol).toLocaleString('zh-TW')+' 張　':'')+(q.high!=null?'高 '+f(q.high)+' 低 '+f(q.low):'')):'<span class="err">'+(err||'無資料')+'</span>')+'</span></div>'
      +'<div class="px"><b class="'+c.cls+'">'+(q?f(q.price):'—')+'</b></div><div class="chg '+c.cls+'">'+c.chg+'</div></div>';
  }

  function shown(){ return $('#onlyheld').checked && items.some(i=>i.held) ? items.filter(i=>i.held) : items; }

  async function refresh(){
    if (busy) return; busy = true; $('#refresh').disabled = true; $('#status').textContent='更新中…';
    const list = shown(), codes = list.map(i=>i.code);
    const syms = [CN_IDX, CN_FUT, ...US.map(u=>CN_US[u[0]]), ...codes.map(c=>'TWS:'+c+':STOCK')];
    let C = {}, cerr = null;
    try { C = await getCN(syms); } catch(e){ cerr = e.message; }
    // 備援：鉅亨沒給的項目改用證交所／Yahoo／期交所／FinMind
    const T = {}, fb = {}; let terr = null;
    const lackTW = codes.filter(c=>!C['TWS:'+c+':STOCK']);
    if (lackTW.length || !C[CN_IDX]) { try { Object.assign(T, await getTW(lackTW)); } catch(e){ terr = '台股行情連線失敗'; } }
    const futQ = C[CN_FUT] ? null : await getFut().then(v=>v, e=>({err:e.message}));
    const usQ = await Promise.all(US.map(async u => C[CN_US[u[0]]] ? null : await getUS(u[0]).then(v=>v, e=>({err:e.message}))));
    await Promise.all(lackTW.filter(c=>!T[c]).map(async c=>{ try{ fb[c]=await fmClose(c);}catch(e){} }));

    const idx = C[CN_IDX] || T.t00, fq = C[CN_FUT] || (futQ&&!futQ.err?futQ:null);
    const bad = cerr ? '連線失敗：'+cerr : '目前無資料';
    $('#tw').innerHTML = card('t00','加權指數',idx,terr||bad)
      + card('fut','台指期近月（全指數）',fq,futQ&&futQ.err?futQ.err:bad);
    $('#us').innerHTML = US.map((u,i)=>{ const q = C[CN_US[u[0]]] || (usQ[i]&&!usQ[i].err?usQ[i]:null); return card(u[0],u[1],q,usQ[i]&&usQ[i].err?usQ[i].err:bad); }).join('');

    $('#hold').innerHTML = list.length ? list.map(it=>rowHTML(it,C['TWS:'+it.code+':STOCK']||T[it.code]||fb[it.code],cerr||terr)).join('') : '<div class="loading">清單是空的（來源：'+listInfo+'）。到「持股體檢」頁加入標的。</div>';

    const okc = (idx?1:0)+(fq?1:0)+US.filter((u,i)=>C[CN_US[u[0]]]||(usQ[i]&&!usQ[i].err)).length;
        $('#status').textContent = '最後更新 '+new Date().toLocaleTimeString('zh-TW',{hour12:false})+(okc<6?'（部分來源無資料）':'');
    $('#dot').className = 'dot'+(okc?' on':'');
    $('#refresh').disabled=false; busy=false; left=+$('#every').value;
  }

  function tick(){
    if (!$('#auto').checked || document.hidden || busy) return;
    left -= 1; if (left<=0) refresh();
  }
  $('#refresh').onclick = refresh;
  $('#every').onchange = () => { left = +$('#every').value; };
  $('#onlyheld').onchange = refresh;
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && $('#auto').checked) refresh(); });
  setInterval(tick, 1000);

  /* ---------- 清單與登入（沿用持股體檢頁的帳號與清單） ---------- */
  function renderAuth(){
    if (user) $('#auth').innerHTML = '<span class="who">'+(user.photoURL?'<img src="'+user.photoURL+'" alt="" referrerpolicy="no-referrer">':'')+'<button class="btn" id="logout" type="button">登出</button></span>';
    else $('#auth').innerHTML = '<button class="btn primary" id="login" type="button">Google 登入</button>';
    const li=$('#login'), lo=$('#logout');
    if (li) li.onclick = () => MAAuth.signIn().catch(e=>alert('登入失敗：'+(e.code||e.message)));
    if (lo) lo.onclick = () => MAAuth.signOut();
    $('#banner').innerHTML = user ? '' : '<div class="banner"><span style="flex:1">目前顯示的是<b>示範清單</b>，登入後顯示你自己的持股。</span><button class="btn primary" type="button" onclick="MAAuth.signIn()">Google 登入</button></div>';
  }
  async function loadItems(){
    try { const L = await MA.loadList(userDoc); items = L.items; listInfo = L.src; } catch(e){ items = []; listInfo = '讀取失敗 '+(e.code||e.message); }
    refresh();
  }
  function start(){
    MAAuth.onChange(async u=>{
      user=u; renderAuth(); userDoc=null;
      if (u){ try{ userDoc = await MA.ensureUserDoc(u);}catch(e){} }
      loadItems();
    });
  }
  if (window.MAAuth) start(); else window.addEventListener('maauth-ready', start, {once:true});
})();
</script>
</body>
</html>
