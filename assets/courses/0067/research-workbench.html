<style>/* 研究計畫整合台：沿用三個工作台的學院藍主題 */
:root{
  --brand:#1f3a5f; --brand-deep:#142943; --brand-tint:rgba(31,58,95,.07); --on-brand:#fff;
  --accent:#9c7538; --accent-tint:rgba(156,117,56,.13);
  --ink:#1c242e; --muted:#4d5865; --faint:#737f8b; --line:#e2ded4; --line-strong:#c9c3b5;
  --bg:#f7f4ed; --card:#fff; --field:#fffdf8; --bad:#9b2c2c; --bad-tint:rgba(155,44,44,.07); --ok:#1f6b4a; --ok-tint:rgba(31,107,74,.10);
  --bar-ink:#e8eef4; --bar-dim:#b3c3d3;
  --c-p:#1f3a5f; --c-q:#2f6f8f; --c-l:#8a5a2b;
  --serif:"Noto Serif TC","Noto Serif",Georgia,serif;
  --sans:"Noto Sans TC","Noto Sans","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --brand:#7aa7d9; --brand-deep:#0a111c; --brand-tint:rgba(122,167,217,.12); --on-brand:#0b1220;
  --accent:#d4a960; --accent-tint:rgba(212,169,96,.15);
  --ink:#e6edf5; --muted:#a3b1c2; --faint:#7d8b9c; --line:#263243; --line-strong:#3a4859;
  --bg:#0d1420; --card:#131c29; --field:#0f1723; --bad:#f19a9a; --bad-tint:rgba(241,154,154,.09); --ok:#7fd1a8; --ok-tint:rgba(127,209,168,.12);
  --c-p:#7aa7d9; --c-q:#6fc0dc; --c-l:#d9a66a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.7}
h1,h2,h3,h4{font-family:var(--serif);margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
a{color:var(--brand)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--brand-deep);color:var(--bar-ink)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:11px 18px}
.brand{font-family:var(--serif);font-weight:700;font-size:17px}
.brand small{font-family:var(--sans);font-weight:400;color:var(--bar-dim);font-size:13px;margin-left:8px}
.top nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.top nav a{color:var(--bar-ink);text-decoration:none;font-size:13.5px;border:1px solid transparent;border-radius:7px;padding:3px 10px}
.top nav a:hover{border-color:var(--bar-dim)}
main{max-width:1120px;margin:0 auto;padding:26px 18px 60px;display:grid;gap:26px}
.lead h1{font-size:clamp(24px,3.2vw,32px)}
.lead p{color:var(--muted);margin-top:8px;max-width:46em}
section>h2{font-size:21px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
section>h2 .n{flex:none;background:var(--brand);color:var(--on-brand);font-family:var(--sans);font-size:13px;font-weight:700;border-radius:7px;padding:2px 9px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.fine{font-size:13.5px;color:var(--faint)}
.btn{display:inline-block;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:9px;padding:6px 15px;font-size:14.5px;font-weight:700;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.small{padding:3px 11px;font-size:13.5px}
.btn.warn{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.file{position:relative;overflow:hidden}.btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.row-btn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 三個工作台狀態 */
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tool{border-top:4px solid var(--tc);display:grid;gap:8px;align-content:start}
.tool.p{--tc:var(--c-p)} .tool.q{--tc:var(--c-q)} .tool.l{--tc:var(--c-l)}
.tool h3{font-size:17px}
.tool .role{font-size:13.5px;color:var(--muted)}
.tool .st{font-size:14px}
.tool .st b{color:var(--tc)}
.tool.off{opacity:.62}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:calc(var(--p,0)*1%);background:var(--tc,var(--brand));border-radius:4px}
.tagx{display:inline-block;font-size:12.5px;font-weight:700;border-radius:5px;padding:1px 7px;background:var(--accent-tint);color:var(--accent)}
.tagx.bad{background:var(--bad-tint);color:var(--bad)} .tagx.ok{background:var(--ok-tint);color:var(--ok)}

/* 定路線 */
.qa{padding:14px 0;border-top:1px dashed var(--line)}
.qa:first-child{border-top:0;padding-top:0}
.qa h3{font-size:16.5px;margin-bottom:9px}
.qa h3 small{font-family:var(--sans);font-weight:400;color:var(--faint);font-size:13px;margin-left:6px}
.opts{display:grid;gap:7px}
.opts.c2{grid-template-columns:repeat(2,minmax(0,1fr))} .opts.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{text-align:left;background:var(--field);border:1px solid var(--line-strong);border-radius:9px;padding:8px 12px;color:var(--ink);font-size:14.5px;display:flex;gap:10px;align-items:baseline}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);box-shadow:inset 0 0 0 1px var(--brand)}
.opt b{flex:none;color:var(--brand);min-width:1.2em}
.opt span small{display:block;color:var(--faint);font-size:13px}
.route{display:grid;gap:12px}
.route dl{margin:0;display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:6px 14px;font-size:14.5px}
.route dt{color:var(--faint)} .route dd{margin:0}
.route dd b{color:var(--brand)}
.note{background:var(--accent-tint);border-radius:9px;padding:9px 13px;font-size:14px}
.note.bad{background:var(--bad-tint)}

/* 路線圖 */
.map{display:grid;gap:10px;counter-reset:r}
.stage{display:grid;grid-template-columns:42px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stage .no{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--line);color:var(--muted)}
.stage.done .no{background:var(--ok);color:#fff}
.stage.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-tint)}
.stage.next .no{background:var(--accent);color:#fff}
.stage h3{font-size:16.5px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.stage .why{color:var(--muted);font-size:14px;margin-top:2px}
.parts{display:grid;gap:7px;margin-top:10px}
.part{display:grid;grid-template-columns:minmax(0,23em) minmax(60px,1fr) 3.2em auto;gap:12px;align-items:center;font-size:14px}
.part .who{font-weight:700;color:var(--tc)}
.part.p{--tc:var(--c-p)} .part.q{--tc:var(--c-q)} .part.l{--tc:var(--c-l)}
.part .pc{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
/* 帶入、檢查、匯出 */
.bring{display:grid;gap:8px;margin-top:12px}
.bi{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--field)}
.bi.same{opacity:.7}
.bi label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.bi input{margin-top:6px;width:17px;height:17px;flex:none;accent-color:var(--brand)}
.bi small,.tog small{display:block;color:var(--faint);font-size:13px}
.bi details{margin:4px 0 0 27px;font-size:14px}
.bi summary{cursor:pointer;color:var(--brand);font-size:13.5px}
.pv{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-top:6px;line-height:1.75}
.pv.old{border-style:dashed;color:var(--muted)}
.ck{display:grid;gap:8px;margin-top:12px}
.ci{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:9px;font-size:14.5px}
.ci.bad{background:var(--bad-tint)}
.ci p{color:var(--muted);font-size:14px}
.ci .mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--ok);color:#fff}
.ci.bad .mk{background:var(--bad)}
.okl summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
.tog{display:flex;gap:10px;align-items:flex-start;margin-top:12px;cursor:pointer}
.tog input{margin-top:6px;width:17px;height:17px;flex:none;accent-color:var(--brand)}
footer{max-width:1120px;margin:0 auto;padding:0 18px 40px;color:var(--faint);font-size:13px}
@media (max-width:820px){
  .tools{grid-template-columns:1fr} .opts.c2,.opts.c3{grid-template-columns:1fr}
  .part{grid-template-columns:minmax(0,1fr) 3.2em auto} .part .bar{display:none}
  .route dl{grid-template-columns:1fr;gap:0 0} .route dt{margin-top:6px}
  .stage{grid-template-columns:1fr} 
}
</style>
</head>

<main>
<div class="lead"><h1>從一個想法，走到一份完整的研究計畫書</h1>
<p>先在這裡定出路線，再依路線圖到三個工作台填寫。這一頁會告訴你現在做到哪裡、下一步去哪裡。</p></div>
<section aria-labelledby="h-tools"><h2 id="h-tools">三個工作台的現況</h2><div class="tools" id="tools"></div></section>
<section aria-labelledby="h-wiz"><h2 id="h-wiz"><span class="n">第一步</span>定路線</h2><div id="wizard"></div></section>
<section aria-labelledby="h-map" id="mapsec" hidden><h2 id="h-map"><span class="n">第二步</span>照路線圖完成</h2><div id="map"></div></section>
<section aria-labelledby="h-br" id="bringsec" hidden><h2 id="h-br"><span class="n">第三步</span>把方法內容帶進計畫書</h2><div id="bringbox"></div></section>
<section aria-labelledby="h-ck" id="cksec" hidden><h2 id="h-ck"><span class="n">第四步</span>一致性檢查</h2><div id="ckbox"></div></section>
<section aria-labelledby="h-ex" id="exsec" hidden><h2 id="h-ex"><span class="n">第五步</span>匯出完整計畫書</h2><div id="exbox"></div></section>
<section aria-labelledby="h-bk"><h2 id="h-bk">全案備份</h2><div class="card">
<p>把三個工作台的草稿和這一頁的路線打包成一個檔案。換電腦、換瀏覽器或清除瀏覽資料之前，先下載一份。</p>
<div class="row-btn" style="margin-top:10px"><button type="button" class="btn small" id="bkout">下載全案備份（.json）</button>
<label class="btn small ghost file">從備份還原<input type="file" id="bkin" accept=".json,application/json"></label></div>
<div id="bkmsg" style="margin-top:10px"></div></div></section>
</main>
<footer>草稿只存在這台電腦的這個瀏覽器，不會上傳。進度在各工作台存檔時同步到這一頁。</footer>

    .replace(/📌?\s*【論文正式寫法範本】\s*/g,'').replace(/【論文正式寫法範本[^】]*】\s*/g,'').replace(/[（(][^（）()]*@[^）)]*[）)]/g,'')
    .replace(/(依據|參照|參考|對應|見)?\s*@\s?\d+(?:\.\d+)?[A-Z]?(?:\s*(?:第\s*[\d–\-、,，\s]+張|[sS]\d+(?:[–\-]\d+)?(?:[、,，]\s*[sS]?\d+(?:[–\-]\d+)?)*|Part\s*\d+|Section\s*\d+|全份))*\s*[，,、；]?/g,'')
    .replace(/[（(]\s*[）)]/g,'')
    .replace(/[（(]見?\s*講義[^）)]*[）)]/g,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]️?/gu,'')
    .replace(/[ \t]+\n/g,'\n').replace(/\n{2,}/g,'\n').trim();
}

function dot(s){ s = tx(s); return s && !/[。．.！？!?；;]$/.test(s) ? s + '。' : s; }
function splitPop(t){
  var site = [], incl = [], inIncl = false;

  if(/混淆|控制|共變|Z/.test(t)) return '控制';

    if(ps.fmt) add(ps.fmt === H.fmt, '計畫格式', ps.fmt === H.fmt ? '計畫書格式與路線相同。' : '路線是「' + FMT[H.fmt][0] + '」，計畫書工作台選的是「' + (ps.fmtName||'') + '」。匯出時以計畫書工作台為準。', 'p', 'setup');
  }
  [['q', r.q, Q], ['l', r.l, L]].forEach(function(x){ if(x[1] && x[2]){ var ok = x[2].design === x[1];
    add(ok, SHORT[x[0]] + '設計', ok ? '工作台的設計與路線相同。' : '路線是「' + dname(x[0], x[1]) + '」，工作台目前是「' + dname(x[0], x[2].design) + '」。確認要用哪一個，再回上面改路線或改工作台。', x[0], 'setup'); } });
  var rq = pl.items.filter(function(i){ return i.key === 'm3_rq'; })[0];
  if(rq && rq.cur) add(rq.state === 'same', '研究問題', rq.state === 'same' ? '計畫書與方法工作台的研究問題相同。' : '計畫書 M3 的研究問題和方法工作台步驟①寫的不同。兩邊應是同一句。', 'p', 'm3');
  if(tx(pf.m3_rq) && tx(pf.m3_rq).length > 60 && !/\n/.test(tx(pf.m3_rq))) add(false, '研究問題長度', '計畫書 M3 的主要研究問題有 ' + tx(pf.m3_rq).length + ' 字。計畫書工作台的要求是單一語句、60 字內，請濃縮。', 'p', 'm3');
  if(pl.a){
    var pv = (P.vars||[]).filter(function(x){ return tx(x.name); });
    if(pv.length){ var miss = pl.a.vars.filter(function(x){ return !pv.some(function(y){ return same(x.name, y.name); }); }).map(function(x){ return x.name; });
      add(!miss.length, '變項', miss.length ? '量性工作台有、計畫書變項表沒有：' + miss.join('、') + '。' : '量性工作台的 ' + pl.a.vars.length + ' 個變項都在計畫書變項表裡。', 'p', 'm4'); }
    var po = (P.objs||[]).filter(function(o){ return tx(o.text); });
    if(po.length && pl.a.objs.length){
      var noAna = po.filter(function(o){ return !tx(o.analysis); }).length;
      add(po.length === pl.a.objs.length && !noAna, '假設與分析', po.length !== pl.a.objs.length ? '計畫書有 ' + po.length + ' 個研究目的，量性分析計畫表有 ' + pl.a.objs.length + ' 列。每個目的都要對得到一種分析。'
        : noAna ? '計畫書有 ' + noAna + ' 個研究目的還沒有寫分析方法。' : '每個研究目的都有對應的分析方法。', 'p', 'm6'); }
    var nq = nums(Q.s4_power), np = nums(pf.m5_sample), na = nums(pf.m10_abs);
    if(nq.length && np.length){ var hit = nq.some(function(x){ return np.indexOf(x) >= 0; });
      add(hit, '樣本數', hit ? '計畫書 3.3 的人數與量性工作台的樣本數推算對得上。' : '量性工作台樣本數推算出現的人數是 ' + nq.join('、') + '；計畫書 3.3 寫的是 ' + np.join('、') + '。請核對。', 'p', 'm5'); }
    if(nq.length && na.length){ var hit2 = nq.some(function(x){ return na.indexOf(x) >= 0; });
      if(!hit2) add(false, '摘要的人數', '摘要寫的人數（' + na.join('、') + '）在量性工作台的樣本數推算裡找不到。請核對。', 'p', 'm10'); }
  }
  var stale = pl.items.filter(function(i){ return i.state === 'diff' && i.key !== 'm3_rq'; });
  if(pl.items.length) add(!stale.length, '方法內容同步', stale.length ? '計畫書有 ' + stale.length + ' 個欄位和方法工作台現在的內容不同：' + stale.map(function(i){ return PLAB[i.key][1]; }).join('、') + '。若是方法工作台後來改過，到上面「帶入」重新勾選；若是你在計畫書裡刻意改寫，可以不理會。' : '計畫書裡來自方法工作台的欄位都是最新的。', '', '');
  ['p','q','l'].forEach(function(t){ var s = S[t].sum; if(!s || (t !== 'p' && !(t === 'q' ? r.q : r.l))) return;
    if(s.sample) add(false, SHORT[t] + '工作台仍是範例', '裡面是「' + (s.sampleLabel||'範例') + '」的原文，還沒改成你的研究。', t, t === 'p' ? 's1' : 's1');
    else if(s.sameN && s.sameTotal && s.sameN / s.sameTotal >= 0.3) add(false, SHORT[t] + '工作台殘留範例文字', '還有 ' + s.sameN + ' 個欄位和範例一字不差。交出去之前要全部改寫。', t, t === 'p' ? 's1' : 's1'); });
  return C;
}
function checksHTML(C){
  if(!C.length) return '<div class="card"><p>三個工作台都有內容之後，這裡會列出題目、研究問題、變項、樣本數、設計是否一致。</p></div>';
  var bad = C.filter(function(c){ return !c.ok; }), ok = C.filter(function(c){ return c.ok; });
  var h = '<div class="card"><p><b>' + (bad.length ? '有 ' + bad.length + ' 項要處理' : '全部一致') + '</b>，共檢查 ' + C.length + ' 項。</p><div class="ck">';
  bad.forEach(function(c){ h += '<div class="ci bad"><span class="mk">!</span><div><b>' + esc(c.t) + '</b><p>' + esc(c.d) + '</p></div>' + (c.tool ? '<a class="btn small ghost" href="' + url(c.tool, {step:c.step}) + '">去改</a>' : '<span></span>') + '</div>'; });
  if(ok.length) h += '<details class="okl"><summary>已一致的 ' + ok.length + ' 項</summary>' + ok.map(function(c){ return '<div class="ci"><span class="mk">✓</span><div><b>' + esc(c.t) + '</b><p>' + esc(c.d) + '</p></div><span></span></div>'; }).join('') + '</details>';
  return h + '</div></div>';
}

/* ---------- 匯出 ---------- */
function appx(){ var a = get('rw.appx'); return a || { on:true }; }
function exportHTML(S, r, C){
  var bad = C.filter(function(c){ return !c.ok; }).length, A = appx(), tools = [r.q && S.q.live ? 'q' : '', r.l && S.l.live ? 'l' : ''].filter(Boolean);
  var h = '<div class="card">';
  h += '<p>完整的計畫書由計畫書工作台匯出成 Word：封面、摘要、目錄、各章節、表與圖自動編號，依你選的格式排版。</p>';
  if(tools.length){
    h += '<label class="tog"><input type="checkbox" id="appxon"' + (A.on ? ' checked' : '') + '><span><b>附上方法工作台的明細表（附錄）</b><small>' +
      tools.map(function(t){ return t === 'q' ? '量性：變項操作型定義、因果解釋與排除、候選設計取捨、偏誤控制、統計分析計畫、樣本數推算與情境' : '質性：抽樣架構、訪談大綱、候選取徑取捨、資訊力與飽和判準、編碼簿、可信性四準則'; }).join('；') +
      '。匯出當下直接讀方法工作台的最新內容。</small></span></label>';
  }
  if(bad) h += '<p class="note bad" style="margin-top:10px">一致性檢查還有 ' + bad + ' 項沒處理。建議先處理再匯出。</p>';
  h += '<div class="row-btn" style="margin-top:12px">';
  if(r.q) h += '<a class="btn small ghost" href="' + url('q', {step:'review'}) + '">量性：步驟⑦ 方法學檢核</a>';
  if(r.l) h += '<a class="btn small ghost" href="' + url('l', {step:'review'}) + '">質性：步驟⑦ 報告規範檢核</a>';
  h += '<a class="btn" href="' + url('p', {step:'review'}) + '">到計畫書工作台匯出 Word</a></div>';
  h += '<p class="fine" style="margin-top:8px">計畫書工作台的最後一步另可匯出 IRB 送審文件。方法工作台各自的 Word 與 CSV 匯出仍可單獨使用。</p></div>';
  return h;
}

/* ---------- 組裝 ---------- */
function render(){
  var S = sums(), r = H.done ? route() : null;
  $('#tools').innerHTML = toolsHTML(S, r);
  $('#wizard').innerHTML = H.done && r ? routeHTML(S) : wizardHTML();
  $('#mapsec').hidden = !(H.done && r);
  if(H.done && r) $('#map').innerHTML = mapHTML(S);
  ['#bringsec','#cksec','#exsec'].forEach(function(id){ $(id).hidden = !(H.done && r); });
  if(H.done && r){
    var pl = plan(S, r), C = checks(S, r, pl);
    $('#bringsec').hidden = !(r.q || r.l);
    $('#bringbox').innerHTML = bringHTML(S, r, pl);

    $('#exbox').innerHTML = exportHTML(S, r, C);
    var bb = $('#bring'); if(bb) bb.onclick = function(){ var n = applyBring(S, r); render(); var m = $('#bringmsg'); if(m) m.innerHTML = n ? '已寫入 ' + n + ' 項。<a href="' + url('p', {step:'m5'}) + '">到計畫書工作台看結果</a>（開啟一次，上面路線圖的進度就會更新）' : '沒有寫入任何項目。'; };
    var ud = $('#undo'); if(ud) ud.onclick = function(){ var u = get('rw.undo.p'); if(!u) return; try{ if(u.raw === null) localStorage.removeItem(K.p); else localStorage.setItem(K.p, u.raw); localStorage.removeItem('rw.undo.p'); }catch(e){} render(); var m = $('#bringmsg'); if(m) m.textContent = '已復原到帶入之前。'; };
    var ax = $('#appxon'); if(ax) ax.onchange = function(){ try{ localStorage.setItem('rw.appx', JSON.stringify({ on:this.checked })); }catch(e){} };
  }
  var ok = $('#ok'); if(ok) ok.onclick = function(){ if(!complete()) return; H.done = true; saveH(); render(); $('#mapsec').scrollIntoView({behavior:'smooth', block:'start'}); };
  var redo = $('#redo'); if(redo) redo.onclick = function(){ H.done = false; saveH(); render(); };
}
document.addEventListener('change', function(e){ var c = e.target; if(c && c.dataset && c.dataset.bk){ pick2[c.dataset.bk] = c.checked; var S = sums(), r = route(); if(r){ var keep = Array.prototype.map.call(document.querySelectorAll('.bi details'), function(d){ return d.open; }); $('#bringbox').innerHTML = bringHTML(S, r, plan(S, r)); Array.prototype.forEach.call(document.querySelectorAll('.bi details'), function(d, i){ d.open = !!keep[i]; }); var bb = $('#bring'); if(bb) bb.onclick = function(){ var n = applyBring(S, r); render(); var m = $('#bringmsg'); if(m) m.innerHTML = n ? '已寫入 ' + n + ' 項。<a href="' + url('p', {step:'m5'}) + '">到計畫書工作台看結果</a>（開啟一次，上面路線圖的進度就會更新）' : '沒有寫入任何項目。'; }; } } });

$('#bkout').onclick = exportAll;

window.RW_HUB = { state:function(){ return H; }, route:route, stages:stages, plan:function(){ return plan(sums(), route()); }, checks:function(){ var S = sums(), r = route(); return checks(S, r, plan(S, r)); } };
render();
