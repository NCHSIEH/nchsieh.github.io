<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>質性研究設計與分析工作台｜研究方法論 3.1–3.2</title>
<meta name="description" content="研究方法論課程 3.1–3.2 質性研究與混合研究法互動工作台：涵蓋質性描述與主題分析、詮釋現象學分析 (IPA)、紮根理論 (GT)、個案研究、民族誌、敘事研究、焦點團體 (FGD)、德懷術專家共識與解釋性序列混合研究共 9 種主流取向與一鍵完整範例、Malterud 資訊力試算器、四階梯編碼實驗室、七步驟走查檢核、Lincoln & Guba 四大嚴謹度檢證、匯出 APA 第 7 版 Word 與標準編碼矩陣 CSV。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231f3a5f'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='56' font-weight='600' fill='%23fff' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f7f4ed;--panel:#ffffff;--subtle:#efeae0;--line:#dcd5c6;--ink:#1d242b;--muted:#5b6470;--brand:#1f3a5f;--brand-deep:#142943;--brand-soft:#e7eef6;--accent:#9c7538;--accent-soft:#f6efe1;--ok:#1f6f4a;--ok-soft:#e5f3ec;--warn:#a85513;--warn-soft:#fbeee2;--bad:#a2342a;--bad-soft:#fae8e6;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC","Source Han Serif TC",Georgia,serif}
@media (prefers-color-scheme: dark){:root{--bg:#13171d;--panel:#1b212a;--subtle:#242c38;--line:#313b4a;--ink:#ebe7de;--muted:#9ea8b6;--brand:#7fb0e8;--brand-deep:#a9caf0;--brand-soft:#1e2f44;--accent:#d8b16d;--accent-soft:#2f281a;--ok:#5bc490;--ok-soft:#182e24;--warn:#f0a35e;--warn-soft:#312214;--bad:#eb7c72;--bad-soft:#321b19}}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.04)}
.top-in{max-width:1440px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--brand-deep);letter-spacing:.02em}
.brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px}
#menu{display:none;border:1px solid var(--line);background:var(--subtle);padding:5px 10px;border-radius:6px;cursor:pointer}
#who{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.pill{background:var(--brand-soft);color:var(--brand-deep);padding:3px 9px;border-radius:999px;font-weight:500;border:1px solid transparent}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:160px}
.prog i{flex:1;height:7px;background:var(--subtle);border-radius:99px;overflow:hidden;display:block;position:relative;border:1px solid var(--line)}
.prog i::after{content:"";display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--brand),var(--ok));transition:width .25s}
#progt{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.oneclick{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.oneclick:hover{background:var(--accent);color:#fff}
#sy{max-width:250px;border:1px solid var(--line);background:var(--subtle);padding:5px 9px;border-radius:6px;font-size:12.5px}
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:252px minmax(0,1fr);gap:20px;padding:18px}
#side-nav{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.sitem{width:100%;text-align:left;border:0;background:transparent;padding:8px 9px;border-radius:7px;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;cursor:pointer;margin-bottom:2px}
.sitem:hover{background:var(--subtle)}
.sitem.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
.sdot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--panel)}
.sitem.on .sdot{border-color:var(--brand);color:var(--brand)}
.sitem.done .sdot{background:var(--ok);border-color:var(--ok);color:#fff}
.slbl{font-size:13px;line-height:1.3}.slbl small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.s pct{font-size:11px;color:var(--muted)}
.saved{font-size:11.5px;color:var(--muted);margin:10px 6px 2px;border-top:1px dashed var(--line);padding-top:8px}
#work{min-width:0}
.head{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:14px}
.head-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.badge{background:var(--brand);color:#fff;font-weight:700;font-size:12px;padding:2px 9px;border-radius:5px;letter-spacing:.04em}
.head h1{font-family:var(--serif);font-size:21px;margin:0;color:var(--brand-deep)}
.head .q{margin:6px 0 0;color:var(--muted);font-size:14px}
.locbar{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.loc{background:var(--subtle);border:1px solid var(--line);padding:3px 9px;border-radius:5px}
.loc b{color:var(--brand-deep)}
.loc.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.panes{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(310px,.92fr);gap:16px;align-items:start}
.form,.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.fld{margin-bottom:15px}
.fld label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--brand-deep)}
.fld label span.h{font-weight:400;font-size:12px;color:var(--muted)}
.fld textarea,.fld input[type=text],.fld input[type=number],.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;transition:border-color .15s,background .15s}
.fld textarea{resize:vertical;min-height:74px;line-height:1.6}
.fld textarea:focus,.fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);background:var(--panel)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 2px}
.chip{border:1px dashed var(--brand);background:var(--brand-soft);color:var(--brand-deep);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;text-align:left;line-height:1.4}
.chip:hover{background:var(--brand);color:#fff;border-style:solid}
.chip b{font-weight:700}
.stabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.stab{border:0;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.stab.on{color:var(--brand-deep);border-bottom-color:var(--brand);font-weight:700}
.sbox{font-size:13.2px}
.sbox h3{font-size:13.5px;margin:12px 0 6px;color:var(--brand-deep);border-left:3px solid var(--brand);padding-left:8px}
.sbox h3:first-child{margin-top:0}
.chk{list-style:none;padding:0;margin:0}
.chk li{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:7px;align-items:flex-start}
.chk input{margin-top:4px}
.err{background:var(--bad-soft);border-left:3px solid var(--bad);padding:7px 10px;border-radius:5px;margin-bottom:6px;font-size:12.8px}
.caseq{background:var(--accent-soft);border:1px solid var(--accent);border-radius:7px;padding:10px 12px;font-size:12.8px;white-space:pre-line}
.caseq .use{margin-top:6px;display:inline-block;font-size:12px;color:var(--brand-deep);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.gate{background:var(--ok-soft);border:1px solid var(--ok);border-radius:7px;padding:9px 11px;margin-top:10px}
.gate h4{margin:0 0 6px;font-size:13px;color:var(--ok)}
.gate label{display:flex;gap:7px;align-items:flex-start;font-size:12.6px;padding:3px 0;cursor:pointer}
.fnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{background:var(--subtle)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--brand-deep)}
.btn.ac{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.sm{padding:4px 9px;font-size:12px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--bg);cursor:pointer;transition:border-color .15s,transform .1s;text-align:left}
.card:hover{border-color:var(--brand)}
.card.on{border:2px solid var(--brand);background:var(--brand-soft)}
.card h4{margin:0 0 3px;font-size:14px;color:var(--brand-deep);display:flex;justify-content:space-between;align-items:center;gap:6px}
.card p{margin:0;font-size:12.3px;color:var(--muted);line-height:1.45}
.card . cmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ctag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--subtle);color:var(--ink);border:1px solid var(--line)}
.card.on .ctag{background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700}
.tbl input,.tbl textarea,.tbl select{width:100%;border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:4px;font-size:12.5px}
.tbl input:focus,.tbl textarea:focus,.tbl select:focus{border-color:var(--brand);background:var(--panel);outline:none}
.tbl textarea{min-height:44px;resize:vertical}
.tool{background:var(--subtle);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.tool h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tout{background:var(--panel);border-left:3px solid var(--accent);padding:9px 12px;border-radius:5px;margin-top:8px;font-size:13px}
.warnbox{background:var(--warn-soft);border-left:3px solid var(--warn);padding:8px 11px;border-radius:5px;font-size:12.6px;margin:6px 0}
.okbox{background:var(--ok-soft);border-left:3px solid var(--ok);padding:8px 11px;border-radius:5px;font-size:12.6px;margin:6px 0}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.mcell{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.mcell.empty{border-color:var(--warn);background:var(--warn-soft)}
.mcell h4{margin:0 0 4px;font-size:13px;color:var(--brand-deep);display:flex;justify-content:space-between}
.mcell p{margin:0;font-size:12.3px;white-space:pre-line;max-height:130px;overflow:auto}
.doc-preview{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 26px;font-family:var(--serif);line-height:1.85;max-height:580px;overflow:auto;white-space:pre-wrap;font-size:14px}
.slot{background:var(--warn-soft);color:var(--warn);padding:0 3px;border-radius:3px;font-weight:700}
.pp{--p:0;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:inline-flex;align-items:center;justify-content:center}
.pp i{width:17px;height:17px;border-radius:50%;background:var(--panel);font-style:normal;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.sitem.on .pp i{color:var(--brand)}
/* 2.X 量性研究設計專屬視覺元件 */
.dtree{background:var(--subtle);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:14px}
.dtree h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep)}
.dq-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-bottom:8px}
.dq{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.4px}
.dq b{display:block;color:var(--brand-deep);margin-bottom:4px}
.dq select{width:100%;border:1px solid var(--line);background:var(--bg);padding:4px 6px;border-radius:5px;font-size:12.3px}
.flow-viz{background:var(--panel);border:1.5px solid var(--brand);border-radius:9px;padding:13px 15px;margin:10px 0}
.flow-viz h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.fsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.fnode{background:var(--brand-soft);border:1px solid var(--brand);color:var(--brand-deep);padding:6px 10px;border-radius:7px;font-size:12.3px;line-height:1.4;font-weight:500}
.fnode.ac{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.fnode.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.farr{color:var(--muted);font-weight:700;font-size:14px}
.fnotation{font-family:ui-monospace,Consolas,monospace;background:var(--subtle);border:1px dashed var(--line);padding:6px 10px;border-radius:6px;font-size:12.3px;margin:6px 0;white-space:pre-wrap}
.eff-bars{margin:8px 0;display:grid;gap:6px}
.ebar{display:grid;grid-template-columns:170px 1fr 90px;align-items:center;gap:8px;font-size:12.2px}
.ebar-track{height:14px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.ebar-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px}
.ebar-fill.ok{background:linear-gradient(90deg,var(--ok),var(--brand))}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:8px;margin-top:8px}
.pbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 10px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.pbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.pbtn b{display:block;font-size:12.8px;color:var(--brand-deep);margin-bottom:2px}
.pbtn small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
.pbtn .ptag{display:inline-block;font-size:10.8px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--brand-soft);color:var(--brand-deep);margin-bottom:4px}
/* README 總覽網頁專屬樣式（清晰三步結構：選分類 → 看設計與範例 → 橫向比較） */
.rm-doc{display:grid;gap:16px}
.rm-sec{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px 22px;box-shadow:0 1px 6px rgba(0,0,0,.02)}
.rm-sec-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rm-sec-hd h2{margin:0;font-family:var(--serif);font-size:18px;color:var(--brand-deep);display:flex;align-items:center;gap:8px}
.rm-sec-hd small{font-size:12.5px;color:var(--muted)}
.rm-step-tag{background:var(--brand);color:#fff;font-family:var(--sans);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px}
.rm-flts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:8px 11px;background:var(--subtle);border-radius:8px;font-size:12.5px}
.rm-flt{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;border-radius:99px;font-size:12.2px;cursor:pointer;font-weight:500;transition:all .15s}
.rm-flt:hover{border-color:var(--brand)}
.rm-flt.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.rm-fam-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}
.rm-fam{background:var(--subtle);border:1px solid var(--line);border-radius:9px;padding:10px;display:grid;grid-template-rows:48px 104px 104px;gap:8px}
.rm-fam-hd{padding-bottom:6px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.rm-fam-hd b{display:block;font-size:13px;color:var(--brand-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-fam-hd span{display:block;font-size:11.3px;color:var(--muted);line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-ditem{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;transition:all .15s;display:grid;grid-template-rows:22px 20px 1fr;align-items:start;width:100%;height:104px;box-sizing:border-box;overflow:hidden}
.rm-ditem:hover{border-color:var(--brand);transform:translateY(-1px)}
.rm-ditem.on{border:2px solid var(--brand);background:var(--brand-soft);box-shadow:0 2px 8px rgba(31,58,95,.12)}
.rm-ditem.dim{opacity:.32}
.rm-ditem-note{border:1.5px dashed var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;height:104px;box-sizing:border-box;font-size:11.4px;color:var(--muted);line-height:1.4}
.rm-ditem-note b{color:var(--brand-deep);font-size:12px}
.rm-ditem-top{display:flex;justify-content:space-between;align-items:center;gap:4px;height:20px}
.rm-ditem-num{font-weight:700;font-size:11.8px;color:var(--brand-deep);background:var(--subtle);padding:1px 6px;border-radius:4px;white-space:nowrap}
.rm-ditem.on .rm-ditem-num{background:var(--brand);color:#fff}
.rm-ditem-n{font-size:10.8px;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-ditem b{display:block;font-size:12.6px;color:var(--brand-deep);line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.rm-ditem small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.3px;color:var(--muted);line-height:1.38;margin-top:2px}
.rm-focus{border:2px solid var(--brand);border-radius:11px;background:var(--panel);overflow:hidden;scroll-margin-top:116px}
.rm-focus-bar{background:var(--brand-soft);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rm-focus-title h2{margin:4px 0 2px;font-family:var(--serif);font-size:20px;color:var(--brand-deep)}
.rm-focus-title p{margin:0;font-size:13px;color:var(--muted)}
.rm-focus-acts{display:flex;gap:8px;flex-wrap:wrap}
.rm-bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px 20px;align-items:stretch}
.rm-bcard{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:var(--bg);display:flex;flex-direction:column;gap:8px;min-width:0}
.rm-bcard h4{margin:0;font-size:14px;color:var(--brand-deep);display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
/* STEP 2 內部對齊網格與表格 */
.rm-step-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rm-step-box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;font-size:12px;line-height:1.38;min-height:42px}
.rm-step-box.ac{border-color:var(--accent);background:var(--accent-soft)}
.rm-step-box.ok{border-color:var(--ok);background:var(--ok-soft)}
.rm-step-badge{background:var(--subtle);color:var(--brand-deep);font-weight:700;font-size:11px;padding:2px 5px;border-radius:4px;text-align:center;white-space:nowrap}
.rm-step-box.ac .rm-step-badge{background:var(--accent);color:#fff}
.rm-step-box.ok .rm-step-badge{background:var(--ok);color:#fff}
.rm-sub-tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rm-sub-tbl th,.rm-sub-tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;line-height:1.42}
.rm-sub-tbl th:last-child,.rm-sub-tbl td:last-child{border-right:0}
.rm-sub-tbl tr:last-child td,.rm-sub-tbl tr:last-child th{border-bottom:0}
.rm-sub-tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700}
.rm-data-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.rm-data-tbl{width:100%;border-collapse:collapse;font-size:11.6px}
.rm-data-tbl th,.rm-data-tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
.rm-data-tbl th:last-child,.rm-data-tbl td:last-child{border-right:0}
.rm-data-tbl tr:last-child td{border-bottom:0}
.rm-data-tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700;font-family:var(--mono)}
.rm-data-tbl td{font-family:var(--mono);color:var(--ink)}
.rm-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.rm-tbl{width:100%;border-collapse:collapse;font-size:12.6px;min-width:820px}
.rm-tbl th,.rm-tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle;line-height:1.45}
.rm-tbl th:last-child,.rm-tbl td:last-child{border-right:0}
.rm-tbl tr:last-child td{border-bottom:0}
.rm-tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700;white-space:nowrap}
.rm-tbl tr.on td{background:var(--brand-soft)}
.rm-tbl tr:hover td{background:var(--subtle);cursor:pointer}
/* APA 第 7 版預覽與表格樣式 */
.apa-page{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:32px 42px;font-family:"Times New Roman","標楷體",var(--serif);line-height:1.85;max-height:680px;overflow:auto;font-size:15px;color:var(--ink)}
.apa-rh,.apa-runhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:22px}
.apa-cover{text-align:center;padding:18px 0 22px;margin-bottom:20px;border-bottom:2px double var(--line)}
.apa-cover h2,.apa-title{font-size:20px;font-weight:700;margin:0 0 8px;color:var(--brand-deep)}
.apa-subtitle{font-size:17px;font-weight:700;margin:0 0 10px;color:var(--ink)}
.apa-meta{font-size:14px;line-height:1.7;color:var(--ink)}
.apa-h1{text-align:center;font-weight:700;font-size:17px;margin:28px 0 12px;color:var(--brand-deep)}
.apa-h2{text-align:left;font-weight:700;font-size:15.5px;margin:18px 0 8px;color:var(--brand-deep)}
.apa-p{margin:0 0 10px;text-indent:2em;text-align:justify}
.apa-item{margin:0 0 8px;padding-left:2em;text-indent:-2em;text-align:justify}
.apa-twrap{margin:16px 0 20px}
.apa-tnum{font-weight:700;font-size:14.5px;margin:0}
.apa-ttitle{font-style:italic;font-size:14.5px;margin:2px 0 6px}
.apa-tbl{width:100%;border-collapse:collapse;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font-size:13.2px}
.apa-tbl th{border-bottom:1px solid var(--ink);padding:6px 8px;text-align:left;font-weight:700;vertical-align:bottom}
.apa-tbl td{padding:6px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.apa-tbl tr:last-child td{border-bottom:0}
.apa-tnote{font-size:12.5px;color:var(--muted);margin:5px 0 0}
@media (max-width:1120px){
  .rm-fam-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rm-bento{grid-template-columns:1fr}
}
@media (max-width:1024px){
  .shell{grid-template-columns:1fr}
  #menu{display:inline-block}
  #side-nav{display:none;position:fixed;left:12px;right:12px;top:58px;z-index:40;max-height:75vh;box-shadow:0 12px 32px rgba(0,0,0,.22)}
  #side-nav.open{display:block}
  .panes{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .ebar{grid-template-columns:120px 1fr 75px}
  .rm-fam-grid{grid-template-columns:1fr}
  .apa-page{padding:18px 16px}
}
@media print{
  .top,#side-nav,.side,.fnav,.chips,.tool{display:none!important}
  .shell,.panes{display:block;padding:0}
  .doc-preview{max-height:none;border:0;padding:0}
}

        "s2_principle": "【場域進入（Gaining Access）與自願招募保護】\n研究團隊於第一階段量性數據分析完成後，透過兩家機構之護理部外部聯絡窗口（非受訪者之直屬考評主管）發送個別研究邀請函。為避免機構主管直接指派造成「順從偏誤（不敢批評系統）」或強迫參與，邀請名單與實際受訪名單對機構管理層完全保密；受訪者可自由選擇於下班時段在機構外獨立安靜會談室或線上加密視訊進行訪談，並提供每場 500 元超商禮券作為時間補償。",
        "s2_rel": "【Malterud 等（2016）五維度資訊力（Information Power）評估與樣本量辯護】\n1. 研究目的廣度（Aim）：窄而聚焦——專門針對「使用 AI 交班摘要時之信任判斷與查證策略」，非廣泛探討長照工作經驗。\n2. 樣本特定性（Specificity）：高——12 位受訪者皆為親身使用該套 AI 系統逾 3 個月之第一線交班人員，且經量性數據精準鎖定高、中、低三群體。\n3. 理論背景（Theory）：具明確科技接受與人機信任（Trust in Automation, Lee & See, 2004）概念導引。\n4. 對話品質（Dialogue）：由具臨床護理與質性訓練之訪談員依漏斗式提綱進行 45–60 分鐘深訪，對話具體深入。\n5. 分析策略（Analysis）：採跨個案主題分析（Braun & Clarke, 2006）。\n綜合上述五維度，本樣本具備高度資訊力；對照 Guest 等（2006）指出同質議題約 12 次訪談可涵蓋 92% 以上核心代碼，以及 Hennink 與 Kaiser（2022）系統性回顧指出個別訪談通常於 9–17 人達飽和，本研究規劃 12 人兼具學理依據與實證充足性。",
        "s2_val": "【資料飽和（Data Saturation）操作化判準與逐位新增代碼紀錄表（@ 3.1 s35）】\n本研究嚴格執行「邊收案、邊轉錄、邊編碼」，拒絕事後空泛宣稱飽和。停止收案之操作化定義為：「當新增受訪者不再產生新的初始代碼（Initial Codes）與子主題，且連續續訪 2 位受訪者新增代碼數均為 0 時，即判定達成資料飽和」。\n・實際飽和軌跡紀錄（列於論文附錄三）：\n  第 1 位（P01）：新增 19 個代碼 ｜ 第 2 位（P02）：新增 12 個代碼 ｜ 第 3 位（P03）：新增 8 個代碼\n  第 4 位（P04）：新增 6 個代碼  ｜ 第 5 位（P05）：新增 5 個代碼  ｜ 第 6 位（P06）：新增 3 個代碼\n  第 7 位（P07）：新增 2 個代碼  ｜ 第 8 位（P08）：新增 2 個代碼  ｜ 第 9 位（P09）：新增 1 個代碼（累積共 58 個代碼、4 大主題全數成形）\n  第 10 位（P10）：新增 0 個代碼 → 啟動飽和確認，續訪第 11 位（P11，新增 0 碼）與第 12 位（P12，新增 0 碼），連續 3 位新增代碼數為 0，正式確認於第 12 位達成資料飽和。",
        "s3_assign": "【資料蒐集程序、雙機錄音與前導試訪修訂紀錄（@ 3.1 s19, s73–74）】\n1. 訪談時長與環境：每位受訪者進行單次一對一半結構深度訪談，時長 45 至 60 分鐘（平均 52 分鐘），於獨立隔音會談室進行，現場僅訪談員與受訪者兩人。\n2. 雙機錄音備援：經書面同意後，現場同步開啟 Sony 專業錄音筆（主機）與開啟飛航模式之加密平板錄音 App（備援機），防範單機故障或音訊遺失。\n3. 前導試訪與提綱修訂軌跡（Pilot Run）：前 3 位受訪者（P01–P03）訪談結束後，研究團隊立即檢視逐字稿，發現原提綱主體二「您如何評估 AI 摘要的準確度？」用語過於學術，受訪者傾向簡答「還算準」。遂於 v2 版提綱將該題具體化改寫為「什麼情況下您看完 AI 摘要，還是會回頭去看原始紀錄？」，成功引出豐富的臨床查證情境；v1 與 v2 提綱對照表完整保留於附錄一。",

        "s3_ext": "【參與觀察田野筆記三欄分離（@ 3.1 s30）與多來源三角檢證】\n除 12 場深度訪談外，研究者於早班交接時段（07:45–08:15）及小夜交接時段（15:45–16:15）進行共 8 場次護理站非參與觀察，依 Emerson 等（2011）規範撰寫三欄式田野筆記：\n・第一欄【時間／地點】：如 `2026/11/12 07:52｜A 機構 2F 護理站`。\n・第二欄【客觀描述（看到的、聽到的，零評論）】：如 `早班護理師 P05 看平板 AI 摘要約 25 秒，隨即點開 HIS 原始生命徵象頁面查閱 205 床，轉頭問大夜班：「205 床昨晚體溫 37.8 度，摘要怎麼只寫生命徵象平穩？」`\n・第三欄【研究者反思與推測】：如 `印證訪談所言，AI 將微燒歸類為平穩而省略數值，正是觸發跨班口頭二次確認的導火線！`\n透過「深度訪談（受訪者怎麼說）× 現場觀察筆記（交班時實際怎麼查）× 案例 Q 系統後台修改Log」三方三角檢證，確保證據鏈立體收斂。",
        "s4_pop": "【逐字稿產製四階段標準工序（@ 3.1 s19, s21）】\n1. 雙機錄音與加密歸檔：訪談結束當日將音檔以標準規則命名（如 `CaseL_INT05_20261115.wav`）存入離線加密硬碟。\n2. 第一階段逐字轉譯（保留口語質地）：於訪談後 48 小時內逐字轉錄，完整保留語助詞（「嗯…」「吼」）、停頓秒數（`（停頓 3 秒）`）、情緒反應（`（苦笑）`、`（嘆氣）`）與語氣重音，絕不擅自刪改為流暢書面語。\n3. 第二階段聽音校對：由第二位研究人員一邊播放原始錄音、一邊逐行核對轉譯稿；遇環境雜音致無法百分百確認之字詞，統一標記為 `〔聽不清 00:24:12〕`，嚴禁憑空猜測補字。\n4. 第三階段三碼匿名化：將所有受訪者姓名替換為「流水號—性別—職類」三碼代號（如 `P05-F-RN` 代表第 5 位受訪、女性、護理師；`CW` 為照服員、`HN` 為護理長），文內提及之機構名改為 `〔A 機構〕`、住民床號改為虛擬代號。真實身分與三碼對照表由計畫主持人單獨加密鎖入保險箱，後續 QDA 軟體分析僅使用純匿名版逐字稿。",
        "s4_sampling": "【質性分析五原則與 Braun & Clarke 六步驟／分層逐步歸納四階梯（@ 3.1 s32–33）】\n本研究遵循質性分析五原則（目的驅動、系統性、可驗證、從第一場開始邊收邊編、飽和為終點），採開源免費質性分析軟體 Taguette（並匯出 Excel 稽核表，@ 3.1 s37, s72）執行 Braun & Clarke（2006, 2019）六步驟主題分析，其中第 2 至 5 步直接對應分層逐步歸納四階梯：\n・步驟 1（熟悉資料）：兩位研究者反覆沉浸閱讀每份逐字稿 2–3 遍，撰寫初步閱讀備忘。\n・步驟 2（產生初始代碼 → 階梯① 代碼 Code）：逐句檢視語錄，貼上貼近受訪者原話之短標籤（全案共萃取 58 個初始代碼）。\n・步驟 3（聚合為意義單元與子主題 → 階梯② 單元 Unit ＆ 階梯③ 子主題 Sub-theme）：將相似代碼聚合成 18 個意義單元，再向上收斂為 8 個子主題。\n・步驟 4–5（檢視、定義並命名主題 → 階梯④ 核心主題 Theme）：跨全部 12 份逐字稿反覆檢驗主題內部同質性與外部異質性，最終提煉出 4 項核心主題。\n・雙人獨立編碼：前 4 份逐字稿（33.3%）由兩位研究者獨立編碼，初始代碼一致率達 86%，針對 8 處歧異回溯逐字稿上下文討論達成 100% 共識後，定案編碼簿 v2 並完成其餘 8 份編碼。",
        "s4_power": "【真實語錄分層四階編碼實作示範（語錄 → 代碼 → 意義單元 → 子主題 → 主題，@ 3.1 s22–23, s34）】\n・原始語錄節錄（INT05，P05-F-RN，p.7 L08–15）：\n  L08：「系統幫我把白班小夜三天紀錄縮成一小段，真的省掉很多打字時間啦。」\n  L09：「可是…（停頓 2 秒）只要看到摘要寫『生命徵象穩定』或『情緒尚可』這種籠統的話，」\n  L10：「然後後面沒附上血壓跟體溫數字，我就會心毛毛的！」\n  L11：「萬一他穩定是收縮壓 92 剛剛好及格邊緣呢？我哪敢直接信？」\n  L12：「所以我還是會手賤點開原始護理紀錄再看一眼，或者直接轉頭問夜班學妹：『欸 5 床昨晚血壓到底多少？』」\n・四階梯歸納軌跡：\n  ① 初始代碼（Code）：L08 → `〔濃縮文字省打字〕`；L09–10 → `〔定性摘要缺具體數值致不安〕`；L11 → `〔擔憂臨界異常被平穩字眼掩蓋〕`；L12 → `〔點開原紀錄複查〕`、`〔轉頭向交班者口頭二次確認〕`。\n  ② 意義單元（Unit）：後四碼聚合為 `〔對定性黑箱摘要之防禦性雙重查證〕`。\n  ③ 子主題（Sub-theme）：`2-1 關鍵生理數值被省略引發跨班口頭追問與回查`。\n  ④ 核心主題（Theme）：`主題二：不敢全信，所以再看一次原紀錄`（直接解釋案例 Q 二次確認詢問顯著增加 +0.60 次之機制）。",
        "s4_scenarios": "【編碼簿（Codebook）核心代碼定義與防混淆對照表（@ 3.1 s37 範本格式）】\n1. 代碼 A：`〔定性摘要缺數值致回查〕`（歸屬主題二）\n   ・定義：受訪者因 AI 摘要僅呈現定性結論（如「穩定」「正常」）而未列出具體生理數值或趨勢，產生不確定感而回頭查閱原始紀錄或口頭詢問。\n   ・納入判準：明確提及因缺乏數字、劑量或檢驗值而不敢直接採信摘要之段落。\n   ・排除判準：若受訪者是因為「摘要根本完全漏寫某件家庭／情緒事件」而抱怨，不貼此碼 → 改貼代碼 B `〔非結構化個別脈絡遺漏〕`。\n   ・典型例句：「只要看到摘要寫『生命徵象穩定』但沒附上血壓數字，我就會心毛毛的」（INT05 p.7 L09）。\n2. 代碼 B：`〔非結構化個別脈絡遺漏〕`（歸屬主題三）\n   ・定義：受訪者指出 AI 摘要過度聚焦標準生理項目，卻過濾掉住民家庭動態、情緒地雷或特殊照護偏好等非結構化交辦事項。\n   ・納入判準：提及家屬互動、住民心情轉折、個別安撫技巧被 AI 摘要省略之段落。\n   ・排除判準：若是生理數據被概括化（而非情緒／家庭事件被漏掉），不貼此碼 → 改貼代碼 A。\n   ・典型例句：「3 床阿嬤昨晚因為孫子沒來偷哭，這種情緒地雷摘要常漏掉，但這正是我最想交代的事」（INT08 p.6 L22）。",
        "s5_layout": "【Lincoln & Guba（1985）可信性四準則（Trustworthiness）具體執行計畫（@ 3.1 s39–40）】\n1. 可信度（Credibility，相當於內在效度）：\n   ・成員檢核（Member Checking）：於四項核心主題與子主題初稿完成後，將 2 頁式圖文摘要送交 4 位不同職類受訪者（P02 護理師、P05 護理師、P08 照服員、P11 護理長）檢視；4 位均確認主題精準反映其心聲，其中 1 位補充了夜班與白班查證時間壓力的差異，已納入主題二修正。\n   ・三角校正（Triangulation）：執行「資料來源與方法三角校正」，將訪談語錄與 8 場護理站現場觀察田野筆記、以及案例 Q 之量化二次確認數據進行交叉比對。\n2. 可轉移性（Transferability，相當於外在效度）：\n   ・厚描述（Thick Description）：於方法章與結果章表 1 詳實記述 A（120 床）、B（96 床）兩家住宿式長照機構之護病比、交班資訊系統架構，以及 12 位受訪者之職類、年資、班別與系統使用頻率，供其他長照機構讀者評估脈絡相似性。\n3. 可靠性（Dependability，相當於信度）：\n   ・稽核軌跡（Audit Trail）：透過 Taguette 與版本控管資料夾，完整留存訪談提綱修訂（v1→v2）、編碼簿三次改版紀錄（v1 初始 64 碼 → v2 合併為 58 碼 → v3 定案 18 單元 4 主題）與 18 則分析備忘錄，讓外部審查者能沿跡複核。\n4. 可確認性（Confirmability，相當於客觀性）：\n   ・雙人獨立編碼與反例呈現：前 4 份逐字稿（33.3%）由兩位研究者獨立編碼並協商分歧；結果章每一主題均嚴格標注三碼代號與逐字稿頁碼行號，並主動呈現少數派反例語錄，證明結論源自資料而非研究者偏見。",
        "s5_clean": "【研究者反思性（Reflexivity）三件套落實紀錄（@ 3.1 s38）】\n1. 反思日誌（Reflexive Journal，共 12 則，每場訪談當晚撰寫）：\n   ・摘錄（2026/11/10 第 2 場訪談後）：「今天受訪者 P02 知道我們團隊有參與評估這套 AI 系統，前 10 分鐘一直客氣地說『系統很棒』。直到我主動分享『其實我們在數據裡發現大家用完還是常回頭問學姊，我們很想知道哪裡不好用才能幫大家改』，她才鬆一口氣開始講真話。提醒自己後續每場開場都要先破除『官方考核』印象！」\n2. 分析備忘錄（Analytic Memo，共 18 則，編碼過程隨時記錄）：\n   ・摘錄（Memo #09，2026/11/22）：「比較 P03（年資 1 年）與 P11（年資 14 年）的代碼時發現強烈對比：新人把 AI 摘要當成『教我怎麼交班的標準範本』，資深人員卻覺得『AI 打亂我自己腦袋裡的交班順序』。這能否解釋為何 B 機構（資深人員占比高）的 180 日流失率高達 39.3%？已單獨拉出成為第 4 個候選主題！」\n3. 方法章研究者立場聲明（Positionality Statement）：\n   ・公開揭露第一作者之健康科技研究背景與第二作者之臨床長照護理背景，說明兩人如何透過「科技視角 × 臨床視角」之交叉辯論平衡詮釋偏誤，且所有訪談員與受訪者均無任何行政隸屬或考評關係。",
        "s5_desc": "【研究倫理審查（IRB/REC）、知情同意與脆弱保護（@ 3.1 s27）】\n1. 倫理審查：本研究計畫（含案例 Q 與案例 L 兩階段）經國立成功大學人類研究倫理審查委員會（REC）審查通過（核准案號：NCKU-HREC-2026-089）。\n2. 書面知情同意：訪談前逐條說明研究目的、45–60 分鐘時長與雙機錄音用途，由受訪者親簽知情同意書（拆解條款見 @ 3.1 s27）。\n3. 職場權力保護與自主撤回權：強調參與與否及訪談中對資訊系統之任何負面批評，絕對不會回報予機構主管或影響其績效考核；受訪者可於訪談中途隨時要求暫停錄音或於會後撤回部分語錄。\n4. 隱私與資料安全：轉譯過程立即以三碼代號去識別化，涉及住民隱私之床號與病史細節全數模糊化處理；原始錄音檔與加密身分對照表分開儲存於無網路連線之密碼硬碟，研究發表後滿 3 年依法銷毀。",
        "s5_assump": "【生成式 AI 輔助質性研究之合規分工與揭露聲明（@ 3.1 s41–43, s62）】\n本研究遵循課程學術誠信規範，於質性研究流程中適度運用生成式 AI（Claude 3.5 Sonnet）作為輔助工具，並嚴守四條紅線：\n1. 收集前（提綱模擬 Pilot Run）：將訪談提綱 v1 輸入 AI 扮演「資深忙碌且對新科技抱持懷疑之長照護理師」進行模擬問答，據以預先調整生硬措辭（@ 3.1 s28）。\n2. 收集後（去識別化紅線）：嚴格遵守「未經去識別化之原始逐字稿絕不上傳雲端 AI」紅線；所有逐字稿均先由研究人員於本地端完成三碼匿名化與機構名遮蔽後，方選取部分匿名段落進行測試（@ 3.1 s29）。\n3. 分析階段（AI 充當第二編碼比對參考）：針對已去識別化之 15 段代表性語錄，請 AI 依研究問題提供初始代碼建議並與人類編碼者產生比對表（@ 3.1 s41–43）；其中 AI 建議之「定性詞彙掩蓋數值風險」獲研究團隊採納修訂入編碼簿，惟所有最終代碼定義、子主題聚合與四大核心主題命名均 100% 由研究團隊親自討論定奪。\n4. 寫作階段（誠信揭露）：方法章與結果章之所有論述與混合後設推論均由作者親自撰寫，絕不交由 AI 代寫，並於論文末附完整 AI 使用日誌。",

        "s6_mult": "【反例呈現（Negative Cases）與量質不一致（Discordance）之深度處理（@ 3.1 s58；@ 3.2 s25）】\n1. 質性內部反例呈現（遵循語錄規則 5）：\n   在「主題二：因缺乏具體數值而不敢全信」中，多數護理師強烈要求摘要必須保留血壓與體溫數字；然而，本研究主動呈現 2 位新進照服員之反向觀點（Negative Case），彼等表示過多醫療數值反而造成閱讀負擔，偏好定性行動指示（「我們照服員不用看那麼多血壓數字啦，它直接告訴我今天翻身要注意哪一床就好」，P03-M-CW，INT03 p.4 L18）。此一反例證明對 AI 摘要的信任判準並非鐵板一塊，而是受到「專業角色職責（醫療監測 vs 生活照護）」之調節。\n2. 量質不一致發現三步處理（對應主題三 × 案例 Q 完整性分數）：\n   ・第一步（檢視方法與工具限制）：為何量性紀錄完整性總分未降（+0.52 分，非劣性成立），質性受訪者卻強烈抱怨「漏掉最想交代的事」？回頭檢視案例 Q 之 0–20 分紀錄完整性評分表題項，研判其配分可能偏重生理徵象、用藥與管路等結構化項目，對心理社會面之交辦較不敏感（須逐題核對配分後確認）。\n   ・第二步（重新檢視脈絡）：長照機構與急性醫院不同，住民長期居住，家屬互動與情緒波動往往才是引發跨班客訴或照護衝突的核心。\n   ・第三步（轉化為新科學洞察）：此「不一致」非但不是研究失敗，反而揭露了「直接移植急性醫療 SBAR 量表評估長照 AI 系統之效度盲點」，成為本研究最具原創性之後設推論。",
        "s6_apa": "【APA 第 7 版質性結果章與混合整合寫作示範（嚴格遵循 @ 3.1 s58 語錄六規則）】\n\n第四節　質性主題分析結果與量質共同展示（Joint Display）\n\n本研究針對 12 位跨職類照護人員之深度訪談逐字稿進行主題分析，共提煉出四項核心主題與八項子主題（表 2）：（一）省下的是打字，不是判斷；（二）不敢全信，所以再看一次原紀錄；（三）摘要漏掉的，正是我最想交代的；以及（四）新人依賴它，資深者繞過它。以下依「主題先行、語錄佐證、正反並陳」原則呈現代表性發現。\n\n主題一：省下的是打字，不是判斷\n多數受訪者肯定生成式 AI 摘要工具在「跨班次自由文字濃縮」與「減少重複打字」上之顯著效益，此與第一階段量性研究發現交班準備時間平均縮短 5.37 分鐘（dz = 1.08）高度一致。然而，受訪者普遍將交班工作明確切割為「機械性文書彙整」與「臨床異常推理」兩個層次，強調 AI 僅能代勞前者，而針對住民微小生理變化之病因推敲與處置決策，仍須百分之百仰賴照護人員之專業判斷：\n「它幫我把三天紀錄濃縮成五句話，打字真的快很多…但阿伯今天呼吸有點喘是不是肺炎前兆，這還是要我自己判斷啊。」（P02-F-RN，INT02 p.4 L18–21）\n\n主題二：不敢全信，所以再看一次原紀錄\n儘管文書準備時間縮短，多數護理師與資深照服員在接班閱讀 AI 摘要時，卻發展出「防禦性雙重查證」習慣。當 AI 摘要將連續數值概括為「生命徵象穩定」「進食尚可」等定性詞彙而未附原始數據時，接班者易產生黑箱焦慮，進而點開原始紀錄核對或直接向交班者口頭追問：\n「只要看到摘要寫『生命徵象穩定』但沒附上血壓數字，我就會心毛毛的…萬一他穩定是收縮壓 92 剛剛好及格邊緣呢？所以我還是會點開原始紀錄再看一眼，或直接轉頭問夜班學妹。」（P05-F-RN，INT05 p.7 L09–13）\n相對地，少數負責生活照顧之新進照服員則持不同觀點（反例），認為定性摘要已能滿足其照護需求，無須逐一查核醫療數值：「我們照服員不用看那麼多血壓數字啦，它直接告訴我今天要注意哪一床就好」（P03-M-CW，INT03 p.4 L18）。此一由「定性概括引發之查證需求」，具體解釋了量性階段為何在準備時間縮短之際，接班二次確認詢問次數反而顯著增加 0.60 次（p = .014）。\n\n主題三：摘要漏掉的，正是我最想交代的\n在交班內容品質方面，質性發現修正了量性非劣性檢定之樂觀結論。多位受訪者指出，AI 模型傾向保留體溫、血壓、換藥等結構化醫療詞彙，卻頻繁過濾掉住民情緒波動、家屬特殊抱怨或個別化安撫技巧等非結構化脈絡：\n「3 床阿嬤昨晚因為孫子沒來偷哭，這種情緒地雷摘要常漏掉，但這正是我交給白班最想交代的事！白班不知道，進去講錯話阿嬤就會整天拒食。」（P08-M-CW，INT08 p.6 L22–25）\n透過 Joint Display（表 3）進行量質整合可見，量性 SBAR 完整性總分雖未下降，研判係因該量表配分可能偏重生理醫療項目，對長照場域至關重要之「社會心理與家庭動態交辦」敏感度不足。",
        "s6_interp": "【研究貢獻、研究限制與實務建議】\n1. 核心學術與實務貢獻：\n   ・展現「質性平行軌（案例 L）× 量性主軸（案例 Q）」之互補價值：單看量性以為系統大獲全勝（省時 5.37 分鐘且完整性不劣），加入質性才揭露「省下的是打字不是判斷」「黑箱焦慮引發二次追問」與「軟性情緒資訊被過濾」三大深層機制。\n   ・提出三項具體系統改版設計：① 介面改採「定性結論＋括號附關鍵數值區間」並支援點擊展開原紀錄（Hover-to-Source）；② AI 提示詞增設「住民情緒與家屬互動地雷」必填欄位；③ 提供新進人員完整版與資深人員極簡版之雙模式切換。\n2. 研究限制（對齊 COREQ 與 GRAMMS 第 5 項）：\n   ・脈絡轉移性邊界：本研究場域為北部兩家 100 床規模之住宿式長照機構，結果轉移至急性醫院加護病房或居家長照場域時須考量護病比與資訊系統差異。\n   ・時序影響限制：質性訪談於系統導入滿 12 週後進行，受訪者對初期適應挫折之描述可能受回憶偏誤或已知量性省時結果影響。"
      }

        "s1_rq": "【核心現象學研究問題】\n早發性失智症（Young-Onset Dementia, 65 歲以前發病）患者之家庭主要照顧者，在面對正值壯年之伴侶或父母確診後的首年歷程中，如何經驗並詮釋其日常「生活世界（Lifeworld）」的斷裂、親密關係角色的異化，以及如何在不可逆的認知退化中重構照顧的存在意義？\n【具體探索維度】\n1. 時間性（Temporality）與空間性（Spatiality）：確診初期如何衝擊照顧者對中年生涯規畫與家庭空間安全感之主觀體驗？\n2. 關係性（Relationality）與身體性（Corporeality）：當壯年伴侶／父母逐漸喪失記憶與自理能力時，照顧者如何經驗「熟悉的陌生人」之關係張力與全天候警戒之身體負荷？\n3. 意義重構（Meaning Reconstruction）：照顧者如何在「活著的告別（預期性悲傷）」縫隙中，尋回非語言的情感連結與自我存在價值？",
        "s1_why": "【實務脈絡與為何必須採用現象學】\n台灣早發性失智症（45–64 歲發病）人口逐年上升，患者發病時往往仍是家庭經濟支柱或育有就學子女。既有研究多採量化照顧負荷量表（如 Zarit Burden Interview）測量憂鬱與壓力分數，或與高齡失智症混為一談；然而，量化分數無法揭示「看著 54 歲的伴侶在眼前一點一點失去記憶與語言時，那種活生生告別的撕裂感與存在孤寂」。唯有透過現象學回到當事人主觀生活世界（Lived Experience），方能深刻理解其獨特心理創傷並發展具同理深度之支持介入。",
        "s1_h0h1": "【研究認識論立場：海德格詮釋現象學與雙重詮釋學（Double Hermeneutic）】\n本研究結合 Husserl 描述性現象學之「存而不論（Bracketing）」精神與 Heidegger、Smith 等（2009）之「詮釋現象學分析（Interpretative Phenomenological Analysis, IPA）」。\n認識論上主張人類經驗永遠鑲嵌於特定歷史、家庭與文化脈絡（在世存有 Dasein）；研究過程涉及「雙重詮釋學」——受訪者在訪談中努力賦予自身混亂痛苦經驗意義（第一重詮釋），而研究者則以同理與批判兼具之視角，試圖解讀受訪者如何詮釋其經驗（第二重詮釋）。",

        "s2_principle": "【場域進入與脆弱受訪者信任建立】\n經北部某醫學中心失智症共照中心與年輕型失智症家屬支持團體個管師轉介，由個管師先向符合條件之家屬簡介研究並徵得初步意願後，研究者方以電話聯繫。考量受訪者正處於高度情緒負荷期，訪談地點完全依家屬意願安排（於失智共照中心溫馨會談室進行，同時由中心提供患者 2 小時免費安全臨托喘息服務，讓家屬能無後顧之憂地傾訴）。",
        "s2_rel": "【Malterud（2016）資訊力評估與 IPA 樣本量辯護】\nSmith 等（2009）於《Interpretative Phenomenological Analysis》明確指出，IPA 強調對每一份逐字稿進行極度細膩之「個案內（Idiographic）描述性、語言性與概念性三層次分析」，樣本量過大反而會犧牲詮釋深度而流於表面主題統計，建議碩博士研究以 6–10 人之高同質樣本為佳。本研究招募 10 位親歷早發性失智確診初期衝擊之主要照顧者，平均訪談時長達 82 分鐘，每份逐字稿長達 18,000–25,000 字，對話品質與情緒深度極高，資訊力極為充沛。",
        "s2_val": "【現象學飽和判準與本質結構穩定度紀錄】\n在現象學研究中，飽和並非指「所有人的小故事細節一模一樣」，而是指「構成該生活經驗本質之核心結構維度（Essential Structural Dimensions）已完整浮現，新個案不再改變既有本質結構」。\n・本質維度收斂紀錄：第 1–6 位受訪者逐步浮現 34 個意義單元與 3 大本質主題群集（時間斷裂與活著的告別、伴侶到守夜人的角色異化、遺忘縫隙中的非語言愛與和解）；第 7–8 位豐富了子主題之隱喻細節但未產生新群集；第 9、10 位受訪者之重要意義陳述 100% 落入既有三項本質結構中，新增本質維度數為 0，確認達成現象學飽和。",
        "s3_assign": "【深層現象學訪談程序與情緒支持防護】\n1. 訪談時長與節奏：每位受訪者進行 70–95 分鐘之深層現象學訪談；不同於一般結構化問答，訪談員採「跟隨受訪者敘說脈絡（Following the participant's lead）」原則，給予充裕沉默與流淚空間。\n2. 雙機錄音與非語言脈絡筆記：全程雙機錄音，訪談員於結束後 2 小時內記錄受訪者之語調起伏、嘆氣、握拳、停頓秒數與眼淚等身體化情緒線索，併入逐字稿括號標記。\n3. 心理安全網：現場備有面紙與溫水，若受訪者談及悲傷處情緒潰堤，立即暫停錄音進行同理安撫，確認其意願後方繼續；會後提供臨床心理師免費諮商轉介資訊。",
        "s3_blinding": "【研究團隊分工與詮釋學循環討論】\n・第一作者（主訪談與初階詮釋者）：執行全部 10 場深訪、逐字轉譯與個案內三層次註記（描述、語言、概念）。\n・第二作者（精神衛生護理專家）：獨立審閱前 4 份逐字稿之重要意義陳述萃取與建構意義，挑戰第一作者是否過度投射臨床醫學框架。\n・詮釋學循環會議（Hermeneutic Circle Meetings）：每完成 2 個個案即召開討論會，在「單一語句隱喻 ⇄ 整份個人逐字稿 ⇄ 跨個案本質結構」間反覆來回檢證。",

        "s3_ext": "【非語言身體化線索紀錄（Embodied Field Notes）與雙重詮釋備忘】\n於現象學研究中，受訪者「怎麼說（語調、停頓、隱喻、肢體）」與「說了什麼」同等重要。每場訪談後立即撰寫結構化觀察與詮釋筆記：\n・【客觀非語言觀察】：如 `P01 談及陪先生去辦提早退休手續時，雙手緊緊絞住面紙長達 40 秒，眼神望向窗外，中間停頓 6 秒後苦笑說：「別人的 55 歲在看環遊世界機票，我的 55 歲在看長照尿布目錄。」`\n・【語言性註記（Linguistic Note）】：以「環遊世界機票 vs 長照尿布目錄」之強烈對比隱喻，突顯與同齡朋友生命軌跡脫軌之相對剝奪感與荒謬感。\n・【概念性詮釋（Conceptual Note）】：此為「中年發展時鐘之強行錯置（Biographical Disruption in Midlife）」，構成主題一之核心基石。",
        "s4_pop": "【現象學逐字稿產製四階段規範（含非語言與情緒標記，@ 3.1 s19, s21）】\n1. 雙機高清錄音：確保連低聲啜泣與細微嘆氣皆清晰可辨。\n2. 現象學高保真轉譯：於 48 小時內由主訪談員親自或督導轉錄，除一字不漏保留口語外，嚴格標注停頓秒數（如 `…（停頓 5 秒）`）、情緒轉折（如 `〔聲音顫抖〕`、`〔自嘲乾笑〕`）與肢體動作，因這些正是進入受訪者內在生活世界的鑰匙。\n3. 第二人聽音校對：由協同研究者重聽音檔核對文字與情緒標記精準度。\n4. 三碼去識別化：統一編為「流水號—性別—關係角色」（如 `P01-F-Spouse`、`P07-F-Child`），隱去醫院、公司與居住地名稱。",
        "s4_sampling": "【Colaizzi（1978）七步法結合 Smith（2009）IPA 雙軌分析流程】\n本研究融合 IPA 之個案內深度三層次註記與 Colaizzi 七步法之結構化驗證，步驟如下：\n・步驟 1（反覆沉浸閱讀）：重聽錄音並熟讀單一個案逐字稿 3 遍，感受整體情緒基調。\n・步驟 2（萃取重要意義陳述 Significant Statements ＋ IPA 三層註記）：逐行標出與現象直接相關之關鍵語句（全案共萃取 142 條重要陳述），並於頁緣加註描述性、語言性（隱喻／語氣）與概念性註記。\n・步驟 3（建構隱藏意義 Formulated Meanings）：透過雙重詮釋，將受訪者原話轉化為揭示現象心理本質之建構意義（共 46 個建構意義單元），同時檢視未扭曲原意。\n・步驟 4（凝聚主題群集 Theme Clusters）：完成單一個案分析後，跨 10 位受訪者比對建構意義之共性與張力，聚合為 7 個子主題群集與 3 大本質主題。\n・步驟 5–6（撰寫詳盡描述與提煉現象本質結構）：撰寫融合全體經驗之本質結構總描述。\n・步驟 7（返回受訪者驗證 Member Checking）：將本質結構摘要寄回受訪者確認。",
        "s4_power": "【現象學四階詮釋實作示範（重要陳述 → 語言／概念註記 → 建構意義 → 主題群集 → 本質結構）】\n・原始重要陳述（INT01，P01-F-Spouse，p.5 L11–16）：\n  「醫師說他才 54 歲卻是阿茲海默症那一秒，診間外的聲音全部消失了…（停頓 4 秒，眼眶泛紅）我牽著他的手走去批價櫃檯，他的手還是溫熱的，可是我心裡卻覺得，身邊這個人正在一點一點蒸發，我已經開始在守一個活人的喪禮。」\n・現象學階層詮釋軌跡：\n  ① 語言與非語言註記：`『聲音消失』`（感官抽離與震驚）、`『溫熱的手 vs 正在蒸發』`（肉體尚存但精神消逝之強烈悖論隱喻）、`『守一個活人的喪禮』`（預期性悲傷之極致表達）。\n  ② 建構意義（Formulated Meaning）：壯年確診瞬間引發時間感凍結，照顧者深刻體驗伴侶「身體在場但主體性漸次消散」之模糊性失落與活生生的告別。\n  ③ 主題群集（Sub-theme Cluster）：`1-2 身體在場與心智消散間之『活著的告別』`。\n  ④ 本質主題（Emergent Essence）：`本質主題一：日常時間軸的斷裂與活著的告別`。",
        "s4_scenarios": "【現象學建構意義編碼簿（Codebook）與邊界區辨範例】\n1. 意義單元 A：`〔模糊性失落與活著的告別〕`（歸屬本質主題一）\n   ・定義：受訪者表達患者雖肉體健康存活於眼前，但其記憶、性格與過往共同歷史感正逐步消逝，引發無從正式哀悼之悲傷。\n   ・納入判準：出現「蒸發」「變成空殼」「最熟悉的陌生人」「漫長的道別」等體驗描述。\n   ・排除判準：若受訪者是在描述「因為怕他走丟或開瓦斯而必須全天候盯著他」之角色轉變與疲憊，不貼此碼 → 改貼意義單元 B `〔從親密伴侶異化為守夜監管者〕`。\n   ・典型例句：「他的手還是溫熱的，可是我心裡卻覺得身邊這個人正在一點一點蒸發」（INT01 p.5 L13）。\n2. 意義單元 B：`〔從親密伴侶異化為守夜監管者〕`（歸屬本質主題二）\n   ・定義：因安全風險與自理退化，原先對等之夫妻或親子關係被迫轉化為單向看管、警戒與控制，伴隨親密感喪失與孤立。\n   ・納入判準：描述居家環境改造監控、夜間不敢熟睡、自比為「獄卒／保母／警察」之語句。\n   ・排除判準：若聚焦於情感哀悼而非日常監控角色異化，改歸單元 A。",
        "s5_layout": "【Lincoln & Guba（1985）可信性四準則與 Colaizzi 第七步落實計畫】\n1. 可信度（Credibility）：\n   ・嚴格執行 Colaizzi 第七步「返回受訪者驗證（Member Checking）」：將提煉出之三大本質主題與詳盡結構描述整理為溫馨易讀之 3 頁手冊，邀請 5 位受訪者（P01, P03, P04, P07, P09）審閱並進行 20 分鐘電話回訪。5 位受訪者皆激動表示「完全寫出我們說不出口的心聲」，其中 P04 建議將「放棄期待」微調為「把期待縮小到今天平安就好」，已據以修正主題三內涵。\n2. 可轉移性（Transferability）：\n   ・提供 10 位早發性失智照顧者之年齡、關係、在職狀態、患者發病年齡（51–62 歲）與 CDR 分級之深厚脈絡描述，使讀者能判斷此本質結構於其他壯年失能家庭之共鳴與適用邊界。\n3. 可靠性（Dependability）：\n   ・建立完整之現象學詮釋軌跡表（142 條重要陳述 → 三層註記 → 46 個建構意義 → 7 個群集 → 3 大本質主題），並由指導教授與精神護理專家進行外部稽核（Inquiry Audit）。\n4. 可確認性（Confirmability）：\n   ・全程維持「存而不論（Bracketing）反思日誌」，每一項建構意義均強制綁定原始語錄頁碼行號與受訪者原創隱喻，杜絕研究者將教科書理論硬套於語料之上。",
        "s5_clean": "【現象學存而不論（Bracketing）反思日誌與分析備忘錄】\n1. 反思日誌（摘錄自第 4 場訪談後）：\n   「今天男性照顧者 P04 提到他把家門反鎖、覺得自己像『獄卒』時，我腦中第一反應是臨床護理師的警鈴：『這樣限制行動有沒有安全疑慮？要不要衛教他去申請防走失手鍊？』我立刻在心裡踩煞車，提醒自己現在是現象學研究者，不是門診衛教師。正因為我忍住沒打斷他做衛教，他下一句才哭著說出『每次鎖門那聲咔嚓，都像把我們三十年的夫妻尊嚴鎖死』——這才是現象學最珍貴的靈魂語料！」\n2. 詮釋備忘錄（Memo #12）：\n   「跨個案比對發現，無論是配偶或成年子女，和解的轉折點（主題三）幾乎都不是來自『想通某個大道理』，而是來自一個微小的『身體觸覺瞬間』（如患者拍拍女兒冰冷的手、先生替太太扣錯鈕扣卻露出憨笑）。『身體記憶超越大腦記憶（Embodied memory transcends cognitive loss）』應作為主題三之核心概念軸！」\n3. 方法章研究者立場聲明：載明研究者之神經內科護理背景如何協助理解疾病脈絡，以及如何透過存而不論日誌與雙人詮釋討論避免生物醫學化約論。",
        "s5_desc": "【研究倫理審查与高脆弱情緒受訪者保護】\n1. 倫理審查：經醫學中心人體試驗委員會（IRB）審查通過（案號：MMH-IRB-2026-112）。\n2. 創傷知情訪談保護（Trauma-Informed Interviewing）：早發性失智家屬承受極高心理悲傷，知情同意書明確載明受訪者擁有「隨時跳過不想回答的問題、隨時暫停休息、或無條件退出研究且絕不影響其在失智共照中心任何醫療照護權益」之權利。\n3. 免費喘息與心理轉介：訪談期間由共照中心專業人員免費照看患者，並與臨床心理中心建立綠色轉介機制；所有逐字稿以三碼代號去識別化，隱去可能暴露罕見早發個案身分之職業細節。",
        "s5_assump": "【生成式 AI 輔助現象學研究之嚴格限制與揭露聲明】\n考量現象學研究高度仰賴研究者對受訪者「生命受苦、停頓語氣與存在隱喻」之同理共感（Empathic Immersion），本研究對 AI 工具採取最高度節制原則：\n1. 訪談轉錄、重要陳述萃取與「雙重詮釋（建構意義與本質結構提煉）」100% 由研究者親自完成，絕不委由 AI 代勞，以防 AI 平滑化演算法抹去受訪者話語中的矛盾、哽咽與存在張力。\n2. AI（Claude 3.5）僅於兩個低風險環節輔助：① 收案前扮演虛擬家屬測試訪談問題是否過於生硬；② 於全數去識別化且研究者已完成初稿編碼後，請 AI 檢查是否有遺漏之反例段落（Negative Case Check）。所有詮釋權與文字撰寫完全歸屬人類研究者。",

        "s6_mult": "【世代角色差異（配偶 vs 成年子女）與反例張力剖析】\n儘管 10 位受訪者共同經歷上述三大本質結構，跨個案比較亦呈現關鍵之次群體張力與反例：\n1. 配偶 vs 成年子女之時間軸張力：配偶組（7 人）的斷裂感集中於「後半生共同退休藍圖的崩塌與夫妻親密感喪失」；而青年子女組（3 人，29–35 歲）則承受強烈的「生涯起步被凍結（同儕在結婚升遷，自己卻在幫 58 歲父親換尿布）」之世代孤立感（「我朋友週末在滑嬰兒車，我週末在推輪椅，我覺得我的三十歲還沒開始就已經老了」，P09-M-Child，INT09 p.8 L14）。\n2. 意義重構之未完成反例（Negative Case）：並非所有受訪者皆能順利抵達主題三之和解。受訪者 P06（照顧具強烈妄想與攻擊行為之額顳葉失智配偶）坦言自己仍困在深沉憤怒與耗竭中，無法感受到任何溫馨瞬間（「老實講，我現在每天只覺得他是一個長得像我先生的怪物，我還在等我自己先倒下」，P06-F-Spouse，INT06 p.14 L02）。誠實呈現此一反例，凸顯當患者合併嚴重額顳葉精神行為症狀（BPSD）時，單靠家屬內在意義重構並不足夠，必須有強力的醫療與機構緊急喘息介入。",
        "s6_apa": "【APA 第 7 版現象學結果章寫作示範（融合語言隱喻詮釋與語錄六規則）】\n\n第四節　早發性失智症家庭照顧者生活經驗之本質結構\n\n經由詮釋現象學分析（IPA）與 Colaizzi（1978）七步法之雙重詮釋循環，本研究自 10 位早發性失智症主要照顧者之深度訪談中，提煉出構成其確診初期生活世界之三項核心本質主題：（一）日常時間軸的斷裂與活著的告別；（二）從伴侶到守夜人的角色異化與孤立；以及（三）於遺忘縫隙中重拾非語言的愛與和解。\n\n本質主題一：日常時間軸的斷裂與活著的告別\n對正值壯年期（48–61 歲）之配偶與青年子女而言，早發性失智症的診斷並非漸進老化的自然延續，而是一場毫無預警的「生命傳記斷裂（Biographical Disruption）」。多位受訪者以感官抽離與時間凍結描述診間宣判之瞬間，並使用「蒸發」「空殼」等強烈隱喻，訴說伴侶肉體雖近在咫尺、共享之記憶與人格卻逐日消逝之「模糊性失落（Ambiguous Loss）」：\n「醫師說他才 54 歲卻是阿茲海默症那一秒，診間外的聲音全部消失了…（停頓 4 秒）我牽著他的手走去批價櫃檯，他的手還是溫熱的，可是我心裡卻覺得，身邊這個人正在一點一點蒸發，我已經開始在守一個活人的喪禮。」（P01-F-Spouse，INT01 p.5 L11–16）\n對青年子女而言，此種時間斷裂更表現為與同齡世代生命時鐘之錯置：「我朋友週末在滑嬰兒車，我週末在推輪椅，我覺得我的三十歲還沒開始就已經老了」（P09-M-Child，INT09 p.8 L14）。\n\n本質主題三：於遺忘縫隙中重拾非語言的愛與和解\n儘管承受劇烈的關係異化與安全監控負荷（主題二），多數照顧者在歷經數月之掙扎後，逐漸發展出跨越語言與認知退化的情感連結方式。當患者無法再叫出家人名字時，受訪者從微小的擁抱、眼神交會與體溫撫觸中，重新經驗到存留於「身體記憶（Embodied Memory）」中的愛：\n「後來他忘了我的名字，但那天我抱他時，他拍拍我的背說『妳手好冰，要穿暖』。那一刻我突然懂了，記憶不在了，但愛的本能還在。」（P07-F-Child，INT07 p.12 L19–22）\n然而，研究亦發現當患者合併嚴重額顳葉失智之攻擊與妄想症狀時，此一意義重構歷程將嚴重受阻（反例）：「老實講，我現在每天只覺得他是一個長得像我先生的怪物，我還在等我自己先倒下」（P06-F-Spouse，INT06 p.14 L02），顯示精神行為症狀之醫療控制乃照顧者能否達成心理和解之關鍵前提。",
        "s6_interp": "【現象學本質洞察、研究限制與臨床實務意涵】\n1. 核心理論與臨床貢獻：\n   ・突破傳統照顧負荷量表之數字扁平化，深刻揭示早發性失智家屬「中年時間軸斷裂」「伴侶異化為守夜獄卒」與「身體化記憶超越認知失落」三層存在結構。\n   ・指引台灣失智共照中心建立「分齡分流支持模式」：針對早發性家庭增設壯年職場家庭喘息專班，並於確診首月即介入「模糊性失落與非語言連結」心理輔導。\n2. 研究限制：\n   ・本研究聚焦於確診後 6–24 個月之輕中度階段且仍居家照顧之家屬，其經驗結構不宜直接外推至重度臥床期或已安置於住宿機構之照顧者；未來研究可採縱貫現象學設計追蹤同一批家屬 3–5 年之演變。"
      }
    },

        "s1_why": "【實務脈絡與理論缺口】\n北部兩家醫學中心急診部於 2026 年上線 AI 敗血症預警模組後，資訊室統計每位專師每個 12 小時班平均接收 31 次彈窗，其中被標示為「已評估、未處置」者占 78%。既有文獻多以科技接受模型（TAM）量表測量「使用意圖」，或以警示覆寫率（override rate）作為結果指標，卻無法解釋「同一位護理師為何有時立即抽血、有時一鍵關閉、有時表面簽核卻私下請住院醫師複查」。目前國內外均缺乏一個能說明急診第一線如何在警示疲勞中動態校準信任的實質理論，此即本研究採紮根理論之核心理由。",
        "s1_h0h1": "【認識論立場與方法學定位】\n本研究採 Strauss 與 Corbin（1998）程序化紮根理論，並參酌 Charmaz（2014）建構主義觀點：承認理論是研究者與參與者在互動中共同建構，而非從資料中「自然浮現」。研究不預設假設，而以理論抽樣、恆常比較與三階編碼，從資料歸納出能解釋「過程（process）」與「行動機制」的實質理論（substantive theory），並以理論圖呈現範疇間的條件—行動—結果關係。",

        "s2_rel": "【理論抽樣的樣本量辯護】\n紮根理論之樣本量不在收案前固定，而由「理論飽和」決定（Strauss & Corbin, 1998）。本研究初估 15–20 人，係參考紮根理論碩士論文常見範圍與 Hennink 與 Kaiser（2022）個別訪談 9–17 人之實證參考值；由於需比較「正確預警 vs 漏判」與「資深 vs 新進」兩組對照，故分三波收案，每一波的招募對象均由前一波之理論備忘錄決定。",
        "s2_val": "【理論飽和（Theoretical Saturation）判準與紀錄】\n判準：① 新資料不再產生新範疇；② 各範疇之屬性與維度已完整；③ 範疇之間的關係已可清楚陳述。\n紀錄：第 1 波（P01–P06）產生 64 個開放代碼與 9 個初步範疇；第 2 波（P07–P12）新增 18 個代碼並將範疇整併為 6 個主範疇；第 3 波（P13–P16）中，P13 新增「法律留痕焦慮」屬性，P14–P16 未再改變任何範疇之屬性與關係，於第 14 位起判定理論飽和，續訪 P15、P16 確認。",
        "s3_assign": "【資料蒐集程序】\n1. 深度訪談：每位 60–80 分鐘半結構訪談，雙機錄音；第 2、3 波訪談大綱依理論備忘錄增修追問題。\n2. 跟班觀察：研究者於兩院急診各進行 4 個班次（共 48 小時）非參與觀察，記錄彈窗出現後 60 秒內的行為。\n3. 文件：調閱去識別化之警示覆寫日誌（僅統計彙總，不含病歷）作為三角檢證。",

        "s3_ext": "【理論備忘錄（Theoretical Memos）與跟班觀察三角檢證】\n全研究共撰寫 28 則理論備忘錄，分為代碼備忘、範疇關係備忘與理論圖草稿三類。例如 Memo #11（2026/12/03）：「P09 描述漏判事件後『先瞄呼吸速率跟意識，五秒鐘快篩』，與 P04 的『看臉色』可能是同一範疇的不同維度——快篩的依據（客觀數值 vs 主觀臉色）。第 3 波應詢問新進專師是否也有快篩，或完全依賴他人。」\n跟班觀察筆記顯示：48 小時中共出現 87 次彈窗，其中 61 次於 10 秒內被關閉，與訪談中「看都沒看就按掉」的自述相符；另有 9 次專師先走到床邊看病人再回來處理，印證「五秒表徵快篩」策略。",
        "s4_pop": "【逐字稿產製】\n訪談後 48 小時內完成逐字轉譯（保留停頓、語氣與重疊發言），由第二人對照錄音校對，並改為三碼代號（如 P09-M-NP；NP = 專科護理師、RD = 住院醫師），醫院名改為〔甲院〕〔乙院〕。對照表加密另存。",
        "s4_sampling": "【三階編碼程序（Strauss & Corbin, 1998）】\n1. 開放編碼（Open Coding）：逐行分析，將資料概念化並找出屬性與維度，共產生 82 個概念。\n2. 主軸編碼（Axial Coding）：以典範模型（因果條件 → 核心現象 → 脈絡 → 中介條件 → 行動／互動策略 → 結果）重新連結概念，整併為 6 個主範疇、17 個副範疇。\n3. 選擇性編碼（Selective Coding）：撰寫故事線，提煉統攝全部範疇的核心範疇「在效率壓力與病安究責間動態校準臨床自主權」，繪製三階段歷程理論圖。\n全程以 ATLAS.ti 管理代碼、備忘錄與網絡圖，並以恆常比較法反覆比對事件與事件、事件與範疇。",
        "s4_power": "【三階編碼實作示範】\n・原始語錄（INT09，P09-M-NP，p.5 L03–09）：\n  「自從上個月有個不典型低血壓阿伯真的轉敗血性休克後，我現在看到警示會先瞄一眼病人的呼吸速率跟意識，五秒鐘快篩是不是狼來了。」\n・開放編碼：〔不良事件觸發警覺重置〕〔五秒臨床表徵快篩〕〔以呼吸與意識作為判準〕\n・主軸編碼（典範角色）：「不良事件」屬因果條件；「五秒快篩」屬行動策略；「判準為客觀數值或主觀臉色」為該策略之維度。\n・副範疇：發展雙軌直覺快篩與選擇性查證策略\n・核心範疇：在效率壓力與病安究責間動態校準臨床自主權（第二階段「關鍵事件觸發之表徵快篩期」）",
        "s4_scenarios": "【編碼簿範例（防混淆）】\n1. 概念 A〔選擇性覆寫〕\n   ・定義：專師基於自身臨床判斷，主動決定不依警示執行處置，並願意為此判斷負責。\n   ・納入：明確描述「我判斷不需要，所以按掉」。\n   ・排除：若按掉後私下請他人複查以分散責任 → 改貼概念 B。\n2. 概念 B〔防禦性雙保險〕\n   ・定義：表面完成系統要求之簽核，但因責任焦慮另尋他人複查。\n   ・納入：提及「怕被告」「系統有留紀錄」「私下請 R 看」。\n   ・排除：若複查原因是臨床上真的不確定（而非責任焦慮） → 改貼〔臨床不確定之求助〕。",
        "s5_layout": "【Lincoln & Guba 可信性四準則落實】\n1. 可信度：理論圖初稿送交 5 位參與者（資深 2、新進 2、住院醫師 1）檢視，均認為三階段歷程符合經驗；1 位新進專師補充「主治醫師在場時不敢覆寫」，已納入中介條件。並以訪談 × 跟班觀察 × 覆寫日誌三角檢證。\n2. 可轉移性：詳述兩院急診量、彈窗頻率（每班平均 31 次）與參與者年資分布，供讀者判斷理論能否轉移至其他 CDSS 場域。\n3. 可靠性：保留 28 則理論備忘錄、ATLAS.ti 專案檔各版本與三波抽樣決策紀錄。\n4. 可確認性：第二作者獨立進行 4 份逐字稿之主軸編碼，比對典範角色歸屬，歧異 6 處經討論達成共識；結果章每個範疇均附語錄與出處。",
        "s5_clean": "【反思性三件套】\n1. 反思日誌（第 5 場後）：「P05 說『那些警示都是垃圾』時我很想點頭附和，因為我自己也這樣想過。我刻意改問『有沒有哪一次它是對的？』，結果她講出一個救回來的病人，態度完全不同。這提醒我：我的經驗會讓我只聽見抱怨。」\n2. 分析備忘錄：記錄範疇關係的推論與待驗證假設（共 28 則）。\n3. 立場聲明：方法章揭露第一作者急診資歷，並說明以反例抽樣與第二編碼者降低影響。",

        "s6_mult": "【反例與理論邊界】\n2 位資深專師（P02、P06）始終未進入「麻木期」，原因是其所屬院區於上線初期即由主治醫師帶領每週檢討預警個案，使警示被視為團隊學習工具。此反例顯示「團隊檢討機制」可能是阻斷麻木期的條件，已補入理論圖之脈絡條件，並列為理論之適用邊界。",
        "s6_apa": "第四節　急診專科護理師面對 AI 預警之動態校準歷程\n\n選擇性編碼提煉出核心範疇「在效率壓力與病安究責間動態校準臨床自主權」，統攝三個階段：警示氾濫與麻木期、關鍵事件觸發之表徵快篩期、以及依年資分流之覆寫策略期（圖 2）。\n\n範疇一：警示氾濫與麻木\n上線初期，高頻率彈窗使多數專師將預警視為干擾而非資訊，逐漸形成「先關掉再說」的習慣。專師們並非不重視敗血症，而是擔心照單全收會排擠真正危急的病人：\n「敗血症預警一個夜班跳出三十幾次，八成都是假警報！如果每次都照單全收跑去抽乳酸，真正危急的病人反而沒空顧。」（P03-F-NP，INT03 p.4 L11–14）\n\n範疇三：依年資分流之覆寫策略\n在留痕制度與醫療責任焦慮的中介下，資深專師傾向為自己的判斷負責並選擇性覆寫；新進專師則發展出表面簽核、私下請人複查的防禦性策略：\n「我不像學姊敢直接按忽略，系統留紀錄萬一出事會被告；所以我表面上按『已評估』，私下還是先請值班 R 看一眼當雙保險。」（P14-F-NP，INT14 p.6 L12–15）\n然而，亦有資深專師所屬院區因每週團隊檢討預警個案，始終未出現麻木期（反例），顯示團隊學習機制為本理論之重要脈絡條件。",
        "s6_interp": "【理論貢獻、限制與建議】\n1. 理論貢獻：提出「動態校準臨床自主權」三階段歷程模型，補足以覆寫率或使用意圖衡量人機信任之不足。\n2. 實務建議：① 依急診量分層設定預警閾值；② 系統提供「覆寫理由快選」以降低新進人員之留痕焦慮；③ 建立每週預警個案團隊檢討。\n3. 研究限制：研究場域為兩家醫學中心，理論轉移至區域醫院或其他 CDSS 時須考量人力與文化差異；訪談依賴回溯，可能受最近事件影響（已以跟班觀察部分補強）。"

        "s1_rq": "【核心研究問題】\n偏鄉地區醫院在導入遠距居家安寧共照模式時，如何克服跨機構權責邊界、健保給付拆帳與家屬夜間緊急處置焦慮？成功落地與推展受阻之個案，其關鍵組織機制有何差異？\n【研究命題（Study Propositions）】\n命題一：高層主管親自跨機構建立信任，是基層診所願意接案的必要條件。\n命題二：硬體到位但給付與後送承諾未對齊時，設備將閒置。\n命題三：結合視訊共診與夜間後送通道，能降低家屬居家照護之孤立感。",
        "s1_why": "【實務脈絡】\n衛福部推動偏鄉遠距醫療計畫後，多家偏鄉醫院完成視訊設備建置，但各院居家安寧收案數差異懸殊。成果報告多以「設備建置率」呈現，無法解釋同樣拿到補助的醫院為何有的穩定運作、有的設備閒置。此問題涉及特定組織、特定時間的變革歷程，且現象與組織脈絡密不可分，適合以個案研究回答「如何」與「為何」。",
        "s1_h0h1": "【方法學定位】\n本研究採 Yin（2018）解釋性多重個案設計，以「醫院導入遠距居家安寧之專案」為分析單位，界定個案邊界為 2025 年 7 月至 2026 年 6 月、該院安寧團隊與合作基層診所及家屬。研究以事先提出之研究命題引導資料蒐集，並以逐項複製（literal replication）與理論複製（theoretical replication）邏輯比較三個個案。",

        "s2_rel": "【個案數與資料量辯護】\nYin（2018）指出多重個案研究之個案數取決於複製邏輯而非統計代表性：2–3 個逐項複製個案可提高結論穩定度，加入 1 個理論複製個案可檢驗反向條件。本研究 3 個個案、每院 6 位關鍵資訊提供者與多來源資料，足以支撐跨個案型態配對。",
        "s2_val": "【資料飽和與個案完整性】\n個案內以「三種來源對同一事件的描述是否收斂」判斷資料是否足夠；三院之訪談至第 5 位起未再出現新的落地障礙類別，第 6 位確認。跨個案以「命題是否得到一致或可解釋的支持」為判準。",
        "s3_assign": "【資料蒐集】\n1. 深度訪談 18 場（每場 50–70 分鐘），雙機錄音。\n2. 參與觀察 12 場：跨團隊會議 6 場、居家視訊查房 6 場，以三欄田野筆記記錄。\n3. 文件 24 份：專案計畫書、會議紀錄、結案報告、出院準備紀錄（去識別化）。\n所有資料統一編號（如 A-P01、B-Doc03、C-Obs05）存入個案研究資料庫。",
        "s3_blinding": "【個案研究計畫書（Protocol）】\n收案前完成個案研究計畫書，載明研究命題、每院欲蒐集之證據類型、訪談大綱與文件清單，確保三院資料蒐集程序一致；由指導教授審閱後執行。",

        "s4_power": "【個案內編碼示範】\n・證據（A-P01，安寧個管師，INT-A01 p.3 L08）：「一開始基層診所醫師根本不敢接末期病人，是我們副院長親自帶著團隊去診所開了三次聯合病例討論會，才把視訊會診熱線建起來。」\n・三角檢證：與 A-Doc04（跨院會議簽到冊，三次會議日期吻合）及 A-Obs02（視訊會診實況）相符。\n・個案內型態：高層親自跨界破冰與共同分攤責任。\n・跨個案主題：領導者跨組織邊界破冰是突破基層接案恐懼的關鍵槓桿（支持命題一）。",

        "s5_layout": "【可信性四準則】\n1. 可信度：三種來源三角檢證；個案報告初稿送交每院 1 位關鍵資訊提供者檢核，個案 B 窗口補充拆帳協議之最新進展。\n2. 可轉移性：詳述三院床數、服務人口、交通時間與團隊組成。\n3. 可靠性：個案研究計畫書、資料庫編號規則與 NVivo 專案檔完整保存。\n4. 可確認性：每項主張附資料庫編號；主動呈現與命題不一致之證據。",

        "s6_apa": "第四節　跨個案綜合分析\n\n跨個案三角檢證顯示，單靠硬體補助無法促成遠距安寧落地（主題二）。個案 B 之專案結案報告雖記載「遠距設備建置完成率 100%」（B-Doc03），惟會議觀察顯示三次會議均未討論收案，護理師訪談亦指出設備長期閒置：\n「因為健保申報拆帳沒談攏，加上半夜病人喘起來沒有綠色急診通道，基層醫師根本不敢開單。」（B-P03，INT-B03 p.4 L16–19）\n相對地，個案 A 與 C 均在導入前由院級主管親赴基層診所建立互信，並簽訂拆帳與後送協議，兩院之運作型態彼此吻合，構成逐項複製（主題一）。排除地理距離與人力規模等競爭性解釋後，給付協議與後送承諾仍是最能解釋三院差異的條件。",

        "s1_rq": "【核心研究問題】\n長照機構導入 AI 交班系統後，照護人員在真實護理站現場如何結合手機摘要、紙本紀錄與非正式口頭溝通完成交班？跨職類與年資權力關係如何形塑其日常交班實作？\n【子問題】\n1. 正式系統之外，存在哪些非正式交班實作與潛規則？\n2. 這些實作如何受到年資、職類與主管在場與否的影響？\n3. 照護人員如何詮釋這些實作的意義？",
        "s1_why": "【為何需要民族誌】\n交班系統的使用紀錄只能看到「誰點開了摘要」，訪談則容易得到「照規定做」的標準答案。研究者於前導觀察中發現，同一位照服員在訪談中說「都看手機摘要」，現場卻翻紙本並私下詢問。唯有長期浸泡於場域，才能看見言行落差與隱性文化。",
        "s1_h0h1": "【認識論立場】\n本研究採詮釋取向之聚焦型醫療民族誌（focused ethnography），認為交班實作是群體共享之文化規範與權力關係的展現。研究者以「參與者兼觀察者」身分進入場域，透過厚描述（thick description）詮釋行為背後的意義。",

        "s2_principle": "【場域進入】\n經機構主任與護理部同意，於員工大會說明研究目的；研究者配戴「研究觀察員」識別證，不介入照護。前 2 週為適應期，筆記不納入主分析，以降低霍桑效應。",
        "s2_rel": "【觀察量辯護】\n聚焦型民族誌之觀察時數通常較傳統民族誌短，以特定實作為焦點（Higginbottom et al., 2013）。本研究 16 週、120 小時、跨三班與平假日，並以 12 人訪談補充，足以描繪交班文化之主要型態。",
        "s2_val": "【文化型態飽和】\n以「新的實作型態是否出現」判斷：第 1–29 則筆記陸續辨識出 3 類實作型態（私下翻本、便利貼情報網、合規展演）與 9 個子型態；第 30–36 則未再出現新型態。",
        "s3_assign": "【資料蒐集】\n1. 參與觀察：研究者於護理站旁固定位置觀察，以小本子速記時間、動作與原話片段。\n2. 田野筆記：離開現場 24 小時內擴寫為三欄筆記。\n3. 半結構訪談：將觀察中的疑問帶入訪談追問，每場 40–60 分鐘。",

        "s3_ext": "【三欄田野筆記示範（FN04）】\n・時間／地點：10/12 07:52｜大夜交早班｜2F 護理站\n・客觀描述：早班照服員 A 低頭看手機 AI 摘要約 30 秒，走到推車旁翻開紙本紀錄核對 203 床，抬頭問：「學姊，3 床半夜真的有起來上廁所兩次喔？」大夜護理師 B 頭未抬：「都寫在摘要了，妳看手機就好。」A 點頭退開，未再發問。\n・反思：A 不完全信摘要而翻紙本；面對資深 B 的回應立刻噤聲。年資與職類權力差似乎壓抑了口頭確認，訪談 A 時追問。",
        "s4_pop": "【資料處理】\n田野筆記與訪談逐字稿均以三碼代號去識別化（如 P04-F-CW）；筆記中出現之住民以床號代號表示並再次模糊化。所有資料匯入 MAXQDA。",
        "s4_sampling": "【分析策略】\n參照 Spradley 之領域分析與 Emerson 等（2011）之田野筆記編碼：① 開放編碼標記行為與對話；② 聚焦編碼將相似實作歸為文化領域；③ 撰寫整合備忘錄連結觀察與訪談；④ 形成文化主題與厚描述。",
        "s4_power": "【觀察×訪談交叉編碼示範】\n・觀察（FN19，11/02 15:30）：護理長在場時，新進護理師 F 全程逐字朗讀平板 AI 摘要；護理長離開後，F 立刻拉住早班學姊小聲問了三個問題。\n・訪談（INT12，P12-F-RN 新進，p.5 L07）：「當著護理長的面照念，是因為試用期考核有一項是『系統使用熟練度』。」\n・聚焦編碼：〔主管在場時照讀摘要〕〔主管離開後私下補問〕\n・文化主題：主管在場時的「數位合規展演」與後台補課",
        "s4_scenarios": "【編碼簿範例】\n1. 〔私下翻本〕：看完系統摘要後，自行查閱紙本或 HIS 原紀錄。排除：若是詢問他人 → 改貼〔口頭確認〕。\n2. 〔便利貼情報網〕：以系統外紙條或口頭傳遞不願寫入系統之資訊。排除：若只是暫時抄寫、事後補登 → 改貼〔暫時記錄〕。",
        "s5_layout": "【可信性四準則】\n1. 可信度：長期浸泡（16 週）、觀察×訪談三角檢證、文化主題初稿送交 4 位參與者檢核。\n2. 可轉移性：厚描述機構規模、人力配置與交班流程。\n3. 可靠性：保留速記本掃描檔、擴寫筆記版本與分析備忘錄。\n4. 可確認性：描述與詮釋分欄；每項主題附筆記編號與訪談出處。",
        "s5_clean": "【反思性】\n反思日誌摘錄：「第 3 週起同仁開始跟我閒聊，也開始在我面前傳便利貼。我意識到自己被接納後，看到的東西才真正改變；但也提醒自己，被接納不代表可以把私下聊天寫進資料，凡涉及個人隱私者一律不記錄。」",
        "s5_desc": "【研究倫理】\n經人體研究倫理審查委員會審查通過（案號：NTUNHS-REC-2026-118）；所有被觀察人員簽署同意書，未同意者之行為不記錄；不錄音錄影；住民與家屬資訊不寫入筆記；研究結果不回報個人表現予機構主管。",

        "s6_mult": "【反例】\n3F 某組護理師與照服員年資相近且長期固定排班，觀察中未出現噤聲現象，照服員可直接質疑摘要內容。此反例顯示固定排班與年資相近可能降低階級噤聲，列為文化主題一之邊界條件。",
        "s6_apa": "第四節　交班現場的隱性文化\n\n參與觀察揭露了純訪談難以捕捉的「前台合規展演與後台私下查證」雙軌文化（主題三）。田野筆記顯示，當護理長在場巡視時，新進護理師全程逐字朗讀平板 AI 摘要並獲稱讚；護理長離開護理站後，新進人員旋即拉住早班學姊私下追問三項照護細節（FN19，11/02 15:30）。訪談中，該名護理師解釋：\n「當著護理長的面照念，是因為試用期考核有一項是『系統使用熟練度』。」（P12-F-RN，INT12 p.5 L07–09）\n此外，平輩資深人員之間存在一套不進入正式系統的便利貼情報網，專門傳遞家屬動態與情緒警訊（FN11）。然而，在固定排班、年資相近的 3F 小組中，照服員能直接質疑摘要內容（反例），顯示階級噤聲並非普遍現象，而與排班與年資結構有關。",
        "s6_interp": "【貢獻、限制與建議】\n1. 貢獻：揭示 AI 交班系統導入後，正式流程與非正式文化並存的雙軌實作，補足以系統紀錄評估使用之盲點。\n2. 建議：① 交班系統增設不納入考核之「非正式交辦」欄位；② 調整試用期考核指標；③ 推動固定小組排班。\n3. 限制：單一機構民族誌，轉移性須依讀者情境判斷；研究者在場仍可能影響行為，已以適應期與長期觀察降低。"

    "narrative_inquiry": {

      "tag": "⑥ 敘事研究（三維度敘事空間完整範例）",
      "label": "範例 ⑥：年輕乳癌存活者從生育保存、化療到重返職場之生命故事（8 人×2 次敘事訪談）",
      "desc": "完整示範敘事研究：招募 8 位 28–39 歲年輕乳癌存活者，各進行 2 次深度敘事訪談並繪製生命轉折線圖，以 Clandinin & Connelly 三維度敘事空間重組故事、以 Riessman 轉折點與情節結構分析提煉三種敘事原型，並與受訪者共構確認。",
      "data": {
        "design": "narrative_inquiry",
        "title": "年輕乳癌存活者歷經生育保存決策、化療身體意象衝擊至重返職場之生命故事：敘事研究",
        "domain": "腫瘤護理・存活者照護・敘事探究",
        "author": "許雅雯（碩士班研究生・學號 M11408006）",
        "advisor": "謝楠楨 教授（國立臺北護理健康大學 資訊管理系）",
        "date": "2026-10-30",
        "s1_rq": "【核心研究問題】\n40 歲以下年輕乳癌女性在確診至重返職場的兩年歷程中，如何敘說其生育保存抉擇、身體意象斷裂與職場身分重構的關鍵轉折點與生命意義？\n【子問題】\n1. 她們如何組織自己的疾病故事（起點、轉折、結局）？\n2. 哪些時刻被敘說為生命轉折點？轉折前後的自我認同有何改變？\n3. 家人、伴侶、醫療人員與職場如何參與她們的故事？",
        "s1_why": "【為何採敘事研究】\n年輕乳癌患者同時面臨生育、婚姻與職涯的關鍵時期。既有研究多以生活品質量表或橫斷面訪談呈現「某一時點的困擾」，難以看見同一個人從確診到重返職場的連續轉變。敘事研究以完整故事為分析單位，能保留時間順序與因果情節，回答「她們如何一路走過來」。",
        "s1_h0h1": "【認識論立場】\n本研究採 Clandinin 與 Connelly（2000）之敘事探究觀點，主張人以故事理解生命；研究者與受訪者在訪談中共同建構故事。分析結合 Riessman（2008）主題與結構分析，關注「說了什麼」與「怎麼說」。",
        "s1_causal": [
          [

            "確診後須在化療前短時間內決定是否凍卵；化療掉髮改變外觀；治療結束後面臨是否揭露病史、如何重返職場。"
          ],
          [

        "s1_zm": "【研究者位置】\n研究者為乳房外科病房護理師，熟悉治療流程，前理解為「病人最在意的是存活率」。訪談中刻意不引導至醫療話題，讓受訪者決定故事的起點與重點，並於反思日誌記錄自己被觸動或想打斷的時刻。",
        "s1_reject": [
          [
            "本研究採用：敘事研究",

        "s2_rel": "【樣本量辯護】\n敘事研究重視個別故事的深度與完整性，通常招募少數參與者並進行多次訪談（Riessman, 2008）。本研究 8 人、各 2 次、平均每次 85 分鐘，累計約 22 小時錄音，足以進行個案內重組與跨個案比較。",

        "s6_apa": "第四節　年輕乳癌存活者的生命故事\n\n三維度敘事分析顯示，化療前之自費凍卵決策在時間維度上具有超越生育的象徵意義（敘事原型一）。面對家屬「保命優先」的催促，多位受訪者將凍卵詮釋為在生命懸崖邊對未來存活的承諾：\n「我媽在走廊抓著我哭說『保命要緊，生什麼小孩』，但我看著超音波螢幕上的卵泡，覺得那是 32 歲的我留給未來唯一的一顆火種。」（P01-F-32y，INT01-1 p.6 L11–14）\n然而，並非所有故事都走向轉化。P08 未凍卵、治療後結束感情，至今仍隱藏病史：「我的故事還沒有轉折點」（P08-F-34y，INT08-2 p.7 L03）。此一未完成的故事提醒，復原敘事不是唯一出路。",

        "s6_apa": "第四節　照服員與家屬對智慧跌倒偵測之觀點比較\n\n跨分層焦點團體分析揭露兩群體對影像感測器之根本詮釋落差（主題一）。照服員場次提及客廳安裝 AI 鏡頭時，立即引發全場共鳴與抗拒：\n「說穿了哪是看阿公跌倒，根本是在盯我們有沒有滑手機偷懶啦！」（P04-F-CW，FGD-CW1 p.5 L12，全場 6 人同時點頭）\n相對地，家屬場次聚焦於照服員離開後長時間獨居的安全焦慮：\n「沒有畫面確認她平安，我開會手機一響心臟都會漏一拍。」（P15-M-Son，FGD-FM2 p.8 L04）\n少數照服員偏好不涉影像之手環（反例），顯示抗拒對象為影像而非偵測本身。兩群體最終均能接受「照服員在場時自動切換為雷達骨架模式」之折衷設計（主題三）。",

        "s4_power": "【FGD 編碼到草案修訂示範（@ 3.1 s22–23）】\n・代碼（7）：突發狀況頻繁｜情境不可預測｜判斷處置順序｜知道求助對象｜個案問題分析｜個案問題解決｜領導力與發展階段不符\n・單元（3）：〔臨場應變〕｜〔個案問題處理〕｜〔領導力不適齡〕\n・子主題：現場需要的是「處理問題」，不是「帶人」\n・主題：「問題解決與即興應變」才是高職生的核心能力\n・草案修訂：構面「領導力」改為「問題解決與即興應變」，下設指標「解決問題能力」；Delphi 第二回合再增「案例問題感知能力」。",
        "s4_scenarios": "【Delphi 雙閘共識判準（@ 3.1 s50）】\n・閘 1 重要性：平均數 M ≥ 3.5 或眾數 Mode ≥ 3\n・閘 2 一致性：四分位差 QD（＝IQR／2）< 1 或標準差 SD ≤ 1\n・兩閘都過 → 保留；M < 3.5 或 Mode ≤ 3，且 QD < 1 → 刪除／重寫\n・注意：原研究引 Burnette et al.（2003）為門檻依據；原文保留（Mode ≥ 3）與刪除（Mode ≤ 3）在 Mode＝3 時重疊，自訂判準時保留與刪除條件應互斥。",
        "s5_layout": "【可信性四準則】\n1. 可信度：三角驗證（FGD × Delphi × 文獻三方）、同儕檢視（@ 3.1 s39）。\n2. 可轉移性：詳述專家背景（學界／業界）與設科脈絡。\n3. 可靠性：保留編碼簿版本、草案修訂對照表與各回合問卷。\n4. 可確認性：每項修訂可回溯：主題 ← 子主題 ← 代碼 ← 語錄頁碼（@ 3.1 s36）。",
        "s5_clean": "【反思性】\n分析備忘錄：「學界與業界都提到『先看得出問題、再會處理』，兩場說法開始重複，這是快飽和的訊號。」反思日誌：「我原本認為領導力很重要，但業界的例子讓我修正了預設。」",
        "s5_desc": "【研究倫理】\n經研究倫理委員會審查；FGD 參與者簽署同意書（REC 焦點團體版，@ 3.1 s27）；三碼匿名編碼；Delphi 全程匿名。",
        "s5_assump": "【AI 使用聲明（依 @ 3.1 AI 範例規範）】\nAI 可用於提綱模擬、逐字稿清理（已授權且去識別化）、初始編碼建議與 Delphi 回合間統計整理；但取徑選擇、主題、共識判定與詮釋均由研究團隊定奪，並於方法章揭露（@ 3.1 s62）。",

        "s6_mult": "【不一致與限制】\nDelphi 產出的是「共識」不是「真理」——專家也可能集體出錯，須寫入研究限制（@ 3.1 s45）。此外，學界與業界在部分課程（如特色課程）之看法並不一致，研究分場呈現並說明整合方式。",
        "s6_apa": "第四節　焦點團體與德懷術結果\n\n經兩場焦點團體（N ＝ 20）之分層逐步歸納分析，業界專家普遍指出高職生於實習現場最迫切者為突發狀況處置，而非帶領團隊：\n「半夜阿伯突然喘起來，家屬又不在，他要知道先做什麼、打給誰。那個比較重要。」（P11-M-Mgr.，業界場，教學改寫）\n學界場亦出現「與其教帶團隊，不如教他看懂個案出了什麼問題」之呼應，故將原草案「領導力」構面修訂為「問題解決與即興應變」。接續三回合德懷術（N ＝ 10），第二回合依專家意見新增「案例問題感知能力」，指標由 14 項增為 15 項；最終 8 大構面、15 項能力指標與 26 門課程均通過重要性（M ≥ 3.5 或 Mode ≥ 3）與一致性（QD < 1 或 SD ≤ 1）之雙閘共識標準（Hsieh et al., 2022）。",

function esc(s){
  if(s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function filled(k){
  const v = S[k];
  if(Array.isArray(v)) return v.some(r=>Array.isArray(r)?r.some(c=>String(c).trim().length>0):String(r).trim().length>0);
  return v && String(v).trim().length > 0;
}

function stepPct(st){
  if(!st || !st.req || !st.req.length) return 0;
  const hits = st.req.filter(k=>filled(k)).length;
  return Math.round((hits / st.req.length) * 100);
}

function totalProg(){
  const contentSteps = STEPS.filter(s=>s.req && s.req.length);
  let totalReq = 0, filledReq = 0;
  contentSteps.forEach(st=>{
    totalReq += st.req.length;
    filledReq += st.req.filter(k=>filled(k)).length;
  });
  return totalReq > 0 ? Math.round((filledReq / totalReq) * 100) : 0;
}

function recDesignFromTree(){
  const { q1, q2 } = S.dt;
  if(q1 === "mixed") return "mixed_explanatory";
  if(q1 === "consensus") return "fgd_delphi";
  if(q1 === "group") return "fgd_study";
  if(q1 === "field") return "ethnography_obs";
  if(q1 === "narrative") return "narrative_inquiry";
  if(q1 === "theory") return "grounded_theory";
  if(q1 === "case") return "case_study";
  if(q1 === "indiv"){
    if(q2 === "essence") return "phenomenology_ipa";
    return "qual_thematic";
  }
  return "qual_thematic";
}

function gridHTML(k, cols, widths){
  const rows = Array.isArray(S[k]) && S[k].length ? S[k] : [cols.map(()=>"")];
  return `<div class="gwrap" data-grid="${k}">
    <table class="tbl">
      <thead><tr>${cols.map((c,i)=>`<th style="${widths&&widths[i]?`width:${widths[i]}`:""}">${esc(c)}</th>`).join("")}<th style="width:42px">刪</th></tr></thead>
      <tbody>
        ${rows.map((r,ri)=>`<tr>
          ${cols.map((_,ci)=>`<td><textarea data-gr="${k}" data-r="${ri}" data-c="${ci}" rows="2">${esc(r[ci]||"")}</textarea></td>`).join("")}
          <td style="text-align:center"><button type="button" class="btn sm" data-gdel="${k}" data-r="${ri}" title="刪除此列">✕</button></td>
        </tr>`).join("")}
      </tbody>
    </table>
    <button type="button" class="btn sm" data-gadd="${k}" data-cols="${cols.length}">＋ 新增一列</button>

}

function chipsHTML(itemOrArr, targetKey){
  if(!itemOrArr) return "";
  const arr = Array.isArray(itemOrArr) ? itemOrArr : [itemOrArr];
  const valid = arr.filter(t => t && String(t).trim().length > 0);
  if(!valid.length) return "";
  return `<div class="chips">${valid.map(t=>`<button type="button" class="chip" data-ins="${targetKey}" data-txt="${esc(t)}">＋ 帶入參考範本句型：${esc(t.slice(0,36))}…</button>`).join("")}</div>`;
}

// Malterud 資訊力互動試算
function malterudToolHTML(){
  const m = S.malterud || {aim:2, spec:2, theory:2, dialogue:2, strategy:2};
  const sum = (m.aim||2) + (m.spec||2) + (m.theory||2) + (m.dialogue||2) + (m.strategy||2);
  let powerLvl = "中等資訊力 (Moderate Information Power)";
  let estN = "建議樣本數：約 10–18 位參與者";
  let color = "var(--brand-deep)";
  if(sum >= 13){
    powerLvl = "高資訊力 (High Information Power) 🚀";
    estN = "建議樣本數：約 6–10 位參與者（樣本高度聚焦）";
    color = "var(--ok)";
  }else if(sum <= 7){
    powerLvl = "低資訊力 (Lower Information Power) ⚠️";
    estN = "建議樣本數：需約 20–35 位參與者方能達到飽和";
    color = "var(--warn)";
  }

  return `<div class="tool" id="malterud_tool">
    <h4>
      <span>🧮 Malterud (2016) 資訊力五維度試算器 &amp; 飽和度估算（對應 @ 3.1 s22–24）</span>
      <button type="button" class="btn sm ac" id="btn_apply_malterud" data-sum="${sum}" data-est="${estN}">一鍵將計算結果寫入下方樣本數欄位</button>
    </h4>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:10px">質性研究不依賴統計 Power，而以 Malterud 資訊力五維度評估達到研究目的所需之樣本深度：</p>
    <div class="grid g3">
      <div class="fld" style="margin:0"><label>1. 研究目標範圍 (Aim)</label>
        <select class="m-sel" data-mkey="aim">
          <option value="3" ${m.aim===3?"selected":""}>明確窄化 (Narrow, 3分)</option>
          <option value="2" ${m.aim===2?"selected":""}>適中明確 (Moderate, 2分)</option>
          <option value="1" ${m.aim===1?"selected":""}>寬廣探索 (Broad, 1分)</option>
        </select>
      </div>
      <div class="fld" style="margin:0"><label>2. 樣本特異性 (Sample Specificity)</label>
        <select class="m-sel" data-mkey="spec">
          <option value="3" ${m.spec===3?"selected":""}>高度密集特定經驗 (Dense, 3分)</option>
          <option value="2" ${m.spec===2?"selected":""}>具特定經驗但異質 (Moderate, 2分)</option>
          <option value="1" ${m.spec===1?"selected":""}>廣泛稀疏經驗 (Sparse, 1分)</option>
        </select>
      </div>
      <div class="fld" style="margin:0"><label>3. 理論背景架構 (Established Theory)</label>
        <select class="m-sel" data-mkey="theory">
          <option value="3" ${m.theory===3?"selected":""}>應用堅實理論架構 (Applied, 3分)</option>
          <option value="2" ${m.theory===2?"selected":""}>具初步概念架構 (Limited, 2分)</option>
          <option value="1" ${m.theory===1?"selected":""}>無既有理論完全探索 (None, 1分)</option>
        </select>
      </div>
      <div class="fld" style="margin:0"><label>4. 對話溝通品質 (Quality of Dialogue)</label>
        <select class="m-sel" data-mkey="dialogue">
          <option value="3" ${m.dialogue===3?"selected":""}>深度訪談強大互動 (Strong, 3分)</option>
          <option value="2" ${m.dialogue===2?"selected":""}>一般半結構訪談 (Clear, 2分)</option>
          <option value="1" ${m.dialogue===1?"selected":""}>受訪者簡答/訪談經驗弱 (Weak, 1分)</option>
        </select>
      </div>
      <div class="fld" style="margin:0"><label>5. 分析策略深度 (Analysis Strategy)</label>
        <select class="m-sel" data-mkey="strategy">
          <option value="3" ${m.strategy===3?"selected":""}>單一個案/深度個體 IPA (Case, 3分)</option>
          <option value="2" ${m.strategy===2?"selected":""}>反思性主題分析 (Cross-case, 2分)</option>
          <option value="1" ${m.strategy===1?"selected":""}>大範圍紮根探索 (Broad GT, 1分)</option>
        </select>
      </div>
    </div>
    <div style="margin-top:10px;padding:10px;background:var(--subtle);border-radius:6px;display:flex;justify-content:space-between;align-items:center">
      <span>五維度自評總分：<b>${sum} / 15</b> ➔ <b style="color:${color}">${powerLvl}</b></span>
      <span style="font-weight:bold;color:var(--brand-deep)">${estN}</span>
    </div>
  </div>`;
}

// 德懷術雙閘門門檻試算器 (Mode/QD)
function delphiToolHTML(){
  const d = S.delphi || { mode: 5, qd: 0.50, agreement: 88, n_rounds: 2, n_experts: 25 };
  const passMode = d.mode === 5;
  const passQD = d.qd <= 0.60;
  const passAll = passMode && passQD;

  return `<div class="tool" id="delphi_tool">
    <h4>
      <span>🎯 德懷術專家共識雙閘門判準試算器（@ 3.1 s62–65 主軸案例 Hsieh et al., 2022）</span>
      <span class="pill ${passAll?"ok":"warn"}">${passAll?"雙閘通過：納入核心指標":"未達雙閘門檻"}</span>
    </h4>
    <div class="grid g3">
      <div class="fld" style="margin:0"><label>專家評分眾數 (Mode, 閘門一: 需 = 5)</label>
        <select data-delphi="mode">
          <option value="5" ${d.mode===5?"selected":""}>眾數 Mode = 5（極為重要，通過）</option>
          <option value="4" ${d.mode===4?"selected":""}>眾數 Mode = 4（重要，未達門檻）</option>
          <option value="3" ${d.mode===3?"selected":""}>眾數 Mode = 3（普通，刪除）</option>
        </select>
      </div>
      <div class="fld" style="margin:0"><label>四分位差 (QD, 閘門二: 需 ≤ 0.60)</label>
        <input type="number" step="0.05" min="0" max="2" data-delphi="qd" value="${d.qd}">
      </div>
      <div class="fld" style="margin:0"><label>高度同意比例 (%)</label>
        <input type="number" step="1" min="0" max="100" data-delphi="agreement" value="${d.agreement}">
      </div>
    </div>
    <div style="margin-top:10px;font-size:12px;color:var(--muted)">
      <b>閘門一判準：</b>眾數需達 5 分滿分；<b>閘門二判準：</b>四分位差 QD = (Q3 − Q1)/2 需 ≤ 0.60（代表專家高度共識，QD ≤ 0.60 具高度共識，0.61–1.00 為中度共識，> 1.00 為無共識）。
    </div>
  </div>`;
}

function sevenStepRows(){
  const d = DESIGNS[S.design] || DESIGNS.qual_thematic;
  return [
    ["1. 哲學典範與研究問題", S.s1_rq || "探索臨床交班之認知負荷與心理信任危機", `典範立場：${d.paradigm || "詮釋主義"}；本體認識論與立場懸置落實。`],
    ["2. 概念架構與敏感化概念", S.s2_vars ? (Array.isArray(S.s2_vars)?S.s2_vars.map(r=>r[0]).filter(Boolean).join("、"):String(S.s2_vars).slice(0,35)) : "認知負荷、科技抗拒、同儕心理安全感", S.s2_val ? String(S.s2_val).slice(0,40) : "透過成員檢核與多來源三角檢證確立信實度。"],
    ["3. 研究者角色與反思性", S.s3_assign ? String(S.s3_assign).slice(0,40) : "目的性抽樣選取 12 位臨床加護護理師", S.s3_blinding ? String(S.s3_blinding).slice(0,40) : "詳實記錄反思日誌，防範同儕權力階層偏誤。"],
    ["4. 目的抽樣與資訊力評估", S.s4_power ? String(S.s4_power).slice(0,40) : "Malterud 資訊力 5 維度評估，12 位達飽和", S.s4_sampling ? String(S.s4_sampling).slice(0,40) : "具體陳述納入排除條件與研究倫理審查 (IRB)。"],
    ["5. 資料收集協定與轉錄", S.s5_layout ? String(S.s5_layout).slice(0,40) : "半結構個別深度訪談 60–90 分鐘", S.s5_clean ? String(S.s5_clean).slice(0,40) : "數位錄音、逐字稿轉錄、審計軌跡與去識別化編號。"],
    ["6. 質性編碼與主題建構", S.s6_sap ? (Array.isArray(S.s6_sap)?S.s6_sap.map(r=>r[0]).filter(Boolean).join(" ➔ "):String(S.s6_sap).slice(0,40)) : `${d.name}分析程序與四階梯主題昇華`, S.s6_apa ? String(S.s6_apa).slice(0,40) : "提煉 3 大核心主題與代表性引文，完成理論對話。"],
    ["7. 嚴謹度檢證與規範檢核", `遵循 ${d.guideline} 國際報告規範自評完整`, "完成 Lincoln & Guba 四大指標與同儕除錯審計。"]
  ];
}

function reviewHTML(){
  const spec = apaDocSpec();

// 檔案匯出工具
function downloadBlob(content, filename, type){
  const blob = new Blob([content], { type: type || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function loadDocxLib(){
  if(window.docx) return window.docx;
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js";
    s.onload = ()=>{
      if(window.docx) resolve(window.docx);
      else reject(new Error("docx library failed to load"));
    };
    s.onerror = (e)=>reject(e);
    document.head.appendChild(s);
  });
}

async function exportDocx(pid){
  const targetDesign = pid || S.design;
  const p = PRESETS[targetDesign];
  if(pid && p && p.data){
    const oldS = JSON.parse(JSON.stringify(S));
    Object.assign(S, p.data);
    S.design = p.design || pid;
    await doExportDocx();
    S = oldS;
  }else{
    await doExportDocx();
  }
}

async function doExportDocx(){
  const spec = apaDocSpec();
  const fname = `質性研究設計與資料分析計畫書_APA7_${S.design}_${S.date||"2026"}.docx`;
  try{
    const dx = await loadDocxLib();
    const {
      Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
      WidthType, AlignmentType, HeadingLevel, BorderStyle,
      Header, Footer, PageNumber
    } = dx;

    const FONT = { ascii: "Times New Roman", hAnsi: "Times New Roman", eastAsia: "標楷體", cs: "Times New Roman" };
    const CONTENT_W = 9026;
    const LINE_APA = 360;

    const mkH1 = (txt)=>new Paragraph({
      heading: HeadingLevel.HEADING_1,
      alignment: AlignmentType.CENTER,
      spacing: { before: 320, after: 160, line: LINE_APA },
      keepNext: true,
      children: [new TextRun({ text: txt, bold: true, size: 28, font: FONT, color: "000000" })]
    });

    const mkH2 = (txt)=>new Paragraph({
      heading: HeadingLevel.HEADING_2,
      alignment: AlignmentType.LEFT,
      spacing: { before: 240, after: 100, line: LINE_APA },
      keepNext: true,
      children: [new TextRun({ text: txt, bold: true, size: 25, font: FONT, color: "000000" })]
    });

    const mkTextParas = (raw)=>{
      const lines = String(raw || "（尚未填寫）").split(/\r?\n+/).map(s=>s.trim()).filter(Boolean);
      if(!lines.length){
        return [new Paragraph({
          indent: { firstLine: 480 },
          spacing: { before: 40, after: 120, line: LINE_APA },
          children: [new TextRun({ text: "（尚未填寫）", size: 24, font: FONT })]
        })];
      }
      return lines.map(line=>{
        const m = line.match(/^((?:[0-9]+[\.\、]|[①-⑳]|[\(（][0-9一二三四五六七八九十]+[\)）]|[・•\-]|【[^】]+】|\[[^\]]+\])\s*)(.*)$/);
        if(m){
          return new Paragraph({
            alignment: AlignmentType.JUSTIFIED,
            indent: { left: 480, hanging: 480 },
            spacing: { before: 40, after: 120, line: LINE_APA },
            children: [
              new TextRun({ text: m[1], bold: true, size: 24, font: FONT }),
              new TextRun({ text: m[2], size: 24, font: FONT })
            ]
          });
        }
        return new Paragraph({
          alignment: AlignmentType.JUSTIFIED,
          indent: { firstLine: 480 },
          spacing: { before: 40, after: 120, line: LINE_APA },
          children: [new TextRun({ text: line, size: 24, font: FONT })]
        });
      });
    };

    const mkApaTableBlock = (t)=>{
      const colWidths = t.colPcts.map(pct=>Math.round((CONTENT_W * pct) / 100));
      const borderThick = { style: BorderStyle.SINGLE, size: 12, color: "000000" };
      const borderThin = { style: BorderStyle.SINGLE, size: 6, color: "000000" };
      const borderNone = { style: BorderStyle.NONE, size: 0, color: "auto" };

      const headRow = new TableRow({
        tableHeader: true,
        children: t.headers.map((h, i)=>new TableCell({
          width: { size: colWidths[i], type: WidthType.DXA },
          margins: { top: 120, bottom: 120, left: 140, right: 140 },
          borders: { top: borderThick, bottom: borderThin, left: borderNone, right: borderNone },
          children: [new Paragraph({
            alignment: AlignmentType.CENTER,
            spacing: { line: 280 },
            children: [new TextRun({ text: h, bold: true, size: 22, font: FONT })]
          })]
        }))
      });

      const dataRows = t.rows.map((row, rIdx)=>{
        const isLast = rIdx === t.rows.length - 1;
        return new TableRow({
          children: row.map((cellTxt, cIdx)=>new TableCell({
            width: { size: colWidths[cIdx] || colWidths[0], type: WidthType.DXA },
            margins: { top: 100, bottom: 100, left: 140, right: 140 },
            borders: {
              top: borderNone,
              bottom: isLast ? borderThick : borderNone,
              left: borderNone,
              right: borderNone
            },
            children: [new Paragraph({
              alignment: cIdx === 0 ? AlignmentType.LEFT : AlignmentType.LEFT,
              spacing: { line: 280 },
              children: [new TextRun({ text: String(cellTxt || ""), size: 22, font: FONT })]
            })]
          }))
        });
      });

      return [
        new Paragraph({
          spacing: { before: 240, after: 40, line: LINE_APA },
          keepNext: true,
          children: [new TextRun({ text: t.num, bold: true, size: 23, font: FONT })]
        }),
        new Paragraph({
          spacing: { before: 0, after: 120, line: LINE_APA },
          keepNext: true,
          children: [new TextRun({ text: t.title, italics: true, size: 23, font: FONT })]
        }),
        new Table({
          width: { size: CONTENT_W, type: WidthType.DXA },
          alignment: AlignmentType.CENTER,
          rows: [headRow, ...dataRows]
        }),
        new Paragraph({
          spacing: { before: 80, after: 200, line: LINE_APA },
          children: [new TextRun({ text: t.note || "", size: 20, font: FONT })]
        })
      ];
    };

    const docChildren = [
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 360, after: 80, line: LINE_APA },
        children: [new TextRun({ text: spec.docTitle, bold: true, size: 32, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 40, after: 200, line: LINE_APA },
        children: [new TextRun({ text: spec.studyTitle, bold: true, size: 28, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 0, after: 60, line: LINE_APA },
        children: [new TextRun({ text: spec.authorLine, size: 23, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 0, after: 60, line: LINE_APA },
        children: [new TextRun({ text: spec.metaLine, size: 23, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 0, after: 240, line: LINE_APA },
        children: [new TextRun({ text: spec.guideLine, size: 23, font: FONT })]
      }),
      ...mkApaTableBlock(spec.coverTable)
    ];

    spec.sections.forEach(sec=>{
      docChildren.push(mkH1(sec.h1));
      sec.items.forEach(it=>{
        if(it.type === "h2") docChildren.push(mkH2(it.text));
        else if(it.type === "text") docChildren.push(...mkTextParas(it.text));
        else if(it.type === "table") docChildren.push(...mkApaTableBlock(it));
      });
    });

    const doc = new Document({
      sections: [{
        properties: {
          page: {
            margin: { top: 1440, bottom: 1440, left: 1440, right: 1440 }
          }
        },
        headers: {
          default: new Header({
            children: [new Paragraph({
              alignment: AlignmentType.RIGHT,
              spacing: { after: 120 },
              children: [
                new TextRun({ text: spec.runningHead + "　第 ", size: 18, font: FONT }),
                new TextRun({ children: [PageNumber.CURRENT], size: 18, font: FONT }),
                new TextRun({ text: " 頁", size: 18, font: FONT })
              ]
            })]
          })
        },
        footers: {
          default: new Footer({
            children: [new Paragraph({
              alignment: AlignmentType.CENTER,
              spacing: { before: 120 },
              children: [new TextRun({ text: "— 國立臺灣大學 研究方法論課程 3.0W 質性研究工作台 —", size: 18, font: FONT, color: "777777" })]
            })]
          })
        },
        children: docChildren
      }]
    });

    const blob = await Packer.toBlob(doc);
    downloadBlob(blob, fname, "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
  }catch(e){
    alert("匯出 Word 計畫書時發生錯誤，請檢查網路連線後再試一次。\n\n詳細錯誤：" + e.message);
    console.error(e);
  }
}

      const k = ta.dataset.gr, r = parseInt(ta.dataset.r,10), c = parseInt(ta.dataset.c,10);

        S[k][r][c] = ta.value;

  w.querySelectorAll("[data-gadd]").forEach(b=>{

      save(); render();

  w.querySelectorAll("[data-gdel]").forEach(b=>{

  w.querySelectorAll(".m-sel").forEach(sel=>{

  const btnMalt = w.querySelector("#btn_apply_malterud");

      S.s4_power = text;
      save(); render();
      alert("已將 Malterud 資訊力評估結果帶入 STEP ④ 抽樣說明欄位！");
    };
  }

  // Delphi inputs
  w.querySelectorAll("[data-delphi]").forEach(inp=>{
    inp.oninput = inp.onchange = ()=>{
      const k = inp.dataset.delphi;
      if(k && S.delphi){
        S.delphi[k] = parseFloat(inp.value) || 0;
        save(); render();
      }
    };
  });

  // Review 頁面匯出按鈕
  const btnDocx = w.querySelector("#btn_export_docx");
  if(btnDocx) btnDocx.onclick = ()=>exportDocx();

  const btnCsv = w.querySelector("#btn_export_csv");
  if(btnCsv) btnCsv.onclick = ()=>exportCsv();

  const btnCopy = w.querySelector("#btn_copy_summary");
  if(btnCopy){
    btnCopy.onclick = ()=>{
      const md = `# ${S.title || "質性研究計畫書"}\n\n` +
        `研究者：${S.author || "—"}｜指導教授：${S.advisor || "—"}\n` +
        `研究取向：${(DESIGNS[S.design]||{}).name || S.design}（${(DESIGNS[S.design]||{}).guideline || "COREQ"}）\n\n` +
        `## 核心研究問題 (RQ)\n${S.s1_rq || "—"}\n\n` +
        `## 抽樣與資訊力\n${S.s4_power || "—"}\n\n` +
        `## 質性資料分析策略\n${Array.isArray(S.s6_sap)?S.s6_sap.map(r=>r[0]).join(" ➔ "):S.s6_sap}\n\n` +
        `## 代表性引文與核心主題\n${S.s6_apa || "—"}\n`;
      navigator.clipboard.writeText(md).then(()=>{
        alert("已複製計畫書精華摘要 Markdown 至剪貼簿！");
      });
    };
  }
}

function render(){
  renderTop();
  renderNav();
  initSymp();
  const work = document.getElementById("work");
  if(!work) return;

  if(S.step === "readme"){
    work.innerHTML = readmeHTML();
  }else if(S.step === "setup"){
    work.innerHTML = setupHTML();
  }else if(S.step === "review"){
    work.innerHTML = reviewHTML();
  }else{
    work.innerHTML = stepFormHTML(S.step);
  }
  bindEvents();
}

function bindGlobalTop(){
  // 頂部 README 按鈕
  const btnReadme = document.getElementById("btn_readme");
  if(btnReadme){
    btnReadme.onclick = ()=>{
      S.step = S.step === "readme" ? "s1" : "readme";
      save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    };
  }

  // 頂部一鍵匯入
  const btnOne = document.getElementById("oneclick");
  if(btnOne){
    btnOne.onclick = ()=>{
      applyPreset(S.design || "qual_thematic", false);
    };
  }

  // 側邊欄切換
  document.getElementById("stepnav").addEventListener("click", e=>{
    const item = e.target.closest(".sitem");
    if(item){
      const st = item.dataset.nav;
      if(st){
        S.step = st;
        save(); render(); window.scrollTo({top:0,behavior:"smooth"});
      }
    }
  });

  // 手機版選單按鈕
  const menuBtn = document.getElementById("menu");
  if(menuBtn){
    menuBtn.onclick = ()=>{
      const nav = document.getElementById("side-nav");
      if(nav){
        const open = nav.classList.toggle("open");
        menuBtn.setAttribute("aria-expanded", String(open));
      }
    };
  }

  // 疑難雜症速查
  const sy = document.getElementById("sy");
  if(sy){
    sy.onchange = ()=>{
      const qid = sy.value;
      if(!qid) return;
      const s = SYMP.find(x=>x.id===qid);
      if(s){
        alert(`【常見疑難解析】${s.q}\n\n解法與建議：\n${s.a}\n\n對應課程投影片：${s.ref || "@ 3.1"}`);
      }
      sy.value = "";
    };
  }
}

document.addEventListener("DOMContentLoaded", ()=>{
  bindGlobalTop();
  render();
});

if(document.readyState === "complete" || document.readyState === "interactive"){
  bindGlobalTop();
  render();
}

})();
</script>
</body>
</html>
