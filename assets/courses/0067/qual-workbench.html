<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>質性研究設計與分析工作台｜研究方法論 3.1–3.2</title>
<meta name="description" content="研究方法論課程 3.1–3.2 質性研究與混合研究法互動工作台：涵蓋質性描述與主題分析、詮釋現象學分析 (IPA)、紮根理論 (GT)、個案研究、民族誌、敘事研究、焦點團體 (FGD)、德懷術專家共識與解釋性序列混合研究共 9 種主流取向與一鍵完整範例、Malterud 資訊力試算器、四階梯編碼實驗室、七步驟走查檢核、Lincoln & Guba 四大嚴謹度檢證、匯出 APA 第 7 版 Word 與標準編碼矩陣 CSV。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231f3a5f'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='56' font-weight='600' fill='%23fff' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f7f4ed;--panel:#ffffff;--subtle:#efeae0;--line:#dcd5c6;--ink:#1d242b;--muted:#5b6470;--brand:#1f3a5f;--brand-deep:#142943;--brand-soft:#e7eef6;--accent:#9c7538;--accent-soft:#f6efe1;--ok:#1f6f4a;--ok-soft:#e5f3ec;--warn:#a85513;--warn-soft:#fbeee2;--bad:#a2342a;--bad-soft:#fae8e6;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC","Source Han Serif TC",Georgia,serif}
@media (prefers-color-scheme: dark){:root{--bg:#13171d;--panel:#1b212a;--subtle:#242c38;--line:#313b4a;--ink:#ebe7de;--muted:#9ea8b6;--brand:#7fb0e8;--brand-deep:#a9caf0;--brand-soft:#1e2f44;--accent:#d8b16d;--accent-soft:#2f281a;--ok:#5bc490;--ok-soft:#182e24;--warn:#f0a35e;--warn-soft:#312214;--bad:#eb7c72;--bad-soft:#321b19}}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.04)}
.top-in{max-width:1440px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--brand-deep);letter-spacing:.02em}
.brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px}
#menu{display:none;border:1px solid var(--line);background:var(--subtle);padding:5px 10px;border-radius:6px;cursor:pointer}
#who{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.pill{background:var(--brand-soft);color:var(--brand-deep);padding:3px 9px;border-radius:999px;font-weight:500;border:1px solid transparent}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:160px}
.prog i{flex:1;height:7px;background:var(--subtle);border-radius:99px;overflow:hidden;display:block;position:relative;border:1px solid var(--line)}
.prog i::after{content:"";display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--brand),var(--ok));transition:width .25s}
#progt{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.oneclick{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.oneclick:hover{background:var(--accent);color:#fff}
#sy{max-width:250px;border:1px solid var(--line);background:var(--subtle);padding:5px 9px;border-radius:6px;font-size:12.5px}
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:252px minmax(0,1fr);gap:20px;padding:18px}
#side-nav{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.sitem{width:100%;text-align:left;border:0;background:transparent;padding:8px 9px;border-radius:7px;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;cursor:pointer;margin-bottom:2px}
.sitem:hover{background:var(--subtle)}
.sitem.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
.sdot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--panel)}
.sitem.on .sdot{border-color:var(--brand);color:var(--brand)}
.sitem.done .sdot{background:var(--ok);border-color:var(--ok);color:#fff}
.slbl{font-size:13px;line-height:1.3}.slbl small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.s pct{font-size:11px;color:var(--muted)}
.saved{font-size:11.5px;color:var(--muted);margin:10px 6px 2px;border-top:1px dashed var(--line);padding-top:8px}
#work{min-width:0}
.head{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:14px}
.head-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.badge{background:var(--brand);color:#fff;font-weight:700;font-size:12px;padding:2px 9px;border-radius:5px;letter-spacing:.04em}
.head h1{font-family:var(--serif);font-size:21px;margin:0;color:var(--brand-deep)}
.head .q{margin:6px 0 0;color:var(--muted);font-size:14px}
.locbar{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.loc{background:var(--subtle);border:1px solid var(--line);padding:3px 9px;border-radius:5px}
.loc b{color:var(--brand-deep)}
.loc.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.panes{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(310px,.92fr);gap:16px;align-items:start}
.form,.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.fld{margin-bottom:15px}
.fld label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--brand-deep)}
.fld label span.h{font-weight:400;font-size:12px;color:var(--muted)}
.fld textarea,.fld input[type=text],.fld input[type=number],.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;transition:border-color .15s,background .15s}
.fld textarea{resize:vertical;min-height:74px;line-height:1.6}
.fld textarea:focus,.fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);background:var(--panel)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 2px}
.chip{border:1px dashed var(--brand);background:var(--brand-soft);color:var(--brand-deep);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;text-align:left;line-height:1.4}
.chip:hover{background:var(--brand);color:#fff;border-style:solid}
.chip b{font-weight:700}
.stabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.stab{border:0;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.stab.on{color:var(--brand-deep);border-bottom-color:var(--brand);font-weight:700}
.sbox{font-size:13.2px}
.sbox h3{font-size:13.5px;margin:12px 0 6px;color:var(--brand-deep);border-left:3px solid var(--brand);padding-left:8px}
.sbox h3:first-child{margin-top:0}
.chk{list-style:none;padding:0;margin:0}
.chk li{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:7px;align-items:flex-start}
.chk input{margin-top:4px}
.err{background:var(--bad-soft);border-left:3px solid var(--bad);padding:7px 10px;border-radius:5px;margin-bottom:6px;font-size:12.8px}
.caseq{background:var(--accent-soft);border:1px solid var(--accent);border-radius:7px;padding:10px 12px;font-size:12.8px;white-space:pre-line}
.caseq .use{margin-top:6px;display:inline-block;font-size:12px;color:var(--brand-deep);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.gate{background:var(--ok-soft);border:1px solid var(--ok);border-radius:7px;padding:9px 11px;margin-top:10px}
.gate h4{margin:0 0 6px;font-size:13px;color:var(--ok)}
.gate label{display:flex;gap:7px;align-items:flex-start;font-size:12.6px;padding:3px 0;cursor:pointer}
.fnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{background:var(--subtle)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--brand-deep)}
.btn.ac{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.sm{padding:4px 9px;font-size:12px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--bg);cursor:pointer;transition:border-color .15s,transform .1s;text-align:left}
.card:hover{border-color:var(--brand)}
.card.on{border:2px solid var(--brand);background:var(--brand-soft)}
.card h4{margin:0 0 3px;font-size:14px;color:var(--brand-deep);display:flex;justify-content:space-between;align-items:center;gap:6px}
.card p{margin:0;font-size:12.3px;color:var(--muted);line-height:1.45}
.card . cmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ctag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--subtle);color:var(--ink);border:1px solid var(--line)}
.card.on .ctag{background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700}
.tbl input,.tbl textarea,.tbl select{width:100%;border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:4px;font-size:12.5px}
.tbl input:focus,.tbl textarea:focus,.tbl select:focus{border-color:var(--brand);background:var(--panel);outline:none}
.tbl textarea{min-height:44px;resize:vertical}
.tool{background:var(--subtle);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.tool h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tout{background:var(--panel);border-left:3px solid var(--accent);padding:9px 12px;border-radius:5px;margin-top:8px;font-size:13px}
.warnbox{background:var(--warn-soft);border-left:3px solid var(--warn);padding:8px 11px;border-radius:5px;font-size:12.6px;margin:6px 0}
.okbox{background:var(--ok-soft);border-left:3px solid var(--ok);padding:8px 11px;border-radius:5px;font-size:12.6px;margin:6px 0}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.mcell{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.mcell.empty{border-color:var(--warn);background:var(--warn-soft)}
.mcell h4{margin:0 0 4px;font-size:13px;color:var(--brand-deep);display:flex;justify-content:space-between}
.mcell p{margin:0;font-size:12.3px;white-space:pre-line;max-height:130px;overflow:auto}
.doc-preview{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 26px;font-family:var(--serif);line-height:1.85;max-height:580px;overflow:auto;white-space:pre-wrap;font-size:14px}
.slot{background:var(--warn-soft);color:var(--warn);padding:0 3px;border-radius:3px;font-weight:700}
.pp{--p:0;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:inline-flex;align-items:center;justify-content:center}
.pp i{width:17px;height:17px;border-radius:50%;background:var(--panel);font-style:normal;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.sitem.on .pp i{color:var(--brand)}
/* 2.X 量性研究設計專屬視覺元件 */
.dtree{background:var(--subtle);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:14px}
.dtree h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep)}
.dq-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-bottom:8px}
.dq{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.4px}
.dq b{display:block;color:var(--brand-deep);margin-bottom:4px}
.dq select{width:100%;border:1px solid var(--line);background:var(--bg);padding:4px 6px;border-radius:5px;font-size:12.3px}
.flow-viz{background:var(--panel);border:1.5px solid var(--brand);border-radius:9px;padding:13px 15px;margin:10px 0}
.flow-viz h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.fsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.fnode{background:var(--brand-soft);border:1px solid var(--brand);color:var(--brand-deep);padding:6px 10px;border-radius:7px;font-size:12.3px;line-height:1.4;font-weight:500}
.fnode.ac{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.fnode.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.farr{color:var(--muted);font-weight:700;font-size:14px}
.fnotation{font-family:ui-monospace,Consolas,monospace;background:var(--subtle);border:1px dashed var(--line);padding:6px 10px;border-radius:6px;font-size:12.3px;margin:6px 0;white-space:pre-wrap}
.eff-bars{margin:8px 0;display:grid;gap:6px}
.ebar{display:grid;grid-template-columns:170px 1fr 90px;align-items:center;gap:8px;font-size:12.2px}
.ebar-track{height:14px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.ebar-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px}
.ebar-fill.ok{background:linear-gradient(90deg,var(--ok),var(--brand))}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:8px;margin-top:8px}
.pbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 10px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.pbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.pbtn b{display:block;font-size:12.8px;color:var(--brand-deep);margin-bottom:2px}
.pbtn small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
.pbtn .ptag{display:inline-block;font-size:10.8px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--brand-soft);color:var(--brand-deep);margin-bottom:4px}
/* README 總覽網頁專屬樣式（清晰三步結構：選分類 → 看設計與範例 → 橫向比較） */
.rm-doc{display:grid;gap:16px}
.rm-sec{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px 22px;box-shadow:0 1px 6px rgba(0,0,0,.02)}
.rm-sec-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rm-sec-hd h2{margin:0;font-family:var(--serif);font-size:18px;color:var(--brand-deep);display:flex;align-items:center;gap:8px}
.rm-sec-hd small{font-size:12.5px;color:var(--muted)}
.rm-step-tag{background:var(--brand);color:#fff;font-family:var(--sans);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px}
.rm-flts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:8px 11px;background:var(--subtle);border-radius:8px;font-size:12.5px}
.rm-flt{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;border-radius:99px;font-size:12.2px;cursor:pointer;font-weight:500;transition:all .15s}
.rm-flt:hover{border-color:var(--brand)}
.rm-flt.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.rm-fam-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:stretch}
.rm-fam{background:var(--subtle);border:1px solid var(--line);border-radius:9px;padding:10px;display:grid;grid-template-rows:48px 104px 104px;gap:8px}
.rm-fam-hd{padding-bottom:6px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.rm-fam-hd b{display:block;font-size:13px;color:var(--brand-deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-fam-hd span{display:block;font-size:11.3px;color:var(--muted);line-height:1.3;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-ditem{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;transition:all .15s;display:grid;grid-template-rows:22px 20px 1fr;align-items:start;width:100%;height:104px;box-sizing:border-box;overflow:hidden}
.rm-ditem:hover{border-color:var(--brand);transform:translateY(-1px)}
.rm-ditem.on{border:2px solid var(--brand);background:var(--brand-soft);box-shadow:0 2px 8px rgba(31,58,95,.12)}
.rm-ditem.dim{opacity:.32}
.rm-ditem-note{border:1.5px dashed var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:3px;height:104px;box-sizing:border-box;font-size:11.4px;color:var(--muted);line-height:1.4}
.rm-ditem-note b{color:var(--brand-deep);font-size:12px}
.rm-ditem-top{display:flex;justify-content:space-between;align-items:center;gap:4px;height:20px}
.rm-ditem-num{font-weight:700;font-size:11.8px;color:var(--brand-deep);background:var(--subtle);padding:1px 6px;border-radius:4px;white-space:nowrap}
.rm-ditem.on .rm-ditem-num{background:var(--brand);color:#fff}
.rm-ditem-n{font-size:10.8px;color:var(--accent);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-ditem b{display:block;font-size:12.6px;color:var(--brand-deep);line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.rm-ditem small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11.3px;color:var(--muted);line-height:1.38;margin-top:2px}
.rm-focus{border:2px solid var(--brand);border-radius:11px;background:var(--panel);overflow:hidden;scroll-margin-top:116px}
.rm-focus-bar{background:var(--brand-soft);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rm-focus-title h2{margin:4px 0 2px;font-family:var(--serif);font-size:20px;color:var(--brand-deep)}
.rm-focus-title p{margin:0;font-size:13px;color:var(--muted)}
.rm-focus-acts{display:flex;gap:8px;flex-wrap:wrap}
.rm-bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px 20px;align-items:stretch}
.rm-bcard{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:var(--bg);display:flex;flex-direction:column;gap:8px;min-width:0}
.rm-bcard h4{margin:0;font-size:14px;color:var(--brand-deep);display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
/* STEP 2 內部對齊網格與表格 */
.rm-step-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rm-step-box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;font-size:12px;line-height:1.38;min-height:42px}
.rm-step-box.ac{border-color:var(--accent);background:var(--accent-soft)}
.rm-step-box.ok{border-color:var(--ok);background:var(--ok-soft)}
.rm-step-badge{background:var(--subtle);color:var(--brand-deep);font-weight:700;font-size:11px;padding:2px 5px;border-radius:4px;text-align:center;white-space:nowrap}
.rm-step-box.ac .rm-step-badge{background:var(--accent);color:#fff}
.rm-step-box.ok .rm-step-badge{background:var(--ok);color:#fff}
.rm-sub-tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.rm-sub-tbl th,.rm-sub-tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;line-height:1.42}
.rm-sub-tbl th:last-child,.rm-sub-tbl td:last-child{border-right:0}
.rm-sub-tbl tr:last-child td,.rm-sub-tbl tr:last-child th{border-bottom:0}
.rm-sub-tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700}
.rm-data-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.rm-data-tbl{width:100%;border-collapse:collapse;font-size:11.6px}
.rm-data-tbl th,.rm-data-tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 8px;text-align:left;white-space:nowrap}
.rm-data-tbl th:last-child,.rm-data-tbl td:last-child{border-right:0}
.rm-data-tbl tr:last-child td{border-bottom:0}
.rm-data-tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700;font-family:var(--mono)}
.rm-data-tbl td{font-family:var(--mono);color:var(--ink)}
.rm-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.rm-tbl{width:100%;border-collapse:collapse;font-size:12.6px;min-width:820px}
.rm-tbl th,.rm-tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle;line-height:1.45}
.rm-tbl th:last-child,.rm-tbl td:last-child{border-right:0}
.rm-tbl tr:last-child td{border-bottom:0}
.rm-tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700;white-space:nowrap}
.rm-tbl tr.on td{background:var(--brand-soft)}
.rm-tbl tr:hover td{background:var(--subtle);cursor:pointer}
/* APA 第 7 版預覽與表格樣式 */
.apa-page{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:32px 42px;font-family:"Times New Roman","標楷體",var(--serif);line-height:1.85;max-height:680px;overflow:auto;font-size:15px;color:var(--ink)}
.apa-rh,.apa-runhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:22px}
.apa-cover{text-align:center;padding:18px 0 22px;margin-bottom:20px;border-bottom:2px double var(--line)}
.apa-cover h2,.apa-title{font-size:20px;font-weight:700;margin:0 0 8px;color:var(--brand-deep)}
.apa-subtitle{font-size:17px;font-weight:700;margin:0 0 10px;color:var(--ink)}
.apa-meta{font-size:14px;line-height:1.7;color:var(--ink)}
.apa-h1{text-align:center;font-weight:700;font-size:17px;margin:28px 0 12px;color:var(--brand-deep)}
.apa-h2{text-align:left;font-weight:700;font-size:15.5px;margin:18px 0 8px;color:var(--brand-deep)}
.apa-p{margin:0 0 10px;text-indent:2em;text-align:justify}
.apa-item{margin:0 0 8px;padding-left:2em;text-indent:-2em;text-align:justify}
.apa-twrap{margin:16px 0 20px}
.apa-tnum{font-weight:700;font-size:14.5px;margin:0}
.apa-ttitle{font-style:italic;font-size:14.5px;margin:2px 0 6px}
.apa-tbl{width:100%;border-collapse:collapse;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font-size:13.2px}
.apa-tbl th{border-bottom:1px solid var(--ink);padding:6px 8px;text-align:left;font-weight:700;vertical-align:bottom}
.apa-tbl td{padding:6px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.apa-tbl tr:last-child td{border-bottom:0}
.apa-tnote{font-size:12.5px;color:var(--muted);margin:5px 0 0}
@media (max-width:1120px){
  .rm-fam-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rm-bento{grid-template-columns:1fr}
}
@media (max-width:1024px){
  .shell{grid-template-columns:1fr}
  #menu{display:inline-block}
  #side-nav{display:none;position:fixed;left:12px;right:12px;top:58px;z-index:40;max-height:75vh;box-shadow:0 12px 32px rgba(0,0,0,.22)}
  #side-nav.open{display:block}
  .panes{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .ebar{grid-template-columns:120px 1fr 75px}
  .rm-fam-grid{grid-template-columns:1fr}
  .apa-page{padding:18px 16px}
}
@media print{
  .top,#side-nav,.side,.fnav,.chips,.tool{display:none!important}
  .shell,.panes{display:block;padding:0}
  .doc-preview{max-height:none;border:0;padding:0}
}

/* 30秒白話故事線導讀卡 */
.story-card{background:linear-gradient(135deg,#f8fbff 0%,#f2f6fc 100%);border:1.5px solid var(--brand);border-radius:10px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 10px rgba(31,58,95,.07)}
.story-hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:7px;border-bottom:1px dashed var(--line)}
.story-hd b{font-size:14.2px;color:var(--brand-deep);display:flex;align-items:center;gap:6px}
.story-tag{background:var(--accent-soft);color:var(--accent);border:1px solid #d9b87c;border-radius:99px;padding:2px 10px;font-size:11.8px;font-weight:700}
.story-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.story-cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.6px;line-height:1.55;color:var(--ink)}
.story-cell b{display:block;font-size:12.2px;color:var(--brand-deep);margin-bottom:4px}
.step-digest-bar{margin-top:9px;background:var(--ok-soft);border:1px solid #8ecaa7;border-radius:7px;padding:7px 11px;font-size:12.8px;color:var(--ink);line-height:1.5}
.step-digest-bar b{color:var(--ok)}
@media (max-width:1024px){.story-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.story-grid{grid-template-columns:1fr}}

        "s1_rq": "💡【白話一句話看懂】用「如何（How）」或「為何（Why）」開頭，把這篇研究想解開的核心謎團與 3 個子問題寫清楚：\n\n【核心研究問題】\n長照機構照護人員於日常使用生成式 AI 照護紀錄摘要工具進行跨班交班時，如何判斷何項摘要內容可信、何者必須回頭查證原始紀錄？此一信任判斷歷程受哪些個人與情境因素影響，並衍生出哪些臨床因應策略？\n【三項具體子問題】\n1. 使用 AI 摘要工具後，照護人員在交班準備、閱讀核對與口頭交接之具體操作步驟出現哪些行為改變？（對應研究目的一）\n2. 照護人員在面對 AI 自動生成之摘要時，觸發「安心採用」或「懷疑並回頭查證原紀錄／口頭追問」之關鍵線索與內在判斷機制為何？（對應研究目的二）\n3. 當發現或擔憂 AI 摘要遺漏關鍵照護資訊時，不同職類與年資之照護人員發展出哪些非正式或雙軌因應策略？（對應研究目的三）",
        "s1_why": "💡【白話一句話看懂】先講現實場域發生了什麼痛點或怪現象，說明「為什麼光靠冷冰冰的統計數字沒辦法回答這題」：\n\n【實務脈絡與研究缺口（銜接量性案例 Q）】\n於前期量性準實驗研究（案例 Q，北部 A、B 兩家住宿式長照機構 62 位交班人員、1,488 筆交班事件）中，統計結果顯示導入 AI 交班摘要工具雖使每班交班準備時間顯著縮短 5.37 分鐘（t(33) = −6.30, p < .001, 95% CI [−7.10, −3.63], dz = 1.08；雙重差分 DiD 淨效應 −4.76 分鐘），且紀錄完整性（0–20 分）通過非劣性檢定（+0.52 分，95% CI 下界 −0.32 高於界限 −1.0）；然而，接班者向交班者提出之「二次確認詢問次數」卻反而顯著增加 0.60 次／班（p = .014），且 B 機構 180 日停止使用流失率達 39.3%（高於 A 機構之 17.6%）。\n量性數據只能回答「時間縮短多少、詢問增加多少」，卻無法解釋「為什麼省了時間，照護人員反而更常追問？」「摘要到底漏掉了什麼讓第一線不敢全信？」。此一黑箱機制正是機構決定是否長期續用與改版系統之關鍵，亟需透過深度質性探究予以解開。",
        "s1_h0h1": "💡【白話一句話看懂】質性研究不寫死板的 H₀/H₁，而是說明我們站在什麼認識論視角、把核心概念定義清楚：\n\n【研究認識論立場與方法學定位】\n本研究立基於自然主義探究（Naturalistic Inquiry）與建構詮釋視角，採用 Sandelowski（2000, 2010）之「質性描述性設計（Qualitative Descriptive Design）」，並結合 Braun 與 Clarke（2006, 2019）之反思性主題分析（Reflexive Thematic Analysis）與分層逐步歸納法。\n本研究不預設先驗統計假設（H₀/H₁），而是主張照護人員對 AI 的「信任」並非靜態的量表分數，而是在每日高時間壓力、高病安責任之交班互動中動態建構的實務判斷；研究者作為研究工具，透過貼近受訪者日常語言之厚描述與跨個案主題歸納，建構能直接指導臨床系統改版與交班制度設計之實證知識。",

        "s1_zm": "💡【白話一句話看懂】誠實寫出研究者自己原本的背景與預設（前理解），以及訪談時怎麼忍住不把自己的偏見塞給受訪者：\n\n【研究者前理解（Pre-understanding）與立場管理（@ 3.1 s38, s74）】\n第一作者具備醫護資訊管理背景，且參與前期案例 Q 之量性成效分析。在進入質性田野前，研究者的核心前理解為：「既然 AI 工具已證明能每班省下 5.37 分鐘，照護人員理當覺得系統非常好用、樂於全面採用」。\n為避免此一前理解成為盲點或化為誘導性提問（例如在訪談中暗示受訪者肯定系統），研究者於收案前即於「反思日誌首則」明確寫下此預設並進行懸置（Bracketing）：① 訪談提綱全面刪除「您覺得 AI 摘要好用嗎？」等評價式問句，一律改從「昨天一個班次的具體交班步驟」切入；② 訪談由未參與機構督考之研究人員執行，並主動鼓勵受訪者分享「覺得怪怪的、不好用或不敢信」之真實挫敗經驗。",

        "s2_principle": "💡【白話一句話看懂】說明怎麼透過適當管道進場域找人，並確保受訪者不是被長官逼來的、敢放心講真話：\n\n【場域進入（Gaining Access）與自願招募保護】\n研究團隊於第一階段量性數據分析完成後，透過兩家機構之護理部外部聯絡窗口（非受訪者之直屬考評主管）發送個別研究邀請函。為避免機構主管直接指派造成「順從偏誤（不敢批評系統）」或強迫參與，邀請名單與實際受訪名單對機構管理層完全保密；受訪者可自由選擇於下班時段在機構外獨立安靜會談室或線上加密視訊進行訪談，並提供每場 500 元超商禮券作為時間補償。",
        "s2_rel": "💡【白話一句話看懂】用 Malterud「資訊力五維度（目標窄度、樣本特異性、理論、對話品質、分析策略）」向口委證明為什麼訪這幾個人就夠了：\n\n【Malterud 等（2016）五維度資訊力（Information Power）評估與樣本量辯護】\n1. 研究目的廣度（Aim）：窄而聚焦——專門針對「使用 AI 交班摘要時之信任判斷與查證策略」，非廣泛探討長照工作經驗。\n2. 樣本特定性（Specificity）：高——12 位受訪者皆為親身使用該套 AI 系統逾 3 個月之第一線交班人員，且經量性數據精準鎖定高、中、低三群體。\n3. 理論背景（Theory）：具明確科技接受與人機信任（Trust in Automation, Lee & See, 2004）概念導引。\n4. 對話品質（Dialogue）：由具臨床護理與質性訓練之訪談員依漏斗式提綱進行 45–60 分鐘深訪，對話具體深入。\n5. 分析策略（Analysis）：採跨個案主題分析（Braun & Clarke, 2006）。\n綜合上述五維度，本樣本具備高度資訊力；對照 Guest 等（2006）指出同質議題約 12 次訪談可涵蓋 92% 以上核心代碼，以及 Hennink 與 Kaiser（2022）系統性回顧指出個別訪談通常於 9–17 人達飽和，本研究規劃 12 人兼具學理依據與實證充足性。",
        "s2_val": "💡【白話一句話看懂】拿出真憑實據（逐位新增代碼／範疇累積紀錄），證明最後連續訪了 2–3 個人都沒冒出新觀點，才停止收案（達資料飽和）：\n\n【資料飽和（Data Saturation）操作化判準與逐位新增代碼紀錄表（@ 3.1 s35）】\n本研究嚴格執行「邊收案、邊轉錄、邊編碼」，拒絕事後空泛宣稱飽和。停止收案之操作化定義為：「當新增受訪者不再產生新的初始代碼（Initial Codes）與子主題，且連續續訪 2 位受訪者新增代碼數均為 0 時，即判定達成資料飽和」。\n・實際飽和軌跡紀錄（列於論文附錄三）：\n  第 1 位（P01）：新增 19 個代碼 ｜ 第 2 位（P02）：新增 12 個代碼 ｜ 第 3 位（P03）：新增 8 個代碼\n  第 4 位（P04）：新增 6 個代碼  ｜ 第 5 位（P05）：新增 5 個代碼  ｜ 第 6 位（P06）：新增 3 個代碼\n  第 7 位（P07）：新增 2 個代碼  ｜ 第 8 位（P08）：新增 2 個代碼  ｜ 第 9 位（P09）：新增 1 個代碼（累積共 58 個代碼、4 大主題全數成形）\n  第 10 位（P10）：新增 0 個代碼 → 啟動飽和確認，續訪第 11 位（P11，新增 0 碼）與第 12 位（P12，新增 0 碼），連續 3 位新增代碼數為 0，正式確認於第 12 位達成資料飽和。",
        "s3_assign": "💡【白話一句話看懂】交代訪談多久、在哪裡訪、怎麼雙機錄音，以及前 2–3 人試訪（Pilot）後把哪道題目改得更白話好懂：\n\n【資料蒐集程序、雙機錄音與前導試訪修訂紀錄（@ 3.1 s19, s73–74）】\n1. 訪談時長與環境：每位受訪者進行單次一對一半結構深度訪談，時長 45 至 60 分鐘（平均 52 分鐘），於獨立隔音會談室進行，現場僅訪談員與受訪者兩人。\n2. 雙機錄音備援：經書面同意後，現場同步開啟 Sony 專業錄音筆（主機）與開啟飛航模式之加密平板錄音 App（備援機），防範單機故障或音訊遺失。\n3. 前導試訪與提綱修訂軌跡（Pilot Run）：前 3 位受訪者（P01–P03）訪談結束後，研究團隊立即檢視逐字稿，發現原提綱主體二「您如何評估 AI 摘要的準確度？」用語過於學術，受訪者傾向簡答「還算準」。遂於 v2 版提綱將該題具體化改寫為「什麼情況下您看完 AI 摘要，還是會回頭去看原始紀錄？」，成功引出豐富的臨床查證情境；v1 與 v2 提綱對照表完整保留於附錄一。",
        "s3_blinding": "💡【白話一句話看懂】說明研究團隊誰負責問、誰負責記表情動作，以及每次訪完 24 小時內怎麼開會檢討：\n\n【研究團隊角色分工與訪談後立即簡報（Peer Debriefing）】\n・訪談主持人（第一作者）：負責建立信任關係（Rapport）、依漏斗式提綱引導敘說、捕捉受訪者猶豫或苦笑等非語言線索並適時拋出舉例追問（Probes）。\n・逐字稿校對與協同編碼員（第二作者，具長照護理背景之博士生）：不參與現場訪談以保持客觀距離，負責於訪談後 48 小時內執行「第二人對照錄音校對」及前 4 份逐字稿之獨立雙人編碼。\n・方法學督導（指導教授）：每完成 3 場訪談即召開團隊 Debriefing 會議，審閱反思日誌、挑戰初期編碼預設並裁決編碼簿分歧。",

        "s3_ext": "💡【白話一句話看懂】去現場觀察時，嚴格把「① 眼睛看到的動作、② 耳朵聽到的原話、③ 腦袋想到的詮釋」分三欄寫，才不會把腦補當事實：\n\n【參與觀察田野筆記三欄分離（@ 3.1 s30）與多來源三角檢證】\n除 12 場深度訪談外，研究者於早班交接時段（07:45–08:15）及小夜交接時段（15:45–16:15）進行共 8 場次護理站非參與觀察，依 Emerson 等（2011）規範撰寫三欄式田野筆記：\n・第一欄【時間／地點】：如 `2026/11/12 07:52｜A 機構 2F 護理站`。\n・第二欄【客觀描述（看到的、聽到的，零評論）】：如 `早班護理師 P05 看平板 AI 摘要約 25 秒，隨即點開 HIS 原始生命徵象頁面查閱 205 床，轉頭問大夜班：「205 床昨晚體溫 37.8 度，摘要怎麼只寫生命徵象平穩？」`\n・第三欄【研究者反思與推測】：如 `印證訪談所言，AI 將微燒歸類為平穩而省略數值，正是觸發跨班口頭二次確認的導火線！`\n透過「深度訪談（受訪者怎麼說）× 現場觀察筆記（交班時實際怎麼查）× 案例 Q 系統後台修改Log」三方三角檢證，確保證據鏈立體收斂。",
        "s4_pop": "💡【白話一句話看懂】錄音檔在 48 小時內轉成逐字稿，保留嘆氣與停頓，並換成「P01-F-RN」三碼匿名代號加上頁碼行號：\n\n【逐字稿產製四階段標準工序（@ 3.1 s19, s21）】\n1. 雙機錄音與加密歸檔：訪談結束當日將音檔以標準規則命名（如 `CaseL_INT05_20261115.wav`）存入離線加密硬碟。\n2. 第一階段逐字轉譯（保留口語質地）：於訪談後 48 小時內逐字轉錄，完整保留語助詞（「嗯…」「吼」）、停頓秒數（`（停頓 3 秒）`）、情緒反應（`（苦笑）`、`（嘆氣）`）與語氣重音，絕不擅自刪改為流暢書面語。\n3. 第二階段聽音校對：由第二位研究人員一邊播放原始錄音、一邊逐行核對轉譯稿；遇環境雜音致無法百分百確認之字詞，統一標記為 `〔聽不清 00:24:12〕`，嚴禁憑空猜測補字。\n4. 第三階段三碼匿名化：將所有受訪者姓名替換為「流水號—性別—職類」三碼代號（如 `P05-F-RN` 代表第 5 位受訪、女性、護理師；`CW` 為照服員、`HN` 為護理長），文內提及之機構名改為 `〔A 機構〕`、住民床號改為虛擬代號。真實身分與三碼對照表由計畫主持人單獨加密鎖入保險箱，後續 QDA 軟體分析僅使用純匿名版逐字稿。",
        "s4_sampling": "💡【白話一句話看懂】拿到逐字稿後，不靠直覺亂挑句子，而是照著標準分析步驟（邊收案邊編碼）一步步歸納出主題：\n\n【質性分析五原則與 Braun & Clarke 六步驟／分層逐步歸納四階梯（@ 3.1 s32–33）】\n本研究遵循質性分析五原則（目的驅動、系統性、可驗證、從第一場開始邊收邊編、飽和為終點），採開源免費質性分析軟體 Taguette（並匯出 Excel 稽核表，@ 3.1 s37, s72）執行 Braun & Clarke（2006, 2019）六步驟主題分析，其中第 2 至 5 步直接對應分層逐步歸納四階梯：\n・步驟 1（熟悉資料）：兩位研究者反覆沉浸閱讀每份逐字稿 2–3 遍，撰寫初步閱讀備忘。\n・步驟 2（產生初始代碼 → 階梯① 代碼 Code）：逐句檢視語錄，貼上貼近受訪者原話之短標籤（全案共萃取 58 個初始代碼）。\n・步驟 3（聚合為意義單元與子主題 → 階梯② 單元 Unit ＆ 階梯③ 子主題 Sub-theme）：將相似代碼聚合成 18 個意義單元，再向上收斂為 8 個子主題。\n・步驟 4–5（檢視、定義並命名主題 → 階梯④ 核心主題 Theme）：跨全部 12 份逐字稿反覆檢驗主題內部同質性與外部異質性，最終提煉出 4 項核心主題。\n・雙人獨立編碼：前 4 份逐字稿（33.3%）由兩位研究者獨立編碼，初始代碼一致率達 86%，針對 8 處歧異回溯逐字稿上下文討論達成 100% 共識後，定案編碼簿 v2 並完成其餘 8 份編碼。",
        "s4_power": "💡【白話一句話看懂】實際拿受訪者說的一段真話，示範怎麼走完「原話 → 初始代碼 → 意義單元 → 子主題 → 核心主題」四階梯：\n\n【真實語錄分層四階編碼實作示範（語錄 → 代碼 → 意義單元 → 子主題 → 主題，@ 3.1 s22–23, s34）】\n・原始語錄節錄（INT05，P05-F-RN，p.7 L08–15）：\n  L08：「系統幫我把白班小夜三天紀錄縮成一小段，真的省掉很多打字時間啦。」\n  L09：「可是…（停頓 2 秒）只要看到摘要寫『生命徵象穩定』或『情緒尚可』這種籠統的話，」\n  L10：「然後後面沒附上血壓跟體溫數字，我就會心毛毛的！」\n  L11：「萬一他穩定是收縮壓 92 剛剛好及格邊緣呢？我哪敢直接信？」\n  L12：「所以我還是會手賤點開原始護理紀錄再看一眼，或者直接轉頭問夜班學妹：『欸 5 床昨晚血壓到底多少？』」\n・四階梯歸納軌跡：\n  ① 初始代碼（Code）：L08 → `〔濃縮文字省打字〕`；L09–10 → `〔定性摘要缺具體數值致不安〕`；L11 → `〔擔憂臨界異常被平穩字眼掩蓋〕`；L12 → `〔點開原紀錄複查〕`、`〔轉頭向交班者口頭二次確認〕`。\n  ② 意義單元（Unit）：後四碼聚合為 `〔對定性黑箱摘要之防禦性雙重查證〕`。\n  ③ 子主題（Sub-theme）：`2-1 關鍵生理數值被省略引發跨班口頭追問與回查`。\n  ④ 核心主題（Theme）：`主題二：不敢全信，所以再看一次原紀錄`（直接解釋案例 Q 二次確認詢問顯著增加 +0.60 次之機制）。",
        "s4_scenarios": "💡【白話一句話看懂】展示編碼簿（Codebook）的「定義、何時用、何時不用、例句」，並說明兩個人獨立編碼意見不同時怎麼討論出共識：\n\n【編碼簿（Codebook）核心代碼定義與防混淆對照表（@ 3.1 s37 範本格式）】\n1. 代碼 A：`〔定性摘要缺數值致回查〕`（歸屬主題二）\n   ・定義：受訪者因 AI 摘要僅呈現定性結論（如「穩定」「正常」）而未列出具體生理數值或趨勢，產生不確定感而回頭查閱原始紀錄或口頭詢問。\n   ・納入判準：明確提及因缺乏數字、劑量或檢驗值而不敢直接採信摘要之段落。\n   ・排除判準：若受訪者是因為「摘要根本完全漏寫某件家庭／情緒事件」而抱怨，不貼此碼 → 改貼代碼 B `〔非結構化個別脈絡遺漏〕`。\n   ・典型例句：「只要看到摘要寫『生命徵象穩定』但沒附上血壓數字，我就會心毛毛的」（INT05 p.7 L09）。\n2. 代碼 B：`〔非結構化個別脈絡遺漏〕`（歸屬主題三）\n   ・定義：受訪者指出 AI 摘要過度聚焦標準生理項目，卻過濾掉住民家庭動態、情緒地雷或特殊照護偏好等非結構化交辦事項。\n   ・納入判準：提及家屬互動、住民心情轉折、個別安撫技巧被 AI 摘要省略之段落。\n   ・排除判準：若是生理數據被概括化（而非情緒／家庭事件被漏掉），不貼此碼 → 改貼代碼 A。\n   ・典型例句：「3 床阿嬤昨晚因為孫子沒來偷哭，這種情緒地雷摘要常漏掉，但這正是我最想交代的事」（INT08 p.6 L22）。",
        "s5_layout": "💡【白話一句話看懂】具體列出 Lincoln & Guba 四大嚴謹度動作：成員檢核（可信度）、厚描述（可轉移性）、審計軌跡（可靠性）、雙人編碼與正反並陳（可確認性）：\n\n【Lincoln & Guba（1985）可信性四準則（Trustworthiness）具體執行計畫（@ 3.1 s39–40）】\n1. 可信度（Credibility，相當於內在效度）：\n   ・成員檢核（Member Checking）：於四項核心主題與子主題初稿完成後，將 2 頁式圖文摘要送交 4 位不同職類受訪者（P02 護理師、P05 護理師、P08 照服員、P11 護理長）檢視；4 位均確認主題精準反映其心聲，其中 1 位補充了夜班與白班查證時間壓力的差異，已納入主題二修正。\n   ・三角校正（Triangulation）：執行「資料來源與方法三角校正」，將訪談語錄與 8 場護理站現場觀察田野筆記、以及案例 Q 之量化二次確認數據進行交叉比對。\n2. 可轉移性（Transferability，相當於外在效度）：\n   ・厚描述（Thick Description）：於方法章與結果章表 1 詳實記述 A（120 床）、B（96 床）兩家住宿式長照機構之護病比、交班資訊系統架構，以及 12 位受訪者之職類、年資、班別與系統使用頻率，供其他長照機構讀者評估脈絡相似性。\n3. 可靠性（Dependability，相當於信度）：\n   ・稽核軌跡（Audit Trail）：透過 Taguette 與版本控管資料夾，完整留存訪談提綱修訂（v1→v2）、編碼簿三次改版紀錄（v1 初始 64 碼 → v2 合併為 58 碼 → v3 定案 18 單元 4 主題）與 18 則分析備忘錄，讓外部審查者能沿跡複核。\n4. 可確認性（Confirmability，相當於客觀性）：\n   ・雙人獨立編碼與反例呈現：前 4 份逐字稿（33.3%）由兩位研究者獨立編碼並協商分歧；結果章每一主題均嚴格標注三碼代號與逐字稿頁碼行號，並主動呈現少數派反例語錄，證明結論源自資料而非研究者偏見。",
        "s5_clean": "💡【白話一句話看懂】公開研究者的「訪談後自我反省日誌」與指導教授同儕詰問紀錄，證明結論不是研究者自己腦補的：\n\n【研究者反思性（Reflexivity）三件套落實紀錄（@ 3.1 s38）】\n1. 反思日誌（Reflexive Journal，共 12 則，每場訪談當晚撰寫）：\n   ・摘錄（2026/11/10 第 2 場訪談後）：「今天受訪者 P02 知道我們團隊有參與評估這套 AI 系統，前 10 分鐘一直客氣地說『系統很棒』。直到我主動分享『其實我們在數據裡發現大家用完還是常回頭問學姊，我們很想知道哪裡不好用才能幫大家改』，她才鬆一口氣開始講真話。提醒自己後續每場開場都要先破除『官方考核』印象！」\n2. 分析備忘錄（Analytic Memo，共 18 則，編碼過程隨時記錄）：\n   ・摘錄（Memo #09，2026/11/22）：「比較 P03（年資 1 年）與 P11（年資 14 年）的代碼時發現強烈對比：新人把 AI 摘要當成『教我怎麼交班的標準範本』，資深人員卻覺得『AI 打亂我自己腦袋裡的交班順序』。這能否解釋為何 B 機構（資深人員占比高）的 180 日流失率高達 39.3%？已單獨拉出成為第 4 個候選主題！」\n3. 方法章研究者立場聲明（Positionality Statement）：\n   ・公開揭露第一作者之健康科技研究背景與第二作者之臨床長照護理背景，說明兩人如何透過「科技視角 × 臨床視角」之交叉辯論平衡詮釋偏誤，且所有訪談員與受訪者均無任何行政隸屬或考評關係。",
        "s5_desc": "💡【白話一句話看懂】交代 IRB 倫理審查案號、知情同意程序，以及如何保護受訪者隨時可退出且絕不影響考績或就醫權益：\n\n【研究倫理審查（IRB/REC）、知情同意與脆弱保護（@ 3.1 s27）】\n1. 倫理審查：本研究計畫（含案例 Q 與案例 L 兩階段）經國立成功大學人類研究倫理審查委員會（REC）審查通過（核准案號：NCKU-HREC-2026-089）。\n2. 書面知情同意：訪談前逐條說明研究目的、45–60 分鐘時長與雙機錄音用途，由受訪者親簽知情同意書（拆解條款見 @ 3.1 s27）。\n3. 職場權力保護與自主撤回權：強調參與與否及訪談中對資訊系統之任何負面批評，絕對不會回報予機構主管或影響其績效考核；受訪者可於訪談中途隨時要求暫停錄音或於會後撤回部分語錄。\n4. 隱私與資料安全：轉譯過程立即以三碼代號去識別化，涉及住民隱私之床號與病史細節全數模糊化處理；原始錄音檔與加密身分對照表分開儲存於無網路連線之密碼硬碟，研究發表後滿 3 年依法銷毀。",
        "s5_assump": "💡【白話一句話看懂】誠實聲明 AI（如 Claude / ChatGPT）只用來輔助整理去識別化後的初步代碼，嚴守「不傳個資、不讓 AI 命名主題、必回查原話、真人負責」四條紅線：\n\n【生成式 AI 輔助質性研究之合規分工與揭露聲明（@ 3.1 s41–43, s62）】\n本研究遵循課程學術誠信規範，於質性研究流程中適度運用生成式 AI（Claude 3.5 Sonnet）作為輔助工具，並嚴守四條紅線：\n1. 收集前（提綱模擬 Pilot Run）：將訪談提綱 v1 輸入 AI 扮演「資深忙碌且對新科技抱持懷疑之長照護理師」進行模擬問答，據以預先調整生硬措辭（@ 3.1 s28）。\n2. 收集後（去識別化紅線）：嚴格遵守「未經去識別化之原始逐字稿絕不上傳雲端 AI」紅線；所有逐字稿均先由研究人員於本地端完成三碼匿名化與機構名遮蔽後，方選取部分匿名段落進行測試（@ 3.1 s29）。\n3. 分析階段（AI 充當第二編碼比對參考）：針對已去識別化之 15 段代表性語錄，請 AI 依研究問題提供初始代碼建議並與人類編碼者產生比對表（@ 3.1 s41–43）；其中 AI 建議之「定性詞彙掩蓋數值風險」獲研究團隊採納修訂入編碼簿，惟所有最終代碼定義、子主題聚合與四大核心主題命名均 100% 由研究團隊親自討論定奪。\n4. 寫作階段（誠信揭露）：方法章與結果章之所有論述與混合後設推論均由作者親自撰寫，絕不交由 AI 代寫，並於論文末附完整 AI 使用日誌。",

        "s6_mult": "💡【白話一句話看懂】不藏私！主動呈現少數跟大家唱反調的受訪者原話（反例 Negative Cases）或量質矛盾處，反而讓論文更有深度：\n\n【反例呈現（Negative Cases）與量質不一致（Discordance）之深度處理（@ 3.1 s58；@ 3.2 s25）】\n1. 質性內部反例呈現（遵循語錄規則 5）：\n   在「主題二：因缺乏具體數值而不敢全信」中，多數護理師強烈要求摘要必須保留血壓與體溫數字；然而，本研究主動呈現 2 位新進照服員之反向觀點（Negative Case），彼等表示過多醫療數值反而造成閱讀負擔，偏好定性行動指示（「我們照服員不用看那麼多血壓數字啦，它直接告訴我今天翻身要注意哪一床就好」，P03-M-CW，INT03 p.4 L18）。此一反例證明對 AI 摘要的信任判準並非鐵板一塊，而是受到「專業角色職責（醫療監測 vs 生活照護）」之調節。\n2. 量質不一致發現三步處理（對應主題三 × 案例 Q 完整性分數）：\n   ・第一步（檢視方法與工具限制）：為何量性紀錄完整性總分未降（+0.52 分，非劣性成立），質性受訪者卻強烈抱怨「漏掉最想交代的事」？回頭檢視案例 Q 之 0–20 分紀錄完整性評分表題項，研判其配分可能偏重生理徵象、用藥與管路等結構化項目，對心理社會面之交辦較不敏感（須逐題核對配分後確認）。\n   ・第二步（重新檢視脈絡）：長照機構與急性醫院不同，住民長期居住，家屬互動與情緒波動往往才是引發跨班客訴或照護衝突的核心。\n   ・第三步（轉化為新科學洞察）：此「不一致」非但不是研究失敗，反而揭露了「直接移植急性醫療 SBAR 量表評估長照 AI 系統之效度盲點」，成為本研究最具原創性之後設推論。",
        "s6_apa": "💡【白話一句話看懂】論文第四章正式範本：示範「先寫主題論點 → 嵌入帶三碼代號與行號的精選原話 → 並列反例 → 詮釋收尾」的 APA 第 7 版標準寫法：\n\n【APA 第 7 版質性結果章與混合整合寫作示範（嚴格遵循 @ 3.1 s58 語錄六規則）】\n\n第四節　質性主題分析結果與量質共同展示（Joint Display）\n\n本研究針對 12 位跨職類照護人員之深度訪談逐字稿進行主題分析，共提煉出四項核心主題與八項子主題（表 2）：（一）省下的是打字，不是判斷；（二）不敢全信，所以再看一次原紀錄；（三）摘要漏掉的，正是我最想交代的；以及（四）新人依賴它，資深者繞過它。以下依「主題先行、語錄佐證、正反並陳」原則呈現代表性發現。\n\n主題一：省下的是打字，不是判斷\n多數受訪者肯定生成式 AI 摘要工具在「跨班次自由文字濃縮」與「減少重複打字」上之顯著效益，此與第一階段量性研究發現交班準備時間平均縮短 5.37 分鐘（dz = 1.08）高度一致。然而，受訪者普遍將交班工作明確切割為「機械性文書彙整」與「臨床異常推理」兩個層次，強調 AI 僅能代勞前者，而針對住民微小生理變化之病因推敲與處置決策，仍須百分之百仰賴照護人員之專業判斷：\n「它幫我把三天紀錄濃縮成五句話，打字真的快很多…但阿伯今天呼吸有點喘是不是肺炎前兆，這還是要我自己判斷啊。」（P02-F-RN，INT02 p.4 L18–21）\n\n主題二：不敢全信，所以再看一次原紀錄\n儘管文書準備時間縮短，多數護理師與資深照服員在接班閱讀 AI 摘要時，卻發展出「防禦性雙重查證」習慣。當 AI 摘要將連續數值概括為「生命徵象穩定」「進食尚可」等定性詞彙而未附原始數據時，接班者易產生黑箱焦慮，進而點開原始紀錄核對或直接向交班者口頭追問：\n「只要看到摘要寫『生命徵象穩定』但沒附上血壓數字，我就會心毛毛的…萬一他穩定是收縮壓 92 剛剛好及格邊緣呢？所以我還是會點開原始紀錄再看一眼，或直接轉頭問夜班學妹。」（P05-F-RN，INT05 p.7 L09–13）\n相對地，少數負責生活照顧之新進照服員則持不同觀點（反例），認為定性摘要已能滿足其照護需求，無須逐一查核醫療數值：「我們照服員不用看那麼多血壓數字啦，它直接告訴我今天要注意哪一床就好」（P03-M-CW，INT03 p.4 L18）。此一由「定性概括引發之查證需求」，具體解釋了量性階段為何在準備時間縮短之際，接班二次確認詢問次數反而顯著增加 0.60 次（p = .014）。\n\n主題三：摘要漏掉的，正是我最想交代的\n在交班內容品質方面，質性發現修正了量性非劣性檢定之樂觀結論。多位受訪者指出，AI 模型傾向保留體溫、血壓、換藥等結構化醫療詞彙，卻頻繁過濾掉住民情緒波動、家屬特殊抱怨或個別化安撫技巧等非結構化脈絡：\n「3 床阿嬤昨晚因為孫子沒來偷哭，這種情緒地雷摘要常漏掉，但這正是我交給白班最想交代的事！白班不知道，進去講錯話阿嬤就會整天拒食。」（P08-M-CW，INT08 p.6 L22–25）\n透過 Joint Display（表 3）進行量質整合可見，量性 SBAR 完整性總分雖未下降，研判係因該量表配分可能偏重生理醫療項目，對長照場域至關重要之「社會心理與家庭動態交辦」敏感度不足。",
        "s6_interp": "💡【白話一句話看懂】總結這篇研究幫現場解決了什麼問題（具體改版或管理建議），並誠實寫出 2–3 點研究限制與外推邊界：\n\n【研究貢獻、研究限制與實務建議】\n1. 核心學術與實務貢獻：\n   ・展現「質性平行軌（案例 L）× 量性主軸（案例 Q）」之互補價值：單看量性以為系統大獲全勝（省時 5.37 分鐘且完整性不劣），加入質性才揭露「省下的是打字不是判斷」「黑箱焦慮引發二次追問」與「軟性情緒資訊被過濾」三大深層機制。\n   ・提出三項具體系統改版設計：① 介面改採「定性結論＋括號附關鍵數值區間」並支援點擊展開原紀錄（Hover-to-Source）；② AI 提示詞增設「住民情緒與家屬互動地雷」必填欄位；③ 提供新進人員完整版與資深人員極簡版之雙模式切換。\n2. 研究限制（對齊 COREQ 與 GRAMMS 第 5 項）：\n   ・脈絡轉移性邊界：本研究場域為北部兩家 100 床規模之住宿式長照機構，結果轉移至急性醫院加護病房或居家長照場域時須考量護病比與資訊系統差異。\n   ・時序影響限制：質性訪談於系統導入滿 12 週後進行，受訪者對初期適應挫折之描述可能受回憶偏誤或已知量性省時結果影響。"

        "date": "2026-10-30",
        "s1_rq": "💡【白話一句話看懂】用「如何（How）」或「為何（Why）」開頭，把這篇研究想解開的核心謎團與 3 個子問題寫清楚：\n\n【核心現象學研究問題】\n早發性失智症（Young-Onset Dementia, 65 歲以前發病）患者之家庭主要照顧者，在面對正值壯年之伴侶或父母確診後的首年歷程中，如何經驗並詮釋其日常「生活世界（Lifeworld）」的斷裂、親密關係角色的異化，以及如何在不可逆的認知退化中重構照顧的存在意義？\n【具體探索維度】\n1. 時間性（Temporality）與空間性（Spatiality）：確診初期如何衝擊照顧者對中年生涯規畫與家庭空間安全感之主觀體驗？\n2. 關係性（Relationality）與身體性（Corporeality）：當壯年伴侶／父母逐漸喪失記憶與自理能力時，照顧者如何經驗「熟悉的陌生人」之關係張力與全天候警戒之身體負荷？\n3. 意義重構（Meaning Reconstruction）：照顧者如何在「活著的告別（預期性悲傷）」縫隙中，尋回非語言的情感連結與自我存在價值？",
        "s1_why": "💡【白話一句話看懂】先講現實場域發生了什麼痛點或怪現象，說明「為什麼光靠冷冰冰的統計數字沒辦法回答這題」：\n\n【實務脈絡與為何必須採用現象學】\n台灣早發性失智症（45–64 歲發病）人口逐年上升，患者發病時往往仍是家庭經濟支柱或育有就學子女。既有研究多採量化照顧負荷量表（如 Zarit Burden Interview）測量憂鬱與壓力分數，或與高齡失智症混為一談；然而，量化分數無法揭示「看著 54 歲的伴侶在眼前一點一點失去記憶與語言時，那種活生生告別的撕裂感與存在孤寂」。唯有透過現象學回到當事人主觀生活世界（Lived Experience），方能深刻理解其獨特心理創傷並發展具同理深度之支持介入。",
        "s1_h0h1": "💡【白話一句話看懂】質性研究不寫死板的 H₀/H₁，而是說明我們站在什麼認識論視角、把核心概念定義清楚：\n\n【研究認識論立場：海德格詮釋現象學與雙重詮釋學（Double Hermeneutic）】\n本研究結合 Husserl 描述性現象學之「存而不論（Bracketing）」精神與 Heidegger、Smith 等（2009）之「詮釋現象學分析（Interpretative Phenomenological Analysis, IPA）」。\n認識論上主張人類經驗永遠鑲嵌於特定歷史、家庭與文化脈絡（在世存有 Dasein）；研究過程涉及「雙重詮釋學」——受訪者在訪談中努力賦予自身混亂痛苦經驗意義（第一重詮釋），而研究者則以同理與批判兼具之視角，試圖解讀受訪者如何詮釋其經驗（第二重詮釋）。",

        "s1_zm": "💡【白話一句話看懂】誠實寫出研究者自己原本的背景與預設（前理解），以及訪談時怎麼忍住不把自己的偏見塞給受訪者：\n\n【研究者存而不論（Bracketing）與前理解反思（@ 3.1 s38, s74）】\n研究者曾任神經內科記憶門診護理師 4 年，過去臨床上常將家屬的焦慮歸因於「疾病衛教知識不足或未使用喘息服務」，習慣以專業指導者姿態給建議。為避免此一生物醫學前理解遮蔽受訪者的主觀存在感受，研究者於收案前撰寫 3,000 字「存而不論反思備忘」：① 懸置「照顧者應該學會放手送日照」之價值預設；② 在訪談中放下衛教者角色，專注傾聽受訪者使用的隱喻（如『蒸發』『獄卒』）、停頓與眼淚，不急於提供問題解決方案。",

        "s2_principle": "💡【白話一句話看懂】說明怎麼透過適當管道進場域找人，並確保受訪者不是被長官逼來的、敢放心講真話：\n\n【場域進入與脆弱受訪者信任建立】\n經北部某醫學中心失智症共照中心與年輕型失智症家屬支持團體個管師轉介，由個管師先向符合條件之家屬簡介研究並徵得初步意願後，研究者方以電話聯繫。考量受訪者正處於高度情緒負荷期，訪談地點完全依家屬意願安排（於失智共照中心溫馨會談室進行，同時由中心提供患者 2 小時免費安全臨托喘息服務，讓家屬能無後顧之憂地傾訴）。",
        "s2_rel": "💡【白話一句話看懂】用 Malterud「資訊力五維度（目標窄度、樣本特異性、理論、對話品質、分析策略）」向口委證明為什麼訪這幾個人就夠了：\n\n【Malterud（2016）資訊力評估與 IPA 樣本量辯護】\nSmith 等（2009）於《Interpretative Phenomenological Analysis》明確指出，IPA 強調對每一份逐字稿進行極度細膩之「個案內（Idiographic）描述性、語言性與概念性三層次分析」，樣本量過大反而會犧牲詮釋深度而流於表面主題統計，建議碩博士研究以 6–10 人之高同質樣本為佳。本研究招募 10 位親歷早發性失智確診初期衝擊之主要照顧者，平均訪談時長達 82 分鐘，每份逐字稿長達 18,000–25,000 字，對話品質與情緒深度極高，資訊力極為充沛。",
        "s2_val": "💡【白話一句話看懂】拿出真憑實據（逐位新增代碼／範疇累積紀錄），證明最後連續訪了 2–3 個人都沒冒出新觀點，才停止收案（達資料飽和）：\n\n【現象學飽和判準與本質結構穩定度紀錄】\n在現象學研究中，飽和並非指「所有人的小故事細節一模一樣」，而是指「構成該生活經驗本質之核心結構維度（Essential Structural Dimensions）已完整浮現，新個案不再改變既有本質結構」。\n・本質維度收斂紀錄：第 1–6 位受訪者逐步浮現 34 個意義單元與 3 大本質主題群集（時間斷裂與活著的告別、伴侶到守夜人的角色異化、遺忘縫隙中的非語言愛與和解）；第 7–8 位豐富了子主題之隱喻細節但未產生新群集；第 9、10 位受訪者之重要意義陳述 100% 落入既有三項本質結構中，新增本質維度數為 0，確認達成現象學飽和。",
        "s3_assign": "💡【白話一句話看懂】交代訪談多久、在哪裡訪、怎麼雙機錄音，以及前 2–3 人試訪（Pilot）後把哪道題目改得更白話好懂：\n\n【深層現象學訪談程序與情緒支持防護】\n1. 訪談時長與節奏：每位受訪者進行 70–95 分鐘之深層現象學訪談；不同於一般結構化問答，訪談員採「跟隨受訪者敘說脈絡（Following the participant's lead）」原則，給予充裕沉默與流淚空間。\n2. 雙機錄音與非語言脈絡筆記：全程雙機錄音，訪談員於結束後 2 小時內記錄受訪者之語調起伏、嘆氣、握拳、停頓秒數與眼淚等身體化情緒線索，併入逐字稿括號標記。\n3. 心理安全網：現場備有面紙與溫水，若受訪者談及悲傷處情緒潰堤，立即暫停錄音進行同理安撫，確認其意願後方繼續；會後提供臨床心理師免費諮商轉介資訊。",
        "s3_blinding": "💡【白話一句話看懂】說明研究團隊誰負責問、誰負責記表情動作，以及每次訪完 24 小時內怎麼開會檢討：\n\n【研究團隊分工與詮釋學循環討論】\n・第一作者（主訪談與初階詮釋者）：執行全部 10 場深訪、逐字轉譯與個案內三層次註記（描述、語言、概念）。\n・第二作者（精神衛生護理專家）：獨立審閱前 4 份逐字稿之重要意義陳述萃取與建構意義，挑戰第一作者是否過度投射臨床醫學框架。\n・詮釋學循環會議（Hermeneutic Circle Meetings）：每完成 2 個個案即召開討論會，在「單一語句隱喻 ⇄ 整份個人逐字稿 ⇄ 跨個案本質結構」間反覆來回檢證。",

        "s3_ext": "💡【白話一句話看懂】去現場觀察時，嚴格把「① 眼睛看到的動作、② 耳朵聽到的原話、③ 腦袋想到的詮釋」分三欄寫，才不會把腦補當事實：\n\n【非語言身體化線索紀錄（Embodied Field Notes）與雙重詮釋備忘】\n於現象學研究中，受訪者「怎麼說（語調、停頓、隱喻、肢體）」與「說了什麼」同等重要。每場訪談後立即撰寫結構化觀察與詮釋筆記：\n・【客觀非語言觀察】：如 `P01 談及陪先生去辦提早退休手續時，雙手緊緊絞住面紙長達 40 秒，眼神望向窗外，中間停頓 6 秒後苦笑說：「別人的 55 歲在看環遊世界機票，我的 55 歲在看長照尿布目錄。」`\n・【語言性註記（Linguistic Note）】：以「環遊世界機票 vs 長照尿布目錄」之強烈對比隱喻，突顯與同齡朋友生命軌跡脫軌之相對剝奪感與荒謬感。\n・【概念性詮釋（Conceptual Note）】：此為「中年發展時鐘之強行錯置（Biographical Disruption in Midlife）」，構成主題一之核心基石。",
        "s4_pop": "💡【白話一句話看懂】錄音檔在 48 小時內轉成逐字稿，保留嘆氣與停頓，並換成「P01-F-RN」三碼匿名代號加上頁碼行號：\n\n【現象學逐字稿產製四階段規範（含非語言與情緒標記，@ 3.1 s19, s21）】\n1. 雙機高清錄音：確保連低聲啜泣與細微嘆氣皆清晰可辨。\n2. 現象學高保真轉譯：於 48 小時內由主訪談員親自或督導轉錄，除一字不漏保留口語外，嚴格標注停頓秒數（如 `…（停頓 5 秒）`）、情緒轉折（如 `〔聲音顫抖〕`、`〔自嘲乾笑〕`）與肢體動作，因這些正是進入受訪者內在生活世界的鑰匙。\n3. 第二人聽音校對：由協同研究者重聽音檔核對文字與情緒標記精準度。\n4. 三碼去識別化：統一編為「流水號—性別—關係角色」（如 `P01-F-Spouse`、`P07-F-Child`），隱去醫院、公司與居住地名稱。",
        "s4_sampling": "💡【白話一句話看懂】拿到逐字稿後，不靠直覺亂挑句子，而是照著標準分析步驟（邊收案邊編碼）一步步歸納出主題：\n\n【Colaizzi（1978）七步法結合 Smith（2009）IPA 雙軌分析流程】\n本研究融合 IPA 之個案內深度三層次註記與 Colaizzi 七步法之結構化驗證，步驟如下：\n・步驟 1（反覆沉浸閱讀）：重聽錄音並熟讀單一個案逐字稿 3 遍，感受整體情緒基調。\n・步驟 2（萃取重要意義陳述 Significant Statements ＋ IPA 三層註記）：逐行標出與現象直接相關之關鍵語句（全案共萃取 142 條重要陳述），並於頁緣加註描述性、語言性（隱喻／語氣）與概念性註記。\n・步驟 3（建構隱藏意義 Formulated Meanings）：透過雙重詮釋，將受訪者原話轉化為揭示現象心理本質之建構意義（共 46 個建構意義單元），同時檢視未扭曲原意。\n・步驟 4（凝聚主題群集 Theme Clusters）：完成單一個案分析後，跨 10 位受訪者比對建構意義之共性與張力，聚合為 7 個子主題群集與 3 大本質主題。\n・步驟 5–6（撰寫詳盡描述與提煉現象本質結構）：撰寫融合全體經驗之本質結構總描述。\n・步驟 7（返回受訪者驗證 Member Checking）：將本質結構摘要寄回受訪者確認。",
        "s4_power": "💡【白話一句話看懂】實際拿受訪者說的一段真話，示範怎麼走完「原話 → 初始代碼 → 意義單元 → 子主題 → 核心主題」四階梯：\n\n【現象學四階詮釋實作示範（重要陳述 → 語言／概念註記 → 建構意義 → 主題群集 → 本質結構）】\n・原始重要陳述（INT01，P01-F-Spouse，p.5 L11–16）：\n  「醫師說他才 54 歲卻是阿茲海默症那一秒，診間外的聲音全部消失了…（停頓 4 秒，眼眶泛紅）我牽著他的手走去批價櫃檯，他的手還是溫熱的，可是我心裡卻覺得，身邊這個人正在一點一點蒸發，我已經開始在守一個活人的喪禮。」\n・現象學階層詮釋軌跡：\n  ① 語言與非語言註記：`『聲音消失』`（感官抽離與震驚）、`『溫熱的手 vs 正在蒸發』`（肉體尚存但精神消逝之強烈悖論隱喻）、`『守一個活人的喪禮』`（預期性悲傷之極致表達）。\n  ② 建構意義（Formulated Meaning）：壯年確診瞬間引發時間感凍結，照顧者深刻體驗伴侶「身體在場但主體性漸次消散」之模糊性失落與活生生的告別。\n  ③ 主題群集（Sub-theme Cluster）：`1-2 身體在場與心智消散間之『活著的告別』`。\n  ④ 本質主題（Emergent Essence）：`本質主題一：日常時間軸的斷裂與活著的告別`。",
        "s4_scenarios": "💡【白話一句話看懂】展示編碼簿（Codebook）的「定義、何時用、何時不用、例句」，並說明兩個人獨立編碼意見不同時怎麼討論出共識：\n\n【現象學建構意義編碼簿（Codebook）與邊界區辨範例】\n1. 意義單元 A：`〔模糊性失落與活著的告別〕`（歸屬本質主題一）\n   ・定義：受訪者表達患者雖肉體健康存活於眼前，但其記憶、性格與過往共同歷史感正逐步消逝，引發無從正式哀悼之悲傷。\n   ・納入判準：出現「蒸發」「變成空殼」「最熟悉的陌生人」「漫長的道別」等體驗描述。\n   ・排除判準：若受訪者是在描述「因為怕他走丟或開瓦斯而必須全天候盯著他」之角色轉變與疲憊，不貼此碼 → 改貼意義單元 B `〔從親密伴侶異化為守夜監管者〕`。\n   ・典型例句：「他的手還是溫熱的，可是我心裡卻覺得身邊這個人正在一點一點蒸發」（INT01 p.5 L13）。\n2. 意義單元 B：`〔從親密伴侶異化為守夜監管者〕`（歸屬本質主題二）\n   ・定義：因安全風險與自理退化，原先對等之夫妻或親子關係被迫轉化為單向看管、警戒與控制，伴隨親密感喪失與孤立。\n   ・納入判準：描述居家環境改造監控、夜間不敢熟睡、自比為「獄卒／保母／警察」之語句。\n   ・排除判準：若聚焦於情感哀悼而非日常監控角色異化，改歸單元 A。",
        "s5_layout": "💡【白話一句話看懂】具體列出 Lincoln & Guba 四大嚴謹度動作：成員檢核（可信度）、厚描述（可轉移性）、審計軌跡（可靠性）、雙人編碼與正反並陳（可確認性）：\n\n【Lincoln & Guba（1985）可信性四準則與 Colaizzi 第七步落實計畫】\n1. 可信度（Credibility）：\n   ・嚴格執行 Colaizzi 第七步「返回受訪者驗證（Member Checking）」：將提煉出之三大本質主題與詳盡結構描述整理為溫馨易讀之 3 頁手冊，邀請 5 位受訪者（P01, P03, P04, P07, P09）審閱並進行 20 分鐘電話回訪。5 位受訪者皆激動表示「完全寫出我們說不出口的心聲」，其中 P04 建議將「放棄期待」微調為「把期待縮小到今天平安就好」，已據以修正主題三內涵。\n2. 可轉移性（Transferability）：\n   ・提供 10 位早發性失智照顧者之年齡、關係、在職狀態、患者發病年齡（51–62 歲）與 CDR 分級之深厚脈絡描述，使讀者能判斷此本質結構於其他壯年失能家庭之共鳴與適用邊界。\n3. 可靠性（Dependability）：\n   ・建立完整之現象學詮釋軌跡表（142 條重要陳述 → 三層註記 → 46 個建構意義 → 7 個群集 → 3 大本質主題），並由指導教授與精神護理專家進行外部稽核（Inquiry Audit）。\n4. 可確認性（Confirmability）：\n   ・全程維持「存而不論（Bracketing）反思日誌」，每一項建構意義均強制綁定原始語錄頁碼行號與受訪者原創隱喻，杜絕研究者將教科書理論硬套於語料之上。",
        "s5_clean": "💡【白話一句話看懂】公開研究者的「訪談後自我反省日誌」與指導教授同儕詰問紀錄，證明結論不是研究者自己腦補的：\n\n【現象學存而不論（Bracketing）反思日誌與分析備忘錄】\n1. 反思日誌（摘錄自第 4 場訪談後）：\n   「今天男性照顧者 P04 提到他把家門反鎖、覺得自己像『獄卒』時，我腦中第一反應是臨床護理師的警鈴：『這樣限制行動有沒有安全疑慮？要不要衛教他去申請防走失手鍊？』我立刻在心裡踩煞車，提醒自己現在是現象學研究者，不是門診衛教師。正因為我忍住沒打斷他做衛教，他下一句才哭著說出『每次鎖門那聲咔嚓，都像把我們三十年的夫妻尊嚴鎖死』——這才是現象學最珍貴的靈魂語料！」\n2. 詮釋備忘錄（Memo #12）：\n   「跨個案比對發現，無論是配偶或成年子女，和解的轉折點（主題三）幾乎都不是來自『想通某個大道理』，而是來自一個微小的『身體觸覺瞬間』（如患者拍拍女兒冰冷的手、先生替太太扣錯鈕扣卻露出憨笑）。『身體記憶超越大腦記憶（Embodied memory transcends cognitive loss）』應作為主題三之核心概念軸！」\n3. 方法章研究者立場聲明：載明研究者之神經內科護理背景如何協助理解疾病脈絡，以及如何透過存而不論日誌與雙人詮釋討論避免生物醫學化約論。",
        "s5_desc": "💡【白話一句話看懂】交代 IRB 倫理審查案號、知情同意程序，以及如何保護受訪者隨時可退出且絕不影響考績或就醫權益：\n\n【研究倫理審查与高脆弱情緒受訪者保護】\n1. 倫理審查：經醫學中心人體試驗委員會（IRB）審查通過（案號：MMH-IRB-2026-112）。\n2. 創傷知情訪談保護（Trauma-Informed Interviewing）：早發性失智家屬承受極高心理悲傷，知情同意書明確載明受訪者擁有「隨時跳過不想回答的問題、隨時暫停休息、或無條件退出研究且絕不影響其在失智共照中心任何醫療照護權益」之權利。\n3. 免費喘息與心理轉介：訪談期間由共照中心專業人員免費照看患者，並與臨床心理中心建立綠色轉介機制；所有逐字稿以三碼代號去識別化，隱去可能暴露罕見早發個案身分之職業細節。",
        "s5_assump": "💡【白話一句話看懂】誠實聲明 AI（如 Claude / ChatGPT）只用來輔助整理去識別化後的初步代碼，嚴守「不傳個資、不讓 AI 命名主題、必回查原話、真人負責」四條紅線：\n\n【生成式 AI 輔助現象學研究之嚴格限制與揭露聲明】\n考量現象學研究高度仰賴研究者對受訪者「生命受苦、停頓語氣與存在隱喻」之同理共感（Empathic Immersion），本研究對 AI 工具採取最高度節制原則：\n1. 訪談轉錄、重要陳述萃取與「雙重詮釋（建構意義與本質結構提煉）」100% 由研究者親自完成，絕不委由 AI 代勞，以防 AI 平滑化演算法抹去受訪者話語中的矛盾、哽咽與存在張力。\n2. AI（Claude 3.5）僅於兩個低風險環節輔助：① 收案前扮演虛擬家屬測試訪談問題是否過於生硬；② 於全數去識別化且研究者已完成初稿編碼後，請 AI 檢查是否有遺漏之反例段落（Negative Case Check）。所有詮釋權與文字撰寫完全歸屬人類研究者。",

        "s6_mult": "💡【白話一句話看懂】不藏私！主動呈現少數跟大家唱反調的受訪者原話（反例 Negative Cases）或量質矛盾處，反而讓論文更有深度：\n\n【世代角色差異（配偶 vs 成年子女）與反例張力剖析】\n儘管 10 位受訪者共同經歷上述三大本質結構，跨個案比較亦呈現關鍵之次群體張力與反例：\n1. 配偶 vs 成年子女之時間軸張力：配偶組（7 人）的斷裂感集中於「後半生共同退休藍圖的崩塌與夫妻親密感喪失」；而青年子女組（3 人，29–35 歲）則承受強烈的「生涯起步被凍結（同儕在結婚升遷，自己卻在幫 58 歲父親換尿布）」之世代孤立感（「我朋友週末在滑嬰兒車，我週末在推輪椅，我覺得我的三十歲還沒開始就已經老了」，P09-M-Child，INT09 p.8 L14）。\n2. 意義重構之未完成反例（Negative Case）：並非所有受訪者皆能順利抵達主題三之和解。受訪者 P06（照顧具強烈妄想與攻擊行為之額顳葉失智配偶）坦言自己仍困在深沉憤怒與耗竭中，無法感受到任何溫馨瞬間（「老實講，我現在每天只覺得他是一個長得像我先生的怪物，我還在等我自己先倒下」，P06-F-Spouse，INT06 p.14 L02）。誠實呈現此一反例，凸顯當患者合併嚴重額顳葉精神行為症狀（BPSD）時，單靠家屬內在意義重構並不足夠，必須有強力的醫療與機構緊急喘息介入。",
        "s6_apa": "💡【白話一句話看懂】論文第四章正式範本：示範「先寫主題論點 → 嵌入帶三碼代號與行號的精選原話 → 並列反例 → 詮釋收尾」的 APA 第 7 版標準寫法：\n\n【APA 第 7 版現象學結果章寫作示範（融合語言隱喻詮釋與語錄六規則）】\n\n第四節　早發性失智症家庭照顧者生活經驗之本質結構\n\n經由詮釋現象學分析（IPA）與 Colaizzi（1978）七步法之雙重詮釋循環，本研究自 10 位早發性失智症主要照顧者之深度訪談中，提煉出構成其確診初期生活世界之三項核心本質主題：（一）日常時間軸的斷裂與活著的告別；（二）從伴侶到守夜人的角色異化與孤立；以及（三）於遺忘縫隙中重拾非語言的愛與和解。\n\n本質主題一：日常時間軸的斷裂與活著的告別\n對正值壯年期（48–61 歲）之配偶與青年子女而言，早發性失智症的診斷並非漸進老化的自然延續，而是一場毫無預警的「生命傳記斷裂（Biographical Disruption）」。多位受訪者以感官抽離與時間凍結描述診間宣判之瞬間，並使用「蒸發」「空殼」等強烈隱喻，訴說伴侶肉體雖近在咫尺、共享之記憶與人格卻逐日消逝之「模糊性失落（Ambiguous Loss）」：\n「醫師說他才 54 歲卻是阿茲海默症那一秒，診間外的聲音全部消失了…（停頓 4 秒）我牽著他的手走去批價櫃檯，他的手還是溫熱的，可是我心裡卻覺得，身邊這個人正在一點一點蒸發，我已經開始在守一個活人的喪禮。」（P01-F-Spouse，INT01 p.5 L11–16）\n對青年子女而言，此種時間斷裂更表現為與同齡世代生命時鐘之錯置：「我朋友週末在滑嬰兒車，我週末在推輪椅，我覺得我的三十歲還沒開始就已經老了」（P09-M-Child，INT09 p.8 L14）。\n\n本質主題三：於遺忘縫隙中重拾非語言的愛與和解\n儘管承受劇烈的關係異化與安全監控負荷（主題二），多數照顧者在歷經數月之掙扎後，逐漸發展出跨越語言與認知退化的情感連結方式。當患者無法再叫出家人名字時，受訪者從微小的擁抱、眼神交會與體溫撫觸中，重新經驗到存留於「身體記憶（Embodied Memory）」中的愛：\n「後來他忘了我的名字，但那天我抱他時，他拍拍我的背說『妳手好冰，要穿暖』。那一刻我突然懂了，記憶不在了，但愛的本能還在。」（P07-F-Child，INT07 p.12 L19–22）\n然而，研究亦發現當患者合併嚴重額顳葉失智之攻擊與妄想症狀時，此一意義重構歷程將嚴重受阻（反例）：「老實講，我現在每天只覺得他是一個長得像我先生的怪物，我還在等我自己先倒下」（P06-F-Spouse，INT06 p.14 L02），顯示精神行為症狀之醫療控制乃照顧者能否達成心理和解之關鍵前提。",
        "s6_interp": "💡【白話一句話看懂】總結這篇研究幫現場解決了什麼問題（具體改版或管理建議），並誠實寫出 2–3 點研究限制與外推邊界：\n\n【現象學本質洞察、研究限制與臨床實務意涵】\n1. 核心理論與臨床貢獻：\n   ・突破傳統照顧負荷量表之數字扁平化，深刻揭示早發性失智家屬「中年時間軸斷裂」「伴侶異化為守夜獄卒」與「身體化記憶超越認知失落」三層存在結構。\n   ・指引台灣失智共照中心建立「分齡分流支持模式」：針對早發性家庭增設壯年職場家庭喘息專班，並於確診首月即介入「模糊性失落與非語言連結」心理輔導。\n2. 研究限制：\n   ・本研究聚焦於確診後 6–24 個月之輕中度階段且仍居家照顧之家屬，其經驗結構不宜直接外推至重度臥床期或已安置於住宿機構之照顧者；未來研究可採縱貫現象學設計追蹤同一批家屬 3–5 年之演變。"

        "step_digest": {

          "s4": "遵循「先單一個案深耕、再跨個案整合」與「雙重詮釋（受訪者努力理解苦難 × 研究者努力理解受訪者）」。",
          "s5": "依 Colaizzi 第七步，把提煉出的本質結構拿給 5 位家屬看，確認「這真的完全寫出我心底說不出口的痛」。",
          "s6": "結合現象學四大存在維度（空間、身體、時間、關係），呈現具有文學感染力與哲學深度的結果章。"

        "s1_why": "💡【白話一句話看懂】先講現實場域發生了什麼痛點或怪現象，說明「為什麼光靠冷冰冰的統計數字沒辦法回答這題」：\n\n【實務脈絡與理論缺口】\n北部兩家醫學中心急診部於 2026 年上線 AI 敗血症預警模組後，資訊室統計每位專師每個 12 小時班平均接收 31 次彈窗，其中被標示為「已評估、未處置」者占 78%。既有文獻多以科技接受模型（TAM）量表測量「使用意圖」，或以警示覆寫率（override rate）作為結果指標，卻無法解釋「同一位護理師為何有時立即抽血、有時一鍵關閉、有時表面簽核卻私下請住院醫師複查」。目前國內外均缺乏一個能說明急診第一線如何在警示疲勞中動態校準信任的實質理論，此即本研究採紮根理論之核心理由。",

        "s6_mult": "💡【白話一句話看懂】在紮根理論裡，「反例（Negative Cases）」是幫你畫出理論邊界的寶藏！例如資深專師都愛按掉警告，但「剛到職半年的菜鳥」卻把警告當救命仙丹——這剛好證明「臨床年資與既有基模」是關鍵調節變項！\n\n📌【論文正式寫法範本：反例分析（Negative Case Analysis）與理論邊界界定】\n1. 識別反例：於第一、二波訪談中，多數資深專師（年資 > 5 年）皆採取「先看病人氣色再決定是否秒按掉警示」之雙軌過濾策略；然而第三波訪談之新進專師 `P13-F-NP1y` 卻表示：「每次跳紅框我都會全部照單全收、每一條都開抽血單，寧可被醫師唸開太多，也不敢自己按掉」（INT13 p.4 L11）。\n2. 修正並完善理論模型：此反例並未推翻核心模型，反而幫助本研究精確界定出「直覺基模成熟度」作為主軸模型之關鍵中介調節條件——資淺者因尚未建立內在敗血症原型基模，故採取「全盤依賴型防禦」；資深者則採取「選擇性覆寫＋病歷留痕自保」。",
        "s6_apa": "💡【白話一句話看懂】論文第四章正式範本：示範「先寫主題論點 → 嵌入帶三碼代號與行號的精選原話 → 並列反例 → 詮釋收尾」的 APA 第 7 版標準寫法：\n\n第四節　急診專科護理師面對 AI 預警之動態校準歷程\n\n選擇性編碼提煉出核心範疇「在效率壓力與病安究責間動態校準臨床自主權」，統攝三個階段：警示氾濫與麻木期、關鍵事件觸發之表徵快篩期、以及依年資分流之覆寫策略期（圖 2）。\n\n範疇一：警示氾濫與麻木\n上線初期，高頻率彈窗使多數專師將預警視為干擾而非資訊，逐漸形成「先關掉再說」的習慣。專師們並非不重視敗血症，而是擔心照單全收會排擠真正危急的病人：\n「敗血症預警一個夜班跳出三十幾次，八成都是假警報！如果每次都照單全收跑去抽乳酸，真正危急的病人反而沒空顧。」（P03-F-NP，INT03 p.4 L11–14）\n\n範疇三：依年資分流之覆寫策略\n在留痕制度與醫療責任焦慮的中介下，資深專師傾向為自己的判斷負責並選擇性覆寫；新進專師則發展出表面簽核、私下請人複查的防禦性策略：\n「我不像學姊敢直接按忽略，系統留紀錄萬一出事會被告；所以我表面上按『已評估』，私下還是先請值班 R 看一眼當雙保險。」（P14-F-NP，INT14 p.6 L12–15）\n然而，亦有資深專師所屬院區因每週團隊檢討預警個案，始終未出現麻木期（反例），顯示團隊學習機制為本理論之重要脈絡條件。",

        "s1_rq": "💡【白話一句話看懂】用「如何（How）」或「為何（Why）」開頭，把這篇研究想解開的核心謎團與 3 個子問題寫清楚：\n\n【核心研究問題】\n偏鄉地區醫院在導入遠距居家安寧共照模式時，如何克服跨機構權責邊界、健保給付拆帳與家屬夜間緊急處置焦慮？成功落地與推展受阻之個案，其關鍵組織機制有何差異？\n【研究命題（Study Propositions）】\n命題一：高層主管親自跨機構建立信任，是基層診所願意接案的必要條件。\n命題二：硬體到位但給付與後送承諾未對齊時，設備將閒置。\n命題三：結合視訊共診與夜間後送通道，能降低家屬居家照護之孤立感。",
        "s1_why": "💡【白話一句話看懂】政府花了大筆預算買視訊設備給偏鄉醫院做「遠距居家安寧」，結果有的醫院大成功、有的醫院設備放到生灰塵！光看衛福部報表不知道原因，必須深入醫院內部把制度和人際互動挖出來。\n\n📌【論文正式寫法範本：實務困境與多重個案研究缺口】\n1. 政策與現場落差：衛福部近年積極推動偏鄉遠距居家安寧共照，惟全國申報數據顯示各院執行率呈極端M型化——部分偏鄉醫院月共診逾 20 例且居家善終率達 78%，部分醫院卻在設備驗收後半年內使用率趨近於零。\n2. 既有文獻缺口：過往研究多聚焦於視訊硬體滿意度問卷，缺乏從「跨機構組織權責、健保給付拆帳機制与基層診所信任建構」切入之深度解釋，亟需透過 Yin 解釋性多重個案設計，比對成功與受阻醫院之關鍵機制差異。",
        "s1_h0h1": "💡【白話一句話看懂】質性研究不寫死板的 H₀/H₁，而是說明我們站在什麼認識論視角、把核心概念定義清楚：\n\n【方法學定位】\n本研究採 Yin（2018）解釋性多重個案設計，以「醫院導入遠距居家安寧之專案」為分析單位，界定個案邊界為 2025 年 7 月至 2026 年 6 月、該院安寧團隊與合作基層診所及家屬。研究以事先提出之研究命題引導資料蒐集，並以逐項複製（literal replication）與理論複製（theoretical replication）邏輯比較三個個案。",

        "s6_apa": "💡【白話一句話看懂】論文第四章正式範本：示範「先寫主題論點 → 嵌入帶三碼代號與行號的精選原話 → 並列反例 → 詮釋收尾」的 APA 第 7 版標準寫法：\n\n第四節　跨個案綜合分析\n\n跨個案三角檢證顯示，單靠硬體補助無法促成遠距安寧落地（主題二）。個案 B 之專案結案報告雖記載「遠距設備建置完成率 100%」（B-Doc03），惟會議觀察顯示三次會議均未討論收案，護理師訪談亦指出設備長期閒置：\n「因為健保申報拆帳沒談攏，加上半夜病人喘起來沒有綠色急診通道，基層醫師根本不敢開單。」（B-P03，INT-B03 p.4 L16–19）\n相對地，個案 A 與 C 均在導入前由院級主管親赴基層診所建立互信，並簽訂拆帳與後送協議，兩院之運作型態彼此吻合，構成逐項複製（主題一）。排除地理距離與人力規模等競爭性解釋後，給付協議與後送承諾仍是最能解釋三院差異的條件。",
        "s6_interp": "💡【白話一句話看懂】總結這篇研究幫現場解決了什麼問題（具體改版或管理建議），並誠實寫出 2–3 點研究限制與外推邊界：\n\n【貢獻、限制與建議】\n1. 貢獻：以理論複製邏輯指出「設備—給付—後送」三者缺一不可，修正以建置率評估成效之做法。\n2. 建議：補助計畫應同時要求拆帳協議、後送承諾與院級主管參與。\n3. 限制：三院皆為公立偏鄉醫院，結論轉移至私立醫院時須考量經營誘因；個案邊界僅一年，長期永續性仍待追蹤。"

        "s1_rq": "💡【白話一句話看懂】用「如何（How）」或「為何（Why）」開頭，把這篇研究想解開的核心謎團與 3 個子問題寫清楚：\n\n【核心研究問題】\n長照機構導入 AI 交班系統後，照護人員在真實護理站現場如何結合手機摘要、紙本紀錄與非正式口頭溝通完成交班？跨職類與年資權力關係如何形塑其日常交班實作？\n【子問題】\n1. 正式系統之外，存在哪些非正式交班實作與潛規則？\n2. 這些實作如何受到年資、職類與主管在場與否的影響？\n3. 照護人員如何詮釋這些實作的意義？",
        "s1_why": "💡【白話一句話看懂】很多醫院系統上線後，問卷調查都說「滿意度 90%」，但私底下護理師卻還在狂抄紙本小抄！這種「檯面上配合演出、檯面下自求多福」的現場文化，只有靠民族誌蹲點觀察才抓得出來。\n\n📌【論文正式寫法範本：言行落差（Say-Do Gap）與焦點民族誌研究缺口】\n1. 醫療資訊導入之「檯面下實作」黑箱：既有研究多仰賴自填問卷或單次訪談評估 AI 交班系統，卻忽略受訪者常因機構評鑑壓力而給出符合官方期待之「標準答案」，無法解釋為何無紙化系統上線半年後，護理站垃圾桶與口袋仍充斥手寫交班便利貼。\n2. 焦點民族誌之不可替代性：唯有透過長期沉浸於交班現場之參與觀察（Focused Ethnography），直接捕捉照護人員「嘴上說的（What they say）」與「實際做的（What they actually do）」之間的落差，方能揭開隱性保命小抄文化與跨職類權力潛規則。",
        "s1_h0h1": "💡【白話一句話看懂】質性研究不寫死板的 H₀/H₁，而是說明我們站在什麼認識論視角、把核心概念定義清楚：\n\n【認識論立場】\n本研究採詮釋取向之聚焦型醫療民族誌（focused ethnography），認為交班實作是群體共享之文化規範與權力關係的展現。研究者以「參與者兼觀察者」身分進入場域，透過厚描述（thick description）詮釋行為背後的意義。",

        "s2_principle": "💡【白話一句話看懂】去長照機構「蹲點觀察」16 週，最怕護理師和照服員以為你是老闆派來抓偷懶的「抓耙子」！所以進場前一定要先混熟、講清楚「我只研究文化、絕不打小報告」。\n\n📌【論文正式寫法範本：田野進入、信任建立（Rapport）與去監督化定位】\n1. 破除「查勤監督者」標籤：研究者進入長照機構初期，先由護理部主任於全院晨會公開介紹研究者之純學術身分，並由研究者親口向第一線人員承諾：「觀察筆記絕對匿名，且絕不向主管回報任何個人是否使用紙本小抄或未按系統規定操作」。\n2. 漸進式融入田野：第 1–2 週僅在護理站外圍進行被動觀察並協助遞送茶水、整理表單等非醫療庶務，降低現場人員之戒心（Desensitization），待第 3 週起受訪者開始自然在研究者面前拿出私藏手寫便利貼時，方進入核心焦點觀察。",
        "s2_rel": "💡【白話一句話看懂】民族誌不比受訪者人頭多寡，而是比「蹲點觀察的時數與場景廣度」！16 週、36 個班次（早班、小夜、大夜共 108 小時）加上 12 場深度訪談，足以把護理站的日夜潛規則摸得一清二楚。\n\n📌【論文正式寫法範本：田野沉浸密度（Immersion Density）與關鍵報導人資訊力】\n1. 時間與情境覆蓋率：本研究於機構內蹲點 16 週、累計 36 場次（108 小時）參與觀察，完整涵蓋平日與假日、早班（07:30）、小夜（15:30）、大夜（23:30）交班及高壓突發事件（如住民跌倒送醫交接），確保觀察不受單一時段偏差影響。\n2. 關鍵報導人（Key Informants）深度訪談：從觀察中挑選出對現場潛規則最熟稔之 12 位關鍵報導人（含「小抄王」資深護理師、常被插話之新進照服員、外籍照服員組長、護理長），針對觀察到的具體場景進行一對一深度對質與意義詮釋。",
        "s2_val": "💡【白話一句話看懂】民族誌怎麼知道蹲點夠久了？當你在早班、小夜、大夜看了 30 幾場交班，發現「大家掏出小抄的時機、護理師打斷照服員的潛規則」已經一再重複、不再有意外驚喜時，就達到了文化飽和！\n\n📌【論文正式寫法範本：時間／空間抽樣矩陣與文化實作飽和判準】\n1. 跨班次時間與空間抽樣：為避免只看到「白班給長官看的模範交班」，16 週共 36 場次（108 小時）觀察刻意涵蓋：早班交接（12 場）、小夜交接（12 場）、大夜交接（6 場）及病房走廊床邊巡視（6 場）。\n2. 田野飽和軌跡：第 1–4 週（第 1–10 場）識別出 26 項現場交班儀式與非正式人工物（Artifacts，如三色便利貼、LINE 私群組）；第 5–12 週（第 11–28 場）深入釐清跨職類權力互動規則；至第 13–16 週（第 29–36 場），不同班次之交班潛規則與雙軌實作模式完全重複再現，新增文化類別數為 0，確認達田野飽和。",
        "s3_assign": "💡【白話一句話看懂】交代訪談多久、在哪裡訪、怎麼雙機錄音，以及前 2–3 人試訪（Pilot）後把哪道題目改得更白話好懂：\n\n【資料蒐集】\n1. 參與觀察：研究者於護理站旁固定位置觀察，以小本子速記時間、動作與原話片段。\n2. 田野筆記：離開現場 24 小時內擴寫為三欄筆記。\n3. 半結構訪談：將觀察中的疑問帶入訪談追問，每場 40–60 分鐘。",
        "s3_blinding": "💡【白話一句話看懂】在現場觀察時，絕對不能邊看邊拿大筆記本猛抄（大家會嚇到閉嘴）！要先在手機或小紙條記「關鍵詞（Jottings）」，下班後 24 小時內立刻回電腦前擴寫成完整的「三欄式田野筆記」。\n\n📌【論文正式寫法範本：田野速記（Jottings）至三欄式擴寫筆記之標準工序】\n1. 現場微速記原則：於護理站交班現場，研究者僅以口袋小本速記關鍵時間點、肢體動作與核心原話短句（Jottings，每次不超過 10 秒），維持自然眼神接觸。\n2. 24 小時黃金擴寫鐵律：每場觀察結束後當日內，必須趁記憶鮮明將速記擴寫為 2,500–3,500 字之正式田野筆記（Fieldnotes），並嚴格切分為「① 客觀觀察欄（看到什麼動作與物件）」、「② 原話聽聞欄（聽到什麼對話與語氣）」與「③ 反思與方法備忘欄（研究者當下的困惑与詮釋假設）」三欄。",

        "domain": "腫瘤護理・存活者照護・敘事探究",

        "s1_rq": "💡【白話一句話看懂】用「如何（How）」或「為何（Why）」開頭，把這篇研究想解開的核心謎團與 3 個子問題寫清楚：\n\n【核心研究問題】\n40 歲以下年輕乳癌女性在確診至重返職場的兩年歷程中，如何敘說其生育保存抉擇、身體意象斷裂與職場身分重構的關鍵轉折點與生命意義？\n【子問題】\n1. 她們如何組織自己的疾病故事（起點、轉折、結局）？\n2. 哪些時刻被敘說為生命轉折點？轉折前後的自我認同有何改變？\n3. 家人、伴侶、醫療人員與職場如何參與她們的故事？",
        "s1_why": "💡【白話一句話看懂】台灣乳癌患者越來越年輕，30 歲出頭就得病的人，同時要面對「保命 vs 凍卵生子」、「掉光頭髮切乳房 vs 回職場怕被貼標籤」的連續重擊！傳統問卷或切碎的主題分析，根本看不見她們怎麼走過這段漫長人生路。\n\n📌【論文正式寫法範本：年輕乳癌存活者之生命雙重斷裂與敘事研究缺口】\n1. 獨特之生命週期衝擊：台灣年輕型乳癌（< 35 歲）發生率逐年攀升。相較於停經後婦女，年輕女性正值婚育與職涯起飛期，確診瞬間即被迫在 7–14 天黃金期內做出「是否延後化療進行生育保存（凍卵／凍胚）」之高壓抉擇，隨後更面臨身體意象改變與重返職場之多重身分斷裂。\n2. 敘事探究之必要性：既有研究多將生育決策、治療副作用與重返職場切割為三個獨立橫斷面，忽略女性係以「連續的生命故事」整合過去之失去與未來之盼望，亟需以敘事探究完整還原其生命轉折歷程。",
        "s1_h0h1": "💡【白話一句話看懂】質性研究不寫死板的 H₀/H₁，而是說明我們站在什麼認識論視角、把核心概念定義清楚：\n\n【認識論立場】\n本研究採 Clandinin 與 Connelly（2000）之敘事探究觀點，主張人以故事理解生命；研究者與受訪者在訪談中共同建構故事。分析結合 Riessman（2008）主題與結構分析，關注「說了什麼」與「怎麼說」。",

        "s2_principle": "💡【白話一句話看懂】找年輕乳癌病友聊「凍卵、掉髮、切乳房、回職場」這種極度私密的人生創傷，絕對不能只見一次面就問完！必須透過病友團體溫暖邀請，每人分 2–3 次慢慢聊。\n\n📌【論文正式寫法範本：關係倫理導向之招募與多次訪談信任建立】\n1. 溫暖守門人轉介：透過乳房醫學中心個管師與年輕乳癌病友支持團體負責人發出邀請，僅招募已完成急性治療、身心狀態穩定且主動渴望分享生命故事之存活者。\n2. 三次漸進式敘事契約：與每位參與者簽署長期敘事研究同意書，事先說明將進行 3 次深度訪談（第 1 次：建立信任與繪製生命時間軸；第 2 次：搭配照片／日記深談治療與重返職場轉折；第 3 次：共同閱讀並修訂研究者重構之生命故事草稿）。",
        "s2_rel": "💡【白話一句話看懂】敘事研究為什麼只找 6 個人？因為每個人都要深談 3 次、每次 90 分鐘（總共 18 場次、超過 25 小時），還要一起看日記、看照片、畫生命時間軸，把 6 個人的人生故事寫成有血有肉的深度篇章！\n\n📌【論文正式寫法範本：深度生命史之 Malterud 資訊力評估】\n1. 個案深度與對話品質極大化（Strong Dialogue & Longitudinal Depth）：本研究採密集縱貫式敘事訪談，6 位參與者每人進行 3 次深度會談（間隔 2–3 週，總訪談時數達 26.5 小時），並結合治療日記、假髮與排卵針照片等個人生命物件引導，單一個案所蘊含之生命敘事資訊力極為豐厚。\n2. 高度聚焦之經歷同質性：6 位參與者皆為 28–35 歲確診、歷經生殖醫學諮詢與化療手術並已重返全職工作滿 1 年者，能深刻展現「生育—身體—職涯」三軸交織之時間軌跡。",
        "s2_val": "💡【白話一句話看懂】敘事研究為什只找 6 個人就夠了？因為每個人都要深訪 3 次（共 18 場次、超過 25 小時），重點是把每一個人的生命故事寫得立體飽滿（故事完整性），而不是比人頭多！\n\n📌【論文正式寫法範本：敘事飽和（Narrative Saturation）與故事縱深判準】\n1. 個案內故事完整性：每位參與者歷經 3 次訪談（合計 210–240 分鐘），確保其生命故事在 Clandinin 與 Connelly（2000）之三維度敘事空間——時間性（確診前→凍卵→化療→重返職場→未來展望）、社會性（內在自我、伴侶、父母、職場主管）與空間感（生殖中心、化療室、辦公室廁所）皆已形成連貫且具血肉之完整敘事弧線。\n2. 跨故事主軸飽和：至第 5 位參與者完成三訪時，年輕乳癌存活者於生育抉擇、身體意象斷裂與職場重返之三大核心敘事張力與轉折模式已高度清晰；第 6 位參與者之故事進一步豐富細節但未改變四大生命篇章主軸。",
        "s3_assign": "💡【白話一句話看懂】交代訪談多久、在哪裡訪、怎麼雙機錄音，以及前 2–3 人試訪（Pilot）後把哪道題目改得更白話好懂：\n\n【資料蒐集】\n1. 第 1 次訪談（75–100 分鐘）：以開放式邀請「請從您覺得故事開始的地方說起」，並請受訪者繪製生命轉折線圖。\n2. 第 2 次訪談（間隔 3–4 週）：回饋第 1 次之重組故事草稿，深化轉折點並補充遺漏。\n3. 受訪者自願提供之照片、日記或物件作為敘事線索。",
        "s3_blinding": "💡【白話一句話看懂】敘事訪談最大的禁忌就是「研究者一直打斷她、按著題目一題題問」！要把麥克風交給受訪者，請她看著自己畫的「生命時間軸」和「治療日記／假髮照片」自由說故事。\n\n📌【論文正式寫法範本：視覺時間軸與生命物件引導之敘事訪談法】\n1. 生命時間軸繪製（Timeline Mapping）：第一次訪談發給參與者一張 A3 空白圖紙與彩色筆，邀請她自己標出「30 歲確診至今最重要的 5–8 個生命事件與心情高低起伏」，由她自己決定從哪一個事件開始說起。\n2. 生命物件引發記憶（Artifact Elicitation）：第二次訪談邀請參與者攜帶 2–3 件對她意義重大的物品（如：凍卵排卵針空盒、化療時戴的假髮、重返職場第一天的工作證），透過觸摸與凝視物件，喚起深層身體記憶與情感細節。",

        "s3_ext": "💡【白話一句話看懂】去現場觀察時，嚴格把「① 眼睛看到的動作、② 耳朵聽到的原話、③ 腦袋想到的詮釋」分三欄寫，才不會把腦補當事實：\n\n【敘事筆記】\n每次訪談後記錄受訪者的語氣轉折、情緒高點與敘事順序。例如：「P03 講到先生幫自己剃光頭時，語氣從顫抖轉為笑出聲，故事從這裡開始轉向。」",
        "s4_pop": "💡【白話一句話看懂】整理敘事逐字稿時，不能把她的話切碎成零散的句子！要把她 3 次訪談講的內容，順著時間先後重組成一篇有頭有尾、有衝突有轉折的「個人生命故事傳記（Restorying）」。\n\n📌【論文正式寫法範本：敘事逐字稿保存與協同重述（Restorying）工序】\n1. 保留敘事語境之逐字稿：完整記錄共 18 場訪談之對話（含說故事時的哽咽、停頓、自嘲笑聲與研究者之共感回應），不任意刪減鋪陳段落。\n2. 雙階段分析（Polkinghorne, 1995）：\n   ・第一階段「敘事性分析（Narrative Analysis）」：針對每位參與者，將 3 次訪談素材依三維度敘事空間與時間順序，重構為一篇 4,000 字之《個人生命故事專章》，並交由本人審閱修改定稿。\n   ・第二階段「敘事之分析（Analysis of Narratives）」：跨 6 位女性之生命故事，比對她們在關鍵轉折點（Turning Points）之共通母題與差異路徑。",
        "s4_sampling": "💡【白話一句話看懂】拿到逐字稿後，不靠直覺亂挑句子，而是照著標準分析步驟（邊收案邊編碼）一步步歸納出主題：\n\n【分析步驟】\n1. 個案內重組（Restorying）：依時間順序將逐字稿重組為四段故事，標出轉折點。\n2. 三維度分析：依時間性、社會性、空間性標記每一轉折點。\n3. 結構分析：辨識情節走向（如從崩潰到奪回主導權）。\n4. 跨個案比較：比對 8 個故事之情節結構，提煉敘事原型。\n5. 敘事共構：第 2 次訪談請受訪者確認或修正重組故事。",
        "s4_power": "💡【白話一句話看懂】實際拿受訪者說的一段真話，示範怎麼走完「原話 → 初始代碼 → 意義單元 → 子主題 → 核心主題」四階梯：\n\n【轉折點分析示範】\n・語錄（INT03-1，P03-F-35y，p.8 L12）：「電動推剪嚕過去第一道時我閉著眼睛發抖，結果睜開眼看到我老公先幫他自己嚕了一個大光頭，對著鏡子跟我敬禮…那瞬間我從『癌症病人』變回了被愛著的太太。」\n・三維度：時間＝化療第 2 個月；社會＝夫妻共感行動；空間＝自家浴室鏡前。\n・情節結構：身體羞恥 → 伴侶行動 → 認同轉變。\n・敘事原型：伴侶身體共感儀式消解疾病烙印。",
        "s4_scenarios": "💡【白話一句話看懂】敘事研究的編碼不叫「貼冷冰冰的標籤」，而是從故事裡抓出 Clandinin 的「三維度敘事空間（時間、人際、場景）」以及改變她一生的「三大關鍵轉折點（Turning Points）」！\n\n📌【論文正式寫法範本：三維度敘事空間與轉折點（Epiphanies）分析架構】\n1. 三維度敘事空間編碼矩陣（Clandinin & Connelly, 2000）：\n   ・時間性（Temporality）：標記受訪者如何將「過去健康的我 → 確診凍卵時搶時間的我 → 化療掉髮破碎的我 → 未來能否當母親的我」串聯賦義。\n   ・社會性（Sociality）：標記內在情緒張力（恐懼、羞恥、韌性）與重要他人（伴侶態度、父母催生或反對凍卵、職場主管眼神）之互動。\n   ・空間感（Place）：標記關鍵場景之心理氛圍（貼滿嬰兒照卻只有自己一個癌症病人的生殖中心候診室 vs 擺滿冰冷儀器的化療室 vs 躲進去重戴假髮的公司女廁）。\n2. 關鍵轉折點（Turning Points）識別：標定受訪者敘事中「突然頓悟或決定改變活法」之決定性瞬間。",
        "s5_layout": "💡【白話一句話看懂】敘事研究最重視「不要搶走受訪者的話語權」！研究者寫好每位女性的《個人生命故事專章》後，一定在第三次訪談時親手交給她讀，她覺得哪裡不像她說的，就照她的意思改到好（協同重述）！\n\n📌【論文正式寫法範本：敘事真實性（Narrative Authenticity）、逼真度（Verisimilitude）與關係倫理】\n1. 協同重述與成員核對（Co-constructed Restorying）：於第 3 次訪談前，將研究者整理之 4,000 字《個人生命故事篇章》交予參與者閱讀，由參與者親自修訂用詞、確認四幕生命標題是否貼切傳達其心聲（6 位參與者均完成共同定稿）。\n2. 逼真度與共鳴效度（Verisimilitude）：保留受訪者鮮活之第一人稱長段獨白與生活場景細節，使讀者與臨床醫護人員讀後能產生強烈之身歷其境共感。",
        "s5_clean": "💡【白話一句話看懂】公開研究者的「訪談後自我反省日誌」與指導教授同儕詰問紀錄，證明結論不是研究者自己腦補的：\n\n【反思性】\n反思日誌：「P06 談到摘假髮進會議室時，我想到自己照顧過的病人而哽咽。我在日誌寫下這個時刻，提醒自己分析時要分辨：這是她的轉折，還是我投射的感動？」",
        "s5_desc": "💡【白話一句話看懂】交代 IRB 倫理審查案號、知情同意程序，以及如何保護受訪者隨時可退出且絕不影響考績或就醫權益：\n\n【研究倫理】\n經醫學中心人體試驗委員會審查通過（案號：TVGH-IRB-2026-04-019）；訪談可能引發情緒，提供隨時暫停與腫瘤心理師轉介；所有故事去識別化並改寫可辨識細節；照片不公開。",
        "s5_assump": "💡【白話一句話看懂】誠實聲明 AI（如 Claude / ChatGPT）只用來輔助整理去識別化後的初步代碼，嚴守「不傳個資、不讓 AI 命名主題、必回查原話、真人負責」四條紅線：\n\n【AI 使用聲明】\n逐字稿與故事未上傳 AI。AI 僅用於研究者自撰之方法章文字潤飾。故事重組、轉折點與原型分析均由研究者完成。",

        "s6_mult": "💡【白話一句話看懂】不藏私！主動呈現少數跟大家唱反調的受訪者原話（反例 Negative Cases）或量質矛盾處，反而讓論文更有深度：\n\n【未完成的故事（反例）】\n8 位受訪者中，P08 的故事停留在「等待」：她未凍卵、治療後與伴侶分手，重返職場後仍隱藏病史，表示「我的故事還沒有轉折點」。本研究保留其故事的未完成狀態，顯示復原並非線性，也提醒臨床人員不應期待每位存活者都講出「成長故事」。",
        "s6_apa": "💡【白話一句話看懂】論文第四章正式範本：示範「先寫主題論點 → 嵌入帶三碼代號與行號的精選原話 → 並列反例 → 詮釋收尾」的 APA 第 7 版標準寫法：\n\n第四節　年輕乳癌存活者的生命故事\n\n三維度敘事分析顯示，化療前之自費凍卵決策在時間維度上具有超越生育的象徵意義（敘事原型一）。面對家屬「保命優先」的催促，多位受訪者將凍卵詮釋為在生命懸崖邊對未來存活的承諾：\n「我媽在走廊抓著我哭說『保命要緊，生什麼小孩』，但我看著超音波螢幕上的卵泡，覺得那是 32 歲的我留給未來唯一的一顆火種。」（P01-F-32y，INT01-1 p.6 L11–14）\n然而，並非所有故事都走向轉化。P08 未凍卵、治療後結束感情，至今仍隱藏病史：「我的故事還沒有轉折點」（P08-F-34y，INT08-2 p.7 L03）。此一未完成的故事提醒，復原敘事不是唯一出路。",
        "s6_interp": "💡【白話一句話看懂】總結這篇研究幫現場解決了什麼問題（具體改版或管理建議），並誠實寫出 2–3 點研究限制與外推邊界：\n\n【貢獻、限制與建議】\n1. 貢獻：以完整生命故事呈現年輕乳癌存活者跨越生育、身體與職場的轉折，補足橫斷面研究之不足。\n2. 建議：化療前提供生育決策支持；身體意象介入納入伴侶；建立重返職場諮詢。\n3. 限制：受訪者皆已重返職場，未能涵蓋尚未復職或復發者之故事；故事為回溯敘說，受當下處境影響。"

      "storyline": {
        "tag_plain": "說出生命長河故事｜適合研究「病患或專業人員歷經人生重大轉折的生命歷程與自我蛻變」",
        "pain": "32 歲的年輕女性正準備結婚生子，卻突然確診乳癌！她不僅要在短短幾天內決定「要不要先凍卵再化療」，還要經歷掉髮、切除乳房的身體巨變，最後帶著改變的身體重返職場。把她的話切碎成零散代碼，會毀掉這段完整的生命故事。",
        "who_how": "精選 6 位在 35 歲前確診乳癌、且走過「凍卵決策 → 化療手術 → 重返職場」完整歷程的年輕存活者；每人進行 2–3 次深度敘事訪談，並請她們帶來治療期間的日記、假髮照片或給未來孩子的一封信作為「生命物件」引導說故事。",
        "finding": "順著時間長河重構出四幕生命主軸與三大轉折點（Turning Points）：① 急凍未來的母職（在救命與留住當媽媽機會之間搶時間）；② 與破碎身體的漫長談判（假髮下的偽裝與崩潰）；③ 帶著傷疤重返社會的「新正常（New Normal）」與生命優先序重排。",
        "why_method": "當研究重點是「一段隨時間展開的生命歷程、身分認同轉變與關鍵轉折點」，不想把受訪者的故事切碎時，就應該採用 Clandinin & Connelly 的「敘事探究（三維度敘事空間：時間×人際×場域）」！",
        "step_digest": {
          "s1": "聚焦「年輕乳癌存活者從生育保存決策、治療身體衝擊到重返職場的生命故事與自我認同重構」。",
          "s2": "敘事探究重在故事深度！精選 6 位走完完整歷程的年輕女性，每人進行多次訪談以建立深厚信任。",
          "s3": "採用「生命故事時間軸繪製（Timeline Mapping）」與「個人物件引導（照片／日記）」，邀請受訪者當自己故事的導演。",
          "s4": "堅持「不把故事切碎」！結合「敘事分析（重構每個人從過去到未來的完整生命故事）」與「跨故事關鍵轉折點比較」。",
          "s5": "落實「關係倫理（Relational Ethics）」：與受訪者共同核對重構後的生命故事（協同重述 Restorying），守護她的敘事主權。",
          "s6": "依四幕時間軸與關鍵轉折點（Epiphanies）呈現扣人心弦的生命故事與跨個案敘事主題。"
        }

        "s1_rq": "💡【白話一句話看懂】用「如何（How）」或「為何（Why）」開頭，把這篇研究想解開的核心謎團與 3 個子問題寫清楚：\n\n【核心研究問題】\n居家照服員與失能長者家屬，對於在居家場域導入智慧跌倒偵測與自動通報系統，各自抱持何種隱私顧慮、責任歸屬焦慮與功能期待？兩群體之核心張力與可接受之折衷設計為何？\n【子問題】\n1. 照服員如何看待影像型、雷達型與穿戴型感測器？\n2. 家屬期待系統解決什麼問題？\n3. 兩群體能接受哪些折衷方案？",
        "s1_why": "💡【白話一句話看懂】科技大廠開發了超厲害的「AI 跌倒偵測攝影機」，但賣進長照家庭卻常被照服員偷偷拔插頭或拿毛巾蓋住！因為工程師只想到「家屬想看」，卻沒問過「每天在鏡頭下工作的照服員有多反感」。\n\n📌【論文正式寫法範本：多方利害關係人視角衝突與焦點團體研究缺口】\n1. 智慧長照導入之「拔插頭」抗拒現象：居家智慧跌倒偵測系統雖能縮短獨居或失能長者跌倒救援時間，惟實務推展卻頻繁遭遇第一線居家照服員消極抵制（如刻意避開鏡頭作業或遮蔽感測器）。\n2. 雙邊張力亟待團體激盪解開：家屬追求「遠端安心監看」，照服員則捍衛「勞動尊嚴與免於被當小偷或無理究責之恐懼」。單一視角問卷無法捕捉兩群體之互動張力與折衷底線，必須透過分層焦點團體（Stratified FGD）引出群體規範與可接受之去識別化設計。",

        "s6_apa": "💡【白話一句話看懂】論文第四章正式範本：示範「先寫主題論點 → 嵌入帶三碼代號與行號的精選原話 → 並列反例 → 詮釋收尾」的 APA 第 7 版標準寫法：\n\n第四節　照服員與家屬對智慧跌倒偵測之觀點比較\n\n跨分層焦點團體分析揭露兩群體對影像感測器之根本詮釋落差（主題一）。照服員場次提及客廳安裝 AI 鏡頭時，立即引發全場共鳴與抗拒：\n「說穿了哪是看阿公跌倒，根本是在盯我們有沒有滑手機偷懶啦！」（P04-F-CW，FGD-CW1 p.5 L12，全場 6 人同時點頭）\n相對地，家屬場次聚焦於照服員離開後長時間獨居的安全焦慮：\n「沒有畫面確認她平安，我開會手機一響心臟都會漏一拍。」（P15-M-Son，FGD-FM2 p.8 L04）\n少數照服員偏好不涉影像之手環（反例），顯示抗拒對象為影像而非偵測本身。兩群體最終均能接受「照服員在場時自動切換為雷達骨架模式」之折衷設計（主題三）。",
        "s6_interp": "💡【白話一句話看懂】總結這篇研究幫現場解決了什麼問題（具體改版或管理建議），並誠實寫出 2–3 點研究限制與外推邊界：\n\n【貢獻、限制與建議】\n1. 貢獻：以分層焦點團體呈現照服員與家屬對同一科技的對立詮釋，並導出可接受之折衷設計。\n2. 建議：試辦方案採情境感知權限切換；通報附事件脈絡；訂定事故責任協議。\n3. 限制：參與者來自單一縣市；焦點團體可能受團體順從影響，已以少數意見呈現與個別訪談補強。"
      },
      "storyline": {
        "tag_plain": "看群體唇槍舌劍｜適合研究「不同立場群體（如勞方 vs 家屬）的共同痛點與觀點交鋒」",
        "pain": "政府想在失能長者家裡裝「AI 跌倒偵測攝影機」：家屬拍手叫好覺得安心，但到宅服務的居家照服員卻強烈反彈，覺得「根本是在監視我們有沒有偷懶」！這種群體立場衝突與共識底線，一對一訪談很難激盪出火花。",
        "who_how": "採 Krueger & Casey「場內同質、場間分層」黃金原則：把「居家照服員」和「失能長者家屬」分開辦（避免當面吵架或不敢講真話），各辦 3 場焦點團體（每場 6–7 人，共 6 場 40 人），觀察同溫層內的共鳴與爭論。",
        "finding": "透過跨群體對照抓出三大關鍵發現：① 同一個鏡頭，家屬看到「空窗期救命符」，照服員看到「雇主監視器」；② 照服員最怕的其實是「阿公不可抗力跌倒，影片卻被拿來當究責鐵證」；③ 激盪出雙贏解方：照服員打卡上班時，系統自動切換成「去識別化火柴人骨架／毫米波雷達模式」！",
        "why_method": "當你想在短時間內收集多元觀點、觀察「大家怎麼互相接話、吐槽或達成共識（團體動力）」，並比較兩個不同群體的立場差異時，「分層焦點團體訪談（FGD）」是最強大的武器！",
        "step_digest": {
          "s1": "探究「居家照服員」與「長者家屬」對智慧跌倒偵測系統的隱私顧慮、究責焦慮與可接受的折衷設計。",
          "s2": "嚴守 FGD 鐵律：「場內同質（同職類才敢吐苦水）、場間分層（照服員 3 場 vs 家屬 3 場）」，每場 6–8 人剛剛好。",
          "s3": "設計「情境卡片投影題」引爆團體討論，並配置「雙人搭檔（主持人控場防霸麥 ＋ 觀察員畫座位圖記誰點頭誰苦笑）」。",
          "s4": "以「團體互動」為分析單位：不只編碼「誰說了什麼」，更標註「這句話引起全場狂點頭共鳴，還是引發兩派激辯」。",
          "s5": "每場結束最後 10 分鐘，由觀察員當場念出「今日團體五大重點摘要」請全場舉手確認（即時成員檢核），並保護團體保密。",
          "s6": "呈現「團體互動對話片段（展現A接B的話）」與「照服員 vs 家屬雙群體觀點對照表」，導出具體產品改版共識。"

      "data": {

        "domain": "技職教育・長期照護人才培育・焦點團體與德懷術",

        "advisor": "謝楠楨 教授（國立臺北護理健康大學 資訊管理系）",
        "date": "2026-10-30",
        "s1_rq": "💡【白話一句話看懂】用「如何（How）」或「為何（Why）」開頭，把這篇研究想解開的核心謎團與 3 個子問題寫清楚：\n\n【核心研究問題】\n台灣高職照顧服務科應培養學生哪些核心能力指標？應開設哪些基礎與專業課程，方能兼顧技職教育目標與長照產業實務需求？\n【子問題】\n1. 學界與業界專家對文獻草案之能力與課程有何增刪建議？\n2. 經多回合匿名評估後，專家對哪些構面、指標與課程達成共識？",
        "s1_why": "💡【白話一句話看懂】台灣邁入超高齡社會，高職新設了「照顧服務科」，但如果課綱只給大學教授關起門來寫，教出來的學生去長照機構實習馬上水土不服！所以必須結合「產學專家焦點團體＋三回合德懷術」定出大家都服氣的標準。\n\n📌【論文正式寫法範本：技職長照人才培育缺口與兩階段共識方法學理據（@ 3.1 s14–18）】\n1. 學用落差痛點：因應台灣高齡化長照基層人力需求，教育部推動高職設立照顧服務科；惟既有高職課綱多移植自大專護理或老人福祉科系，缺乏針對「15–18 歲高職生認知發展與第一線實務即戰力」量身訂做之核心能力指標。\n2. 為何採用「FGD → Delphi」兩階段混合共識設計：單靠文獻彙整易流於學術象牙塔；先以 2 場產學專家焦點團體（N = 20）進行質性腦力激盪，能大幅翻修不切實際之構面；再以三回合德懷術（N = 10）進行匿名結構化評分與雙閘門檢定，方能兼顧「實務效度」與「客觀統計共識」。",
        "s1_h0h1": "💡【白話一句話看懂】質性研究不寫死板的 H₀/H₁，而是說明我們站在什麼認識論視角、把核心概念定義清楚：\n\n【方法學定位】\n本研究採三階段質性設計：① 文獻分析草擬草案；② 焦點團體發散修訂；③ 德懷術收斂共識（@ 3.1 s06）。德懷術嚴格說屬共識法，本研究以統計判準操作，帶有混合性質（@ 3.1 s09）。",

        "s1_zm": "💡【白話一句話看懂】誠實寫出研究者自己原本的背景與預設（前理解），以及訪談時怎麼忍住不把自己的偏見塞給受訪者：\n\n【研究者立場】\n研究團隊包含曾任照顧服務相關科系教師之成員。為降低影響，FGD 由研究團隊主持但不表達立場；Delphi 全程匿名，專家彼此不知身分。反思日誌記錄研究者對「領導力」構面原本的預設，並在 FGD 分析中接受業界意見修改。",

        "s2_principle": "💡【白話一句話看懂】建構全國高職照服科的能力指標，專家不能只找大學教授（會太理想化），也不能只找機構老闆（會只想要廉價勞工），必須「學界＋業界各半」，而且德懷術問卷要讓專家彼此匿名，才不會被大老牽著走！\n\n📌【論文正式寫法範本：產學平衡專家遴選與德懷術雙盲匿名保護（@ 3.1 s18, s64）】\n1. 第一階段 FGD 產學對等遴選（20 位專家）：採立意抽樣分 2 場舉行——「學界專家場（10 人）」納入長期參與長照技職教育推廣之大學教授與高職主任；「業界專家場（10 人）」納入住宿式與居家長照機構負責人及資深護理主任，確保教育理想與第一線實務直接對話。\n2. 第二階段 Delphi 跨領域權威遴選與匿名保護（10 位專家）：遴選兼具長照教學與實務經驗逾 10 年之專家，三回合問卷採「專家彼此完全匿名（Quasi-anonymity）」方式獨立填答，避免權威效應（Halo Effect）或從眾壓力影響評分客觀性。",
        "s2_rel": "💡【白話一句話看懂】為什麼第一階段找 20 位專家辦 2 場 FGD、第二階段找 10 位權威專家跑三輪德懷術就夠了？因為這群人全都是台灣長照教育與機構營運的頂尖操盤手（資訊力滿分），而且三輪問卷回收率高達 100%！\n\n📌【論文正式寫法範本：專家代表性、資訊力與德懷術團組規模依據（@ 3.1 s18, s64）】\n1. 第一階段 FGD 產學雙軸代表性（20 人）：學界場（10 人）皆為曾主持教育部技職長照計畫之教授與高職群科中心主任；業界場（10 人）皆為經營住宿式／日照／居服機構逾 10 年之主任與督導，直接掌握畢業生聘用痛點。\n2. 第二階段 Delphi 專家團規模與零流失率（10 人）：依 Dalkey 與 Helmer 德懷術經典基準，高度同質之專業領域專家團以 10–15 人最能維持高品質深度回饋；本研究 10 位專家於 R1、R2、R3 三回合問卷均達成 **100% 回收率（零流失）**，共識穩定度極高。",
        "s2_val": "💡【白話一句話看懂】「FGD＋德懷術」怎麼證明共識已經穩定（飽和）？第一階段 FGD 看兩場專家修訂意見有沒有收斂；第二階段德懷術看三回合問卷下來，每一題是不是都通過了「平均數 ≥ 3.5 且四分位差 QD < 1」的雙閘門！\n\n📌【論文正式寫法範本：FGD 質性收斂與三回合德懷術雙閘門穩定度判準（@ 3.1 s65）】\n1. 第一階段 FGD 質性修訂飽和：經學界與業界 2 場共 20 位專家之分層逐步歸納分析，針對文獻初稿之四大關鍵修訂（分拆「人際溝通」與「關懷」、將不切實際之「領導力」改為「問題解決與應變」等）於兩場次均獲高度共識，確立 8 大構面、14 項指標初稿進入德懷術。\n2. 第二階段三回合 Delphi 雙閘門收斂軌跡（10 位專家，三回合回收率皆為 100%）：\n   ・事前設定雙閘門判準：① 重要性閘門：平均數 M ≥ 3.50（或眾數 \text{Mode} ≥ 3）；② 一致性閘門：四分位差 \text{QD} < 1.00（且標準差 \text{SD} ≤ 1.00）。\n   ・收斂歷程：第 1 回合（R1）有 2 項指標 SD 偏高且專家建議新增「案例問題感知能力」（指標增為 15 項）；第 2 回合（R2）與第 3 回合（R3）全數 8 構面、15 項指標及 26 門課程之 M 皆提升至 3.70 ～ 5.00，\text{SD} 全面縮小至 0.00 ～ 0.79，\text{QD} 全數 < 1.00，100% 通過雙閘門，達成專家共識穩定收斂。",
        "s3_assign": "💡【白話一句話看懂】交代訪談多久、在哪裡訪、怎麼雙機錄音，以及前 2–3 人試訪（Pilot）後把哪道題目改得更白話好懂：\n\n【資料蒐集】\n1. FGD：2 場（學界場、業界場），每場約 2 小時，全程錄音並轉逐字稿；主持人＋記錄者，會後立即 debrief（@ 3.1 s18）。\n2. Delphi：三回合匿名問卷，Likert 5 點量表評估適用性並附開放意見；每回合回饋群體統計（M、Mode、QD、SD）與專家本人上輪評分。",
        "s3_blinding": "💡【白話一句話看懂】第一階段辦專家 FGD 時要讓教授和機構主任盡情挑毛病；第二階段發三回合德懷術問卷時，每一輪都要把「上一輪大家的平均分數、四分位差，還有專家們寫的修改理由」匿名整理好寄回去給每位專家參考！\n\n📌【論文正式寫法範本：FGD 主持引導與德懷術三回合結構化回饋機制】\n1. FGD 結構化草案審視：主持人逐一投影文獻初擬之「能力構面與指標定義表」，請專家針對「高職畢業生（18 歲）在長照現場是否真能做到？用詞是否精準？」進行逐條增刪辯論，由兩名記錄員即時標記修訂前後對照。\n2. Delphi 三回合標準化統計回饋（Controlled Feedback）：於 R2 與 R3 問卷中，每一題均並列呈現：①「上一回合全體專家之平均數 M、標準差 \text{SD}、眾數 Mode 與四分位差 QD」、②「您個人於上一回合填答之分數」、③「上一回合其他專家提出之匿名文字修訂意見摘要」。若專家於本輪維持落在四分位距外之極端評分，請其於備註欄簡述專業理由。",

        "s3_ext": "💡【白話一句話看懂】去現場觀察時，嚴格把「① 眼睛看到的動作、② 耳朵聽到的原話、③ 腦袋想到的詮釋」分三欄寫，才不會把腦補當事實：\n\n【逐字稿三步示範（@ 3.1 s21，教學改寫）】\n① 轉譯：林經理：「嗯…領導喔（笑）……高職生進來，你叫他領導誰？」\n② 校對：〔聽不清〕處重聽補為「狀況每天都不一樣」，仍不確定則保留〔聽不清〕。\n③ 匿名：林經理 → P11-M-Mgr.；陳主任 → P14-F-Dir.；機構名改〔機構 C〕。",
        "s4_pop": "💡【白話一句話看懂】第一階段把 2 場專家 FGD 的錄音轉成逐字稿，用「語錄 → 單元 → 主題」四階梯整理出修改建議；第二階段把三回合德懷術問卷放進統計表，算出每一題的 M、SD、Mode、QD 有沒有過關！\n\n📌【論文正式寫法範本：FGD 逐字稿分層歸納與 Delphi 三回合統計檢核工序】\n1. 第一階段 FGD 逐字稿清理与編碼：2 場共 240 分鐘錄音於 48 小時內轉錄為逐字稿，專家以三碼代號標示（如 `P01-M-Prof.` 代表第 1 位男性學界教授；`P07-F-Mgr.` 代表第 7 位女性機構主管），依分層逐步歸納四階梯將專家原話轉化為具體指標修訂動作（拆分、改名、合併、新增）。\n2. 第二階段 Delphi 統計資料清理與雙閘檢驗：10 位專家三回合五點李克特量表（1=非常不重要，5=非常重要）填答資料經雙人建檔核對零缺失後，逐題計算集中趨勢（M、\text{Mode}）與離散程度（\text{SD}、\text{QD} = (Q3 - Q1)/2），並比較 R1 \to R2 \to R3 之平均數提升與標準差收斂幅度。",
        "s4_sampling": "💡【白話一句話看懂】拿到逐字稿後，不靠直覺亂挑句子，而是照著標準分析步驟（邊收案邊編碼）一步步歸納出主題：\n\n【分析程序】\n1. FGD：分層逐步歸納法（代碼 → 單元 → 子主題 → 主題），團隊交叉檢視（@ 3.1 s33）。\n2. 草案修訂：將主題轉化為構面與指標之增刪改名。\n3. Delphi：計算 M、Mode、QD（＝IQR／2）、SD，以雙閘判準決定保留、修改或刪除（@ 3.1 s50）。",
        "s4_power": "💡【白話一句話看懂】實際拿受訪者說的一段真話，示範怎麼走完「原話 → 初始代碼 → 意義單元 → 子主題 → 核心主題」四階梯：\n\n【FGD 編碼到草案修訂示範（@ 3.1 s22–23）】\n・代碼（7）：突發狀況頻繁｜情境不可預測｜判斷處置順序｜知道求助對象｜個案問題分析｜個案問題解決｜領導力與發展階段不符\n・單元（3）：〔臨場應變〕｜〔個案問題處理〕｜〔領導力不適齡〕\n・子主題：現場需要的是「處理問題」，不是「帶人」\n・主題：「問題解決與即興應變」才是高職生的核心能力\n・草案修訂：構面「領導力」改為「問題解決與即興應變」，下設指標「解決問題能力」；Delphi 第二回合再增「案例問題感知能力」。",
        "s4_scenarios": "💡【白話一句話看懂】這篇研究有兩套過關標準：第一階段 FGD 用「分層逐步歸納法」把專家吐槽的話變成指標修改動作；第二階段德懷術用超嚴格的「雙閘門公式（重要度 M ≥ 3.5 且一致度 QD < 1）」決定哪個指標留下來！\n\n📌【論文正式寫法範本：FGD 修訂編碼規則與 Delphi 雙閘門（Dual-Gate）統計判準（@ 3.1 s64–65）】\n1. 第一階段 FGD 指標修訂代碼（4 類動作）：\n   ・`〔#構面分拆〕`：如專家指出「能大聲溝通」與「能同理安撫失智長者」屬不同能力，故將「人際溝通與關懷」分拆為兩獨立構面。\n   ・`〔#構面重新定錨〕`：如業界專家一致認為高職生無須擔任機構「領導者」，故將「領導力」改為現場最迫切之「問題解決與突發應變能力」。\n2. 第二階段 Delphi 雙閘門共識保留判準（五點量表 1–5 分，須同時通過兩道閘門方予保留）：\n   ・**閘門一（重要性門檻）**：平均數 M ≥ 3.50（或眾數 Mode ≥ 3）。\n   ・**閘門二（共識一致性門檻）**：四分位差 \text{QD} < 1.00（且標準差 \text{SD} ≤ 1.00）。\n   ・跨回合收斂檢核：比較 R1 → R2 → R3，全數 8 構面、15 指標與 26 門課程之 M 均穩步上升（R3 達 3.70 ～ 5.00），SD 均顯著縮小（R3 縮小至 0.00 ～ 0.79）。",
        "s5_layout": "💡【白話一句話看懂】專家共識研究怎麼做到最嚴謹？第一，FGD 修訂後的草案拿給與會專家確認沒改錯；第二，德懷術三輪完全匿名（大教授不知道誰給低分，不會有壓力）；第三，把三輪每一題的 M 和 SD 變化完整攤在陽光下！\n\n📌【論文正式寫法範本：CREDES 德懷術國際報告規範與嚴謹度四準則落實】\n1. 可信度與專家效度：第一階段 FGD 後之修訂草案經與會代表核對確認（Member Checking）；第二階段 R1 開放專家提出新增指標建議（據此於 R2 新增「案例問題感知能力」1 項指標）。\n2. 可確認性（匿名防權威偏誤）：德懷術三回合採個別加密問卷寄送，專家間互不知曉他人身分，僅透過統計摘要（M、SD、Mode、QD）與匿名文字理由進行理性對話，徹底排除會議一言堂效應。\n3. 可靠性（完整三回合軌跡公開）：完整公開文獻初稿 → FGD 修訂稿 → Delphi R1/R2/R3 三回合每一構面、指標與課程之統計數值演進軌跡。",
        "s5_clean": "💡【白話一句話看懂】公開研究者的「訪談後自我反省日誌」與指導教授同儕詰問紀錄，證明結論不是研究者自己腦補的：\n\n【反思性】\n分析備忘錄：「學界與業界都提到『先看得出問題、再會處理』，兩場說法開始重複，這是快飽和的訊號。」反思日誌：「我原本認為領導力很重要，但業界的例子讓我修正了預設。」",
        "s5_desc": "💡【白話一句話看懂】交代 IRB 倫理審查案號、知情同意程序，以及如何保護受訪者隨時可退出且絕不影響考績或就醫權益：\n\n【研究倫理】\n經研究倫理委員會審查；FGD 參與者簽署同意書（REC 焦點團體版，@ 3.1 s27）；三碼匿名編碼；Delphi 全程匿名。",

        "s6_mult": "💡【白話一句話看懂】不藏私！主動呈現少數跟大家唱反調的受訪者原話（反例 Negative Cases）或量質矛盾處，反而讓論文更有深度：\n\n【不一致與限制】\nDelphi 產出的是「共識」不是「真理」——專家也可能集體出錯，須寫入研究限制（@ 3.1 s45）。此外，學界與業界在部分課程（如特色課程）之看法並不一致，研究分場呈現並說明整合方式。",
        "s6_apa": "💡【白話一句話看懂】論文第四章正式範本：示範「先寫主題論點 → 嵌入帶三碼代號與行號的精選原話 → 並列反例 → 詮釋收尾」的 APA 第 7 版標準寫法：\n\n第四節　焦點團體與德懷術結果\n\n經兩場焦點團體（N ＝ 20）之分層逐步歸納分析，業界專家普遍指出高職生於實習現場最迫切者為突發狀況處置，而非帶領團隊：\n「半夜阿伯突然喘起來，家屬又不在，他要知道先做什麼、打給誰。那個比較重要。」（P11-M-Mgr.，業界場，教學改寫）\n學界場亦出現「與其教帶團隊，不如教他看懂個案出了什麼問題」之呼應，故將原草案「領導力」構面修訂為「問題解決與即興應變」。接續三回合德懷術（N ＝ 10），第二回合依專家意見新增「案例問題感知能力」，指標由 14 項增為 15 項；最終 8 大構面、15 項能力指標與 26 門課程均通過重要性（M ≥ 3.5 或 Mode ≥ 3）與一致性（QD < 1 或 SD ≤ 1）之雙閘共識標準（Hsieh et al., 2022）。",

        "s1_rq": "💡【白話一句話看懂】用「如何（How）」或「為何（Why）」開頭，把這篇研究想解開的核心謎團與 3 個子問題寫清楚：\n\n【量性研究問題（QUAN）】\n導入 AI 照護紀錄摘要工具後，交班準備時間是否顯著縮短？紀錄完整性是否因此下降？\n【質性研究問題（qual）】\n照護人員以 AI 摘要交班時，如何判斷何者可信、何者須回頭查證？此判斷歷程受何因素影響，並衍生哪些因應策略？\n【混合整合問題（MM）】\n照護人員之信任判斷歷程，如何解釋量性階段「時間縮短但二次確認詢問反而增加」之結果？",
        "s1_why": "💡【白話一句話看懂】先講現實場域發生了什麼痛點或怪現象，說明「為什麼光靠冷冰冰的統計數字沒辦法回答這題」：\n\n【為何要混合】\n案例 Q 只能回答「時間有沒有縮短」，無法回答「為什麼有人不敢全信」；後者才是機構決定是否續用的關鍵（@ 0 s24）。量性告訴我們差多少，質性告訴我們為什麼會這樣（@ 3.1 s73）。",
        "s1_h0h1": "💡【白話一句話看懂】質性研究不寫死板的 H₀/H₁，而是說明我們站在什麼認識論視角、把核心概念定義清楚：\n\n【設計配方與哲學立場】\n採 Creswell 與 Plano Clark（2018）解釋性序列設計：QUAN → qual，以量性為主、質性用以解釋量性之意外發現（@ 3.2 s12, s55）。哲學立場為務實主義（@ 3.2 s08）。\n【量性假設（承案例 Q）】\nH1：導入後交班準備時間顯著縮短。H2：紀錄完整性不劣於導入前（非劣性界限 −1.0 分）。",

        "s2_principle": "💡【白話一句話看懂】混合研究最厲害的地方就是「第二階段質性訪談的 12 個人，是直接從第一階段做過量化實驗的那 62 個人裡面挑出來的（巢套樣本）」！這樣同一個人的「統計數字」跟「親口說的話」才能完美對起來！\n\n📌【論文正式寫法範本：巢套樣本（Nested Sample）設計與兩階段自願招募保護（@ 3.2 s28–29）】\n1. 巢套與銜接抽樣關係：本研究第二階段質性受訪者（n = 12）完全取自第一階段量性準實驗研究之有效分析樣本（N = 62，北部 A、B 兩家住宿式長照機構）。此「巢套關係（Nested Relationship）」確保每位質性受訪者皆具備完整之個人前測、後測交班時間差分值（Δᵢ）、SBAR 完整性分數與二次確認次數紀錄。\n2. 雙階段知情同意與盲法保護：受訪者於第一階段簽署同意書時即勾選「是否願意於後續接受深度訪談」；第二階段由獨立質性研究員依系統計算之分層名單私下聯繫受訪者，機構主管不會得知誰被抽中受訪，且主訪者於訪談前半段先以開放態度傾聽，避免以已知數據先入為主誘導回答。",
        "s2_rel": "💡【白話一句話看懂】用 Malterud「資訊力五維度（目標窄度、樣本特異性、理論、對話品質、分析策略）」向口委證明為什麼訪這幾個人就夠了：\n\n【樣本量辯護】\n量性：事前樣本數（dz = 0.5, α = .05 雙尾, power = .80）＝ 33.37 → 取 34（驗證報告）。質性：12 人，參考 Guest 等（2006）約 12 位趨於飽和、Hennink 與 Kaiser（2022）個別訪談 9–17 位。",
        "s2_val": "💡【白話一句話看懂】在混合研究裡，第一階段量化靠「統計檢定力 Power（62 人 1,488 筆交班）」把關；第二階段質性靠「銜接分層抽樣 12 人＋第 10 位後不再出現新主題（飽和）」把關！\n\n📌【論文正式寫法範本：量質雙軌樣本量辯護與資料飽和紀錄（@ 0 s23–24）】\n1. 第一階段量性檢定力（QUAN Power）：納入 A 機構（34 人）與 B 機構（28 人）共 62 位交班人員、1,488 筆交班事件。針對主要結果「交班準備時間變化」，實測效應量達 dz = 1.08（雙重差分 \text{DiD} = -4.76 分鐘，p < .001），統計檢定力逾 .99。\n2. 第二階段質性飽和證據（qual Saturation）：依第一階段個人省時幅度分為「改善最多組（前 25%，4 人）」、「改善最少組（後 25%，4 人）」與「中段組（4 人）」共 12 人，並通過職類（護理師 7、資深照服員 3、主管 2）、年資與機構三軸線異質性檢核。逐位編碼紀錄顯示：INT01–INT06 浮現 28 個初始代碼與全數 4 大主題；INT07–INT10 補充「資深者繞過系統」之細節代碼 5 個；至 INT11 與 INT12 連續 2 位新增代碼與新子主題皆為 0，確認達資料飽和。",
        "s3_assign": "💡【白話一句話看懂】交代訪談多久、在哪裡訪、怎麼雙機錄音，以及前 2–3 人試訪（Pilot）後把哪道題目改得更白話好懂：\n\n【資料蒐集】\n1. 量性：2026 年 9 月至 2027 年 8 月；交班準備時間採第三方觀察計時；紀錄完整性 0–20 分、兩位評分者；另收二次確認詢問次數、認知負荷與 AI 信任（@ 0 s23）。\n2. 質性：半結構深度訪談每次 45 至 60 分鐘，全程錄音轉逐字稿；前 3 次訪談後修訂大綱，修訂前後版本均保留（@ 0 s24）。",
        "s3_blinding": "💡【白話一句話看懂】在解釋性序列混合研究中，「第一階段的統計異常結果」就是我們設計「第二階段訪談題目」的藏寶圖！哪個數字怪怪的，訪談題目就往哪裡追問！\n\n📌【論文正式寫法範本：以量性發現驅動質性提綱之銜接設計（Building Integration）】\n1. 兩階段研究團隊協作：第一階段完成量性統計分析後，量化統計人員與質性訪談人員召開「量質銜接工作坊」，盤點出三個單靠統計無法解釋的關鍵問號：① 為何準備時間大減 5.37 分鐘，接班二次確認詢問卻反增 0.60 次（p = .014）？② 為何 SBAR 完整性總分不劣（+0.52 分），現場卻有人抱怨摘要漏東西？③ 為何 B 機構 180 日停止使用率（39.3%）高於 A 機構（17.6%）？\n2. 轉化為漏斗式追問提綱：將上述三個量性問號直接轉譯為質性訪談提綱之三大主體追問區塊（Probes），但在提問時先不揭露全院統計數字，而是請受訪者具體描述自己看摘要、翻原紀錄與問上一班的真實過程。",

        "s3_ext": "💡【白話一句話看懂】去現場觀察時，嚴格把「① 眼睛看到的動作、② 耳朵聽到的原話、③ 腦袋想到的詮釋」分三欄寫，才不會把腦補當事實：\n\n【GRAMMS 六項規劃（@ 3.2 s30）】\n① 為何混合：量性可評估成效，但無法說明為何二次確認增加。\n② 設計：解釋性序列 QUAN → qual，以量性為主。\n③ 各方法：量性 62 人準實驗 DiD；質性 12 人主題分析。\n④ 整合：依量性結果銜接抽樣；以 Joint Display 整合，由兩位研究者共同詮釋。\n⑤ 限制：訪談在量性結束後進行，受訪者可能受已知結果影響。\n⑥ 洞察：省下的是打字，不是判斷。",
        "s4_pop": "💡【白話一句話看懂】每個受訪者都有一組「雙軌專屬身分證（例如 P05-F-RN｜量性省時 −6.2 分鐘、追問 +1.5 次）」，把他的統計數字跟他的逐字稿綁在一起，才能做出最精彩的 Joint Display 對照表！\n\n📌【論文正式寫法範本：量質雙軌資料連結（Data Linking）與逐字稿清理工序】\n1. 雙軌連結識別碼（Linked ID）：以去識別化代碼將每位受訪者之「第一階段量性個人指標（前測時間、後測時間、Δ 變化量、二次確認次數、SBAR 得分）」與「第二階段質性逐字稿（`INT01`–`INT12`）」建立一對一關聯索引。\n2. 逐字稿清理與四階編碼：12 場訪談錄音於 48 小時內轉錄為含頁碼行號之逐字稿；前 4 份（33%）由兩位研究者獨立執行 Braun & Clarke 主題分析編碼，建立編碼簿共識後完成全數 12 份編碼，最後將四大質性主題與四大王牌量性發現匯入 Joint Display 矩陣進行整合比對。",
        "s4_sampling": "💡【白話一句話看懂】拿到逐字稿後，不靠直覺亂挑句子，而是照著標準分析步驟（邊收案邊編碼）一步步歸納出主題：\n\n【次要結果】\n紀錄完整性：差 +0.52 分，95% CI [−0.32, 1.35]，CI 下界 −0.32 高於非劣性界限 −1.0，非劣性成立。二次確認詢問次數：差 +0.60 次，t(33) ＝ 2.59，p ＝ .014，95% CI [0.13, 1.06]。180 日累積流失率：A 機構 17.6%、B 機構 39.3%。",

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw){
      // 初次開啟預設自動載入案例 L（qual_thematic），讓學生一進來就看到完整豐富內容
      const init = defState();
      const p = PRESETS.qual_thematic;
      if(p && p.data){
        Object.keys(p.data).forEach(k=>{ init[k] = JSON.parse(JSON.stringify(p.data[k])); });
      }
      return init;
    }
    const o = JSON.parse(raw);
    return Object.assign(defState(), o);
  }catch(e){
    return defState();
  }
}

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    const el = document.getElementById("saved");
    if(el){
      const d = new Date();
      el.textContent = "已自動儲存於瀏覽器（" + d.toTimeString().slice(0,8) + "）";
    }
  }catch(e){}
}

function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function filled(v){
  if(Array.isArray(v)) return v.some(r=>Array.isArray(r) ? r.some(c=>String(c||"").trim().length>2) : String(r||"").trim().length>2);
  return String(v||"").trim().length > 2;
}

function stepPct(sid){
  const st = STEPS.find(x=>x.id===sid);
  if(!st || !st.req.length) return 0;
  const done = st.req.filter(k=>filled(S[k])).length;
  return Math.round(done / st.req.length * 100);
}

function totalProg(){
  const core = ["s1","s2","s3","s4","s5","s6"];
  const pcts = core.map(stepPct);
  const full = pcts.filter(x=>x===100).length;
  const avg = Math.round(pcts.reduce((a,b)=>a+b,0)/core.length);
  return {full, total:core.length, avg};
}

function applyPreset(pid, silent){
  const p = PRESETS[pid];
  if(!p) return;
  const keepStep = S.step;
  const d = JSON.parse(JSON.stringify(p.data));
  Object.keys(d).forEach(k=>{ S[k] = d[k]; });
  S.design = d.design;
  const ds = DESIGNS[S.design];
  if(ds && ds.checklist){
    S.chk = {};
    ds.checklist.forEach((_,i)=>{ S.chk[S.design+"_"+i] = true; });
  }
  S.gate = {};
  Object.keys(MODS).forEach(m=>{
    (MODS[m].gate||[]).forEach((_,i)=>{ S.gate[m+"_"+i] = true; });
  });
  S.step = keepStep;
  save();
  if(!silent) render();
}

// ==================== 共用表格與句型元件 ====================
function gridHTML(k, cols, widths){
  const rows = Array.isArray(S[k]) && S[k].length ? S[k] : [cols.map(()=>"")];
  return `<div class="gwrap" data-grid="${k}">
    <table class="tbl">
      <thead><tr>${cols.map((c,i)=>`<th style="${widths&&widths[i]?`width:${widths[i]}`:""}">${esc(c)}</th>`).join("")}<th style="width:42px">刪</th></tr></thead>
      <tbody>
        ${rows.map((r,ri)=>`<tr>
          ${cols.map((_,ci)=>`<td><textarea data-gr="${k}" data-r="${ri}" data-c="${ci}" rows="2">${esc(r[ci]||"")}</textarea></td>`).join("")}
          <td style="text-align:center"><button type="button" class="btn sm" data-gdel="${k}" data-r="${ri}" title="刪除此列">✕</button></td>
        </tr>`).join("")}
      </tbody>
    </table>
    <button type="button" class="btn sm" data-gadd="${k}" data-cols="${cols.length}">＋ 新增一列</button>
  </div>`;
}

function chipsHTML(itemOrArr, targetKey){
  if(!itemOrArr) return "";
  const arr = Array.isArray(itemOrArr) ? itemOrArr : [itemOrArr];
  const valid = arr.filter(t => t && String(t).trim().length > 0);
  if(!valid.length) return "";
  return `<div class="chips">${valid.map(t=>`<button type="button" class="chip" data-ins="${targetKey}" data-txt="${esc(t)}">＋ 帶入計畫書萬用句型：${esc(t.slice(0,42))}…</button>`).join("")}</div>`;
}

  const passAll = passImp && passCon;
  return `<div class="tool" id="s6_tool">
    <h4>
      <span>💬 @ 3.1 第 58 張「語錄使用六規則」快速把關 ＆ 德懷術雙閘門試算器</span>

    </h4>
