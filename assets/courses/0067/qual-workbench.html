      <b>📌 論文第四章「語錄使用六規則」：</b>
      ① <b>先寫論點、再放語錄</b>（不可用受訪者原話代替你自己的分析句）｜
      ② <b>必標三碼匿名代號與出處行號</b>（如 <code>P05-F-RN，INT05 p.7 L09</code>）｜
      ③ <b>一段一則代表性語錄為原則</b>（不堆砌流水帳）｜
      ④ <b>保留真實口語與語氣</b>（適度用「…」刪減贅字但不改原意）｜
      ⑤ <b>主動並陳反例（Negative Cases）</b>（展現分析廣度與誠實度）｜
      ⑥ <b>引完語錄必寫 1–2 句詮釋收尾</b>（點出這句話如何支撐子主題或呼應量性數據）。
    </div>
    ${S.design==="fgd_delphi" ? `<div class="grid g4" style="margin-top:8px">
      <div class="fld" style="margin:0"><label>平均數 M（門檻 ≥ 3.50）</label><input type="number" step="0.05" data-delphi="mean" value="${d.mean}"></div>
      <div class="fld" style="margin:0"><label>眾數 Mode（門檻 ≥ 3）</label><input type="number" step="1" data-delphi="mode" value="${d.mode}"></div>
      <div class="fld" style="margin:0"><label>四分位差 QD（門檻 < 1.00）</label><input type="number" step="0.05" data-delphi="qd" value="${d.qd}"></div>
      <div class="fld" style="margin:0"><label>標準差 SD（門檻 ≤ 1.00）</label><input type="number" step="0.05" data-delphi="sd" value="${d.sd}"></div>
    </div>
    <div class="res" style="margin-top:8px">
      <b>🎯 德懷術雙閘檢定結果：${passAll ? "✅ 通過雙閘門（保留該能力指標／課程）" : "⚠️ 未通過雙閘門（需於下一回合修正或刪除）"}</b>
      （重要性閘門：M=${d.mean}、Mode=${d.mode} → ${passImp?"通過":"未過"}；一致性閘門：QD=${d.qd}、SD=${d.sd} → ${passCon?"通過":"未過"}）
    </div>` : ""}
  </div>`;
}

function issues(){
  const list = [];
  const reqMap = [
    ["s1_rq","步驟 ① 核心研究問題 (RQ)"],["s1_why","步驟 ① 實務脈絡與研究缺口"],["s1_zm","步驟 ① 研究者前理解與立場管理"],
    ["s2_vars","步驟 ② 立意抽樣分層配額表"],["s2_rel","步驟 ② Malterud 五維度資訊力評估"],["s2_val","步驟 ② 資料飽和操作化判準與新增代碼紀錄"],
    ["s3_assign","步驟 ③ 資料蒐集程序與前導試訪"],["s3_bias","步驟 ③ 漏斗式訪談提綱與追問表"],["s3_ext","步驟 ③ 三欄分離田野筆記與三角檢證"],
    ["s4_pop","步驟 ④ 逐字稿工序與三碼去識別化"],["s4_power","步驟 ④ 真實語錄分層四階編碼示範"],["s4_scenarios","步驟 ④ 編碼簿 Codebook 與雙人共識"],
    ["s5_layout","步驟 ⑤ Lincoln & Guba 可信性四準則"],["s5_clean","步驟 ⑤ 研究者反思性三件套"],["s5_desc","步驟 ⑤ 研究倫理審查 IRB"],["s5_assump","步驟 ⑤ 生成式 AI 合規與四條紅線聲明"],
    ["s6_sap","步驟 ⑥ 核心主題與代表性語錄總表"],["s6_mult","步驟 ⑥ 反例呈現與量質不一致處理"],["s6_apa","步驟 ⑥ APA 第 7 版結果與語錄寫作示範"],["s6_interp","步驟 ⑥ 研究貢獻與研究限制"]
  ];
  reqMap.forEach(([k,label])=>{
    if(!filled(S[k])) list.push({lvl:"bad", msg:`尚未填寫「${label}」`});
  });
  return list;
}

function sevenStepRows(){
  const ds = DESIGNS[S.design] || DESIGNS.qual_thematic;
  const firstLine = (s)=>String(s||"—").replace(/^💡【[^】]+】[^\n]*\n+/, "").split(/\n+/)[0].slice(0,110);
  return [
    ["1. 研究問題、現象界定與取徑選擇", firstLine(S.s1_rq), `採用「${ds.short}」（${ds.cat}）；已記錄研究者前理解並完成替代取徑取捨（見表 3、表 4）`],
    ["2. 立意抽樣、資訊力與飽和證據", `${(S.s2_vars||[]).length} 個抽樣分層／次群體（見表 5）`, `${firstLine(S.s2_rel)}；以逐位新增代碼 = 0 確認飽和`],
    ["3. 資料蒐集、漏斗訪綱與田野筆記", firstLine(S.s3_assign), `漏斗式訪談提綱共 ${(S.s3_bias||[]).length} 階段（見表 6），搭配 Emerson 三欄分離田野筆記與多源三角檢證`],
    ["4. 逐字稿清理、四階編碼與編碼簿", firstLine(S.s4_pop), `執行「語錄 → 代碼 → 意義單元 → 子主題 → 主題」分層四階歸納，建立五欄編碼簿並雙人獨立編碼前 30%`],
    ["5. 可信性四準則、反思性與研究倫理", "落實 Lincoln & Guba 可信度、可轉移性、可靠性、可確認性", `完成成員檢核、反思日誌、IRB 倫理保護及生成式 AI 四條紅線合規揭露`],
    ["6. 語錄呈現、德懷術雙閘與混合整合", `提煉 ${(S.s6_sap||[]).length} 大核心主題／整合維度（見表 7）`, `嚴守語錄使用六規則（論點先行、三碼代號與行號、正反並陳），並交代研究限制與轉移邊界`]
  ];
}

function renderApaTableHTML(t){
  return `<div class="apa-twrap">
    <p class="apa-tnum">${esc(t.num)}</p>
    <p class="apa-ttitle">${esc(t.title)}</p>
    <table class="apa-tbl">
      <thead><tr>${t.headers.map((h,i)=>`<th style="width:${t.colPcts[i]}%">${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>
        ${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c||"—").replace(/\n/g,"<br>")}</td>`).join("")}</tr>`).join("")}
      </tbody>
    </table>
    ${t.note ? `<p class="apa-tnote">${esc(t.note)}</p>` : ""}
  </div>`;
}

function renderApaTextHTML(raw){
  const lines = String(raw || "（尚未填寫）").split(/\r?\n+/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return `<p class="apa-p">（尚未填寫）</p>`;
  return lines.map(line=>{
    if(/^💡【/.test(line)){
      return `<div style="background:var(--ok-soft);border-left:3px solid var(--ok);padding:4px 10px;margin:4px 0 8px;font-size:12.8px;color:var(--ink)">${esc(line)}</div>`;
    }
    if(/^([0-9]+[\.\、]|[①-⑳]|\([0-9]+\)|（[一二三四五六七八九十0-9]+）|[・•\-]|【[^】]+】|📌【)/.test(line)){
      return `<p class="apa-item">${esc(line)}</p>`;
    }
    return `<p class="apa-p">${esc(line)}</p>`;
  }).join("");
}

function apaPreviewHTML(){
  const spec = apaDocSpec();
  return `<div class="apa-page">
    <div class="apa-rhead"><span>${esc(spec.runningHead)}</span><span>APA 7th Edition Format</span></div>
    <div class="apa-cover">
      <p class="apa-doctitle">${esc(spec.docTitle)}</p>
      <p class="apa-studytitle">${esc(spec.studyTitle)}</p>
      <p class="apa-meta">${esc(spec.authorLine)}<br>${esc(spec.metaLine)}<br>${esc(spec.guideLine)}</p>
    </div>
    ${renderApaTableHTML(spec.coverTable)}
    ${spec.sections.map(sec=>`
      <h2 class="apa-h1">${esc(sec.h1)}</h2>
      ${sec.items.map(it=>{
        if(it.type==="h2") return `<h3 class="apa-h2">${esc(it.text)}</h3>`;
        if(it.type==="table") return renderApaTableHTML(it);
        return renderApaTextHTML(it.text);
      }).join("")}
    `).join("")}
  </div>`;
}

// ==================== 匯出 CSV 與 APA 7th Word (.docx) ====================
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 250);
}

function exportCsv(pid){
  const targetId = pid || S.design || "qual_thematic";
  const ds = DESIGNS[targetId] || DESIGNS.qual_thematic;
  const cols = ds.data_cols || ["quote_id","participant_code","transcript_loc","verbatim_quote","initial_code","meaning_unit","sub_theme","main_theme"];
  const st = ds.sample_table;
  const rows = [cols];
  if(st && Array.isArray(st.rows) && st.rows.length){
    st.rows.forEach(r=>rows.push(r));
  }
  const csv = "\uFEFF" + rows.map(r=>r.map(c=>`"${String(c||"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  downloadBlob(new Blob([csv], {type:"text/csv;charset=utf-8"}), `質性編碼與分析資料表_${targetId}_${S.date||"2026"}.csv`);
}

function loadDocxLib(){
  if(window.docx) return Promise.resolve(window.docx);
  return new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js";
    s.onload = ()=>window.docx ? res(window.docx) : rej(new Error("docx CDN loaded but window.docx missing"));
    s.onerror = ()=>rej(new Error("無法載入 docx 套件"));
    document.head.appendChild(s);
  });
}

async function exportDocx(pid){

    applyPreset(pid, true);
    await doExportDocx();
    S = oldS;
    save();
    return;
  }
  await doExportDocx();
}

async function doExportDocx(){
  const spec = apaDocSpec();
  const fname = `質性與混合研究計畫書_APA7_${S.design}_${S.date||"2026"}.docx`;
  try{
    const dx = await loadDocxLib();
    const {
      Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
      WidthType, AlignmentType, HeadingLevel, BorderStyle,
      Header, Footer, PageNumber
    } = dx;
    const FONT = { ascii: "Times New Roman", hAnsi: "Times New Roman", eastAsia: "標楷體", cs: "Times New Roman" };
    const CONTENT_W = 9026;
    const LINE_APA = 360;

    const mkH1 = (txt)=>new Paragraph({
      heading: HeadingLevel.HEADING_1,
      alignment: AlignmentType.CENTER,
      spacing: { before: 320, after: 160, line: LINE_APA },
      keepNext: true,
      children: [new TextRun({ text: txt, bold: true, size: 28, font: FONT, color: "000000" })]
    });

    const mkH2 = (txt)=>new Paragraph({
      heading: HeadingLevel.HEADING_2,
      alignment: AlignmentType.LEFT,
      spacing: { before: 240, after: 100, line: LINE_APA },
      keepNext: true,
      children: [new TextRun({ text: txt, bold: true, size: 25, font: FONT, color: "000000" })]
    });

    const mkTextParas = (raw)=>{
      // 匯出正式論文 Word 時，自動過濾掉網頁教學用的「💡【白話一句話看懂】」行，讓 Word 成品純淨符合學術規範
      const lines = String(raw || "（尚未填寫）").split(/\r?\n+/).map(s=>s.trim()).filter(s=>Boolean(s) && !s.startsWith("💡【白話"));
      if(!lines.length){
        return [new Paragraph({
          indent: { firstLine: 480 },
          spacing: { before: 40, after: 120, line: LINE_APA },
          children: [new TextRun({ text: "（尚未填寫）", size: 24, font: FONT })]
        })];
      }
      return lines.map(line=>{
        const m = line.match(/^((?:[0-9]+[\.\、]|[①-⑳]|[\(（][0-9一二三四五六七八九十]+[\)）]|[・•\-]|📌【[^】]+】|【[^】]+】)\s*)(.*)$/);
        if(m){
          return new Paragraph({
            alignment: AlignmentType.JUSTIFIED,
            indent: { left: 480, hanging: 480 },
            spacing: { before: 40, after: 120, line: LINE_APA },
            children: [
              new TextRun({ text: m[1].replace(/^📌/, ""), bold: true, size: 24, font: FONT }),
              new TextRun({ text: m[2], size: 24, font: FONT })
            ]
          });
        }
        return new Paragraph({
          alignment: AlignmentType.JUSTIFIED,
          indent: { firstLine: 480 },
          spacing: { before: 40, after: 120, line: LINE_APA },
          children: [new TextRun({ text: line, size: 24, font: FONT })]
        });
      });
    };

    const mkApaTableBlock = (t)=>{
      const colWidths = t.colPcts.map(p => Math.round(CONTENT_W * p / 100));
      const noBorder = { style: BorderStyle.NONE, size: 0, color: "FFFFFF" };
      const topBottomRule = { style: BorderStyle.SINGLE, size: 12, color: "000000" };
      const headerRule = { style: BorderStyle.SINGLE, size: 6, color: "000000" };

      const headerRow = new TableRow({
        tableHeader: true,
        children: t.headers.map((h, i)=>new TableCell({
          width: { size: colWidths[i], type: WidthType.DXA },
          borders: { top: topBottomRule, bottom: headerRule, left: noBorder, right: noBorder },
          margins: { top: 100, bottom: 100, left: 100, right: 100 },
          children: [new Paragraph({
            alignment: AlignmentType.LEFT,
            spacing: { before: 20, after: 20, line: 280 },
            children: [new TextRun({ text: String(h || ""), bold: true, size: 21, font: FONT })]
          })]
        }))
      });

      const bodyRows = t.rows.map((r, ri)=>{
        const isLast = ri === t.rows.length - 1;
        return new TableRow({
          children: t.headers.map((_, ci)=>{
            const cellLines = String(r[ci] || "—").split(/\r?\n+/).filter(Boolean);
            return new TableCell({
              width: { size: colWidths[ci], type: WidthType.DXA },
              borders: {
                top: noBorder,
                bottom: isLast ? topBottomRule : noBorder,
                left: noBorder,
                right: noBorder
              },
              margins: { top: 80, bottom: 80, left: 100, right: 100 },
              children: (cellLines.length ? cellLines : ["—"]).map(cl=>new Paragraph({
                alignment: AlignmentType.LEFT,
                spacing: { before: 20, after: 20, line: 280 },
                children: [new TextRun({ text: cl, bold: ci === 0, size: 21, font: FONT })]
              }))
            });
          })
        });
      });

      const out = [
        new Paragraph({
          spacing: { before: 240, after: 40, line: 280 },
          keepNext: true,
          children: [new TextRun({ text: t.num, bold: true, size: 24, font: FONT })]
        }),
        new Paragraph({
          spacing: { before: 0, after: 80, line: 280 },
          keepNext: true,
          children: [new TextRun({ text: t.title, italics: true, size: 24, font: FONT })]
        }),
        new Table({
          width: { size: CONTENT_W, type: WidthType.DXA },
          columnWidths: colWidths,
          rows: [headerRow, ...bodyRows]
        })
      ];
      if(t.note){
        out.push(new Paragraph({
          spacing: { before: 60, after: 200, line: 280 },
          children: [new TextRun({ text: t.note, size: 20, font: FONT })]
        }));
      }
      return out;
    };

    const children = [
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 240, after: 120, line: LINE_APA },
        children: [new TextRun({ text: spec.docTitle, bold: true, size: 32, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 40, after: 160, line: LINE_APA },
        children: [new TextRun({ text: spec.studyTitle, bold: true, size: 28, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 20, after: 40, line: LINE_APA },
        children: [new TextRun({ text: spec.authorLine, size: 22, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 20, after: 40, line: LINE_APA },
        children: [new TextRun({ text: spec.metaLine, size: 22, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 20, after: 200, line: LINE_APA },
        children: [new TextRun({ text: spec.guideLine, size: 21, font: FONT })]
      }),
      ...mkApaTableBlock(spec.coverTable)
    ];

    spec.sections.forEach(sec=>{
      children.push(mkH1(sec.h1));
      sec.items.forEach(it=>{
        if(it.type==="h2") children.push(mkH2(it.text));
        else if(it.type==="table") children.push(...mkApaTableBlock(it));
        else children.push(...mkTextParas(it.text));
      });
    });

    const doc = new Document({
      sections: [{
        properties: {
          page: {
            size: { width: 11906, height: 16838 },
            margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 }
          }
        },
        headers: {
          default: new Header({
            children: [new Paragraph({
              alignment: AlignmentType.RIGHT,
              children: [
                new TextRun({ text: spec.runningHead + "　　", size: 18, font: FONT }),
                new TextRun({ children: [PageNumber.CURRENT], size: 18, font: FONT })
              ]
            })]
          })
        },
        footers: {
          default: new Footer({
            children: [new Paragraph({
              alignment: AlignmentType.CENTER,
              children: [
                new TextRun({ text: "第 ", size: 18, font: FONT }),
                new TextRun({ children: [PageNumber.CURRENT], size: 18, font: FONT }),
                new TextRun({ text: " 頁 ／ 共 ", size: 18, font: FONT }),
                new TextRun({ children: [PageNumber.TOTAL_PAGES], size: 18, font: FONT }),
                new TextRun({ text: " 頁（研究方法論 3.1–3.2 質性與混合研究設計工作台產出）", size: 18, font: FONT })
              ]
            })]
          })
        },
        children
      }]
    });

    const blob = await Packer.toBlob(doc);
    downloadBlob(blob, fname);
  }catch(e){
    alert("Word 匯出失敗：" + e.message);
  }
}

function bindEvents(){
  const w = document.getElementById("work");
  if(!w) return;

  w.querySelectorAll("[data-nav]").forEach(b=>{
    b.onclick = ()=>{ S.step = b.dataset.nav; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });

  w.querySelectorAll("[data-preset]").forEach(b=>{
    b.onclick = ()=>applyPreset(b.dataset.preset, false);
  });
  w.querySelectorAll("[data-preset-jump]").forEach(b=>{
    b.onclick = ()=>{
      applyPreset(b.dataset.presetJump, true);
      S.step = "s1";
      save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    };
  });

  w.querySelectorAll("[data-rm-flt]").forEach(b=>{
    b.onclick = ()=>{
      RM_FLT = b.dataset.rmFlt || "all";
      render();
    };
  });
  w.querySelectorAll("[data-rm-pick]").forEach(b=>{
    b.onclick = ()=>{
      const code = b.dataset.rmPick;
      const shouldScroll = b.dataset.rmScroll === "1";
      if(code && DESIGNS[code]){
        const prevY = window.scrollY || document.documentElement.scrollTop || 0;
        // 切換 README 卡片時同步載入該範例資料，讓使用者切到 STEP 1–7 時內容完全一致
        applyPreset(code, true);
        render();
        if(shouldScroll){
          const fp = document.getElementById("rm-focus-panel");
          if(fp) fp.scrollIntoView({behavior:"smooth", block:"start"});
        }else{
          window.scrollTo({top: prevY, behavior:"instant"});
        }
      }
    };
  });
  w.querySelectorAll("[data-rm-preset]").forEach(b=>{
    b.onclick = (e)=>{
      if(e && e.stopPropagation) e.stopPropagation();
      const pid = b.dataset.rmPreset;
      const to = b.dataset.rmTo || "s1";
      applyPreset(pid, true);
      S.step = to;
      save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    };
  });
  w.querySelectorAll("[data-rm-docx]").forEach(b=>{
    b.onclick = ()=>exportDocx(b.dataset.rmDocx);
  });
  w.querySelectorAll("[data-rm-csv]").forEach(b=>{
    b.onclick = ()=>exportCsv(b.dataset.rmCsv);
  });

  w.querySelectorAll("[data-dt]").forEach(sel=>{
    sel.onchange = ()=>{ S.dt[sel.dataset.dt] = sel.value; save(); render(); };
  });
  w.querySelectorAll("[data-apply-rec]").forEach(b=>{
    b.onclick = ()=>{ S.design = b.dataset.applyRec; save(); render(); };
  });

  w.querySelectorAll("[data-k]").forEach(el=>{
    el.oninput = ()=>{
      S[el.dataset.k] = el.value;
      save(); renderTop(); renderNav();
    };
  });

  w.querySelectorAll("[data-gr]").forEach(el=>{
    el.oninput = ()=>{
      const k = el.dataset.gr;
      const r = parseInt(el.dataset.r,10), c = parseInt(el.dataset.c,10);
      if(!Array.isArray(S[k])) S[k] = [];
      if(!Array.isArray(S[k][r])) S[k][r] = [];
      S[k][r][c] = el.value;
      save(); renderTop(); renderNav();
    };
  });
  w.querySelectorAll("[data-gadd]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.gadd;
      const n = parseInt(b.dataset.cols,10) || 2;
      if(!Array.isArray(S[k])) S[k] = [];
      S[k].push(new Array(n).fill(""));
      save(); render();
    };
  });
  w.querySelectorAll("[data-gdel]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.gdel;
      const r = parseInt(b.dataset.r,10);
      if(Array.isArray(S[k]) && S[k].length>1){
        S[k].splice(r,1);
        save(); render();
      }
    };
  });

  w.querySelectorAll("[data-ins]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.ins;
      const txt = b.dataset.txt;
      S[k] = (S[k] ? S[k] + "\n" : "") + txt;
      save(); render();
    };
  });

  w.querySelectorAll("[data-stab]").forEach(b=>{
    b.onclick = ()=>{ S.stab = b.dataset.stab; save(); render(); };
  });

  w.querySelectorAll("[data-fill-step]").forEach(b=>{
    b.onclick = ()=>{
      const sid = b.dataset.fillStep;
      const p = PRESETS[S.design] || PRESETS.qual_thematic;
      const st = STEPS.find(x=>x.id===sid);
      if(st && p){
        st.req.forEach(k=>{
          if(p.data[k]!==undefined) S[k] = JSON.parse(JSON.stringify(p.data[k]));
        });
        save(); render();
      }
    };
  });

  w.querySelectorAll("[data-gate]").forEach(cb=>{
    cb.onchange = ()=>{ S.gate[cb.dataset.gate] = cb.checked; save(); render(); };
  });
  w.querySelectorAll("[data-chk]").forEach(cb=>{
    cb.onchange = ()=>{ S.chk[cb.dataset.chk] = cb.checked; save(); render(); };
  });

  // Malterud 工具
  w.querySelectorAll(".m-sel").forEach(sel=>{
    sel.onchange = ()=>{
      const k = sel.dataset.mkey;
      if(k && S.malterud){
        S.malterud[k] = parseInt(sel.value, 10);
        save(); render();
      }
    };
  });
  const btnMalt = document.getElementById("btn_apply_malterud");
  if(btnMalt){
    btnMalt.onclick = ()=>{
      const sum = btnMalt.dataset.sum;
      const lvl = btnMalt.dataset.lvl;
      const est = btnMalt.dataset.est;
      S.s2_rel = `💡【白話一句話看懂】用 Malterud「資訊力五維度」證明為什麼訪這幾個人就夠了：\n\n【Malterud 等（2016）五維度資訊力評估結果（總分 ${sum}/15 分｜${lvl}）】\n1. 五維度自評得分：研究目的廣度（${S.malterud.aim}分）、樣本特異性（${S.malterud.spec}分）、理論架構支撐（${S.malterud.theory}分）、訪談對話品質（${S.malterud.dialogue}分）、分析策略深度（${S.malterud.strategy}分）。\n2. 樣本規模規劃：${est}。`;
      save(); render();
    };
  }

  // 四階編碼工具
  w.querySelectorAll("[data-ld]").forEach(el=>{
    el.oninput = ()=>{
      S.ladder[el.dataset.ld] = el.value;
      save();
    };
  });
  const btnLad = document.getElementById("btn_apply_ladder");
  if(btnLad){
    btnLad.onclick = ()=>{
      const ld = S.ladder;
      S.s4_power = `💡【白話一句話看懂】實際拿受訪者說的一段真話，示範怎麼走完「原話 → 代碼 → 意義單元 → 子主題 → 主題」四階梯：\n\n【分層逐步歸納四階編碼實作示範】\n・階梯 1〔原始語錄 Quote〕：${ld.quote}\n・階梯 2〔初始代碼 Initial Codes〕：${ld.code}\n・階梯 3〔意義單元 → 子主題 Sub-theme〕：${ld.sub}\n・階梯 4〔核心主題 Main Theme〕：${ld.theme}`;
      save(); render();
    };
  }

  // 德懷術雙閘工具
  w.querySelectorAll("[data-delphi]").forEach(el=>{
    el.oninput = ()=>{
      S.delphi[el.dataset.delphi] = parseFloat(el.value) || 0;
      save(); render();
    };
  });

  // 匯出按鈕
  const bDocx = document.getElementById("btn_docx");
  if(bDocx) bDocx.onclick = ()=>exportDocx();
  const bCsv = document.getElementById("btn_csv");
  if(bCsv) bCsv.onclick = ()=>exportCsv();
  const bCopy = document.getElementById("btn_copy");
  if(bCopy){
    bCopy.onclick = ()=>{
      const spec = apaDocSpec();
      const txt = `${spec.docTitle}\n${spec.studyTitle}\n${spec.authorLine}\n\n【核心研究問題】\n${S.s1_rq}\n\n【立意抽樣與飽和】\n${S.s2_rel}\n${S.s2_val}\n\n【結果與語錄示範】\n${S.s6_apa}`;
      navigator.clipboard.writeText(txt).then(()=>{ bCopy.textContent = "✅ 已複製全文！"; setTimeout(()=>render(),1500); });
    };
  }
  const bJOut = document.getElementById("btn_json_out");
  if(bJOut){
    bJOut.onclick = ()=>{
      downloadBlob(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}), `質性研究設計進度_${S.design}_${S.date||"2026"}.json`);
    };
  }
  const inpJ = document.getElementById("inp_json");
  if(inpJ){
    inpJ.onchange = (e)=>{
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const o = JSON.parse(r.result);
          S = Object.assign(defState(), o);
          save(); render();
        }catch(err){ alert("JSON 格式錯誤"); }
      };
      r.readAsText(f);
    };
  }
}

function render(){
  renderTop();
  renderNav();
  const w = document.getElementById("work");
  if(!w) return;
  if(S.step==="readme") w.innerHTML = readmeHTML();
  else if(S.step==="setup") w.innerHTML = setupHTML();
  else if(S.step==="review") w.innerHTML = reviewHTML();
  else w.innerHTML = stepFormHTML(S.step);
  bindEvents();
}

document.addEventListener("DOMContentLoaded", ()=>{
  initSymp();
  const nav = document.getElementById("stepnav");
  if(nav){
    nav.onclick = (e)=>{
      const b = e.target.closest("[data-step]");
      if(!b) return;
      S.step = b.dataset.step;
      document.getElementById("side-nav").classList.remove("open");
      save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    };
  }
  const oc = document.getElementById("oneclick");
  if(oc) oc.onclick = ()=>applyPreset(S.design || "qual_thematic", false);
  const rmBtn = document.getElementById("btn_readme");
  if(rmBtn) rmBtn.onclick = ()=>{ S.step = "readme"; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  const menu = document.getElementById("menu");
  if(menu){
    menu.onclick = ()=>{
      const sn = document.getElementById("side-nav");
      sn.classList.toggle("open");
    };
  }
  render();
});
})();
</script>
</body>
</html>
