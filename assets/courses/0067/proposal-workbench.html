R. X. (2013). Applied logistic regression (3rd ed.). Wiley.\nPeduzzi, P., Concato, J., Kemper, E., Holford, T. R., & Feinstein, A. R. (1996). A simulation study of the number of events per variable in logistic regression analysis. Journal of Clinical Epidemiology, 49(12), 1373–1379.\nPolit, D. F., & Beck, C. T. (2006). The content validity index: Are you sure you know what's being reported? Critique and recommendations. Research in Nursing & Health, 29(5), 489–497.\nRogers, E. M. (2003). Diffusion of innovations (5th ed.). Free Press.\nvon Elm, E., Altman, D. G., Egger, M., Pocock, S. J., Gøtzsche, P. C., Vandenbroucke, J. P., & STROBE Initiative. (2007). The Strengthening the Reporting of Observational Studies in Epidemiology (STROBE) statement: Guidelines for reporting observational studies. The Lancet, 370(9596), 1453–1457.","irb_inst":"〔大學名稱〕〔系所〕；研究對象：全國住宿式長照機構（線上問卷）","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：匿名線上問卷，內容為機構營運與設備使用，不涉及個人敏感資料，屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"全國住宿式長照機構主管，名冊全數邀請（約 1,100 家，教學示意），預期有效回收 286 家以上。","irb_recruit":"以電子郵件與公文寄送邀請，說明研究目的與自願參與；不經由主管機關要求填答，避免機構感到壓力。","irb_vuln":"不納入易受傷害族群；填答者為機構主管。","irb_task":"填一份線上問卷，約 15 分鐘，內容是機構基本資料、使用哪些智慧照護設備，以及您對這些設備的看法。","irb_withdraw":"可隨時關閉問卷中止填答；因問卷匿名，送出後無法辨識個別機構，故無法撤回已送出之資料（將於說明中載明）。","irb_benefit":"無直接利益；研究完成後提供參與機構結果摘要。","irb_harm":"屬最小風險；對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為匿名問卷資料，保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"是（免除書面同意，改以線上同意）。問卷匿名、屬最小風險，以問卷首頁說明並勾選同意代替書面簽名，以審查會核准為準。","irb_ad":"【長照機構智慧照護現況調查】誠摯邀請貴機構主管填寫約 15 分鐘的線上問卷，了解智慧照護設備的使用情形與需求。問卷匿名，結果將提供主管機關規劃協助之參考。問卷連結：〔　〕；聯絡人：〔研究生姓名〕〔電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責問卷發展、施測與資料分析）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"long-term care facilities; smart care technology; adoption; diffusion of innovations; national survey","m10_abs_en":"Governments are promoting smart care technologies in long-term care facilities, but adoption varies widely and national data to guide subsidies are lacking. This study aims to describe the prevalence and types of smart care devices adopted by residential long-term care facilities in Taiwan and to examine the associations of facility size, resources, and administrators' attitudes with adoption. A cross-sectional national survey will be conducted by inviting the administrators of all facilities listed in the public registry of the Ministry of Health and Welfare to complete an online questionnaire covering facility characteristics, the status of eight categories of devices (in use, discontinued, never used), an administrator attitude scale adapted from the Technology Acceptance Model, and perceived barriers. Following the tailored design method, reminders will be sent at weeks 1, 2, and 4, with telephone follow-up at week 5. Adoption prevalence will be reported with 95% confidence intervals after post-stratification weighting, associated factors will be analyzed using multivariable logistic regression, and nonresponse bias will be assessed by comparing respondents with nonrespondents. Dedicated IT staff, prior subsidies, and positive attitudes are expected to be associated with adoption, informing the targeting of subsidies and support."},"objs":[{"verb":"描述","text":"描述全國住宿式長照機構智慧照護設備之導入比例與類型","hyp":"","analysis":"比例與 95% CI（事後分層加權）；各類設備使用中、曾用已停用、未曾使用之比例","crit":"95% CI","sens":"未加權結果並列比較","exp":"預期導入比例因地區與權屬而異，離床警示與生理量測自動上傳最常見；若比例很低，表示推動仍在早期。"},{"verb":"檢驗","text":"檢驗機構特質、資源與主管態度與是否導入之關係","hyp":"H1：有專職資訊人員、獲補助經驗與主管態度較正向之機構，導入勝算較高；H0：無關。","analysis":"多元邏輯斯迴歸，報調整後 OR 與 95% CI","crit":"α = .05（雙尾）；每變項事件數 ≥ 10","sens":"以導入類數為結果做負二項迴歸","exp":"預期資源與主管態度相關；若規模不相關，表示小型機構也能導入。"},{"verb":"描述","text":"描述機構自述之導入障礙","hyp":"","analysis":"開放題內容分析，計算各類障礙出現次數","crit":"兩人歸類，不一致時討論","sens":"依是否已導入分組比較","exp":"預期經費、人力與操作訓練是主要障礙。"}],"vars":[{"name":"是否導入","role":"依變項","concept":"機構正在使用智慧照護設備","oper":"8 類設備中至少一類「使用中」＝1，否則＝0","tool":"問卷","scale":"名目","time":"施測時","rel":"自編，專家 CVI"},{"name":"導入類數","role":"依變項","concept":"導入廣度","oper":"8 類設備中「使用中」之類數（0–8）","tool":"問卷","scale":"比率","time":"施測時","rel":"同上"},{"name":"機構規模","role":"自變項","concept":"組織規模","oper":"登記床數","tool":"問卷／名冊","scale":"比率","time":"施測時","rel":"名冊核對"},{"name":"資訊人力","role":"自變項","concept":"組織資源","oper":"是否有專職資訊人員（是／否）","tool":"問卷","scale":"名目","time":"施測時","rel":"—"},{"name":"主管態度","role":"自變項","concept":"對科技有用與易用的看法","oper":"6 題 7 點量尺平均","tool":"問卷","scale":"等距","time":"施測時","rel":"改編自 Davis（1989）；α ≥ .70"},{"name":"權屬、地區","role":"控制","concept":"機構類型","oper":"公立／財團法人／私立；北中南東","tool":"名冊","scale":"名目","time":"—","rel":"—"}],"bias":[{"name":"無回應偏差","why":"已導入或態度較正向之機構較願意回覆","fix":"多次提醒；比較回收與未回收機構特質；事後分層加權"},{"name":"社會期許偏差","why":"主管可能高報導入程度","fix":"區分「使用中」與「曾用已停用」；匿名填答"},{"name":"共同方法偏差","why":"自變項與依變項由同一人同時填答","fix":"設備使用以事實題詢問；與態度量表分頁呈現"},{"name":"重複填答","why":"同一機構多人填答","fix":"以機構代碼檢查重複，分析前刪除代碼"}],"gantt":{"n":12,"rows":[{"t":"問卷初稿與專家效度","s":1,"e":2},{"t":"IRB 送審與核准","s":1,"e":2},{"t":"預試與修正","s":3,"e":3},{"t":"正式施測與提醒","s":4,"e":6},{"t":"資料分析","s":7,"e":8},{"t":"論文撰寫","s":8,"e":10},{"t":"緩衝（回收延長、補提醒）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"回收率偏低","trig":"第 4 週回收少於 200 家","when":"M5","plan":"請公協會協助宣傳；電話提醒；延長施測 1 個月"},{"r":"名冊資料過時","trig":"退信率高於 10%","when":"M4","plan":"以電話查核更新聯絡人"},{"r":"事件數不足","trig":"未導入機構過少","when":"M7","plan":"改以導入類數為主要結果並減少變項數"},{"r":"自編量表信度不足","trig":"預試 Cronbach's α < .70","when":"M3","plan":"依項目分析刪修題目，必要時再預試 20 家"}],"kpi":[{"name":"有效回收家數（產出指標）","calc":"完成主要題目之問卷家數","base":"0","goal":"第 6 月前 286 家以上"},{"name":"導入比例之 95% CI 寬度（成果指標）","calc":"加權比例 95% CI 之上下限差","base":"—","goal":"±0.05 以內"}],"ss":{"kind":"prop","eff":0.5,"alpha":0.05,"tails":2,"power":0.8,"drop":0,"moe":0.05,"basis":"未知導入比例時採最保守之 0.5"}}},"E":{"label":"E 質性研究：照護人員對 AI 摘要的信任判斷","grp":0,"data":{"meta":{"type":"E","type2":""},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"長照機構導入 AI 交班摘要後，照護人員要自己判斷摘要哪裡可信、哪裡要回頭查原紀錄；判斷不當可能漏交重要照護資訊。","s1_2":"北部兩家已導入 AI 交班摘要之住宿式長照機構，負責交班之護理師、資深照服員與單位主管約 12 人。","s1_3":"探究現象：照護人員使用 AI 交班摘要時的信任判斷與查證行為。","s1_4":"判斷歷程、影響判斷的因素，以及衍生的因應策略（以主題呈現）。","s1_5":"照護人員如何判斷 AI 摘要何者可信、何者需回頭查證？此判斷受哪些因素影響，又衍生哪些因應策略？","s1_6":"E 質性研究：質性描述性設計，半結構深度訪談與主題分析。","s1_7":"兩機構同意受訪人員招募；訪談錄音、轉錄後去識別化。","s1_8":"12 個月：IRB 送審 → 訪談 → 分析與成員檢核 → 撰寫，保留兩個月緩衝。","s1_9":"提供機構設計摘要核對流程與教育訓練之依據；補足長照場域對 AI 摘要信任判斷之理解。","m1_scene":"生成式 AI 交班摘要開始進入住宿式長照機構：系統自動彙整前一班的照護紀錄、給藥紀錄與異常事件，產生一段交班重點。摘要能縮短彙整時間，但照護人員仍須在交班前後判斷：哪些內容可以直接採用，哪些必須回頭查原紀錄、口頭確認或自行補寫。例如住民夜間跌倒後的生命徵象追蹤、管路與傷口變化、家屬交代事項，若摘要遺漏或寫錯，接班者未必察覺。","m1_gap":"機構導入時多半只提供操作訓練，教人「怎麼產生摘要」，卻沒有說明「什麼情況應該查證」；判斷完全依賴個人經驗。過度信任可能漏交重要照護資訊，過度懷疑則讓人員每次都回頭重查，工具失去省時的意義。由於判斷發生在每位照護人員腦中，主管看得到的只有最後送出的摘要，難以據以設計核對流程或教育訓練。","m1_new":"自動化信任的研究指出，使用者對自動化系統的依賴應與系統實際可靠度相稱，否則會產生誤用（過度依賴）或棄用（Lee & See, 2004）；生成式 AI 臨床摘要的整體品質雖已接近專家（Van Veen et al., 2024），個別摘要仍可能出現遺漏或錯誤。然而，這些研究多來自航空、製造或醫院模擬情境，照護人員在長照交班的時間壓力下如何形成信任判斷、依據哪些線索、發展出哪些因應策略，仍缺乏貼近現場的描述。","m1_time":"合作機構於近半年內完成導入，人員對摘要的使用經驗新且鮮明，可回想具體事件；若等到使用習慣固化，判斷歷程會變得難以言說。兩機構管理階層正規劃第二階段教育訓練，結果可直接回饋給機構設計核對流程與訓練內容。","m1_stmt":"因此，本研究擬以質性描述取徑，探討長照機構照護人員在使用 AI 交班摘要時，如何判斷內容是否可信、受哪些因素影響，以及發展出哪些因應策略。","m2_pico":"P：住宿式長照機構負責交班之護理師、資深照服員與單位主管｜I（Interest）：對 AI 交班摘要之信任判斷與查證行為｜Co（Context）：已導入生成式 AI 交班摘要之長照機構","m2_search":"PubMed：（\"Trust\"[Mesh] OR trust*[tiab] OR relian*[tiab]）AND（\"Natural Language Processing\"[Mesh] OR \"large language model*\"[tiab] OR \"artificial intelligence\"[tiab] OR summar*[tiab]）AND（\"Nurses\"[Mesh] OR nurs*[tiab] OR \"care staff\"[tiab]）AND（qualitative[tiab] OR interview*[tiab]）\nCINAHL 與華藝：以「信任」「人工智慧」「護理人員」「質性」對應詞檢索。\n限制：2015 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、自動化信任。Lee 與 See（2004）將自動化信任定義為使用者在不確定情境下，相信自動化系統能協助達成目標的態度，並指出信任應與系統實際可靠度相稱，否則會造成誤用（過度依賴）或棄用。對本研究的意義：照護人員何時採用、何時查證摘要，正是「信任是否相稱」的具體表現。\n二、生成式 AI 臨床摘要。Van Veen 等人（2024）的研究顯示，經調整之大型語言模型產生的臨床文本摘要，經臨床讀者評估多數不劣於專家；但研究也提醒摘要仍可能出現遺漏或錯誤。對本研究的意義：即使摘要整體品質不差，使用者仍需要判斷個別內容是否可靠，這個判斷歷程尚未被描述。\n三、研究取徑。質性描述以貼近參與者語言的方式呈現經驗，適合回答「發生了什麼、怎麼做」的實務問題（Sandelowski, 2000）。本研究初步檢索（附錄一）未見描述長照照護人員對 AI 交班摘要信任判斷之質性研究（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已提出自動化信任應與系統可靠度相稱的框架（Lee & See, 2004），並顯示生成式 AI 臨床摘要的整體品質接近專家（Van Veen et al., 2024）。","m2_unknown":"然而，照護人員在真實交班情境中如何判斷個別摘要內容是否可信、依據哪些線索（如內容是否與自己記憶相符、是否涉及高風險項目）、又如何因應，缺乏貼近現場的描述；長照場域人力組成以照服員為主、與醫院不同，尤其缺乏相關研究。","m2_worth":"此缺口使機構在設計核對流程與教育訓練時，只能依賴主管推測或廠商建議；本研究將以質性描述取徑，呈現判斷歷程、影響因素與因應策略，供機構訂定「哪些項目必須查證」的具體規則。","m2_theory":"以自動化信任概念（Lee & See, 2004）作為敏感概念，引導訪談時注意「何時相信、何時查證」，但不將其當作預設的編碼框架；分析時讓主題由資料中產生。","m2_orig":"本計畫首度以質性描述取徑，呈現長照照護人員對 AI 交班摘要之信任判斷歷程與因應策略，可直接轉化為機構之核對流程與訓練內容。","m3_rq":"照護人員使用 AI 交班摘要時，如何判斷何者可信、何者需回頭查證？","m3_terms":"信任判斷：照護人員決定直接採用或回頭查證摘要內容的思考歷程。\n因應策略：照護人員為降低摘要可能出錯的風險所採取的作法，例如回頭查原紀錄、口頭確認、自行補寫。\nAI 交班摘要：院內部署之生成式 AI 工具自班別紀錄自動產生的交班摘要。","m3_scope":"研究範圍為北部兩家已導入 AI 交班摘要至少一個月之住宿式長照機構的護理師、資深照服員與單位主管，資料蒐集期間約 5 個月（第 3–7 月）。本研究描述使用者的經驗、判斷與策略，不評估摘要的正確率或省時效果（另由量性研究處理），不推論各種判斷方式的發生比例，亦不訪談住民與家屬。","m4_frame":"質性研究不預設變項關係。本研究以「信任判斷歷程」「影響判斷的因素」「因應策略」三個探究焦點組織訪談大綱，並以自動化信任作為敏感概念；初步分析框架將依資料修正。研究者為具長照實務經驗之護理人員，進入本題目時推測「資深人員較不信任摘要」，將以反思日誌記錄此前理解，並請同儕檢視訪談是否有引導性提問。","m5_design":"本研究採質性描述性設計（E 型：質性研究），以半結構深度訪談蒐集資料、主題分析歸納結果。選擇質性描述，是因研究目的在呈現工作情境中的判斷與策略，結果需貼近參與者語言，方便機構直接採用。","m5_reject":"不採紮根理論，因本研究目標不是建構實質理論；不採詮釋現象學，因本研究關注工作情境中的判斷與策略，而非存在層次的經驗本質；不採問卷調查，因判斷歷程與因應策略尚未被描述，無法事先設計題項。","m5_site":"研究場域為北部兩家已導入 AI 交班摘要之住宿式長照機構（A 機構 120 床、B 機構 96 床），兩機構使用同一款院內部署之摘要工具，均已書面同意協助張貼招募說明並提供訪談空間（附錄二）。研究對象為負責交班之護理師、資深照服員與單位主管，兩機構合計約 60 人符合條件。","m5_incl":"納入條件：在職且使用 AI 交班摘要至少一個月、能以中文清楚表達經驗者。排除條件：與研究者有直屬上下關係者（避免受訪壓力）。","m5_sample":"採立意抽樣並依最大變異原則，於職類（護理師／資深照服員／單位主管）、年資（3 年以下／3–10 年／10 年以上）與機構三個面向取得差異。以資料飽和為判準：連續兩位受訪者未出現新主題即停止，並續訪兩位確認；依 Hennink 與 Kaiser（2022）之回顧，預估約 12 人。","m5_tool":"一、半結構訪談大綱：依三個探究焦點設計開放式問題，例如「請描述最近一次您覺得摘要『不太對』的情況」「當時您怎麼處理？」；全文見附錄三。\n二、大綱預試：正式訪談前以 1 位非研究對象之照護人員預試，修正措辭；前 3 次正式訪談後再檢討大綱，修訂前後版本均保留。\n三、研究者即為主要研究工具，訪談者已完成質性研究方法課程與訪談訓練。\n四、基本資料表：職類、年資、使用摘要時間。","m5_flow":"一、第 1–2 月：IRB 送審；核准後由機構協助張貼招募說明，有意願者主動聯絡研究者。\n二、第 3–7 月：於機構內安靜空間進行訪談，每次 45–60 分鐘，簽署同意書後全程錄音並撰寫田野筆記。\n三、訪談後 1 週內完成逐字稿，以代號取代姓名與可識別資訊。\n四、第 4–9 月：邊蒐集邊分析，依分析結果調整後續訪談追問。\n五、第 9 月：將初步主題回饋 3–4 位受訪者進行成員檢核。","m5_innov":"以質性描述呈現照護人員對 AI 摘要的信任判斷歷程，並以成員檢核確保結果貼近現場，研究成果可直接轉化為機構之核對流程與訓練內容。","m6_common":"質性研究不做統計檢定。逐字稿以 ATLAS.ti〔版本〕管理；分析過程保留編碼簿、分析備忘錄與決策紀錄，作為稽核軌跡。","m6_qual":"依 Braun 與 Clarke（2006）主題分析六步驟：熟悉資料、產生初始編碼、尋找主題、檢視主題、定義與命名主題、撰寫報告。前 4 份逐字稿由兩位研究者獨立編碼，比對差異並以協商共識處理，據以建立編碼簿；其餘逐字稿由主要研究者編碼，第二位研究者抽檢。可信度依 Lincoln 與 Guba（1985）之可信性、可轉移性、可靠性與可確認性四準則規劃（成員檢核、厚實描述、稽核軌跡、反思日誌），結果依 COREQ 32 項報告（Tong et al., 2007）。","m7_irb":"本研究將送〔大學或合作機構〕人體研究倫理審查委員會審查，屬成年人之訪談研究、最小風險，預計申請簡易審查，以審查會認定為準；於第 1 月送審，核准後才開始招募。訪談大綱修訂若涉及新主題，將先提出變更案。","m7_consent":"受訪者於訪談前簽署書面同意書，內容包含錄音同意、引述方式與撤回方式；受訪者可拒絕錄音而改以筆記記錄。招募由研究者直接聯繫，不經直屬主管，受訪者可在訪談前一週內再考慮。","m7_risk":"本研究屬最小風險，但談及工作失誤或住民受影響事件可能令受訪者不安或擔心被追究。訪談中可隨時暫停、跳過問題或退出；受訪內容不提供給機構主管，受訪與否不影響考核。若受訪者提及尚未通報之重大異常事件，研究者將鼓勵其依機構規定通報，但不代為通報、不記錄可識別細節。","m7_deid":"逐字稿以代號取代姓名、機構與住民資訊；代號對照表由研究者保管於加密裝置，與研究資料分開存放。錄音檔於逐字稿核對完成後刪除；去識別化逐字稿保存至研究結束後 3 年，期滿以不可回復方式刪除。發表時引述內容會再檢查是否可能辨識出個人。","m7_coi":"研究者與 AI 摘要工具廠商無財務關係；生成式 AI 不用於逐字稿分析，亦不輸入任何訪談內容。","m8_feas":"場域：兩機構已書面同意協助招募與提供訪談空間（附錄二）。樣本：兩機構負責交班之照護人員共約 60 人，三種職類與三個年資層均有足夠人數可達最大變異。時間：訪談期安排 5 個月（預估每週 1 次），並保留兩個月緩衝。研究者能力：已完成質性研究方法課程、兩次模擬訪談與逐字稿編碼練習；指導教授具質性研究發表經驗並擔任第二編碼者。","m9_acad":"補足長照場域照護人員對 AI 摘要之信任判斷、影響因素與因應策略之描述，並以自動化信任框架（Lee & See, 2004）對照討論「相稱信任」在照護情境中的具體樣貌。","m9_prac":"提供機構設計摘要核對流程（何時必須回頭查證、哪些項目一律口頭確認）與教育訓練內容之依據；亦可回饋廠商改善摘要呈現方式，例如標示資料來源或不確定之處。","m9_limd":"質性描述的結果在於呈現經驗的範圍與樣貌，不推論其發生比例；僅含北部兩家機構，轉移至其他場域時需由讀者依脈絡判斷。","m9_lime":"受訪者可能傾向描述正面經驗（社會期許）；將以保密承諾、非主管訪談者與具體事件提問降低影響。","m9_train":"參與之碩士生將習得半結構訪談、逐字稿處理、主題分析與質性嚴謹度策略（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇，並提供機構「AI 交班摘要核對建議」一份（教學示意）。","m9_nation":"回應長照數位轉型中「人機協作安全」之需求，提供導入生成式 AI 時的人員訓練方向。","t_iv":"AI 交班摘要","t_pop":"長照機構照護人員","t_out":"信任判斷與因應策略","t_des":"質性描述性研究","m10_title":"長照機構照護人員對 AI 交班摘要之信任判斷與因應策略：質性描述性研究","m10_title_en":"Trust Judgments and Coping Strategies of Long-Term Care Staff Toward AI-Generated Handover Summaries: A Qualitative Descriptive Study","m10_kw":"長期照護、交班、生成式人工智慧、自動化信任、質性描述","m10_abs":"長照機構導入 AI 交班摘要後，照護人員須自行判斷摘要內容是否可信，然現場的判斷歷程缺乏描述。本研究旨在探討照護人員如何判斷 AI 摘要之可信度、影響判斷的因素與衍生之因應策略。本研究將採質性描述性設計，於北部 2 家已導入之住宿式長照機構，以立意與最大變異抽樣邀請護理師、資深照服員與單位主管約 12 人進行半結構深度訪談，依 Braun 與 Clarke 主題分析六步驟分析，並以成員檢核與同儕檢核提升嚴謹度。預期結果可作為機構設計摘要核對流程與教育訓練之依據。","m10_refs":"Braun, V., & Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77–101.\nHennink, M., & Kaiser, B. N. (2022). Sample sizes for saturation in qualitative research: A systematic review of empirical tests. Social Science & Medicine, 292, 114523.\nLee, J. D., & See, K. A. (2004). Trust in automation: Designing for appropriate reliance. Human Factors, 46(1), 50–80.\nLincoln, Y. S., & Guba, E. G. (1985). Naturalistic inquiry. Sage.\nSandelowski, M. (2000). Whatever happened to qualitative description? Research in Nursing & Health, 23(4), 334–340.\nTong, A., Sainsbury, P., & Craig, J. (2007). Consolidated criteria for reporting qualitative research (COREQ): A 32-item checklist for interviews and focus groups. International Journal for Quality in Health Care, 19(6), 349–357.\nVan Veen, D., et al. (2024). Adapted large language models can outperform medical experts in clinical text summarization. Nature Medicine, 30(4), 1134–1142.","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責訪談、轉錄與分析）；第二編碼者 1 名〔姓名〕，均完成研究倫理訓練","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_inst":"〔大學名稱〕〔系所〕；研究場域：北部兩家住宿式長照機構（以 A、B 代稱）","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：研究對象為成年工作人員，以訪談蒐集工作經驗，屬最小風險；不蒐集住民資料，逐字稿去識別化。是否符合簡易審查範圍，以送審機構之判定為準。","irb_n":"兩機構負責交班之護理師、資深照服員與單位主管，預估約 12 人（依資料飽和調整）。","irb_recruit":"由機構張貼招募說明，有意願者主動聯絡研究者；研究者不經由主管邀請，亦不告知機構誰參與訪談。","irb_vuln":"否。參與者為成年工作人員；因與機構有僱傭關係，招募與訪談由非主管之研究者進行，訪談內容不提供給機構。","irb_task":"接受一次約 45–60 分鐘的面對面訪談，談您使用 AI 交班摘要的經驗；訪談全程錄音（可拒絕錄音）；之後可能邀請您確認初步分析結果（約 15 分鐘，可拒絕）。","irb_withdraw":"可隨時以口頭或書面告知研究者撤回同意，無須說明理由；撤回後將刪除您的錄音與逐字稿，不納入分析。","irb_benefit":"參與者無直接利益；為感謝撥冗，致贈〔　〕元禮券，撤回者亦不收回。","irb_harm":"本研究屬最小風險。若談及工作經驗使您不安，可隨時暫停或退出；如對研究有疑問或爭議，可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為訪談錄音、逐字稿與田野筆記。錄音於逐字稿核對完成後刪除；去識別化逐字稿保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_commercial":"本研究不涉及商業利益；研究者與 AI 摘要工具廠商無財務關係。","irb_waive":"否。所有受訪者簽署書面同意書。","irb_ad":"【邀請您分享使用經驗】想了解您在使用 AI 交班摘要時，怎麼判斷內容可不可信、遇到問題怎麼處理。訪談約 45–60 分鐘，時間地點依您方便，內容保密，不會提供給主管。有意願請聯絡〔研究生姓名〕〔電話／電子郵件〕。","m10_kw_en":"trust in automation; AI-generated summary; nursing handover; long-term care; qualitative description","m10_abs_en":"After long-term care facilities adopt AI-generated handover summaries, care staff must decide for themselves which parts of a summary can be trusted, yet this judgment process has not been described. This study aims to explore how care staff judge the trustworthiness of AI-generated handover summaries, what factors influence their judgments, and what coping strategies they develop. A qualitative descriptive design will be used. In two residential long-term care facilities in northern Taiwan that have implemented an AI summary tool, approximately 12 nurses, senior care assistants, and unit managers will be recruited through purposive sampling with maximum variation in role, years of experience, and facility. Semi-structured in-depth interviews of 45–60 minutes will be audio-recorded and transcribed verbatim, and data will be analyzed using Braun and Clarke's six-phase thematic analysis, with the first four transcripts coded independently by two researchers. Rigor will be addressed through member checking, peer debriefing, thick description, an audit trail, and a reflexive journal, and the findings will be reported following COREQ. The results are expected to inform verification procedures and staff training for the use of AI summaries in long-term care."},"objs":[{"verb":"探討","text":"探討照護人員如何判斷 AI 交班摘要何者可信、何者需回頭查證","hyp":"","analysis":"主題分析（Braun & Clarke 六步驟），歸納判斷歷程之主題","crit":"以 Lincoln 與 Guba 四準則檢核嚴謹度；依 COREQ 報告","sens":"成員檢核、雙人獨立編碼前 4 份逐字稿","exp":"預期呈現照護人員判斷摘要可信度所依據的線索（例如內容是否與自己記憶相符、是否涉及高風險項目），以及「直接採用—部分查證—全部查證」的不同做法。"},{"verb":"探討","text":"探討影響照護人員信任判斷之個人、工作與工具因素","hyp":"","analysis":"主題分析，並以最大變異面向（職類、年資、機構）比較主題分布","crit":"同上","sens":"以反思日誌檢視研究者前理解是否影響詮釋","exp":"預期年資、職類、當班工作量與過去遇到摘要錯誤的經驗會影響判斷；結果將與自動化信任框架對照討論。"},{"verb":"探討","text":"探討照護人員因應 AI 摘要不確定性所發展之策略","hyp":"","analysis":"主題分析，整理因應策略之類型與使用情境","crit":"同上","sens":"同儕檢核","exp":"預期歸納出回頭查原紀錄、口頭確認、自行補寫等策略，並據以提出機構可採用之核對建議。"}],"vars":[{"name":"信任判斷歷程","role":"探索","concept":"決定採用或查證摘要內容的思考歷程","oper":"受訪者描述何時相信摘要、何時回頭查證及其理由","tool":"半結構訪談","scale":"","time":"訪談","rel":"雙人編碼、成員檢核"},{"name":"影響因素","role":"探索","concept":"影響信任判斷的個人、工作與工具條件","oper":"受訪者提及之影響判斷的情境與條件","tool":"半結構訪談","scale":"","time":"訪談","rel":"同上"},{"name":"因應策略","role":"探索","concept":"降低摘要出錯風險的作法","oper":"受訪者描述之具體做法與使用時機","tool":"半結構訪談","scale":"","time":"訪談","rel":"同上"}],"bias":[{"name":"研究者前理解（反身性）","why":"研究者具實務經驗並有既有推測，可能影響追問與詮釋","fix":"撰寫反思日誌；前 3 次訪談錄音由同儕檢視提問是否具引導性"},{"name":"社會期許","why":"受訪者可能只談正面經驗或避免承認失誤","fix":"保密承諾、非主管訪談者、以具體事件提問"},{"name":"選樣偏差","why":"主動報名者可能是較熟悉或較排斥工具者","fix":"依最大變異原則補足不同職類、年資與機構之受訪者"},{"name":"詮釋偏差","why":"單一研究者編碼可能偏向自己的觀點","fix":"雙人獨立編碼前 4 份、協商共識、成員檢核"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":2},{"t":"大綱預試與招募","s":2,"e":3},{"t":"訪談","s":3,"e":7},{"t":"轉錄與編碼","s":3,"e":8},{"t":"主題分析與成員檢核","s":7,"e":9},{"t":"論文撰寫","s":9,"e":11},{"t":"緩衝（招募延長、補訪、論文修訂）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"招募人數不足或缺少某類受訪者","trig":"第 5 月仍缺少某一職類或年資層","when":"M5","plan":"請機構再次張貼招募說明，並請已受訪者轉介（滾雪球）"},{"r":"未達資料飽和","trig":"第 7 月仍持續出現新主題","when":"M7","plan":"延長訪談期至第 8 月，使用緩衝月"},{"r":"受訪者擔心內容外流","trig":"受訪者拒絕錄音或有所保留","when":"每次訪談","plan":"改以筆記記錄；重申保密與不提供主管"},{"r":"研究者角色衝突","trig":"受訪者為研究者過去同事或下屬","when":"招募時","plan":"改由第二位研究者訪談，並於反思日誌記錄"}],"kpi":[{"name":"完成訪談人數（產出指標）","calc":"完成訪談並取得逐字稿之人數；每月統計","base":"0","goal":"第 7 月前完成約 12 人，並達資料飽和"}],"ss":{}}},"F":{"label":"F 德菲法：智慧長照機構評鑑指標","grp":0,"data":{"meta":{"type":"F","type2":""},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"長照機構陸續導入智慧照護，但現行評鑑沒有評估「智慧照護做得好不好」的指標，機構無從改善、主管機關也無從輔導。","s1_2":"跨職類專家 18 位：機構主管、照服督導、長照主管機關人員、資訊廠商、學者。","s1_3":"由文獻與既有標準初擬之智慧長照機構評鑑指標（結構、過程、結果三構面）。","s1_4":"每項指標之重要性與可行性評分；共識判準 M≥3.5 或 Mode≥3，且 QD<1。","s1_5":"專家對智慧長照機構評鑑應包含哪些構面與指標能否形成共識？","s1_6":"F 德菲法：文獻初擬 → 2–3 回合德菲 → AHP 權重（可選）。","s1_7":"專家知情同意（線上）；回覆以代號處理。","s1_8":"12 個月：初擬 3 個月、德菲 3 回合 5 個月、權重與撰寫，保留兩個月緩衝。","s1_9":"產出經共識之評鑑指標體系，供主管機關與機構自評使用。","m1_scene":"長照機構為因應人力不足，陸續導入離床警示、跌倒偵測、生理量測自動上傳、電子照護紀錄等智慧照護。導入後，機構常面臨「設備有了，但流程、訓練與資料安全沒跟上」的情形：警示響了沒有人負責回應、量測資料上傳了卻沒人看、帳號密碼共用、廠商停止維護後資料無法匯出。這些問題不在於買了什麼設備，而在於有沒有相應的制度與流程。","m1_gap":"現行長照機構評鑑著重照護品質與住民安全，尚無評估智慧照護「導入與運作品質」的指標；補助計畫的考核也多停留在設備數量與上線與否。機構不知道該如何自我檢視，主管機關缺乏輔導依據，不同機構之間也無法比較，導致「有補助就買、買了就算完成」的現象。","m1_new":"Donabedian（1988）提出結構、過程、結果三面向的品質評估架構，廣泛用於建構醫療照護品質指標；當缺乏實證標準、需要整合不同專業觀點時，德菲法以專家匿名、多回合評分並回饋群體統計的方式形成共識（Hasson et al., 2000），並已用於多項健康照護指標之建構。Diamond 等人（2014）的系統性回顧則提醒，共識判準須在第一回合前訂定並完整報告。","m1_time":"主管機關正研議將智慧照護納入下一期評鑑或獎勵機制，需要一份經跨職類專家共識的指標草案；本研究可於研議期間（12 個月內）提供具共識基礎且附權重的版本，避免指標由單一單位閉門擬定。","m1_stmt":"因此，本研究擬以修正式德菲法，邀請跨職類專家建構智慧長照機構評鑑之構面與指標，並以層級分析法計算權重。","m2_pico":"P：長照實務、管理、主管機關、資訊與學術專家｜I：德菲法共識建構｜C：無（指標建構研究）｜O：達共識之構面與指標、指標權重","m2_search":"PubMed：（\"Nursing Homes\"[Mesh] OR \"long-term care\"[tiab]）AND（\"quality indicator*\"[tiab] OR \"Quality Indicators, Health Care\"[Mesh] OR accreditation[tiab]）AND（technolog*[tiab] OR digital[tiab] OR smart[tiab]）\n華藝：（長照機構）AND（評鑑 OR 指標）AND（智慧 OR 科技）\n另檢索國內外長照機構評鑑基準與智慧照護相關指引。檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、品質指標的架構。Donabedian（1988）主張照護品質可從結構（資源與制度）、過程（照護如何提供）與結果（對住民的影響）評估。對本研究的意義：以三構面初擬指標，避免只評「買了什麼設備」。\n二、德菲法的方法學。Hasson 等人（2000）提出德菲法的執行與報告要點；Keeney 等人（2011）整理護理與健康研究中德菲法的專家遴選與回合設計；Diamond 等人（2014）的系統性回顧指出，多數德菲研究未事先界定共識判準，建議在第一回合前訂定並報告。對本研究的意義：判準、停止條件與回收率都要事前寫明。\n三、指標權重。層級分析法（AHP）以兩兩比較求得權重，一致性比率小於 0.1 才採用（Saaty, 1980）。本研究初步檢索（附錄一）未見國內智慧長照機構評鑑指標之德菲研究（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已提供品質指標的三構面架構（Donabedian, 1988）與德菲法的執行與報告準則（Hasson et al., 2000；Diamond et al., 2014）。","m2_unknown":"然而，針對長照機構智慧照護導入與運作品質、涵蓋結構、過程與結果三構面，且經機構、主管機關、資訊與學術等跨職類專家共識並附權重之評鑑指標仍付之闕如；既有醫院資訊系統評估框架亦未考量長照機構人力與資源條件。","m2_worth":"此缺口使機構無法自評、主管機關無從輔導或設計獎勵；本研究以事先界定判準之修正式德菲法建構指標體系，可直接作為評鑑或獎勵草案的討論基礎。","m2_theory":"以 Donabedian（1988）結構－過程－結果架構初擬指標構面，以德菲法（Hasson et al., 2000）形成共識，需要權重時以 AHP（Saaty, 1980）計算。","m2_orig":"本計畫首次針對智慧長照機構建構評鑑指標，專家涵蓋機構、主管機關、廠商與學界，並事先界定共識與停止判準。","m3_rq":"專家對智慧長照機構評鑑之構面與指標，能否在 3 回合內形成共識？","m3_terms":"德菲法：專家匿名、多回合評分並回饋群體統計，以形成共識之方法（Hasson et al., 2000）。\n共識：重要性（平均數 M ≥ 3.5 或眾數 Mode ≥ 3）且一致性（四分位差 QD < 1 或標準差 SD ≤ 1）兩組皆達成者為達共識（Burnette et al., 2003）；判準與停止規則於第一回合前寫定，保留、修改與刪除條件互斥。\n智慧照護：以感測、自動化或連網技術協助照護之設備與流程。\n評鑑指標：可由機構提供文件、紀錄或資料佐證之具體檢核項目。","m3_scope":"研究範圍為住宿式長照機構之智慧照護評鑑指標，涵蓋結構、過程、結果三構面；專家為國內長照機構管理、照護督導、長照行政、照護資訊與學術五類人員。本研究建構指標與權重，不實際以指標評鑑機構，亦不檢驗指標之信效度（可接續 D 型全國調查施測）。","m4_frame":"依結構－過程－結果架構初擬三構面：結構（設備、人力、制度與資安）、過程（訓練、流程整合、警示回應）、結果（住民安全、照護效率、使用者滿意）。每項指標由專家評重要性與可行性；達共識者保留，未達者修改或刪除。","m5_design":"本研究採修正式德菲法（F 型：德菲法與指標建構），以文獻初擬指標取代第一回合開放題，進行 2–3 回合評分，必要時以 AHP 計算權重。","m5_reject":"不採焦點團體直接定稿，因面對面討論易受權威者或發言較多者影響；不採單回合專家問卷，因無法讓專家看到群體意見後修正，不屬德菲法；不採名義團體技術，因專家分散全國、難以同時聚集，且匿名性較低。","m5_site":"研究對象為跨職類專家，透過指導教授與長照相關公協會之網絡邀請，已有 12 位口頭同意參與（附錄二）。專家分為五類：機構主管、照護督導、長照主管機關人員、照護資訊系統人員、學者，每類 3–4 位，並兼顧北中南東地區分布。","m5_incl":"納入條件：在下列任一領域具 5 年以上經驗：長照機構管理、照護督導、長照行政、照護資訊系統開發、長照或資訊管理研究。排除條件：與研究者有直接僱傭或指導關係者。","m5_sample":"專家 18 位，五類各 3–4 位，符合德菲法常見 10–20 位之規模（Keeney et al., 2011）；預期每回合回收率 70% 以上，即至少 13 位。","m5_tool":"一、德菲問卷：每項指標評重要性與可行性各 5 點量尺，並設修改建議欄。\n二、回饋表：第二回合起附群體 M、Mode、QD 與專家本人上一回合分數。\n三、AHP 問卷（可選）：構面與指標兩兩比較，1–9 尺度。\n四、專家基本資料表：職類、年資、單位類型。","m5_flow":"一、第 1–3 月：文獻與既有評鑑基準整理，初擬指標；IRB 送審；2 位專家預閱問卷。\n二、第 4–5 月：第一回合德菲問卷（線上，回收期 2 週），統計並整理修改建議。\n三、第 6 月：第二回合，附群體統計回饋。\n四、第 7 月：若仍有指標未達共識且意見持續變動，進行第三回合。\n五、第 8 月：AHP 問卷計算權重。專家以代號處理，彼此不知身分。","m5_innov":"事先界定共識與停止判準，並同時評重要性與可行性，使指標能直接用於自評與評鑑。","m6_common":"每回合計算各指標重要性與可行性之 M、SD、Mode 與 QD；依事先界定之判準：重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）皆達成者保留；連續兩回合重要性未達（M < 3.5 且 Mode < 3）者刪除；其餘依專家意見修改後進入下一回合（三類互斥）。停止條件：所有指標達共識，或連續兩回合各指標 QD 變化皆小於 0.1（意見已穩定）。AHP 以幾何平均整合專家判斷，一致性比率 CR < 0.1 才採用。分析以 Excel 與 R（版本寫明）執行。","m6_qual":"修改建議與開放意見以內容分析歸類，作為修正措辭、合併或新增指標之依據，並記錄每項變更理由。","m7_irb":"本研究將送〔大學〕研究倫理審查委員會審查，屬專家意見問卷、不涉及個人敏感資料，預計申請簡易審查，以審查會認定為準；於第 1 月送審，核准後才發送第一回合問卷。","m7_consent":"專家於第一回合問卷首頁閱讀研究說明（目的、回合數、每回合填答時間約 30 分鐘、匿名方式、可隨時退出），勾選同意後作答；申請以線上同意代替書面簽名，以審查會核准為準。","m7_risk":"屬最小風險；問卷內容為專業意見，不涉及個人敏感資料。專家可能擔心意見被所屬單位或主管機關識別，故全程以代號處理，回饋只呈現群體統計與匿名意見；專家可隨時退出。","m7_deid":"專家以代號處理，回饋只呈現群體統計與去除可識別資訊之匿名意見；專家名單與代號對照表由研究生加密保管，與問卷資料分開存放。論文僅列專家職類與人數，不列姓名（除非專家書面同意列名致謝）。資料保存至研究結束後 3 年，期滿以不可回復方式刪除。","m7_coi":"專家中之資訊廠商代表可能有商業利益，將在結果中揭露職類組成，並比較排除廠商後之共識是否改變。生成式 AI 僅用於整理文獻摘要，不輸入專家意見。","m8_feas":"專家：已有 12 位口頭同意（附錄二），另 6 位邀請中，並備有每類 2 位之備選名單（僅第一回合可補入）。工具：初擬指標將於第 3 月完成，並由 2 位專家預閱措辭。時間：每回合預留 1 個月（回收 2 週、統計與回饋 2 週），並保留兩個月緩衝。","m9_acad":"提供智慧長照機構評鑑之共識指標與權重，並示範事先界定共識判準、報告各回合回收率與分數變化之德菲法執行方式。","m9_prac":"指標可供機構自評、找出制度與流程缺口，主管機關可據以研擬評鑑或獎勵草案；後續可用指標進行全國調查（接 D 型）以建立基準值。","m9_limd":"指標來自專家共識，代表專家判斷而非實證效果，未經實地施測驗證其信效度與鑑別力；專家組成與遴選方式會影響結果，推論至其他國家或照護型態需保守。","m9_lime":"回合間專家流失可能使共識失去代表性，將報告每回合回收率並比較流失者與留存者之職類分布；看到群體統計後的從眾效應可能高估共識，將要求改分時說明理由。","m9_train":"參與之碩士生將習得指標初擬、德菲法執行、共識統計與 AHP 權重計算（教學示意）。","m9_output":"預計投稿期刊論文 1 篇，並產出智慧長照機構評鑑指標草案 1 份（教學示意）。","m9_nation":"回應長照智慧化政策，提供評鑑與輔導之共同語言。","t_iv":"德菲法","t_pop":"智慧長照機構","t_out":"評鑑指標","t_des":"德菲研究","m10_title":"智慧長照機構評鑑指標之建構：德菲法研究","m10_title_en":"Developing Accreditation Indicators for Smart Long-Term Care Facilities: A Delphi Study","m10_kw":"長照機構、智慧照護、評鑑指標、德菲法、層級分析法","m10_abs":"長照機構陸續導入智慧照護，但現行評鑑缺乏評估智慧照護導入與運作品質的指標。本研究旨在以修正式德菲法建構智慧長照機構評鑑指標並計算權重。本研究以 Donabedian 結構－過程－結果架構，由文獻與既有評鑑基準初擬指標，邀請機構主管、照護督導、主管機關、照護資訊與學術等五類專家共 18 位，進行 2–3 回合德菲問卷，評估各指標之重要性與可行性；以重要性（平均數 ≥ 3.5 或眾數 ≥ 3）且一致性（四分位差 < 1 或標準差 ≤ 1）為共識判準，並以層級分析法計算構面與指標權重。預期產出經共識且附權重之指標體系，可供機構自評與主管機關研擬評鑑參考。","m10_refs":"Burnette, D., Morrow-Howell, N., & Chen, L. M. (2003). Setting priorities for gerontological social work research: A national Delphi study. The Gerontologist, 43(6), 828–838.\nDiamond, I. R., Grant, R. C., Feldman, B. M., Pencharz, P. B., Ling, S. C., Moore, A. M., & Wales, P. W. (2014). Defining consensus: A systematic review recommends methodologic criteria for reporting of Delphi studies. Journal of Clinical Epidemiology, 67(4), 401–409.\nDonabedian, A. (1988). The quality of care: How can it be assessed? JAMA, 260(12), 1743–1748.\nHasson, F., Keeney, S., & McKenna, H. (2000). Research guidelines for the Delphi survey technique. Journal of Advanced Nursing, 32(4), 1008–1015.\nKeeney, S., Hasson, F., & McKenna, H. (2011). The Delphi technique in nursing and health research. Wiley-Blackwell.\nSaaty, T. L. (1980). The analytic hierarchy process. McGraw-Hill.","irb_inst":"〔大學名稱〕〔系所〕；研究對象：跨職類專家（線上問卷）","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：以線上問卷蒐集專家專業意見，不涉及個人敏感資料，屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"跨職類專家 18 位（機構主管、照服督導、主管機關人員、資訊廠商、學者）。","irb_recruit":"由研究生以電子郵件個別邀請，附研究說明；不經由專家之上級要求參與。","irb_vuln":"不納入易受傷害族群；專家中若有主管機關人員，其參與不代表機關立場，並以代號處理。","irb_task":"填 2–3 回合線上問卷，每回合約 20 分鐘，為每項指標打分數並提供修改建議；之後可能再填一份權重比較問卷，約 15 分鐘。","irb_withdraw":"可隨時以電子郵件告知退出，無須說明理由；退出後不再寄送問卷，已回覆之資料依您的意願刪除。","irb_benefit":"無直接利益；每回合致贈〔　〕元禮券，並於研究完成後提供指標成果。","irb_harm":"屬最小風險；對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為專家評分與意見，以代號儲存，保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"是（免除書面同意，改以線上同意）。問卷內容為專業意見、屬最小風險，以問卷首頁說明並勾選同意代替簽名，以審查會核准為準。","irb_ad":"【智慧長照機構評鑑指標專家邀請】誠摯邀請您擔任德菲研究專家，協助評估智慧長照機構評鑑指標。共 2–3 回合線上問卷，每回合約 20 分鐘。聯絡人：〔研究生姓名〕〔電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責指標初擬、問卷發送與共識統計）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"Delphi technique; quality indicators; long-term care; smart care; analytic hierarchy process","m10_abs_en":"Long-term care facilities are increasingly adopting smart care technologies, yet current accreditation lacks indicators for evaluating the quality of their implementation and operation. This study aims to develop accreditation indicators for smart long-term care facilities using a modified Delphi technique and to determine their weights. Based on Donabedian's structure–process–outcome framework, draft indicators will be derived from the literature and existing accreditation standards. Eighteen experts from five groups—facility administrators, care supervisors, government officials, care information system professionals, and academics—will rate the importance and feasibility of each indicator on a five-point scale over two to three rounds, with group statistics and anonymous comments fed back between rounds. Consensus is predefined as adequate importance (mean ≥ 3.5 or mode ≥ 3) together with agreement (interquartile deviation < 1 or standard deviation ≤ 1), and the process will stop when all indicators reach consensus or ratings stabilize. The analytic hierarchy process will then be used to weight dimensions and indicators, accepting judgments with a consistency ratio below 0.1. The study is expected to produce a consensus-based, weighted indicator framework to support facility self-assessment and future accreditation policy."},"objs":[{"verb":"開發","text":"依文獻與既有評鑑基準初擬智慧長照機構評鑑指標","hyp":"","analysis":"文獻與基準對照整理，歸入結構、過程、結果三構面；2 位專家預閱","crit":"每項指標附出處","sens":"—","exp":"預期初擬 3 構面、約 30 項指標。"},{"verb":"描述","text":"描述各回合專家對指標重要性與可行性之共識結果","hyp":"","analysis":"每回合計算 M、SD、Mode、QD；依事先界定判準保留、修改或刪除","crit":"重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）皆達成者保留；停止條件：全數達共識或連續兩回合 QD 變化 < 0.1","sens":"排除廠商代表後重新計算共識","exp":"預期 2–3 回合內多數指標達共識；若結果構面共識較低，表示結果指標較難量測，需後續研究。"},{"verb":"描述","text":"描述構面與指標之相對權重","hyp":"","analysis":"AHP：幾何平均整合專家判斷，計算權重與一致性比率","crit":"CR < 0.1 才採用","sens":"比較不同職類專家之權重排序","exp":"預期結構與過程構面權重較高；若權重分散，表示專家對重點看法不一。"}],"vars":[{"name":"指標重要性","role":"依變項","concept":"專家認為該指標對評鑑的重要程度","oper":"5 點量尺（1 非常不重要～5 非常重要）","tool":"德菲問卷","scale":"次序","time":"每回合","rel":"Hasson 等人（2000）"},{"name":"指標可行性","role":"依變項","concept":"機構蒐集該指標資料的可行程度","oper":"5 點量尺（1 非常不可行～5 非常可行）","tool":"德菲問卷","scale":"次序","time":"每回合","rel":"同上"},{"name":"共識程度","role":"依變項","concept":"專家意見集中程度","oper":"四分位差 QD；M 與 Mode","tool":"計算","scale":"等距","time":"每回合","rel":"Burnette 等人（2003）；Diamond 等人（2014）"},{"name":"專家職類","role":"控制","concept":"專家背景","oper":"機構主管／督導／主管機關／廠商／學者","tool":"基本資料表","scale":"名目","time":"第一回合","rel":"—"}],"bias":[{"name":"專家選擇偏差","why":"專家來自研究者熟悉的網絡，觀點可能同質","fix":"五類職類配額；揭露組成"},{"name":"從眾效應","why":"專家看到群體統計後傾向向中間靠攏","fix":"要求改分時說明理由；報告各回合分數變化"},{"name":"流失偏差","why":"意見不同者較易退出","fix":"報告每回合回收率並比較流失者特質"},{"name":"利益衝突","why":"廠商代表可能偏好特定設備指標","fix":"敏感度分析排除廠商後重算"}],"gantt":{"n":12,"rows":[{"t":"文獻與基準整理、初擬指標","s":1,"e":3},{"t":"IRB 送審與核准","s":1,"e":2},{"t":"第一回合德菲","s":4,"e":5},{"t":"第二回合德菲","s":6,"e":6},{"t":"第三回合德菲（如需要）","s":7,"e":7},{"t":"AHP 權重","s":8,"e":8},{"t":"論文撰寫","s":8,"e":10},{"t":"緩衝（回收延長、加開回合）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"專家回收率低","trig":"第一回合回收少於 13 位","when":"M5","plan":"電話提醒並延長 1 週；增邀備選專家（僅第一回合可補）"},{"r":"共識難以收斂","trig":"第三回合仍有逾 3 成指標未達共識","when":"M7","plan":"依停止條件結束，如實報告未達共識指標"},{"r":"AHP 一致性不足","trig":"CR ≥ 0.1","when":"M8","plan":"請該專家重新填答或排除並說明"},{"r":"專家意見兩極","trig":"某指標 Mode 出現雙峰（同時集中在 2 與 5）","when":"M5–M6","plan":"於回饋中呈現分布並請專家說明理由；必要時拆分指標"}],"kpi":[{"name":"達共識指標數（成果指標）","calc":"最後一回合符合共識判準之指標數","base":"初擬指標數（第 3 月）","goal":"多數達共識；具體比例於第一回合後訂定"},{"name":"各回合回收率（產出指標）","calc":"每回合有效回覆數／邀請數","base":"—","goal":"每回合 70% 以上"}],"ss":{}}},"G":{"label":"G 系統性回顧：AI 聊天機器人與憂鬱症狀","grp":0,"data":{"meta":{"type":"G","type2":""},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"AI 聊天機器人心理支持工具大量出現，但隨機試驗結果不一，臨床與校園難以判斷是否值得採用。","s1_2":"已發表之隨機對照試驗：以有憂鬱症狀之成人或青少年為對象。","s1_3":"以 AI 聊天機器人提供之心理介入。","s1_4":"憂鬱症狀（標準化量表，如 PHQ-9、BDI）；合併標準化平均差 SMD。","s1_5":"AI 聊天機器人介入對憂鬱症狀的合併效果為何？","s1_6":"G 系統性回顧：PRISMA 2020、PROSPERO 註冊、RoB 2、隨機效應統合分析、GRADE。","s1_7":"只使用已發表文獻，不涉及人體研究；第二位評估者已確認。","s1_8":"12 個月：註冊與檢索 3 個月、篩選萃取 5 個月、分析與撰寫，保留兩個月緩衝。","s1_9":"提供採用 AI 聊天機器人心理支持工具之證據摘要與確定性評等。","m1_scene":"AI 聊天機器人被廣泛推廣為心理支持工具：從規則式對話、以自然語言處理產生回應，到近年以大型語言模型即時生成對話，產品與研究數量快速增加。校園諮商中心、醫院精神科與保險業者都在評估是否導入，用以補足心理專業人力的缺口。然而，不同隨機試驗的結果差異很大，有的報告明顯改善，有的與對照組無差異，決策者難以判斷「到底有沒有效、對誰有效」。","m1_gap":"決策者通常只看到個別試驗、新聞報導或廠商宣稱，缺乏一份整合所有隨機試驗、評估偏誤風險並給出證據確定性的摘要。個別試驗多為小樣本、短期追蹤，對照組從等待名單到主動對照不一，單看任何一篇都可能高估或低估效果；未經系統性方法整理的文獻回顧，又容易只挑選有利的研究。","m1_new":"Abd-Alrazaq 等人（2020）的系統性回顧與統合分析指出，聊天機器人可能改善憂鬱症狀，但納入研究少且偏誤風險高；Li 等人（2023）的統合分析亦發現 AI 對話式介入對憂鬱與心理困擾有效，但異質性大。此後大型語言模型興起，新的隨機試驗陸續發表，介入型態已與早期規則式聊天機器人明顯不同，既有回顧需要更新，並應檢視「是否使用大型語言模型」是否影響效果。","m1_time":"生成式 AI 聊天機器人自 2023 年起快速普及，2024–2026 年間新的隨機試驗持續發表；本校與合作醫院正評估採購相關工具，需要一份涵蓋最新試驗、經 GRADE 評等之證據摘要作為採用決策依據。","m1_stmt":"因此，本研究擬以系統性回顧與統合分析，整合 AI 聊天機器人介入對憂鬱症狀之成效，探討異質性來源，並以 GRADE 評等證據確定性。","m2_pico":"P：有憂鬱症狀之成人或青少年｜I：AI 聊天機器人心理介入｜C：等待名單、常規照護、心理衛教資料等非聊天機器人對照｜O：介入結束時之憂鬱症狀｜S：隨機對照試驗","m2_search":"資料庫：PubMed、Embase、CINAHL、Cochrane CENTRAL、PsycINFO、華藝。\nPubMed 範例：（chatbot*[tiab] OR \"conversational agent*\"[tiab] OR \"large language model*\"[tiab] OR \"Artificial Intelligence\"[Mesh]）AND（\"Depression\"[Mesh] OR depress*[tiab]）AND（randomized controlled trial[pt] OR randomi*[tiab]）\n不限語言，2000 年以後；另檢索 ClinicalTrials.gov 與納入研究之參考文獻。完整檢索式、檢索日期與筆數見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、既有回顧。Abd-Alrazaq 等人（2020）回顧聊天機器人用於心理健康之研究，憂鬱症狀之合併效果傾向改善，但證據確定性低。對本研究的意義：需納入新試驗並完整評估偏誤。\n二、代表性試驗。Fitzpatrick 等人（2017）的隨機試驗顯示，大學生使用對話機器人兩週後憂鬱症狀改善優於對照，但樣本小、追蹤短。對本研究的意義：要依追蹤時間與對照類型做次群組分析。\n三、方法學。系統性回顧依 PRISMA 2020 報告（Page et al., 2021）與 Cochrane 手冊（Higgins et al., 2023）執行；隨機試驗以 RoB 2 評估偏誤（Sterne et al., 2019），異質性以 I² 呈現（Higgins & Thompson, 2002），證據確定性以 GRADE 評等（Guyatt et al., 2008）。","m2_known":"既有回顧顯示聊天機器人可能改善憂鬱症狀（Abd-Alrazaq et al., 2020），但納入研究少、偏誤風險高。","m2_unknown":"納入 2023 年後新發表之試驗後，合併效果是否改變、異質性來源（追蹤時間、對照類型、是否使用大型語言模型）為何，以及整體證據確定性等級，仍待更新；既有回顧亦少以 RoB 2 逐面向評估並據以做敏感度分析。","m2_worth":"此缺口使決策者無法判斷證據強度，也無從得知應採用哪一類聊天機器人；本研究提供更新之合併效果、次群組比較與 GRADE 評等，並指出未來試驗應改善之處。","m2_theory":"以 PRISMA 2020（Page et al., 2021）與 Cochrane 手冊（Higgins et al., 2023）為方法架構；依 PICO 界定納入條件，以 RoB 2 與 GRADE 評估證據。","m2_orig":"本計畫納入大型語言模型時代之新試驗，並以是否使用大型語言模型、追蹤時間與對照類型做次群組分析。","m3_rq":"AI 聊天機器人介入對憂鬱症狀之合併效果為何？證據確定性如何？","m3_terms":"AI 聊天機器人：以自然語言與使用者對話、自動提供心理支持或介入內容之軟體。\n合併效果：以隨機效應模型合併之標準化平均差（SMD，Hedges' g），負值表示憂鬱症狀減少。\n證據確定性：以 GRADE 評為高、中、低、極低。","m3_scope":"研究範圍為截至檢索日（預計 2027 年 2 月）已發表或已於試驗登錄平台公布結果之隨機對照試驗（含群集隨機試驗），對象為有憂鬱症狀之成人或青少年；不納入非隨機研究、無對照組研究、只評可用性或滿意度之研究，以及聊天機器人僅為多元介入中無法分離之一小部分者。","m4_frame":"依 PICO 萃取變項：P（年齡層、症狀嚴重度）、I（聊天機器人類型、是否大型語言模型、介入期間）、C（對照類型）、O（量表、測量時點）。主要結果為介入結束時之憂鬱症狀 SMD；次群組依追蹤時間、對照類型與聊天機器人類型區分。","m5_design":"本研究採系統性回顧與統合分析（G 型：系統性回顧），依 PRISMA 2020 報告，計畫書於檢索前註冊 PROSPERO。","m5_reject":"不採敘述性文獻回顧，因無法重現檢索與篩選、易有選擇偏差；不採範域回顧，因本研究問題為成效而非盤點研究範圍，需評估偏誤與合併效果；不納入非隨機研究合併分析，因干擾無法控制，會使合併效果偏誤。","m5_site":"資料來源為已發表文獻與試驗登錄平台，不涉及人體研究。檢索資料庫為 PubMed、Embase、CINAHL、Cochrane CENTRAL、PsycINFO 與華藝線上圖書館，並檢索 ClinicalTrials.gov 與 WHO ICTRP 之已完成試驗。第二位評估者為同實驗室研究生〔姓名〕，已同意參與篩選、偏誤評估與萃取（附錄二）；第三位裁決者為指導教授。","m5_incl":"納入：隨機對照試驗；對象有憂鬱症狀（量表分數達切點或臨床診斷）；介入為 AI 聊天機器人；有非聊天機器人對照；報告憂鬱症狀量表結果。排除：會議摘要無完整資料、聊天機器人僅為介入的一小部分且無法分離效果者。","m5_sample":"納入篇數無法事先決定；兩位評估者先以 50 篇標題摘要試篩，κ ≥ 0.6 後才正式篩選（McHugh, 2012）。統合分析至少需 2 篇同質研究；10 篇以上才繪製漏斗圖評估發表偏誤。","m5_tool":"一、檢索紀錄表：資料庫、檢索式、日期、筆數。\n二、篩選工具：Rayyan（Ouzzani et al., 2016）。\n三、萃取表：研究特徵、PICO 各項、樣本數、平均數與標準差；先試萃 3 篇修正欄位。\n四、偏誤評估：RoB 2（Sterne et al., 2019）。\n五、證據確定性：GRADE（Guyatt et al., 2008）。","m5_flow":"一、第 1–2 月：撰寫計畫書並註冊 PROSPERO。\n二、第 3 月：執行檢索並去除重複。\n三、第 4–6 月：兩人獨立篩選標題摘要與全文，不一致由指導教授裁決。\n四、第 6–8 月：兩人獨立萃取與 RoB 2 評估，互相核對。\n五、第 9 月：統合分析與 GRADE。所有決定與理由記錄於篩選紀錄表。","m5_innov":"以是否使用大型語言模型為次群組，檢視新一代聊天機器人之效果是否不同，並以 GRADE 提供決策者可用的證據摘要。","m6_common":"以隨機效應模型（REML）合併 SMD（Hedges' g）與 95% CI；異質性以 I² 與 τ² 呈現（Higgins & Thompson, 2002）。次群組：追蹤時間（≤ 4 週、> 4 週）、對照類型、是否大型語言模型。敏感度分析：排除整體偏誤風險高之研究。研究數 ≥ 10 時以漏斗圖與 Egger 檢定評估發表偏誤。分析以 R 套件 metafor（版本寫明）執行。","m7_irb":"本研究只使用已發表文獻之彙總資料，不接觸人體、不使用個人資料，依《人體研究法》第 4 條不屬人體研究，無須送 IRB 審查；如學校或期刊要求出具免審證明，將依其程序申請。計畫書將於檢索前註冊 PROSPERO 以確保透明。","m7_consent":"不適用：本研究不招募參與者，只使用已發表文獻之彙總資料。","m7_risk":"不涉及參與者風險；主要研究倫理風險為選擇性報告與萃取錯誤。以事先註冊計畫書、兩人獨立篩選與萃取、報告所有偏離計畫之處降低風險。","m7_deid":"資料為已發表之彙總數據，不含個人資料；萃取表、檢索紀錄與分析程式碼存於實驗室雲端並公開於 OSF，保存至研究結束後 3 年以上。","m7_coi":"研究者與任何聊天機器人廠商無財務關係。生成式 AI 不用於篩選與萃取判斷，只用於英文潤稿。","m8_feas":"人力：第二位評估者已同意（附錄二），兩人已完成系統性回顧工作坊。文獻：以 PubMed 初步試查已找到 20 篇以上可能符合之隨機試驗，足以進行統合分析。全文：學校圖書館提供主要資料庫與館際合作。工具：Rayyan 與 R metafor 為免費工具。時間：篩選與萃取安排 5 個月，保留兩個月緩衝；若篇數過多，以兩人分工並抽檢 20% 確認一致性。","m9_acad":"更新 AI 聊天機器人對憂鬱症狀成效之證據，納入大型語言模型時代之試驗，並以 RoB 2 與 GRADE 評等確定性；次群組分析可提出「哪種聊天機器人、對照與追蹤期」之假設供後續試驗檢驗。","m9_prac":"供校園與醫療機構決定是否採用聊天機器人心理支持工具，以及採用時應設定的期待（短期 vs 長期效果）；若證據不足，指出未來試驗在樣本數、對照設計與追蹤期上應改善之處。","m9_limd":"納入研究之介入、對象與量表異質，合併結果需謹慎解讀；次群組與統合迴歸屬觀察性比較，不能推論因果；只納入已發表或已登錄結果之研究，仍可能有發表偏誤。","m9_lime":"部分研究未報告可合併之數據（如缺標準差），將依 Cochrane 手冊由 CI 或 p 值換算並聯絡原作者，仍無法取得者只做敘述統合；大型語言模型產品更新快速，結果可能很快過時，將於討論中說明檢索截止日。","m9_train":"參與之碩士生將習得系統性檢索、雙人篩選、RoB 2、統合分析與 GRADE（教學示意）。","m9_output":"預計投稿期刊論文 1 篇，並公開萃取表與分析程式碼（教學示意）。","m9_nation":"提供數位心理健康工具採用之實證依據，協助政策與採購避免高估效果。","t_iv":"AI 聊天機器人","t_pop":"有憂鬱症狀者","t_out":"憂鬱症狀","t_des":"系統性回顧與統合分析","m10_title":"AI 聊天機器人介入對憂鬱症狀之成效：系統性回顧與統合分析","m10_title_en":"Effectiveness of AI Chatbot Interventions on Depressive Symptoms: A Systematic Review and Meta-Analysis","m10_kw":"聊天機器人、人工智慧、憂鬱、統合分析、系統性回顧","m10_abs":"AI 聊天機器人被廣泛推廣為心理支持工具，但隨機試驗結果不一，且大型語言模型興起後新試驗陸續發表，既有證據需要更新。本研究旨在以系統性回顧與統合分析，整合 AI 聊天機器人介入對憂鬱症狀之成效，探討異質性來源並評等證據確定性。本研究依 PRISMA 2020 執行並於檢索前註冊 PROSPERO，檢索 PubMed、Embase、CINAHL、Cochrane CENTRAL、PsycINFO、華藝與試驗登錄平台，納入以有憂鬱症狀者為對象之隨機對照試驗；兩人獨立篩選、萃取並以 RoB 2 評估偏誤，以隨機效應模型合併 Hedges' g，依追蹤時間、對照類型與是否使用大型語言模型做次群組分析，並以 GRADE 評等證據確定性。預期提供更新之合併效果與證據確定性，供校園與醫療機構採用決策參考。","m10_refs":"Abd-Alrazaq, A. A., Rababeh, A., Alajlani, M., Bewick, B. M., & Househ, M. (2020). Effectiveness and safety of using chatbots to improve mental health: Systematic review and meta-analysis. Journal of Medical Internet Research, 22(7), e16021.\nFitzpatrick, K. K., Darcy, A., & Vierhile, M. (2017). Delivering cognitive behavior therapy to young adults with symptoms of depression and anxiety using a fully automated conversational agent (Woebot): A randomized controlled trial. JMIR Mental Health, 4(2), e19.\nGuyatt, G. H., Oxman, A. D., Vist, G. E., Kunz, R., Falck-Ytter, Y., Alonso-Coello, P., & Schünemann, H. J. (2008). GRADE: An emerging consensus on rating quality of evidence and strength of recommendations. BMJ, 336(7650), 924–926.\nHiggins, J. P. T., & Thompson, S. G. (2002). Quantifying heterogeneity in a meta-analysis. Statistics in Medicine, 21(11), 1539–1558.\nHiggins, J. P. T., Thomas, J., Chandler, J., Cumpston, M., Li, T., Page, M. J., & Welch, V. A. (Eds.). (2023). Cochrane handbook for systematic reviews of interventions (version 6.4). Cochrane.\nLi, H., Zhang, R., Lee, Y.-C., Kraut, R. E., & Mohr, D. C. (2023). Systematic review and meta-analysis of AI-based conversational agents for promoting mental health and well-being. npj Digital Medicine, 6, 236.\nMcHugh, M. L. (2012). Interrater reliability: The kappa statistic. Biochemia Medica, 22(3), 276–282.\nOuzzani, M., Hammady, H., Fedorowicz, Z., & Elmagarmid, A. (2016). Rayyan—A web and mobile app for systematic reviews. Systematic Reviews, 5, 210.\nPage, M. J., McKenzie, J. E., Bossuyt, P. M., Boutron, I., Hoffmann, T. C., Mulrow, C. D., et al. (2021). The PRISMA 2020 statement: An updated guideline for reporting systematic reviews. BMJ, 372, n71.\nSterne, J. A. C., Savović, J., Page, M. J., Elbers, R. G., Blencowe, N. S., Boutron, I., et al. (2019). RoB 2: A revised tool for assessing risk of bias in randomised trials. BMJ, 366, l4898.","irb_inst":"〔大學名稱〕〔系所〕；資料來源：已發表文獻（PubMed、Embase 等資料庫）","irb_period":"2026 年 9 月至 2027 年 8 月","irb_review":"無須送審：本研究只使用已發表文獻之彙總資料，不接觸人體、不使用可識別之個人資料，依《人體研究法》第 4 條不屬人體研究；如送審機構或期刊要求，將依其程序申請免審證明。","irb_n":"不適用：不招募參與者；分析對象為符合條件之已發表隨機對照試驗。","irb_recruit":"不適用。","irb_vuln":"不適用。","irb_task":"不適用。","irb_withdraw":"不適用。","irb_benefit":"不適用。","irb_harm":"不適用：不涉及參與者風險。","irb_material":"研究材料為萃取表、檢索紀錄與分析程式碼，公開於 OSF 並保存 3 年以上。","irb_waive":"不適用（不屬人體研究）。","irb_ad":"不適用。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（負責檢索、篩選、萃取與分析）；第二位評估者〔姓名〕（獨立篩選、萃取與偏誤評估）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"chatbot; conversational agent; depression; systematic review; meta-analysis","m10_abs_en":"AI chatbots are widely promoted as mental health support tools, but results from randomized trials are inconsistent, and new trials have been published since the emergence of large language models. This study aims to synthesize the effects of AI chatbot interventions on depressive symptoms, explore sources of heterogeneity, and grade the certainty of evidence. Following PRISMA 2020 and a protocol registered in PROSPERO before searching, we will search PubMed, Embase, CINAHL, Cochrane CENTRAL, PsycINFO, a Chinese-language database (Airiti Library), and trial registries for randomized controlled trials involving adults or adolescents with depressive symptoms. Two reviewers will independently screen records, extract data, and assess risk of bias using RoB 2, with disagreements resolved by a third reviewer. Standardized mean differences (Hedges' g) at the end of intervention will be pooled using random-effects models with restricted maximum likelihood estimation; heterogeneity will be quantified with I² and τ², and subgroup analyses will examine follow-up duration, comparator type, and the use of large language models. Publication bias will be assessed when at least ten studies are available, and the certainty of evidence will be rated using GRADE. The findings are expected to inform adoption decisions in campus and healthcare settings."},"objs":[{"verb":"描述","text":"描述納入試驗之研究特徵與偏誤風險","hyp":"","analysis":"證據表；RoB 2 各面向與整體評等之比例","crit":"兩人獨立評估，報 κ 值","sens":"—","exp":"預期多數試驗為小樣本、短期追蹤，部分面向偏誤風險為「有疑慮」。"},{"verb":"比較","text":"比較聊天機器人組與對照組介入結束時之憂鬱症狀","hyp":"H1：合併 SMD < 0（聊天機器人組症狀較少）；H0：合併 SMD = 0。","analysis":"隨機效應統合分析（REML），合併 Hedges' g 與 95% CI；I² 與 τ²","crit":"95% CI 不含 0；I² > 50% 視為中高度異質","sens":"排除高偏誤風險研究；留一法","exp":"預期小至中度改善；若異質性高，表示效果依介入與對象而不同。"},{"verb":"探討","text":"探討追蹤時間、對照類型與是否使用大型語言模型對效果之影響","hyp":"","analysis":"次群組分析與統合迴歸（探索性）","crit":"次群組間差異檢定 p < .10 作為探索性線索","sens":"—","exp":"預期短期效果較大、主動對照下效果較小；大型語言模型是否不同尚無定論。"}],"vars":[{"name":"憂鬱症狀 SMD","role":"依變項","concept":"介入結束時兩組憂鬱症狀差異","oper":"Hedges' g：（介入組平均－對照組平均）／合併標準差","tool":"萃取表","scale":"比率","time":"介入結束時","rel":"Higgins 等人（2023）"},{"name":"聊天機器人類型","role":"探索","concept":"介入特徵","oper":"規則式／自然語言處理／大型語言模型","tool":"萃取表","scale":"名目","time":"—","rel":"兩人萃取核對"},{"name":"追蹤時間","role":"探索","concept":"介入結束距測量時間","oper":"≤ 4 週／> 4 週","tool":"萃取表","scale":"次序","time":"—","rel":"同上"},{"name":"對照類型","role":"探索","concept":"比較條件","oper":"等待名單／常規照護／主動對照","tool":"萃取表","scale":"名目","time":"—","rel":"同上"},{"name":"偏誤風險","role":"控制","concept":"研究內部效度","oper":"RoB 2 整體評等：低／有疑慮／高","tool":"RoB 2","scale":"次序","time":"—","rel":"Sterne 等人（2019）"}],"bias":[{"name":"發表偏誤","why":"陰性結果較少發表","fix":"檢索試驗登錄平台；10 篇以上繪漏斗圖"},{"name":"選擇偏差（篩選）","why":"單人篩選可能誤排除","fix":"兩人獨立篩選，計算 κ"},{"name":"萃取錯誤","why":"數據抄錄錯誤","fix":"兩人獨立萃取並核對"},{"name":"語言偏誤","why":"只納入英文文獻","fix":"不限語言，納入華藝等中文資料庫"}],"gantt":{"n":12,"rows":[{"t":"計畫書撰寫與 PROSPERO 註冊","s":1,"e":2},{"t":"檢索與去重複","s":3,"e":3},{"t":"標題摘要與全文篩選","s":4,"e":6},{"t":"萃取與偏誤評估","s":6,"e":8},{"t":"統合分析與 GRADE","s":9,"e":9},{"t":"論文撰寫","s":9,"e":11},{"t":"緩衝（補檢索、聯絡原作者）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"納入研究太少","trig":"全文篩選後少於 3 篇","when":"M6","plan":"放寬對照類型或改為敘述統合並說明"},{"r":"數據不足以合併","trig":"缺標準差","when":"M7","plan":"依 Cochrane 手冊由 CI 或 p 值換算；聯絡原作者"},{"r":"篩選一致性不足","trig":"試篩 κ < 0.6","when":"M4","plan":"修正納入條件說明後重新試篩"},{"r":"檢索結果過多","trig":"去重複後超過 5,000 筆","when":"M3","plan":"檢查檢索式敏感度與特異度並修正；兩人分工篩選、抽檢 20% 確認一致性"}],"kpi":[{"name":"完成全文篩選（產出指標）","calc":"完成全文篩選之篇數／應篩篇數","base":"0","goal":"第 6 月 100%"},{"name":"合併效果 95% CI（成果指標）","calc":"主要結果合併 SMD 與 95% CI","base":"—","goal":"第 9 月完成"}],"ss":{}}},"H":{"label":"H 次級資料：聽力損失與失智症風險","grp":0,"data":{"meta":{"type":"H","type2":""},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"聽力損失被認為是可改變的失智風險因子，但臺灣成人的長期世代證據有限，聽損照護政策缺乏本土依據。","s1_2":"衛生福利資料科學中心之全民健保資料：50 歲以上成人。","s1_3":"暴露：新診斷聽力損失（ICD-10-CM H90–H91）；對照：依年齡、性別、index 年 1:4 配對之無聽損者。","s1_4":"新發生失智症；調整後風險比 HR 與 95% CI。","s1_5":"50 歲以上成人新診斷聽力損失者，日後失智症風險是否較高？","s1_6":"H 次級資料：回溯性世代研究；傾向分數、Cox 迴歸、競爭風險、敏感度分析。","s1_7":"IRB 核准後向衛生福利資料科學中心申請；於中心環境分析；申請免除知情同意。","s1_8":"12 個月：IRB 與資料申請 4 個月、定義與分析 5 個月、撰寫，保留兩個月緩衝。","s1_9":"提供聽損與失智關聯之本土世代證據，支持聽力篩檢與介入政策。","m1_scene":"人口高齡化使失智症人數持續增加，照護負擔落在家庭與長照體系。Lancet 失智症預防委員會指出，近半數失智症與可改變的風險因子有關，其中聽力損失是中年期影響最大的可改變風險因子之一（Livingston et al., 2020, 2024）。臺灣已於 2025 年進入超高齡社會，聽力損失在 50 歲以上族群相當普遍，若聽損確實與失智風險相關，早期發現與介入可能具有可觀的公共衛生效益。","m1_gap":"臺灣聽損照護多以長者主動就醫為主，成人聽力篩檢與輔具補助政策仍在擴展；政策制定需要本土證據說明聽損與失智的關聯強度與適用族群。目前國內以全國資料進行、控制共病與死亡競爭風險，並妥善處理不死時間偏誤之大型世代研究仍有限，政策評估只能借用國外估計值。","m1_new":"Lin 等人（2011）的世代研究顯示，基線聽力損失程度越重，日後失智風險越高；後續多項世代研究與統合分析得到一致方向，Lancet 委員會亦據以估計人口可歸因比例（Livingston et al., 2024）。然而多數證據來自歐美世代，族群、醫療可近性與聽損診斷型態與臺灣不同；且觀察性研究常因暴露與追蹤起點未對齊而產生不死時間偏誤（Suissa, 2008），目標試驗模擬框架可協助避免此類設計錯誤（Hernán & Robins, 2016）。","m1_time":"國民健康署正推動長者聽力篩檢與輔具相關措施，需要本土風險估計作為效益評估與資源配置的依據；全民健保資料可回溯長期追蹤，無須等待多年收案，即可在一年內提供結果。","m1_stmt":"因此，本研究擬以全民健保資料，以目標試驗模擬框定之回溯性配對世代設計，探討 50 歲以上成人新診斷聽力損失與日後失智症風險之關聯。","m2_pico":"P：50 歲以上、index 日前無失智症之成人｜E：新診斷聽力損失｜C：依年齡、性別、index 年 1:4 配對之無聽損者｜O：新發生失智症（主要）；死亡為競爭風險","m2_search":"PubMed：（\"Hearing Loss\"[Mesh] OR \"hearing impairment\"[tiab]）AND（\"Dementia\"[Mesh] OR dementia[tiab] OR \"cognitive decline\"[tiab]）AND（cohort[tiab] OR \"Cohort Studies\"[Mesh]）\n華藝：（聽力損失 OR 聽損）AND（失智 OR 認知）\n限制：2005 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、聽損與失智之關聯。Lin 等人（2011）追蹤美國社區長者，發現基線聽損與日後失智風險呈劑量反應關係；Livingston 等人（2020）綜整證據，將聽損列為可改變風險因子。對本研究的意義：以本土資料估計風險，並檢視結果在不同性別與年齡層是否一致。\n二、健保資料之優勢與限制。全民健保資料涵蓋近全體國民，適合長期世代研究（Hsieh et al., 2019），但診斷碼效度與未測量干擾是主要限制。\n三、方法學。以目標試驗模擬框定研究設計（Hernán & Robins, 2016），避免不死時間偏誤（Suissa, 2008）；以傾向分數方法控制可測量干擾（Austin, 2011），以 E-value 評估未測量干擾之影響（VanderWeele & Ding, 2017）；報告依 RECORD（Benchimol et al., 2015）。","m2_known":"國外世代研究已顯示聽損與日後失智風險相關（Lin et al., 2011；Livingston et al., 2020）。","m2_unknown":"然而，以臺灣全民健保資料、以目標試驗模擬框定（暴露定義、index 日與追蹤起點對齊）、控制共病與死亡競爭風險，並以多種敏感度分析與 E-value 檢視穩健性之本土世代證據仍不足。","m2_worth":"此缺口使聽力篩檢與輔具政策缺乏本土效益估計依據，只能借用國外估計；本研究提供本土風險估計、依年齡與性別之分層結果與敏感度分析，可作為政策評估之參數。","m2_theory":"以目標試驗模擬（Hernán & Robins, 2016）框定理想試驗之各要素，再以健保資料逐項對應；干擾因子依文獻與有向無環圖選定，報告依 RECORD（Benchimol et al., 2015）。","m2_orig":"本計畫以目標試驗模擬框定設計，同時處理不死時間偏誤與死亡競爭風險，並以 E-value 量化未測量干擾之影響。","m3_rq":"50 歲以上成人新診斷聽力損失，與日後失智症風險是否相關？","m3_terms":"聽力損失（暴露）：index 日前 1 年內門診 2 次或住院 1 次以上 ICD-10-CM H90–H91 診斷；「新診斷」指 index 日前 1 年（洗出期）內第一次出現前述診斷。\nindex 日：暴露組為符合聽損定義之日（第 2 次門診日或住院日）；對照組為配對暴露者之同一日，且當日仍存活、無失智症診斷。\n失智症（結果）：index 日後門診 2 次或住院 1 次以上 ICD-10-CM F01–F03、G30 診斷，以首次診斷日為事件日。\n洗出期：index 日前 1 年無聽損與失智症診斷。","m3_scope":"研究範圍為 2016–2018 年 index 之 50 歲以上成人，追蹤至 2023 年底或死亡、退保；本研究估計聽損與失智之關聯，不推論因果，不評估助聽器或人工電子耳之成效（資料中輔具使用紀錄不完整），亦無法取得實際聽力閾值。","m4_frame":"暴露為聽力損失；結果為新發生失智症；共變項包括年齡、性別、投保薪資等級、都市化程度、Charlson 共病指數、高血壓、糖尿病、腦中風、憂鬱症；死亡為競爭風險。","m5_design":"本研究採回溯性配對世代研究（H 型：次級資料研究），以目標試驗模擬框定設計，依 RECORD 報告（Benchimol et al., 2015）。","m5_reject":"不採病例對照研究，因難以確立暴露早於結果之時序且對照選擇易偏誤；不採橫斷式研究，因無法估計發生率與風險比；不以「曾經有聽損診斷」之盛行個案為暴露，因會混入病程長短不一之個案，故採新診斷設計並對齊 index 日。","m5_site":"資料來源為衛生福利資料科學中心之全民健保資料，包含門診、住院、承保與死因檔，涵蓋全國 99% 以上人口（Hsieh et al., 2019）。研究者將於 IRB 核准後提出申請，資料只在中心指定分析環境處理（附錄二：申請流程與預估時程）。","m5_incl":"納入：2016–2018 年 50 歲以上，符合新診斷聽力損失定義者為暴露組；依年齡（±1 歲）、性別、index 年 1:4 配對 index 日前無聽損診斷者為對照組。排除：index 日前已有失智症、帕金森氏症、腦部腫瘤或嚴重腦外傷診斷者；index 日前投保不滿 1 年者。另於敏感度分析排除 index 日後 1 年內發生失智症者（主分析保留）。","m5_sample":"以 Schoenfeld（1983）公式估算：HR = 1.2、α = .05 雙尾、檢定力 .80、暴露組比例 20%（1:4 配對），需約 1,476 件失智事件；預估 8 年累積發生率約 8%，需約 18,500 人。全民健保資料可提供遠高於此之樣本（教學示意：請以中心資料估計重新計算）。","m5_tool":"一、代碼表：暴露、結果、排除條件與共變項之 ICD-10-CM 代碼與時間窗；健保於 2016 年改用 ICD-10-CM，2016 年 index 者之回溯期（2015 年）以對應之 ICD-9-CM 代碼定義，並以官方對照表核對。\n二、Charlson 共病指數（Charlson et al., 1987）。\n三、分析軟體：SAS 9.4 或 R（依中心環境，版本寫明）。\n四、RECORD 清單逐項對照。","m5_flow":"一、第 1–2 月：IRB 送審並申請免除知情同意。\n二、第 2–4 月：核准後向衛生福利資料科學中心申請資料（第 2 月即送件）。\n三、第 5–6 月：於中心環境建立世代、配對與代碼定義。\n四、第 7–9 月：主要分析與敏感度分析。\n五、結果依中心規定遮蔽小格數，經審查後才帶出。","m5_innov":"以目標試驗模擬框定設計，並同時處理不死時間偏誤、死亡競爭風險與未測量干擾（E-value）。","m6_common":"顯著水準 α = .05（雙尾）。報每千人年發生率；以 Cox 比例風險模型估計調整後 HR 與 95% CI，因 1:4 配對，以配對組為分層（stratified Cox）並以穩健變異數估計標準誤，檢查比例風險假設；以 Fine–Gray 模型處理死亡競爭風險（Fine & Gray, 1999）。以傾向分數 IPTW 為次要分析，SMD < 0.1 視為平衡（Austin, 2011）。敏感度分析：排除 index 後 1 年內事件、改用較嚴格的失智定義（需有失智用藥或住院診斷）、調整 index 前門診次數、計算 E-value（VanderWeele & Ding, 2017）。分析以 SAS 或 R 執行（依中心環境，版本寫明）。","m7_irb":"本研究將送〔大學〕研究倫理審查委員會審查，屬使用去識別化次級資料之研究，預計申請簡易審查並同時申請免除知情同意，以審查會認定為準；於第 1 月送審，核准後才向衛生福利資料科學中心申請資料。","m7_consent":"本研究使用加密去識別化之全民健保資料，無法辨識個人且無法逐一取得同意，將依《人體研究法》第 12 條第 2 項但書（屬主管機關公告得免取得同意之研究案件範圍）申請免除知情同意，以審查會認定為準。","m7_risk":"本研究不接觸個人，不影響其就醫；主要風險為資料外洩與再識別。資料僅於衛生福利資料科學中心環境分析，依中心規定管理，結果以彙總統計呈現並遮蔽小格數。","m7_deid":"資料由中心加密去識別化提供，研究者無法辨識個人；只在中心環境分析，原始資料不得攜出，結果經中心審查並遮蔽小格數（依中心規定）後才帶出。分析程式碼保存於研究者電腦，資料依中心規定期限保存與銷毀。","m7_coi":"研究者與任何助聽器廠商無財務關係。生成式 AI 僅用於英文潤稿，不輸入任何資料。","m8_feas":"資料：衛生福利資料科學中心可提供門住診、承保與死因檔，已確認所需年份與欄位（附錄二）；健保資料樣本量遠高於 Schoenfeld 公式之需求。人力：指導教授具健保資料研究經驗，研究者已修習流行病學與存活分析課程，並以公開之資料庫文件撰寫代碼表與分析程式草稿。經費：中心使用費約〔　〕元，由指導教授計畫支應。時間：資料申請預留 3 個月並於第 2 月即送件，保留兩個月緩衝。","m9_acad":"提供臺灣成人聽損與失智風險之本土世代證據，並示範以目標試驗模擬框定、對齊暴露與追蹤起點以避免不死時間偏誤之次級資料研究設計。","m9_prac":"可作為聽力篩檢與輔具政策效益評估之本土參數，並指出風險較高之年齡層與性別供篩檢優先順序參考；同一份資料可接續建立失智風險預測模型（接 B 型）。","m9_limd":"觀察性設計無法排除未測量干擾（如教育程度、實際聽力程度、社會參與）；以 E-value 量化未測干擾需多強才能解釋觀察到的關聯；結果為關聯而非因果。","m9_lime":"聽損以診斷碼定義，未就醫之聽損者會被歸為對照，可能使關聯偏向無效值（低估）；失智症診斷亦可能延遲，將以嚴格定義與排除前 1 年事件做敏感度分析，並於討論中說明偏誤方向。","m9_train":"參與之碩士生將習得健保資料申請、世代建立、傾向分數、Cox 與競爭風險分析（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇（教學示意）。","m9_nation":"回應高齡社會失智預防政策，提供聽損照護介入之本土實證依據。","t_iv":"聽力損失","t_pop":"50 歲以上成人","t_out":"失智症風險","t_des":"全國回溯性世代研究","m10_title":"50 歲以上成人聽力損失與失智症風險：全民健保資料之回溯性世代研究","m10_title_en":"Hearing Loss and Risk of Dementia among Adults Aged 50 Years and Older: A Retrospective Cohort Study Using Taiwan's National Health Insurance Data","m10_kw":"聽力損失、失智症、世代研究、全民健保資料、目標試驗模擬","m10_abs":"聽力損失被認為是可改變的失智風險因子，但臺灣本土世代證據有限。本研究旨在探討 50 歲以上成人新診斷聽力損失與日後失智症風險之關聯。本研究以全民健保資料進行目標試驗模擬框定之回溯性配對世代研究，以 2016–2018 年新診斷聽力損失者為暴露組，依年齡、性別與 index 年 1:4 配對無聽損者，追蹤至 2023 年底；以分層 Cox 模型估計調整後風險比，以 Fine–Gray 模型處理死亡競爭風險，並以傾向分數加權、排除早期事件與 E-value 等敏感度分析檢驗穩健性。預期聽損與較高失智風險相關，可作為聽力篩檢與介入政策之本土依據。","m10_refs":"Austin, P. C. (2011). An introduction to propensity score methods for reducing the effects of confounding in observational studies. Multivariate Behavioral Research, 46(3), 399–424.\nBenchimol, E. I., Smeeth, L., Guttmann, A., Harron, K., Moher, D., Petersen, I., et al. (2015). The REporting of studies Conducted using Observational Routinely-collected health Data (RECORD) statement. PLoS Medicine, 12(10), e1001885.\nCharlson, M. E., Pompei, P., Ales, K. L., & MacKenzie, C. R. (1987). A new method of classifying prognostic comorbidity in longitudinal studies: Development and validation. Journal of Chronic Diseases, 40(5), 373–383.\nFine, J. P., & Gray, R. J. (1999). A proportional hazards model for the subdistribution of a competing risk. Journal of the American Statistical Association, 94(446), 496–509.\nHernán, M. A., & Robins, J. M. (2016). Using big data to emulate a target trial when a randomized trial is not available. American Journal of Epidemiology, 183(8), 758–764.\nHsieh, C.-Y., Su, C.-C., Shao, S.-C., Sung, S.-F., Lin, S.-J., Kao Yang, Y.-H., & Lai, E. C.-C. (2019). Taiwan's National Health Insurance Research Database: Past and future. Clinical Epidemiology, 11, 349–358.\nLin, F. R., Metter, E. J., O'Brien, R. J., Resnick, S. M., Zonderman, A. B., & Ferrucci, L. (2011). Hearing loss and incident dementia. Archives of Neurology, 68(2), 214–220.\nLivingston, G., Huntley, J., Liu, K. Y., Costafreda, S. G., Selbæk, G., Alladi, S., et al. (2024). Dementia prevention, intervention, and care: 2024 report of the Lancet standing Commission. The Lancet, 404(10452), 572–628.\nLivingston, G., Huntley, J., Sommerlad, A., Ames, D., Ballard, C., Banerjee, S., et al. (2020). Dementia prevention, intervention, and care: 2020 report of the Lancet Commission. The Lancet, 396(10248), 413–446.\nSchoenfeld, D. A. (1983). Sample-size formula for the proportional-hazards regression model. Biometrics, 39(2), 499–503.\nSuissa, S. (2008). Immortal time bias in pharmacoepidemiology. American Journal of Epidemiology, 167(4), 492–499.\nVanderWeele, T. J., & Ding, P. (2017). Sensitivity analysis in observational research: Introducing the E-value. Annals of Internal Medicine, 167(4), 268–274.","irb_inst":"〔大學名稱〕〔系所〕；資料來源：衛生福利資料科學中心（全民健保資料）","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查（或依送審機構認定之免除審查）：使用加密去識別化之全民健保資料，不接觸個人，屬最小風險；以審查會判定為準。","irb_n":"2016–2018 年 50 歲以上符合條件之暴露者與 1:4 配對對照（預估數萬人，依中心資料；不接觸個人）。","irb_recruit":"不適用：本研究不招募參與者。","irb_vuln":"資料包含高齡者；因資料已加密去識別化且不接觸個人，不另設招募保護措施。","irb_task":"不適用：不需要任何人做任何事；研究只分析已存在的健保資料。","irb_withdraw":"不適用個別撤回：資料已加密去識別化，研究者無法辨識個人。","irb_benefit":"個人無直接利益；研究結果可能促進聽損照護與失智預防政策。","irb_harm":"主要風險為資料外洩；資料僅於衛生福利資料科學中心環境處理，依中心規定管理。","irb_material":"研究材料為中心環境中之分析資料與帶出之彙總結果；依中心規定期限保存與銷毀，不作本計畫以外之用途。","irb_waive":"是。本研究使用加密去識別化之全民健保資料，無法辨識個人，且無法逐一取得同意，對個人權益影響極小；依《人體研究法》第 12 條第 2 項但書（屬主管機關公告得免取得同意之研究案件範圍）申請免除知情同意，以審查會認定為準。","irb_ad":"不適用：本研究不招募參與者。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責資料申請、世代建立與統計分析）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"hearing loss; dementia; cohort study; National Health Insurance Research Database; target trial emulation","m10_abs_en":"Hearing loss is considered a modifiable risk factor for dementia, but local cohort evidence from Taiwan is limited. This study aims to examine the association between newly diagnosed hearing loss and subsequent dementia among adults aged 50 years or older. We will conduct a retrospective matched cohort study using Taiwan's National Health Insurance data, framed by target trial emulation. Adults with newly diagnosed hearing loss between 2016 and 2018 will form the exposed group, and each will be matched with four individuals without hearing loss by age, sex, and index year; the index date will be aligned for exposed and unexposed individuals to avoid immortal time bias. Participants will be followed until the end of 2023, death, or loss of coverage. Incidence rates per 1,000 person-years will be reported, and adjusted hazard ratios will be estimated using Cox models stratified by matched sets, with Fine–Gray models accounting for the competing risk of death. Sensitivity analyses will include inverse probability of treatment weighting, exclusion of events within the first year, a stricter dementia definition, and E-values. Hearing loss is expected to be associated with a higher risk of dementia, providing local evidence for hearing screening and intervention policies."},"objs":[{"verb":"描述","text":"描述聽損組與對照組之失智症發生率","hyp":"","analysis":"每千人年發生率與 95% CI；Kaplan–Meier 累積發生曲線","crit":"95% CI","sens":"依年齡層與性別分層","exp":"預期聽損組發生率較高；若無差異，可能與診斷碼低估聽損有關。"},{"verb":"檢驗","text":"檢驗聽力損失與失智症風險之關聯","hyp":"H1：調整共變項後，聽損組失智風險較高（HR > 1）；H0：HR = 1。","analysis":"Cox 比例風險模型；Fine–Gray 競爭風險模型；IPTW 次要分析","crit":"α = .05（雙尾）；報調整後 HR 與 95% CI；SMD < 0.1","sens":"排除 index 後 1 年內事件；嚴格失智定義；E-value","exp":"預期 HR 約 1.1–1.4；若敏感度分析方向一致，結論較穩健。"},{"verb":"探討","text":"探討性別與年齡層是否修飾聽損與失智之關聯","hyp":"","analysis":"加入交互作用項之 Cox 模型（探索性）","crit":"交互作用 p < .10 作為探索性線索","sens":"分層分析","exp":"預期年齡較輕者相對風險較高；結果僅供假設形成。"}],"vars":[{"name":"聽力損失","role":"自變項","concept":"暴露","oper":"新診斷：index 前 1 年內門診 2 次或住院 1 次 H90–H91，且再往前 1 年無此診斷","tool":"門住診檔","scale":"名目","time":"index 日（符合定義之日）","rel":"代碼表"},{"name":"失智症","role":"依變項","concept":"新發生失智","oper":"index 後門診 2 次或住院 1 次 F01–F03、G30；以首次診斷日為事件日","tool":"門住診檔","scale":"名目（時間至事件）","time":"追蹤至 2023 年底","rel":"代碼表；嚴格定義做敏感度分析"},{"name":"死亡","role":"控制","concept":"競爭風險","oper":"死因檔死亡日期","tool":"死因檔","scale":"名目","time":"追蹤期間","rel":"—"},{"name":"Charlson 共病指數","role":"控制","concept":"共病負擔","oper":"index 前一年診斷計分","tool":"門住診檔","scale":"比率","time":"index 前一年","rel":"Charlson 等人（1987）"},{"name":"高血壓、糖尿病、腦中風、憂鬱症","role":"控制","concept":"失智相關共病","oper":"index 前一年診斷（是／否）","tool":"門住診檔","scale":"名目","time":"index 前一年","rel":"代碼表"},{"name":"年齡、性別、投保薪資、都市化","role":"控制","concept":"人口與社經","oper":"承保檔資料","tool":"承保檔","scale":"比率／名目","time":"index 日","rel":"—"}],"bias":[{"name":"不死時間偏誤","why":"若暴露組 index 定在首次診斷日、但需等第 2 次門診才確認暴露，兩次之間的時間會被錯算為暴露期","fix":"index 日定為符合暴露定義之日；對照組使用同一日且當日須存活、無失智"},{"name":"偵測偏差","why":"聽損者就醫較多，較易被診斷失智","fix":"調整門診次數；嚴格失智定義做敏感度分析"},{"name":"反向因果","why":"失智前驅期可能先出現聽力抱怨","fix":"排除 index 後 1 年內事件做敏感度分析"},{"name":"未測量干擾","why":"缺教育程度、實際聽力程度","fix":"以社經代理變項調整；計算 E-value"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":2},{"t":"資料申請（第 2 月送件）","s":2,"e":4},{"t":"世代建立與代碼定義","s":5,"e":6},{"t":"主要分析與敏感度分析","s":7,"e":9},{"t":"結果審查與帶出","s":9,"e":9},{"t":"論文撰寫","s":9,"e":11},{"t":"緩衝（申請延誤、補分析）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"資料申請延誤","trig":"第 4 月仍未核准","when":"M4","plan":"先以公開之健保抽樣資料文件建立程式；使用緩衝月"},{"r":"比例風險假設不成立","trig":"殘差檢定顯著","when":"M7","plan":"分段時間或加入時間交互作用"},{"r":"結果帶出審查補件","trig":"中心要求修正小格數","when":"M9","plan":"事先依規定遮蔽小格數並合併類別"},{"r":"配對對照不足","trig":"高齡層找不到 4 位對照","when":"M5","plan":"允許 1:1–1:4 不等比例配對，分析時以配對組分層"}],"kpi":[{"name":"調整後 HR（成果指標）","calc":"Cox 模型主要分析結果與 95% CI","base":"—","goal":"第 9 月完成"},{"name":"完成敏感度分析項數（產出指標）","calc":"完成並帶出之敏感度分析數","base":"0","goal":"至少 3 項"}],"ss":{}}},"EA":{"label":"E→A 先訪談需求再開發：救護到院電子交接單","grp":1,"data":{"meta":{"type":"A","type2":"E 質性研究"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"救護技術員到院交接時間短、急診同時處理多件事，口頭交接常漏掉生命徵象變化與到院前處置。","s1_2":"北部某醫學中心急診護理師與轄區消防局救護技術員。","s1_3":"第一階段：需求訪談；第二階段：依需求開發之行動版電子交接單。","s1_4":"第一階段：需求主題；第二階段：任務完成率、交接項目完整率、SUS。","s1_5":"救護與急診交接有哪些資訊需求？依此開發的電子交接單是否好用？","s1_6":"E→A：先以質性訪談找出需求（E），再以設計科學研究法開發並評估系統（A）。","s1_7":"醫院急診部與消防局同意；訪談與測試均取得書面同意。","s1_8":"12 個月：訪談 3 個月、開發與迭代 4 個月、總結性評估 2 個月，保留兩個月緩衝。","s1_9":"產出交接資訊需求架構與經評估的電子交接單雛型。","m1_scene":"救護車到院時，救護技術員要在短短幾分鐘內，把病人狀況、到院前生命徵象變化、已給予的處置與藥物、現場發現與家屬聯絡資訊交給急診護理師；此時急診往往同時有多位病人需要處理，接收者一邊聽一邊忙著接監視器、抽血。交接一結束，救護車就要返隊待命，若有遺漏，事後很難再補問。","m1_gap":"現行以口頭交接為主，紙本救護紀錄表字跡與格式不一，常在病人安置後才送達；交接重點容易遺漏，例如到院前最低血壓、給藥時間或是否已聯絡家屬。醫院端與消防端各自設計表單，項目與順序不同，交接工具多以醫院需求設計，未納入救護技術員在車上記錄、到院後短時間口述的工作情境，導致「表單有、卻沒人照著用」。","m1_new":"交接溝通不良是醫療不良事件的重要成因之一（The Joint Commission, 2017）。Riesenberg 等人（2009）回顧交接口訣文獻，指出結構化交接工具可能改善交接完整性，但多數工具缺乏使用者參與設計與評估。設計科學研究法強調以實際問題為起點開發並評估人工物（Hevner et al., 2004），而探索性序列混合方法以質性研究先界定需求、再據以發展工具（Creswell & Plano Clark, 2018），適合用於尚未釐清使用者需求的工具開發。","m1_time":"轄區消防局正推動救護紀錄電子化，預計 2027 年全面使用平板記錄；醫院急診部也計畫更新交接流程與資訊系統介接。兩端都需要一個雙方共同認可、可在平板上完成並傳送至急診的交接工具，此時介入設計可直接影響系統規格。","m1_stmt":"因此，本研究擬先以質性訪談探索救護技術員與急診護理師對到院交接之資訊需求，再依需求以設計科學研究法開發並評估電子交接單。","m2_pico":"第一階段 PICo｜P：救護技術員與急診護理師｜I：到院交接之資訊需求｜Co：急診與救護交接情境。第二階段｜P：同上｜I：電子交接單｜C：現行口頭與紙本交接｜O：任務完成率、交接項目完整率、SUS","m2_search":"PubMed：（\"Patient Handoff\"[Mesh] OR handover*[tiab] OR handoff*[tiab]）AND（\"Emergency Medical Services\"[Mesh] OR paramedic*[tiab] OR ambulance[tiab]）AND（\"Emergency Service, Hospital\"[Mesh] OR \"emergency department\"[tiab]）\n華藝：（交班 OR 交接）AND（救護 OR 到院前）AND（急診）\n限制：2010 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、結構化交接。Riesenberg 等人（2009）整理交接口訣，發現 SBAR 等結構化工具常被採用，但以結果評估其成效的研究有限。對本研究的意義：工具內容要由使用者需求決定，不只套用口訣。\n二、需求探索。描述性主題分析適合整理使用者經驗與需求（Braun & Clarke, 2006），訪談約 9–17 人常可達飽和（Hennink & Kaiser, 2022），報告依 COREQ（Tong et al., 2007）。\n三、系統開發與評估。設計科學研究法的六步驟（Peffers et al., 2007）以需求為起點，形成性評估以啟發式評估找出問題（Nielsen, 1993），總結性評估以 SUS 測量可用性（Brooke, 1996；Bangor et al., 2008）。兩階段的銜接方式依探索性序列設計（Creswell & Plano Clark, 2018）。","m2_known":"結構化交接工具已被廣泛使用（Riesenberg et al., 2009），且已有成熟的需求分析與系統評估方法（Braun & Clarke, 2006；Peffers et al., 2007）。","m2_unknown":"然而，同時納入救護端與急診端觀點、由需求分析推導功能，並經形成性與總結性可用性評估的到院交接工具，在國內仍缺乏完整的開發與評估紀錄；既有結構化口訣多為院內交班設計，未必符合到院交接的時間壓力。","m2_worth":"此缺口使醫院與消防局各自設計工具、難以銜接，甚至造成重複記錄；本研究以兩階段研究產出雙方共同認可、經可用性評估之工具，並保留需求到功能的對應紀錄，供系統介接時參考。","m2_theory":"以探索性序列設計（Creswell & Plano Clark, 2018）銜接兩階段：第一階段主題分析之需求清單，作為第二階段設計科學研究法（Peffers et al., 2007）之設計輸入。","m2_orig":"本計畫同時訪談救護與急診兩端，並將需求主題直接轉為系統功能與評估任務，完整記錄「需求 → 設計 → 評估」的對應。","m3_rq":"救護與急診交接有哪些資訊需求？依此開發之電子交接單可用性如何？","m3_terms":"到院交接：救護技術員將病人移交給急診醫護人員時之資訊傳遞。\n交接項目完整率：模擬情境中，應交接之 12 項關鍵資訊有出現在交接單上的比例。\n可用性：以任務完成率、操作時間與 SUS 測量（ISO 9241-11）。","m3_scope":"研究範圍為北部某醫學中心急診部與轄區消防局之救護技術員與急診護理師，研究期間 12 個月。第一階段描述交接資訊需求；第二階段開發電子交接單並於模擬情境評估可用性與交接項目完整率。本研究不在真實交接中使用工具，不評估對病人結果或交接時間之成效（可接續 C 型），亦不處理與消防救護系統之正式介接。","m4_frame":"第一階段（E）：以半結構訪談探索交接情境、常見遺漏與期待功能，歸納需求主題。第二階段（A）：需求主題轉為功能清單（MoSCoW），開發雛型，經兩輪形成性評估修正，最後以總結性評估測量任務完成率、交接項目完整率與 SUS。","m5_design":"本研究採探索性序列混合方法設計（E→A）：第一階段為描述性質性研究，第二階段為設計科學研究法之系統開發與評估。","m5_reject":"不直接開發系統，因未了解救護端需求，工具可能只符合醫院端；不只做訪談，因需求若未轉為工具並評估，無法回答工具是否可用。","m5_site":"研究場域為北部某醫學中心急診部（年救護車到院約 1.5 萬人次）與轄區消防局（救護分隊 6 隊），兩單位主管均已書面同意協助招募與提供模擬教室（附錄二）。第一階段：救護技術員與急診護理師各 6–8 人；第二階段：形成性評估專家 3 位（急診醫師 1、急救教育 1、人因工程 1）與每輪使用者 5 人，總結性評估 16 人（兩職類各 8 人）。","m5_incl":"納入：救護技術員（中級以上、年資 1 年以上）或急診護理師（年資 1 年以上）。排除：參與第一階段者不參加總結性評估（避免學習效應）；研究期間預計離職者。","m5_sample":"第一階段以飽和判定人數，預估兩職類各 6–8 人，連續 2 份訪談無新代碼即停止（Hennink & Kaiser, 2022）。第二階段形成性評估每輪 5 人、共 2 輪；總結性評估 16 人，屬描述性評估，不做推論檢定。","m5_tool":"一、訪談大綱：交接流程、曾遺漏的資訊、理想的交接工具（附錄三）。\n二、任務腳本：3 個標準化模擬個案，各自完成電子交接單並交接。\n三、交接項目完整率：12 項關鍵資訊清單，由 2 位評分者獨立評分。\n四、SUS 中文版 10 題（Brooke, 1996）。\n五、啟發式評估：Nielsen 十原則，嚴重度 0–4 分。","m5_flow":"一、第 1–2 月：IRB 送審；核准後進行第一階段訪談（每人 40–60 分鐘，錄音轉逐字稿）。\n二、第 3 月：主題分析完成需求清單，與 2 位受訪者確認。\n三、第 4–7 月：設計與開發；第 5 月、第 7 月各一輪形成性評估。\n四、第 8–9 月：總結性評估，於模擬教室以 3 個標準化個案測試。\n五、所有資料以研究編號儲存；模擬個案不使用真實病人資料。","m5_innov":"雙端使用者共同參與需求探索，並以模擬個案客觀測量交接完整率，而非只看滿意度。","m6_common":"第二階段以描述統計呈現任務完成率、操作時間（中位數與四分位距）、交接項目完整率與 SUS（平均與標準差）；評分者一致性以 ICC 呈現。兩輪形成性評估問題數與嚴重度以表格比較。分析以 R（版本寫明）執行。","m6_qual":"第一階段以 Braun 與 Clarke（2006）主題分析：逐行開放編碼，前 3 份兩人獨立編碼後建代碼簿，歸納子主題與主題；以飽和紀錄表記錄新代碼。需求主題轉為功能清單並以 MoSCoW 排序。","m7_irb":"本研究將送〔醫院〕人體研究倫理審查委員會審查，屬成年工作人員之訪談與模擬測試、最小風險，預計申請簡易審查，兩階段一併送審，以審查會認定為準；第二階段工具或流程若有重大變更，將先提出變更案。","m7_consent":"兩階段參與者均簽署書面同意書；第二階段另行說明測試內容（模擬個案、錄影範圍）並再次簽署。招募由研究者直接聯繫，不經直屬主管；消防局人員之參與時間由研究者配合勤務排定，不影響其勤務考核。","m7_risk":"屬最小風險；訪談可能談及過去不良交接經驗或病人不良結果，可隨時暫停、跳過或退出，受訪內容不提供給雙方主管。模擬測試不涉及真實病人，螢幕錄影只拍攝平板畫面，不拍攝參與者臉部。","m7_deid":"逐字稿去除姓名、單位與案件資訊，以代號呈現；錄音於逐字稿核對後刪除。模擬測試資料以研究編號儲存，不含真實病人資料。研究資料存於加密裝置，僅研究團隊可存取，保存至研究結束後 3 年，期滿以不可回復方式刪除。","m7_coi":"研究者與任何系統廠商無財務關係。生成式 AI 僅用於程式除錯，不輸入訪談內容。","m8_feas":"場域：急診部與消防局均已書面同意，並提供模擬教室與 2 台平板（附錄二）。技術：研究者具網頁開發經驗，雛型以響應式網頁開發，可於平板與手機運作。樣本：急診護理師約 90 人、轄區救護技術員約 70 人，足以招募兩階段且不重複之參與者。時間：訪談配合輪班並提供線上訪談選項，保留兩個月緩衝。","m9_acad":"提出救護與急診到院交接之需求架構，並完整記錄需求主題 → 功能 → 設計 → 評估問題 → 修正之對應，示範探索性序列混合方法在健康資訊工具開發中的應用。","m9_prac":"產出經評估之電子交接單雛型與欄位規格，供醫院與消防局試辦及系統介接參考；可接續於真實交接中評估交接完整率與時間之成效研究（C 型）。","m9_limd":"第二階段為模擬情境，模擬個案無法完全重現真實到院的時間壓力與干擾；單一醫院與消防局，推論至其他地區需保守；總結性評估 16 人屬描述性，不做推論檢定。","m9_lime":"救護人員輪班與出勤不易安排訪談，將配合勤務排程並提供線上訪談；第一階段受訪者若參與形成性評估可能帶入預期，總結性評估將排除第一階段參與者。","m9_train":"參與之碩士生將習得質性訪談、主題分析、系統雛型開發與可用性測試（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇，並產出電子交接單雛型（教學示意）。","m9_nation":"回應緊急醫療救護品質之需求，促進到院前與院內資訊銜接。","t_iv":"電子交接單","t_pop":"救護與急診人員","t_out":"需求與可用性","t_des":"混合方法研究","m10_title":"救護與急診到院交接之需求探索與電子交接單開發：探索性序列混合方法研究","m10_title_en":"Exploring Handover Needs between Emergency Medical Services and Emergency Departments and Developing an Electronic Handover Form: An Exploratory Sequential Mixed-Methods Study","m10_kw":"交接、緊急醫療救護、急診、可用性、混合方法","m10_abs":"救護與急診到院交接時間短，口頭交接常遺漏生命徵象變化與到院前處置，而現行工具多未納入救護端需求。本研究旨在探索交接之資訊需求，並依需求開發與評估電子交接單。本研究採探索性序列混合方法設計：第一階段以半結構訪談救護技術員與急診護理師各 6–8 人，以主題分析歸納需求並以 MoSCoW 排序；第二階段以設計科學研究法開發電子交接單，經兩輪形成性評估（專家啟發式評估與使用者放聲思考）修正，再由 16 位未參與第一階段之使用者以 3 個標準化模擬個案進行總結性評估，以任務完成率、操作時間、交接項目完整率與 SUS 描述可用性。預期產出交接需求架構與可試辦之電子交接單。","m10_refs":"Bangor, A., Kortum, P. T., & Miller, J. T. (2008). An empirical evaluation of the System Usability Scale. International Journal of Human–Computer Interaction, 24(6), 574–594.\nBraun, V., & Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77–101.\nBrooke, J. (1996). SUS: A quick and dirty usability scale. In P. W. Jordan et al. (Eds.), Usability evaluation in industry (pp. 189–194). Taylor & Francis.\nCreswell, J. W., & Plano Clark, V. L. (2018). Designing and conducting mixed methods research (3rd ed.). Sage.\nHennink, M., & Kaiser, B. N. (2022). Sample sizes for saturation in qualitative research: A systematic review of empirical tests. Social Science & Medicine, 292, 114523.\nHevner, A. R., March, S. T., Park, J., & Ram, S. (2004). Design science in information systems research. MIS Quarterly, 28(1), 75–105.\nNielsen, J. (1993). Usability engineering. Academic Press.\nPeffers, K., Tuunanen, T., Rothenberger, M. A., & Chatterjee, S. (2007). A design science research methodology for information systems research. Journal of Management Information Systems, 24(3), 45–77.\nRiesenberg, L. A., Leitzsch, J., & Little, B. W. (2009). Systematic review of handoff mnemonics literature. American Journal of Medical Quality, 24(3), 196–204.\nThe Joint Commission. (2017). Inadequate hand-off communication (Sentinel Event Alert No. 58). The Joint Commission.\nTong, A., Sainsbury, P., & Craig, J. (2007). Consolidated criteria for reporting qualitative research (COREQ): A 32-item checklist for interviews and focus groups. International Journal for Quality in Health Care, 19(6), 349–357.","irb_inst":"〔醫院名稱〕急診部、〔縣市〕消防局","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：以訪談、模擬操作與問卷蒐集資料，不涉及真實病人，屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"第一階段：救護技術員與急診護理師各 6–8 人；第二階段：專家 3 位、形成性評估每輪 5 人、總結性評估 16 人。","irb_recruit":"由研究生在單位公告欄張貼招募說明，有意願者自行聯絡；單位主管不參與招募與同意過程，是否參與不影響考核。","irb_vuln":"參與者為受雇者：主管不知悉誰參與，訪談內容不回饋給單位；不納入易受傷害族群。","irb_task":"第一階段：一次訪談，約 40–60 分鐘，聊聊交接的經驗（錄音）。第二階段：在模擬教室用電子交接單完成 3 個模擬交接，約 40 分鐘，並填一份 10 題問卷。","irb_withdraw":"可隨時以口頭或書面告知研究者撤回，無須說明理由；撤回後刪除您的錄音與資料。","irb_benefit":"無直接利益；為感謝撥冗，每階段致贈〔　〕元禮券。","irb_harm":"屬最小風險；若談及不愉快經驗感到不適，可隨時暫停或退出。對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為訪談錄音與逐字稿、測試紀錄與問卷。錄音於逐字稿核對完成後刪除；去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"否。所有參與者簽署書面同意書。","irb_ad":"【到院交接經驗訪談／電子交接單試用招募】想邀請救護技術員與急診護理師，分享到院交接的經驗，或試用新的電子交接單。訪談約 1 小時；試用約 40 分鐘。聯絡人：〔研究生姓名〕〔電話〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責訪談、系統開發與可用性測試）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"patient handoff; emergency medical services; requirements analysis; usability; mixed methods","m10_abs_en":"Handovers from emergency medical technicians (EMTs) to emergency department (ED) nurses occur under time pressure, and verbal handovers often omit changes in vital signs and prehospital treatments, while existing tools rarely reflect the needs of prehospital staff. This study aims to explore the information needs for ambulance-to-ED handovers and to develop and evaluate an electronic handover form based on those needs. An exploratory sequential mixed methods design will be used. In phase one, semi-structured interviews will be conducted with six to eight EMTs and six to eight ED nurses, and requirements will be identified through thematic analysis and prioritized using the MoSCoW method. In phase two, an electronic handover form will be developed using design science research and refined through two rounds of formative evaluation, including heuristic evaluation by experts and think-aloud testing with users. A summative evaluation with 16 users who did not take part in phase one will use three standardized simulated cases to describe task completion rate, time on task, handover item completeness rated by two independent raters, and System Usability Scale scores. The study is expected to produce a needs framework for prehospital handovers and an electronic handover form ready for pilot implementation."},"objs":[{"verb":"探討","text":"探討救護技術員與急診護理師對到院交接之資訊需求","hyp":"","analysis":"描述性主題分析（Braun & Clarke, 2006），需求以 MoSCoW 排序","crit":"連續 2 份無新代碼視為飽和；需求清單經 2 位受訪者確認","sens":"比較兩職類主題差異","exp":"預期歸納出生命徵象變化、到院前處置、聯絡資訊等需求，以及兩端對交接時機的不同期待。"},{"verb":"開發","text":"依需求開發電子交接單並經兩輪形成性評估修正","hyp":"","analysis":"啟發式評估與放聲思考問題清單，依嚴重度 0–4 排序；比較兩輪問題數","crit":"第二輪無嚴重度 3–4 之問題","sens":"回歸測試 3 個模擬個案","exp":"預期第一輪找出主要問題，第二輪嚴重問題明顯減少。"},{"verb":"描述","text":"描述電子交接單之可用性與交接項目完整率","hyp":"","analysis":"描述統計：任務完成率、操作時間、交接項目完整率、SUS；評分者一致性 ICC","crit":"SUS 以 68 分為平均參考值（描述性）；ICC ≥ .75","sens":"依職類分別呈現","exp":"預期多數使用者能完成任務、完整率高；若某項資訊常漏填，作為後續修正依據。"}],"vars":[{"name":"需求主題","role":"探索","concept":"交接資訊需求","oper":"主題分析歸納之主題與子主題","tool":"訪談逐字稿","scale":"名目","time":"第一階段","rel":"COREQ；雙人編碼"},{"name":"任務完成率","role":"依變項","concept":"有效性","oper":"3 個模擬交接中無協助完成之比例","tool":"觀察紀錄","scale":"比率","time":"總結性評估","rel":"標準化腳本"},{"name":"交接項目完整率","role":"依變項","concept":"交接品質","oper":"12 項關鍵資訊中有記錄之比例","tool":"交接單評分","scale":"比率","time":"總結性評估","rel":"2 位評分者；ICC"},{"name":"SUS 分數","role":"依變項","concept":"主觀可用性","oper":"SUS 10 題換算 0–100","tool":"問卷","scale":"等距","time":"總結性評估","rel":"Brooke（1996）"},{"name":"職類、年資","role":"控制","concept":"使用者背景","oper":"救護／急診；年資（年）","tool":"基本資料表","scale":"名目／比率","time":"測試前","rel":"—"}],"bias":[{"name":"研究者前理解","why":"研究者具急診背景，可能預設需求","fix":"撰寫反思日誌；雙人編碼並討論"},{"name":"學習效應","why":"第一階段受訪者熟悉工具構想","fix":"總結性評估招募未參與第一階段者"},{"name":"期望偏差","why":"使用者可能因禮貌而高評","fix":"開發者不擔任測試主持人；強調要找問題"},{"name":"模擬情境偏差","why":"模擬與真實交接壓力不同","fix":"以標準化個案控制難度；限制中說明"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":1},{"t":"第一階段訪談","s":2,"e":3},{"t":"主題分析與需求清單","s":3,"e":3},{"t":"設計、開發與兩輪形成性評估","s":4,"e":7},{"t":"總結性評估（模擬）","s":8,"e":9},{"t":"資料分析與撰寫","s":9,"e":10},{"t":"緩衝（訪談排程、開發延誤）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"救護人員訪談排程困難","trig":"第 2 月完成少於 3 人","when":"M2","plan":"提供線上訪談；配合勤務排程"},{"r":"開發落後","trig":"第 6 月核心功能未完成","when":"M6","plan":"刪減 Could 等級功能；使用緩衝月"},{"r":"總結性評估招募不足","trig":"第 8 月少於 12 人","when":"M8","plan":"延長招募並增加場次"},{"r":"兩職類需求衝突","trig":"同一欄位雙方對必填與順序意見相反","when":"M3","plan":"列為形成性評估重點，以模擬任務測試兩種版本並記錄決策理由"}],"kpi":[{"name":"交接項目完整率（成果指標）","calc":"12 項關鍵資訊有記錄之比例，總結性評估計算","base":"第一輪形成性評估結果","goal":"較第一輪提高"},{"name":"完成總結性評估人數（產出指標）","calc":"完成 3 個模擬交接與 SUS 人數","base":"0","goal":"第 9 月前 16 人"}],"ss":{}}},"AC":{"label":"A→C 先開發再證明有效：AI 回饋 CPR 訓練","grp":1,"data":{"meta":{"type":"C","type2":"A 系統開發與評估"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"護理學生 CPR 訓練後按壓品質常不達標，教師一人難以同時即時糾正多位學生。","s1_2":"北部某科技大學護理系二年級學生；模擬訓練教室。","s1_3":"第一階段：開發 AI 即時回饋 CPR 訓練系統；第二階段：以隨機分派比較有無即時回饋。","s1_4":"第一階段：SUS、任務完成率；第二階段：按壓深度與速率皆達標比例（主要）。","s1_5":"開發之 AI 即時回饋系統是否好用？使用後按壓品質是否優於教師指導？","s1_6":"A→C：設計科學研究法開發系統，再以隨機對照試驗評估成效。","s1_7":"護理系同意於選修模擬課程進行；學生書面同意，參與與否不影響成績。","s1_8":"12 個月：開發與迭代 5 個月、試驗 3 個月、分析與撰寫，保留兩個月緩衝。","s1_9":"提供可推廣之 CPR 即時回饋訓練工具與成效證據。","m1_scene":"高品質心肺復甦術（CPR）是心跳停止病人存活的關鍵，美國心臟學會指引建議成人按壓深度 5–6 公分、速率每分鐘 100–120 次，並讓胸部完全回彈、盡量減少中斷（Panchal et al., 2020）。護理學生是未來院內急救的第一線人力，但完成 CPR 課程後，按壓品質常無法持續達標，數週後技能即明顯衰退。","m1_gap":"現行訓練由教師目測糾正，一位教師同時面對 8–10 位學生，難以即時、客觀地指出每次按壓的深度與速率問題；學生多只在考試時才知道自己不達標。市售回饋假人可提供客觀數據，但價格高，學校數量有限，課堂上多數學生仍在無回饋的假人上練習。","m1_new":"Nicolau 等人（2024）的系統性回顧與統合分析顯示，以矯正回饋裝置訓練，按壓品質整體優於無回饋訓練，但證據確定性低、優勢隨時間縮小。以手機鏡頭與姿勢辨識提供即時回饋的方式成本低、可同時讓多組學生使用，但手機鏡頭判斷按壓深度的準確度與使用流程尚未經驗證；在可用性與準確度未確認前，直接評估成效將無法解讀結果。","m1_time":"本校護理系正規劃更新模擬教學設備，需要低成本且可同時讓多組學生使用的回饋工具；本研究可在採購決策前（12 個月內）提供系統準確度、可用性與成效證據，避免購置後才發現不適用。","m1_stmt":"因此，本研究擬先以設計科學研究法開發並評估 AI 即時回饋 CPR 訓練系統，再以隨機對照試驗比較其與教師指導對護理學生按壓品質之成效。","m2_pico":"第一階段｜P：護理學生與 CPR 教師｜I：AI 即時回饋系統｜O：SUS、任務完成率、回饋準確度。第二階段｜P：護理系二年級學生｜I：AI 即時回饋訓練｜C：教師指導訓練｜O：按壓深度與速率皆達標比例（主要）、中斷時間（次要）","m2_search":"PubMed：（\"Cardiopulmonary Resuscitation\"[Mesh] OR CPR[tiab]）AND（feedback[tiab] OR \"real-time\"[tiab]）AND（\"Students, Nursing\"[Mesh] OR training[tiab] OR \"Simulation Training\"[Mesh]）\n華藝：（心肺復甦術 OR CPR）AND（回饋）AND（訓練 OR 學生）\n限制：2010 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、高品質 CPR 的標準。美國心臟學會 2020 年指引明定成人按壓深度至少 5 公分、速率每分鐘 100–120 次（Panchal et al., 2020）。對本研究的意義：以這兩項作為主要結果的判定標準。\n二、回饋裝置的證據。Nicolau 等人（2024）統合訓練研究，發現使用矯正回饋裝置者按壓表現較佳，但多數試驗偏誤風險偏高、3 個月後優勢縮小。對本研究的意義：除訓練後立即測試，也要做保留測試，並嚴謹控制偏誤。\n三、開發與評估方法。第一階段依設計科學研究法（Peffers et al., 2007），以啟發式評估（Nielsen, 1993）與 SUS（Brooke, 1996）評估；第二階段依 CONSORT 2010 報告隨機試驗（Schulz et al., 2010），介入依 TIDieR 描述（Hoffmann et al., 2014）。","m2_known":"既有研究已顯示矯正回饋裝置可改善訓練中的按壓表現（Nicolau et al., 2024），且已有明確的品質標準（Panchal et al., 2020）。","m2_unknown":"然而，以手機鏡頭姿勢辨識提供即時回饋的低成本系統，其按壓深度與速率判定之準確度、學生與教師之可用性，以及相較常規教師指導之成效與 4 週後之技能保留，仍缺乏證據。","m2_worth":"此缺口使學校在「購買回饋假人」與「採用手機回饋系統」之間缺乏判斷依據；本研究以兩階段研究同時回答「準不準、好不好用」與「有沒有效、效果能維持多久」。","m2_theory":"第一階段依設計科學研究法（Peffers et al., 2007）；第二階段以回饋促進技能學習之觀點，預期即時、具體的回饋能讓學生立即修正動作，提升按壓品質。","m2_orig":"本計畫將低成本手機姿勢辨識回饋系統從開發一路評估到隨機試驗，並以回饋假人感測數據作為客觀結果。","m3_rq":"AI 即時回饋 CPR 訓練系統的可用性如何？其按壓品質成效是否優於教師指導？","m3_terms":"按壓品質達標：2 分鐘測試中，按壓深度 5–6 公分且速率每分鐘 100–120 次之按壓次數比例，由回饋假人感測器記錄（Panchal et al., 2020）。\nAI 即時回饋：系統以手機鏡頭辨識按壓動作，即時以聲音與畫面提示深度與速率。\n可用性：以 SUS 與任務完成率測量。","m3_scope":"研究範圍為北部某科技大學護理系學生與 CPR 教師之模擬訓練，研究期間 12 個月。第一階段評估系統準確度與可用性；第二階段評估訓練後與 4 週後之按壓品質。本研究不評估臨床急救表現或病人結果，亦不比較不同品牌之回饋假人。","m4_frame":"第一階段（A）：需求與設計 → 雛型 → 兩輪形成性評估 → 回饋準確度與 SUS。第二階段（C）：自變項為組別（AI 回饋／教師指導），主要依變項為訓練後 2 分鐘測試之按壓達標比例，次要依變項為中斷時間；共變項為前測達標比例。","m5_design":"本研究採兩階段設計（A→C）：第一階段以設計科學研究法開發與評估系統；第二階段以平行兩組隨機對照試驗（1:1）評估成效，依 CONSORT 2010 報告。","m5_reject":"不直接進行隨機試驗，因系統可用性與回饋準確度未確認前，成效結果無法解讀；第二階段不採單組前後測，因練習本身就會改善表現，需要對照組；不採以班級為單位之準實驗，因同一系所可個別隨機分派、且兩組於不同時段訓練可降低污染，隨機分派能提供較強的因果推論。","m5_site":"研究場域為北部某科技大學護理系模擬教室，系主任已書面同意並提供模擬教室與回饋假人 4 台（附錄二）。第一階段：CPR 教師 3 位（需求訪談與啟發式評估）、每輪學生 5 人（放聲思考）；第二階段：護理系二年級學生 62 人。第一階段參與者不參加第二階段。","m5_incl":"納入：護理系二年級、已完成基本救命術課程之學生。排除：已取得 CPR 指導員資格者；有手腕或背部受傷無法按壓者。第一階段參與者不參加第二階段。","m5_sample":"第二階段以兩組比較估算：效果量 d = 0.8（回饋裝置研究多報告明顯優勢，Nicolau et al., 2024；惟證據確定性低）、α = .05 雙尾、檢定力 .80，每組 26 人；預估流失 15%，每組招募 31 人，共 62 人（以 G*Power 3.1 核對；Faul et al., 2007）。若改以 d = 0.6 估算需每組 45 人，屆時將擴大招募至三年級學生。","m5_tool":"一、回饋假人感測器：記錄按壓深度、速率與中斷時間（作為客觀結果與系統準確度比對標準）。\n二、AI 即時回饋系統：手機鏡頭姿勢辨識，聲音與畫面提示。\n三、SUS 中文版 10 題（Brooke, 1996）。\n四、啟發式評估：Nielsen 十原則，嚴重度 0–4。\n五、基本資料：性別、身高體重、過去 CPR 經驗。","m5_flow":"一、第 1–2 月：IRB 送審；需求訪談 3 位教師。\n二、第 2–5 月：開發雛型；第 3、5 月各一輪形成性評估，同時以回饋假人比對系統回饋準確度。\n三、第 6 月：招募第二階段學生，前測 2 分鐘按壓後，以電腦產生之區組隨機（區組大小 4，依性別分層）1:1 分派；分派序列由非研究團隊之助理產生並以密封不透光信封保管（分配隱匿）。\n四、第 6–7 月：兩組各接受 2 次、每次 30 分鐘訓練，於不同時段進行以避免污染。\n五、第 7–8 月：訓練後立即測試與 4 週後保留測試；結果由回饋假人感測器客觀記錄，操作測試之評估者不知分組。","m5_innov":"以低成本手機姿勢辨識取代昂貴回饋假人，並先驗證準確度與可用性再進行隨機試驗，避免把「不好用」誤判為「沒效果」。","m6_common":"顯著水準 α = .05（雙尾）。第一階段以描述統計呈現 SUS 與任務完成率，回饋準確度以 Bland–Altman 圖與 ICC 比較系統與回饋假人。第二階段以 ANCOVA 比較訓練後達標比例（前測為共變項），以意圖治療分析為主；報效果量與 95% CI。分析以 R（版本寫明）執行。","m7_irb":"本研究將送〔大學〕研究倫理審查委員會審查，屬學生之教育訓練研究、最小風險，預計申請簡易審查，兩階段一併送審，以審查會認定為準；第二階段試驗將於收案前登錄 ClinicalTrials.gov。","m7_consent":"所有參與者簽署書面同意書；說明會由非授課之研究人員主持，強調參與與否不影響成績，授課教師不知悉誰參與。第二階段研究結束後，教師指導組學生可免費使用 AI 回饋系統練習。","m7_risk":"屬最小風險；連續按壓可能疲勞或手腕不適，每次測試僅 2 分鐘，可隨時停止休息，有手腕或背部受傷者排除。手機鏡頭只拍攝手部與上身動作，不錄臉部，影像即時處理不儲存。","m7_deid":"影像只在手機即時處理，不儲存；感測數據與問卷以研究編號儲存，對照表加密保管，保存至研究結束後 3 年後刪除。","m7_coi":"研究者與任何回饋假人或軟體廠商無財務關係。生成式 AI 僅用於程式除錯，不輸入參與者資料。","m8_feas":"場域：護理系已同意並提供模擬教室與回饋假人 4 台（附錄二）。技術：研究者具姿勢辨識程式經驗，前導作業已完成速率判定之雛型。樣本：二年級學生約 120 人，前一屆類似研究參與率約 60%，招募 62 人可行；若改以 d = 0.6 需每組 45 人，可擴大至三年級學生。時間：開發與迭代 4 個月，保留兩個月緩衝。","m9_acad":"提供低成本手機姿勢辨識 CPR 回饋系統之準確度、可用性與隨機試驗成效證據，並示範「先證明好用、再證明有效」之 A→C 兩階段設計。","m9_prac":"供護理系決定是否以此系統取代或補充回饋假人，並依 4 週保留測試結果規劃複訓頻率；系統可推廣至其他醫護科系與社區 CPR 教學。","m9_limd":"單一學校、模擬情境，未評估臨床急救表現；4 週保留測試期間較短；兩組均知道自己接受何種訓練（無法對參與者盲性），可能產生期望效應。","m9_lime":"學生可能在課後自行練習造成干擾；將於保留測試時詢問練習次數並作為敏感度分析；手機架設角度與光線可能影響辨識準確度，將標準化架設位置並記錄。","m9_train":"參與之碩士生將習得系統開發、可用性測試、隨機對照試驗設計與 ANCOVA 分析（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇，並產出 CPR 回饋系統雛型（教學示意）。","m9_nation":"提升急救教育品質，以低成本工具擴大高品質 CPR 訓練之可近性。","t_iv":"AI 即時回饋 CPR 訓練系統","t_pop":"護理學生","t_out":"按壓品質","t_des":"系統開發與隨機對照試驗","m10_title":"AI 即時回饋 CPR 訓練系統之開發與成效評估：設計科學研究與隨機對照試驗","m10_title_en":"Development and Effectiveness of an AI-Based Real-Time Feedback System for CPR Training: Design Science Research and a Randomized Controlled Trial","m10_kw":"心肺復甦術、即時回饋、護理教育、隨機對照試驗、可用性","m10_abs":"護理學生 CPR 訓練後按壓品質常不達標，教師難以即時糾正多位學生，回饋假人又價格高、數量有限。本研究旨在開發 AI 即時回饋 CPR 訓練系統，並評估其成效。第一階段以設計科學研究法開發以手機鏡頭辨識按壓動作之系統，經兩輪形成性評估修正，並與回饋假人比對深度與速率判定之準確度；第二階段以平行兩組隨機對照試驗，將護理系二年級學生 62 人以區組隨機分為 AI 回饋組與教師指導組，以 ANCOVA 比較訓練後按壓深度與速率皆達標之比例，並以混合模型分析 4 週後之保留。預期系統可用性良好、判定準確，且 AI 回饋組按壓品質優於教師指導組。","m10_refs":"Brooke, J. (1996). SUS: A quick and dirty usability scale. In P. W. Jordan et al. (Eds.), Usability evaluation in industry (pp. 189–194). Taylor & Francis.\nFaul, F., Erdfelder, E., Lang, A.-G., & Buchner, A. (2007). G*Power 3: A flexible statistical power analysis program for the social, behavioral, and biomedical sciences. Behavior Research Methods, 39(2), 175–191.\nHoffmann, T. C., Glasziou, P. P., Boutron, I., Milne, R., Perera, R., Moher, D., et al. (2014). Better reporting of interventions: Template for intervention description and replication (TIDieR) checklist and guide. BMJ, 348, g1687.\nNicolau, A., Jorge, I., Vieira-Marques, P., & Sa-Couto, C. (2024). Influence of training with corrective feedback devices on cardiopulmonary resuscitation skills acquisition and retention: Systematic review and meta-analysis. JMIR Medical Education, 10, e59720.\nNielsen, J. (1993). Usability engineering. Academic Press.\nPanchal, A. R., Bartos, J. A., Cabañas, J. G., Donnino, M. W., Drennan, I. R., Hirsch, K. G., et al. (2020). Part 3: Adult basic and advanced life support: 2020 American Heart Association guidelines for cardiopulmonary resuscitation and emergency cardiovascular care. Circulation, 142(16_suppl_2), S366–S468.\nPeffers, K., Tuunanen, T., Rothenberger, M. A., & Chatterjee, S. (2007). A design science research methodology for information systems research. Journal of Management Information Systems, 24(3), 45–77.\nSchulz, K. F., Altman, D. G., & Moher, D. (2010). CONSORT 2010 statement: Updated guidelines for reporting parallel group randomised trials. BMJ, 340, c332.","irb_inst":"〔大學名稱〕護理系模擬教室","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：於模擬假人上進行訓練與測試，屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"第一階段：CPR 教師 3 位、學生每輪 5 人；第二階段：護理系二年級學生 62 人（兩組各 31 人）。","irb_recruit":"由非授課之研究生於下課時間說明並發放邀請；授課教師不參與招募與同意過程，不知悉誰參與，參與與否不影響成績。","irb_vuln":"參與者為學生，屬可能受師生關係影響之族群：由非授課人員招募；未滿 18 歲者不納入。","irb_task":"第一階段：試用系統並給意見，約 40 分鐘。第二階段：先在假人上按壓 2 分鐘，接著依抽籤分組參加 2 次、每次 30 分鐘的 CPR 練習，練習後與 4 週後各再按壓 2 分鐘。","irb_withdraw":"可隨時口頭告知研究者撤回，無須說明理由；撤回後刪除您的資料。","irb_benefit":"兩組都獲得額外 CPR 練習；研究結束後教師指導組也可使用系統。完成全部測試致贈〔　〕元禮券。","irb_harm":"連續按壓可能疲勞或手腕不適，可隨時停止休息；如有不適，由現場教師協助處理。對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為感測數據、問卷與測試紀錄（不儲存影像），去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"否。所有參與者簽署書面同意書。","irb_ad":"【CPR 新訓練方式研究招募】邀請護理系二年級同學參加 CPR 練習研究，共 2 次練習與 3 次 2 分鐘測試，部分同學會使用 AI 即時回饋系統。參與與否不影響成績。聯絡人：〔研究生姓名〕〔電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責系統開發、可用性測試與試驗執行）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"cardiopulmonary resuscitation; real-time feedback; pose estimation; nursing education; randomized controlled trial","m10_abs_en":"Nursing students often fail to maintain high-quality chest compressions after cardiopulmonary resuscitation (CPR) training, and instructors cannot give real-time corrections to many students at once, while feedback manikins are costly and limited. This study aims to develop an AI-based real-time feedback system for CPR training and to evaluate its effectiveness. In phase one, a system that uses a smartphone camera and pose estimation to provide audio and visual feedback on compression depth and rate will be developed using design science research, refined through two rounds of formative evaluation, and validated against a feedback manikin using Bland–Altman analysis and intraclass correlation. In phase two, a parallel-group randomized controlled trial will allocate 62 second-year nursing students, using block randomization with allocation concealment, to AI feedback training or instructor-led training. The primary outcome is the proportion of compressions meeting both depth and rate targets during a two-minute test after training, analyzed using analysis of covariance adjusted for baseline performance; retention at four weeks will be analyzed with mixed models. The system is expected to be usable and accurate, and the AI feedback group is expected to achieve better compression quality than the instructor-led group."},"objs":[{"verb":"開發","text":"開發 AI 即時回饋 CPR 訓練系統並經兩輪形成性評估修正","hyp":"","analysis":"啟發式評估與放聲思考問題清單；與回饋假人比對深度與速率（Bland–Altman、ICC）","crit":"第二輪無嚴重度 3–4 問題；速率 ICC ≥ .75","sens":"不同體型學生分別比對","exp":"預期系統速率判定準確、深度判定略有誤差；若準確度不足，將調整演算法或改為只回饋速率。"},{"verb":"描述","text":"描述系統之可用性","hyp":"","analysis":"描述統計：SUS 平均與標準差、任務完成率","crit":"SUS 以 68 分為平均參考值（描述性）","sens":"依教師與學生分別呈現","exp":"預期 SUS 達平均以上。"},{"verb":"比較","text":"比較 AI 回饋組與教師指導組訓練後按壓品質達標比例","hyp":"H1：調整前測後，AI 回饋組訓練後達標比例高於教師指導組；H0：兩組無差異。","analysis":"ANCOVA（前測為共變項）；4 週保留測試以混合模型分析組別 × 時間","crit":"α = .05（雙尾）；報調整後平均差與 95% CI","sens":"符合計畫分析；排除課後自行練習 > 2 次者","exp":"預期 AI 回饋組達標比例較高；若 4 週後差異消失，表示需要定期複訓。"}],"vars":[{"name":"組別","role":"自變項","concept":"訓練方式","oper":"AI 回饋組＝1、教師指導組＝0（電腦亂數分派）","tool":"分派表","scale":"名目","time":"前測後","rel":"分配隱匿"},{"name":"按壓達標比例","role":"依變項","concept":"按壓品質","oper":"2 分鐘內深度 5–6 cm 且速率 100–120 次/分之按壓次數比例","tool":"回饋假人感測器","scale":"比率","time":"前測、訓練後、4 週後","rel":"Panchal 等人（2020）"},{"name":"中斷時間","role":"依變項","concept":"按壓連續性","oper":"2 分鐘測試中無按壓之秒數","tool":"回饋假人感測器","scale":"比率","time":"同上","rel":"感測器自動記錄"},{"name":"SUS 分數","role":"依變項","concept":"可用性","oper":"SUS 10 題換算 0–100","tool":"問卷","scale":"等距","time":"第一階段","rel":"Brooke（1996）"},{"name":"身體質量指數","role":"控制","concept":"體型對按壓之影響","oper":"身高體重換算","tool":"基本資料表","scale":"比率","time":"前測","rel":"—"}],"bias":[{"name":"評估者偏差","why":"測試人員知道分組可能影響判讀","fix":"以感測器客觀記錄；評估者不知分組"},{"name":"擴散效應","why":"兩組學生同班，可能互相分享系統","fix":"請參與者不分享；保留測試詢問是否接觸系統"},{"name":"學習效應","why":"第一階段參與者熟悉系統","fix":"第一階段參與者不參加第二階段"},{"name":"流失偏差","why":"保留測試前流失","fix":"意圖治療分析；比較流失者基線"}],"g
