<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>研究計畫書工作台｜研究方法論</title>
<meta name="description" content="研究方法論課程：逐步撰寫碩士論文計畫書、國科會 CM03 或其他計畫——句型、Case Q 範例、樣本數與甘特工具、一頁地圖檢核與 Word 匯出。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231f3a5f'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='600' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>/* 版面：深藍工具列（進度＋快查）＋左側步驟軌＋中間填寫欄＋右側說明欄；沿用 nchsieh.github.io 學院藍主題 */
:root{
  --brand:#1f3a5f; --brand-deep:#142943; --brand-tint:rgba(31,58,95,.07); --on-brand:#fff;
  --accent:#9c7538; --accent-tint:rgba(156,117,56,.13);
  --ink:#1c242e; --muted:#4d5865; --faint:#737f8b; --line:#e2ded4; --line-strong:#c9c3b5;
  --bg:#f7f4ed; --card:#fff; --field:#fffdf8; --bad:#9b2c2c; --bad-tint:rgba(155,44,44,.07); --ok:#1f6b4a; --ok-tint:rgba(31,107,74,.10);
  --bar-ink:#e8eef4; --bar-dim:#b3c3d3;
  --serif:"Noto Serif TC","Noto Serif",Georgia,serif;
  --sans:"Noto Sans TC","Noto Sans","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#7aa7d9; --brand-deep:#0a111c; --brand-tint:rgba(122,167,217,.12); --on-brand:#0b1220;
  --accent:#d4a960; --accent-tint:rgba(212,169,96,.15);
  --ink:#e6edf5; --muted:#a3b1c2; --faint:#7d8b9c; --line:#263243; --line-strong:#3a4859;
  --bg:#0d1420; --card:#131c29; --field:#0f1723; --bad:#f19a9a; --bad-tint:rgba(241,154,154,.09); --ok:#7fd1a8; --ok-tint:rgba(127,209,168,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#7aa7d9; --brand-deep:#0a111c; --brand-tint:rgba(122,167,217,.12); --on-brand:#0b1220;
  --accent:#d4a960; --accent-tint:rgba(212,169,96,.15);
  --ink:#e6edf5; --muted:#a3b1c2; --faint:#7d8b9c; --line:#263243; --line-strong:#3a4859;
  --bg:#0d1420; --card:#131c29; --field:#0f1723; --bad:#f19a9a; --bad-tint:rgba(241,154,154,.09); --ok:#7fd1a8; --ok-tint:rgba(127,209,168,.12); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
summary{list-style-position:inside}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-deep)}
h1,h2,h3,h4{font-family:var(--serif);margin:0;line-height:1.35;text-wrap:balance}
a{color:var(--brand)} code{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:27;background:var(--brand-deep);color:var(--bar-ink)}
.top-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--serif);font-weight:700;font-size:16.5px;display:flex;gap:9px;align-items:center;white-space:nowrap}
.brand small{font-family:var(--sans);font-weight:400;color:var(--bar-dim);font-size:12.5px}
#who{font-size:12.5px;color:var(--bar-dim);flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--bar-dim)}
.prog i{display:block;width:120px;height:6px;border-radius:9px;background:rgba(255,255,255,.15);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);background:var(--accent);border-radius:9px;transition:width .3s}
#sy{max-width:240px;font-size:13px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--bar-ink);padding:5px 8px}
#sy option{color:#1c242e;background:#fff}
#menu{display:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:4px 12px;font-size:13px}

.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#side-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start;max-height:calc(100vh - 76px);overflow:auto;padding-block:20px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:s}
.steps a{display:grid;grid-template-columns:18px 2.6em minmax(0,1fr);gap:6px;align-items:center;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px}
.steps a:hover{background:var(--brand-tint);color:var(--ink)}
.steps a.cur{background:var(--brand);color:var(--on-brand)} .steps a.cur code{color:var(--on-brand)}
.steps code{font-size:12px;font-weight:700;color:var(--accent)}
.pp{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*360deg),var(--line) 0)}
.steps a.done .pp{background:var(--ok);position:relative} .steps a.done .pp::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.saved{font-size:12px;color:var(--faint);margin:16px 8px 0;line-height:1.5}
#work{min-width:0;padding-block:24px 60px}

.sh{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.sh .code{flex:none;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--brand);color:var(--on-brand);border-radius:8px;padding:5px 10px;min-width:46px;text-align:center;margin-top:3px}
.sh h2{font-size:clamp(22px,2.6vw,28px)}
.q{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.form{min-width:0;display:grid;gap:16px}
.form h3{font-size:17px;color:var(--brand);margin-top:8px}
.side{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 86px);overflow:auto;padding-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.card h4,.card summary{font-family:var(--serif);font-size:15px;color:var(--brand);font-weight:700}
.card summary{cursor:pointer;list-style-position:outside}
.card.where{background:var(--accent-tint);border-color:transparent} .card.where p{margin:6px 0 0}
.card.case{border-top:3px solid var(--accent)}
.card dl{margin:8px 0 0} .card dt{font-weight:700;color:var(--accent);font-size:13px;margin-top:8px} .card dd{margin:2px 0 0}
.key{color:var(--muted);font-size:13.5px;margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line-strong)}
.must,.card.pass ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.must label,.pass label,.secs label,.opt{display:flex;gap:8px;align-items:flex-start;cursor:pointer;border-radius:7px;padding:4px 6px}
.must label:hover,.pass label:hover,.secs label:hover{background:var(--brand-tint)}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);margin-top:5px;flex:none}
.must input:checked+span,.pass input:checked+span,.secs input:checked+span{color:var(--faint)}
.card.pass{background:var(--brand-tint);border-color:transparent}
.errs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.errs li{background:var(--bad-tint);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;font-size:13.5px}
.errs b{color:var(--bad)}
.slot{background:var(--accent-tint);border-bottom:1.5px dotted var(--accent);border-radius:3px;padding:0 2px}

.fld label{display:flex;gap:8px;align-items:baseline;font-weight:700;color:var(--ink);font-size:15px;flex-wrap:wrap}
.req,.only{font-style:normal;font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;letter-spacing:.04em}
.req{background:var(--accent-tint);color:var(--accent)} .only{background:var(--brand-tint);color:var(--brand)}
.cnt{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--faint);font-family:var(--mono)} .cnt.over{color:var(--bad);font-weight:700}
.hint{margin:2px 0 6px;color:var(--muted);font-size:13.5px}
textarea,.grid input,.grid select,.tool input,.tool select,#type2{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:9px;padding:8px 11px;line-height:1.65;font-size:14.5px}
textarea{resize:vertical;min-height:2.6em}
textarea:focus,input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
textarea.flash{background:var(--accent-tint);transition:background .1s}

.tpls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tpls summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px}
.chips{display:grid;gap:6px;margin-top:10px}
.chip{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:10px;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--ink);font-size:13.5px}
.chip:hover{border-color:var(--accent)} .chip b{color:var(--brand)} .chip span{min-width:0}

.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.grid{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.grid th{background:var(--brand);color:var(--on-brand);font-weight:700;text-align:left;padding:7px 10px;white-space:nowrap;font-size:13.5px}
.grid td{border-top:1px solid var(--line);padding:6px;vertical-align:top}
.grid td.n,.grid th.n{width:2.4em;text-align:center;color:var(--faint);font-family:var(--mono)}
.grid td.x,.grid th.x{width:2.4em;text-align:center}
.grid textarea,.grid input,.grid select{padding:5px 8px;font-size:14px;border-radius:7px}
.grid input[type=number]{width:5em}
.grid td.ro{min-width:14em;font-size:14px} .grid td.ro em{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:4px}
.grid td.ro em.sug{color:var(--accent)}
.grid td.empty{text-align:center;color:var(--faint);padding:16px}
.del{border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px} .del:hover{color:var(--bad);background:var(--bad-tint)}
.add{justify-self:start;border:1px dashed var(--line-strong);background:transparent;color:var(--brand);border-radius:8px;padding:5px 12px;font-size:13.5px;margin-top:-6px}
.warn ul,.warn-l{margin:0;padding:10px 14px 10px 30px;background:var(--bad-tint);border-radius:10px;color:var(--bad);font-size:13.5px}
.warn:empty,.warn-l:empty{display:none}

.tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tool h4{color:var(--brand);font-size:16px;margin-bottom:8px}
.tool.typ{border-left:4px solid var(--accent)}
.secs{list-style:none;margin:8px 0;padding:0;display:grid;gap:2px;font-size:14px}
.secs em{display:block;font-style:normal;color:var(--muted);font-size:13px}
.ss-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ss-g label,.tb label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.ss-g label.wide{grid-column:1/-1}
.ss-out{margin:12px 0 10px;background:var(--brand-tint);border-radius:9px;padding:10px 12px;font-size:14.5px}
.ss-out b{font-family:var(--mono);font-size:20px;color:var(--brand)} .ss-out span{display:block;margin-top:4px;color:var(--ink)}
.fine{font-size:12.5px;color:var(--faint);margin:8px 0 0}
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:9px;padding:7px 16px;font-size:14px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand)} .btn.small{padding:3px 10px;font-size:13px}
.btn.warnb{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.file{position:relative;overflow:hidden} .btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.link{border:0;background:transparent;color:var(--brand);text-decoration:underline;padding:0 4px;font-size:13.5px}
.inl{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:700} .inl input{width:5em}
.fld .btn.small{margin-bottom:6px}

.gc{margin-top:12px;overflow-x:auto;font-size:12.5px;--n:12}
.gh,.gr{display:grid;grid-template-columns:11em repeat(var(--n),minmax(22px,1fr));align-items:center;min-width:520px}
.gh span{text-align:center;color:var(--faint);font-family:var(--mono);padding:3px 0;border-bottom:1px solid var(--line)}
.gr{border-bottom:1px solid var(--line);min-height:28px}
.gl{grid-column:1;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.gr i{grid-row:1;height:14px;border-radius:5px;background:var(--brand);margin:0 2px}
.gr i.buf{background:transparent;border:1.5px dashed var(--accent)}

.setup{display:grid;gap:14px}
.setup .card h3{font-size:16.5px;color:var(--brand);margin-bottom:8px}
.opts{display:grid;gap:6px}
.opts.pick{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:1px solid var(--line);background:var(--field);padding:9px 11px}
.opt:hover{border-color:var(--brand)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-tint)}
.opt span{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.opt b{color:var(--ink);font-size:14.5px}
.opt code{font-weight:700;color:var(--accent)}
.card.soft{background:var(--accent-tint);border-color:transparent}
.confirm{display:inline-flex;gap:8px;align-items:center;margin-left:10px;font-size:13.5px;flex-wrap:wrap}

.review{display:grid;gap:14px}
.review .card h3{font-size:17px;color:var(--brand)}
.map{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.map li{display:grid;grid-template-columns:10.5em minmax(0,1fr) auto;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px}
.map li b{color:var(--brand)} .map li.hot{border-color:var(--accent);background:var(--accent-tint)}
.map li.empty span{color:var(--bad)}
.issues{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.issues li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--bad-tint);border-radius:8px;padding:7px 10px;font-size:14px;flex-wrap:wrap}
.ok{color:var(--ok);background:var(--ok-tint);border-radius:9px;padding:10px 12px}
.ex-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.preview{max-height:480px;overflow:auto;font-size:14px;margin-top:10px;font-family:var(--serif)}
.preview h1{font-size:20px;text-align:center;margin:10px 0} .preview h2{font-size:17px;margin:16px 0 6px;color:var(--brand)} .preview h3{font-size:15px;margin:10px 0 4px}
.preview table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:12.5px;margin:6px 0} .preview td,.preview th{border:1px solid var(--line-strong);padding:3px 6px;vertical-align:top}
.danger{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}

@media (max-width:1180px){ .cols{grid-template-columns:minmax(0,1fr)} .side{position:static;max-height:none;overflow:visible} }
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  #menu{display:inline-block}
  #side-nav{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);max-height:none;z-index:25;background:var(--card);box-shadow:0 0 40px rgba(0,0,0,.3);
    padding:calc(env(safe-area-inset-top,0px) + 70px) 14px 24px max(14px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .2s}
  #side-nav.open{transform:none}
  .opts.pick{grid-template-columns:minmax(0,1fr)}
  #who{display:none}
  .prog i{width:70px}
}
@media (max-width:560px){
  .chip{grid-template-columns:minmax(0,1fr)} .map li{grid-template-columns:minmax(0,1fr) auto} .map li span{grid-column:1/-1;order:3}
  #sy{max-width:100%;flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){ #side-nav,.prog i::after{transition:none} }

.oneclick{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.cv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cv label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.cv input{border:1px solid var(--line-strong);background:var(--field);border-radius:9px;padding:7px 10px;font-size:14.5px}
.irbf{display:grid;gap:12px} .irbf[open]{padding-bottom:14px}
.exp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:10px 0}
.exp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--field)}
.exp h4{color:var(--brand);font-size:15.5px} .exp p{margin:0;font-size:13.5px;color:var(--muted)} .exp .btn{align-self:flex-start;margin-top:auto}
.preview .ctr{text-align:center} .preview .ctr.b{font-weight:700} .preview .ind{text-indent:2em} .preview .ref{padding-left:2em;text-indent:-2em}
.preview .cap{text-align:center;font-weight:700;font-size:13px} .preview .note{color:var(--faint);font-size:13px} .preview .sign{margin-top:14px}
.preview hr{border:0;border-top:1px dashed var(--line-strong);margin:16px 0}
@media (max-width:700px){.exp-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.oneclick{order:5}}

.presets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.preset.on{background:var(--brand);color:var(--on-brand)}
#demo.flash,.card.flash{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
<button id="menu" type="button" aria-expanded="false" aria-controls="side-nav">步驟</button>
<div class="brand">研究計畫書工作台<small>研究方法論 · 6.0</small></div>
<div id="who"></div>
<div class="prog" id="prog"><i></i><span id="progt"></span></div>
<button type="button" id="oneclick" class="oneclick">一鍵匯入範例</button>
<label class="vh" for="sy">我卡在哪裡</label><select id="sy"></select>

 (一) 國內外研究情況、重要文獻評述", "「文獻探討」或併入背景"], "tpl": [["章節骨架", "2.1〔核心概念或場域現況〕　2.2〔介入或技術〕之應用與證據　2.3〔結果變項〕之測量\n2.4〔理論或模式〕　2.5 研究缺口與本研究定位　2.6 研究架構（接 M4）"], ["主題段落", "關於〔主題〕，〔作者 A（年）〕與〔作者 B（年）〕皆發現〔共同結果〕；然〔作者 C（年）〕於〔不同場域或對象〕得到〔不同結果〕，差異可能來自〔設計、樣本或測量之不同〕。"], ["段落收尾", "上述研究顯示〔整理後的已知〕，惟〔尚未回答的部分〕，此即本研究〔第幾項目的〕之依據。"], ["缺口 ① 已知", "既有研究已證實〔已知 1〕與〔已知 2〕（〔引用〕）。"], ["缺口 ② 未知", "然而，〔場域、族群、結果或方法〕上仍缺乏〔哪種證據〕：〔矩陣中大家都空著的那一欄〕。"], ["缺口 ③ 為何值得", "此缺口使〔誰〕在〔做什麼決定〕時缺乏依據；本研究將以〔設計〕回答〔問題〕。"]], "ex": [["PICO", "P 長照機構負責交班之護理人員｜I AI 照護紀錄摘要工具｜C 導入前及同期未導入機構｜O 交班準備時間、紀錄完整性"], ["已知", "醫院場域之 AI 摘要研究多報告文書時間縮短；長照場域已有照護人員使用經驗之質性研究。"], ["未知", "長照場域導入後，時間與紀錄品質是否「同時」改善，缺乏並測之量化證據；多數研究亦缺同期對照。"], ["為何值得", "機構需同時知道「省多少時間」與「品質有無變差」才能決定是否全面導入。"], ["架構依據", "以社會技術模型（Sittig & Singh, 2010）說明工具、人員、流程之交互作用，接 M4 架構圖。"]], "checks": [["檢索式可以直接貼上執行，且含中文資料庫？", "M2-1"], ["段落以主題開頭，一段比較多篇？", "M2-2"], ["缺口有矩陣佐證，並指出誰會用到結果？", "M2-2"]], "exkey": "案例 Q 的缺口是「並測」與「同期對照」兩個證據缺口，而不是「沒有人做過 AI」。"}, "m3": {"name": "研究目的、問題與假設", "sub": "把缺口收斂成一個可回答的問題；每個目的都要對得到一種分析（M6）", "q": "我到底要問什麼？要證明或描述什麼？", "must": ["主要研究問題：單一語句、60 字內", "2–3 項研究目的：以可檢驗動詞開頭（描述、比較、檢驗、探討）", "每項目的對應一個研究問題（或假設）", "量性：方向性假設＋虛無假設；描述性目的不設假設", "質性：探究焦點與引導性問題，說明不設假設的理由", "名詞界定：關鍵名詞的概念型與操作型定義（接 M4）", "研究範圍：對象、場域、期間；不做什麼", "目的數量與碩論規模相稱（通常 2–3 項）"], "errs": [["一句話問三件事（現況、因素、如何改善）", "只留答得了的；其餘移到未來研究"], ["描述性目的也寫假設", "描述性目的不設假設，只寫要估計什麼"], ["質性研究寫「研究者將保持客觀中立」", "改寫前理解與反身性作法（見 E 型）"]], "key": "檢驗法：把研究問題唸給非本領域的人聽；對方能複述「要比較什麼」才算研究問題，只能複述主題名詞就還是題目。", "where": ["第一章 1.3 目的、1.4 問題與假設、1.5 名詞界定", "CM03 (一) 末段或 (二) 開頭", "「計畫目標」"], "tpl": [["主要研究問題", "〔對象〕在〔情境〕中〔接受介入或暴露〕後，〔結果〕是否〔改變方向〕？（60 字內）"], ["目的（量性）", "一、〔描述〕〔對象〕之〔變項〕現況。\n二、〔比較或檢驗〕〔介入或分組〕對〔結果〕之影響。\n三、〔探討〕〔因素〕與〔結果〕之關係。"], ["研究問題", "對應每一目的各寫一題：〔目的二〕→「〔介入〕後〔結果〕是否較〔對照〕〔方向〕？」"], ["假設", "H1：〔介入組〕之〔結果〕〔高於／低於〕〔對照組〕。\nH0：兩組〔結果〕無差異。（非劣性：差異之 95% CI 下界高於〔界限〕）"], ["目的（質性）", "探討〔對象〕在〔情境〕中如何〔經驗、判斷、因應〕〔現象〕；探究焦點：〔面向 1〕、〔面向 2〕。"], ["範圍與限制", "本研究以〔場域〕之〔對象〕為範圍，期間〔起訖〕；不包含〔不做的部分及理由〕。"]], "ex": [["主要問題", "長照機構導入 AI 照護紀錄摘要工具後，交班準備時間是否縮短、紀錄完整性是否不變差？"], ["目的一", "To determine：導入後交班準備時間之變化（A 機構前後，並與同期未導入之 B 機構比較）。"], ["目的二", "To evaluate：紀錄完整性是否非劣於導入前。"], ["目的三", "To explore：照護人員之認知負荷與對 AI 摘要之信任。"], ["假設", "H1：A 機構導入後交班準備時間較導入前縮短，且降幅大於同期之 B 機構。\nH2：完整性差異之 95% CI 下界高於 −1.0 分（非劣性界限）。"], ["範圍", "北部 2 家機構、62 人、12 個月；不含工具開發與成本效益。"]], "checks": [["每個目的都以可檢驗的動詞開頭，且對得到一個假設或問題？", "M3-2"], ["描述或探索性的目的沒有硬寫假設？", "M3-1"], ["非本領域的人能複述「要比較什麼」？", "M3-1"]], "exkey": "H2 用非劣性而不是「無差異」：檢定不顯著不等於品質沒變差，非劣性要事先訂界限（見 2.6、9.4）。"}, "m4": {"name": "研究架構與變項定義", "sub": "一張圖讓讀者看懂變項之間的關係；一張表讓別人照著能測出同樣的東西", "q": "用什麼概念去問？每個概念怎麼測？", "must": ["研究架構圖：標明自變項、依變項、中介、干擾、控制變項", "每條箭頭都有理論或文獻依據（接 M2）", "未納入的重要變項及理由", "變項定義表：名稱、角色、概念型定義、操作型定義", "測量工具或資料欄位、尺度、範圍與計分", "測量時點（前測、後測、每月）與資料來源", "信效度依據：既有工具引證據，自編工具寫建立程序", "質性：初步分析框架，註明「將依資料修正」"], "errs": [["架構圖沒標變項角色，箭頭方向不明", "每個方框標角色；箭頭由因指向果"], ["操作型定義只寫「以問卷測量」", "寫出量表名稱、題數、計分與範圍"], ["質性研究畫成自變項 → 依變項", "改為探究焦點與各面向的初步關聯"]], "key": "架構圖與變項定義表是 M6 分析計畫的輸入：表上每一列，都要在分析計畫裡找得到它的位置。", "where": ["第二章末 研究架構、第三章 3.4 研究工具", "CM03 (二) 研究方法（附架構圖）", "「實施方法」或附件"], "tpl": [["架構圖", "左側放自變項（介入、分組、時間），右側放依變項；中介放中間，干擾以虛線箭頭指向主箭頭，控制變項放下方方框。\n圖下附一句：「本架構依〔理論或模式〕（〔引用〕）建立，箭頭 〔a〕 之依據為〔文獻〕。」"], ["變項名稱與角色", "〔中英文名稱〕；角色：〔自變項／依變項／中介／干擾／控制〕"], ["概念型定義", "〔該概念在文獻上的定義〕（〔引用〕）"], ["操作型定義", "本研究以〔具體工具或資料〕代表此概念：〔題數〕題、〔計分方式〕、範圍〔最低〕–〔最高〕，分數愈高表示〔意義〕。"], ["尺度與時點", "尺度：〔名目／次序／等距／比率〕；測量時點：〔前測、後測…〕；資料來源：〔問卷、觀察、系統日誌、資料庫欄位〕"], ["信效度依據", "既有工具：原作者報告〔信效度證據〕；自編工具：〔專家內容效度、預試、重測〕（見 2.2、2.2A、4.3）"]], "ex": [["自變項", "導入狀態（前測／後測）× 機構（A 先導入／B 延後導入）"], ["主要依變項", "交班準備時間：自開始彙整至完成交班之分鐘數；第三方觀察計時；比率尺度"], ["次要依變項", "紀錄完整性：0–20 分評分表，兩位評分者獨立評分；二次確認詢問次數：每次交班之次數"], ["探索變項", "認知負荷：自編 8 題量表；對 AI 摘要之信任：4 題量表"], ["控制變項", "當班照顧住民數、職類（護理師／資深照服員）、年資"], ["自編量表依據", "專家內容效度 5 位、預試 30 人（其中 15 人兩週後重測），程序見 2.2A"]], "checks": [["架構圖上每個方框都標了角色，每條箭頭都有依據？", "M4-2"], ["每個變項都寫到「題數、計分、範圍」這麼細？", "M4-2"], ["定義表每一列，在 M6 分析計畫都找得到？", "M6-1"]], "exkey": "主要依變項只有一個（交班準備時間）；主要結果要事先寫定，避免看結果才挑。"}, "m5": {"name": "研究方法（分支點）", "sub": "第三章要同時做到「夠嚴謹」與「做得到」；八節是共通骨架，各型的特有寫法見 Part 3", "q": "怎麼做，結果才可信？別人照著做，能不能重做一次？", "must": ["3.1 研究設計：用什麼設計，並寫至少兩項不採的設計與理由", "3.2 場域與對象：可操作的納入與排除條件", "3.3 抽樣與樣本數：完整參數與計算過程（質性寫飽和判準）", "3.4 研究工具：來源、題數、計分、信效度（質性附訪談大綱）", "3.5 資料蒐集流程：依時序寫，含去識別化時點", "3.6 資料分析計畫（見 M6）", "3.7 偏差來源與因應：至少三項具名偏差", "3.8 研究倫理與資料保護（見 M7）"], "errs": [["「依 G*Power 計算，樣本數為 120 人」", "寫檢定、效果量與依據、α、檢定力、流失率"], ["方法與研究問題對不上", "逐條對照 M3 的目的，一個目的至少一種做法"], ["只寫「將注意偏差」", "具名寫出偏差與可執行的因應措施"]], "key": "八節同 @A 四階段作業 A4。寫到這裡先依主型跳到 Part 3（A–H），照該型的小節清單補足特有內容，再回到 M5-2 起的模板。", "where": ["第三章 研究方法（3.1–3.8）", "CM03 (二) 研究方法、進行步驟及執行進度", "「實施方法與步驟」"], "tpl": [["3.1 設計", "本研究採〔設計名稱〕（〔主型代號〕）。選擇此設計之理由為〔與研究問題的對應〕。"], ["不採之設計", "不採〔設計甲〕，因〔理由，如無分派權、倫理或資源限制〕；\n不採〔設計乙〕，因〔無法排除的替代解釋〕。"], ["3.2 場域", "研究場域為〔機構名稱或類型〕〔規模，如床數、人數〕，已取得〔單位〕之〔書面同意〕（附錄〔　〕）。"], ["對象與條件", "納入條件：〔可操作的條件 1〕、〔條件 2〕；\n排除條件：〔條件〕；依同一條件，他人應可篩出同一群體。"], ["量性樣本數", "以〔G*Power 3.1／R pwr〕估算：〔檢定方法〕、效果量〔數值〕（依據：〔前導研究或文獻〕；無依據時採保守中效果）、α = 〔　〕〔單／雙〕尾、檢定力〔　〕，需〔n〕人；考量流失率〔　〕%，預計收案〔N〕人。"], ["質性人數", "以〔資訊力或飽和〕為判準：連續〔　〕位受訪者未出現新主題即停止，並續訪〔　〕位確認；預估約〔　〕人（〔引用〕）。"], ["問卷調查", "依可容許誤差〔　〕、信心水準〔　〕估算；或依 SEM 參數數量估算（見 2.3、4.1、D 型）。"], ["3.4 既有工具", "採用〔量表名稱〕（〔原作者，年〕）〔中文版，譯者〕，共〔　〕題、〔　〕點計分，原研究 Cronbach's α 為〔　〕；已取得〔作者授權〕。"], ["3.4 自編工具", "依〔文獻〕初擬〔　〕題 → 專家〔　〕位內容效度（I-CVI、S-CVI）→ 預試〔　〕人 → 〔重測、項目分析〕（流程見 2.2A）。"], ["3.5 流程", "一、IRB 核准後〔第幾月〕：〔聯繫場域、說明會、取得同意〕。\n二、〔前測或基線〕：〔做什麼、誰做、在哪做、多久〕。\n三、〔介入或資料蒐集〕：〔內容、頻率、期間〕。\n四、〔後測或追蹤〕；資料於〔時點〕完成去識別化並〔儲存方式〕。"], ["資料串接", "以〔研究編號〕串接〔問卷、觀察、系統日誌〕；對照表由〔專人〕保管，與研究資料分開存放。"], ["3.7 偏差 ①", "〔偏差名稱，如選擇偏差〕：因〔原因〕可能使〔結果偏向何方〕；因應：〔具體措施〕。"], ["3.7 偏差 ②", "〔測量偏差〕：因〔原因〕；因應：〔盲性、標準化流程、評分者訓練與信度檢核〕。"], ["3.7 偏差 ③", "〔干擾或流失〕：因〔原因〕；因應：〔對照組、多變項調整、意向治療分析、流失追蹤〕。"]], "ex": [["3.1 設計", "非同期導入之準實驗；不採 RCT（導入時程由管理階層決定，無分派權）、不採單組前後測（無法排除同期政策與人力變動）、不採橫斷面（無法回答是否帶來改變）。"], ["3.2 對象", "北部 2 家住宿式長照機構（A 120 床、34 人；B 96 床、28 人）負責交班之護理師與資深照服員，共 62 人，全體普查。"], ["3.3 樣本數", "配對 t 檢定、dz = 0.5（保守中效果）、α = .05 雙尾、檢定力 .80 → 至少 34 人；A 機構 34 人全數納入（2.6）。"], ["3.4 工具", "第三方觀察計時；完整性 0–20 分評分表（雙評分者）；自編認知負荷量表（內容效度、預試與重測，見 2.2A）。"], ["3.5 流程", "M1–M2 IRB 與觀察者校準 → M2–M3 前測 → A 機構 2026 年 11 月、B 機構 2027 年 2 月導入 → M9–M11 質性訪談。"], ["3.7 偏差", "觀察者效應 → 前測期先適應；同期事件 → B 機構同期對照；評分偏差 → 評分者不知前後測。"]], "checks": [["至少寫了兩項不採的設計與具體理由？", "M5-2"], ["樣本數的參數齊全，別人可以重算一次？", "M5-3"], ["至少三項具名偏差，各有可執行的因應？", "M5-4"]], "exkey": "3.6 分析與 3.8 倫理分別在 M6、M7 寫；這裡列出的六節，加上那兩節，就是 @A A4 要求的八節。"}, "m6": {"name": "資料分析計畫", "sub": "分析要在收資料前寫定：每個目的配一種分析，連前提檢查與缺值處理都事先決定", "q": "每個研究目的，分別用什麼方法分析？", "must": ["目的—假設—變項—方法—判準 對照表（一列一個目的）", "主要分析與次要分析分開寫", "前提檢查：常態、變異數同質、獨立性等，不成立時的替代法", "缺值處理：缺多少才處理、用什麼方法", "巢套或重複測量資料的處理（混合模型或 GEE）", "顯著水準、單雙尾、多重比較校正", "敏感度分析：換一種合理假設，結論是否改變", "軟體與版本；質性寫分析步驟與編碼方式"], "errs": [["只寫「以 SPSS 進行統計分析」", "逐一目的寫出檢定方法與判準"], ["巢套資料直接跑一般迴歸", "改用混合效果模型或 GEE，至少做敏感度分析"], ["寫了沒規劃的分析，或看結果才挑", "主要分析事先寫定；探索性分析明白標示"]], "key": "檢驗法：把 M3 目的表、M4 定義表與本頁對照表三張排在一起，每一列都要接得上；接不上的就是漏寫或多寫。", "where": ["第三章 3.6 資料分析計畫", "CM03 (二) 研究方法（分析策略）", "「實施方法」或「成效評估方式」"], "tpl": [["對照表欄位", "目的｜假設｜依變項（尺度）｜自變項｜分析方法｜判準（α、CI、界限）｜補充或敏感度分析"], ["描述性目的", "以〔平均數、標準差／次數、百分比〕描述〔變項〕；〔連續變項〕另報〔中位數與四分位距〕。"], ["比較性目的", "以〔配對 t／獨立 t／ANOVA／卡方〕檢驗〔假設〕，報告效果量〔d、η²、OR〕與 95% CI；若〔前提不成立〕，改用〔Wilcoxon 等無母數法〕。"], ["關係或預測", "以〔多元迴歸／邏輯斯迴歸／SEM〕檢驗〔自變項〕對〔依變項〕之影響，控制〔共變項〕；檢查〔共線性、殘差〕。"], ["缺值與敏感度", "缺值比例〔　〕% 以下以〔完整個案〕分析；高於此以〔多重插補〕，並以〔另一方法〕做敏感度分析。"], ["質性分析", "依〔Braun & Clarke 主題分析六步驟／內容分析〕；前〔　〕份逐字稿雙人獨立編碼，歧異以協商共識處理；以〔軟體〕管理編碼。"]], "ex": [["目的一", "A 機構前後：配對 t 檢定；A 對 B 同期：差異中之差異（DiD）；敏感度：混合效果模型（交班事件巢套於人員）。"], ["目的二", "完整性差異之 95% CI 與非劣性界限 −1.0 分比較：CI 下界高於 −1.0 即判定非劣。"], ["目的三", "認知負荷、信任以描述統計呈現，並以相關與多元迴歸探索其與準備時間之關係（探索性，明白標示）。"], ["共通設定", "α = .05 雙尾；量表 Cronbach's α 於正式施測後重新計算；分析以 Python（版本寫明）執行，腳本存檔。"], ["質性後接", "案例 L：依量化結果挑兩端案例訪談，主題分析六步驟，雙人獨立編碼前 4 份逐字稿。"]], "checks": [["M3 的每個目的，在這裡都有一列？", "M6-2"], ["重複測量或巢套資料，有寫怎麼處理？", "M6-1"], ["判準事先寫定，且分得出主要與探索性分析？", "M6-2"]], "exkey": "案例 Q 交班事件是「人重複測 12 次」，所以主分析外要加混合效果模型；這正是 @A A4 最常失分第二項。"}, "m7": {"name": "研究倫理、IRB 與資料治理", "sub": "計畫書要寫清楚：送哪種審查、怎麼取得同意、資料從收集到銷毀怎麼保護", "q": "參與者的權益怎麼保障？資料怎麼存、誰能看、何時銷毀？", "must": ["審查機構與預計審查類型（依 IRB 判定）", "知情同意方式；或申請免除同意的理由與條件", "參與者風險與降低方式；退出權、不影響考核或照護", "去識別化作法與時點；對照表保管方式", "資料儲存：位置、加密、存取權限、保存年限與銷毀", "次級資料：申請管道與使用規範（如健保資料）", "利益衝突揭露；生成式 AI 工具使用與資料不外流", "預計時程：何時送審、補件緩衝（接 M8）"], "errs": [["只寫「將通過 IRB 審查」", "寫審查類型、同意方式、資料保護細節"], ["研究者是受試者的主管，卻沒處理", "改由第三人招募，並說明不影響考核"], ["把含個資的資料貼進雲端 AI 工具", "去識別後才可使用，並寫進資料管理計畫"]], "key": "法規與審查類型見 7.1，隱私與資安見 9.11；本頁只管「計畫書要寫到哪些項目」。IRB 時程通常比想像長，提早送。", "where": ["第三章 3.8、附錄同意書", "CM01 勾選人體研究；CM03 (二) 敘明", "多列為必附文件"], "tpl": [["審查", "本研究將送〔機構〕人體研究倫理審查委員會審查，預計〔審查類型〕，於核准後始收案。"], ["同意", "〔對象〕於充分說明後簽署書面同意；〔對象或資料〕因〔理由〕擬申請免除知情同意，符合〔法規條件〕。"], ["風險與權益", "本研究風險為〔最小風險之說明〕；參與者可隨時退出，不影響其〔考核、照護、權益〕；招募由〔非直屬主管之第三人〕進行。"], ["去識別化", "資料於〔時點〕以研究編號取代姓名與〔識別欄位〕；對照表由〔專人〕保管於〔位置〕，與研究資料分開。"], ["儲存與銷毀", "資料存於〔加密位置〕，僅〔研究團隊成員〕可存取；保存至〔年限〕後以〔方式〕銷毀。"], ["利益衝突與 AI", "研究者與〔廠商或單位〕〔無／有〕財務關係〔揭露內容〕；生成式 AI 僅用於〔用途〕，不輸入可識別資料。"]], "ex": [["審查", "送合作機構所屬之人體研究倫理審查委員會；M1 送審，M2 核准後才開始前測。"], ["人員同意", "護理人員與照服員簽署書面同意；招募與說明由研究團隊進行，參與與否不影響考核。"], ["住民資料", "交班紀錄含住民個資：去識別化後才離開機構，並依 7.1 評估申請免除住民同意之條件。"], ["資料保護", "研究編號串接觀察、問卷與系統日誌；對照表由專人保管；存取限研究團隊。"], ["利益衝突", "揭露研究者與摘要工具廠商之關係；工具由機構採購，研究團隊不參與開發。"]], "checks": [["同意方式（或免除同意的理由）寫清楚了？", "M7-2"], ["去識別化的時點與對照表保管方式寫了？", "M7-2"], ["IRB 送審與補件時間已排進甘特圖？", "M8-1"]], "exkey": "案例 Q 的倫理重點是「住民資料」：受試者是人員，但紀錄內容屬於住民，兩者的同意要分開處理（見 7.1、9.11）。"}, "m8": {"name": "時程、可行性與風險", "sub": "說服審查者「你做得完」：甘特圖、可行性證據，以及卡住時的備案", "q": "一年內做得完嗎？哪一步最可能卡住？備案是什麼？", "must": ["甘特圖：以月為單位，自 IRB 送審到論文口試", "標明里程碑（IRB 核准、收案完成、分析完成…）", "任務之間的相依關係（前一步沒完成，下一步不能開始）", "至少兩個月緩衝，並寫明用途", "可行性證據：資料、場域、樣本、時間四項（見 0.1）", "已取得的同意書、預試或前導結果", "風險—對策表：可能遭遇的困難及解決途徑", "與方法章的時點完全一致（接 M5 的 3.5 節）"], "errs": [["時程最後一個月就是口試", "保留至少兩個月緩衝，標明用途"], ["可行性寫「應可取得」「預計無虞」", "附查證對象、日期與答覆"], ["甘特圖與方法章時點對不上", "逐項對照 3.5 節流程"]], "key": "國科會 CM03 明文要求寫「預計可能遭遇之困難及解決途徑」；論文計畫書沒有規定，但口委幾乎一定會問（@A 八問之八）。", "where": ["第三章末或第四章 研究時程", "CM03 (二) 執行進度、困難及解決途徑", "「期程安排」「風險管理」"], "tpl": [["甘特圖列", "工作項目｜起訖月份｜負責人｜前置工作｜里程碑（★）"], ["里程碑句", "★ M〔　〕〔里程碑名稱〕：〔判定完成的具體條件，如核准函、收齊〔　〕份〕。"], ["緩衝", "M〔　〕至 M〔　〕保留緩衝，用於〔IRB 補件、回收不足時延長收案、分析修正〕。"], ["可行性證據", "〔資料／場域〕已於〔日期〕取得〔單位〕〔書面同意或回覆〕（附錄〔　〕）；預試〔　〕人顯示〔可行之處〕。"], ["風險 → 對策", "若〔困難，如回收率低於預期〕，將〔對策，如延長收案、增加提醒、增加收案場域〕；判斷時點為 M〔　〕。"], ["多年期（國科會）", "第一年：〔工作項目〕；第二年：〔工作項目〕；每年各列查核點。"]], "ex": [["時程", "M1–M2 準備（IRB、觀察者校準、量表預試）→ M2–M3 前測 → M3 起 A 機構導入與後測 → M6 起 B 機構導入 → M9–M11 質性訪談 → M11–M12 分析與寫作"], ["里程碑", "★M2 IRB 核准　★M3 前測收齊　★M4 A 機構導入完成　★M7 B 機構導入完成　★M11 資料飽和確認　★M12 初稿完成"], ["可行性", "兩機構管理階層已同意導入時程與現場觀察；觀察計時與量表已規劃預試。"], ["風險 ①", "IRB 補件延誤 → M1 即送審；A 機構導入前仍須完成前測，必要時縮短前測期並記錄。"], ["風險 ②", "B 機構導入再延後 → 對照期延長，改以中斷時間序列補充分析（8.3）。"], ["風險 ③", "問卷回收不足 → 兩次提醒並請單位主管協助發放；於 M4 檢視回收狀況。"]], "checks": [["每個里程碑都有判定完成的具體條件？", "M8-2"], ["寫了至少三項風險，各有觸發條件與對策？", "M8-2"], ["甘特圖的時點與 3.5 節流程完全一致？", "M5-4"]], "exkey": "論文版另須在口試前保留至少兩個月緩衝（@A A4）；案例 Q 的 12 個月是執行期，不含口試。"}, "m9": {"name": "預期成果與貢獻", "sub": "寫的是「預期會看到什麼、對誰有什麼用」，不是結論；每一條都要對應一個目的", "q": "如果研究順利完成，會得到什麼？對學術與實務有什麼用？", "must": ["預期結果：理論 → 假設 → 預期觀察，逐條對應目的", "結果不如預期時的意義（不顯著、方向相反）", "學術貢獻：補了哪個缺口（接 M2）", "實務貢獻：誰會用、做什麼決定", "政策或產業貢獻（如有）", "研究限制：分「設計本身」與「執行面」兩類", "具體產出：論文、研討會、系統、指標、資料集", "國科會另需：參與人員可獲之訓練、對國家發展之貢獻"], "errs": [["把預期結果寫成已證實的結論", "用「預期」「若…則…」的未來式"], ["貢獻只寫「具參考價值」", "寫出使用者、決定與使用場景"], ["限制只寫「樣本數不足」", "分設計與執行兩類，各寫影響與因應"]], "key": "預期結果的推導鏈同 6.1 第 22 張；不得預告未經規劃的分析，也不要寫出具體數字結果。", "where": ["第三章末 預期結果、研究限制", "CM03 (三) 預期完成之工作項目及成果", "「預期效益」（多要求指標與目標值）"], "tpl": [["預期結果", "依〔理論或文獻〕，預期〔介入或因素〕將使〔結果〕〔方向〕；若結果〔不顯著或相反〕，則表示〔可能的解釋〕，仍可提供〔何種資訊〕。"], ["學術貢獻", "本研究將補足〔缺口〕，提供〔場域、族群〕之〔證據類型〕。"], ["實務貢獻", "結果可供〔使用者，如機構主管〕於〔決定，如是否全面導入〕時參考，並提出〔具體產出，如導入檢核清單〕。"], ["設計限制", "本研究採〔設計〕，無法〔排除之解釋〕；結果推論範圍限於〔場域、族群〕。"], ["執行限制", "可能面臨〔流失、觀察者效應、工具版本更新〕，將以〔因應〕降低其影響。"], ["具體產出", "預計完成〔碩士論文〕，並投稿〔期刊或研討會類型〕；國科會另寫〔人員訓練〕與〔成果之質與量〕。"]], "ex": [["預期結果", "交班準備時間縮短且完整性非劣；負荷下降，但需檢驗二次確認負擔是否增加。"], ["若不如預期", "若時間未縮短，將以使用紀錄與質性訪談（案例 L）找出原因，提供導入改善方向。"], ["學術貢獻", "填補長照場域「時間＋品質」並測、且有同期對照之量化證據。"], ["實務貢獻", "機構是否全面導入之決策依據；提出導入時的教育訓練與核對流程建議。"], ["限制", "設計：非隨機、僅北部 2 家機構；執行：觀察者效應、研究期間工具版本可能更新。"]], "checks": [["每個目的都有一條對應的預期結果？", "M3-3"], ["寫了「結果不如預期」時的意義？", "M9-2"], ["限制分成設計與執行兩類？", "M9-1"]], "exkey": "案例 Q 特意預告「需檢驗二次確認負擔」：它讓後接的質性研究（案例 L）有理由存在（見 3.2）。"}, "m10": {"name": "題目、摘要與參考文獻", "sub": "最後才定稿：題目與摘要是全書的縮影，
