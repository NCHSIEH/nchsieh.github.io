pidemiology, 67(4), 401–409.\nHasson, F., Keeney, S., & McKenna, H. (2000). Research guidelines for the Delphi survey technique. Journal of Advanced Nursing, 32(4), 1008–1015.\nNational Institute of Standards and Technology. (2023). Artificial intelligence risk management framework (AI RMF 1.0) (NIST AI 100-1). U.S. Department of Commerce.\nPeters, M. D. J., Marnie, C., Tricco, A. C., Pollock, D., Munn, Z., Alexander, L., McInerney, P., Godfrey, C. M., & Khalil, H. (2020). Updated methodological guidance for the conduct of scoping reviews. JBI Evidence Synthesis, 18(10), 2119–2126.\nTricco, A. C., Lillie, E., Zarin, W., O'Brien, K. K., Colquhoun, H., Levac, D., et al. (2018). PRISMA extension for scoping reviews (PRISMA-ScR): Checklist and explanation. Annals of Internal Medicine, 169(7), 467–473.\nWorld Health Organization. (2021). Ethics and governance of artificial intelligence for health: WHO guidance. World Health Organization.","irb_inst":"〔大學名稱〕〔系所〕；第二階段研究對象：跨職類專家（線上問卷）","irb_period":"2026 年 9 月至 2027 年 8 月（第二階段自 IRB 核准日起執行）","irb_review":"第一階段範域回顧不屬人體研究，無須送審；第二階段德菲法建議簡易審查：線上問卷蒐集專家專業意見，屬最小風險，以送審機構判定為準。","irb_n":"第二階段專家 18 位（資訊、醫品、法務、臨床主管、學者）。","irb_recruit":"由研究生以電子郵件個別邀請，附研究說明；不經由專家之上級要求參與。","irb_vuln":"不納入易受傷害族群。","irb_task":"填 2–3 回合線上問卷，每回合約 20 分鐘，為每項治理指標打分數並提供修改建議。","irb_withdraw":"可隨時以電子郵件告知退出，無須說明理由；退出後不再寄送問卷，已回覆資料依您的意願刪除。","irb_benefit":"無直接利益；每回合致贈〔　〕元禮券，並於研究完成後提供指標成果。","irb_harm":"屬最小風險；對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為專家評分與意見，以代號儲存，保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"是（第二階段免除書面同意，改以線上同意）。問卷內容為專業意見、屬最小風險，以審查會核准為準。","irb_ad":"【醫院 AI 治理檢核指標專家邀請】誠摯邀請您擔任德菲研究專家，協助評估醫院導入 AI 系統之治理檢核指標。共 2–3 回合線上問卷，每回合約 20 分鐘。聯絡人：〔研究生姓名〕〔電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責範域回顧、德菲問卷與共識統計）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"artificial intelligence governance; hospitals; scoping review; Delphi technique; indicators","m10_abs_en":"Hospitals are rapidly adopting AI systems, but there are no indicators to check whether AI governance is in place, and information technology, quality, and legal departments often assess only their own parts. This study aims to develop governance checklist indicators for hospitals implementing AI systems. In phase one, a scoping review following the JBI methodology and PRISMA-ScR will search bibliographic databases and guidance from international organizations; two reviewers will independently screen sources and extract governance domains and practices, which will be mapped to the four functions of the NIST AI Risk Management Framework (govern, map, measure, manage) to form draft indicators. In phase two, 18 experts in hospital informatics, quality management, law, clinical leadership, and academia will participate in a two- to three-round modified Delphi study, rating the importance and feasibility of each indicator. Consensus is predefined as adequate importance (mean ≥ 3.5 or mode ≥ 3) together with agreement (interquartile deviation < 1 or standard deviation ≤ 1). The study is expected to produce an evidence-informed, consensus-based set of AI governance indicators to support hospital self-assessment and accreditation preparation."},"objs":[{"verb":"描述","text":"描述文獻與指引中醫院 AI 治理之構面與具體做法","hyp":"","analysis":"範域回顧敘述統合；依 NIST 四功能歸類，計算各構面文獻數","crit":"兩人獨立篩選萃取，報 κ","sens":"依文獻類型（研究／指引）分別呈現","exp":"預期「上線後監測」與「事件通報」之具體做法較少，為治理缺口。"},{"verb":"開發","text":"依範域回顧結果初擬治理檢核指標","hyp":"","analysis":"萃取做法轉寫為可檢核之指標，每項附出處；2 位專家預閱","crit":"每項指標可回答「有／無」或有明確證據","sens":"—","exp":"預期初擬 4 構面、約 35 項指標。"},{"verb":"描述","text":"描述專家對治理指標重要性與可行性之共識結果","hyp":"","analysis":"每回合 M、SD、Mode、QD；依判準保留、修改或刪除","crit":"重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）皆達成者保留；停止條件：全數達共識或連續兩回合 QD 變化 < 0.1","sens":"排除廠商相關專家後重算","exp":"預期多數指標達共識；法務構面可行性可能較低。"}],"vars":[{"name":"治理構面與做法","role":"探索","concept":"文獻中之治理機制","oper":"萃取之做法依 NIST 治理、映射、量測、管理歸類","tool":"萃取表","scale":"名目","time":"第一階段","rel":"兩人萃取；NIST（2023）"},{"name":"指標重要性","role":"依變項","concept":"對 AI 治理的重要程度","oper":"5 點量尺","tool":"德菲問卷","scale":"次序","time":"每回合","rel":"Hasson 等人（2000）"},{"name":"指標可行性","role":"依變項","concept":"醫院執行之可行程度","oper":"5 點量尺","tool":"德菲問卷","scale":"次序","time":"每回合","rel":"同上"},{"name":"共識程度","role":"依變項","concept":"意見集中程度","oper":"M、Mode、QD","tool":"計算","scale":"等距","time":"每回合","rel":"Burnette 等人（2003）；Diamond 等人（2014）"},{"name":"專家職類","role":"控制","concept":"專家背景","oper":"資訊／醫品／法務／臨床／學者","tool":"基本資料表","scale":"名目","time":"第一回合","rel":"—"}],"bias":[{"name":"檢索偏差","why":"治理文件多為灰色文獻，資料庫查不到","fix":"檢索國際組織與主管機關網站"},{"name":"篩選偏差","why":"單人判斷納入與否","fix":"兩人獨立篩選，計算 κ"},{"name":"專家同質性","why":"專家多來自醫學中心","fix":"五類職類配額，並納入區域醫院代表"},{"name":"從眾效應","why":"專家看到群體統計後向中間靠攏","fix":"改分需說明理由；報告分數變化"}],"gantt":{"n":12,"rows":[{"t":"範域回顧計畫書與 OSF 註冊","s":1,"e":1},{"t":"檢索、篩選與萃取","s":2,"e":4},{"t":"歸納構面與初擬指標","s":5,"e":5},{"t":"IRB 送審與核准（第二階段）","s":5,"e":5},{"t":"第一、二回合德菲","s":6,"e":7},{"t":"第三回合德菲（如需要）","s":8,"e":8},{"t":"定稿與撰寫","s":9,"e":10},{"t":"緩衝（補檢索、加開回合）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"文獻量過大","trig":"標題摘要超過 3,000 篇","when":"M2","plan":"縮小至醫院層級並排除純技術文獻"},{"r":"專家回收率低","trig":"第一回合少於 13 位","when":"M6","plan":"電話提醒；增邀備選專家"},{"r":"共識難以收斂","trig":"第三回合仍有逾 3 成未達共識","when":"M8","plan":"依停止條件結束並如實報告"},{"r":"灰色文獻過多難以篩選","trig":"網站檢索文件超過 300 份","when":"M2","plan":"限定國際組織、主管機關與大型醫療體系發布之文件，並記錄限定理由"}],"kpi":[{"name":"初擬指標數（產出指標）","calc":"範域回顧轉寫之指標數","base":"0","goal":"第 5 月完成"},{"name":"達共識指標比例（成果指標）","calc":"最後一回合達共識指標數／初擬數","base":"—","goal":"多數達共識"}],"ss":{}}},"FD":{"label":"F→D 先建指標再全國調查：居家醫療照護品質指標","grp":1,"data":{"meta":{"type":"F","type2":"D 問卷調查"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"居家醫療照護整合計畫推動多年，參與團隊快速增加，但缺乏共通的品質指標；團隊不知道該改善什麼，主管機關也無法比較各團隊表現。","s1_2":"第一階段：居家醫療跨職類專家 18 位；第二階段：全國參與居家醫療照護整合計畫之團隊負責人（全數邀請）。","s1_3":"第一階段：德菲法建構之品質指標；第二階段：各團隊對指標之重要性與目前表現之評估。","s1_4":"第一階段：達共識之構面、指標與權重；第二階段：各指標重要性與表現分數、重要—表現分析（IPA）象限。","s1_5":"居家醫療照護品質應以哪些指標評估？全國團隊在這些指標上的表現與優先改善項目為何？","s1_6":"F→D：修正式德菲法建構指標（含 AHP 權重），再以全國問卷進行重要—表現分析。","s1_7":"德菲專家線上同意；全國問卷匿名，申請以線上說明取代書面同意；團隊名單取自公開資料。","s1_8":"12 個月：文獻與初擬 2 個月、德菲 3 回合 4 個月、問卷發展與施測 3 個月、分析撰寫，保留兩個月緩衝。","s1_9":"提供居家醫療照護品質指標與全國基準，指出各類團隊優先改善之項目。","m1_scene":"臺灣自 2016 年推動全民健康保險居家醫療照護整合計畫，由醫師、護理師、藥師、呼吸治療師與個案管理師組成團隊，到宅照顧行動不便、不易外出就醫之病人；參與院所與收案人數逐年增加，涵蓋居家醫療、重度居家醫療與安寧療護。隨著團隊數量成長，各團隊在收案評估、訪視頻率、急症處理、轉介銜接與家屬支持的做法差異很大，病人與家屬得到的照護品質因團隊而不同。","m1_gap":"目前對居家醫療團隊的管理多以收案數、訪視次數與費用申報為主，屬於「量」的指標；品質面缺乏經共識之指標，團隊不知道該改善什麼、做到什麼程度，主管機關也無法比較不同團隊或找出需要輔導者。既有醫院品質指標多以住院情境設計，不適用於居家情境的照護連續性、團隊協作與家屬角色。","m1_new":"Donabedian（1988）提出結構、過程、結果三面向的品質評估架構，廣泛用於建構照護品質指標；德菲法適合在缺乏實證標準時，整合跨職類專家意見形成共識（Hasson et al., 2000）。指標建立後，若只停在專家共識，無法知道實務上哪些指標已做到、哪些最需要改善；重要—表現分析（IPA）以「重要性 × 目前表現」四象限找出優先改善項目（Martilla & James, 1977），可將共識指標轉為實際行動清單。","m1_time":"主管機關正檢討居家醫療整合計畫之支付與品質獎勵制度，需要有共識基礎的品質指標與全國基準；本研究可於 12 個月內同時提供指標與現況，作為下一期計畫修訂之參考。","m1_stmt":"因此，本研究擬先以修正式德菲法建構居家醫療照護品質指標，再以全國問卷調查各團隊對指標之重要性與目前表現，找出優先改善項目。","m2_pico":"第一階段｜P：居家醫療跨職類專家｜I：修正式德菲法與 AHP｜O：達共識之構面、指標與權重。第二階段｜P：全國居家醫療照護整合計畫團隊｜E：團隊類型（醫院主導／診所主導）、收案規模、成立年資｜O：各指標重要性與表現分數、IPA 象限","m2_search":"PubMed：（\"Home Care Services\"[Mesh] OR \"home-based primary care\"[tiab] OR \"home medical care\"[tiab] OR \"home health care\"[tiab]）AND（\"Quality Indicators, Health Care\"[Mesh] OR \"quality indicator*\"[tiab] OR \"quality measure*\"[tiab]）AND（Delphi[tiab] OR consensus[tiab]）\n華藝：（居家醫療 OR 居家照護）AND（品質指標 OR 照護品質）AND（德菲 OR 共識）\n限制：2010 年以後、中英文；並檢索健保署居家醫療照護整合計畫相關公告；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、品質指標的架構。Donabedian（1988）主張照護品質可從結構（人力、制度與資源）、過程（照護如何提供）與結果（對病人與家屬的影響）評估。對本研究的意義：以三構面初擬指標，避免只評收案數與訪視次數。\n二、德菲法與共識判準。Hasson 等人（2000）提出德菲法的執行要點；Diamond 等人（2014）指出多數德菲研究未事先界定共識判準；CREDES 建議完整報告專家遴選、回合與判準（Jünger et al., 2017）。本研究採重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）之判準（Burnette et al., 2003），於第一回合前寫定並使保留與刪除條件互斥。\n三、由指標到改善優先順序。重要—表現分析以各項目之重要性與表現平均數畫出四象限，「重要但表現差」者為優先改善（Martilla & James, 1977）；全國調查之發放與提醒依調整式設計法提高回收率（Dillman et al., 2014）。本研究初步檢索（附錄一）未見國內居家醫療品質指標之德菲研究與全國重要—表現調查（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已提供品質指標之三構面架構（Donabedian, 1988）、德菲法之執行與報告準則（Hasson et al., 2000；Jünger et al., 2017），以及將重要性與表現結合以排定改善優先順序之方法（Martilla & James, 1977）。","m2_unknown":"然而，針對國內居家醫療照護整合計畫、經跨職類專家共識之品質指標仍缺乏，且未有全國資料說明各團隊在這些指標上的表現與優先改善項目。","m2_worth":"此缺口使團隊無從自我改善、主管機關無法設計品質獎勵或輔導；本研究以德菲法建構指標並以全國 IPA 調查提供基準與優先順序，兩者合起來才能從「訂標準」走到「找改善點」。","m2_theory":"以 Donabedian（1988）結構－過程－結果架構初擬指標構面，以修正式德菲法（Hasson et al., 2000）形成共識並以 AHP 計算權重（Saaty, 1980）；第二階段以重要—表現分析（Martilla & James, 1977）將共識指標轉為改善優先順序。","m2_orig":"本計畫首先以跨職類德菲法建構國內居家醫療品質指標並附權重，再以全國團隊調查建立表現基準與 IPA 象限，產出可直接用於品質獎勵設計與團隊自我改善之行動清單。","m3_rq":"居家醫療照護品質應以哪些指標評估？各團隊之優先改善指標為何？","m3_terms":"居家醫療照護整合計畫團隊：參與全民健康保險居家醫療照護整合計畫，提供居家醫療、重度居家醫療或安寧療護之跨職類團隊。\n共識：重要性（平均數 M ≥ 3.5 或眾數 Mode ≥ 3）且一致性（四分位差 QD < 1 或標準差 SD ≤ 1）兩組皆達成者為達共識（Burnette et al., 2003），判準於第一回合前寫定。\n重要—表現分析（IPA）：以各指標重要性平均數為縱軸、表現平均數為橫軸，以總平均為交叉線劃分四象限（Martilla & James, 1977）。\n團隊表現：團隊負責人自評該指標目前達成程度，5 點量尺。","m3_scope":"研究範圍為國內居家醫療照護整合計畫之品質指標，第一階段專家為國內居家醫療相關實務、管理與學術人員，第二階段為全國參與計畫之團隊，研究期間 12 個月。本研究建構指標與調查自評表現，不以病歷或申報資料驗證表現，不評估指標與病人結果之關聯，亦不訪談病人與家屬。","m4_frame":"第一階段：依結構（人力組成、24 小時聯繫、資訊共享）、過程（收案評估、訪視計畫、用藥整合、急症處理、轉介銜接、家屬衛教）、結果（非計畫性急診與住院、在宅善終、家屬滿意）三構面初擬指標，專家評重要性與可行性，達共識者保留並以 AHP 計算權重。第二階段：自變項為團隊類型、收案規模與成立年資；依變項為各指標之重要性與表現分數；以 IPA 四象限呈現優先改善指標。","m5_design":"本研究採兩階段設計（F→D）：第一階段為修正式德菲法，以文獻與既有計畫規範初擬指標取代第一回合開放題，進行 2–3 回合評分並以 AHP 計算權重；第二階段為橫斷式全國問卷調查，以第一階段之共識指標為題項，請團隊負責人評估各指標之重要性與目前表現。","m5_reject":"不只做德菲法，因專家共識無法說明全國團隊實際表現與優先改善項目；不直接做全國問卷，因缺乏經共識之指標，題項易流於研究者主觀；不以病歷稽核取代自評，因跨團隊病歷取得需個別同意且成本過高，本研究先以自評建立基準，於限制中說明。","m5_site":"第一階段專家透過指導教授與居家醫療相關學會網絡邀請，已有 12 位口頭同意（附錄二）。第二階段研究對象為健保署公開名單所列、調查期間仍參與計畫之居家醫療團隊（教學示意：約 200 個團隊，以下載當月名單為準），由團隊負責醫師或個案管理師填答；兩個相關學會已同意協助宣傳。","m5_incl":"第一階段專家納入：於居家醫療臨床、管理、主管機關或研究領域具 5 年以上經驗之醫師、護理師、藥師、個案管理師與學者；排除與研究者有直接僱傭或指導關係者。第二階段納入：調查期間仍參與計畫之團隊；排除：調查期間退出計畫或收案數為 0 者；同一院所多個團隊者，每團隊各自填答。","m5_sample":"第一階段專家 18 位，醫師、護理師、藥師、個案管理師與學者／主管機關五類各 3–4 位，符合德菲法常見 10–20 位之規模（Keeney et al., 2011）；每回合回收率目標 70% 以上（至少 13 位）。第二階段全數邀請約 200 個團隊（普查）；依有限母群校正，以可容許誤差 ±0.08、信心水準 95%、p = 0.5 估算需約 86 個團隊，預期回收率 50% 可達 100 個團隊。","m5_tool":"一、德菲問卷：每項指標評重要性與可行性各 5 點量尺，並設修改建議欄；第二回合起附群體 M、Mode、QD 與專家本人上一回合分數。\n二、AHP 問卷：構面與指標兩兩比較，1–9 尺度。\n三、全國問卷：以共識指標為題項，每項評「重要性」與「本團隊目前表現」各 5 點量尺；另含團隊基本資料（類型、收案規模、成立年資、人力組成）與開放題 1 題；經 2 位專家與 3 個團隊預試確認題意。","m5_flow":"一、第 1–2 月：文獻、計畫規範與國際指標整理，初擬指標；IRB 送審（兩階段一併）。\n二、第 3–4 月：第一回合德菲（線上，回收期 2 週），統計並整理修改建議。\n三、第 5 月：第二回合德菲；第 6 月：必要時第三回合，並進行 AHP。\n四、第 7 月：以共識指標編製全國問卷，預試 3 個團隊。\n五、第 8–9 月：正式施測，以電子郵件與公文寄送線上問卷，依調整式設計法於第 1、2、4 週提醒，第 5 週電話提醒（Dillman et al., 2014）；團隊代碼僅用於避免重複填答與計算無回應比較，分析前刪除。","m5_innov":"將德菲法之共識指標直接轉為全國調查題項，並以重要—表現分析產出優先改善清單，使指標建構與實務改善在同一研究中銜接。","m6_common":"第一階段：每回合計算各指標重要性與可行性之 M、SD、Mode 與 QD；重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）皆達成者保留，連續兩回合重要性未達（M < 3.5 且 Mode < 3）者刪除，其餘修改後再評（三類互斥）；停止條件：全數達共識或連續兩回合 QD 變化 < 0.1。AHP 以幾何平均整合專家判斷，CR < 0.1 才採用。第二階段：以平均數與 95% CI 描述各指標重要性與表現；IPA 以總平均為交叉線劃分四象限；以 Wilcoxon 符號等級檢定比較每項指標重要性與表現之差距；以 Mann–Whitney U 或 Kruskal–Wallis 比較不同團隊類型之表現，多重比較以 Holm 法校正；比較回收與未回收團隊之類型與地區評估無回應偏差。分析以 R（版本寫明）執行。","m6_qual":"德菲修改建議與全國問卷開放題以內容分析歸類，作為修正指標措辭、合併或新增指標，以及解釋 IPA 結果之依據，並記錄每項變更理由。","m7_irb":"本研究將送〔大學〕研究倫理審查委員會審查，屬專家意見問卷與團隊匿名問卷、不涉及病人資料，預計申請簡易審查並以線上同意代替書面同意，兩階段一併送審，以審查會認定為準；第二階段問卷於第一階段完成後確定，屆時以變更案提出。","m7_consent":"兩階段皆於問卷首頁說明研究目的、填答時間、匿名方式與可隨時退出之權利，勾選同意後作答；申請以線上同意代替書面簽名，以審查會核准為準。","m7_risk":"屬最小風險；問卷內容為專業意見與團隊自評，不涉及病人與個人敏感資料。團隊可能擔心自評表現被主管機關識別，結果只以全國或分層彙總呈現，任何分層少於 5 個團隊時合併呈現。","m7_deid":"德菲專家以代號處理，回饋只呈現群體統計與匿名意見；全國問卷不收集填答者姓名，團隊代碼於計算無回應比較後刪除。資料存於學校加密雲端，僅研究團隊可存取，保存至研究結束後 3 年，期滿以不可回復方式刪除。","m7_coi":"研究者與任何居家醫療團隊無財務關係，指導教授所屬醫院之團隊照常受邀，但結果不單獨呈現。生成式 AI 僅用於英文潤稿，不輸入問卷資料。","m8_feas":"專家：已有 12 位口頭同意（附錄二），另 6 位邀請中，並備有備選名單。名單：健保署公開之參與院所名單已下載整理。回收：兩個居家醫療相關學會已同意協助宣傳；指導教授過去主持之團隊調查回收率約 50%。時間：德菲 4 個月、全國調查 3 個月，保留兩個月緩衝。","m9_acad":"提供國內居家醫療照護品質之共識指標與權重，並示範以重要—表現分析銜接指標建構與全國基準，回應德菲研究「有指標、無應用」之常見限制。","m9_prac":"團隊可用指標自評並依 IPA 找出優先改善項目；主管機關可據以設計品質獎勵與輔導重點，並以全國基準追蹤改善。","m9_limd":"第一階段指標來自專家共識，未以病人結果驗證其效度；第二階段為團隊自評，可能高估表現，且橫斷式設計無法說明表現隨時間之變化。","m9_lime":"德菲回合間專家流失可能影響共識代表性；全國調查回收率可能偏低，回覆團隊可能偏向表現較佳者，將比較回收與未回收團隊特質並於限制中說明。","m9_train":"參與之碩士生將習得德菲法設計與共識判準、AHP、全國調查設計與重要—表現分析（教學示意）。","m9_output":"預計投稿期刊論文 2 篇（指標建構、全國 IPA 調查）、研討會論文 1 篇，並產出團隊自評手冊一份（教學示意）。","m9_nation":"回應在宅醫療與在地老化之政策需求，提供居家醫療品質管理之共同語言與全國基準，協助資源投入最需要改善之處。","t_iv":"品質指標","t_pop":"居家醫療照護團隊","t_out":"建構與全國重要—表現分析","t_des":"德菲法與問卷調查","m10_title":"居家醫療照護品質指標之建構與全國重要—表現分析：德菲法與問卷調查","m10_title_en":"Development of Quality Indicators for Home-Based Medical Care and a National Importance–Performance Analysis: A Delphi Study and Survey","m10_kw":"居家醫療、品質指標、德菲法、重要—表現分析、問卷調查","m10_abs":"居家醫療照護整合計畫推動多年，參與團隊快速增加，但缺乏共通的品質指標與全國基準。本研究旨在建構居家醫療照護品質指標，並調查全國團隊之重要性與表現，找出優先改善項目。第一階段以 Donabedian 結構－過程－結果架構初擬指標，邀請醫師、護理師、藥師、個案管理師與學者／主管機關共 18 位專家進行 2–3 回合修正式德菲法，以重要性（平均數 ≥ 3.5 或眾數 ≥ 3）且一致性（四分位差 < 1 或標準差 ≤ 1）為共識判準，並以層級分析法計算權重；第二階段以共識指標為題項，全數邀請全國參與計畫之團隊負責人評估各指標之重要性與目前表現，以重要—表現分析劃分四象限，並比較不同團隊類型之表現。預期產出經共識之品質指標、全國基準與優先改善清單。","m10_kw_en":"home-based medical care; quality indicators; Delphi technique; importance–performance analysis; survey","m10_abs_en":"Taiwan's Integrated Home-Based Medical Care Program has expanded rapidly, but there are no shared quality indicators or national benchmarks. This study aims to develop quality indicators for home-based medical care and to survey the importance and performance of these indicators among teams nationwide to identify priorities for improvement. In phase one, draft indicators based on Donabedian's structure–process–outcome framework will be rated by 18 experts—physicians, nurses, pharmacists, case managers, and academics or government officials—in a two- to three-round modified Delphi study. Consensus is predefined as adequate importance (mean ≥ 3.5 or mode ≥ 3) together with agreement (interquartile deviation < 1 or standard deviation ≤ 1), and the analytic hierarchy process will be used to weight indicators. In phase two, all teams participating in the program will be invited to rate the importance of each consensus indicator and their team's current performance in an online survey. Importance–performance analysis will classify indicators into four quadrants, gaps will be tested with Wilcoxon signed-rank tests, and performance will be compared by team type. The study is expected to produce consensus-based indicators, national benchmarks, and a prioritized list for quality improvement.","m10_refs":"Burnette, D., Morrow-Howell, N., & Chen, L. M. (2003). Setting priorities for gerontological social work research: A national Delphi study. The Gerontologist, 43(6), 828–838.\nDiamond, I. R., Grant, R. C., Feldman, B. M., Pencharz, P. B., Ling, S. C., Moore, A. M., & Wales, P. W. (2014). Defining consensus: A systematic review recommends methodologic criteria for reporting of Delphi studies. Journal of Clinical Epidemiology, 67(4), 401–409.\nDillman, D. A., Smyth, J. D., & Christian, L. M. (2014). Internet, phone, mail, and mixed-mode surveys: The tailored design method (4th ed.). Wiley.\nDonabedian, A. (1988). The quality of care: How can it be assessed? JAMA, 260(12), 1743–1748.\nHasson, F., Keeney, S., & McKenna, H. (2000). Research guidelines for the Delphi survey technique. Journal of Advanced Nursing, 32(4), 1008–1015.\nJünger, S., Payne, S. A., Brine, J., Radbruch, L., & Brearley, S. G. (2017). Guidance on Conducting and REporting DElphi Studies (CREDES) in palliative care: Recommendations based on a methodological systematic review. Palliative Medicine, 31(8), 684–706.\nKeeney, S., Hasson, F., & McKenna, H. (2011). The Delphi technique in nursing and health research. Wiley-Blackwell.\nMartilla, J. A., & James, J. C. (1977). Importance-performance analysis. Journal of Marketing, 41(1), 77–79.\nSaaty, T. L. (1980). The analytic hierarchy process. McGraw-Hill.","irb_inst":"〔大學名稱〕〔系所〕；第二階段對象為全國居家醫療照護整合計畫團隊","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：專家意見問卷與團隊匿名自評問卷，不涉及病人資料，屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"第一階段：專家 18 人；第二階段：全國團隊約 200 個，每團隊 1 位負責人填答，預期回收約 100 份。","irb_recruit":"第一階段由研究者以電子郵件個別邀請專家；第二階段依公開名單以電子郵件與公文寄送線上問卷連結，並由相關學會協助宣傳；主管機關不參與發放與催收。","irb_vuln":"否。參與者為成年醫事與管理人員，填答內容為專業意見與團隊自評。","irb_task":"第一階段：2–3 回合線上問卷，每回合約 30 分鐘，為每項指標評分；另填一份約 15 分鐘之兩兩比較問卷。第二階段：填一份約 15 分鐘之線上問卷，評估各指標的重要性與團隊目前表現。","irb_withdraw":"專家可於任一回合前告知退出，已填答之資料依其意願刪除或保留去識別化統計。全國問卷可隨時中止；匿名送出後無法辨識，故無法撤回。","irb_benefit":"無直接利益；專家致贈〔　〕元審查費，完成全國問卷之團隊可獲研究結果摘要與自評手冊。","irb_harm":"屬最小風險；如對研究有疑問或爭議，可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為專家問卷與全國匿名問卷資料。去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"是，申請免除書面同意：兩階段皆為線上問卷，屬最小風險，取得書面簽名反而需留下可識別資料，改以線上說明並勾選同意。","irb_ad":"【居家醫療品質指標調查】邀請居家醫療照護整合計畫團隊負責人填寫約 15 分鐘的匿名問卷，評估各項品質指標的重要性與團隊目前表現；結果只以全國彙總呈現，完成後可獲研究摘要與自評手冊。聯絡人：〔研究生姓名〕〔電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責德菲法執行、問卷施測與資料分析）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。"},"objs":[{"verb":"描述","text":"描述專家對居家醫療品質指標重要性與可行性之共識結果與權重","hyp":"","analysis":"每回合 M、SD、Mode、QD；依事先界定判準保留、修改或刪除；AHP 計算權重","crit":"重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）皆達成者保留；停止條件：全數達共識或連續兩回合 QD 變化 < 0.1","sens":"依專家職類分別計算共識與權重排序","exp":"預期 2–3 回合內多數指標達共識，過程構面（急症處理、轉介銜接）權重較高；若結果構面可行性低，表示資料蒐集困難，需配套。"},{"verb":"描述","text":"描述全國團隊對各指標之重要性與表現，並以 IPA 找出優先改善項目","hyp":"","analysis":"平均數與 95% CI；IPA 四象限；Wilcoxon 符號等級檢定比較重要性與表現差距","crit":"以總平均為交叉線；差距檢定 α = .05，Holm 校正","sens":"以中位數為交叉線重劃象限","exp":"預期 24 小時聯繫與用藥整合落在「重要但表現差」象限；若多數指標落在「重要且表現佳」，可能反映自評高估。"},{"verb":"比較","text":"比較醫院主導與診所主導團隊之指標表現","hyp":"H1：醫院主導團隊在結構構面表現分數高於診所主導團隊；H0：兩者無差異。","analysis":"Mann–Whitney U（構面平均分）；收案規模與成立年資以 Kruskal–Wallis 比較","crit":"α = .05（雙尾）；報效果量 r 與 95% CI","sens":"以多元迴歸調整收案規模與年資","exp":"預期醫院主導團隊結構面較佳、診所主導團隊在家屬支持與訪視彈性較佳；若無差異，表示品質差異主要來自其他因素。"}],"vars":[{"name":"指標重要性（德菲）","role":"依變項","concept":"專家認為該指標對居家醫療品質之重要程度","oper":"5 點量尺（1 非常不重要～5 非常重要）","tool":"德菲問卷","scale":"次序","time":"每回合","rel":"Hasson 等人（2000）"},{"name":"共識程度","role":"依變項","concept":"專家意見集中程度","oper":"M、Mode、QD","tool":"計算","scale":"等距","time":"每回合","rel":"Burnette 等人（2003）"},{"name":"團隊表現與重要性（全國）","role":"依變項","concept":"團隊自評各指標之重要性與目前達成程度","oper":"每項指標各 5 點量尺","tool":"全國問卷","scale":"次序","time":"第二階段","rel":"預試 3 團隊；Cronbach's α"},{"name":"團隊類型","role":"自變項","concept":"團隊主導院所層級","oper":"醫院主導／診所主導","tool":"全國問卷","scale":"名目","time":"第二階段","rel":"名單核對"},{"name":"收案規模、成立年資","role":"控制","concept":"團隊經驗與規模","oper":"目前收案人數；參與計畫年數","tool":"全國問卷","scale":"比率","time":"第二階段","rel":"—"}],"bias":[{"name":"專家選擇偏差","why":"專家來自研究者熟悉之網絡，觀點可能同質","fix":"五類職類配額並兼顧醫院與診所、都會與偏鄉"},{"name":"從眾效應","why":"專家看到群體統計後向中間靠攏","fix":"改分需說明理由；報告各回合分數變化"},{"name":"自評高估（社會期許）","why":"團隊負責人可能高估自身表現","fix":"匿名填答；以「過去 3 個月實際做法」措辭；限制中說明"},{"name":"無回應偏差","why":"表現較佳之團隊較願意回覆","fix":"多次提醒；比較回收與未回收團隊之類型與地區"}],"gantt":{"n":12,"rows":[{"t":"文獻整理與初擬指標","s":1,"e":2},{"t":"IRB 送審與核准","s":1,"e":2},{"t":"第一回合德菲","s":3,"e":4},{"t":"第二、三回合德菲與 AHP","s":5,"e":6},{"t":"全國問卷編製與預試","s":7,"e":7},{"t":"全國問卷施測與提醒（問卷蒐集）","s":8,"e":9},{"t":"IPA 與資料分析","s":9,"e":10},{"t":"論文撰寫","s":9,"e":11},{"t":"緩衝（加開回合、延長施測）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"專家回收率低","trig":"第一回合回收少於 13 位","when":"M4","plan":"電話提醒並延長 1 週；增邀備選專家（僅第一回合可補）"},{"r":"德菲回合延長","trig":"第三回合仍有逾 3 成指標未達共識","when":"M6","plan":"依停止條件結束，未達共識指標不列入全國問卷並如實報告"},{"r":"全國問卷回收不足","trig":"第 9 月回收少於 70 個團隊","when":"M9","plan":"請學會再次宣傳並電話提醒；延長施測 1 個月"},{"r":"名單資料過時","trig":"退信率高於 10%","when":"M8","plan":"以電話查核更新聯絡人"}],"kpi":[{"name":"達共識指標數（產出指標）","calc":"最後一回合達高度共識之指標數","base":"初擬指標數","goal":"第 6 月前完成"},{"name":"全國問卷回收團隊數（產出指標）","calc":"有效問卷之團隊數","base":"0","goal":"第 9 月前 100 個團隊"}],"ss":{"kind":"prop","eff":0.5,"alpha":0.05,"tails":2,"power":0.8,"drop":0,"moe":0.08,"basis":"未知比例時採最保守之 0.5；母群約 200 團隊，另依有限母群校正"}}},"GB":{"label":"G→B 先回顧既有模型再建模：長者術後譫妄預測","grp":1,"data":{"meta":{"type":"B","type2":"G 系統性／範域回顧"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"65 歲以上手術病人術後譫妄常見，延長住院並增加失能與死亡風險；已有許多預測模型，但品質不一、多未經外部驗證，醫院不知道該採用哪一個或該自己建。","s1_2":"第一階段：已發表之長者術後譫妄預測模型研究；第二階段：北部某醫學中心 2019–2025 年 65 歲以上接受住院手術之病人電子病歷。","s1_3":"第一階段：既有模型之預測因子、表現與偏誤風險；第二階段：以文獻確認之預測因子建立之術後 7 日內譫妄預測模型。","s1_4":"第一階段：模型數、常見預測因子、合併 c 統計量、PROBAST 偏誤；第二階段：AUC、校準度、決策曲線。","s1_5":"既有長者術後譫妄預測模型表現與品質如何？以文獻確認之術前資料建立之模型在本院表現如何？","s1_6":"G→B：預測模型之系統性回顧（CHARMS、PROBAST），再以回溯性資料建模並時間切分驗證（TRIPOD+AI）。","s1_7":"第一階段使用已發表文獻；第二階段去識別化病歷，申請免除知情同意。","s1_8":"12 個月：回顧 5 個月（與 IRB 及資料申請並行）、建模與驗證 4 個月、撰寫，保留兩個月緩衝。","s1_9":"提供既有模型之證據地圖與一個以本院資料驗證之術前譫妄風險模型，供麻醉與外科術前評估參考。","m1_scene":"譫妄是長者手術後常見的急性腦功能障礙，表現為注意力不集中、意識混亂與波動，會延長住院、增加跌倒、失能與死亡風險，且多數可藉由術前辨識高風險者並採取預防措施而減少（Inouye et al., 2014）。北部某醫學中心每年 65 歲以上住院手術約 8,000 人次，護理師以護理譫妄篩檢量表（Nu-DESC）每班篩檢，術後 7 日內篩檢陽性者約占一成（院內品管資料，教學示意）。","m1_gap":"現行術前評估未系統性估計譫妄風險，預防措施（如避免高風險藥物、維持睡眠與定向感）常在譫妄發生後才啟動。文獻中已有數十個譫妄預測模型，但預測因子定義、族群與驗證方式差異很大，多數未經外部驗證；醫院面臨「直接套用國外模型」或「自行建立模型」兩難，卻缺乏系統性比較作為依據。","m1_new":"預測模型之系統性回顧可依 CHARMS 清單萃取模型資訊（Moons et al., 2014），以 PROBAST 評估偏誤與適用性（Wolff et al., 2019），並依 TRIPOD-SRMA 報告（Snell et al., 2023），找出穩定出現的預測因子與既有模型之缺點。據此再以本院資料建立模型，可避免憑空挑選變項，並依 Riley 等人（2020）準則估算樣本數、以時間切分驗證、報告校準度（Collins et al., 2024）。","m1_time":"本院麻醉部正規劃術前評估門診之電子化，預計於 2027 年納入譫妄風險評估；本研究可在規格定案前，提供既有模型之證據摘要與本院資料之模型表現，決定「採用既有模型、重新校準或自建」。","m1_stmt":"因此，本研究擬先以系統性回顧整理長者術後譫妄預測模型之預測因子、表現與偏誤，再以本院資料依回顧確認之預測因子建立並以時間切分驗證預測模型。","m2_pico":"第一階段（PICOTS）｜P：65 歲以上接受手術之病人｜I：多變項術後譫妄預測模型｜C：無或其他模型｜O：術後譫妄｜T：術後 7 日內｜S：術前預測。第二階段｜P：本院 65 歲以上住院手術病人｜I（預測因子）：回顧確認之術前因子｜C：既有簡易模型重新校準｜O：術後 7 日內譫妄；AUC、校準度、決策曲線","m2_search":"PubMed：（\"Delirium\"[Mesh] OR delirium[tiab]）AND（\"Postoperative Complications\"[Mesh] OR postoperative[tiab] OR surgery[tiab]）AND（\"Aged\"[Mesh] OR older[tiab] OR elderly[tiab]）AND（\"prediction model*\"[tiab] OR \"risk score*\"[tiab] OR \"prognostic model*\"[tiab] OR \"machine learning\"[tiab]）\nEmbase、CINAHL 以對應主題詞與自由詞檢索；華藝：（譫妄）AND（術後）AND（預測 OR 風險）\n限制：2000 年以後、中英文；檢索日期、各階段筆數與 PRISMA 流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、術後譫妄的風險因子。Inouye 等人（2014）指出譫妄常由易感因子（高齡、認知功能障礙、多重共病、感官缺損）與誘發因子（手術、藥物、感染、電解質異常）共同造成。對本研究的意義：候選預測因子應同時涵蓋易感與術前可得之誘發因子。\n二、預測模型之系統性回顧方法。CHARMS 清單界定預測模型回顧之萃取項目（Moons et al., 2014），PROBAST 從對象、預測因子、結果與分析四面向評估偏誤（Wolff et al., 2019），TRIPOD-SRMA 規範回顧之報告（Snell et al., 2023）。對本研究的意義：回顧不只是列出模型，更要判斷哪些因子在低偏誤研究中穩定出現。\n三、模型建置與驗證。Riley 等人（2020）提出樣本數準則；Van Calster 等人（2019）強調校準度；TRIPOD+AI 規範報告（Collins et al., 2024）；決策曲線分析評估臨床淨效益（Vickers & Elkin, 2006）。本研究初步檢索（附錄一）未見以國內資料、依系統性回顧選定預測因子並時間切分驗證之長者術後譫妄模型（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已確認術後譫妄之主要易感與誘發因子（Inouye et al., 2014），並已有預測模型回顧與建置之方法學準則（Moons et al., 2014；Wolff et al., 2019；Riley et al., 2020）。","m2_unknown":"然而，既有長者術後譫妄預測模型之表現與偏誤風險缺乏最新整理，且尚無以國內資料、依回顧確認之術前因子建立並以時間切分驗證、報告校準度之模型。","m2_worth":"此缺口使醫院在採用模型時只能憑印象選擇；本研究以 G→B 兩階段，先釐清既有證據，再以本院資料決定「重新校準既有模型或自建」，結果可直接用於術前評估規格。","m2_theory":"第一階段依 CHARMS（Moons et al., 2014）萃取、PROBAST（Wolff et al., 2019）評估，依 PRISMA 2020 與 TRIPOD-SRMA 報告；第二階段依 CRISP-DM 流程與 TRIPOD+AI（Collins et al., 2024）建模與報告；第一階段之預測因子清單為第二階段之候選變項，並以最常被引用之簡易模型作為重新校準之基準。","m2_orig":"本計畫以系統性回顧選定預測因子與比較基準，再以國內資料時間切分驗證，同時比較「重新校準既有模型」與「自建模型」，回答醫院最實際的採用問題。","m3_rq":"既有長者術後譫妄預測模型表現與品質如何？依回顧因子建立之模型表現是否優於重新校準之既有模型？","m3_terms":"術後譫妄：術後 7 日內任一班次 Nu-DESC ≥ 2 分（Gaudreau et al., 2005），或病歷記載譫妄診斷（ICD-10-CM F05）或精神科會診確認者。\n預測時點：手術當日麻醉誘導前，只使用此時點前已產生之資料。\nc 統計量：預測模型區分有無事件之能力，二元結果下等同 AUC。\n重新校準：保留既有模型之預測因子與係數比例，以本院資料更新截距與校準斜率。","m3_scope":"第一階段範圍為 2000 年至檢索日已發表、以 65 歲以上手術病人為對象之多變項術後譫妄預測模型研究；第二階段範圍為本院 2019–2025 年 65 歲以上接受住院手術者（排除心臟手術與術前已有譫妄者）。本研究不將模型上線，不評估使用模型後之預防成效，亦不納入術中與術後資料。","m4_frame":"第一階段（G）：依 CHARMS 萃取模型之族群、預測因子、結果定義、表現與驗證方式，以 PROBAST 評偏誤，統整各因子出現頻率與低偏誤研究中之一致性，產出候選預測因子清單。第二階段（B）：候選因子（年齡、認知功能障礙病史、ASA 分級、手術類別與預計時間、急診手術、共病、術前白蛋白與鈉、聽力或視力障礙、使用苯二氮平類藥物等）→ 術後 7 日內譫妄；比較重新校準之既有簡易模型、邏輯斯迴歸與 XGBoost，以 2019–2024 年訓練、2025 年測試。","m5_design":"本研究採兩階段設計（G→B）：第一階段為預測模型之系統性回顧（必要時合併 c 統計量），依 PRISMA 2020 與 TRIPOD-SRMA 報告並註冊 PROSPERO；第二階段為回溯性預測模型開發與時間切分驗證，依 TRIPOD+AI 報告。","m5_reject":"不直接自建模型，因未先整理既有證據，可能遺漏重要因子或重複已知的錯誤；不直接套用國外模型，因族群與照護流程不同，未經本地校準可能高估或低估風險；第二階段不採隨機切分驗證，因無法反映模型在未來資料上的表現。","m5_site":"第一階段資料來源為 PubMed、Embase、CINAHL 與華藝，第二位評估者為同實驗室研究生〔姓名〕（附錄二）。第二階段場域為北部某醫學中心（年 65 歲以上住院手術約 8,000 人次），資料來源為院內電子病歷、手術麻醉系統與護理 Nu-DESC 紀錄，IRB 核准後向資訊室申請去識別化資料，於院內分析環境處理。","m5_incl":"第一階段納入：以 65 歲以上手術病人為主要對象、建立或驗證多變項術後譫妄預測模型、報告鑑別力之研究；排除：只研究單一因子、以 ICU 非手術病人為對象、會議摘要無完整資料者。第二階段納入：2019–2025 年 65 歲以上、術後住院 ≥ 48 小時；排除：心臟手術、術前已有譫妄或無法評估意識者、術後 24 小時內死亡者。","m5_sample":"第一階段納入篇數無法事先決定；兩位評估者先以 50 篇標題摘要試篩，κ ≥ 0.6 後正式篩選；同一外部驗證之 c 統計量 ≥ 5 篇時以隨機效應模型合併（logit 轉換）。第二階段依 Riley 等人（2020）：候選參數 20 個、預期發生率約 10%、預期 Cox-Snell R² 0.08、收縮係數 0.9，至少需約 2,150 人次、約 215 件事件；本院 2019–2024 年資料遠高於此（教學示意：請以 pmsampsize 實際計算）。","m5_tool":"一、篩選與萃取：Rayyan 篩選；CHARMS 萃取表（族群、預測因子、結果定義、樣本與事件數、模型方法、鑑別力與校準、驗證方式）；先試萃 3 篇修正欄位。\n二、偏誤評估：PROBAST 四面向與整體評等。\n三、第二階段資料欄位：依時間戳記擷取麻醉誘導前之資料；結果以 Nu-DESC 與病歷診斷定義，抽查 100 筆病歷核對。\n四、分析工具：R（metamisc、pmsampsize）、Python（scikit-learn、xgboost、shap），版本寫明。","m5_flow":"一、第 1–2 月：註冊 PROSPERO 並完成檢索；同時送 IRB 與資料申請（第二階段）。\n二、第 3–5 月：兩人獨立篩選、萃取與 PROBAST 評估；完成候選預測因子清單與重新校準基準之選定。\n三、第 5–6 月：取得去識別化資料，建立資料字典與結果定義。\n四、第 6–8 月：依時間切分為訓練（2019–2024）與測試（2025），切分後才補值與標準化；訓練資料內 5 折交叉驗證調參。\n五、第 9 月：於測試資料一次性評估三種模型。","m5_innov":"以系統性回顧決定預測因子與比較基準，並在同一資料中比較「重新校準既有模型」與「自建模型」，使結果直接回答醫院「採用、更新或自建」的決策。","m6_common":"第一階段：以表格整理模型特徵；因子頻率以出現模型數呈現並依 PROBAST 偏誤分層；c 統計量以隨機效應模型（REML）合併並報 95% 預測區間（≥ 5 篇時）。第二階段：顯著水準 α = .05（雙尾）；缺值以多重插補（訓練資料內建立後套用至測試資料）；AUC 以 DeLong 法比較；校準以校準斜率、截距與校準圖；決策曲線；依年齡層與手術類別分組評估。分析以 R 與 Python（版本寫明）執行。","m7_irb":"第一階段只使用已發表文獻，不屬人體研究。第二階段將送本院人體研究倫理審查委員會審查，屬回溯性使用去識別化病歷之研究，預計申請簡易審查並申請免除知情同意，以審查會認定為準；於第 1 月送審。","m7_consent":"第二階段回溯性使用既有醫療紀錄之去識別化資料，研究對象人數龐大且多已出院，無法逐一取得同意，對病人權益影響極小，依《人體研究法》第 12 條第 2 項但書申請免除知情同意，以審查會認定為準。","m7_risk":"第一階段不涉及參與者。第二階段不接觸病人，主要風險為資料外洩與再識別，以去識別化、院內分析環境與權限管控降低；結果以彙總統計呈現並遮蔽小格數。","m7_deid":"資訊室提供去識別化資料，以研究編號取代病歷號，日期以「距手術日天數」呈現；對照表由資訊室保管、研究者不持有。資料只在院內分析環境處理，結果經檢查無小格數後才帶出。萃取表與分析程式碼公開於 OSF；病歷資料保存至研究結束後 3 年，期滿由資訊室刪除。","m7_coi":"研究者與任何譫妄評估或預測系統廠商無財務關係。生成式 AI 僅用於程式除錯與英文潤稿，不輸入病人資料。","m8_feas":"人力：第二位評估者已同意（附錄二），麻醉科主治醫師 1 位擔任臨床顧問。文獻：初步試查已找到 20 篇以上長者術後譫妄預測模型研究。資料：資訊室已確認 Nu-DESC 紀錄自 2019 年起電子化並可串接手術系統。時間：回顧與 IRB／資料申請並行，保留兩個月緩衝。","m9_acad":"提供長者術後譫妄預測模型之最新證據整理與偏誤評估，並以國內資料比較重新校準與自建模型，示範 G→B 由證據到模型之完整流程。","m9_prac":"結果可直接用於麻醉部術前評估規格：若重新校準之既有模型已足夠，可採用簡易模型；若自建模型明顯較佳，提供變項清單與切點建議，並可接續開發提醒介面（A 型）。","m9_limd":"第一階段受限於已發表研究之品質與報告完整性；第二階段為單一醫學中心、未做外部驗證，Nu-DESC 為篩檢工具而非診斷，結果定義可能有誤分類。","m9_lime":"回顧納入研究之結果定義與追蹤期不一，合併結果需謹慎解讀；病歷中認知功能障礙病史可能記錄不完整，將以失智症診斷碼與用藥補足並做敏感度分析。","m9_train":"參與之碩士生將習得預測模型之系統性回顧（CHARMS、PROBAST）、統合分析、臨床資料前處理、模型開發與時間切分驗證（教學示意）。","m9_output":"預計投稿期刊論文 2 篇（系統性回顧、模型開發與驗證）、研討會論文 1 篇，並公開萃取表與分析程式碼（教學示意）。","m9_nation":"回應高齡手術人數增加與病人安全之需求，提供術前譫妄風險評估之實證工具，協助醫院及早啟動預防措施。","t_iv":"術前資料","t_pop":"65 歲以上手術病人","t_out":"術後譫妄之預測","t_des":"系統性回顧與預測模型建置","m10_title":"長者術後譫妄預測模型：系統性回顧與以國內資料之模型建置及時間切分驗證","m10_title_en":"Prediction Models for Postoperative Delirium in Older Adults: A Systematic Review and Model Development with Temporal Validation Using Taiwanese Data","m10_kw":"術後譫妄、高齡者、預測模型、系統性回顧、時間切分驗證","m10_abs":"長者術後譫妄常見且多可預防，文獻中已有許多預測模型，但品質不一、多未經外部驗證，醫院難以判斷採用、更新或自建。本研究旨在系統性整理長者術後譫妄預測模型之預測因子、表現與偏誤，並以本院資料建立與驗證術前預測模型。第一階段依 PRISMA 2020 與 TRIPOD-SRMA 執行系統性回顧，兩人獨立篩選、以 CHARMS 萃取並以 PROBAST 評估偏誤，必要時合併 c 統計量；第二階段使用北部某醫學中心 2019–2025 年 65 歲以上住院手術病人之去識別化資料，以回顧確認之術前因子建立邏輯斯迴歸與 XGBoost，並與重新校準之既有簡易模型比較，以 2025 年資料做時間切分測試，報告 AUC、校準度與決策曲線。預期提供既有模型之證據摘要與本院適用之術前譫妄風險模型。","m10_kw_en":"postoperative delirium; older adults; prediction model; systematic review; temporal validation","m10_abs_en":"Postoperative delirium is common and often preventable in older adults. Many prediction models exist, but their quality varies and most lack external validation, leaving hospitals unsure whether to adopt, update, or develop a model. This study aims to systematically review prediction models for postoperative delirium in older adults and to develop and validate a preoperative model using local data. In phase one, a systematic review following PRISMA 2020 and TRIPOD-SRMA will be conducted; two reviewers will independently screen studies, extract data using the CHARMS checklist, and assess risk of bias with PROBAST, and c-statistics will be pooled when appropriate. In phase two, de-identified records of patients aged 65 years or older undergoing inpatient surgery at a medical center in northern Taiwan from 2019 to 2025 will be used. Logistic regression and XGBoost models based on predictors identified in the review will be compared with a recalibrated existing simple model, trained on 2019–2024 data and tested on 2025 data, reporting the area under the ROC curve, calibration, and decision curve analysis following TRIPOD+AI. The study is expected to provide an evidence summary of existing models and a locally validated preoperative risk model.","m10_refs":"Collins, G. S., Moons, K. G. M., Dhiman, P., Riley, R. D., Beam, A. L., Van Calster, B., et al. (2024). TRIPOD+AI statement: Updated guidance for reporting clinical prediction models that use regression or machine learning methods. BMJ, 385, e078378.\nGaudreau, J.-D., Gagnon, P., Harel, F., Tremblay, A., & Roy, M.-A. (2005). Fast, systematic, and continuous delirium assessment in hospitalized patients: The Nursing Delirium Screening Scale. Journal of Pain and Symptom Management, 29(4), 368–375.\nInouye, S. K., Westendorp, R. G. J., & Saczynski, J. S. (2014). Delirium in elderly people. The Lancet, 383(9920), 911–922.\nMoons, K. G. M., de Groot, J. A. H., Bouwmeester, W., Vergouwe, Y., Mallett, S., Altman, D. G., et al. (2014). Critical appraisal and data extraction for systematic reviews of prediction modelling studies: The CHARMS checklist. PLoS Medicine, 11(10), e1001744.\nPage, M. J., McKenzie, J. E., Bossuyt, P. M., Boutron, I., Hoffmann, T. C., Mulrow, C. D., et al. (2021). The PRISMA 2020 statement: An updated guideline for reporting systematic reviews. BMJ, 372, n71.\nRiley, R. D., Ensor, J., Snell, K. I. E., Harrell, F. E., Martin, G. P., Reitsma, J. B., et al. (2020). Calculating the sample size required for developing a clinical prediction model. BMJ, 368, m441.\nSnell, K. I. E., Levis, B., Damen, J. A. A., Dhiman, P., Debray, T. P. A., Hooft, L., et al. (2023). Transparent reporting of multivariable prediction models for individual prognosis or diagnosis: Checklist for systematic reviews and meta-analyses (TRIPOD-SRMA). BMJ, 381, e073538.\nVan Calster, B., McLernon, D. J., van Smeden, M., Wynants, L., & Steyerberg, E. W. (2019). Calibration: The Achilles heel of predictive analytics. BMC Medicine, 17, 230.\nVickers, A. J., & Elkin, E. B. (2006). Decision curve analysis: A novel method for evaluating prediction models. Medical Decision Making, 26(6), 565–574.\nWolff, R. F., Moons, K. G. M., Riley, R. D., Whiting, P. F., Westwood, M., Collins, G. S., et al. (2019). PROBAST: A tool to assess the risk of bias and applicability of prediction model studies. Annals of Internal Medicine, 170(1), 51–58.","irb_inst":"〔醫院名稱〕；第二階段資料：資訊室提供之去識別化病歷（麻醉部、外科部與護理部）","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：第一階段不屬人體研究；第二階段回溯性使用去識別化病歷，不接觸病人，屬最小風險並申請免除知情同意；是否符合，以送審機構之判定為準。","irb_n":"第二階段：2019–2025 年 65 歲以上住院手術病人之去識別化紀錄，預估約 5 萬人次。","irb_recruit":"不招募參與者；使用既有病歷之去識別化資料。","irb_vuln":"資料含高齡者與可能無法自行同意者（譫妄、失智），但為去識別化回溯資料，不接觸病人。","irb_task":"不適用：本研究不招募參與者，只使用既有醫療紀錄之去識別化資料。","irb_withdraw":"不適用：資料經去識別化，研究者無法辨識個人。","irb_benefit":"研究對象無直接利益；結果可協助未來長者手術病人及早預防譫妄。","irb_harm":"不接觸病人，風險限於資料外洩，以院內分析環境與權限管控降低。對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為去識別化病歷資料，僅存於院內分析環境，保存至研究結束後 3 年，期滿由資訊室刪除；不作本計畫以外之用途。","irb_waive":"是：第二階段回溯性使用去識別化病歷，依《人體研究法》第 12 條第 2 項但書申請免除知情同意，以審查會認定為準。","irb_ad":"不適用：本研究不招募參與者。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責系統性回顧、資料分析與模型開發）；麻醉科主治醫師〔姓名〕（臨床顧問）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。"},"objs":[{"verb":"描述","text":"描述長者術後譫妄預測模型之預測因子、表現與偏誤風險","hyp":"","analysis":"CHARMS 萃取表；PROBAST 評等；因子出現頻率依偏誤分層；c 統計量隨機效應合併與 95% 預測區間","crit":"兩人獨立評估，報 κ；合併需 ≥ 5 篇同一模型之驗證","sens":"排除高偏誤研究後重算因子頻率","exp":"預期多數模型偏誤風險高（樣本小、未報校準）；年齡、認知功能障礙、ASA 分級與急診手術為最常見因子。"},{"verb":"比較","text":"比較自建模型與重新校準之既有簡易模型預測術後譫妄之鑑別力","hyp":"H1：自建模型之 AUC 高於重新校準之既有模型；H0：兩者 AUC 無差異。","analysis":"DeLong 法比較 AUC 與 95% CI；於 2025 年時間切分測試資料評估","crit":"α = .05（雙尾）；AUC 差異之 95% CI 不含 0","sens":"以「Nu-DESC 陽性且病歷記載」之嚴格定義重新分析","exp":"預期自建模型略優；若差異不顯著，表示重新校準之簡易模型已足夠，醫院可優先採用。"},{"verb":"描述","text":"描述最佳模型之校準度、臨床淨效益與分組表現","hyp":"","analysis":"校準斜率與截距、校準圖；決策曲線；依年齡層與手術類別分組 AUC 與校準","crit":"校準斜率接近 1；切點依預防措施可承接之人數事先訂定","sens":"SHAP 檢視主要因子方向是否與文獻一致","exp":"預期模型校準良好；若某手術類別表現較差，將建議該類別另行評估。"}],"vars":[{"name":"既有模型之特徵與偏誤","role":"探索","concept":"文獻中預測模型之品質","oper":"CHARMS 萃取項目；PROBAST 四面向與整體評等","tool":"萃取表","scale":"名目","time":"第一階段","rel":"Moons 等人（2014）；Wolff 等人（2019）"},{"name":"術後 7 日內譫妄","role":"依變項","concept":"術後急性腦功能障礙","oper":"任一班次 Nu-DESC ≥ 2 或病歷譫妄診斷＝1，否則＝0","tool":"護理紀錄與病歷","scale":"名目","time":"術後 7 日內","rel":"Gaudreau 等人（2005）；抽查 100 筆"},{"name":"易感因子","role":"自變項","concept":"病人本身之脆弱性","oper":"年齡、認知功能障礙病史、聽力或視力障礙、共病指數","tool":"電子病歷","scale":"比率／名目","time":"麻醉誘導前","rel":"依時間戳記擷取"},{"name":"術前誘發因子","role":"自變項","concept":"手術與術前狀態","oper":"ASA 分級、手術類別與預計時間、急診手術、白蛋白、鈉、苯二氮平類藥物","tool":"手術麻醉系統與電子病歷","scale":"次序／名目／比率","time":"麻醉誘導前","rel":"依時間戳記擷取"},{"name":"手術類別、年齡層","role":"控制","concept":"分組評估用","oper":"骨科／一般外科／其他；65–79、≥ 80 歲","tool":"手術系統","scale":"名目","time":"手術日","rel":"—"}],"bias":[{"name":"發表偏誤（第一階段）","why":"表現不佳之模型較少發表","fix":"檢索試驗與研究登錄；以預測區間呈現異質性"},{"name":"萃取錯誤","why":"模型資訊報告不完整或抄錄錯誤","fix":"兩人獨立萃取並核對；不明者聯絡原作者"},{"name":"資料洩漏（第二階段）","why":"使用術中或術後資料，或切分前補值","fix":"只用麻醉誘導前資料；先時間切分再以訓練資料建立參數"},{"name":"結果誤分類","why":"Nu-DESC 為篩檢工具，低活動型譫妄易漏","fix":"結合病歷診斷定義；以嚴格定義做敏感度分析"}],"gantt":{"n":12,"rows":[{"t":"PROSPERO 註冊與檢索","s":1,"e":2},{"t":"IRB 送審與核准（第二階段）","s":1,"e":2},{"t":"篩選、萃取與 PROBAST","s":3,"e":5},{"t":"資料申請與資料字典","s":3,"e":5},{"t":"資料清理與時間切分","s":6,"e":6},{"t":"模型訓練與調整","s":7,"e":8},{"t":"測試資料評估與解釋","s":9,"e":9},{"t":"論文撰寫","s":9,"e":11},{"t":"緩衝（資料延誤、補分析）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"納入模型過多","trig":"全文篩選後超過 60 篇","when":"M3","plan":"限縮至有外部驗證或樣本 ≥ 200 之研究並說明"},{"r":"資料申請延誤","trig":"第 5 月仍未取得資料","when":"M5","plan":"先完成回顧撰寫並以公開資料建立分析流程；使用緩衝月"},{"r":"既有模型因子在本院資料缺漏","trig":"某因子缺值超過 50%","when":"M6","plan":"以代理變項替代或移除，並於結果說明"},{"r":"模型未優於重新校準基準","trig":"AUC 差異 95% CI 含 0","when":"M9","plan":"如實報告，建議採用簡易模型，此結果本身即具決策價值"}],"kpi":[{"name":"完成系統性回顧（產出指標）","calc":"完成篩選、萃取、PROBAST 與合併分析","base":"0","goal":"第 5 月前完成"},{"name":"最佳模型 AUC（成果指標）","calc":"2025 年測試資料 AUC 與 95% CI","base":"重新校準既有模型之 AUC","goal":"高於基準或確認基準已足夠"}],"ss":{}}},"HB":{"label":"H→B 找風險因子再建模：多重用藥與跌倒","grp":1,"data":{"meta":{"type":"H","type2":"B AI 模型建置"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"長者多重用藥常見，部分藥物增加跌倒風險；藥師與醫師缺乏可快速辨識高跌倒風險長者的工具。","s1_2":"衛生福利資料科學中心之全民健保資料：65 歲以上長者。","s1_3":"第一階段：多重用藥（5 種以上）暴露；第二階段：以健保資料建立之跌倒住院風險預測模型。","s1_4":"第一階段：跌倒住院之調整後 HR；第二階段：模型 AUC 與校準度。","s1_5":"多重用藥是否增加長者跌倒住院風險？能否據此建立準確的風險預測模型？","s1_6":"H→B：回溯性世代研究（Cox）找出風險因子，再以同一資料建立並時間切分驗證預測模型。","s1_7":"IRB 核准後向衛生福利資料科學中心申請；申請免除知情同意。","s1_8":"12 個月：IRB 與資料申請 4 個月、世代分析 3 個月、建模 3 個月，保留兩個月緩衝。","s1_9":"提供多重用藥與跌倒之本土證據，以及可供用藥整合服務篩選之風險模型。","m1_scene":"世界衛生組織指出，65 歲以上長者每年約有 28–35% 曾經跌倒，且比例隨年齡增加（World Health Organization, 2007）；跌倒住院常造成髖部骨折、失能與長期照護需求。長者因多種慢性病同時服用多種藥物，部分鎮靜安眠、抗精神病、降血壓與降血糖藥物會增加頭暈、低血壓與跌倒風險，藥品數越多，交互作用與副作用的機會也越大。","m1_gap":"現行用藥整合服務多以「藥品數量」或「就醫院所數」篩選個案，無法區分同樣多重用藥的長者中，哪些人跌倒風險最高；藥師人力有限，若篩選不精準，真正高風險者可能排不到服務。國內也缺乏以本土資料建立、校準良好且可直接用於篩選的跌倒風險工具。","m1_new":"多重用藥常以同時使用 5 種以上藥品定義（Masnoon et al., 2017）；以健保資料可長期追蹤用藥與跌倒住院（Hsieh et al., 2019），並以目標試驗模擬框架降低設計偏誤（Hernán & Robins, 2016）。在確認風險因子後，以同一資料建立預測模型可直接產出篩選工具，但需遵守預測模型的樣本數與報告準則（Riley et al., 2020；Collins et al., 2024），並以時間切分驗證模擬實際使用情境。","m1_time":"健保署持續推動用藥整合與藥事照護，社區藥局與醫院藥劑部正擴大長者用藥評估服務，需要更精準的高風險長者篩選工具；健保資料可回溯分析，一年內即可提供關聯證據與模型。","m1_stmt":"因此，本研究擬先以全民健保資料探討長者多重用藥與 1 年內跌倒住院之關聯，再以同一資料建立並以時間切分驗證跌倒住院風險預測模型。","m2_pico":"第一階段 PECO｜P：65 歲以上長者｜E：多重用藥（≥ 5 種）｜C：用藥 < 5 種｜O：1 年內跌倒住院。第二階段｜P：同上｜I（預測因子）：用藥類別、共病、年齡、過去跌倒｜O：1 年內跌倒住院；AUC、校準","m2_search":"PubMed：（\"Polypharmacy\"[Mesh] OR polypharmacy[tiab]）AND（\"Accidental Falls\"[Mesh] OR fall*[tiab]）AND（\"Aged\"[Mesh] OR older[tiab]）AND（cohort[tiab] OR \"prediction model\"[tiab]）\n華藝：（多重用藥）AND（跌倒）AND（長者 OR 老人）\n限制：2010 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、多重用藥定義。Masnoon 等人（2017）回顧多重用藥定義，最常見為同時使用 5 種以上藥品。對本研究的意義：以 5 種為主要定義，並以 10 種做敏感度分析。\n二、次級資料研究方法。全民健保資料適合長期追蹤（Hsieh et al., 2019）；以目標試驗模擬框定設計（Hernán & Robins, 2016），以傾向分數控制干擾（Austin, 2011），處理死亡競爭風險（Fine & Gray, 1999），依 RECORD 報告（Benchimol et al., 2015）。\n三、預測模型。依 Riley 等人（2020）估算樣本數、Steyerberg 與 Vergouwe（2014）之步驟開發與驗證，以 SHAP 解釋（Lundberg & Lee, 2017），依 TRIPOD+AI 報告（Collins et al., 2024）。","m2_known":"多重用藥已有常用定義（Masnoon et al., 2017），健保資料可支持長期世代與預測研究（Hsieh et al., 2019）。","m2_unknown":"然而，以臺灣全民健保資料同時估計多重用藥與跌倒住院之關聯（控制共病、過去跌倒與死亡競爭風險），並據以建立經時間切分驗證、報告校準度與臨床淨效益之篩選模型的研究仍缺乏。","m2_worth":"此缺口使用藥整合服務無法精準鎖定高風險長者；本研究以兩階段提供本土風險證據與可用於篩選之模型，並說明模型是否優於僅用年齡與藥品數之簡單規則。","m2_theory":"第一階段以目標試驗模擬框定（Hernán & Robins, 2016）；第二階段依 CRISP-DM 與 TRIPOD+AI。兩階段銜接：第一階段確認之風險因子與時間窗，作為第二階段預測因子之候選與定義。","m2_orig":"本計畫以同一份全國資料先估計關聯再建立預測模型，並以時間切分驗證，使結果可直接轉為用藥整合服務之篩選工具。","m3_rq":"多重用藥是否增加長者 1 年內跌倒住院風險？據此建立之預測模型表現如何？","m3_terms":"多重用藥：index 日前 90 天內同時使用 5 種以上不同成分之慢性處方藥（Masnoon et al., 2017）。\nindex 日：世代進入年度之 1 月 1 日（landmark 設計）；暴露與共變項以 index 日前之資料定義，追蹤自 index 日開始，避免不死時間偏誤。\n跌倒住院：index 日後 1 年內以跌倒外因碼（ICD-10-CM W00–W19）住院。\n時間切分驗證：以 2017–2020 年世代訓練、2021 年世代測試（追蹤至 2022 年底）。","m3_scope":"研究範圍為 2017–2021 年各年 1 月 1 日時 65 歲以上、前一年持續投保之長者，各追蹤 1 年（資料涵蓋 2016–2022 年）；本研究估計關聯並建立與驗證模型，不推論因果，不將模型上線，亦不評估使用模型後之跌倒預防成效。","m4_frame":"第一階段：暴露為多重用藥，結果為 1 年內跌倒住院，共變項為年齡、性別、共病、過去跌倒、跌倒相關藥物類別；死亡為競爭風險。第二階段：以第一階段之變項定義為候選預測因子，訓練邏輯斯迴歸（基準）與 XGBoost，時間切分驗證。","m5_design":"本研究採兩階段設計（H→B）：第一階段為回溯性世代研究（目標試驗模擬、Cox 與競爭風險），第二階段為預測模型開發與時間切分驗證，分別依 RECORD 與 TRIPOD+AI 報告。","m5_reject":"不只做關聯分析，因關聯無法直接用於個別長者篩選；不直接建模，因未先確認風險因子與定義，模型可能納入不合理或時序錯誤之變項；第一階段不採病例對照設計，因無法估計發生率，且用藥暴露期之界定較易出錯。","m5_site":"資料來源為衛生福利資料科學中心之全民健保資料（門住診、藥局處方、承保與死因檔），涵蓋 2016–2022 年；研究者將於 IRB 核准後申請，資料只在中心指定分析環境處理（附錄二：申請流程與預估時程）。","m5_incl":"納入：2017–2021 年各年 1 月 1 日（index 日）時 65 歲以上，且 index 前投保滿 1 年者；同一人可於不同年度進入世代，第一階段主分析只取第一次進入。排除：index 前 30 天內因跌倒住院者；index 時住在長照機構者（無法以健保資料確認時，以敏感度分析處理）；index 前 1 年無任何就醫紀錄者（無法評估用藥）。","m5_sample":"第一階段以 Schoenfeld（1983）公式：HR = 1.2、α = .05 雙尾、檢定力 .80、暴露比例 40%，需約 984 件事件。第二階段依 Riley 等人（2020）：候選參數 25 個、發生率約 4%、Cox-Snell R² 0.04，至少需約 5,500 人、約 220 件事件；健保資料遠高於此（教學示意：請以實際資料重新計算）。","m5_tool":"一、代碼表：多重用藥（ATC 碼）、跌倒外因碼、共病 ICD-10-CM 與時間窗。\n二、跌倒相關藥物類別：鎮靜安眠、抗精神病、降血壓、降血糖、鴉片類等。\n三、分析軟體：SAS 或 R（世代分析）、Python（scikit-learn、xgboost、shap）（依中心環境，版本寫明）。","m5_flow":"一、第 1–2 月：IRB 送審並申請免除知情同意。\n二、第 2–4 月：向衛生福利資料科學中心申請資料（第 2 月送件）。\n三、第 5–7 月：建立世代與代碼定義；第一階段 Cox 與競爭風險分析。\n四、第 8–10 月：第二階段以 2017–2020 年訓練、2021 年測試，建模與評估。\n五、結果依中心規定遮蔽小格數，經審查後帶出。","m5_innov":"以同一份全國資料完成「關聯 → 預測」兩階段，並以時間切分驗證與 SHAP 提供可解釋之篩選模型。","m6_common":"顯著水準 α = .05（雙尾）。第一階段：每千人年發生率；Cox 模型調整後 HR，Fine–Gray 模型處理死亡競爭風險，IPTW 為次要分析（SMD < 0.1）。第二階段：AUC（DeLong 95% CI）、校準斜率與校準圖、決策曲線；先時間切分再補值與標準化。分析以 SAS／R／Python（版本寫明）執行。","m7_irb":"本研究將送〔大學〕研究倫理審查委員會審查，屬使用去識別化次級資料之研究，兩階段一併送審，預計申請簡易審查並申請免除知情同意，以審查會認定為準；於第 1 月送審，核准後才向中心申請資料。","m7_consent":"本研究使用加密去識別化之全民健保資料，無法辨識個人且無法逐一取得同意，依《人體研究法》第 12 條第 2 項但書（屬主管機關公告得免取得同意之研究案件範圍）申請免除知情同意，以審查會認定為準。","m7_risk":"本研究不接觸個人，不影響其就醫；主要風險為資料外洩與再識別。資料僅於中心環境分析，結果以彙總統計呈現並遮蔽小格數；模型係數與 SHAP 結果不含個人層級資料。","m7_deid":"資料由中心加密去識別化提供，研究者無法辨識個人；只在中心環境分析，原始資料不得攜出，結果經中心審查並遮蔽小格數後才帶出。分析程式碼保存於研究者電腦並以 Git 管理，資料依中心規定期限保存與銷毀。","m7_coi":"研究者與任何藥廠無財務關係。生成式 AI 僅用於程式除錯，不輸入任何資料。","m8_feas":"資料：衛生福利資料科學中心可提供所需檔案與年份（附錄二）；健保資料之長者人數遠高於 Schoenfeld 與 Riley 準則之需求。人力：指導教授具健保資料與預測模型研究經驗；研究者已修習存活分析與機器學習課程。工具：中心環境可使用 SAS、R 與 Python。時間：資料申請預留 3 個月並於第 2 月送件，保留兩個月緩衝。","m9_acad":"提供多重用藥與跌倒住院之本土世代證據，並示範由關聯研究延伸至預測模型（H→B）之完整流程：同一套變項定義與時間窗，先回答「有沒有關聯」，再回答「能不能用來篩選」。","m9_prac":"模型與風險分級表可供用藥整合服務篩選高風險長者，並依「每月可承接個案數」選擇切點；若表現良好，可接續開發藥師端提醒工具（A 型）並評估成效（C 型）。","m9_limd":"觀察性資料無法排除未測量干擾（如身體功能、步態、居家環境、自費藥物），結果為關聯而非因果；模型僅做時間切分之內部驗證，未做外部驗證。","m9_lime":"健保資料只記錄就醫之跌倒，未就醫之跌倒無法得知，可能低估風險；處方不等於實際服用。將於限制中說明偏誤方向，並以跌倒相關骨折診斷做敏感度分析。","m9_train":"參與之碩士生將習得健保資料分析、Cox 與競爭風險、預測模型開發與 TRIPOD+AI 報告（教學示意）。","m9_output":"預計投稿期刊論文 2 篇（世代研究、預測模型各 1 篇）（教學示意）。","m9_nation":"回應高齡用藥安全與跌倒預防政策，提供用藥整合服務篩選之實證工具。","t_iv":"多重用藥","t_pop":"65 歲以上長者","t_out":"跌倒住院風險與預測模型","t_des":"回溯性世代與預測模型研究","m10_title":"長者多重用藥與跌倒住院風險：全民健保資料之世代研究與預測模型建置","m10_title_en":"Polypharmacy and Risk of Fall-Related Hospitalization among Older Adults: A Cohort Study and Prediction Model Development Using Taiwan's National Health Insurance Data","m10_kw":"多重用藥、跌倒、長者、預測模型、全民健保資料","m10_abs":"長者多重用藥常見，部分藥物增加跌倒風險，但用藥整合服務缺乏可精準辨識高風險長者之工具。本研究旨在探討多重用藥與 1 年內跌倒住院之關聯，並建立風險預測模型。第一階段以全民健保資料進行 landmark 世代研究，以各年 1 月 1 日為 index 日，以 Cox 與 Fine–Gray 模型估計多重用藥之調整後風險比，並以傾向分數加權做次要分析；第二階段以同一套變項定義為候選預測因子，訓練邏輯斯迴歸與 XGBoost，以 2017–2020 年世代訓練、2021 年世代測試，報告 AUC、校準度、決策曲線與 SHAP，並與僅用年齡及藥品數之基準模型比較。預期多重用藥與跌倒住院風險相關，模型可供用藥整合服務篩選高風險長者。","m10_refs":"Austin, P. C. (2011). An introduction to propensity score methods for reducing the effects of confounding in observational studies. Multivariate Behavioral Research, 46(3), 399–424.\nBenchimol, E. I., Smeeth, L., Guttmann, A., Harron, K., Moher, D., Petersen, I., et al. (2015). The REporting of studies Conducted using Observational Routinely-collected health Data (RECORD) statement. PLoS Medicine, 12(10), e1001885.\nCollins, G. S., Moons, K. G. M., Dhiman, P., Riley, R. D., Beam, A. L., Van Calster, B., et al. (2024). TRIPOD+AI statement: Updated guidance for reporting clinical prediction models that use regression or machine learning methods. BMJ, 385, e078378.\nFine, J. P., & Gray, R. J. (1999). A proportional hazards model for the subdistribution of a competing risk. Journal of the American Statistical Association, 94(446), 496–509.\nHernán, M. A., & Robins, J. M. (2016). Using big data to emulate a target trial when a randomized trial is not available. American Journal of Epidemiology, 183(8), 758–764.\nHsieh, C.-Y., Su, C.-C., Shao, S.-C., Sung, S.-F., Lin, S.-J., Kao Yang, Y.-H., & Lai, E. C.-C. (2019). Taiwan's National Health Insurance Research Database: Past and future. Clinical Epidemiology, 11, 349–358.\nLundberg, S. M., & Lee, S.-I. (2017). A unified approach to interpreting model predictions. Advances in Neural Information Processing Systems, 30.\nMasnoon, N., Shakib, S., Kalisch-Ellett, L., & Caughey, G. E. (2017). What is polypharmacy? A systematic review of definitions. BMC Geriatrics, 17, 230.\nRiley, R. D., Ensor, J., Snell, K. I. E., Harrell, F. E., Martin, G. P., Reitsma, J. B., et al. (2020). Calculating the sample size required for developing a clinical prediction model. BMJ, 368, m441.\nSchoenfeld, D. A. (1983). Sample-size formula for the proportional-hazards regression model. Biometrics, 39(2), 499–503.\nSteyerberg, E. W., & Vergouwe, Y. (2014). Towards better clinical prediction models: Seven steps for development and an ABCD for validation. European Heart Journal, 35(29), 1925–1931.\nWorld Health Organization. (2007). WHO global report on falls prevention in older age. World Health Organization.","irb_inst":"〔大學名稱〕〔系所〕；資料來源：衛生福利資料科學中心（全民健保資料）","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查（或依送審機構認定之免除審查）：使用加密去識別化之全民健保資料，不接觸個人，屬最小風險；以審查會判定為準。","irb_n":"2017–2021 年 65 歲以上符合條件之長者（預估數十萬人，依中心資料；不接觸個人）。","irb_recruit":"不適用：本研究不招募參與者。","irb_vuln":"資料包含高齡者；因資料已加密去識別化且不接觸個人，不另設招募保護措施。","irb_task":"不適用：不需要任何人做任何事；研究只分析已存在的健保資料。","irb_withdraw":"不適用個別撤回：資料已加密去識別化，研究者無法辨識個人。","irb_benefit":"個人無直接利益；研究結果可能改善長者用藥安全。","irb_harm":"主要風險為資料外洩；資料僅於中心環境處理，依中心規定管理。","irb_material":"研究材料為中心環境中之分析資料與帶出之彙總結果；依中心規定期限保存與銷毀，不作本計畫以外之用途。","irb_waive":"是。本研究使用加密去識別化之全民健保資料，無法辨識個人，且無法逐一取得同意，對個人權益影響極小；依《人體研究法》第 12 條第 2 項但書（屬主管機關公告得免取得同意之研究案件範圍）申請免除知情同意，以審查會認定為準。","irb_ad":"不適用：本研究不招募參與者。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責資料申請、世代分析與預測模型）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"polypharmacy; falls; older adults; prediction model; National Health Insurance Research Database","m10_abs_en":"Polypharmacy is common among older adults, and some medications increase the risk of falls, yet medication review services lack tools to identify those at highest risk. This study aims to examine the association between polypharmacy and fall-related hospitalization within one year and to develop a risk prediction model. In phase one, a landmark cohort study will be conducted using Taiwan's National Health Insurance data, with January 1 of each year from 2017 to 2021 as the index date for adults aged 65 years or older. Adjusted hazard ratios for polypharmacy will be estimated using Cox models and Fine–Gray models for the competing risk of death, with inverse probability of treatment weighting as a secondary analysis. In phase two, candidate predictors defined in phase one will be used to train logistic regression and XGBoost models on the 2017–2020 cohorts and to test them on the 2021 cohort. Performance will be reported as the area under the ROC curve, calibration, decision curve analysis, and SHAP values, compared with a baseline model using age and number of medications, following RECORD and TRIPOD+AI. Polypharmacy is expected to be associated with higher risk, and the model is expected to help medication review services identify high-risk older adults."},"objs":[{"verb":"檢驗","text":"檢驗多重用藥與長者 1 年內跌倒住院之關聯","hyp":"H1：調整共變項後，多重用藥者跌倒住院風險較高（HR > 1）；H0：HR = 1。","analysis":"Cox 比例風險模型；Fine–Gray 競爭風險；IPTW 次要分析","crit":"α = .05（雙尾）；調整後 HR 與 95% CI；SMD < 0.1","sens":"以 10 種以上藥品定義；排除長照機構住民","exp":"預期多重用藥風險較高，跌倒相關藥物類別影響最大。"},{"verb":"比較","text":"比較預測模型與僅用年齡及藥品數之基準模型的鑑別力","hyp":"H1：最佳模型 AUC 高於基準模型；H0：兩者無差異。","analysis":"DeLong 法比較 AUC；2021 年資料時間切分測試","crit":"α = .05（雙尾）；AUC 差異 95% CI 不含 0","sens":"依性別與年齡層分組評估","exp":"預期加入藥物類別與共病後鑑別力提升；若無差異，表示藥品數已足以篩選。"},{"verb":"描述","text":"描述最佳模型之校準度、篩選切點表現與主要預測因子","hyp":"","analysis":"校準斜率與校準圖；切點下之敏感度、特異度；決策曲線；SHAP","crit":"切點依用藥整合服務可承接之個案量事先訂定","sens":"—","exp":"預期模型校準良好，鎮靜安眠藥與過去跌倒為主要預測因子。"}],"vars":[{"name":"多重用藥","role":"自變項","concept":"同時使用多種藥物","oper":"index 前 90 天同時使用 ≥ 5 種慢性處方藥成分","tool":"藥局處方檔","scale":"名目","time":"index 前 90 天（index 為各年 1 月 1 日）","rel":"Masnoon 等人（2017）"},{"name":"跌倒住院","role":"依變項","concept":"跌倒造成之住院","oper":"index 後 1 年內 W00–W19 外因碼住院","tool":"住院檔","scale":"名目（時間至事件）","time":"index 後 1 年","rel":"代碼表"},{"name":"跌倒相關藥物類別","role":"自變項","concept":"增加跌倒風險之藥物","oper":"各類別 ATC 碼使用（是／否）","tool":"藥局處方檔","scale":"名目","time":"index 前 90 天","rel":"代碼表"},{"name":"過去跌倒","role":"控制","concept":"跌倒史","oper":"index 前 1 年跌倒就醫","tool":"門住診檔","scale":"名目","time":"index 前 1 年","rel":"代碼表"},{"name":"共病、年齡、性別","role":"控制","concept":"背景與共病負擔","oper":"Charlson 共病指數等","tool":"門住診與承保檔","scale":"比率／名目","time":"index 前 1 年","rel":"—"},{"name":"死亡","role":"控制","concept":"競爭風險","oper":"死因檔死亡日期","tool":"死因檔","scale":"名目","time":"追蹤期間","rel":"—"}],"bias":[{"name":"適應症干擾","why":"多重用藥者本身病況較重","fix":"調整共病指數、過去跌倒與前一年就醫次數；IPTW 次要分析；以藥品數連續變項檢視劑量反應"},{"name":"不死時間偏誤","why":"若以「開始多重用藥日」為暴露組起點、對照組起點不同，會錯算暴露前時間","fix":"landmark 設計：所有人以同一日（1 月 1 日）為 index，暴露以 index 前 90 天定義"},{"name":"資料洩漏（第二階段）","why":"切分前補值或標準化","fix":"先時間切分，再只用訓練資料建立參數"},{"name":"結果誤分類","why":"未住院之跌倒無法得知；申報資料之跌倒外因碼可能記錄不完整","fix":"限制中說明；以跌倒相關傷害診斷（如髖部骨折）及門急診跌倒就醫做敏感度分析"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":2},{"t":"資料申請（第 2 月送件）","s":2,"e":4},{"t":"世代建立與第一階段分析","s":5,"e":7},{"t":"第二階段建模與時間切分驗證","s":8,"e":10},{"t":"結果審查與帶出","s":10,"e":10},{"t":"論文撰寫","s":9,"e":11},{"t":"緩衝（申請延誤、補分析）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"資料申請延誤","trig":"第 4 月仍未核准","when":"M4","plan":"先以文件建立程式；使用緩衝月"},{"r":"事件數不足","trig":"跌倒住院發生率低於預期","when":"M6","plan":"延長追蹤至 2 年或納入門急診跌倒"},{"r":"模型表現不佳","trig":"AUC 未優於基準","when":"M10","plan":"如實報告，討論藥品數之篩選價值"},{"r":"世代重複進入造成相依","trig":"同一人多年度進入世代","when":"M5","plan":"第一階段只取第一次進入；第二階段主分析保留時間切分，另以「測試資料排除曾出現於訓練資料者」做敏感度分析"}],"kpi":[{"name":"多重用藥調整後 HR（成果指標）","calc":"Cox 主要分析結果與 95% CI","base":"—","goal":"第 7 月完成"},{"name":"預測模型 AUC（成果指標）","calc":"2021 年測試資料 AUC 與 95% CI","base":"基準模型 AUC","goal":"高於基準"}],"ss":{}}},"BA":{"label":"B→A 先建模再做成系統：住院壓傷風險預測與護理提醒介面","grp":1,"data":{"meta":{"type":"A","type2":"B AI 模型建置"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"住院病人院內壓傷造成疼痛、感染與住院延長；Braden 量表依賴護理師主觀評分，高風險標記太多，護理師難以判斷誰最需要優先處置。","s1_2":"第一階段：北部某醫學中心 2020–2025 年 18 歲以上住院病人電子病歷；第二階段：該院內外科病房護理師。","s1_3":"第一階段：以入院 24 小時內資料建立之壓傷風險預測模型；第二階段：嵌入護理資訊系統之風險提醒介面。","s1_4":"第一階段：住院期間新發生 2 期以上壓傷；AUC、校準度、決策曲線。第二階段：任務完成率、提醒理解正確率、SUS、NASA-TLX。","s1_5":"入院 24 小時內資料建立之模型能否優於 Braden 量表預測院內壓傷？據此開發之提醒介面護理師是否好用、看得懂？","s1_6":"B→A：回溯性預測模型開發與時間切分驗證，再以設計科學研究法開發並評估提醒介面。","s1_7":"第一階段使用去識別化病歷並申請免除知情同意；第二階段護理師書面同意；模擬測試不使用真實病人資料。","s1_8":"12 個月：IRB 與資料申請 3 個月、建模與驗證 3 個月、介面需求與開發 3 個月、可用性評估 2 個月，保留兩個月緩衝。","s1_9":"提供經時間切分驗證之壓傷風險模型與護理師看得懂、願意用的提醒介面雛型，作為上線試辦的依據。","m1_scene":"院內壓傷是住院病人常見且多可預防的不良事件，會造成疼痛、感染、住院天數延長與醫療費用增加，也是醫院評鑑與病人安全的重要指標。國際指引建議入院後盡早完成風險評估，並針對高風險者採取減壓、翻身與營養等預防措施（European Pressure Ulcer Advisory Panel et al., 2019）。北部某醫學中心每年住院約 6 萬人次，院內 2 期以上壓傷發生率約 1–2%（院內品管資料，教學示意），每一件都代表一次可能被提早預防的傷害。","m1_gap":"現行以 Braden 量表進行風險評估（Bergstrom et al., 1987），由護理師依感覺知覺、潮濕、活動、移動、營養與摩擦力六項主觀評分；在高齡、重症比例高的病房，多數病人都被標為高風險，提醒過多反而使護理師無從判斷誰最需要優先處置。即使有更準確的模型，若結果只是一個數字或不斷跳出的警示視窗，護理師也可能看不懂或直接關閉，模型無法轉化為行動。","m1_new":"以電子病歷之檢驗、生命徵象、用藥與護理評估資料建立機器學習預測模型，已有研究顯示可能優於傳統量表，但多數只報 AUC、少做時間切分驗證與校準評估（Van Calster et al., 2019；Collins et al., 2024）。另一方面，AI 臨床決策輔助在早期臨床評估階段，須同時檢視人因與使用情境（DECIDE-AI；Vasey et al., 2022）；設計科學研究法以使用者參與之迭代開發與評估，正好補上「模型準 → 介面能用」的距離（Hevner et al., 2004）。","m1_time":"本院護理部預計於 2027 年更新護理資訊系統之風險評估模組，資訊室已開放去識別化研究資料申請；本研究可在模組規格定案前，先提供經驗證之模型表現與經護理師評估之介面設計，避免「先上線、再修改」的高成本。","m1_stmt":"因此，本研究擬先以入院 24 小時內之電子病歷資料建立並以時間切分驗證院內壓傷風險預測模型，再以設計科學研究法開發並評估嵌入護理資訊系統之風險提醒介面。","m2_pico":"第一階段｜P：18 歲以上住院病人｜I（預測因子）：入院 24 小時內之人口學、診斷、生命徵象、檢驗、用藥與護理評估資料｜C：僅以 Braden 總分預測（基準）｜O：住院期間新發生 2 期以上壓傷；AUC、校準度、決策曲線。第二階段｜P：內外科病房護理師｜I：風險提醒介面｜C：現行 Braden 評估畫面（需求分析時比較）｜O：任務完成率、提醒理解正確率、SUS、NASA-TLX","m2_search":"PubMed：（\"Pressure Ulcer\"[Mesh] OR \"pressure injur*\"[tiab] OR \"pressure ulcer*\"[tiab]）AND（\"Machine Learning\"[Mesh] OR \"prediction model\"[tiab] OR \"risk prediction\"[tiab]）AND（\"Electronic Health Records\"[Mesh] OR \"electronic health record*\"[tiab] OR inpatient*[tiab]）\nPubMed（第二階段）：（\"Decision Support Systems, Clinical\"[Mesh] OR alert*[tiab]）AND（nurs*[tiab]）AND（usability[tiab] OR \"user-centered design\"[tiab]）\n華藝：（壓傷 OR 壓瘡）AND（預測 OR 機器學習 OR 提醒）\n限制：2015 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、壓傷風險評估工具。Braden 量表為最常用之壓傷風險評估工具（Bergstrom et al., 1987），但在高風險族群中特異度有限，國際指引建議以結構化評估結合臨床判斷（European Pressure Ulcer Advisory Panel et al., 2019）。對本研究的意義：新模型須以 Braden 總分為基準比較，並報告在可承受警示量下之敏感度。\n二、預測模型的開發與驗證。Riley 等人（2020）提出預測模型樣本數準則；Van Calster 等人（2019）指出校準度常被忽略；TRIPOD+AI 要求完整報告資料、模型與驗證（Collins et al., 2024）。對本研究的意義：以時間切分驗證、報告校準與決策曲線（Vickers & Elkin, 2006）。\n三、從模型到介面。DECIDE-AI 強調 AI 決策輔助在早期臨床評估須檢視人因、使用者理解與工作負荷（Vasey et al., 2022）；設計科學研究法以需求分析、迭代開發與評估產出人工物（Peffers et al., 2007），可用性以 SUS（Brooke, 1996）、工作負荷以 NASA-TLX（Hart & Staveland, 1988）測量。本研究初步檢索（附錄一）未見國內同時完成壓傷模型時間切分驗證與護理提醒介面可用性評估之研究（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已顯示電子病歷資料可用於建立壓傷預測模型，且已有明確的樣本數、驗證與報告準則（Riley et al., 2020；Collins et al., 2024），以及評估 AI 決策輔助人因之框架（Vasey et al., 2022）。","m2_unknown":"然而，以國內醫學中心資料、限定入院 24 小時內可得資訊、經時間切分驗證並與 Braden 量表比較之模型仍少；模型結果如何呈現才能讓護理師看得懂、願意依提醒行動，更缺乏經使用者參與設計與可用性評估之證據。","m2_worth":"此缺口使醫院面臨「模型準但沒人用」或「介面好看但模型不準」的風險；本研究以兩階段同時回答「準不準」與「能不能用」，提供護理資訊系統改版的完整依據。","m2_theory":"第一階段以 CRISP-DM 流程與 TRIPOD+AI 報告準則（Collins et al., 2024）建立與驗證模型；第二階段以設計科學研究法（Hevner et al., 2004；Peffers et al., 2007）開發介面，並依 DECIDE-AI（Vasey et al., 2022）檢視人因面向；第一階段之模型表現與主要預測因子為第二階段之設計輸入。","m2_orig":"本計畫將預測模型之時間切分驗證與護理提醒介面之迭代開發串成一個研究，以第一階段之切點與 SHAP 結果設計第二階段之風險說明，並以提醒理解正確率檢驗護理師是否真正看懂模型輸出。","m3_rq":"入院 24 小時內資料建立之模型預測院內壓傷是否優於 Braden 量表？據此開發之提醒介面可用性如何？","m3_terms":"院內壓傷：入院 24 小時後新發生、經傷口護理師確認之 2 期以上壓傷（含深部組織損傷與無法分期），以院內壓傷通報系統為準。\n預測時點：入院後 24 小時，只使用此時點前已產生之資料。\n提醒理解正確率：護理師閱讀模擬病人之風險提醒後，正確回答「風險等級、主要原因、建議措施」三題之比例。\n可用性：以任務完成率、操作時間、SUS 測量；工作負荷以 NASA-TLX 測量。","m3_scope":"研究範圍為北部某醫學中心 2020–2025 年 18 歲以上住院病人（排除入院時已有 2 期以上壓傷與入院 24 小時內出院或死亡者）及其內外科病房護理師，研究期間 12 個月。本研究建立與驗證模型並開發與評估介面雛型；不將系統上線，不評估使用後之壓傷發生率（需後續 C 型介入研究），亦不納入影像與自由文字護理紀錄。","m4_frame":"第一階段（B）：候選預測因子（年齡、BMI、入院科別、主要診斷、Braden 各分項、意識、活動程度、白蛋白、血紅素、血糖、使用升壓劑或鎮靜劑、是否插管）→ 住院期間新發生壓傷；以 2020–2024 年資料訓練、2025 年資料測試，比較邏輯斯迴歸、XGBoost 與 Braden 總分基準。第二階段（A）：以第一階段之切點、主要預測因子與護理師需求設計介面（風險等級、主要原因、建議措施），經兩輪形成性評估修正，最後以總結性評估測量任務完成率、提醒理解正確率、SUS 與 NASA-TLX。","m5_design":"本研究採兩階段設計（B→A）：第一階段為回溯性預測模型開發與時間切分驗證（依 TRIPOD+AI 報告）；第二階段以設計科學研究法開發風險提醒介面，經需求焦點團體、兩輪形成性評估與一次總結性評估。","m5_reject":"不只建立模型，因模型輸出若未經使用者參與設計，護理師可能看不懂或忽略提醒；不直接開發介面，因未確認模型優於 Braden 量表前，投入系統開發可能浪費資源；第一階段不採隨機切分驗證，因無法反映模型在未來資料上的表現。","m5_site":"研究場域為北部某醫學中心（約 2,000 床，年住院約 6 萬人次）。第一階段資料來源為院內電子病歷與壓傷通報系統，IRB 核准後向資訊室申請去識別化資料，僅於院內分析環境處理；第二階段於內外科 8 個病房招募護理師，護理部已書面同意（附錄二）。第二階段對象：需求焦點團體護理師 2 組各 6 人；形成性評估專家 3 位（傷口護理師 1、護理資訊 1、人因工程 1）與每輪護理師 5 人；總結性評估護理師 15 人。","m5_incl":"第一階段納入：2020–2025 年 18 歲以上、住院 ≥ 48 小時之病人（同一人多次住院各次計入，敏感度分析只取第一次）；排除：入院時已有 2 期以上壓傷、入院 24 小時內出院或死亡、產科與精神科病房。第二階段納入：內外科病房在職護理師、年資 6 個月以上；排除：參與需求焦點團體者不參加總結性評估。","m5_sample":"第一階段依 Riley 等人（2020）準則：候選參數 20 個、預期發生率約 2%、預期 Cox-Snell R² 0.03、收縮係數 0.9，至少需約 5,900 筆住院、約 118 件事件；本院 2020–2024 年資料量遠高於此（教學示意：請以實際資料量與 pmsampsize 計算結果改寫）。第二階段形成性評估以 5 位使用者為一輪，共 2 輪；總結性評估護理師 15 人，屬描述性可用性評估，不做推論檢定。","m5_tool":"一、資料欄位與結果定義：依時間戳記擷取入院 24 小時內資料；壓傷以通報系統並由傷口護理師確認之紀錄為準，抽查 100 筆病歷核對。\n二、模型：邏輯斯迴歸（基準一）、XGBoost；Braden 總分（基準二）；以 SHAP 呈現主要預測因子。\n三、需求焦點團體大綱：現行風險評估流程、對提醒的期待與擔心（附錄三）。\n四、任務腳本：3 個模擬病人個案，完成查看風險、辨識主要原因、選擇預防措施並記錄。\n五、SUS 中文版 10 題（Brooke, 1996）；NASA-TLX 六向度（Hart & Staveland, 1988）；啟發式評估：Nielsen 十原則，嚴重度 0–4。","m5_flow":"一、第 1–3 月：IRB 送審（兩階段一併）並申請第一階段免除知情同意；核准後向資訊室申請去識別化資料，建立資料字典。\n二、第 4–6 月：資料清理；依時間切分為訓練（2020–2024）與測試（2025）資料，切分後才補值與標準化；訓練資料內以 5 折交叉驗證調參；於測試資料一次性評估並訂定切點。\n三、第 6–7 月：需求焦點團體 2 場，主題分析整理需求並以 MoSCoW 排序；設計介面雛型。\n四、第 7–9 月：開發可運作版本（測試環境，使用模擬病人資料）；第 8 月、第 9 月各一輪形成性評估。\n五、第 10 月：總結性評估，15 位護理師於模擬環境完成 3 個個案任務，填 SUS 與 NASA-TLX。","m5_innov":"以第一階段之切點與 SHAP 結果設計第二階段之風險說明，並以「提醒理解正確率」檢驗護理師是否真正看懂模型輸出，使模型驗證與介面評估在同一研究中銜接。","m6_common":"顯著水準 α = .05（雙尾）。第一階段：缺值以多重插補（在訓練資料內建立後套用至測試資料）；AUC 以 DeLong 法計算 95% CI 並比較模型與 Braden 基準；校準以校準斜率、截距與校準圖；依病房可承受之每日提醒數訂定切點，報敏感度、特異度、PPV；決策曲線分析；依年齡與科別分組評估。第二階段：描述統計呈現任務完成率、操作時間（中位數與四分位距）、提醒理解正確率、SUS 與 NASA-TLX；兩輪形成性評估問題數與嚴重度以表格比較。分析以 Python（scikit-learn、xgboost、shap）與 R（版本寫明）執行。","m6_qual":"需求焦點團體與放聲思考紀錄以主題分析整理（Braun & Clarke, 2006），歸納需求與可用性問題類型；需求以 MoSCoW 排序並與 2 位參與者確認。","m7_irb":"本研究將送本院人體研究倫理審查委員會審查，兩階段一併送審：第一階段回溯性使用去識別化病歷，申請免除知情同意；第二階段為護理師之焦點團體與模擬測試，屬最小風險；預計申請簡易審查，以審查會認定為準。","m7_consent":"第一階段回溯性使用既有醫療紀錄之去識別化資料，無法逐一取得同意且對病人權益影響極小，依《人體研究法》第 12 條第 2 項但書申請免除知情同意，以審查會認定為準。第二階段護理師簽署書面同意書；招募不經護理長，參與與否不影響考核。","m7_risk":"第一階段不接觸病人，主要風險為資料外洩，以去識別化與院內分析環境管控。第二階段屬最小風險；焦點團體內容不回饋給主管，模擬測試不使用真實病人資料，螢幕錄影只拍攝畫面。","m7_deid":"第一階段資料由資訊室去識別化提供，以研究編號取代病歷號，日期以「距入院時數」呈現；對照表由資訊室保管、研究者不持有；資料只在院內分析環境處理，結果經檢查無小格數後才帶出。第二階段錄音於逐字稿核對後刪除。資料保存至研究結束後 3 年，期滿以不可回復方式刪除。","m7_coi":"研究者與護理資訊系統廠商無財務關係；介面雛型於測試環境開發，不直接寫入正式系統。依 9.10 判定：本研究之提醒介面若上線並提供風險判斷，可能涉及軟體醫療器材判定，本研究僅產出研究用雛型，不作臨床使用。生成式 AI 僅用於程式除錯，不輸入病人資料。","m8_feas":"資料：資訊室已確認所需欄位與壓傷通報系統可串接，2020–2024 年住院資料預估超過 25 萬筆（附錄二）。人力：研究者具護理臨床與 Python 程式經驗，已修習機器學習課程；指導教授具預測模型研究經驗，傷口護理師 1 位擔任臨床顧問。場域：護理部已同意於 8 個病房招募並提供模擬環境。時間：建模 3 個月、介面 4 個月，保留兩個月緩衝。","m9_acad":"提供國內住院病人壓傷風險模型之時間切分驗證證據，並示範 B→A 兩階段：以模型表現與主要預測因子作為介面設計輸入，並以提醒理解正確率評估使用者是否看懂模型輸出。","m9_prac":"產出經驗證之模型、建議切點與經護理師評估之提醒介面雛型，供護理部更新風險評估模組時採用；若可用性良好，可接續進行病房試辦之介入成效研究（C 型）。","m9_limd":"第一階段為單一醫學中心資料、未做外部驗證；壓傷通報可能有漏報，影響結果定義。第二階段於模擬情境評估，無法反映真實工作中斷與時間壓力；總結性評估 15 人屬描述性。","m9_lime":"研究期間若護理資訊系統改版或 Braden 評估流程變更，將記錄版本差異；護理師輪班不易安排焦點團體，將配合交班時段並提供兩個場次選擇。","m9_train":"參與之碩士生將習得臨床資料前處理、預測模型開發與時間切分驗證、需求分析、介面雛型設計與可用性測試（教學示意）。","m9_output":"預計投稿期刊論文 2 篇（模型驗證、介面開發與評估）、研討會論文 1 篇，並產出介面雛型與設計規格（教學示意）。","m9_nation":"回應病人安全與護理人力負荷之需求，提供 AI 決策輔助從模型到臨床介面之可行開發與評估流程。","t_iv":"壓傷風險預測模型與護理提醒介面","t_pop":"住院病人與護理師","t_out":"之開發與評估","t_des":"預測模型建置與設計科學研究","m10_title":"住院病人壓傷風險預測模型之建置與護理提醒介面開發：時間切分驗證與設計科學研究","m10_title_en":"Development of a Pressure Injury Risk Prediction Model for Hospitalized Patients and a Nursing Alert Interface: Temporal Validation and Design Science Research","m10_kw":"壓傷、預測模型、機器學習、臨床決策輔助、可用性","m10_abs":"院內壓傷多可預防，但 Braden 量表在高風險族群中標記過多，且模型輸出若未經使用者設計，護理師可能看不懂或忽略提醒。本研究旨在建立並驗證入院 24 小時內資料之壓傷風險預測模型，並開發與評估嵌入護理資訊系統之提醒介面。第一階段使用北部某醫學中心 2020–2025 年 18 歲以上住院病人之去識別化資料，以 2020–2024 年訓練邏輯斯迴歸與 XGBoost、2025 年做時間切分測試，與 Braden 總分比較 AUC、校準度與決策曲線；第二階段以設計科學研究法，經護理師需求焦點團體、兩輪形成性評估與 15 位護理師之總結性評估，測量任務完成率、提醒理解正確率、SUS 與 NASA-TLX。預期模型優於 Braden 量表，介面可用性良好，可作為護理資訊系統改版之依據。","m10_kw_en":"pressure injury; prediction model; machine learning; clinical decision support; usability","m10_abs_en":"Hospital-acquired pressure injuries are largely preventable, but the Braden Scale classifies many patients as high risk, and model outputs that are not designed with users may be ignored or misunderstood by nurses. This study aims to develop and temporally validate a model predicting pressure injury using data available within 24 hours of admission, and to develop and evaluate an alert interface embedded in the nursing information system. In phase one, de-identified records of adult inpatients at a medical center in northern Taiwan from 2020 to 2025 will be used; logistic regression and XGBoost will be trained on 2020–2024 data and tested on 2025 data, and compared with the Braden total score using the area under the ROC curve, calibration, and decision curve analysis, following TRIPOD+AI. In phase two, design science research will be used to develop the interface through focus groups with nurses, two rounds of formative evaluation, and a summative evaluation with 15 nurses using simulated cases, measuring task completion, accuracy of alert comprehension, System Usability Scale scores, and NASA-TLX workload. The model is expected to outperform the Braden Scale, and the interface is expected to be usable, informing the upgrade of the nursing information system.","m10_refs":"Bergstrom, N., Braden, B. J., Laguzza, A., & Holman, V. (1987). The Braden Scale for predicting pressure sore risk. Nursing Research, 36(4), 205–210.\nBraun, V., & Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77–101.\nBrooke, J. (1996). SUS: A quick and dirty usability scale. In P. W. Jordan et al. (Eds.), Usability evaluation in industry (pp. 189–194). Taylor & Francis.\nCollins, G. S., Moons, K. G. M., Dhiman, P., Riley, R. D., Beam, A. L., Van Calster, B., et al. (2024). TRIPOD+AI statement: Updated guidance for reporting clinical prediction models that use regression or machine learning methods. BMJ, 385, e078378.\nEuropean Pressure Ulcer Advisory Panel, National Pressure Injury Advisory Panel, & Pan Pacific Pressure Injury Alliance. (2019). Prevention and treatment of pressure ulcers/injuries: Clinical practice guideline. The international guideline (E. Haesler, Ed.). EPUAP/NPIAP/PPPIA.\nHart, S. G., & Staveland, L. E. (1988). Development of NASA-TLX (Task Load Index): Results of empirical and theoretical research. Advances in Psychology, 52, 139–183.\nHevner, A. R., March, S. T., Park, J., & Ram, S. (2004). Design science in information systems research. MIS Quarterly, 28(1), 75–105.\nPeffers, K., Tuunanen, T., Rothenberger, M. A., & Chatterjee, S. (2007). A design science research methodology for information systems research. Journal of Management Information Systems, 24(3), 45–77.\nRiley, R. D., Ensor, J., Snell, K. I. E., Harrell, F. E., Martin, G. P., Reitsma, J. B., et al. (2020). Calculating the sample size required for developing a clinical prediction model. BMJ, 368, m441.\nVan Calster, B., McLernon, D. J., van Smeden, M., Wynants, L., & Steyerberg, E. W. (2019). Calibration: The Achilles heel of predictive analytics. BMC Medicine, 17, 230.\nVasey, B., Nagendran, M., Campbell, B., Clifton, D. A., Collins, G. S., Denaxas, S., et al. (2022). Reporting guideline for the early-stage clinical evaluation of decision support systems driven by artificial intelligence: DECIDE-AI. Nature Medicine, 28(5), 924–933.\nVickers, A. J., & Elkin, E. B. (2006). Decision curve analysis: A novel method for evaluating prediction models. Medical Decision Making, 26(6), 565–574.","irb_inst":"〔醫院名稱〕；第一階段：資訊室提供之去識別化病歷資料；第二階段：內外科 8 個病房","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：第一階段為回溯性去識別化病歷資料分析（申請免除知情同意），第二階段為護理師焦點團體與模擬可用性測試，均屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"第一階段：2020–2025 年住院病人去識別化紀錄（預估逾 30 萬筆）；第二階段：護理師焦點團體 12 人、形成性評估每輪 5 人共 10 人、總結性評估 15 人，另專家 3 位。","irb_recruit":"第二階段由研究生於病房公告招募說明，有意願者主動聯繫；護理長不參與邀請與名單確認，參與與否不影響考核。","irb_vuln":"第一階段資料可能含易受傷害族群（如意識不清病人），但為去識別化回溯資料，不接觸病人。第二階段參與者為受雇者：招募不經主管、內容不回饋單位。","irb_task":"焦點團體：一次約 60–90 分鐘，討論現行壓傷風險評估與對提醒的期待（錄音）。可用性測試：在模擬環境以 3 個虛構病人操作提醒介面約 40 分鐘，邊做邊說出想法（螢幕錄影），並填寫兩份簡短問卷。","irb_withdraw":"第二階段可隨時口頭或書面告知撤回，撤回後刪除其錄音、錄影與問卷資料。第一階段為去識別化資料，無法辨識個人，不適用撤回。","irb_benefit":"無直接利益；參與焦點團體或測試者致贈〔　〕元禮券。研究結果可協助改善病房壓傷風險評估工具。","irb_harm":"屬最小風險；如對研究有疑問或爭議，可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為去識別化病歷資料（僅存於院內分析環境）、焦點團體錄音與逐字稿、測試錄影與問卷。錄音錄影於分析完成後刪除；去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"部分：第一階段回溯性病歷資料依《人體研究法》第 12 條第 2 項但書申請免除知情同意；第二階段護理師簽署書面同意書。","irb_ad":"【護理師參與邀請：壓傷風險提醒介面】我們正在設計一個讓護理師一眼看懂的壓傷風險提醒畫面，想邀請內外科病房護理師參加焦點團體或試用測試（使用虛構病人資料）。參與與否不影響考核。聯絡人：〔研究生姓名〕〔分機／電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責資料分析、介面開發與可用性測試）；傷口護理師〔姓名〕（臨床顧問）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益；介面雛型為研究用途，不作商業販售，若未來技術移轉將另行約定並送審。"},"objs":[{"verb":"比較","text":"比較預測模型與 Braden 總分預測院內壓傷之鑑別力","hyp":"H1：最佳模型之 AUC 高於 Braden 總分；H0：兩者 AUC 無差異。","analysis":"DeLong 法比較 AUC 與 95% CI；於 2025 年時間切分測試資料評估","crit":"α = .05（雙尾）；AUC 差異之 95% CI 不含 0","sens":"只取每人第一次住院；排除加護病房住院","exp":"預期模型 AUC 高於 Braden 總分，尤其在高齡與重症病人中可區分風險高低；若無差異，表示 Braden 已足夠，介面設計改以簡化 Braden 呈現為主。"},{"verb":"描述","text":"描述最佳模型之校準度、切點表現與主要預測因子","hyp":"","analysis":"校準斜率與校準圖；依每日可承受提醒數訂切點，報敏感度、特異度、PPV；決策曲線；SHAP","crit":"校準斜率接近 1；切點依病房可承受之提醒量事先訂定","sens":"依年齡（65 歲上下）與內外科分組比較","exp":"預期模型校準良好，活動程度、白蛋白與升壓劑使用為主要預測因子；這些因子將作為介面中「主要原因」之呈現內容。"},{"verb":"開發","text":"開發護理提醒介面並評估其可用性與提醒理解正確率","hyp":"","analysis":"焦點團體主題分析與 MoSCoW；兩輪形成性評估問題清單（嚴重度 0–4）；總結性評估描述統計","crit":"第二輪無嚴重度 3–4 問題；SUS 以 68 分為平均參考值；提醒理解正確率以 80% 為目標（描述性）","sens":"依年資分別呈現","exp":"預期第二輪嚴重問題明顯減少，護理師能正確說出風險等級與主要原因；若理解正確率偏低，表示需簡化 SHAP 呈現方式。"}],"vars":[{"name":"院內壓傷","role":"依變項","concept":"住院期間新發生之壓傷","oper":"入院 24 小時後新發生、經傷口護理師確認之 2 期以上壓傷＝1，否則＝0","tool":"壓傷通報系統","scale":"名目","time":"住院期間","rel":"人工抽查 100 筆病歷核對"},{"name":"Braden 總分","role":"自變項","concept":"傳統壓傷風險評估（基準）","oper":"Braden 六項總分 6–23 分，分數愈低風險愈高","tool":"護理評估紀錄","scale":"次序","time":"入院 24 小時內","rel":"Bergstrom 等人（1987）"},{"name":"臨床預測因子","role":"自變項","concept":"入院時之生理與治療狀態","oper":"年齡、BMI、意識、活動程度、白蛋白、血紅素、血糖、升壓劑、鎮靜劑、插管","tool":"電子病歷","scale":"比率／名目","time":"入院 24 小時內","rel":"依時間戳記擷取"},{"name":"提醒理解正確率","role":"依變項","concept":"護理師是否看懂模型輸出","oper":"3 個個案 × 3 題（風險等級、主要原因、建議措施）答對比例","tool":"任務後問答","scale":"比率","time":"總結性評估","rel":"題目與答案由傷口護理師審定"},{"name":"SUS 與 NASA-TLX","role":"依變項","concept":"主觀可用性與工作負荷","oper":"SUS 0–100；NASA-TLX 六向度 0–100 平均","tool":"問卷","scale":"等距","time":"總結性評估","rel":"Brooke（1996）；Hart 與 Staveland（1988）"},{"name":"科別、年齡層","role":"控制","concept":"病人組成（分組評估用）","oper":"內科／外科；65 歲上下","tool":"電子病歷","scale":"名目","time":"入院時","rel":"—"}],"bias":[{"name":"資料洩漏","why":"使用 24 小時後才產生的資料或切分前補值","fix":"依時間戳記篩選；先時間切分再以訓練資料建立參數"},{"name":"結果誤分類","why":"壓傷通報可能漏報或分期不一","fix":"抽查 100 筆病歷核對；以「通報或病歷記載」做敏感度分析"},{"name":"學習效應","why":"同一護理師參加多輪測試會越來越熟悉","fix":"形成性與總結性評估招募不同護理師"},{"name":"期望偏差","why":"護理師可能因研究者為同事而給予正向評價","fix":"開發者不擔任測試主持人；強調要找介面問題"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":2},{"t":"資料申請與資料字典","s":2,"e":3},{"t":"資料清理、建模與時間切分驗證","s":4,"e":6},{"t":"需求焦點團體與介面設計","s":6,"e":7},{"t":"開發與兩輪形成性評估","s":7,"e":9},{"t":"總結性評估（模擬）","s":10,"e":10},{"t":"論文撰寫","s":9,"e":11},{"t":"緩衝（資料延誤、開發延誤）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"資料申請延誤","trig":"第 3 月仍未取得資料","when":"M3","plan":"先以公開資料（如 MIMIC-IV）建立分析流程；第二階段需求焦點團體提前進行"},{"r":"模型未優於 Braden","trig":"AUC 差異 95% CI 含 0","when":"M6","plan":"如實報告；第二階段改以改善 Braden 呈現與提醒流程為設計目標"},{"r":"測試環境無法建置","trig":"資訊室無法提供測試環境","when":"M7","plan":"改以獨立網頁雛型模擬護理資訊系統畫面"},{"r":"總結性評估招募不足","trig":"第 10 月未達 15 人","when":"M10","plan":"擴大至其他病房並延長 2 週"}],"kpi":[{"name":"最佳模型 AUC（成果指標）","calc":"2025 年測試資料 AUC 與 95% CI","base":"Braden 總分之 AUC","goal":"高於基準"},{"name":"提醒理解正確率（成果指標）","calc":"總結性評估 3 個案 × 3 題答對比例","base":"第一輪形成性評估結果","goal":"≥ 80%"}],"ss":{}}},"GH":{"label":"G→H 先回顧找缺口再用健保資料：降血糖藥與失智風險","grp":1,"data":{"meta":{"type":"H","type2":"G 系統性／範域回顧"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"第 2 型糖尿病患者失智風險較高；部分觀察性研究指出 SGLT2 抑制劑可能與較低失智風險相關，但結果不一，且常有設計偏誤，臨床用藥選擇缺乏可信的本土證據。","s1_2":"第一階段：比較 SGLT2 抑制劑與其他降血糖藥失智風險之已發表觀察性研究；第二階段：全民健保資料 2016–2021 年 50 歲以上新使用 SGLT2 抑制劑或 DPP-4 抑制劑之第 2 型糖尿病患者。","s1_3":"第一階段：既有研究之合併效果與偏誤；第二階段：新使用 SGLT2 抑制劑（相較 DPP-4 抑制劑）。","s1_4":"第一階段：合併 HR、異質性、ROBINS-I 偏誤；第二階段：新發生失智症（HR 與 95% CI）。","s1_5":"既有證據對 SGLT2 抑制劑與失智風險之結論是否可信？以健保資料、避開常見偏誤之設計，結果為何？","s1_6":"G→H：觀察性研究之系統性回顧與統合分析，再以健保資料進行主動對照新使用者世代研究（標的試驗仿真）。","s1_7":"第一階段使用已發表文獻；第二階段使用加密去識別化健保資料，申請免除知情同意。","s1_8":"12 個月：回顧 4 個月（與 IRB 及資料申請並行）、世代建立與分析 5 個月、撰寫，保留兩個月緩衝。","s1_9":"提供既有證據之可信度評估與一個以設計避開偏誤之本土世代估計，供糖尿病照護與用藥選擇參考。","m1_scene":"第 2 型糖尿病患者發生失智症之風險高於一般人，隨著糖尿病人口高齡化，如何在控制血糖的同時兼顧認知健康，成為臨床與公共衛生關注的問題。SGLT2 抑制劑因心腎保護效果，近年處方量快速增加；部分觀察性研究報告其使用者失智風險較低，引發「降血糖藥是否也能保護大腦」的討論。","m1_gap":"然而，既有觀察性研究的比較對象（非使用者、其他藥物）、追蹤起點與暴露定義差異很大，結果從明顯保護到無關聯都有；部分研究將「開始用藥前」的時間算入暴露期，產生不死時間偏誤（Suissa, 2008），或納入已長期用藥之盛行使用者，使結果偏向有利。臨床醫師面對這些結果，難以判斷能否作為用藥選擇的依據。","m1_new":"系統性回顧與統合分析可整合既有研究並以 ROBINS-I 評估偏誤（Sterne et al., 2016），區分「設計良好」與「有明顯偏誤」之研究結果；觀察性研究依 MOOSE 報告（Stroup et al., 2000）。在回顧找出設計缺口後，以標的試驗仿真框架（Hernán & Robins, 2016）與主動對照新使用者設計（Lund et al., 2015）重新分析健保資料，可直接回應既有研究的設計問題。","m1_time":"臺灣全民健保自 2016 年起給付 SGLT2 抑制劑，至今已累積足夠的新使用者與追蹤時間；國內糖尿病照護指引更新在即，需要可信的本土證據。健保資料可回溯分析，一年內即可提供結果。","m1_stmt":"因此，本研究擬先以系統性回顧與統合分析評估 SGLT2 抑制劑與失智風險之既有證據及其偏誤，再以健保資料進行主動對照新使用者世代研究，估計相較 DPP-4 抑制劑之失智風險。","m2_pico":"第一階段（PECO）｜P：第 2 型糖尿病成人｜E：SGLT2 抑制劑｜C：其他降血糖藥或未使用｜O：新發生失智症｜S：觀察性世代研究。第二階段｜P：50 歲以上新使用 SGLT2 抑制劑或 DPP-4 抑制劑之第 2 型糖尿病患者｜E：SGLT2 抑制劑｜C：DPP-4 抑制劑（主動對照）｜O：新發生失智症","m2_search":"PubMed：（\"Sodium-Glucose Transporter 2 Inhibitors\"[Mesh] OR SGLT2[tiab] OR gliflozin*[tiab] OR empagliflozin[tiab] OR dapagliflozin[tiab]）AND（\"Dementia\"[Mesh] OR dementia[tiab] OR \"Alzheimer*\"[tiab] OR \"cognitive impairment\"[tiab]）AND（cohort[tiab] OR observational[tiab] OR \"real-world\"[tiab]）\nEmbase、Cochrane CENTRAL 以對應主題詞與自由詞檢索；華藝：（SGLT2）AND（失智 OR 認知）\n限制：2014 年以後、中英文；檢索日期、各階段筆數與 PRISMA 流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、糖尿病與失智。第 2 型糖尿病被視為失智症的風險因子之一，可能機轉包括血管損傷、胰島素阻抗與低血糖事件。對本研究的意義：失智症結果需處理死亡之競爭風險，且暴露與結果之間須有足夠潛伏期。\n二、觀察性用藥研究的常見偏誤。不死時間偏誤源於暴露起點與追蹤起點未對齊（Suissa, 2008）；盛行使用者偏誤與適應症干擾可藉主動對照新使用者設計降低（Lund et al., 2015）；標的試驗仿真要求先寫出理想試驗之各要素再以資料仿真（Hernán & Robins, 2016）。對本研究的意義：回顧時以 ROBINS-I（Sterne et al., 2016）逐項檢查這些偏誤，第二階段據以設計。\n三、健保資料研究。全民健保資料涵蓋全國 99% 以上人口，可長期追蹤用藥與診斷（Hsieh et al., 2019），依 RECORD-PE 報告（Langan et al., 2018）。本研究初步檢索（附錄一）發現既有研究比較對象與設計不一，尚無以國內健保資料、主動對照新使用者設計並處理競爭風險之研究（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有觀察性研究提示 SGLT2 抑制劑可能與較低失智風險相關，且觀察性用藥研究之偏誤來源與對應設計已有清楚的方法學（Suissa, 2008；Lund et al., 2015；Hernán & Robins, 2016）。","m2_unknown":"然而，既有研究結果之可信度與異質性來源（比較對象、是否新使用者、是否處理不死時間）缺乏系統性評估；國內亦缺乏以主動對照新使用者設計、處理死亡競爭風險與潛伏期之本土世代證據。","m2_worth":"此缺口使臨床醫師無法判斷「SGLT2 抑制劑保護認知」之說法能否採信；本研究以 G→H 兩階段，先指出既有證據的設計問題，再以避開這些問題的設計提供本土估計。","m2_theory":"第一階段依 PRISMA 2020 與 MOOSE 報告，以 ROBINS-I 評估偏誤；第二階段以標的試驗仿真（Hernán & Robins, 2016）逐項界定納入條件、治療策略、分派、時間零點、結果與分析，採主動對照新使用者設計（Lund et al., 2015），依 RECORD-PE 報告；第一階段歸納之偏誤清單，即第二階段設計須逐項回應之檢核表。","m2_orig":"本計畫以系統性回顧之偏誤評估直接決定次級資料研究之設計，並以標的試驗仿真之表格逐項對照，使「回顧發現什麼問題、本研究如何處理」一目了然。","m3_rq":"既有證據可信度如何？新使用 SGLT2 抑制劑相較 DPP-4 抑制劑，失智風險是否較低？","m3_terms":"新使用者：index 日前 1 年（洗出期）未使用 SGLT2 抑制劑、DPP-4 抑制劑或 GLP-1 受體促效劑，並於研究期間首次領取其中一類藥物者。\nindex 日（時間零點）：首次領取 SGLT2 抑制劑或 DPP-4 抑制劑之日，兩組規則相同。\n失智症：index 日後門診 2 次或住院 1 次 ICD-10-CM F01–F03、G30 診斷，以首次診斷日為事件日；潛伏期為 index 後 1 年內之事件不計入（主分析）。\n主動對照：以同為第二線口服降血糖藥之 DPP-4 抑制劑為比較組，以降低適應症干擾。","m3_scope":"第一階段範圍為 2014 年至檢索日已發表、比較 SGLT2 抑制劑與其他降血糖藥或未使用者失智風險之觀察性世代研究；第二階段為 2016–2021 年健保資料之 50 歲以上新使用者，追蹤至 2023 年底。本研究估計關聯，不推論藥物機轉，不比較 SGLT2 抑制劑個別藥品，亦不評估認知功能分數之變化。","m4_frame":"第一階段（G）：萃取比較對象、是否新使用者、時間零點、潛伏期處理、競爭風險與調整變項，以 ROBINS-I 評偏誤，依「設計特徵」分組合併 HR。第二階段（H）：暴露為新使用 SGLT2 抑制劑（相較 DPP-4 抑制劑）；結果為新發生失智症；共變項為年齡、性別、糖尿病病程代理（用藥年數）、共病（高血壓、中風、憂鬱、慢性腎病）、其他降血糖藥與心血管用藥、就醫次數；死亡為競爭風險。","m5_design":"本研究採兩階段設計（G→H）：第一階段為觀察性研究之系統性回顧與統合分析，依 PRISMA 2020 與 MOOSE 報告並註冊 PROSPERO；第二階段為以標的試驗仿真框定之主動對照新使用者回溯性世代研究，依 RECORD-PE 報告。","m5_reject":"不只做回顧，因既有研究設計問題無法靠合併解決，需以新資料重新估計；不直接做健保研究，因未先釐清既有研究的偏誤來源，設計可能重蹈覆轍；第二階段不以未使用者為對照，因糖尿病嚴重度與就醫型態差異大，適應症干擾難以控制，故採主動對照。","m5_site":"第一階段資料來源為 PubMed、Embase、Cochrane CENTRAL 與華藝，第二位評估者為同實驗室研究生〔姓名〕（附錄二）。第二階段資料來源為衛生福利資料科學中心之全民健保資料（門住診、藥局處方、承保與死因檔，2015–2023 年），IRB 核准後申請，於中心環境分析。","m5_incl":"第一階段納入：比較 SGLT2 抑制劑與任一對照之失智風險、報告 HR 或可換算效果量之觀察性世代研究；排除：橫斷式研究、病例報告、無對照組者。第二階段納入：2016–2021 年首次領取 SGLT2 抑制劑或 DPP-4 抑制劑、50 歲以上、index 前 1 年有第 2 型糖尿病診斷且持續投保者；排除：index 前已有失智症、帕金森氏症或腦部腫瘤，第 1 型糖尿病，index 當日同時開始兩類藥物者。","m5_sample":"第一階段納入篇數無法事先決定；兩位評估者以 50 篇標題摘要試篩，κ ≥ 0.6 後正式篩選。第二階段以 Schoenfeld（1983）公式：HR = 0.8、α = .05 雙尾、檢定力 .80、SGLT2 抑制劑組比例 40%，需約 657 件失智事件；預估平均追蹤 4 年、累積發生率約 3%，需約 22,000 人。健保資料之新使用者遠高於此（教學示意：請以中心資料估計重新計算）。","m5_tool":"一、第一階段：Rayyan 篩選；萃取表（研究設計、比較對象、新使用者與否、時間零點、潛伏期、競爭風險、調整變項、HR 與 95% CI）；ROBINS-I 七面向評估。\n二、第二階段：代碼表（ATC 碼：SGLT2 抑制劑 A10BK、DPP-4 抑制劑 A10BH；失智 ICD-10-CM；共病與排除條件）與時間窗；健保於 2016 年改用 ICD-10-CM，2015 年回溯期以 ICD-9-CM 對應代碼定義。\n三、標的試驗仿真對照表：逐項列出理想試驗與本研究之對應（附錄三）。\n四、分析軟體：R（metafor）與 SAS 或 R（依中心環境），版本寫明。","m5_flow":"一、第 1–2 月：註冊 PROSPERO 並完成檢索；同時送 IRB 並於第 2 月向中心送件申請資料。\n二、第 2–4 月：兩人獨立篩選、萃取與 ROBINS-I 評估；完成統合分析與「偏誤清單」，據以定稿第二階段設計。\n三、第 5–6 月：於中心環境建立新使用者世代、代碼定義與共變項。\n四、第 7–9 月：傾向分數加權、主要分析與敏感度分析。\n五、第 9 月：結果依中心規定遮蔽小格數，經審查後帶出。","m5_innov":"以回顧之偏誤評估作為次級資料研究的設計檢核表，並以標的試驗仿真表格逐項回應，示範如何把「文獻的問題」變成「本研究的設計」。","m6_common":"第一階段：以隨機效應模型（REML）合併 log HR 與 95% CI，異質性以 I² 與 τ² 呈現，依比較對象（主動對照／未使用者）與是否新使用者設計做次群組分析，排除 ROBINS-I 嚴重偏誤者做敏感度分析；研究數 ≥ 10 時評估發表偏誤。第二階段：顯著水準 α = .05（雙尾）；以傾向分數之逆機率加權（IPTW）平衡兩組，SMD < 0.1 視為平衡（Austin, 2011）；主分析為起始治療分析（不論後續停藥或換藥），以加權 Cox 模型估計 HR，並以 Fine–Gray 模型處理死亡競爭風險（Fine & Gray, 1999）；敏感度分析：持續用藥分析（停藥或換藥即設限）、潛伏期改為 2 年、嚴格失智定義、E-value（VanderWeele & Ding, 2017）與負對照結果。分析以 R 或 SAS（版本寫明）執行。","m6_qual":"","m7_irb":"第一階段只使用已發表文獻，不屬人體研究。第二階段將送〔大學〕研究倫理審查委員會審查，屬使用去識別化次級資料之研究，預計申請簡易審查並申請免除知情同意，以審查會認定為準；於第 1 月送審，核准後才向中心申請資料。","m7_consent":"第二階段使用加密去識別化之全民健保資料，無法辨識個人且無法逐一取得同意，依《人體研究法》第 12 條第 2 項但書（屬主管機關公告得免取得同意之研究案件範圍）申請免除知情同意，以審查會認定為準。","m7_risk":"第一階段不涉及參與者。第二階段不接觸個人，主要風險為資料外洩與再識別；資料僅於中心環境分析，結果以彙總統計呈現並遮蔽小格數。","m7_deid":"第二階段資料由中心加密去識別化提供，研究者無法辨識個人；只在中心環境分析，原始資料不得攜出，結果經中心審查並遮蔽小格數後才帶出。第一階段萃取表與分析程式碼公開於 OSF；健保資料依中心規定期限保存與銷毀。","m7_coi":"研究者與任何藥廠無財務關係，研究未接受藥廠補助。生成式 AI 僅用於程式除錯與英文潤稿，不輸入任何資料。","m8_feas":"人力：第二位評估者已同意（附錄二）；指導教授具健保資料與藥物流行病學研究經驗，內分泌科主治醫師 1 位擔任臨床顧問。資料：中心可提供 2015–2023 年所需檔案。時間：回顧與資料申請並行，資料申請於第 2 月送件並預留 3 個月，保留兩個月緩衝。","m9_acad":"提供 SGLT2 抑制劑與失智風險之系統性證據與偏誤評估，並以主動對照新使用者設計提供本土估計；示範 G→H 由「找出既有研究的設計問題」到「以新資料回應」之完整流程。","m9_prac":"結果可供糖尿病照護團隊在選擇第二線降血糖藥時參考，並提醒臨床人員以設計品質解讀「藥物保護認知」之研究；若結果穩健，可作為後續隨機試驗之依據。","m9_limd":"觀察性設計無法排除未測量干擾（如血糖控制程度、教育程度、生活型態），結果為關聯而非因果；以 DPP-4 抑制劑為對照，結論僅適用於兩者之比較。","m9_lime":"健保資料以診斷碼定義失智，可能延遲或低估；處方不等於實際服用；回顧納入研究之效果定義與調整變項不一，合併結果需謹慎解讀。","m9_train":"參與之碩士生將習得觀察性研究之系統性回顧與 ROBINS-I、統合分析、標的試驗仿真、傾向分數與競爭風險分析（教學示意）。","m9_output":"預計投稿期刊論文 2 篇（系統性回顧、世代研究）、研討會論文 1 篇，並公開萃取表與分析程式碼（教學示意）。","m9_nation":"回應糖尿病與失智症雙重負擔之公共衛生需求，提供本土用藥安全與效益之真實世界證據。","t_iv":"SGLT2 抑制劑","t_pop":"第 2 型糖尿病患者","t_out":"失智症風險","t_des":"系統性回顧與主動對照新使用者世代研究","m10_title":"SGLT2 抑制劑與第 2 型糖尿病患者失智症風險：系統性回顧與全民健保資料之主動對照新使用者世代研究","m10_title_en":"SGLT2 Inhibitors and Dementia Risk in Patients with Type 2 Diabetes: A Systematic Review and an Active-Comparator New-User Cohort Study Using Taiwan's National Health Insurance Data","m10_kw":"第 2 型糖尿病、SGLT2 抑制劑、失智症、標的試驗仿真、系統性回顧","m10_abs":"部分觀察性研究指出 SGLT2 抑制劑使用者失智風險較低，但比較對象與設計不一，且常有不死時間與盛行使用者偏誤。本研究旨在評估既有證據之可信度，並以本土資料估計 SGLT2 抑制劑相較 DPP-4 抑制劑之失智風險。第一階段依 PRISMA 2020 與 MOOSE 執行觀察性研究之系統性回顧與統合分析，以 ROBINS-I 評估偏誤並依設計特徵做次群組分析；第二階段以標的試驗仿真框定，使用全民健保資料，納入 2016–2021 年 50 歲以上新使用 SGLT2 抑制劑或 DPP-4 抑制劑之第 2 型糖尿病患者，追蹤至 2023 年底，以傾向分數加權之 Cox 模型與 Fine–Gray 競爭風險模型估計風險比，並進行潛伏期、持續用藥、E-value 與負對照等敏感度分析。預期提供既有證據之偏誤評估與避開常見偏誤之本土估計，供用藥選擇參考。","m10_kw_en":"type 2 diabetes; SGLT2 inhibitors; dementia; target trial emulation; systematic review","m10_abs_en":"Some observational studies suggest that users of sodium–glucose cotransporter 2 (SGLT2) inhibitors have a lower risk of dementia, but comparators and designs vary, and immortal time and prevalent-user biases are common. This study aims to assess the credibility of existing evidence and to estimate the risk of dementia associated with SGLT2 inhibitors compared with dipeptidyl peptidase-4 (DPP-4) inhibitors using local data. In phase one, a systematic review and meta-analysis of observational studies will be conducted following PRISMA 2020 and MOOSE, with risk of bias assessed using ROBINS-I and subgroup analyses by design features. In phase two, framed by target trial emulation, an active-comparator new-user cohort will be constructed from Taiwan's National Health Insurance data, including patients aged 50 years or older with type 2 diabetes who initiated an SGLT2 inhibitor or a DPP-4 inhibitor between 2016 and 2021, followed until the end of 2023. Hazard ratios will be estimated using inverse probability of treatment weighted Cox models and Fine–Gray models for the competing risk of death, with sensitivity analyses varying the latency period, applying an as-treated approach, calculating E-values, and using negative control outcomes. The study is expected to provide a bias assessment of existing evidence and a local estimate that avoids common design biases.","m10_refs":"Austin, P. C. (2011). An introduction to propensity score methods for reducing the effects of confounding in observational studies. Multivariate Behavioral Research, 46(3), 399–424.\nFine, J. P., & Gray, R. J. (1999). A proportional hazards model for the subdistribution of a competing risk. Journal of the American Statistical Association, 94(446), 496–509.\nHernán, M. A., & Robins, J. M. (2016). Using big data to emulate a target trial when a randomized trial is not available. American Journal of Epidemiology, 183(8), 758–764.\nHsieh, C.-Y., Su, C.-C., Shao, S.-C., Sung, S.-F., Lin, S.-J., Kao Yang, Y.-H., & Lai, E. C.-C. (2019). Taiwan's National Health Insurance Research Database: Past and future. Clinical Epidemiology, 11, 349–358.\nLangan, S. M., Schmidt, S. A., Wing, K., Ehrenstein, V., Nicholls, S. G., Filion, K. B., et al. (2018). The reporting of studies conducted using observational routinely collected health data statement for pharmacoepidemiology (RECORD-PE). BMJ, 363, k3532.\nLund, J. L., Richardson, D. B., & Stürmer, T. (2015). The active comparator, new user study design in pharmacoepidemiology: Historical foundations and contemporary application. Current Epidemiology Reports, 2(4), 221–228.\nPage, M. J., McKenzie, J. E., Bossuyt, P. M., Boutron, I., Hoffmann, T. C., Mulrow, C. D., et al. (2021). The PRISMA 2020 statement: An updated guideline for reporting systematic reviews. BMJ, 372, n71.\nSchoenfeld, D. A. (1983). Sample-size formula for the proportional-hazards regression model. Biometrics, 39(2), 499–503.\nSterne, J. A. C., Hernán, M. A., Reeves, B. C., Savović, J., Berkman, N. D., Viswanathan, M., et al. (2016). ROBINS-I: A tool for assessing risk of bias in non-randomised studies of interventions. BMJ, 355, i4919.\nStroup, D. F., Berlin, J. A., Morton, S. C., Olkin, I., Williamson, G. D., Rennie, D., et al. (2000). Meta-analysis of observational studies in epidemiology: A proposal for reporting. JAMA, 283(15), 2008–2012.\nSuissa, S. (2008). Immortal time bias in pharmacoepidemiology. American Journal of Epidemiology, 167(4), 492–499.\nVanderWeele, T. J., & Ding, P. (2017). Sensitivity analysis in observational research: Introducing the E-value. Annals of Internal Medicine, 167(4), 268–274.","irb_inst":"〔大學名稱〕〔系所〕；第二階段資料：衛生福利資料科學中心全民健保資料","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：第一階段不屬人體研究；第二階段使用加密去識別化之健保資料，不接觸個人，屬最小風險並申請免除知情同意；是否符合，以送審機構之判定為準。","irb_n":"第二階段：2016–2021 年 50 歲以上新使用 SGLT2 抑制劑或 DPP-4 抑制劑之第 2 型糖尿病患者去識別化資料，預估數十萬人。","irb_recruit":"不招募參與者；使用健保資料之去識別化資料。","irb_vuln":"資料可能含高齡者，但為加密去識別化之次級資料，不接觸個人。","irb_task":"不適用：本研究不招募參與者。","irb_withdraw":"不適用：資料經加密去識別化，研究者無法辨識個人。","irb_benefit":"研究對象無直接利益；結果可供糖尿病用藥選擇參考。","irb_harm":"不接觸個人，風險限於資料外洩，依中心規定管理。對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為中心提供之去識別化資料，僅於中心環境分析，依中心規定期限保存與銷毀；不作本計畫以外之用途。","irb_waive":"是：使用加密去識別化之全民健保資料，依《人體研究法》第 12 條第 2 項但書申請免除知情同意，以審查會認定為準。","irb_ad":"不適用：本研究不招募參與者。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責系統性回顧、世代建立與資料分析）；內分泌科主治醫師〔姓名〕（臨床顧問）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費（含中心使用費）由指導教授研究計畫支應，未接受藥廠補助。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。"},"objs":[{"verb":"描述","text":"描述既有研究之 SGLT2 抑制劑與失智風險合併效果及偏誤風險","hyp":"","analysis":"隨機效應統合分析（REML）合併 log HR；I² 與 τ²；依比較對象與新使用者設計做次群組；ROBINS-I 評等","crit":"兩人獨立評估，報 κ；95% CI 與預測區間","sens":"排除嚴重偏誤研究；留一法","exp":"預期整體合併 HR < 1 但異質性高；以主動對照新使用者設計之研究效果較小，顯示部分保護效果可能來自設計偏誤。"},{"verb":"檢驗","text":"檢驗新使用 SGLT2 抑制劑相較 DPP-4 抑制劑與失智風險之關聯","hyp":"H1：IPTW 加權後，SGLT2 抑制劑組失智風險低於 DPP-4 抑制劑組（HR < 1）；H0：HR = 1。","analysis":"IPTW 加權 Cox 模型（起始治療分析）；Fine–Gray 競爭風險模型","crit":"α = .05（雙尾）；報加權 HR 與 95% CI；SMD < 0.1","sens":"持續用藥分析；潛伏期 2 年；嚴格失智定義；E-value；負對照結果","exp":"預期 HR 略低於 1 或接近 1；若主分析顯示保護效果但負對照結果亦有關聯，表示可能仍有殘餘干擾。"},{"verb":"探討","text":"探討年齡、性別與慢性腎病是否修飾 SGLT2 抑制劑與失智風險之關聯","hyp":"","analysis":"加入交互作用項之加權 Cox 模型與分層分析（探索性）","crit":"交互作用 p < .10 作為探索性線索","sens":"—","exp":"預期 65 歲以上與慢性腎病者效果方向一致；結果僅供假設形成。"}],"vars":[{"name":"既有研究之設計特徵與偏誤","role":"探索","concept":"文獻中研究之內部效度","oper":"比較對象、新使用者與否、時間零點、潛伏期；ROBINS-I 七面向","tool":"萃取表","scale":"名目","time":"第一階段","rel":"Sterne 等人（2016）；兩人萃取"},{"name":"SGLT2 抑制劑（相較 D
