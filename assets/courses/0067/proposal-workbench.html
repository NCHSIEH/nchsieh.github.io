<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>研究計畫書工作台｜研究方法論</title>
<meta name="description" content="研究方法論課程：逐步撰寫碩士論文計畫書、國科會 CM03 或其他計畫——句型、Case Q 範例、樣本數與甘特工具、一頁地圖檢核與 Word 匯出。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231f3a5f'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='58' font-weight='600' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>/* 版面：深藍工具列（進度＋快查）＋左側步驟軌＋中間填寫欄＋右側說明欄；沿用 nchsieh.github.io 學院藍主題 */
:root{
  --brand:#1f3a5f; --brand-deep:#142943; --brand-tint:rgba(31,58,95,.07); --on-brand:#fff;
  --accent:#9c7538; --accent-tint:rgba(156,117,56,.13);
  --ink:#1c242e; --muted:#4d5865; --faint:#737f8b; --line:#e2ded4; --line-strong:#c9c3b5;
  --bg:#f7f4ed; --card:#fff; --field:#fffdf8; --bad:#9b2c2c; --bad-tint:rgba(155,44,44,.07); --ok:#1f6b4a; --ok-tint:rgba(31,107,74,.10);
  --bar-ink:#e8eef4; --bar-dim:#b3c3d3;
  --serif:"Noto Serif TC","Noto Serif",Georgia,serif;
  --sans:"Noto Sans TC","Noto Sans","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#7aa7d9; --brand-deep:#0a111c; --brand-tint:rgba(122,167,217,.12); --on-brand:#0b1220;
  --accent:#d4a960; --accent-tint:rgba(212,169,96,.15);
  --ink:#e6edf5; --muted:#a3b1c2; --faint:#7d8b9c; --line:#263243; --line-strong:#3a4859;
  --bg:#0d1420; --card:#131c29; --field:#0f1723; --bad:#f19a9a; --bad-tint:rgba(241,154,154,.09); --ok:#7fd1a8; --ok-tint:rgba(127,209,168,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#7aa7d9; --brand-deep:#0a111c; --brand-tint:rgba(122,167,217,.12); --on-brand:#0b1220;
  --accent:#d4a960; --accent-tint:rgba(212,169,96,.15);
  --ink:#e6edf5; --muted:#a3b1c2; --faint:#7d8b9c; --line:#263243; --line-strong:#3a4859;
  --bg:#0d1420; --card:#131c29; --field:#0f1723; --bad:#f19a9a; --bad-tint:rgba(241,154,154,.09); --ok:#7fd1a8; --ok-tint:rgba(127,209,168,.12); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
summary{list-style-position:inside}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-deep)}
h1,h2,h3,h4{font-family:var(--serif);margin:0;line-height:1.35;text-wrap:balance}
a{color:var(--brand)} code{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:27;background:var(--brand-deep);color:var(--bar-ink)}
.top-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--serif);font-weight:700;font-size:16.5px;display:flex;gap:9px;align-items:center;white-space:nowrap}
.brand small{font-family:var(--sans);font-weight:400;color:var(--bar-dim);font-size:12.5px}
#who{font-size:12.5px;color:var(--bar-dim);flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--bar-dim)}
.prog i{display:block;width:120px;height:6px;border-radius:9px;background:rgba(255,255,255,.15);position:relative;overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p,0)*100%);background:var(--accent);border-radius:9px;transition:width .3s}
#sy{max-width:240px;font-size:13px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--bar-ink);padding:5px 8px}
#sy option{color:#1c242e;background:#fff}
#menu{display:none;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:8px;padding:4px 12px;font-size:13px}

.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:236px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#side-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start;max-height:calc(100vh - 76px);overflow:auto;padding-block:20px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:s}
.steps a{display:grid;grid-template-columns:18px 2.6em minmax(0,1fr);gap:6px;align-items:center;padding:6px 8px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:14px}
.steps a:hover{background:var(--brand-tint);color:var(--ink)}
.steps a.cur{background:var(--brand);color:var(--on-brand)} .steps a.cur code{color:var(--on-brand)}
.steps code{font-size:12px;font-weight:700;color:var(--accent)}
.pp{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p,0)*360deg),var(--line) 0)}
.steps a.done .pp{background:var(--ok);position:relative} .steps a.done .pp::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.saved{font-size:12px;color:var(--faint);margin:16px 8px 0;line-height:1.5}
#work{min-width:0;padding-block:24px 60px}

.sh{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.sh .code{flex:none;font-family:var(--mono);font-weight:700;font-size:14px;background:var(--brand);color:var(--on-brand);border-radius:8px;padding:5px 10px;min-width:46px;text-align:center;margin-top:3px}
.sh h2{font-size:clamp(22px,2.6vw,28px)}
.q{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.form{min-width:0;display:grid;gap:16px}
.form h3{font-size:17px;color:var(--brand);margin-top:8px}
.side{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 86px);overflow:auto;padding-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.card h4,.card summary{font-family:var(--serif);font-size:15px;color:var(--brand);font-weight:700}
.card summary{cursor:pointer;list-style-position:outside}
.card.where{background:var(--accent-tint);border-color:transparent} .card.where p{margin:6px 0 0}
.card.case{border-top:3px solid var(--accent)}
.card dl{margin:8px 0 0} .card dt{font-weight:700;color:var(--accent);font-size:13px;margin-top:8px} .card dd{margin:2px 0 0}
.key{color:var(--muted);font-size:13.5px;margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line-strong)}
.must,.card.pass ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.must label,.pass label,.secs label,.opt{display:flex;gap:8px;align-items:flex-start;cursor:pointer;border-radius:7px;padding:4px 6px}
.must label:hover,.pass label:hover,.secs label:hover{background:var(--brand-tint)}
input[type=checkbox],input[type=radio]{accent-color:var(--brand);margin-top:5px;flex:none}
.must input:checked+span,.pass input:checked+span,.secs input:checked+span{color:var(--faint)}
.card.pass{background:var(--brand-tint);border-color:transparent}
.errs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.errs li{background:var(--bad-tint);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;font-size:13.5px}
.errs b{color:var(--bad)}
.slot{background:var(--accent-tint);border-bottom:1.5px dotted var(--accent);border-radius:3px;padding:0 2px}

.fld label{display:flex;gap:8px;align-items:baseline;font-weight:700;color:var(--ink);font-size:15px;flex-wrap:wrap}
.req,.only{font-style:normal;font-size:11px;font-weight:700;border-radius:5px;padding:0 6px;letter-spacing:.04em}
.req{background:var(--accent-tint);color:var(--accent)} .only{background:var(--brand-tint);color:var(--brand)}
.cnt{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--faint);font-family:var(--mono)} .cnt.over{color:var(--bad);font-weight:700}
.hint{margin:2px 0 6px;color:var(--muted);font-size:13.5px}
textarea,.grid input,.grid select,.tool input,.tool select,#type2{width:100%;border:1px solid var(--line-strong);background:var(--field);border-radius:9px;padding:8px 11px;line-height:1.65;font-size:14.5px}
textarea{resize:vertical;min-height:2.6em}
textarea:focus,input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
textarea.flash{background:var(--accent-tint);transition:background .1s}

.tpls{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tpls summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px}
.chips{display:grid;gap:6px;margin-top:10px}
.chip{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:10px;text-align:left;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:7px 10px;color:var(--ink);font-size:13.5px}
.chip:hover{border-color:var(--accent)} .chip b{color:var(--brand)} .chip span{min-width:0}

.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.grid{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.grid th{background:var(--brand);color:var(--on-brand);font-weight:700;text-align:left;padding:7px 10px;white-space:nowrap;font-size:13.5px}
.grid td{border-top:1px solid var(--line);padding:6px;vertical-align:top}
.grid td.n,.grid th.n{width:2.4em;text-align:center;color:var(--faint);font-family:var(--mono)}
.grid td.x,.grid th.x{width:2.4em;text-align:center}
.grid textarea,.grid input,.grid select{padding:5px 8px;font-size:14px;border-radius:7px}
.grid input[type=number]{width:5em}
.grid td.ro{min-width:14em;font-size:14px} .grid td.ro em{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:4px}
.grid td.ro em.sug{color:var(--accent)}
.grid td.empty{text-align:center;color:var(--faint);padding:16px}
.del{border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px} .del:hover{color:var(--bad);background:var(--bad-tint)}
.add{justify-self:start;border:1px dashed var(--line-strong);background:transparent;color:var(--brand);border-radius:8px;padding:5px 12px;font-size:13.5px;margin-top:-6px}
.warn ul,.warn-l{margin:0;padding:10px 14px 10px 30px;background:var(--bad-tint);border-radius:10px;color:var(--bad);font-size:13.5px}
.warn:empty,.warn-l:empty{display:none}

.tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tool h4{color:var(--brand);font-size:16px;margin-bottom:8px}
.tool.typ{border-left:4px solid var(--accent)}
.secs{list-style:none;margin:8px 0;padding:0;display:grid;gap:2px;font-size:14px}
.secs em{display:block;font-style:normal;color:var(--muted);font-size:13px}
.ss-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ss-g label,.tb label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.ss-g label.wide{grid-column:1/-1}
.ss-out{margin:12px 0 10px;background:var(--brand-tint);border-radius:9px;padding:10px 12px;font-size:14.5px}
.ss-out b{font-family:var(--mono);font-size:20px;color:var(--brand)} .ss-out span{display:block;margin-top:4px;color:var(--ink)}
.fine{font-size:12.5px;color:var(--faint);margin:8px 0 0}
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:9px;padding:7px 16px;font-size:14px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--brand)} .btn.small{padding:3px 10px;font-size:13px}
.btn.warnb{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.file{position:relative;overflow:hidden} .btn.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.link{border:0;background:transparent;color:var(--brand);text-decoration:underline;padding:0 4px;font-size:13.5px}
.inl{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:700} .inl input{width:5em}
.fld .btn.small{margin-bottom:6px}

.gc{margin-top:12px;overflow-x:auto;font-size:12.5px;--n:12}
.gh,.gr{display:grid;grid-template-columns:11em repeat(var(--n),minmax(22px,1fr));align-items:center;min-width:520px}
.gh span{text-align:center;color:var(--faint);font-family:var(--mono);padding:3px 0;border-bottom:1px solid var(--line)}
.gr{border-bottom:1px solid var(--line);min-height:28px}
.gl{grid-column:1;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.gr i{grid-row:1;height:14px;border-radius:5px;background:var(--brand);margin:0 2px}
.gr i.buf{background:transparent;border:1.5px dashed var(--accent)}

.setup{display:grid;gap:14px}
.setup .card h3{font-size:16.5px;color:var(--brand);margin-bottom:8px}
.opts{display:grid;gap:6px}
.opts.pick{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:1px solid var(--line);background:var(--field);padding:9px 11px}
.opt:hover{border-color:var(--brand)}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-tint)}
.opt span{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.opt b{color:var(--ink);font-size:14.5px}
.opt code{font-weight:700;color:var(--accent)}
.card.soft{background:var(--accent-tint);border-color:transparent}
.confirm{display:inline-flex;gap:8px;align-items:center;margin-left:10px;font-size:13.5px;flex-wrap:wrap}

.review{display:grid;gap:14px}
.review .card h3{font-size:17px;color:var(--brand)}
.map{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.map li{display:grid;grid-template-columns:10.5em minmax(0,1fr) auto;gap:10px;align-items:baseline;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px}
.map li b{color:var(--brand)} .map li.hot{border-color:var(--accent);background:var(--accent-tint)}
.map li.empty span{color:var(--bad)}
.issues{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.issues li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;background:var(--bad-tint);border-radius:8px;padding:7px 10px;font-size:14px;flex-wrap:wrap}
.ok{color:var(--ok);background:var(--ok-tint);border-radius:9px;padding:10px 12px}
.ex-btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.preview{max-height:480px;overflow:auto;font-size:14px;margin-top:10px;font-family:var(--serif)}
.preview h1{font-size:20px;text-align:center;margin:10px 0} .preview h2{font-size:17px;margin:16px 0 6px;color:var(--brand)} .preview h3{font-size:15px;margin:10px 0 4px}
.preview table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:12.5px;margin:6px 0} .preview td,.preview th{border:1px solid var(--line-strong);padding:3px 6px;vertical-align:top}
.danger{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong)}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}

@media (max-width:1180px){ .cols{grid-template-columns:minmax(0,1fr)} .side{position:static;max-height:none;overflow:visible} }
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  #menu{display:inline-block}
  #side-nav{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);max-height:none;z-index:25;background:var(--card);box-shadow:0 0 40px rgba(0,0,0,.3);
    padding:calc(env(safe-area-inset-top,0px) + 70px) 14px 24px max(14px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .2s}
  #side-nav.open{transform:none}
  .opts.pick{grid-template-columns:minmax(0,1fr)}
  #who{display:none}
  .prog i{width:70px}
}
@media (max-width:560px){
  .chip{grid-template-columns:minmax(0,1fr)} .map li{grid-template-columns:minmax(0,1fr) auto} .map li span{grid-column:1/-1;order:3}
  #sy{max-width:100%;flex:1 1 100%}
}
@media (prefers-reduced-motion:reduce){ #side-nav,.prog i::after{transition:none} }

.oneclick{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.cv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cv label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.cv input{border:1px solid var(--line-strong);background:var(--field);border-radius:9px;padding:7px 10px;font-size:14.5px}
.irbf{display:grid;gap:12px} .irbf[open]{padding-bottom:14px}
.exp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:10px 0}
.exp{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--field)}
.exp h4{color:var(--brand);font-size:15.5px} .exp p{margin:0;font-size:13.5px;color:var(--muted)} .exp .btn{align-self:flex-start;margin-top:auto}
.preview .ctr{text-align:center} .preview .ctr.b{font-weight:700} .preview .ind{text-indent:2em} .preview .ref{padding-left:2em;text-indent:-2em}
.preview .cap{text-align:center;font-weight:700;font-size:13px} .preview .note{color:var(--faint);font-size:13px} .preview .sign{margin-top:14px}
.preview hr{border:0;border-top:1px dashed var(--line-strong);margin:16px 0}
.preview .figv svg{display:block;max-width:100%;height:auto;margin:8px auto;border:1px solid var(--line)}
.preview .tocv ul{list-style:none;padding-left:0;margin:4px 0 8px}.preview .tocv li{border-bottom:1px dotted var(--line);padding:2px 0}.preview .tocv li.l2{padding-left:2em}
.preview .en{text-align:justify}
@media (max-width:700px){.exp-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.oneclick{order:5}}

.presets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.preset.on{background:var(--brand);color:var(--on-brand)}
#demo.flash,.card.flash{outline:3px solid var(--accent);outline-offset:2px}
.pgrp{margin:14px 0 0;font-size:14px;color:var(--ink-2,inherit)}
</style>
</head>
<body>
<header class="top"><div class="top-in">
<button id="menu" type="button" aria-expanded="false" aria-controls="side-nav">步驟</button>
<div class="brand">研究計畫書工作台<small>研究方法論 · 6.0</small></div>
<div id="who"></div>
<div class="prog" id="prog"><i></i><span id="progt"></span></div>
<button type="button" id="oneclick" class="oneclick">一鍵匯入範例</button>

<script>window.SOP_DATA={"mods": {"m1": {"name": "問題意識與重要性", "sub": "讀者讀完第一頁，要能說出：誰、在什麼情境、遇到什麼困難、為什麼現在要研究", "q": "這個問題是什麼？誰受影響？為什麼值得現在研究？", "must": ["現象：用數據或具體情境描述「現在發生什麼事」", "對象與規模：誰受影響、影響多少人或多大範圍", "現行做法：目前怎麼處理（流程、制度、工具）", "不足：現行做法哪裡不夠，造成什麼後果", "知識缺口預告：文獻還沒回答什麼（細節留給 M2）", "時機：為什麼是現在（政策、導入時程、新技術）", "重要性：對實務、學術、政策各有什麼價值", "結尾句自然導向研究目的（M3）"], "errs": [["以技術為起點：「AI 很重要，所以本研究…」", "從場域問題起筆；AI 是解法，放在後段"], ["只寫領域，不寫問題", "寫出誰、在什麼情境、遇到什麼困難"], ["重要性只有「填補缺口」", "加上實務：誰會用結果、做什麼決定"]], "key": "M1 寫的是「為什麼要做」，不是「做什麼」；做什麼留給 M3，怎麼做留給 M5。問題陳述四元素同 6.1 第 11 張。", "where": ["第一章 1.1 背景與動機、1.2 問題陳述", "CM03 (一) 研究計畫之背景", "「計畫背景」「現況分析」"], "tpl": [["① 場域現象", "在〔場域〕中，〔對象〕每〔時間單位〕需〔做什麼事〕，〔數據或具體情境〕。這使得〔後果，如照護時間被壓縮、錯誤增加〕。"], ["② 現行做法與不足", "目前多以〔現行做法〕處理，然而〔不足之處 1〕，且〔不足之處 2〕，導致〔問題持續的後果〕。"], ["③ 新解法與缺口", "近年〔新技術或新介入〕已於〔其他場域〕顯示〔效果〕（〔引用〕），惟在〔本研究場域〕仍缺乏〔哪一種證據〕。"], ["④ 時機與重要性", "〔機構或政策〕即將〔導入、改制〕，正提供〔評估的時機〕。本研究結果可作為〔誰〕〔做什麼決定〕之依據，並〔學術貢獻〕。"], ["⑤ 導向目的", "因此，本研究擬探討〔核心問題〕（研究目的詳見〔1.3 節〕）。"]], "ex": [["① 場域現象", "住宿式長照機構之交班高度依賴自由文字紀錄，護理人員每班須花相當時間彙整前一班照護重點，文書負擔排擠直接照護時間。"], ["② 不足", "現行以人工閱讀與口頭交接為主，資訊散落於多份紀錄，資深與新進人員之彙整品質落差大。"], ["③ 缺口", "生成式 AI 摘要已見於醫院場域研究，惟長照場域缺乏「時間」與「品質」並測之量化證據（文獻見 M2）。"], ["④ 時機", "兩家合作機構將於 2026 年 11 月與 2027 年 2 月先後導入摘要工具，提供非同期比較之時機。"], ["⑤ 重要性", "結果可作為機構是否全面導入之依據，並補足長照場域之量化證據。"]], "checks": [["非本領域的人讀完，能說出「誰、什麼情境、什麼困難」？", "M1-2"], ["至少有一處數據或具體情境，且附出處？", "M1-1"], ["最後一段自然導向研究目的，而不是突然跳到 AI？", "M3-1"]], "exkey": "案例 Q 的問題是「交班太費時、品質不一」，不是「AI」；AI 摘要工具是被評估的對象。"}, "m2": {"name": "文獻回顧與研究缺口", "sub": "文獻探討不是逐篇摘要，是證明「已知什麼、未知什麼、為什麼值得回答」", "q": "這個問題，別人已經知道什麼、還不知道什麼？", "must": ["結構化問題：量性用 PICO，質性用 PICo", "至少 2 個資料庫（含 1 個中文來源），附完整檢索式", "檢索日誌：資料庫、日期、檢索式、限制、筆數", "篩選流程：辨識 → 篩選 → 全文 → 納入，數字對得起來", "綜整矩陣 8–10 篇：同一欄位橫向比較", "依主題組織段落，不依文獻逐篇排列", "缺口論述三段：已知 → 未知 → 為何值得", "核心理論或模式（架構圖的依據，接 M4）"], "errs": [["逐篇摘述，最後一句「綜上所述」", "改為主題式段落，一段比較多篇"], ["主張「國內研究較少」卻沒查中文庫", "補中文資料庫檢索與筆數"], ["引用由 AI 生成、未經查證的文獻", "每筆都要能在原期刊查到"]], "key": "檢索策略、PRISMA 與綜整矩陣的做法見 5.1；這裡只管「怎麼寫成段落」。缺口要有矩陣佐證，不能只靠感覺。", "where": ["第二章 文獻探討（末節為研究架構）", "CM03 (一) 國內外研究情況、重要文獻評述", "「文獻探討」或併入背景"], "tpl": [["章節骨架", "2.1〔核心概念或場域現況〕　2.2〔介入或技術〕之應用與證據　2.3〔結果變項〕之測量\n2.4〔理論或模式〕　2.5 研究缺口與本研究定位　2.6 研究架構（接 M4）"], ["主題段落", "關於〔主題〕，〔作者 A（年）〕與〔作者 B（年）〕皆發現〔共同結果〕；然〔作者 C（年）〕於〔不同場域或對象〕得到〔不同結果〕，差異可能來自〔設計、樣本或測量之不同〕。"], ["段落收尾", "上述研究顯示〔整理後的已知〕，惟〔尚未回答的部分〕，此即本研究〔第幾項目的〕之依據。"], ["缺口 ① 已知", "既有研究已證實〔已知 1〕與〔已知 2〕（〔引用〕）。"], ["缺口 ② 未知", "然而，〔場域、族群、結果或方法〕上仍缺乏〔哪種證據〕：〔矩陣中大家都空著的那一欄〕。"], ["缺口 ③ 為何值得", "此缺口使〔誰〕在〔做什麼決定〕時缺乏依據；本研究將以〔設計〕回答〔問題〕。"]], "ex": [["PICO", "P 長照機構負責交班之護理人員｜I AI 照護紀錄摘要工具｜C 導入前及同期未導入機構｜O 交班準備時間、紀錄完整性"], ["已知", "醫院場域之 AI 摘要研究多報告文書時間縮短；長照場域已有照護人員使用經驗之質性研究。"], ["未知", "長照場域導入後，時間與紀錄品質是否「同時」改善，缺乏並測之量化證據；多數研究亦缺同期對照。"], ["為何值得", "機構需同時知道「省多少時間」與「品質有無變差」才能決定是否全面導入。"], ["架構依據", "以社會技術模型（Sittig & Singh, 2010）說明工具、人員、流程之交互作用，接 M4 架構圖。"]], "checks": [["檢索式可以直接貼上執行，且含中文資料庫？", "M2-1"], ["段落以主題開頭，一段比較多篇？", "M2-2"], ["缺口有矩陣佐證，並指出誰會用到結果？", "M2-2"]], "exkey": "案例 Q 的缺口是「並測」與「同期對照」兩個證據缺口，而不是「沒有人做過 AI」。"}, "m3": {"name": "研究目的、問題與假設", "sub": "把缺口收斂成一個可回答的問題；每個目的都要對得到一種分析（M6）", "q": "我到底要問什麼？要證明或描述什麼？", "must": ["主要研究問題：單一語句、60 字內", "2–3 項研究目的：以可檢驗動詞開頭（描述、探討、比較、檢驗；系統或工具研究可用「開發」）", "每項目的對應一個研究問題（或假設）", "量性：方向性假設＋虛無假設；描述性目的不設假設", "質性：探究焦點與引導性問題，說明不設假設的理由", "名詞界定：關鍵名詞的概念型與操作型定義（接 M4）", "研究範圍：對象、場域、期間；不做什麼", "目的數量與碩論規模相稱（通常 2–3 項）"], "errs": [["一句話問三件事（現況、因素、如何改善）", "只留答得了的；其餘移到未來研究"], ["描述性目的也寫假設", "描述性目的不設假設，只寫要估計什麼"], ["質性研究寫「研究者將保持客觀中立」", "改寫前理解與反身性作法（見 E 型）"]], "key": "檢驗法：把研究問題唸給非本領域的人聽；對方能複述「要比較什麼」才算研究問題，只能複述主題名詞就還是題目。", "where": ["第一章 1.3 目的、1.4 問題與假設、1.5 名詞界定", "CM03 (一) 末段或 (二) 開頭", "「計畫目標」"], "tpl": [["主要研究問題", "〔對象〕在〔情境〕中〔接受介入或暴露〕後，〔結果〕是否〔改變方向〕？（60 字內）"], ["目的（量性）", "一、〔描述〕〔對象〕之〔變項〕現況。\n二、〔比較或檢驗〕〔介入或分組〕對〔結果〕之影響。\n三、〔探討〕〔因素〕與〔結果〕之關係。"], ["研究問題", "對應每一目的各寫一題：〔目的二〕→「〔介入〕後〔結果〕是否較〔對照〕〔方向〕？」"], ["假設", "H1：〔介入組〕之〔結果〕〔高於／低於〕〔對照組〕。\nH0：兩組〔結果〕無差異。（虛無假設要與 H1 對應同一個比較）\n非劣性：H2：差異之 95% CI 下界高於〔−界限〕；H0：差異 ≤〔−界限〕。"], ["目的（質性）", "探討〔對象〕在〔情境〕中如何〔經驗、判斷、因應〕〔現象〕；探究焦點：〔面向 1〕、〔面向 2〕。"], ["範圍與限制", "本研究以〔場域〕之〔對象〕為範圍，期間〔起訖〕；不包含〔不做的部分及理由〕。"]], "ex": [["主要問題", "長照機構導入 AI 照護紀錄摘要工具後，交班準備時間是否縮短、紀錄完整性是否不變差？"], ["目的一", "To determine：導入後交班準備時間之變化（A 機構前後，並與同期未導入之 B 機構比較）。"], ["目的二", "To evaluate：紀錄完整性是否非劣於導入前。"], ["目的三", "To explore：照護人員之認知負荷與對 AI 摘要之信任。"], ["假設", "H1a：A 機構導入後交班準備時間較導入前縮短。\nH1b：A 機構前後降幅大於同期 B 機構之變化（DiD < 0）。\nH2：完整性差異之 95% CI 下界高於 −1.0 分（非劣性界限）。"], ["範圍", "北部 2 家機構、62 人、12 個月；不含工具開發與成本效益。"]], "checks": [["每個目的都以可檢驗的動詞開頭，且對得到一個假設或問題？", "M3-2"], ["描述或探索性的目的沒有硬寫假設？", "M3-1"], ["非本領域的人能複述「要比較什麼」？", "M3-1"]], "exkey": "H2 用非劣性而不是「無差異」：檢定不顯著不等於品質沒變差，非劣性要事先訂界限（見 2.6、9.4）。"}, "m4": {"name": "研究架構與變項定義", "sub": "一張圖讓讀者看懂變項之間的關係；一張表讓別人照著能測出同樣的東西", "q": "用什麼概念去問？每個概念怎麼測？", "must": ["研究架構圖：標明自變項、依變項、中介、干擾、控制變項", "每條箭頭都有理論或文獻依據（接 M2）", "未納入的重要變項及理由", "變項定義表：名稱、角色、概念型定義、操作型定義", "測量工具或資料欄位、尺度、範圍與計分", "測量時點（前測、後測、每月）與資料來源", "信效度依據：既有工具引證據，自編工具寫建立程序", "質性：初步分析框架，註明「將依資料修正」"], "errs": [["架構圖沒標變項角色，箭頭方向不明", "每個方框標角色；箭頭由因指向果"], ["操作型定義只寫「以問卷測量」", "寫出量表名稱、題數、計分與範圍"], ["質性研究畫成自變項 → 依變項", "改為探究焦點與各面向的初步關聯"]], "key": "架構圖與變項定義表是 M6 分析計畫的輸入：表上每一列，都要在分析計畫裡找得到它的位置。", "where": ["第二章末 研究架構、第三章 3.4 研究工具", "CM03 (二) 研究方法（附架構圖）", "「實施方法」或附件"], "tpl": [["架構圖", "左側放自變項（介入、分組、時間），右側放依變項；中介放中間，干擾以虛線箭頭指向主箭頭，控制變項放下方方框。\n圖下附一句：「本架構依〔理論或模式〕（〔引用〕）建立，箭頭 〔a〕 之依據為〔文獻〕。」"], ["變項名稱與角色", "〔中英文名稱〕；角色：〔自變項／依變項／中介／干擾／控制〕"], ["概念型定義", "〔該概念在文獻上的定義〕（〔引用〕）"], ["操作型定義", "本研究以〔具體工具或資料〕代表此概念：〔題數〕題、〔計分方式〕、範圍〔最低〕–〔最高〕，分數愈高表示〔意義〕。"], ["尺度與時點", "尺度：〔名目／次序／等距／比率〕；測量時點：〔前測、後測…〕；資料來源：〔問卷、觀察、系統日誌、資料庫欄位〕"], ["信效度依據", "既有工具：原作者報告〔信效度證據〕；自編工具：〔專家內容效度、預試、重測〕（見 2.2、2.2A、4.3）"]], "ex": [["自變項", "導入狀態（前測／後測）× 機構（A 先導入／B 延後導入）"], ["主要依變項", "交班準備時間：自開始彙整至完成交班之分鐘數；第三方觀察計時；比率尺度"], ["次要依變項", "紀錄完整性：0–20 分評分表，兩位評分者獨立評分；二次確認詢問次數：每次交班之次數"], ["探索變項", "認知負荷：自編 8 題量表；對 AI 摘要之信任：4 題量表"], ["控制變項", "當班照顧住民數、職類（護理師／資深照服員）、年資"], ["自編量表依據", "專家內容效度 5 位、預試 30 人（其中 15 人兩週後重測），程序見 2.2A"]], "checks": [["架構圖上每個方框都標了角色，每條箭頭都有依據？", "M4-2"], ["每個變項都寫到「題數、計分、範圍」這麼細？", "M4-2"], ["定義表每一列，在 M6 分析計畫都找得到？", "M6-1"]], "exkey": "主要依變項只有一個（交班準備時間）；主要結果要事先寫定，避免看結果才挑。"}, "m5": {"name": "研究方法（分支點）", "sub": "第三章要同時做到「夠嚴謹」與「做得到」；八節是共通骨架，各型的特有寫法見 Part 3", "q": "怎麼做，結果才可信？別人照著做，能不能重做一次？", "must": ["3.1 研究設計：用什麼設計，並寫至少兩項不採的設計與理由", "3.2 場域與對象：可操作的納入與排除條件", "3.3 抽樣與樣本數：完整參數與計算過程（質性寫飽和判準）", "3.4 研究工具：來源、題數、計分、信效度（質性附訪談大綱）", "3.5 資料蒐集流程：依時序寫，含去識別化時點", "3.6 資料分析計畫（見 M6）", "3.7 偏差來源與因應：至少三項具名偏差", "3.8 研究倫理與資料保護（見 M7）"], "errs": [["「依 G*Power 計算，樣本數為 120 人」", "寫檢定、效果量與依據、α、檢定力、流失率"], ["方法與研究問題對不上", "逐條對照 M3 的目的，一個目的至少一種做法"], ["只寫「將注意偏差」", "具名寫出偏差與可執行的因應措施"]], "key": "八節同 @A 四階段作業 A4。寫到這裡先依主型跳到 Part 3（A–H），照該型的小節清單補足特有內容，再回到 M5-2 起的模板。", "where": ["第三章 研究方法（3.1–3.8）", "CM03 (二) 研究方法、進行步驟及執行進度", "「實施方法與步驟」"], "tpl": [["3.1 設計", "本研究採〔設計名稱〕（〔主型代號〕）。選擇此設計之理由為〔與研究問題的對應〕。"], ["不採之設計", "不採〔設計甲〕，因〔理由，如無分派權、倫理或資源限制〕；\n不採〔設計乙〕，因〔無法排除的替代解釋〕。"], ["3.2 場域", "研究場域為〔機構名稱或類型〕〔規模，如床數、人數〕，已取得〔單位〕之〔書面同意〕（附錄〔　〕）。"], ["對象與條件", "納入條件：〔可操作的條件 1〕、〔條件 2〕；\n排除條件：〔條件〕；依同一條件，他人應可篩出同一群體。"], ["量性樣本數", "以〔G*Power 3.1／R pwr〕估算：〔檢定方法〕、效果量〔數值〕（依據：〔前導研究或文獻〕；無依據時採保守中效果）、α = 〔　〕〔單／雙〕尾、檢定力〔　〕，需〔n〕人；考量流失率〔　〕%，預計收案〔N〕人。\n群集分派（以病房、班級、機構為單位）：再乘以設計效應 1 ＋（平均群集人數 − 1）× ICC；群集數太少（如只有 2 個）時無法估計 ICC，須在限制中說明。"], ["質性人數", "以〔資訊力或飽和〕為判準：連續〔　〕位受訪者未出現新主題即停止，並續訪〔　〕位確認；預估約〔　〕人（〔引用〕）。"], ["問卷調查", "依可容許誤差〔　〕、信心水準〔　〕估算；或依 SEM 參數數量估算（見 2.3、4.1、D 型）。"], ["3.4 既有工具", "採用〔量表名稱〕（〔原作者，年〕）〔中文版，譯者〕，共〔　〕題、〔　〕點計分，原研究 Cronbach's α 為〔　〕；已取得〔作者授權〕。"], ["3.4 自編工具", "依〔文獻〕初擬〔　〕題 → 專家〔　〕位內容效度（I-CVI、S-CVI）→ 預試〔　〕人 → 〔重測、項目分析〕（流程見 2.2A）。"], ["3.5 流程", "一、IRB 核准後〔第幾月〕：〔聯繫場域、說明會、取得同意〕。\n二、〔前測或基線〕：〔做什麼、誰做、在哪做、多久〕。\n三、〔介入或資料蒐集〕：〔內容、頻率、期間〕。\n四、〔後測或追蹤〕；資料於〔時點〕完成去識別化並〔儲存方式〕。"], ["資料串接", "以〔研究編號〕串接〔問卷、觀察、系統日誌〕；對照表由〔專人〕保管，與研究資料分開存放。"], ["3.7 偏差 ①", "〔偏差名稱，如選擇偏差〕：因〔原因〕可能使〔結果偏向何方〕；因應：〔具體措施〕。"], ["3.7 偏差 ②", "〔測量偏差〕：因〔原因〕；因應：〔盲性、標準化流程、評分者訓練與信度檢核〕。"], ["3.7 偏差 ③", "〔干擾或流失〕：因〔原因〕；因應：〔對照組、多變項調整、意向治療分析、流失追蹤〕。"]], "ex": [["3.1 設計", "非同期導入之準實驗；不採 RCT（導入時程由管理階層決定，無分派權）、不採單組前後測（無法排除同期政策與人力變動）、不採橫斷面（無法回答是否帶來改變）。"], ["3.2 對象", "北部 2 家住宿式長照機構（A 120 床、34 人；B 96 床、28 人）負責交班之護理師與資深照服員，共 62 人，全體普查。"], ["3.3 樣本數", "配對 t 檢定、dz = 0.5（保守中效果）、α = .05 雙尾、檢定力 .80 → 至少 34 人；A 機構 34 人全數納入（2.6）。"], ["3.4 工具", "第三方觀察計時；完整性 0–20 分評分表（雙評分者）；自編認知負荷量表（內容效度、預試與重測，見 2.2A）。"], ["3.5 流程", "M1–M2 IRB 與觀察者校準 → M2–M3 前測 → A 機構 2026 年 11 月、B 機構 2027 年 2 月導入 → M9–M11 質性訪談。"], ["3.7 偏差", "觀察者效應 → 前測期先適應；同期事件 → B 機構同期對照；評分偏差 → 評分者不知前後測。"]], "checks": [["至少寫了兩項不採的設計與具體理由？", "M5-2"], ["樣本數的參數齊全，別人可以重算一次？", "M5-3"], ["至少三項具名偏差，各有可執行的因應？", "M5-4"]], "exkey": "3.6 分析與 3.8 倫理分別在 M6、M7 寫；這裡列出的六節，加上那兩節，就是 @A A4 要求的八節。"}, "m6": {"name": "資料分析計畫", "sub": "分析要在收資料前寫定：每個目的配一種分析，連前提檢查與缺值處理都事先決定", "q": "每個研究目的，分別用什麼方法分析？", "must": ["目的—假設—變項—方法—判準 對照表（一列一個目的）", "主要分析與次要分析分開寫", "前提檢查：常態、變異數同質、獨立性等，不成立時的替代法", "缺值處理：缺多少才處理、用什麼方法", "巢套或重複測量資料的處理（混合模型或 GEE）", "顯著水準、單雙尾、多重比較校正", "敏感度分析：換一種合理假設，結論是否改變", "軟體與版本；質性寫分析步驟與編碼方式"], "errs": [["只寫「以 SPSS 進行統計分析」", "逐一目的寫出檢定方法與判準"], ["巢套資料直接跑一般迴歸", "改用混合效果模型或 GEE，至少做敏感度分析"], ["寫了沒規劃的分析，或看結果才挑", "主要分析事先寫定；探索性分析明白標示"]], "key": "檢驗法：把 M3 目的表、M4 定義表與本頁對照表三張排在一起，每一列都要接得上；接不上的就是漏寫或多寫。", "where": ["第三章 3.6 資料分析計畫", "CM03 (二) 研究方法（分析策略）", "「實施方法」或「成效評估方式」"], "tpl": [["對照表欄位", "目的｜假設｜依變項（尺度）｜自變項｜分析方法｜判準（α、CI、界限）｜補充或敏感度分析"], ["描述性目的", "以〔平均數、標準差／次數、百分比〕描述〔變項〕；〔連續變項〕另報〔中位數與四分位距〕。"], ["比較性目的", "以〔配對 t／獨立 t／ANOVA／卡方〕檢驗〔假設〕，報告效果量〔d、η²、OR〕與 95% CI；若〔前提不成立〕，改用〔Wilcoxon 等無母數法〕。"], ["關係或預測", "以〔多元迴歸／邏輯斯迴歸／SEM〕檢驗〔自變項〕對〔依變項〕之影響，控制〔共變項〕；檢查〔共線性、殘差〕。"], ["缺值與敏感度", "缺值比例〔　〕% 以下以〔完整個案〕分析；高於此以〔多重插補〕，並以〔另一方法〕做敏感度分析。"], ["質性分析", "依〔Braun & Clarke 主題分析六步驟／內容分析〕；前〔　〕份逐字稿雙人獨立編碼，歧異以協商共識處理；以〔軟體〕管理編碼。"], ["多重比較", "主要結果只有一個；次要結果或多組比較以〔Holm／Bonferroni〕校正，或明白標示為探索性。"]], "ex": [["目的一", "A 機構前後：配對 t 檢定；A 對 B 同期：差異中之差異（DiD）；敏感度：混合效果模型（交班事件巢套於人員）。"], ["目的二", "完整性差異之 95% CI 與非劣性界限 −1.0 分比較：CI 下界高於 −1.0 即判定非劣。"], ["目的三", "認知負荷、信任以描述統計呈現，並以相關與多元迴歸探索其與準備時間之關係（探索性，明白標示）。"], ["共通設定", "α = .05 雙尾；量表 Cronbach's α 於正式施測後重新計算；分析以 Python（版本寫明）執行，腳本存檔。"], ["質性後接", "案例 L：依量化結果挑兩端案例訪談，主題分析六步驟，雙人獨立編碼前 4 份逐字稿。"]], "checks": [["M3 的每個目的，在這裡都有一列？", "M6-2"], ["重複測量或巢套資料，有寫怎麼處理？", "M6-1"], ["判準事先寫定，且分得出主要與探索性分析？", "M6-2"]], "exkey": "案例 Q 交班事件是「人重複測 12 次」，所以主分析外要加混合效果模型；這正是 @A A4 最常失分第二項。"}, "m7": {"name": "研究倫理、IRB 與資料治理", "sub": "計畫書要寫清楚：送哪種審查、怎麼取得同意、資料從收集到銷毀怎麼保護", "q": "參與者的權益怎麼保障？資料怎麼存、誰能看、何時銷毀？", "must": ["審查機構與預計審查類型（依 IRB 判定）", "知情同意方式；或申請免除同意的理由與條件", "參與者風險與降低方式；退出權、不影響考核或照護", "去識別化作法與時點；對照表保管方式", "資料儲存：位置、加密、存取權限、保存年限與銷毀", "次級資料：申請管道與使用規範（如健保資料）", "利益衝突揭露；生成式 AI 工具使用與資料不外流", "預計時程：何時送審、補件緩衝（接 M8）"], "errs": [["只寫「將通過 IRB 審查」", "寫審查類型、同意方式、資料保護細節"], ["研究者是受試者的主管，卻沒處理", "改由第三人招募，並說明不影響考核"], ["把含個資的資料貼進雲端 AI 工具", "去識別後才可使用，並寫進資料管理計畫"]], "key": "法規與審查類型見 7.1，隱私與資安見 9.11；本頁只管「計畫書要寫到哪些項目」。IRB 時程通常比想像長，提早送。", "where": ["第三章 3.8、附錄同意書", "CM01 勾選人體研究；CM03 (二) 敘明", "多列為必附文件"], "tpl": [["審查", "本研究將送〔機構〕人體研究倫理審查委員會審查，預計〔審查類型〕，於核准後始收案。"], ["同意", "〔對象〕於充分說明後簽署書面同意；〔對象或資料〕因〔理由〕擬申請免除知情同意，符合〔法規條件〕。"], ["風險與權益", "本研究風險為〔最小風險之說明〕；參與者可隨時退出，不影響其〔考核、照護、權益〕；招募由〔非直屬主管之第三人〕進行。"], ["去識別化", "資料於〔時點〕以研究編號取代姓名與〔識別欄位〕；對照表由〔專人〕保管於〔位置〕，與研究資料分開。"], ["儲存與銷毀", "資料存於〔加密位置〕，僅〔研究團隊成員〕可存取；保存至〔年限〕後以〔方式〕銷毀。"], ["利益衝突與 AI", "研究者與〔廠商或單位〕〔無／有〕財務關係〔揭露內容〕；生成式 AI 僅用於〔用途〕，不輸入可識別資料。"]], "ex": [["審查", "送合作機構所屬之人體研究倫理審查委員會；M1 送審，M2 核准後才開始前測。"], ["人員同意", "護理人員與照服員簽署書面同意；招募與說明由研究團隊進行，參與與否不影響考核。"], ["住民資料", "交班紀錄含住民個資：去識別化後才離開機構，並依 7.1 評估申請免除住民同意之條件。"], ["資料保護", "研究編號串接觀察、問卷與系統日誌；對照表由專人保管；存取限研究團隊。"], ["利益衝突", "揭露研究者與摘要工具廠商之關係；工具由機構採購，研究團隊不參與開發。"]], "checks": [["同意方式（或免除同意的理由）寫清楚了？", "M7-2"], ["去識別化的時點與對照表保管方式寫了？", "M7-2"], ["IRB 送審與補件時間已排進甘特圖？", "M8-1"]], "exkey": "案例 Q 的倫理重點是「住民資料」：受試者是人員，但紀錄內容屬於住民，兩者的同意要分開處理（見 7.1、9.11）。"}, "m8": {"name": "時程、可行性與風險", "sub": "說服審查者「你做得完」：甘特圖、可行性證據，以及卡住時的備案", "q": "一年內做得完嗎？哪一步最可能卡住？備案是什麼？", "must": ["甘特圖：以月為單位，自 IRB 送審到論文口試", "標明里程碑（IRB 核准、收案完成、分析完成…）", "任務之間的相依關係（前一步沒完成，下一步不能開始）", "至少兩個月緩衝，並寫明用途", "可行性證據：資料、場域、樣本、時間四項（見 0.1）", "已取得的同意書、預試或前導結果", "風險—對策表：可能遭遇的困難及解決途徑", "與方法章的時點完全一致（接 M5 的 3.5 節）"], "errs": [["時程最後一個月就是口試", "保留至少兩個月緩衝，標明用途"], ["可行性寫「應可取得」「預計無虞」", "附查證對象、日期與答覆"], ["甘特圖與方法章時點對不上", "逐項對照 3.5 節流程"]], "key": "國科會 CM03 明文要求寫「預計可能遭遇之困難及解決途徑」；論文計畫書沒有規定，但口委幾乎一定會問（@A 八問之八）。", "where": ["第三章末或第四章 研究時程", "CM03 (二) 執行進度、困難及解決途徑", "「期程安排」「風險管理」"], "tpl": [["甘特圖列", "工作項目｜起訖月份｜負責人｜前置工作｜里程碑（★）"], ["里程碑句", "★ M〔　〕〔里程碑名稱〕：〔判定完成的具體條件，如核准函、收齊〔　〕份〕。"], ["緩衝", "M〔　〕至 M〔　〕保留緩衝，用於〔IRB 補件、回收不足時延長收案、分析修正〕。"], ["可行性證據", "〔資料／場域〕已於〔日期〕取得〔單位〕〔書面同意或回覆〕（附錄〔　〕）；預試〔　〕人顯示〔可行之處〕。"], ["風險 → 對策", "若〔困難，如回收率低於預期〕，將〔對策，如延長收案、增加提醒、增加收案場域〕；判斷時點為 M〔　〕。"], ["多年期（國科會）", "第一年：〔工作項目〕；第二年：〔工作項目〕；每年各列查核點。"]], "ex": [["時程", "M1–M2 準備（IRB、觀察者校準、量表預試）→ M2–M3 前測 → M3 起 A 機構導入與後測 → M6 起 B 機構導入 → M9–M11 質性訪談 → M11–M12 分析與寫作"], ["里程碑", "★M2 IRB 核准　★M3 前測收齊　★M4 A 機構導入完成　★M7 B 機構導入完成　★M11 資料飽和確認　★M12 初稿完成"], ["可行性", "兩機構管理階層已同意導入時程與現場觀察；觀察計時與量表已規劃預試。"], ["風險 ①", "IRB 補件延誤 → M1 即送審；A 機構導入前仍須完成前測，必要時縮短前測期並記錄。"], ["風險 ②", "B 機構導入再延後 → 對照期延長，改以中斷時間序列補充分析（8.3）。"], ["風險 ③", "問卷回收不足 → 兩次提醒並請單位主管協助發放；於 M4 檢視回收狀況。"]], "checks": [["每個里程碑都有判定完成的具體條件？", "M8-2"], ["寫了至少三項風險，各有觸發條件與對策？", "M8-2"], ["甘特圖的時點與 3.5 節流程完全一致？", "M5-4"]], "exkey": "論文版另須在口試前保留至少兩個月緩衝（@A A4）；案例 Q 的 12 個月是執行期，不含口試。"}, "m9": {"name": "預期成果與貢獻", "sub": "寫的是「預期會看到什麼、對誰有什麼用」，不是結論；每一條都要對應一個目的", "q": "如果研究順利完成，會得到什麼？對學術與實務有什麼用？", "must": ["預期結果：理論 → 假設 → 預期觀察，逐條對應目的", "結果不如預期時的意義（不顯著、方向相反）", "學術貢獻：補了哪個缺口（接 M2）", "實務貢獻：誰會用、做什麼決定", "政策或產業貢獻（如有）", "研究限制：分「設計本身」與「執行面」兩類", "具體產出：論文、研討會、系統、指標、資料集", "國科會另需：參與人員可獲之訓練、對國家發展之貢獻"], "errs": [["把預期結果寫成已證實的結論", "用「預期」「若…則…」的未來式"], ["貢獻只寫「具參考價值」", "寫出使用者、決定與使用場景"], ["限制只寫「樣本數不足」", "分設計與執行兩類，各寫影響與因應"]], "key": "預期結果的推導鏈同 6.1 第 22 張；不得預告未經規劃的分析，也不要寫出具體數字結果。", "where": ["第三章末 預期結果、研究限制", "CM03 (三) 預期完成之工作項目及成果", "「預期效益」（多要求指標與目標值）"], "tpl": [["預期結果", "依〔理論或文獻〕，預期〔介入或因素〕將使〔結果〕〔方向〕；若結果〔不顯著或相反〕，則表示〔可能的解釋〕，仍可提供〔何種資訊〕。"], ["學術貢獻", "本研究將補足〔缺口〕，提供〔場域、族群〕之〔證據類型〕。"], ["實務貢獻", "結果可供〔使用者，如機構主管〕於〔決定，如是否全面導入〕時參考，並提出〔具體產出，如導入檢核清單〕。"], ["設計限制", "本研究採〔設計〕，無法〔排除之解釋〕；結果推論範圍限於〔場域、族群〕。"], ["執行限制", "可能面臨〔流失、觀察者效應、工具版本更新〕，將以〔因應〕降低其影響。"], ["具體產出", "預計完成〔碩士論文〕，並投稿〔期刊或研討會類型〕；國科會另寫〔人員訓練〕與〔成果之質與量〕。"]], "ex": [["預期結果", "交班準備時間縮短且完整性非劣；負荷下降，但需檢驗二次確認負擔是否增加。"], ["若不如預期", "若時間未縮短，將以使用紀錄與質性訪談（案例 L）找出原因，提供導入改善方向。"], ["學術貢獻", "填補長照場域「時間＋品質」並測、且有同期對照之量化證據。"], ["實務貢獻", "機構是否全面導入之決策依據；提出導入時的教育訓練與核對流程建議。"], ["限制", "設計：非隨機、僅北部 2 家機構；執行：觀察者效應、研究期間工具版本可能更新。"] <script>window.PW_CASES={"A":{"label":"A 系統開發：長者用藥提醒 App","grp":0,"data":{"meta":{"type":"A","type2":""},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"居家長者多重用藥，常忘記服藥、重複服藥或自行停藥；紙本藥袋與口頭提醒難以持續，不同住的照顧者也無法即時掌握服藥情形。","s1_2":"北部某社區藥局合作之 65 歲以上、每日服用 3 種以上慢性病藥物之居家長者及其主要照顧者。","s1_3":"自行開發之長者用藥提醒 App（提醒、服藥紀錄、照顧者通知）。","s1_4":"可用性：任務完成率、操作時間、錯誤數、SUS 分數；服藥紀錄完整率。","s1_5":"能否開發出長者能順利使用的用藥提醒 App？其可用性如何？","s1_6":"A 系統開發與評估：設計科學研究法（需求分析 → 設計開發 → 形成性評估迭代 → 總結性評估）。","s1_7":"合作藥局同意協助招募；App 資料加密存於手機，不上傳可識別資料。","s1_8":"12 個月：需求 2 個月、開發與迭代 5 個月、總結性評估 2 個月，保留兩個月緩衝。","s1_9":"提出適合長者的用藥提醒設計原則；可用的 App 雛型供藥局後續推廣。","m1_scene":"臺灣已於 2025 年進入超高齡社會，65 歲以上人口超過總人口五分之一（國家發展委員會，2024）。長者常同時患有高血壓、糖尿病、高血脂等多種慢性病，每日須依不同時間服用 5 種以上藥物的情形並不少見（Masnoon et al., 2017）。隨著視力、記憶與手部靈活度退化，忘記服藥、重複服藥或自行停藥時有所聞；世界衛生組織指出，已開發國家慢性病患者之長期服藥遵從率平均僅約五成（World Health Organization, 2003），而與子女不同住的長者，照顧者更難即時得知服藥情形。","m1_gap":"現行做法以紙本藥袋、分裝藥盒與照顧者電話提醒為主，需要人力持續投入，且漏服時沒有紀錄可追。市售提醒 App 多以年輕使用者為設計對象：字體小、設定步驟多、提醒聲音不易察覺，長者常在「新增藥品」這一步就放棄；也很少讓照顧者在長者漏服時收到通知。結果是工具存在，卻沒有被長者真正用起來，藥師在用藥整合服務中也拿不到可參考的服藥紀錄。","m1_new":"行動應用程式可提供定時提醒、服藥紀錄與遠端通知，已有研究顯示提醒類介入有助於改善服藥遵從，但效果高度依賴使用者是否能持續操作。設計科學研究法主張以解決實際問題的人工物為研究產出，並以嚴謹評估證明其效用（Hevner et al., 2004）；以長者為中心的設計與可用性評估（ISO 9241-11）正是讓工具「能被用」的前提。然而，針對臺灣居家多重用藥長者、並納入照顧者角色的提醒工具，仍少見完整記錄需求分析、迭代修正與可用性評估的研究。","m1_time":"合作社區藥局將於 2027 年推動「長者用藥整合服務」，需要一個長者能自行操作、照顧者能遠端掌握的工具，並希望在服務推出前先確認可用性。若在服務上線後才發現長者不會用，修改成本與流失的信任都更高。本研究可在服務推出前完成設計與評估，結果將作為藥局是否採用、以及後續進行成效研究（C 型）的依據。","m1_stmt":"因此，本研究擬以設計科學研究法，邀請長者與照顧者參與需求分析與設計，開發一款居家多重用藥長者能順利使用的用藥提醒 App，並以形成性與總結性評估檢視其可用性。","m2_pico":"P：65 歲以上、多重用藥之居家長者及照顧者｜I：用藥提醒行動應用程式｜C：現行紙本藥袋與口頭提醒（需求分析時比較）｜O：可用性（任務完成率、時間、錯誤、SUS）、服藥紀錄完整率","m2_search":"PubMed：（\"Medication Adherence\"[Mesh] OR adherence[tiab]）AND（\"Mobile Applications\"[Mesh] OR app[tiab] OR mHealth[tiab] OR reminder*[tiab]）AND（\"Aged\"[Mesh] OR older[tiab] OR elderly[tiab]）AND（usability[tiab] OR \"user-centered design\"[tiab]）\n華藝：（用藥 OR 服藥）AND（App OR 行動應用程式 OR 提醒）AND（長者 OR 老人 OR 高齡）\n限制：2015 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、長者服藥遵從問題。世界衛生組織（2003）的報告指出，長期治療的服藥遵從不佳是普遍現象，並會影響治療成效。對本研究的意義：提醒與紀錄功能必須對準長者實際忘記服藥的情境。\n二、系統開發的方法論。設計科學研究法主張以解決實際問題的人工物為研究產出，並以嚴謹評估證明其效用（Hevner et al., 2004）；Peffers 等人（2007）提出問題界定、目標設定、設計開發、展示、評估與溝通六個步驟。對本研究的意義：App 本身是研究產出，評估要先找問題（形成性）、再量效果（總結性）。\n三、可用性評估。可用性指特定使用者在特定情境下，有效、有效率且滿意地達成目標的程度（ISO 9241-11）。SUS 是常用的 10 題可用性量表（Brooke, 1996），Bangor 等人（2008）的實證分析提供了分數解讀的參考；Nielsen（1993）的啟發式評估則適合在開發早期由專家找出問題。本研究初步檢索（附錄一）未見針對臺灣居家多重用藥長者、並納入照顧者角色之提醒 App 設計研究（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已確認長者服藥遵從是重要問題（World Health Organization, 2003），並已有成熟的系統開發與可用性評估方法（Hevner et al., 2004；Brooke, 1996）。","m2_unknown":"然而，既有用藥提醒 App 的研究多以一般成人或單一疾病患者為對象，常只報告滿意度；針對臺灣居家多重用藥長者、由長者與照顧者共同參與設計，並完整記錄形成性評估問題清單、修正歷程與總結性可用性指標的研究仍屬少見（綜整矩陣中「長者共同設計」「照顧者角色」「迭代紀錄」三欄多數空白）。","m2_worth":"此缺口使藥局在推動長者用藥服務時，只能採用未經長者評估的市售工具，或自行開發卻無從得知是否好用；本研究將以設計科學研究法開發並評估一款長者適用的 App，同時歸納可供其他開發者參考的長者介面設計原則。","m2_theory":"以設計科學研究法（Hevner et al., 2004；Peffers et al., 2007）為研究架構，並以 ISO 9241-11 之可用性定義（有效性、效率、滿意度）界定評估指標。","m2_orig":"本計畫由長者與照顧者共同參與設計，結合照顧者通知功能，並以兩輪形成性評估與總結性評估完整記錄開發歷程，產出可推廣之長者用藥提醒設計原則。","m3_rq":"能否開發出居家多重用藥長者能順利使用的用藥提醒 App？其可用性如何？","m3_terms":"可用性：特定使用者在特定情境下，有效、有效率且滿意地達成目標的程度（ISO 9241-11），本研究以任務完成率、操作時間、錯誤數與 SUS 分數測量。\n服藥紀錄完整率：應服藥次數中，App 有服藥紀錄（已服或略過）的比例。\n照顧者通知：長者逾時未記錄服藥時，App 傳送給照顧者的提醒。","m3_scope":"研究範圍為北部某社區藥局服務之 65 歲以上、每日服用 3 種以上慢性病藥物之居家長者及其主要照顧者，研究期間 12 個月（2026 年 9 月至 2027 年 8 月）。本研究聚焦於 App 的需求分析、設計開發與可用性評估，以及 2 週實際使用的服藥紀錄完整率；不評估 App 對服藥遵從或血壓、血糖等臨床結果之成效（需另以 C 型介入研究檢驗），亦不涉及處方內容判斷或劑量建議。","m4_frame":"依設計科學研究法，需求分析的結果決定 App 的功能設計；形成性評估找出的問題回饋修正設計（迭代 2 輪）；總結性評估以 ISO 9241-11 的三個面向測量可用性：有效性（任務完成率、錯誤數）、效率（操作時間）與滿意度（SUS）。另以服藥紀錄完整率觀察實際使用情形。","m5_design":"本研究採設計科學研究法（A 型：系統開發與評估），分為問題界定、需求分析、設計開發、形成性評估與修正（2 輪）、總結性評估五個階段（Peffers et al., 2007）。","m5_reject":"不直接進行隨機對照試驗，因 App 尚未開發完成且可用性未知，過早評估成效會混淆「不好用」與「沒效果」；不只做滿意度問卷，因滿意度無法找出具體操作問題，也不足以說明有效性與效率；不採用一次性開發後直接上線之瀑布式流程，因長者需求須經實際操作才會浮現，需要以形成性評估反覆修正。","m5_site":"研究場域為北部某社區藥局及其服務之居家長者家庭。藥局為健保特約藥局，每月服務慢性病連續處方箋長者約 300 人次，已同意協助張貼招募說明與轉介有意願之長者（附錄二）。研究對象分三組：需求分析長者 6 人與照顧者 4 人；形成性評估專家 3 位（人因工程 1、藥師 1、老人護理 1）與每輪長者 5 人；總結性評估長者 12 人及其主要照顧者。三組長者不重複，以避免學習效應。","m5_incl":"長者納入條件：65 歲以上、每日服用 3 種以上慢性病藥物、能自行使用智慧型手機接聽電話。排除條件：經診斷失智症或無法自行表達同意者；嚴重視力或聽力障礙無法操作手機者。","m5_sample":"形成性評估以 5 位使用者為一輪，可找出多數主要可用性問題（課程 9.7），共 2 輪；專家啟發式評估 3 位。總結性評估招募長者 12 人與其照顧者，屬描述性可用性評估，不做推論檢定。","m5_tool":"一、需求訪談大綱：日常服藥流程、忘記服藥的情境、對提醒方式的偏好（附錄三）。\n二、任務腳本：設定一種新藥、回應服藥提醒、補記漏服、查看本週紀錄共 4 項核心任務。\n三、可用性指標：任務完成率、完成時間、錯誤數（由觀察者記錄）。\n四、SUS 系統可用性量表中文版 10 題（Brooke, 1996），以 68 分作為平均可用性參考值。\n五、啟發式評估：Nielsen 十項原則，問題嚴重度 0–4 分。\n六、App 使用日誌：提醒次數、服藥紀錄筆數，計算服藥紀錄完整率。","m5_flow":"一、第 1–2 月：IRB 送審；核准後進行需求訪談（長者 6 人、照顧者 4 人），以主題分析整理需求清單並以 MoSCoW 排序。\n二、第 3–4 月：繪製架構與資料流、製作可點選雛型，與 2 位長者走一遍核心任務。\n三、第 4–7 月：開發可運作版本；第 5 月第一輪形成性評估（專家 3 位啟發式評估＋長者 5 人放聲思考），修正後第 7 月第二輪。\n四、第 8–9 月：總結性評估，長者 12 人於家中完成 4 項任務並填 SUS，之後使用 2 週，匯出使用日誌。\n五、資料以研究編號儲存，App 測試資料不含姓名與身分證字號。","m5_innov":"由長者與照顧者共同參與設計，並以兩輪形成性評估加一次總結性評估完整記錄開發與修正歷程；照顧者通知功能回應長者獨居時無人提醒的實際情境。","m6_common":"總結性評估以描述統計呈現：任務完成率（%）、完成時間（中位數與四分位距）、錯誤數、SUS 平均與標準差；兩輪形成性評估之問題數與嚴重度以表格比較。服藥紀錄完整率以每人 2 週之百分比描述。分析以 Python（版本寫明）執行。","m6_qual":"需求訪談與放聲思考紀錄以主題分析整理（Braun & Clarke, 2006），歸納需求與可用性問題類型；需求清單以 MoSCoW 排序並與長者確認。","m7_irb":"本研究將送〔大學或合作機構〕人體研究倫理審查委員會審查，預計屬簡易審查範圍（成年人、訪談與可用性測試、最小風險），以審查會認定為準；於第 1 月送審，核准後才開始需求訪談，形成性與總結性評估若修改流程或工具將先提出變更案。","m7_consent":"長者與照顧者均簽署書面同意書。考量長者視力與閱讀負擔，同意書採 16 號以上大字版，由研究人員逐項口頭說明，並請長者以自己的話複述「要做什麼、可隨時退出」後再簽署；說明時照顧者可陪同，但由長者本人決定是否參加。","m7_risk":"本研究屬最小風險：App 僅提供提醒與紀錄，不提供用藥建議，測試期間長者仍依原有方式服藥，App 不取代藥師或醫師指示。操作測試可能造成疲累或挫折感，每次測試以 45 分鐘為限並可隨時休息或退出；若測試中發現長者有明顯用藥錯誤，將建議其諮詢合作藥局藥師。","m7_deid":"App 測試資料以研究編號儲存，不收集姓名、身分證字號與健保卡號；服藥紀錄加密存於手機，2 週使用結束後由研究人員匯出去識別化日誌並刪除手機上之 App 資料。訪談錄音於逐字稿核對後刪除；研究資料存於加密裝置，僅研究團隊可存取，保存至研究結束後 3 年，期滿以不可回復方式刪除。","m7_coi":"研究者與合作藥局無財務關係，App 不作商業販售。依 9.10 判定：本 App 僅提供提醒與紀錄、不提供診斷或劑量建議，預期不屬軟體醫療器材，將於計畫中說明判定依據。生成式 AI 僅用於程式除錯，不輸入任何參與者資料。","m8_feas":"場域：合作藥局已書面同意協助招募（附錄二），每月服務之慢性病長者人數足以招募三組共約 28 位長者。技術：研究者已完成跨平台 App 開發課程，並於前導作業完成提醒功能之可運作雛型；指導教授實驗室提供 4 支不同尺寸之測試手機。人力：形成性評估專家 3 位已口頭同意。時間：開發與兩輪迭代安排 4 個月，並保留兩個月緩衝；若進度落後，先刪減 Could 等級功能。","m9_acad":"補足臺灣居家多重用藥長者用藥提醒工具之完整開發與評估紀錄，包括需求主題、兩輪形成性評估之問題清單與修正依據，以及總結性可用性指標；並歸納可供其他高齡健康 App 參考之設計原則。","m9_prac":"產出經評估之 App 雛型、長者操作手冊與設計原則，供合作藥局在長者用藥整合服務中採用；照顧者通知功能可協助不同住家屬掌握服藥情形。若可用性良好，可接續進行以服藥遵從為結果之介入成效研究（C 型）。","m9_limd":"本研究評估可用性，不評估服藥遵從或臨床結果之成效；總結性評估 12 人屬描述性，不做推論檢定。樣本為單一藥局服務、能自行使用智慧型手機之長者，排除失智症與重度視聽障礙者，結果推論至其他族群時需保守。","m9_lime":"長者手機型號與作業系統版本不一，可能影響操作表現，將事先列出支援版本並記錄測試手機型號；2 週使用期較短，可能高估新奇效應下之使用率，將於討論中說明，並建議後續研究延長觀察期。","m9_train":"參與之碩士生將習得需求分析、雛型設計、可用性測試與設計科學研究法（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇，並產出 App 雛型與長者用藥提醒設計原則一份（教學示意）。","m9_nation":"回應高齡社會多重用藥安全之需求，提供社區藥局推動長者用藥服務之數位工具。","t_iv":"用藥提醒 App","t_pop":"居家多重用藥長者","t_out":"可用性","t_des":"設計科學研究","m10_title":"居家多重用藥長者用藥提醒 App 之開發與可用性評估：設計科學研究","m10_title_en":"Development and Usability Evaluation of a Medication Reminder App for Community-Dwelling Older Adults with Polypharmacy: A Design Science Research Study","m10_kw":"多重用藥、高齡者、行動應用程式、可用性、設計科學研究","m10_abs":"居家多重用藥長者常忘記服藥或重複服藥，市售提醒 App 多未考量長者的使用能力，也少讓照顧者掌握服藥情形。本研究旨在以設計科學研究法開發一款居家長者適用的用藥提醒 App，並評估其可用性。本研究將於北部某社區藥局，先以半結構訪談長者 6 人與照顧者 4 人整理需求，依 MoSCoW 排序後開發 App，並進行兩輪形成性評估（專家 3 位啟發式評估、每輪長者 5 人放聲思考）；最後由另一批長者 12 人與其照顧者進行總結性評估，以任務完成率、操作時間、錯誤數、SUS 與 2 週服藥紀錄完整率描述可用性。預期產出經評估之 App 雛型與長者用藥提醒設計原則，可供藥局推動長者用藥服務，並作為後續成效研究之基礎。","m10_refs":"國家發展委員會. (2024). 中華民國人口推估（2024 年至 2070 年）. 國家發展委員會.\nBangor, A., Kortum, P. T., & Miller, J. T. (2008). An empirical evaluation of the System Usability Scale. International Journal of Human–Computer Interaction, 24(6), 574–594.\nBraun, V., & Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77–101.\nBrooke, J. (1996). SUS: A quick and dirty usability scale. In P. W. Jordan et al. (Eds.), Usability evaluation in industry (pp. 189–194). Taylor & Francis.\nHevner, A. R., March, S. T., Park, J., & Ram, S. (2004). Design science in information systems research. MIS Quarterly, 28(1), 75–105.\nInternational Organization for Standardization. (2018). Ergonomics of human-system interaction—Part 11: Usability: Definitions and concepts (ISO 9241-11:2018).\nMasnoon, N., Shakib, S., Kalisch-Ellett, L., & Caughey, G. E. (2017). What is polypharmacy? A systematic review of definitions. BMC Geriatrics, 17, 230.\nNielsen, J. (1993). Usability engineering. Academic Press.\nPeffers, K., Tuunanen, T., Rothenberger, M. A., & Chatterjee, S. (2007). A design science research methodology for information systems research. Journal of Management Information Systems, 24(3), 45–77.\nWorld Health Organization. (2003). Adherence to long-term therapies: Evidence for action. World Health Organization.","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責 App 開發、訪談與可用性測試）；可用性專家 3 位〔姓名〕","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_inst":"〔大學名稱〕〔系所〕；研究場域：北部某社區藥局及其服務之長者家庭","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌；測試手機由指導教授實驗室提供。","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：以訪談、操作測試與問卷蒐集資料，App 僅提供提醒與紀錄，不改變原有服藥方式，屬最小風險；參與者含高齡者，已訂定理解確認程序。是否符合簡易審查範圍，以送審機構之判定為準。","irb_n":"需求分析長者 6 人與照顧者 4 人；形成性評估長者 5 人（每輪）與專家 3 位；總結性評估長者 12 人與其照顧者。","irb_recruit":"由合作藥局藥師向符合條件之長者發放邀請說明，有意願者由研究者另行聯絡說明；藥師不參與同意過程，是否參與不影響藥局服務。","irb_vuln":"參與者含高齡者，雖非法定易受傷害族群，但考量視力、聽力與理解能力：使用大字版同意書、逐項口頭說明並以提問確認理解；排除經診斷失智症或無法自行同意者。","irb_task":"需求訪談：一次約 40–60 分鐘、在家中或藥局諮詢室進行並錄音；可用性測試：在家中依 4 項任務操作 App 約 30–45 分鐘並放聲說出想法、填寫 SUS 問卷（10 題），之後使用 App 2 週。","irb_withdraw":"可隨時以口頭或書面告知研究者撤回同意，無須說明理由；撤回後將刪除您的訪談錄音與 App 資料。","irb_benefit":"參與者可免費使用 App 並獲得用藥整理協助；為感謝撥冗，致贈〔　〕元禮券。","irb_harm":"本研究屬最小風險；若操作 App 感到疲累或困擾可隨時停止。App 不提供用藥建議，若有用藥問題請洽原藥師或醫師；對研究有疑問或爭議，可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為訪談錄音、操作測試紀錄、問卷與 App 使用日誌。錄音於逐字稿核對完成後刪除；去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_commercial":"本 App 為研究用雛型，不作商業販售；如日後有商業化可能，將另行送審並取得同意。","irb_waive":"否。長者與照顧者均簽署書面同意書。","irb_ad":"【長輩吃藥小幫手 App 試用邀請】想請每天要吃好幾種藥的長輩，幫忙試用並給我們意見，讓 App 更好用。參加者需要聊聊吃藥習慣、試用 App 兩週。有興趣請洽藥局藥師或〔研究生姓名〕〔電話〕。","m10_kw_en":"polypharmacy; older adults; mobile application; usability; design science research","m10_abs_en":"Older adults with polypharmacy often forget or duplicate doses, and most commercial reminder apps are not designed for their abilities or for family caregivers. This study aims to develop a medication reminder app for community-dwelling older adults using design science research and to evaluate its usability. At a community pharmacy in northern Taiwan, we will first conduct semi-structured interviews with six older adults and four caregivers to identify requirements, which will be prioritized using the MoSCoW method. The app will then be developed and refined through two rounds of formative evaluation (heuristic evaluation by three experts and think-aloud testing with five older adults per round). A summative evaluation with a separate group of 12 older adults and their caregivers will describe usability using task completion rate, time on task, error count, the System Usability Scale, and the completeness of medication records over two weeks of use. The study is expected to produce an evaluated app prototype and design principles for medication reminders for older adults, which can support the pharmacy's medication management service and serve as the basis for a subsequent effectiveness study."},"objs":[{"verb":"探討","text":"探討居家多重用藥長者與照顧者對用藥提醒工具之需求","hyp":"","analysis":"需求訪談之主題分析，整理需求清單並以 MoSCoW 排序","crit":"需求清單經 2 位長者確認","sens":"","exp":"預期歸納出提醒方式（聲音、震動、大字）、補記漏服、照顧者通知等需求，作為設計依據。"},{"verb":"開發","text":"開發用藥提醒 App 並經兩輪形成性評估修正","hyp":"","analysis":"啟發式評估與放聲思考問題清單，依嚴重度 0–4 分排序；比較兩輪問題數與嚴重度","crit":"第二輪無嚴重度 3–4 分之問題","sens":"回歸測試 4 項核心任務","exp":"預期第一輪找出主要可用性問題，第二輪嚴重問題明顯減少，並記錄每項修正與其依據。"},{"verb":"描述","text":"描述長者使用 App 之可用性與服藥紀錄完整率","hyp":"","analysis":"描述統計：任務完成率、完成時間（中位數與四分位距）、錯誤數、SUS 平均與標準差、服藥紀錄完整率","crit":"SUS 以 68 分作為平均可用性參考值（描述性，不做推論檢定）","sens":"分別呈現長者自行操作與照顧者協助之結果","exp":"預期長者能完成多數核心任務；若某項任務完成率偏低，將作為後續修正與研究限制之說明。"}],"vars":[{"name":"任務完成率","role":"依變項","concept":"有效性：使用者能否完成任務","oper":"4 項核心任務中無協助完成之比例","tool":"觀察紀 type":"B","type2":""},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"急診留觀病人病況惡化後才轉入加護病房，延誤處置；檢傷分級只反映到院當下，無法預告之後 72 小時的惡化風險。","s1_2":"北部某醫學中心急診 2019–2024 年 18 歲以上就診紀錄（院內資料庫，回溯性）。","s1_3":"以到院後 2 小時內可取得之檢傷、生命徵象與檢驗資料建立之預測模型。","s1_4":"72 小時內轉入加護病房；鑑別力 AUC、校準度、敏感度與特異度。","s1_5":"以急診到院 2 小時內資料建立之模型，能否準確預測 72 小時內轉入加護病房？","s1_6":"B AI 模型建置：回溯性資料、時間切分驗證，邏輯斯迴歸為基準，比較 XGBoost 與隨機森林。","s1_7":"院內資料庫申請；去識別化後於院內環境分析；申請免除知情同意。","s1_8":"12 個月：IRB 與資料申請 3 個月、前處理與建模 5 個月、驗證與撰寫 2 個月、緩衝 2 個月。","s1_9":"提供急診留觀病人惡化風險的早期提醒依據；完整報告符合 TRIPOD+AI 之模型開發與驗證。","m1_scene":"急診是醫院最壅塞的單位之一，部分病人在急診留觀或等待住院床位期間，會在數十小時內出現血壓下降、呼吸衰竭或意識改變，最後轉入加護病房。若惡化未及早察覺，處置時機延後、死亡風險上升，也使急診與加護病房的床位調度更加被動。北部某醫學中心急診每年就診約 10 萬人次，其中 18 歲以上就診後 72 小時內轉入加護病房者約占 3%（院內品管資料，教學示意），每一例都代表一次可能被提早預警的惡化。","m1_gap":"現行以臺灣檢傷與急迫度分級量表（TTAS）判斷急迫度，該量表已被證實能區分急迫程度並與住院、加護病房入住相關（Ng et al., 2011）。然而，檢傷反映的是「到院當下」的狀態，無法直接告訴醫護人員哪些病人在之後 72 小時內較可能惡化；留觀期間的再評估則依賴個別醫護人員經驗，各班落差大，且在壅塞時容易延後。","m1_new":"機器學習可結合檢傷、生命徵象與檢驗等多項資料建立預測模型，已有研究以急診資料預測加護病房入住或死亡。然而，預測模型若只在同一批資料內驗證、只報準確率，常高估實際表現；Van Calster 等人（2019）指出校準度是最常被忽略的一環，TRIPOD+AI 亦要求完整報告開發與驗證過程（Collins et al., 2024）。以臺灣急診資料、只用到院 2 小時內可得資訊，並以時間切分模擬上線情境驗證的模型，仍缺乏證據。","m1_time":"本院急診已全面電子化檢傷、生命徵象與檢驗資料，資訊室自 2025 年起開放去識別化研究資料申請；急診部亦規劃於 2027 年建置惡化提醒系統。本研究可在投入系統開發前，先提供經時間切分驗證、含校準與臨床淨效益的模型表現，作為「值不值得做系統、切點怎麼訂」的決策依據；若模型不優於檢傷，也能避免投入無效系統。","m1_stmt":"因此，本研究擬以急診到院 2 小時內可取得之資料，建立並以時間切分驗證 72 小時內轉入加護病房之預測模型，並與僅用檢傷級數之基準比較。","m2_pico":"P：18 歲以上急診就診病人｜I（預測因子）：到院 2 小時內之檢傷級數、生命徵象、檢驗值與基本資料｜C：僅以檢傷級數預測（基準）｜O：72 小時內轉入加護病房；AUC、校準度、敏感度、特異度","m2_search":"PubMed：（\"Emergency Service, Hospital\"[Mesh] OR \"emergency department\"[tiab]）AND（\"Intensive Care Units\"[Mesh] OR \"ICU admission\"[tiab] OR deteriorat*[tiab]）AND（\"Machine Learning\"[Mesh] OR \"prediction model\"[tiab] OR \"risk score\"[tiab]）\n華藝：（急診）AND（加護病房 OR 惡化）AND（預測 OR 機器學習）\n限制：2015 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、急診檢傷的角色與限制。臺灣檢傷與急迫度分級量表為五級電腦化檢傷系統，研究顯示其分級與住院、加護病房入住等結果相關（Ng et al., 2011）。對本研究的意義：檢傷級數是最重要的基準預測因子，新模型要證明比只看檢傷更好。\n二、預測模型的開發與驗證。Steyerberg 與 Vergouwe（2014）提出預測模型開發的七個步驟，強調校準度與驗證；Van Calster 等人（2019）指出校準度是預測模型最常被忽略的一環。樣本數應依 Riley 等人（2020）的準則估算，而非只看事件數。對本研究的意義：除了 AUC，也要報校準度並做時間切分驗證。\n三、機器學習模型與可解釋性。XGBoost 等梯度提升方法常用於表格型臨床資料（Chen & Guestrin, 2016），SHAP 可呈現各特徵對預測的貢獻（Lundberg & Lee, 2017）；決策曲線分析可評估模型在不同切點下的臨床淨效益（Vickers & Elkin, 2006）。本研究初步檢索（附錄一）未見以本院急診 2 小時內資料、並依 TRIPOD+AI 完整報告之模型（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已確認檢傷分級與急診病人後續結果相關（Ng et al., 2011），且已有明確的預測模型開發、樣本數與報告準則（Riley et al., 2020；Collins et al., 2024）。","m2_unknown":"然而，既有急診惡化預測研究多使用隨機切分或只報 AUC，少報校準度與決策曲線；以臺灣醫學中心急診、限定到院 2 小時內資料（避免使用未來資訊），並與檢傷級數基準正面比較的模型，仍缺乏經時間切分驗證之證據。","m2_worth":"此缺口使急診在規劃惡化提醒系統時，無法判斷模型是否真的比檢傷更有用、在何種切點下警示量可被承受；本研究將以時間切分驗證、校準度與決策曲線提供可信且可用於決策的模型表現。","m2_theory":"以 CRISP-DM 流程（Wirth & Hipp, 2000）與 TRIPOD+AI 報告準則（Collins et al., 2024）為研究架構；預測因子依臨床知識選定，並以 PROBAST 之偏誤面向（Wolff et al., 2019）自我檢核。","m2_orig":"本計畫以時間切分模擬實際上線情境，同時報告鑑別力、校準度與決策曲線，並以 SHAP 與分組公平性分析檢視模型在不同年齡與性別群體的表現。","m3_rq":"以急診到院 2 小時內資料建立之模型，預測 72 小時內轉入加護病房的表現是否優於僅用檢傷級數？","m3_terms":"72 小時內轉入加護病房：自急診掛號時間起 72 小時內，有加護病房入住紀錄者。\n預測時點：到院後 2 小時，只使用此時點前已產生之資料。\n鑑別力：以 AUC 測量模型區分有無事件的能力；校準度：預測機率與實際發生率的一致程度，以校準斜率與校準圖呈現。","m3_scope":"研究範圍為單一醫學中心急診 2019–2024 年 18 歲以上就診紀錄；排除到院前心跳停止與到院 2 小時內死亡或離院者。本研究建立與驗證模型，並報告鑑別力、校準度、決策曲線與分組表現；不將模型上線，不評估使用模型後的臨床成效（需後續 A 型系統開發與 C 型介入研究），亦不納入影像與自由文字病歷。","m4_frame":"依 CRISP-DM 流程：先以臨床知識列出候選預測因子（檢傷級數、年齡、性別、生命徵象、意識、主要檢驗值），在 2019–2023 年資料訓練模型，以 2024 年資料做時間切分測試。比較三種模型：邏輯斯迴歸（基準）、隨機森林、XGBoost，並與「僅用檢傷級數」比較。","m5_design":"本研究採回溯性預測模型開發與時間切分驗證設計（B 型：AI 模型建置），依 TRIPOD+AI 報告（Collins et al., 2024）。","m5_reject":"不採隨機切分作為主要驗證，因無法反映模型在未來資料上的表現（時間漂移）；不只報準確率，因事件發生率約 3% 時，全部預測「不會轉入」的準確率即達 97%，會嚴重誤導；不採僅建立單一複雜模型而無基準比較之設計，因無法回答新模型是否優於現行檢傷，故以邏輯斯迴歸與「僅用檢傷級數」為基準。","m5_site":"研究場域為北部某醫學中心急診部（成人急診床位約 120 床、年就診約 10 萬人次）。資料來源為院內急診資料庫，串接檢傷、護理、檢驗與住院系統；研究者將於 IRB 核准後向資訊室申請去識別化資料，資料僅在院內研究分析環境處理（附錄二：資料申請流程與資訊室同意書）。","m5_incl":"納入條件：2019–2024 年 18 歲以上急診就診病人（同一人多次就診，各次獨立計入並於敏感度分析中只取第一次）。排除條件：到院前心跳停止、到院 2 小時內死亡或離院者。","m5_sample":"依 Riley 等人（2020）準則，以候選參數 20 個、預期事件發生率約 3%、預期 Cox-Snell R² 0.05、收縮係數 0.9 估算，至少需約 3,500 筆就診、約 105 件事件；本院 2019–2023 年資料量遠高於此（教學示意：請以實際資料量與 pmsampsize 計算結果改寫）。","m5_tool":"一、資料欄位：檢傷級數、年齡、性別、到院方式、收縮壓、心跳、呼吸速率、體溫、血氧、意識狀態、主要檢驗值（白血球、乳酸、肌酸酐等）。\n二、結果定義：72 小時內加護病房入住紀錄，由住院系統串接。\n三、分析工具：Python 3（scikit-learn、xgboost、shap），版本於論文中寫明；程式碼以 Git 管理。","m5_flow":"一、第 1–3 月：IRB 送審並申請免除知情同意；核准後向資訊室申請去識別化資料，建立資料字典。\n二、第 4–5 月：資料清理；依時間切分為訓練（2019–2023）與測試（2024）資料，切分後才進行補值與標準化。\n三、第 5–8 月：在訓練資料內以 5 折交叉驗證調整超參數，訓練三種模型。\n四、第 9 月：在測試資料一次性評估；計算 AUC、校準、決策曲線、SHAP 與分組表現。\n五、資料全程於院內環境處理，不攜出可識別資料。","m5_innov":"以時間切分驗證模擬上線情境，並同時報告鑑別力、校準度、決策曲線與分組公平性，使模型表現可直接供急診判斷是否值得進一步開發提醒系統。","m6_common":"顯著水準 α = .05（雙尾）。缺值以多重插補（在訓練資料內建立插補模型後套用至測試資料）；連續變項標準化參數只由訓練資料計算。AUC 以 DeLong 法計算 95% CI 並比較模型；校準以校準斜率、截距與校準圖呈現。分析以 Python（版本寫明）執行。","m7_irb":"本研究將送本院人體研究倫理審查委員會審查，因屬回溯性使用既有病歷資料、不接觸病人，預計申請簡易審查並同時申請免除知情同意，以審查會認定為準；於第 1 月送審，核准後才向資訊室申請資料。","m7_consent":"本研究回溯性使用 2019–2024 年既有醫療紀錄之去識別化資料，研究對象人數龐大且多已離院，無法逐一取得同意；資料經資訊室去識別化後研究者無法辨識個人，對病人權益影響極小。將依《人體研究法》第 12 條第 2 項但書（屬主管機關公告得免取得同意之研究案件範圍）申請免除知情同意，以審查會認定為準。","m7_risk":"本研究不接觸病人，不影響其醫療處置；主要風險為資料外洩與再識別。以去識別化、院內分析環境、最小必要欄位與權限管控降低風險；結果僅以彙總統計呈現，小於 3 人之細格予以遮蔽。","m7_deid":"資訊室提供去識別化資料，以研究編號取代病歷號，日期以「距掛號時間之小時數」呈現；對照表由資訊室保管、研究者不持有。資料只在院內分析環境處理，不得以任何方式攜出原始資料，結果經資訊室檢查無小格數後才帶出；資料保存至研究結束後 3 年，期滿由資訊室刪除。","m7_coi":"研究者與任何廠商無財務關係。生成式 AI 僅用於程式除錯，不輸入任何病人資料。","m8_feas":"資料：資訊室已確認所需欄位（檢傷、生命徵象、檢驗、住院紀錄）均可取得並串接，2019–2023 年訓練資料預估超過 40 萬筆就診，遠高於 Riley 準則之最低需求（附錄二）。人力：研究者已修習機器學習與臨床預測模型課程，指導教授具預測模型研究經驗，急診主治醫師 1 位擔任臨床顧問、協助確認結果定義。時間：IRB 與資料申請預留 3 個月，並保留兩個月緩衝；若資料延誤，先以公開資料（MIMIC-IV-ED）建立分析流程。","m9_acad":"提供以臺灣醫學中心急診資料、只用到院 2 小時內資訊、經時間切分驗證之惡化預測模型證據，並示範依 TRIPOD+AI 完整報告鑑別力、校準度、決策曲線與分組表現。","m9_prac":"若模型表現優於檢傷且校準良好，可作為急診建置惡化提醒系統的依據，並提供「每日警示數—敏感度」對照表協助訂定切點（可接續 A 型系統開發）；若不優於檢傷，也能避免投入無效系統，並指出應補充哪些資料。","m9_limd":"單一醫學中心資料，未做外部驗證，推論至區域醫院或不同病人組成時需保守；回溯性資料受紀錄品質與缺值影響；預測模型呈現的是關聯而非因果，SHAP 結果不能解讀為介入標的。","m9_lime":"加護病房床位不足時，部分病人雖需要但未能轉入，可能低估事件；將以「轉入加護病房或死亡」做敏感度分析。2020–2022 年 COVID-19 疫情期間急診量與病人組成改變，將比較排除疫情年份後之模型表現；院內檢驗系統若更換，將於資料字典記錄版本差異。","m9_train":"參與之碩士生將習得臨床資料前處理、預測模型開發、時間切分驗證與 TRIPOD+AI 報告（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇，並公開分析程式碼（教學示意）。","m9_nation":"回應急診壅塞與病人安全之需求，提供急診資料加值運用與惡化預警的實證基礎。","t_iv":"到院 2 小時內資料","t_pop":"急診病人","t_out":"72 小時內轉入加護病房之預測","t_des":"回溯性預測模型研究","m10_title":"以急診到院 2 小時內資料預測 72 小時內轉入加護病房：機器學習模型之開發與時間切分驗證","m10_title_en":"Predicting Intensive Care Unit Admission within 72 Hours Using Data Available within 2 Hours of Emergency Department Arrival: Development and Temporal Validation of Machine Learning Models","m10_kw":"急診、加護病房、預測模型、機器學習、時間切分驗證","m10_abs":"急診留觀病人病況惡化後才轉入加護病房，會延誤處置；檢傷分級只反映到院當下。本研究旨在以急診到院 2 小時內可取得之資料，建立 72 小時內轉入加護病房之預測模型，並比較其與僅用檢傷級數的表現。本研究將使用北部某醫學中心急診 2019–2024 年 18 歲以上就診之去識別化資料，以 2019–2023 年資料訓練邏輯斯迴歸、隨機森林與 XGBoost，以 2024 年資料做時間切分測試，報告 AUC、校準度、敏感度、特異度、決策曲線與 SHAP。預期模型鑑別力優於僅用檢傷級數，可作為急診建置惡化提醒系統的依據。","m10_refs":"Chen, T., & Guestrin, C. (2016). XGBoost: A scalable tree boosting system. In Proceedings of the 22nd ACM SIGKDD International Conference on Knowledge Discovery and Data Mining (pp. 785–794). ACM.\nCollins, G. S., Moons, K. G. M., Dhiman, P., Riley, R. D., Beam, A. L., Van Calster, B., et al. (2024). TRIPOD+AI statement: Updated guidance for reporting clinical prediction models that use regression or machine learning methods. BMJ, 385, e078378.\nLundberg, S. M., & Lee, S.-I. (2017). A unified approach to interpreting model predictions. Advances in Neural Information Processing Systems, 30.\nNg, C.-J., Yen, Z.-S., Tsai, J. C.-H., Chen, L. C., Lin, S. J., Sang, Y. Y., et al. (2011). Validation of the Taiwan triage and acuity scale: A new computerised five-level triage system. Emergency Medicine Journal, 28(12), 1026–1031.\nRiley, R. D., Ensor, J., Snell, K. I. E., Harrell, F. E., Martin, G. P., Reitsma, J. B., et al. (2020). Calculating the sample size required for developing a clinical prediction model. BMJ, 368, m441.\nSteyerberg, E. W., & Vergouwe, Y. (2014). Towards better clinical prediction models: Seven steps for development and an ABCD for validation. European Heart Journal, 35(29), 1925–1931.\nVan Calster, B., McLernon, D. J., van Smeden, M., Wynants, L., & Steyerberg, E. W. (2019). Calibration: The Achilles heel of predictive analytics. BMC Medicine, 17, 230.\nVickers, A. J., & Elkin, E. B. (2006). Decision curve analysis: A novel method for evaluating prediction models. Medical Decision Making, 26(6), 565–574.\nWirth, R., & Hipp, J. (2000). CRISP-DM: Towards a standard process model for data mining. In Proceedings of the 4th International Conference on the Practical Applications of Knowledge Discovery and Data Mining (pp. 29–39).\nWolff, R. F., Moons, K. G. M., Riley, R. D., Whiting, P. F., Westwood, M., Collins, G. S., et al. (2019). PROBAST: A tool to assess the risk of bias and applicability of prediction model studies. Annals of Internal Medicine, 170(1), 51–58.","irb_inst":"〔醫院名稱〕急診部；資料來源：院內急診資料庫（去識別化）","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：使用既有醫療紀錄之去識別化資料，不接觸病人，屬最小風險；是否符合簡易審查範圍，以審查會判定為準。","irb_n":"2019–2024 年 18 歲以上急診就診紀錄（預估數十萬筆，依資料申請結果；不接觸病人）。","irb_recruit":"不適用：本研究不招募參與者，只使用既有紀錄。","irb_vuln":"資料可能包含意識不清等無法自行表達者之紀錄；因不接觸病人且資料已去識別化，不另設招募保護措施。","irb_task":"不適用：病人不需要做任何事；研究只分析已存在的急診紀錄。","irb_withdraw":"不適用個別撤回；若病人事前已表達不同意其資料用於研究，將依本院規定排除。","irb_benefit":"病人無直接利益；研究結果可能改善未來急診惡化預警。","irb_harm":"主要風險為資料外洩；如發生資料安全事件，將依本院資安通報程序處理並通報審查會。","irb_material":"研究材料為去識別化之急診資料，僅於院內分析環境保存；研究結束後 3 年以不可回復方式刪除，不作本計畫以外之用途。","irb_waive":"是。本研究為回溯性病歷資料研究，資料已去識別化，對病人權益影響極小，且研究涉及數十萬筆紀錄、無法逐一取得同意；依《人體研究法》第 12 條第 2 項但書（屬主管機關公告得免取得同意之研究案件範圍）申請免除知情同意，以審查會認定為準。","irb_ad":"不適用：本研究不招募參與者。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責資料前處理、建模與驗證）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"emergency department; intensive care unit; clinical prediction model; machine learning; temporal validation","m10_abs_en":"Some patients under observation in the emergency department (ED) deteriorate and require intensive care unit (ICU) admission, yet triage levels only reflect the condition at arrival. This study aims to develop and temporally validate a model that predicts ICU admission within 72 hours using data available within 2 hours of ED arrival, and to compare it with triage level alone. We will use de-identified records of ED visits by adults aged 18 years or older at a medical center in northern Taiwan from 2019 to 2024. Candidate predictors include triage level, age, sex, mode of arrival, vital signs, consciousness, and key laboratory values. Logistic regression, random forest, and XGBoost models will be trained on 2019–2023 data with five-fold cross-validation for tuning, and evaluated once on 2024 data. Performance will be reported as the area under the ROC curve with DeLong confidence intervals, calibration slope and intercept, sensitivity, specificity, positive predictive value, and decision curve analysis, with subgroup analyses by age and sex and SHAP for interpretation, following TRIPOD+AI. The model is expected to outperform triage alone and to inform whether, and at which threshold, an ED deterioration alert system should be developed."},"objs":[{"verb":"比較","text":"比較三種模型與僅用檢傷級數預測 72 小時內轉入加護病房之鑑別力","hyp":"H1：最佳模型之 AUC 高於僅用檢傷級數；H0：兩者 AUC 無差異。","analysis":"DeLong 法比較 AUC 與 95% CI；於 2024 年時間切分測試資料評估","crit":"α = .05（雙尾）；AUC 差異之 95% CI 不含 0","sens":"以「轉入加護病房或死亡」為結果重新分析；只取每人第一次就診","exp":"預期 XGBoost 或邏輯斯迴歸之 AUC 高於僅用檢傷；若無差異，表示新增資料的預測價值有限，檢傷已足夠。"},{"verb":"描述","text":"描述最佳模型之校準度、敏感度、特異度與臨床淨效益","hyp":"","analysis":"校準斜率與截距、校準圖；依臨床可接受切點報敏感度、特異度、PPV；決策曲線分析","crit":"校準斜率接近 1；切點依急診可承受之假警報率事先訂定","sens":"依年齡（65 歲上下）與性別分組比較 AUC 與校準","exp":"預期模型校準良好；若某群體表現明顯較差，將於討論中說明公平性限制。"},{"verb":"探討","text":"探討對預測貢獻最大之因子","hyp":"","analysis":"SHAP 值摘要圖與相依圖（探索性）","crit":"僅作描述，不做因果推論","sens":"比較邏輯斯迴歸係數方向是否一致","exp":"預期檢傷級數、乳酸、呼吸速率與意識狀態貢獻較大；若出現臨床上不合理的因子，將檢查是否有資料洩漏。"}],"vars":[{"name":"72 小時內轉入加護病房","role":"依變項","concept":"急診病人短期病況惡化","oper":"掛號後 72 小時內有加護病房入住紀錄＝1，否則＝0","tool":"住院系統","scale":"名目","time":"掛號後 72 小時","rel":"系統紀錄；人工抽查 100 筆核對"},{"name":"檢傷級數","role":"自變項","concept":"到院當下急迫程度","oper":"臺灣檢傷與急迫度分級 1–5 級","tool":"急診檢傷紀錄","scale":"次序","time":"到院時","rel":"Ng 等人（2011）"},{"name":"生命徵象","role":"自變項","concept":"生理穩定度","oper":"收縮壓、心跳、呼吸速率、體溫、血氧（到院 2 小時內第一次）","tool":"護理紀錄","scale":"比率","time":"到院 2 小時內","rel":"院內標準量測"},{"name":"主要檢驗值","role":"自變項","concept":"器官功能與感染","oper":"白血球、乳酸、肌酸酐等（2 小時內第一次）","tool":"檢驗系統","scale":"比率","time":"到院 2 小時內","rel":"院內檢驗品管"},{"name":"年齡、性別、到院方式","role":"控制","concept":"基本特質","oper":"年齡（歲）、性別、是否救護車到院","tool":"掛號紀錄","scale":"比率／名目","time":"到院時","rel":"—"}],"bias":[{"name":"資料洩漏","why":"若在切分前補值或標準化，測試資料的資訊會滲入訓練","fix":"先時間切分，再只用訓練資料建立補值與標準化參數"},{"name":"預測因子時點錯誤","why":"使用 2 小時後才產生的資料，會高估表現","fix":"每個欄位依時間戳記篩選，只取到院 2 小時內"},{"name":"結果誤分類","why":"床位不足時需要者未能轉入加護病房","fix":"以「轉入或死亡」做敏感度分析"},{"name":"過度擬合","why":"模型參數多、事件少","fix":"依 Riley 準則確認樣本數；超參數只在訓練資料內交叉驗證調整"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":2},{"t":"資料申請與字典建立","s":3,"e":3},{"t":"資料清理與時間切分","s":4,"e":5},{"t":"模型訓練與調整","s":5,"e":8},{"t":"測試資料評估與解釋","s":9,"e":9},{"t":"論文撰寫","s":9,"e":11},{"t":"緩衝（資料申請延誤、重跑分析）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"資料申請延誤","trig":"第 3 月仍未取得資料","when":"M3","plan":"先以公開資料（如 MIMIC-IV-ED）練習流程；使用緩衝月"},{"r":"欄位缺值過多","trig":"某檢驗值缺值超過 50%","when":"M4","plan":"改用缺值指標變項或移除該欄並說明"},{"r":"模型表現不佳","trig":"所有模型 AUC 均未優於檢傷","when":"M9","plan":"如實報告，討論原因；此結果本身即具決策價值"},{"r":"結果定義不一致","trig":"人工抽查 100 筆中加護病房入住紀錄與病歷不符 > 5%","when":"M4","plan":"與臨床顧問修訂結果定義（如排除術後常規入住），並記錄於資料字典"}],"kpi":[{"name":"最佳模型 AUC（成果指標）","calc":"於 2024 年測試資料計算，附 95% CI","base":"僅用檢傷級數之 AUC（第 9 月計算）","goal":"高於基準；具體目標於基準取得後訂定"},{"name":"完成時間切分驗證（產出指標）","calc":"完成三種模型於測試資料之評估報告","base":"0","goal":"第 9 月前完成"}],"ss":{}}},"C":{"label":"C 介入成效：AI 情緒日記對新生憂鬱","grp":0,"data":{"meta":{"type":"C","type2":""},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"大學新生適應期憂鬱與焦慮症狀常見，諮商資源有限、等候時間長，多數症狀輕中度的學生不會主動求助。","s1_2":"北部某大學兩個學院之大一新生（各約 104 人）。","s1_3":"AI 情緒日記 App：每日記錄情緒並獲得 AI 回饋與自助練習建議，為期 8 週。","s1_4":"憂鬱症狀 PHQ-9（主要）；焦慮症狀 GAD-7（次要）。","s1_5":"使用 AI 情緒日記 8 週後，新生的憂鬱症狀是否比對照組改善更多？","s1_6":"C 介入成效：兩組前後測準實驗（以學院為單位分派）。","s1_7":"學務處與兩學院同意協助；學生書面同意；高分者轉介機制。","s1_8":"12 個月：IRB 2 個月、招募與前測 1 個月、介入 8 週、追蹤 1 個月、分析撰寫，保留兩個月緩衝。","s1_9":"提供校園導入 AI 自助工具之成效證據，供學務處決定是否推廣。","m1_scene":"大學新生同時面對離家、學業節奏、人際重組與生涯選擇等多重轉換，憂鬱與焦慮症狀相當常見。世界衛生組織世界心理健康調查之國際大學生計畫，於 8 個國家調查大學一年級學生，約三分之一在過去一年篩檢出至少一種心理疾患（Auerbach et al., 2018）；然而，多數學生未曾尋求專業協助。本校新生普測亦顯示，每年約有一成新生之憂鬱量表分數達關懷標準（學務處統計，教學示意）。","m1_gap":"校園現行以新生普測加上諮商中心個別晤談為主。諮商人力有限，非緊急個案等候晤談常需數週；普測只能找出高風險者並轉介，對症狀輕中度、尚不需要正式諮商的學生，缺少可每日使用、低門檻的支持。學生也常因擔心被貼標籤而不願到諮商中心，形成「有需要卻沒有得到幫助」的空窗。","m1_new":"對話式 AI 已被用於提供認知行為取向的自助支持。Fitzpatrick 等人（2017）的隨機試驗顯示，大學生使用對話機器人兩週後，憂鬱症狀改善優於閱讀電子書之對照組；後續系統性回顧亦指出 AI 對話式介入對憂鬱症狀有小至中度效果，但異質性大、追蹤短（Li et al., 2023）。多數研究在國外進行、介入期 2–4 週，國內校園情境仍缺乏介入期較長且有同期對照組的成效證據。","m1_time":"本校學務處正評估是否於 116 學年度全面推廣 AI 情緒日記 App，需要在推廣前取得本校學生的成效證據；新生入學第一學期是適應壓力最集中、也最可能建立求助習慣的時期。若錯過本學期，下一批新生需再等一年，且推廣決策將缺乏依據。","m1_stmt":"因此，本研究擬以兩組前後測準實驗設計，檢驗大學新生使用 AI 情緒日記 App 8 週後，憂鬱與焦慮症狀之改善是否大於接受常規校園服務之新生。","m2_pico":"P：大學一年級新生｜I：AI 情緒日記 App 8 週｜C：常規校園心理衛生服務（新生普測與諮商轉介）｜O：PHQ-9（主要）、GAD-7（次要）","m2_search":"PubMed：（\"Students\"[Mesh] OR \"college students\"[tiab] OR \"university students\"[tiab]）AND（chatbot*[tiab] OR \"conversational agent*\"[tiab] OR \"mobile app*\"[tiab] OR journaling[tiab]）AND（\"Depression\"[Mesh] OR depress*[tiab] OR anxiety[tiab]）\n華藝：（大學生 OR 新生）AND（聊天機器人 OR App OR 情緒日記）AND（憂鬱 OR 焦慮）\n限制：2015 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、大學生心理健康現況。Auerbach 等人（2018）的跨國調查指出，大學新生中有相當比例在過去一年符合心理疾患診斷。對本研究的意義：新生是值得及早提供支持的族群。\n二、數位自助介入。Fitzpatrick 等人（2017）以兩週對話機器人介入大學生，憂鬱症狀改善優於對照之電子書組；但樣本小、追蹤短。對本研究的意義：需較長介入期與較大樣本，並在國內情境檢驗。\n三、結果測量。PHQ-9 是常用的憂鬱症狀量表（Kroenke et al., 2001），GAD-7 為焦慮症狀量表（Spitzer et al., 2006），兩者均有中文版且信效度良好。本研究初步檢索（附錄一）未見國內以學院為單位對照、介入 8 週之 AI 情緒日記研究（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已顯示對話式 AI 自助介入可在短期內改善大學生憂鬱症狀（Fitzpatrick et al., 2017），且已有信效度良好的結果測量工具（Kroenke et al., 2001；Spitzer et al., 2006）。","m2_unknown":"然而，國內大學新生使用 AI 情緒日記 8 週、並有同期對照組之成效證據仍缺乏；既有研究多為短期（2–4 週）、樣本小，且少報告使用遵從度與成效的關係，也少有學校情境中結合高風險轉介流程的實施經驗。","m2_worth":"此缺口使學務處在決定是否全面推廣、投入經費與輔導人力時，只能依賴廠商資料與國外研究；本研究以兩組前後測準實驗提供本校情境之成效估計，並以使用紀錄說明「用多少才有效」。","m2_theory":"以認知行為取向之自我監測與回饋為理論基礎：每日記錄情緒提高覺察，AI 回饋提供重新評估與因應練習，預期降低憂鬱與焦慮症狀；介入內容依 TIDieR 描述（Hoffmann et al., 2014）。","m2_orig":"本計畫在國內校園以同期對照組、8 週介入與 1 個月追蹤檢驗 AI 情緒日記成效，並以後台使用紀錄分析劑量反應。","m3_rq":"使用 AI 情緒日記 8 週後，大學新生 PHQ-9 分數的改善是否大於對照組？","m3_terms":"憂鬱症狀：以 PHQ-9 中文版測量，總分 0–27 分，分數越高症狀越多（Kroenke et al., 2001）。\n焦慮症狀：以 GAD-7 中文版測量，總分 0–21 分（Spitzer et al., 2006）。\n介入遵從度：8 週內有記錄日記之天數比例，由 App 後台取得。","m3_scope":"研究範圍為北部某大學兩個學院 115 學年度大一新生，介入 8 週、介入結束後追蹤 1 個月（第 12 週）。本研究評估憂鬱與焦慮症狀分數之改變，不作臨床診斷，亦不評估 App 對學業成績或休退學之影響；PHQ-9 第 9 題有作答或總分 20 分以上者一律啟動轉介流程並不納入分析。","m4_frame":"自變項為組別（介入組／對照組）與時間（前測、後測、追蹤）；主要依變項為 PHQ-9，次要依變項為 GAD-7；共變項為前測分數、性別與是否住宿。介入組的使用天數作為劑量反應的探索變項。","m5_design":"本研究採兩組前後測準實驗設計（C 型：介入成效研究），以學院為單位分派：甲學院新生為介入組，乙學院新生為對照組（常規服務），測量時點為前測、第 8 週後測與第 12 週追蹤，依 TREND 報告（Des Jarlais et al., 2004）。","m5_reject":"不採個別隨機分派，因同一學院學生常同班上課，介入內容容易擴散至對照組；不採群集隨機試驗，因可分派之學院僅兩個，群集數過少，隨機分派無法平衡學院差異；不採單組前後測，因新生適應期症狀可能隨時間自然變化（回歸平均、學期節奏），無法排除時間效應。","m5_site":"研究場域為北部某大學（學生約 1 萬人），學務處、諮商中心與兩學院院長已書面同意協助宣導與招募（附錄二）。研究對象為甲、乙兩學院 115 學年度大一新生（每院新生約 300 人），兩學院在性別比例與住宿比例相近，可降低基線差異。","m5_incl":"納入條件：115 學年度大一新生、年滿 18 歲、具智慧型手機。排除條件：前測 PHQ-9 第 9 題作答 1 分以上或總分 20 分以上者（立即轉介諮商中心，不納入分析）；目前正接受精神科治療者。","m5_sample":"以兩組比較估算（ANCOVA 調整前測可再提高檢定力，此為保守估計）：效果量 d = 0.44（Fitzpatrick 等人［2017］報告之組間效果量）、α = .05 雙尾、檢定力 .80，每組需 83 人；預估流失 20%，每組招募 104 人，共 208 人（以 G*Power 3.1 核對；Faul et al., 2007）。本研究以學院分派、僅兩個群集，群集內相關無法可靠估計，樣本數未納入設計效應，於研究限制說明；分析時另以班級為隨機截距做敏感度分析。","m5_tool":"一、PHQ-9 中文版 9 題，0–3 分計分（Kroenke et al., 2001）。\n二、GAD-7 中文版 7 題，0–3 分計分（Spitzer et al., 2006）。\n三、基本資料：性別、是否住宿、過去求助經驗。\n四、App 後台紀錄：使用天數、日記則數、練習完成次數。\n五、不良事件紀錄表：使用期間情緒惡化或求助紀錄。","m5_flow":"一、第 1–2 月：IRB 送審；核准後於新生說明會說明研究，有意願者簽署同意書。\n二、第 3 月：兩組線上前測；介入組安裝 App 並完成 10 分鐘操作說明。\n三、第 3–5 月：介入組使用 8 週，對照組接受常規服務；每週由後台檢查使用情形。\n四、第 5 月：兩組後測；第 6 月追蹤測量。\n五、對照組於研究結束後可免費使用 App。資料以研究編號連結三次測量。","m5_innov":"以學院為單位分派降低擴散，並結合後台使用紀錄分析劑量反應，同時建立高分轉介與不良事件監測流程。","m6_common":"顯著水準 α = .05（雙尾）。主要分析以 ANCOVA 比較後測 PHQ-9，前測分數、性別、住宿為共變項（Vickers & Altman, 2001）；三時點以線性混合模型分析組別 × 時間交互作用，受試者為隨機截距，並以班級為隨機截距做敏感度分析。以意圖治療分析為主、符合計畫分析為敏感度分析；缺值依隨機缺失假設由混合模型處理，並以多重插補比較。兩組基線以 SMD 檢查，|SMD| > 0.1 之變項納入共變項。報效果量（調整後平均差、Hedges' g）與 95% CI。分析以 R（版本寫明）執行。","m7_irb":"本研究將送〔大學〕研究倫理審查委員會審查，因涉及心理症狀測量與 18 歲學生，預計申請一般審查（以審查會認定為準）；於第 1 月送審，核准後才招募。高風險轉介流程與諮商中心之合作同意書一併送審。","m7_consent":"所有參與者簽署書面同意書（線上同意需經審查會核准）；說明會由非授課之研究人員主持，強調參與與否不影響成績與任何校內權益、可隨時退出。對照組於研究結束後可免費使用 App，同意書中說明。","m7_risk":"屬最小風險；填寫量表可能引發負面情緒回想。PHQ-9 第 9 題有作答或總分 20 分以上者，由諮商中心心理師 24 小時內聯繫，依校園危機流程處理；App 內設求助專線按鈕與諮商中心聯絡方式。App 回饋內容由廠商依心理師審閱之腳本產生，不提供診斷；參與者可隨時退出，退出不影響其使用諮商資源。","m7_deid":"問卷以研究編號儲存，研究編號對照表由研究生加密保管、與研究資料分開存放；App 後台只匯出研究編號、使用天數與練習次數，不匯出日記內容。資料存於學校加密雲端，僅研究團隊可存取，保存至研究結束後 3 年，期滿以不可回復方式刪除。","m7_coi":"研究者與 App 廠商無財務關係，廠商不參與資料分析與結果解讀。生成式 AI 僅用於英文潤稿，不輸入參與者資料。","m8_feas":"場域：學務處、諮商中心與兩學院已書面同意（附錄二）。樣本：兩學院新生各約 300 人，前一學年同類問卷之新生參與率約 40%，每院招募 104 人可行。轉介：諮商中心已同意高分轉介流程與 24 小時聯繫機制。介入：App 已由校方採購授權，研究期間免費。時間：介入與追蹤共 3 個月，並保留兩個月緩衝。","m9_acad":"提供國內大學新生使用 AI 情緒日記 8 週之同期對照成效證據，補足國外研究介入期短、樣本小之不足，並以使用天數探討劑量反應關係。","m9_prac":"供學務處決定是否全面推廣，並依使用紀錄提出建議的使用頻率、推播策略與高風險轉介流程；若成效有限，也可避免投入不符效益的採購。","m9_limd":"非隨機分派，兩學院學生特質可能不同，雖以共變項調整仍無法排除未測量干擾；以學院為分派單位只有兩個群集，無法估計群集內相關，學院效應與介入效應無法完全分離，結果需保守解讀；單一學校，推論需保守。","m9_lime":"學生使用 App 的遵從度可能逐週下降；將以使用天數做劑量反應分析，並於後測詢問停用原因。","m9_train":"參與之碩士生將習得準實驗設計、量表施測、混合模型分析與心理衛生研究倫理（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇（教學示意）。","m9_nation":"回應大學生心理健康支持之政策需求，提供校園數位心理衛生服務之實證依據。","t_iv":"AI 情緒日記","t_pop":"大學新生","t_out":"憂鬱與焦慮症狀","t_des":"準實驗研究","m10_title":"AI 情緒日記對大學新生憂鬱與焦慮症狀之成效：準實驗研究","m10_title_en":"Effects of an AI-Assisted Mood Diary on Depressive and Anxiety Symptoms among First-Year University Students: A Quasi-Experimental Study","m10_kw":"大學新生、憂鬱、焦慮、人工智慧、數位心理健康","m10_abs":"大學新生適應期憂鬱與焦慮症狀常見，但諮商資源有限，多數學生不會主動求助。本研究旨在檢驗 AI 情緒日記 App 對大學新生憂鬱與焦慮症狀之成效，並探討使用天數與改善之關係。本研究採兩組前後測準實驗設計，以北部某大學兩學院大一新生為對象，以學院為單位分派，介入組使用 AI 情緒日記 8 週，對照組接受常規校園服務，每組預計招募 104 人，於前測、第 8 週後測與第 12 週追蹤測量 PHQ-9 與 GAD-7，以 ANCOVA 與線性混合模型分析，並以意圖治療為主要分析。預期介入組憂鬱症狀改善大於對照組，可作為學務處推廣校園數位心理支持工具之依據。","m10_refs":"Auerbach, R. P., Mortier, P., Bruffaerts, R., Alonso, J., Benjet, C., Cuijpers, P., et al. (2018). WHO World Mental Health Surveys International College Student Project: Prevalence and distribution of mental disorders. Journal of Abnormal Psychology, 127(7), 623–638.\nDes Jarlais, D. C., Lyles, C., Crepaz, N., & the TREND Group. (2004). Improving the reporting quality of nonrandomized evaluations of behavioral and public health interventions: The TREND statement. American Journal of Public Health, 94(3), 361–366.\nFaul, F., Erdfelder, E., Lang, A.-G., & Buchner, A. (2007). G*Power 3: A flexible statistical power analysis program for the social, behavioral, and biomedical sciences. Behavior Research Methods, 39(2), 175–191.\nFitzpatrick, K. K., Darcy, A., & Vierhile, M. (2017). Delivering cognitive behavior therapy to young adults with symptoms of depression and anxiety using a fully automated conversational agent (Woebot): A randomized controlled trial. JMIR Mental Health, 4(2), e19.\nHoffmann, T. C., Glasziou, P. P., Boutron, I., Milne, R., Perera, R., Moher, D., et al. (2014). Better reporting of interventions: Template for intervention description and replication (TIDieR) checklist and guide. BMJ, 348, g1687.\nKroenke, K., Spitzer, R. L., & Williams, J. B. W. (2001). The PHQ-9: Validity of a brief depression severity measure. Journal of General Internal Medicine, 16(9), 606–613.\nLi, H., Zhang, R., Lee, Y.-C., Kraut, R. E., & Mohr, D. C. (2023). Systematic review and meta-analysis of AI-based conversational agents for promoting mental health and well-being. npj Digital Medicine, 6, 236.\nSpitzer, R. L., Kroenke, K., Williams, J. B. W., & Löwe, B. (2006). A brief measure for assessing generalized anxiety disorder: The GAD-7. Archives of Internal Medicine, 166(10), 1092–1097.\nVickers, A. J., & Altman, D. G. (2001). Analysing controlled trials with baseline and follow up measurements. BMJ, 323(7321), 1123–1124.","irb_inst":"〔大學名稱〕〔系所〕；研究場域：〔大學名稱〕甲、乙兩學院","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：以問卷與 App 使用紀錄蒐集資料，屬最小風險；已訂定高分轉介流程。是否符合簡易審查範圍，以送審機構之判定為準。","irb_n":"大一新生 208 人（介入組、對照組各 104 人）。","irb_recruit":"由研究生於新生說明會說明研究並發放邀請說明，有意願者自行掃描報名；授課教師與導師不參與招募與同意過程，參與與否不影響成績。","irb_vuln":"參與者為學生，屬可能受師生關係影響之族群：招募與同意由非授課之研究生進行，教師不知悉誰參與；未滿 18 歲者不納入。","irb_task":"填 3 次線上問卷（開始、8 週後、12 週後），每次約 10 分鐘。介入組：每天用 App 寫幾句心情日記，約 5 分鐘，持續 8 週。對照組：照常生活，研究結束後可免費使用 App。","irb_withdraw":"可隨時在 App 內或以電子郵件告知研究者撤回，無須說明理由；撤回後不再使用您的資料，已蒐集資料依您的意願刪除。","irb_benefit":"介入組可免費使用 App；對照組於研究結束後可免費使用。完成三次問卷致贈〔　〕元禮券。","irb_harm":"填寫問卷可能勾起負面情緒；若您在問卷中表示有自我傷害念頭，諮商中心心理師會在 24 小時內與您聯繫。App 內有求助專線按鈕。對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為問卷資料與 App 使用次數（不含日記內容）。去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"否。所有參與者簽署書面同意書。","irb_ad":"【新生心情小幫手研究招募】想邀請大一新生參加一項 12 週的心情研究：填 3 次問卷，部分同學會試用 AI 情緒日記 App。參與與否不影響成績。有興趣請掃 QR Code 或洽〔研究生姓名〕〔電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責招募、問卷施測與資料分析）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"conversational agent; depression; anxiety; university students; quasi-experimental study","m10_abs_en":"Depressive and anxiety symptoms are common among first-year university students, yet counseling resources are limited and most students do not seek help. This study aims to evaluate the effect of an AI-based emotion diary app on depressive and anxiety symptoms among first-year students and to explore the relationship between app use and symptom change. A two-group pretest–posttest quasi-experimental design will be conducted at a university in northern Taiwan, with allocation by college: first-year students in one college will use the AI emotion diary app for eight weeks, while those in the other college will receive usual campus mental health services. We plan to recruit 104 students per group. The Patient Health Questionnaire-9 (primary outcome) and the Generalized Anxiety Disorder-7 (secondary outcome) will be measured at baseline, week 8, and week 12. Data will be analyzed using analysis of covariance adjusting for baseline scores and linear mixed models under the intention-to-treat principle, with a structured referral protocol for high-risk responses. The intervention group is expected to show greater improvement in depressive symptoms, providing evidence for decisions on campus-wide adoption of digital mental health support."},"objs":[{"verb":"比較","text":"比較介入組與對照組後測 PHQ-9 分數","hyp":"H1：調整前測後，介入組後測 PHQ-9 低於對照組；H0：兩組無差異。","analysis":"ANCOVA（共變項：前測、性別、住宿）；三時點以線性混合模型檢驗組別 × 時間交互作用","crit":"α = .05（雙尾）；報調整後平均差與 95% CI、偏 η²","sens":"符合計畫分析（使用 ≥ 4 週者）；多重插補處理缺值；混合模型加入班級隨機截距","exp":"預期介入組憂鬱症狀改善較多；若不顯著，可能因使用遵從度低或對照組也接受了其他支持。"},{"verb":"比較","text":"比較兩組後測 GAD-7 分數","hyp":"H1：調整前測後，介入組後測 GAD-7 低於對照組；H0：兩組無差異。","analysis":"ANCOVA（同上）","crit":"α = .05（雙尾）；次要結果，解讀時保守","sens":"同上","exp":"預期焦慮症狀亦有改善，但效果可能小於憂鬱症狀。"},{"verb":"探討","text":"探討介入組使用天數與 PHQ-9 改變量之關係","hyp":"","analysis":"多元迴歸（探索性），以使用天數預測 PHQ-9 改變量","crit":"僅作探索，不做因果推論","sens":"以使用週數分組比較","exp":"預期使用天數較多者改善較多；若無關聯，表示效果可能來自其他機制。"}],"vars":[{"name":"組別","role":"自變項","concept":"是否接受 AI 情緒日記介入","oper":"介入組＝1、對照組＝0（依學院分派）","tool":"分組紀錄","scale":"名目","time":"前測時","rel":"—"},{"name":"PHQ-9 憂鬱症狀","role":"依變項","concept":"過去兩週憂鬱症狀頻率","oper":"PHQ-9 中文版 9 題，0–3 分，總分 0–27","tool":"線上問卷","scale":"等距","time":"前測、第 8 週、第 12 週","rel":"Kroenke 等人（2001）"},{"name":"GAD-7 焦慮症狀","role":"依變項","concept":"過去兩週焦慮症狀頻率","oper":"GAD-7 中文版 7 題，0–3 分，總分 0–21","tool":"線上問卷","scale":"等距","time":"前測、第 8 週、第 12 週","rel":"Spitzer 等人（2006）"},{"name":"使用天數","role":"探索","concept":"介入劑量","oper":"8 週內有日記紀錄之天數","tool":"App 後台","scale":"比率","time":"介入期間","rel":"系統自動記錄"},{"name":"性別、住宿","role":"控制","concept":"可能影響症狀之背景","oper":"性別；是否住校內宿舍","tool":"基本資料表","scale":"名目","time":"前測","rel":"—"}],"bias":[{"name":"選擇偏差（非隨機分派）","why":"兩學院學生特質可能不同","fix":"比較基線 SMD；以前測與背景變項為共變項"},{"name":"擴散效應","why":"對照組學生可能從介入組同學得知或下載 App","fix":"以學院為單位分派；後測詢問對照組是否使用類似工具"},{"name":"流失偏差","why":"症狀較重或較輕者較易流失","fix":"意圖治療分析；比較流失者與完成者基線"},{"name":"社會期許偏差","why":"學生可能回答較正向","fix":"問卷匿名化（研究編號）；由非授課人員施測"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":2},{"t":"說明會與招募","s":3,"e":3},{"t":"前測","s":3,"e":3},{"t":"介入 8 週","s":3,"e":5},{"t":"後測與追蹤","s":5,"e":6},{"t":"資料分析","s":7,"e":8},{"t":"論文撰寫","s":8,"e":10},{"t":"緩衝（招募延長、補測）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"招募不足","trig":"說明會後報名少於 90 人／組","when":"M3","plan":"增加班級宣導與第二場說明會；延長招募 2 週"},{"r":"使用遵從度低","trig":"第 2 週平均使用天數低於 3 天／週","when":"M3","plan":"每週推播提醒；後台提醒研究生追蹤"},{"r":"高風險個案","trig":"PHQ-9 第 9 題有作答","when":"每次測量","plan":"24 小時內由心理師聯繫，依校園危機流程處理"},{"r":"對照組污染","trig":"後測時對照組自述使用同類 App 超過 10%","when":"M5","plan":"於分析中標示並做排除使用者之敏感度分析；限制中說明"}],"kpi":[{"name":"PHQ-9 調整後組間差（成果指標）","calc":"ANCOVA 調整後平均差，第 8 週計算","base":"前測平均（第 3 月取得）","goal":"介入組較對照組低；具體目標依前測結果訂定"},{"name":"完成後測人數（產出指標）","calc":"兩組完成第 8 週後測人數","base":"0","goal":"每組 83 人以上"}],"ss":{"kind":"two","eff":0.44,"alpha":0.05,"tails":2,"power":0.8,"drop":20,"moe":0.05,"basis":"Fitzpatrick et al.（2017）報告之組間效果量"}}},"D":{"label":"D 問卷調查：長照機構智慧照護導入現況","grp":0,"data":{"meta":{"type":"D","type2":""},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"政府推動長照機構導入智慧照護設備，但各機構導入程度不一，缺乏全國性的現況與相關因素資料。","s1_2":"全國住宿式長照機構之機構主管（依衛福部公開名冊全數邀請）。","s1_3":"機構特質（規模、權屬、所在地區）、資訊人力與經費、主管對科技的態度。","s1_4":"是否已導入至少一項智慧照護設備；導入項目數。","s1_5":"全國長照機構智慧照護設備的導入比例為何？哪些機構特質與導入有關？","s1_6":"D 問卷調查：橫斷式全國調查；比例與 95% CI、邏輯斯迴歸。","s1_7":"公開名冊；匿名線上問卷，填答即視為同意（申請免書面同意）。","s1_8":"12 個月：問卷發展與預試 3 個月、施測 3 個月、分析與撰寫，保留兩個月緩衝。","s1_9":"提供主管機關規劃補助與輔導之依據。","m1_scene":"臺灣已於 2025 年進入超高齡社會（國家發展委員會，2024），住宿式長照機構住民失能程度愈來愈重，照顧人力卻長期不足。政府與業界因此積極推動離床警示、跌倒偵測、生理量測自動上傳、電子照護紀錄等智慧照護設備，期望減輕夜間巡房與文書負擔、及早發現住民異常。然而，不同規模、權屬與地區的機構導入程度差異很大，第一線常聽到「設備買了沒人會用」或「想導入但沒有經費與資訊人力」兩種截然不同的處境。","m1_gap":"目前關於長照機構智慧照護設備的資料，多為個別機構或廠商的導入案例，缺乏全國性的導入比例、設備類型與停用情形；補助計畫的成果報告也只涵蓋獲補助機構。主管機關規劃補助與輔導時，無法得知哪些類型的機構導入最少、最需要協助，也無從判斷補助後設備是否持續使用。","m1_new":"創新擴散理論指出，組織採用創新受組織規模、可運用資源、領導者態度與創新本身之相對優勢等因素影響（Rogers, 2003）；科技接受模式則說明使用者對有用性與易用性的認知會影響採用意向（Davis, 1989）。這些觀點已用於醫院資訊系統之採用研究，但國內住宿式長照機構之智慧照護設備導入，尚無以全國調查同時描述現況並檢驗組織因素的研究。","m1_time":"主管機關正規劃下一期長照機構智慧科技補助方案，需要導入現況基準與相關因素作為分配依據；本研究可於規劃期間（2027 年上半年）提供全國資料。若錯過此時機，下一期補助仍只能依申請先後或機構自報分配，難以優先協助真正缺乏資源的機構。","m1_stmt":"因此，本研究擬以全國問卷調查，描述住宿式長照機構智慧照護設備之導入比例與類型，並檢驗機構規模、資源與主管態度與導入之關係。","m2_pico":"P：全國住宿式長照機構（機構主管填答）｜I（暴露）：機構規模、權屬、地區、資訊人力與經費、主管態度｜C：未導入之機構｜O：是否導入至少一項智慧照護設備、導入項目數","m2_search":"PubMed：（\"Nursing Homes\"[Mesh] OR \"long-term care\"[tiab]）AND（\"smart home\"[tiab] OR \"assistive technolog*\"[tiab] OR sensor*[tiab] OR \"digital technolog*\"[tiab]）AND（adoption[tiab] OR implementation[tiab] OR survey[tiab]）\n華藝：（長照機構 OR 護理之家）AND（智慧照護 OR 科技）AND（導入 OR 現況）\n限制：2015 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、組織採用創新。Rogers（2003）的創新擴散理論指出，組織規模、可運用資源、領導者態度與創新本身的相對優勢會影響採用。對本研究的意義：自變項以機構規模、資源與主管態度為主。\n二、調查方法。全國調查的樣本數依可容許誤差估算（Cochran, 1977），問卷發放與提醒宜依調整式設計法提高回收率（Dillman et al., 2014）；自編題目應經專家內容效度檢驗（Polit & Beck, 2006）。\n三、因素分析與報告。二元結果以邏輯斯迴歸分析（Hosmer et al., 2013），每個變項應有足夠事件數（Peduzzi et al., 1996）；觀察性研究依 STROBE 報告（von Elm et al., 2007）。本研究初步檢索（附錄一）未見國內住宿式長照機構智慧照護設備導入之全國調查（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有理論指出組織規模、資源與領導者態度影響創新採用（Rogers, 2003），且已有成熟的調查與分析方法（Dillman et al., 2014；Hosmer et al., 2013）。","m2_unknown":"然而，國內住宿式長照機構智慧照護設備之全國導入比例、各類設備之使用與停用情形，以及與導入相關之機構因素，仍缺乏以完整名冊為抽樣架構、並處理無回應偏差之全國性資料。","m2_worth":"此缺口使主管機關規劃補助時無法鎖定最需要協助的機構類型，也無法得知設備導入後停用的比例；本研究以全國調查提供加權後之導入比例與相關因素，可直接作為補助與輔導對象之篩選依據。","m2_theory":"以創新擴散理論之組織採用觀點（Rogers, 2003）建立架構：機構特質（規模、權屬、地區）、資源（資訊人力、經費）與主管態度，分別與導入狀態相關。","m2_orig":"本計畫為國內首次針對住宿式長照機構智慧照護設備導入之全國調查，並以創新擴散理論檢驗組織因素。","m3_rq":"全國住宿式長照機構智慧照護設備導入比例為何？哪些機構因素與導入相關？","m3_terms":"智慧照護設備：以感測、自動化或連網技術協助照護之設備，本研究列舉 8 類（如離床警示、跌倒偵測、生理量測自動上傳、電子照護紀錄）。\n已導入：調查時機構正在使用至少一類設備。\n主管態度：主管對智慧照護設備有用性與易用性之看法，以 6 題 7 點量尺測量。","m3_scope":"研究範圍為衛福部公開名冊所列、調查期間仍營運之全國住宿式長照機構（含長期照顧服務機構、護理之家、老人福利機構之長期照護型與養護型），由機構主管或其指定之護理主管填答，調查期間為 2027 年 1–3 月。本研究描述現況與相關因素，不推論因果，不評估設備對照護品質之成效，亦不調查住民與家屬觀點。","m4_frame":"自變項：機構規模（床數）、權屬（公立、財團法人、私立）、地區（北中南東）、是否有專職資訊人員、近三年是否獲科技補助、主管態度；依變項：是否已導入（主要）、導入類數（次要）。","m5_design":"本研究採橫斷式全國問卷調查（D 型：問卷調查），依 STROBE 報告（von Elm et al., 2007）。","m5_reject":"不採個案研究，因無法估計全國比例；不採便利抽樣或只發給公協會會員，因會偏向資源較多、較積極之機構，無法推論全國，故以公開名冊全數邀請；不採面訪，因機構分布全國、人力與時間不允許，且線上問卷可依調整式設計法提高回收率。","m5_site":"研究對象為衛福部公開之住宿式長照機構名冊所列機構（教學示意：約 1,100 家，以下載當月名冊為準），由機構主管填答，必要時由其指定熟悉設備使用之護理主管代答並註明職稱。名冊為公開資料，研究者已下載並整理機構名稱、地址、電話與權屬（附錄二）；兩個長照相關公協會已同意協助宣傳。","m5_incl":"納入條件：名冊中調查期間仍營運之住宿式長照機構。排除條件：調查期間停業或歇業者；同一法人多家機構者，每家機構各自填答。","m5_sample":"依信心水準 95%、可容許誤差 ±0.05、預期比例 p = 0.5 估算，需 385 家；若母群約 1,100 家（教學示意，以實際名冊為準），經有限母群校正需約 286 家。名冊全數邀請，預期回收率 30% 以上。","m5_tool":"一、機構基本資料：床數、權屬、地區、資訊人員、補助經驗（8 題）。\n二、智慧照護設備導入清單：8 類設備，每類勾選「使用中／曾用已停用／未曾使用」。\n三、主管態度量表：改編自 TAM 有用性與易用性（Davis, 1989），6 題 7 點量尺，經 6 位專家內容效度檢驗，以 I-CVI ≥ .78、S-CVI/Ave ≥ .90 為標準（Polit & Beck, 2006；專家 5 位以下時 I-CVI 須為 1.00）。\n四、導入障礙開放題 1 題。","m5_flow":"一、第 1–2 月：問卷初稿、6 位專家內容效度；IRB 送審。\n二、第 3 月：預試 30 家機構，計算 Cronbach's α 並修正題意。\n三、第 4–6 月：正式施測，以電子郵件與公文寄送線上問卷，依調整式設計法於第 1、2、4 週提醒，第 5 週電話提醒未回覆者（Dillman et al., 2014）。\n四、問卷不收集填答者姓名；機構代碼僅用於避免重複填答，分析前刪除。","m5_innov":"以公開名冊全數邀請並採多次提醒提高代表性，同時以權重校正回收樣本與母群在地區與權屬上的差異。","m6_common":"顯著水準 α = .05（雙尾）。導入比例報 95% CI，並依名冊之地區與權屬計算事後分層權重。相關因素以多元邏輯斯迴歸分析，報調整後 OR 與 95% CI；導入類數以卜瓦松或負二項迴歸分析。比較回收與未回收機構之地區、權屬與規模，評估無回應偏差。分析以 R（版本寫明）執行。","m6_qual":"導入障礙開放題以內容分析歸類，計算各類出現次數。","m7_irb":"本研究將送〔大學〕研究倫理審查委員會審查，因屬匿名問卷、填答者為成年機構主管且不涉及個人敏感資料，預計申請簡易審查，並申請以線上說明與勾選同意取代書面同意，以審查會認定為準；於第 1 月送審，核准後才進行預試。","m7_consent":"問卷首頁說明研究目的、預計填答時間（約 15 分鐘）、匿名方式與可隨時中止之權利，填答者勾選「我已閱讀並同意參與」後才開始作答。因問卷匿名且屬最小風險，取得書面同意反而需留下可識別資料，故申請免除書面同意（改以線上同意），以審查會核准為準。","m7_risk":"屬最小風險；問卷不涉及個人敏感資料，填答者可隨時中止。主要風險為機構被識別，結果僅以全國或分層彙總呈現，任何分層少於 5 家時合併呈現，機構名稱不在結果中出現。","m7_deid":"問卷不收集填答者姓名與聯絡方式；機構代碼僅用於避免重複填答與計算無回應權重，完成權重計算後即刪除。資料存於學校加密雲端資料夾，僅研究者與指導教授可存取，保存至研究結束後 3 年，期滿以不可回復方式刪除。","m7_coi":"研究者與任何智慧照護設備廠商無財務關係。生成式 AI 僅用於英文潤稿，不輸入問卷資料。","m8_feas":"資料：名冊為公開資料，已下載整理並以 30 家隨機電話抽查確認聯絡資訊正確率（附錄二）。回收：兩個長照公協會已同意於會員群組宣傳，指導教授過去主持之機構調查回收率約 35%。工具：設備清單與主管態度量表已完成初稿，6 位專家已同意進行內容效度審查。時間：施測安排 3 個月並依調整式設計法多次提醒，保留兩個月緩衝。","m9_acad":"提供國內住宿式長照機構智慧照護設備導入之全國基準資料（含使用中與停用比例），並以創新擴散理論與科技接受模式檢驗組織特質、資源與主管態度之相對重要性。","m9_prac":"供主管機關規劃補助時，優先協助導入比例低、缺乏資訊人力或主管態度保留之機構類型；停用原因與導入障礙可作為補助配套（教育訓練、維修支援）之設計依據。","m9_limd":"橫斷式設計只能說明相關，不能推論因果，例如主管態度正向可能是導入後的結果而非原因；以機構為分析單位，結果不能推論至個別照護人員的使用意願。","m9_lime":"回收率可能偏低，回收機構可能偏向已導入者；將比較回收與未回收機構之地區、權屬與規模，並以事後分層權重校正。自陳資料可能高估導入程度，將以「使用中」與「曾用已停用」區分並以事實題詢問。","m9_train":"參與之碩士生將習得問卷發展、內容效度、全國調查施測與邏輯斯迴歸分析（教學示意）。","m9_output":"預計投稿期刊論文 1 篇，並提供主管機關政策建議摘要 1 份（教學示意）。","m9_nation":"回應長照人力不足與智慧照護推動政策，提供補助與輔導之實證依據。","t_iv":"機構特質","t_pop":"全國住宿式長照機構","t_out":"智慧照護設備導入","t_des":"全國調查","m10_title":"全國住宿式長照機構智慧照護設備導入現況與相關因素：全國問卷調查","m10_title_en":"Adoption of Smart Care Technologies in Residential Long-Term Care Facilities in Taiwan: Current Status and Associated Factors from a National Survey","m10_kw":"長照機構、智慧照護、科技導入、創新擴散、問卷調查","m10_abs":"政府推動長照機構導入智慧照護設備，但各機構導入程度不一，缺乏全國性資料可供規劃補助。本研究旨在描述全國住宿式長照機構智慧照護設備之導入比例與類型，並檢驗機構規模、資源與主管態度與導入之關係。本研究採橫斷式全國問卷調查，以衛福部公開名冊全數邀請機構主管填答線上問卷，內容包括機構特質、8 類設備導入情形（使用中、曾用已停用、未曾使用）、主管態度量表與導入障礙；以事後分層加權之比例與 95% CI 描述現況，以多元邏輯斯迴歸分析相關因素，並評估無回應偏差。預期資訊人力、補助經驗與主管態度與導入相關，可供主管機關規劃補助與輔導對象。","m10_refs":"國家發展委員會. (2024). 中華民國人口推估（2024 年至 2070 年）. 國家發展委員會.\nCochran, W. G. (1977). Sampling techniques (3rd ed.). Wiley.\nDavis, F. D. (1989). Perceived usefulness, perceived ease of use, and user acceptance of information technology. MIS Quarterly, 13(3), 319–340.\nDillman, D. A., Smyth, J. D., & Christian, L. M. (2014). Internet, phone, mail, and mixed-mode surveys: The tailored design method (4th ed.). Wiley.\nHosmer, D. W., Lemeshow, S., & Sturdivant,
