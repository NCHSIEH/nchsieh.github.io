antt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":1},{"t":"需求訪談與設計","s":2,"e":2},{"t":"開發與兩輪形成性評估","s":2,"e":5},{"t":"招募、前測與分派","s":6,"e":6},{"t":"介入：兩組訓練","s":6,"e":7},{"t":"訓練後與 4 週保留測試","s":7,"e":8},{"t":"資料分析與撰寫","s":8,"e":10},{"t":"緩衝（開發延誤、補測）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"系統準確度不足","trig":"第 5 月深度 ICC < .6","when":"M5","plan":"改為只回饋速率並在限制中說明"},{"r":"招募不足","trig":"第 6 月少於 52 人","when":"M6","plan":"擴大至三年級學生"},{"r":"回饋假人故障","trig":"測試前檢查異常","when":"每次測試","plan":"備用假人；改期測試"},{"r":"深度判定準確度不足","trig":"第二輪形成性評估深度 ICC < .75","when":"M5","plan":"改為僅回饋速率與中斷，第二階段主要結果仍以回饋假人感測器測量，並於限制中說明"}],"kpi":[{"name":"訓練後達標比例組間差（成果指標）","calc":"ANCOVA 調整後平均差","base":"前測平均（第 6 月）","goal":"AI 回饋組較高"},{"name":"完成保留測試人數（產出指標）","calc":"完成 4 週測試人數","base":"0","goal":"每組 26 人以上"}],"ss":{"kind":"two","eff":0.8,"alpha":0.05,"tails":2,"power":0.8,"drop":15,"moe":0.05,"basis":"回饋裝置研究多報告明顯優勢（Nicolau et al., 2024），證據確定性低"}}},"AE":{"label":"A→E 先開發試用再訪談經驗：居服員服務紀錄 App","grp":1,"data":{"meta":{"type":"A","type2":"E 質性研究"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"居家服務員每天往返多位個案家中，服務紀錄靠紙本或事後補登，常漏記或延遲；督導無法即時掌握個案異常，系統導入後也常「用一陣子就不用」。","s1_2":"北部某居家服務單位之居家服務員約 60 人與督導 6 人；第一階段需求分析、形成性評估與 8 週試用，第二階段訪談約 15 人。","s1_3":"自行開發之居服員服務紀錄 App（服務項目勾選、語音輸入、異常即時回報）；第二階段：試用後之使用經驗與持續使用之條件。","s1_4":"第一階段：任務完成率、SUS、8 週使用率與紀錄即時完成率；第二階段：促進與阻礙持續使用之主題。","s1_5":"能否開發出居服員好用的服務紀錄 App？試用後，哪些因素促成或阻礙居服員持續使用？","s1_6":"A→E：設計科學研究法開發並現場試用 8 週，再以半結構訪談探討使用經驗（以 NASSS 為敏感概念）。","s1_7":"居服單位書面同意；居服員與督導書面同意；App 不蒐集個案姓名與身分證字號，以個案代碼記錄。","s1_8":"12 個月：需求 2 個月、開發與迭代 4 個月、試用 2 個月、訪談 2 個月，保留兩個月緩衝。","s1_9":"產出可上線之 App 雛型、使用率數據與持續使用的條件清單，供居服單位決定是否全面導入。","m1_scene":"居家服務員每天往返 4–6 位個案家中，提供沐浴、備餐、陪同就醫等服務，每次服務後須記錄服務項目、時間與個案狀況；發現個案跌倒、進食變差或家中異狀時，也要回報督導。北部某居家服務單位目前以紙本紀錄表為主，居服員常在一天結束或隔天才補登，督導每週彙整一次，個案異常往往延遲數天才被發現（單位內部稽核，教學示意）。","m1_gap":"單位曾採購通用型表單 App，但欄位多、需要逐字打字、在個案家中操作不便，數週後多數居服員又回到紙本。問題不只在介面：居服員年齡層偏高、手機型號不一、行動數據費用由誰負擔、督導是否真的會看回報，都影響是否持續使用。若只評估「好不好用」，無法解釋為何工具上線後仍被放棄。","m1_new":"設計科學研究法以使用者參與之迭代開發與評估產出人工物（Hevner et al., 2004；Peffers et al., 2007），可解決介面與流程的契合問題；但可用性良好不等於持續使用。Greenhalgh 等人（2017）提出 NASSS 框架，指出健康與照護科技之不採用與放棄，源自科技、使用者、組織、價值主張與更大環境等多個領域的複雜互動。在現場試用後，以質性訪談探討使用經驗，可補上「做得出來」與「用得下去」之間的落差。","m1_time":"單位將於 2027 年更新居服紀錄制度，並爭取地方政府數位轉型補助；需要在決定全面導入前，先有一個經居服員參與設計、現場試用並了解持續使用條件的工具。若直接全面導入，重蹈「用一陣子就不用」的成本更高。","m1_stmt":"因此，本研究擬以設計科學研究法開發居服員服務紀錄 App 並現場試用 8 週，再以質性訪談探討促成與阻礙居服員持續使用之因素。","m2_pico":"第一階段｜P：居家服務員與督導｜I：服務紀錄 App｜C：現行紙本紀錄（需求分析時比較）｜O：任務完成率、SUS、8 週使用率、紀錄即時完成率。第二階段 PICo｜P：試用 App 之居服員與督導｜I：使用經驗與持續使用之條件｜Co：居家服務情境","m2_search":"PubMed：（\"Home Care Services\"[Mesh] OR \"home care worker*\"[tiab] OR \"home care aide*\"[tiab] OR \"personal care aide*\"[tiab]）AND（\"Mobile Applications\"[Mesh] OR app[tiab] OR \"electronic documentation\"[tiab] OR mHealth[tiab]）AND（usability[tiab] OR adoption[tiab] OR implementation[tiab] OR NASSS[tiab]）\n華藝：（居家服務 OR 居服員）AND（App OR 行動應用程式 OR 電子紀錄）AND（使用經驗 OR 可用性 OR 導入）\n限制：2015 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、居家服務紀錄的挑戰。居家服務在個案家中進行，服務人員分散、工作時間零碎，紀錄常延遲補登，督導難以即時掌握個案變化。對本研究的意義：工具必須能在服務當下、單手、短時間完成。\n二、系統開發與可用性。設計科學研究法以問題界定、需求、設計開發、展示與評估等步驟產出並評估人工物（Peffers et al., 2007）；形成性評估以專家啟發式評估（Nielsen, 1993）與使用者放聲思考找出問題，總結性評估以 SUS 等指標描述可用性（Brooke, 1996；Bangor et al., 2008）。對本研究的意義：每輪問題清單與修正都要記錄。\n三、從可用到持續使用。NASSS 框架整理七個領域（狀況、科技、價值主張、使用者、組織、更大環境、隨時間調適），用以解釋健康與照護科技為何不被採用、被放棄或無法擴展（Greenhalgh et al., 2017）。質性描述以參與者語言呈現經驗（Sandelowski, 2000），主題分析可歸納促進與阻礙因素（Braun & Clarke, 2006）。本研究初步檢索（附錄一）未見國內居服員紀錄工具結合開發、現場試用與使用經驗訪談之研究（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已提供系統開發與可用性評估之方法（Peffers et al., 2007；Brooke, 1996），以及解釋科技不採用與放棄之 NASSS 框架（Greenhalgh et al., 2017）。","m2_unknown":"然而，國內居家服務情境中，由居服員參與設計、經現場試用之紀錄工具，以及試用後促成或阻礙持續使用之因素，仍缺乏將「開發與可用性」與「使用經驗」連結之證據。","m2_worth":"此缺口使居服單位只能依廠商展示決定採購，且無法預先處理影響持續使用的組織與人員因素；本研究以 A→E 兩階段，同時產出經評估之工具與導入時應準備的配套。","m2_theory":"第一階段依設計科學研究法（Hevner et al., 2004；Peffers et al., 2007）開發與評估，以 ISO 9241-11 之有效性、效率與滿意度界定可用性；第二階段以 NASSS 框架（Greenhalgh et al., 2017）作為敏感概念引導訪談，但主題由資料中歸納；兩階段以使用日誌連結：依試用期使用率高低選取受訪者。","m2_orig":"本計畫將居服員紀錄工具之開發、現場試用與使用經驗訪談串成一個研究，以使用日誌選取高低使用者訪談，並以聯合呈現表對照使用數據與主題，提出可直接用於導入規劃的持續使用條件清單。","m3_rq":"居服員服務紀錄 App 之可用性如何？試用後哪些因素促成或阻礙持續使用？","m3_terms":"服務紀錄 App：本研究開發之手機應用程式，提供服務項目勾選、語音輸入備註與異常即時回報，資料以個案代碼記錄。\n紀錄即時完成率：服務結束後 2 小時內完成紀錄之服務次數比例，由系統時間戳記計算。\n8 週使用率：試用期間以 App 完成紀錄之服務次數占應紀錄服務次數之比例。\n持續使用：試用結束後居服員自述仍願意且實際以 App 取代紙本紀錄。","m3_scope":"研究範圍為北部某居家服務單位之居家服務員與督導，研究期間 12 個月。第一階段開發 App 並評估可用性與 8 週使用情形；第二階段描述使用經驗與持續使用之條件。本研究不評估 App 對個案照護結果之成效，不與既有商用系統介接，亦不訪談個案與家屬。","m4_frame":"第一階段（A）：需求分析 → 設計與開發 → 兩輪形成性評估 → 總結性評估（任務完成率、SUS）→ 8 週現場試用（使用率、紀錄即時完成率）。第二階段（E）：依使用率高低各選居服員約 6 人並訪談督導 3 人，以 NASSS 七領域為敏感概念探討促進與阻礙因素，並以聯合呈現表對照使用數據與主題。","m5_design":"本研究採兩階段設計（A→E）：第一階段以設計科學研究法開發服務紀錄 App，經兩輪形成性評估修正後進行總結性評估與 8 週現場試用；第二階段為描述性質性研究，以半結構訪談探討使用經驗，屬解釋性之序列設計。","m5_reject":"不只做可用性評估，因無法解釋工具上線後為何被放棄；不先做大規模問卷，因持續使用之因素尚未被描述，難以設計題項；不直接全面導入後評估成效，因工具與流程未經試用，失敗時無法分辨是工具還是組織問題。","m5_site":"研究場域為北部某居家服務單位（服務個案約 400 人、居服員約 60 人、督導 6 人），單位主任已書面同意提供需求訪談、試用與訪談之安排（附錄二）。第一階段：需求分析居服員 6 人與督導 2 人；形成性評估專家 3 位（長照實務 1、人因工程 1、資訊 1）與每輪居服員 5 人；總結性評估與 8 週試用居服員 20 人。第二階段：居服員約 12 人與督導 3 人。","m5_incl":"納入條件：在職居服員，年資 3 個月以上、使用智慧型手機；督導為負責該組居服員之督導。排除條件：研究期間預計離職者。形成性評估參與者不參加總結性評估（避免學習效應）；第二階段受訪者從試用之 20 人中選取。","m5_sample":"形成性評估以 5 位使用者為一輪，可找出多數主要可用性問題，共 2 輪；總結性評估與試用居服員 20 人（兩組督導轄下全數），屬描述性評估，不做推論檢定。第二階段依 8 週使用率取最高與最低各約三分之一，各邀請約 6 人，另訪談督導 3 人；以資料飽和為判準，連續兩位未出現新主題即停止並續訪一位確認（Hennink & Kaiser, 2022）。","m5_tool":"一、需求訪談與同行觀察：跟隨居服員各 1 個班次，記錄紀錄時機與困難；訪談大綱見附錄三。\n二、任務腳本：完成一次服務紀錄、以語音補充備註、回報一筆異常、查詢上週紀錄共 4 項任務。\n三、SUS 中文版 10 題（Brooke, 1996）；啟發式評估：Nielsen 十原則，嚴重度 0–4。\n四、使用日誌：每次紀錄之時間戳記、完成時間、異常回報筆數，計算使用率與紀錄即時完成率。\n五、第二階段訪談大綱：依 NASSS 七領域與第一階段使用數據擬定，如「哪些時候您會改回紙本？」「督導有回應您的回報嗎？」（附錄四）。","m5_flow":"一、第 1–2 月：IRB 送審（兩階段一併）；需求訪談與同行觀察，以主題分析整理需求並以 MoSCoW 排序。\n二、第 3–6 月：設計與開發；第 4 月、第 6 月各一輪形成性評估。\n三、第 7 月：總結性評估（20 人完成 4 項任務並填 SUS），隨即開始 8 週現場試用，期間紙本與 App 並行，以 App 為主。\n四、第 9 月：匯出使用日誌，依使用率選取受訪者。\n五、第 9–10 月：第二階段訪談（每人 45–60 分鐘，地點由受訪者選擇），邊蒐集邊分析。","m5_innov":"以 8 週使用日誌連結兩階段：依實際使用率高低選取受訪者，並以聯合呈現表對照數據與主題，使質性結果能直接解釋「誰用下去、誰放棄、為什麼」。","m6_common":"第一階段以描述統計呈現任務完成率、完成時間（中位數與四分位距）、SUS（平均與標準差）、8 週使用率與紀錄即時完成率（每週趨勢圖）；兩輪形成性評估之問題數與嚴重度以表格比較。統計不做推論檢定。整合：以聯合呈現表將高低使用者之使用數據與主題並列，判斷質性結果是否解釋、補充或與數據不一致。分析以 R（版本寫明）執行。","m6_qual":"需求訪談與第二階段訪談依 Braun 與 Clarke（2006）主題分析六步驟；第二階段前 3 份逐字稿由兩位研究者獨立編碼建立編碼簿，以 NASSS 七領域為敏感概念對照，但保留無法歸入之新主題；嚴謹度以成員檢核、厚實描述、稽核軌跡與反思日誌提升（Lincoln & Guba, 1985），依 COREQ 報告（Tong et al., 2007）。","m7_irb":"本研究將送〔大學〕人體研究倫理審查委員會審查，屬成年工作人員之訪談、可用性測試與試用，最小風險，預計申請簡易審查，兩階段一併送審；第二階段訪談大綱於第一階段後確定，以變更案提出。","m7_consent":"居服員與督導均簽署書面同意書；說明參與與否、使用率高低與訪談內容均不影響考核與排班。招募由研究者直接說明，不由督導邀請；第二階段另行說明並再次同意。","m7_risk":"屬最小風險；試用期間紙本紀錄仍並行，App 異常不影響個案服務。居服員可能擔心使用率被用於考核，故使用日誌只以研究編號分析，不提供單位。行動數據費用由研究經費補貼。","m7_deid":"App 以個案代碼記錄，不蒐集個案姓名與身分證字號；資料存於單位指定之加密伺服器，研究者只取得以研究編號呈現之使用日誌。訪談逐字稿以代號取代姓名，錄音於核對後刪除。研究資料保存至研究結束後 3 年，期滿以不可回復方式刪除；試用結束後 App 內資料移交單位依其紀錄保存規定處理。","m7_coi":"研究者與任何居服資訊系統廠商無財務關係；App 為研究用雛型，若單位日後採用，另行約定授權。生成式 AI 僅用於程式除錯，不輸入個案與訪談資料。","m8_feas":"場域：居服單位已書面同意（附錄二），並提供督導協助安排需求訪談與試用。技術：研究者具跨平台 App 開發經驗，語音輸入使用手機內建功能，不需額外伺服器運算。樣本：兩組督導轄下居服員共 20 人可全數參與試用。經費：行動數據補貼與受訪者禮券約〔　〕元。時間：開發與迭代 4 個月、試用 2 個月、訪談 2 個月，保留兩個月緩衝。","m9_acad":"提供居家服務紀錄工具之完整開發、現場試用與使用經驗證據，並示範以使用日誌選取受訪者、以 NASSS 為敏感概念解釋持續使用之 A→E 設計。","m9_prac":"產出經評估之 App 雛型與「持續使用條件清單」（如訓練方式、督導回應機制、數據費用、紙本退場時程），供單位決定是否全面導入與規劃配套。","m9_limd":"單一居服單位、試用 8 週，長期使用與其他單位之適用性需後續驗證；總結性評估與試用屬描述性，不推論 App 改善照護結果。","m9_lime":"試用期間紙本並行可能降低 App 使用率；受訪者可能因研究者為開發者而傾向正面評價，將由非開發者之研究人員進行訪談並強調要找問題。","m9_train":"參與之碩士生將習得需求分析與同行觀察、App 雛型開發、可用性測試、使用日誌分析與質性訪談（教學示意）。","m9_output":"預計投稿期刊論文 2 篇（開發與可用性、使用經驗）、研討會論文 1 篇，並產出 App 雛型與導入配套建議（教學示意）。","m9_nation":"回應長照人力短缺與長照數位轉型之政策需求，提供居服單位導入數位紀錄工具時兼顧工具與組織配套之實證依據。","t_iv":"服務紀錄 App","t_pop":"居家服務員","t_out":"之開發、試用與使用經驗","t_des":"設計科學研究與質性研究","m10_title":"居家服務員服務紀錄 App 之開發、現場試用與使用經驗：設計科學研究與質性研究","m10_title_en":"Development, Field Trial, and User Experience of a Service Documentation App for Home Care Workers: A Design Science and Qualitative Study","m10_kw":"居家服務、行動應用程式、可用性、持續使用、設計科學研究","m10_abs":"居家服務員常於服務後延遲補登紙本紀錄，個案異常不易即時回報，既有通用表單 App 亦常在數週後被放棄。本研究旨在開發居服員服務紀錄 App 並評估其可用性，再探討促成與阻礙持續使用之因素。第一階段於北部某居家服務單位以設計科學研究法，經需求訪談與同行觀察、兩輪形成性評估後，由 20 位居服員進行總結性評估與 8 週現場試用，描述任務完成率、SUS、使用率與紀錄即時完成率；第二階段依使用率高低選取居服員約 12 人與督導 3 人進行半結構訪談，以 NASSS 為敏感概念進行主題分析，並以聯合呈現表整合。預期產出可上線之 App 雛型與持續使用條件清單，供單位決定是否全面導入。","m10_kw_en":"home care workers; mobile application; usability; technology adoption; design science research","m10_abs_en":"Home care workers often complete paper service records hours or days after visits, delaying the reporting of client changes, and generic form apps are frequently abandoned within weeks. This study aims to develop a service documentation app for home care workers, evaluate its usability, and explore factors that facilitate or hinder its continued use. In phase one, design science research will be conducted at a home care agency in northern Taiwan: requirements will be identified through interviews and shadowing, and the app will be refined through two rounds of formative evaluation. Twenty home care workers will then complete a summative evaluation and an eight-week field trial, with task completion, System Usability Scale scores, usage rate, and timely documentation rate described from usage logs. In phase two, approximately 12 workers selected by high and low usage and three supervisors will be interviewed; thematic analysis will be guided by the NASSS framework as sensitizing concepts, and findings will be integrated with usage data in a joint display. The study is expected to produce a deployable app prototype and a list of conditions for sustained use to inform the agency's adoption decision.","m10_refs":"Bangor, A., Kortum, P. T., & Miller, J. T. (2008). An empirical evaluation of the System Usability Scale. International Journal of Human–Computer Interaction, 24(6), 574–594.\nBraun, V., & Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77–101.\nBrooke, J. (1996). SUS: A quick and dirty usability scale. In P. W. Jordan et al. (Eds.), Usability evaluation in industry (pp. 189–194). Taylor & Francis.\nGreenhalgh, T., Wherton, J., Papoutsi, C., Lynch, J., Hughes, G., A'Court, C., et al. (2017). Beyond adoption: A new framework for theorizing and evaluating nonadoption, abandonment, and challenges to the scale-up, spread, and sustainability of health and care technologies. Journal of Medical Internet Research, 19(11), e367.\nHennink, M., & Kaiser, B. N. (2022). Sample sizes for saturation in qualitative research: A systematic review of empirical tests. Social Science & Medicine, 292, 114523.\nHevner, A. R., March, S. T., Park, J., & Ram, S. (2004). Design science in information systems research. MIS Quarterly, 28(1), 75–105.\nInternational Organization for Standardization. (2018). Ergonomics of human-system interaction—Part 11: Usability: Definitions and concepts (ISO 9241-11:2018).\nLincoln, Y. S., & Guba, E. G. (1985). Naturalistic inquiry. Sage.\nNielsen, J. (1993). Usability engineering. Academic Press.\nPeffers, K., Tuunanen, T., Rothenberger, M. A., & Chatterjee, S. (2007). A design science research methodology for information systems research. Journal of Management Information Systems, 24(3), 45–77.\nSandelowski, M. (2000). Whatever happened to qualitative description? Research in Nursing & Health, 23(4), 334–340.\nTong, A., Sainsbury, P., & Craig, J. (2007). Consolidated criteria for reporting qualitative research (COREQ): A 32-item checklist for interviews and focus groups. International Journal for Quality in Health Care, 19(6), 349–357.","irb_inst":"〔大學名稱〕〔系所〕；研究場域：北部某居家服務單位","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：成年工作人員之訪談、可用性測試與工具試用，App 不蒐集個案可識別資料，屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"第一階段：需求訪談居服員 6 人與督導 2 人、形成性評估每輪 5 人共 10 人、總結性評估與試用 20 人，另專家 3 位；第二階段：居服員約 12 人與督導 3 人。","irb_recruit":"由研究者於單位月會說明研究，有意願者主動聯繫；督導不參與邀請與名單確認，參與與否不影響考核與排班。","irb_vuln":"否。參與者為成年受雇者：招募不經督導、使用率與訪談內容不提供單位，以避免僱傭關係造成壓力。","irb_task":"需求訪談約 45 分鐘並讓研究人員跟隨一個班次觀察；可用性測試約 30 分鐘並填 10 題問卷；試用 8 週期間以 App 記錄服務（紙本照常並行）；部分人員受邀接受一次約 45–60 分鐘訪談（錄音）。","irb_withdraw":"可隨時口頭或書面告知撤回，撤回後停止使用 App，已蒐集之使用日誌與訪談資料依意願刪除或僅保留去識別化資料。","irb_benefit":"無直接利益；試用期間補貼行動數據費〔　〕元／月，受訪者致贈〔　〕元禮券。","irb_harm":"屬最小風險；若 App 異常，以紙本紀錄為準，不影響個案服務。對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為需求訪談與觀察筆記、可用性測試紀錄、以研究編號呈現之使用日誌、訪談錄音與逐字稿。錄音於核對後刪除；去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"否：所有參與者簽署書面同意書。","irb_ad":"【居服員參與邀請：服務紀錄 App】想不想要一個在個案家就能快速完成紀錄的 App？我們邀請居服員一起設計、試用並分享使用心得。參與與否不影響考核與排班，試用期間補貼數據費。聯絡人：〔研究生姓名〕〔電話／電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責 App 開發、可用性測試與資料分析）；訪談員〔姓名〕（非開發者，負責第二階段訪談）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益；App 為研究用雛型，若單位日後採用將另行約定授權並送審。"},"objs":[{"verb":"開發","text":"開發居服員服務紀錄 App 並經兩輪形成性評估修正","hyp":"","analysis":"需求訪談主題分析與 MoSCoW；啟發式評估與放聲思考問題清單（嚴重度 0–4）；比較兩輪問題數","crit":"第二輪無嚴重度 3–4 之問題","sens":"回歸測試 4 項核心任務","exp":"預期第一輪找出語音輸入與異常回報流程之主要問題，第二輪嚴重問題明顯減少。"},{"verb":"描述","text":"描述 App 之可用性與 8 週現場使用情形","hyp":"","analysis":"描述統計：任務完成率、完成時間、SUS；每週使用率與紀錄即時完成率趨勢","crit":"SUS 以 68 分為平均參考值（描述性，不做推論檢定）","sens":"依年齡層與手機使用經驗分別呈現","exp":"預期 SUS 達平均以上；使用率可能於第 3–4 週下降後趨穩，下降幅度將作為第二階段訪談重點。"},{"verb":"探討","text":"探討促成與阻礙居服員持續使用 App 之因素","hyp":"","analysis":"主題分析（以 NASSS 為敏感概念）；聯合呈現表對照高低使用者數據與主題","crit":"連續 2 位無新主題視為飽和；雙人編碼前 3 份","sens":"比較高低使用者主題分布；督導觀點對照","exp":"預期除介面外，督導是否回應回報、紙本是否退場、數據費用與同儕使用情形是持續使用之關鍵；若高使用者亦描述多項阻礙，表示配套需優先處理。"}],"vars":[{"name":"任務完成率與完成時間","role":"依變項","concept":"有效性與效率","oper":"4 項任務無協助完成之比例；每項任務秒數","tool":"觀察與螢幕錄影","scale":"比率","time":"總結性評估","rel":"標準化任務腳本"},{"name":"SUS 分數","role":"依變項","concept":"主觀可用性","oper":"SUS 10 題換算 0–100","tool":"問卷","scale":"等距","time":"總結性評估","rel":"Brooke（1996）；Bangor 等人（2008）"},{"name":"8 週使用率與紀錄即時完成率","role":"依變項","concept":"實際使用程度與紀錄時效","oper":"以 App 完成紀錄之服務比例；服務後 2 小時內完成之比例","tool":"使用日誌","scale":"比率","time":"試用 8 週（每週）","rel":"系統時間戳記"},{"name":"持續使用之促進與阻礙因素","role":"探索","concept":"影響持續使用之經驗","oper":"主題分析歸納之主題（對照 NASSS 七領域）","tool":"訪談逐字稿","scale":"","time":"第二階段","rel":"雙人編碼；成員檢核"},{"name":"年齡、年資、手機使用經驗","role":"控制","concept":"使用者背景","oper":"年齡（歲）；年資（年）；每日使用手機時間","tool":"基本資料表","scale":"比率","time":"總結性評估前","rel":"—"}],"bias":[{"name":"學習效應","why":"同一居服員參加多輪測試會越來越熟悉","fix":"形成性與總結性評估招募不同居服員"},{"name":"期望偏差（取悅研究者）","why":"居服員可能因研究者為開發者而給予正面評價","fix":"第二階段由非開發者訪談；強調要找問題"},{"name":"霍桑效應","why":"知道被研究，試用初期使用率可能偏高","fix":"觀察 8 週趨勢，以後 4 週為穩定期描述"},{"name":"研究者前理解（質性）","why":"研究者預期介面是主因，可能忽略組織因素","fix":"以 NASSS 七領域檢核訪談涵蓋面；反思日誌；雙人編碼"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":1},{"t":"需求訪談與同行觀察","s":2,"e":2},{"t":"設計、開發與兩輪形成性評估","s":3,"e":6},{"t":"總結性評估與 8 週試用（收案）","s":7,"e":8},{"t":"使用日誌分析與選取受訪者","s":9,"e":9},{"t":"第二階段訪談","s":9,"e":10},{"t":"整合分析與論文撰寫","s":10,"e":11},{"t":"緩衝（開發延誤、補訪）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"開發進度落後","trig":"第 5 月語音輸入仍不穩定","when":"M5","plan":"語音改為選配，先以勾選完成核心紀錄；使用緩衝月"},{"r":"試用期使用率過低","trig":"試用第 3 週使用率 < 30%","when":"M7–M8","plan":"不催促使用（以免干擾自然情境），將低使用列為第二階段訪談重點"},{"r":"手機不相容","trig":"居服員手機版本過舊無法安裝","when":"M7","plan":"提供備用測試手機並記錄型號"},{"r":"受訪者不足","trig":"低使用者願受訪少於 4 人","when":"M9","plan":"放寬至使用率最低之一半，並增加督導觀點"}],"kpi":[{"name":"8 週使用率（成果指標）","calc":"以 App 完成紀錄之服務次數／應紀錄服務次數；使用日誌每週計算","base":"試用第 1 週","goal":"後 4 週穩定於〔　〕% 以上（依第 1 週基準訂定）"},{"name":"完成訪談人數（產出指標）","calc":"完成並轉錄之訪談數","base":"0","goal":"第 10 月前 15 人"}],"ss":{}}},"CE":{"label":"C→E 成效後訪談解釋：Case Q 長照 AI 交班摘要","grp":1,"data":{"meta":{"type":"C","type2":"E 質性研究"},"f":{"s1_1":"長照機構交班靠自由文字紀錄，彙整費時，排擠直接照護","s1_2":"北部兩家住宿式長照機構，負責交班之護理師與資深照服員 62 人","s1_3":"院內部署之生成式 AI 照護紀錄摘要工具","s1_4":"交班準備時間（分鐘，第三方觀察計時）","s1_5":"導入後，交班準備時間是否縮短、紀錄完整性是否不變差？","s1_6":"C 介入成效：非同期導入之準實驗；後接 E 質性（案例 L）","s1_7":"兩機構同意導入與觀察；交班紀錄去識別後使用","s1_8":"12 個月：A 機構 2026 年 11 月、B 機構 2027 年 2 月導入","s1_9":"機構導入決策依據；填補長照場域「時間＋品質」量化證據","cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","m1_scene":"住宿式長照機構之交班高度依賴自由文字紀錄。護理人員與資深照服員每一班交班前，須翻閱前一班的照護紀錄、給藥紀錄與異常事件，自行彙整成交班重點，這段彙整時間排擠了直接照護住民的時間。","m1_gap":"現行做法以人工閱讀紀錄加上口頭交接為主，資訊散落於多份紀錄，彙整品質高度依賴個人經驗：資深人員能抓出重點，新進人員則容易遺漏或花更多時間。機構目前沒有可量化的指標，說明交班花了多少時間、交出去的內容是否完整。","m1_new":"生成式 AI 已能從臨床文本自動產生摘要。Van Veen 等人（2024）的研究顯示，經調整之大型語言模型所產生的臨床文本摘要，經臨床讀者評估多數不劣於醫療專家所寫；但這類研究多在模擬閱讀情境下評估品質，長照場域仍缺乏在真實交班流程中同時測量「時間」與「品質」的量化證據。","m1_time":"兩家合作機構已決定於 2026 年 11 月與 2027 年 2 月先後導入院內部署之 AI 照護紀錄摘要工具，導入時程的自然落差提供了非同期比較的時機；若錯過導入前測，就無法再取得導入前的基準資料。研究結果可作為機構是否全面導入、以及導入時需要哪些配套之依據。","m1_stmt":"因此，本研究擬探討長照機構導入 AI 照護紀錄摘要工具後，交班準備時間是否縮短、紀錄完整性是否不變差，以及照護人員的負荷與信任如何改變。","m2_pico":"P：住宿式長照機構負責交班之護理師與資深照服員｜I：院內部署之生成式 AI 照護紀錄摘要工具｜C：導入前（同一人）及同期尚未導入之機構｜O：交班準備時間（主要）、紀錄完整性、二次確認詢問次數、認知負荷、信任","m2_search":"PubMed：（\"Patient Handoff\"[Mesh] OR handoff*[tiab] OR handover*[tiab] OR \"shift report\"[tiab]）AND（\"Natural Language Processing\"[Mesh] OR \"large language model*\"[tiab] OR \"generative artificial intelligence\"[tiab] OR summariz*[tiab]）AND（\"Long-Term Care\"[Mesh] OR \"Nursing Homes\"[Mesh] OR \"long-term care\"[tiab] OR \"nursing home*\"[tiab]）\n華藝線上圖書館：（交班 OR 交接班）AND（人工智慧 OR 生成式 OR 摘要）AND（長照 OR 長期照護 OR 護理之家）\n限制：2015 年以後、中英文；檢索日期、各階段筆數與 PRISMA 流程見附錄一檢索日誌（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、交班與文書負擔。護理交班是維持照護連續性的關鍵環節。Riesenberg 等人（2010）系統性回顧護理交班文獻，指出交班方式多元，但以結果指標評估交班成效的研究仍有限。Moy 等人（2021）回顧醫師與護理人員電子病歷文書負擔的研究，發現文書時間的測量方式並不一致，多採自陳或系統日誌，直接觀察計時者較少。對本研究的意義：主要結果應以可重複的觀察計時取得，並同時測量交班內容的品質。\n二、生成式 AI 臨床摘要的證據。Van Veen 等人（2024）比較經調整之大型語言模型與醫療專家撰寫的臨床文本摘要，臨床讀者評估模型摘要多數情況下不劣於專家；然而，該研究評估的是摘要本身，並未在真實工作流程中測量導入後的時間與品質變化。對本研究的意義：需要在真實交班流程中評估，並把品質（完整性）當成與時間同等重要的結果，以非劣性界限檢驗「省時間之餘品質沒有變差」。\n三、場域與研究設計。本研究於 PubMed 與華藝之初步檢索（附錄一），未見在長照機構以同期對照同時測量交班時間與紀錄品質之研究（教學示意：請以自己的實際檢索結果改寫）。由於機構導入時程由管理階層決定，無法隨機分派，宜採非隨機介入設計並依 TREND（Des Jarlais et al., 2004）報告；品質之非劣性判定則參照 Piaggio 等人（2012）之建議，事先訂定界限。","m2_known":"既有研究已顯示生成式 AI 能產生品質接近醫療專家的臨床摘要（Van Veen et al., 2024），且護理文書負擔是普遍且受重視的問題（Moy et al., 2021）。","m2_unknown":"然而，長照場域導入 AI 摘要工具後，交班時間與紀錄品質是否「同時」改善，缺乏在真實流程中並測之量化證據；既有評估亦多缺少同期對照，難以排除同期政策與人力變動的影響。","m2_worth":"此缺口使機構在決定是否全面導入時，只能依賴廠商說法或個人印象；本研究將以非同期導入之準實驗設計，同時回答「省了多少時間」與「品質有沒有變差」。","m2_theory":"以社會技術模型（Sittig & Singh, 2010）為架構：AI 工具（硬體與軟體、臨床內容）、人員（職類、年資、負荷）與工作流程（交班方式）相互作用，共同決定導入成效；因此除了時間，也測量品質、負荷與信任。","m2_orig":"本計畫為國內首批在長照機構真實交班流程中，以第三方觀察計時與雙人評分同時測量交班時間與紀錄品質之研究，並以非劣性界限檢驗品質、以同期未導入機構作對照，可分離導入效果與同期變動。","m3_rq":"長照機構導入 AI 照護紀錄摘要工具後，交班準備時間是否縮短、紀錄完整性是否不變差？","m3_terms":"交班準備時間：自護理人員開始彙整前一班紀錄起，至完成交班止之分鐘數，以第三方觀察計時取得。\n紀錄完整性：交班內容涵蓋應交代項目之程度，以 0–20 分評分表由兩位評分者獨立評分。\nAI 照護紀錄摘要工具：院內部署之生成式 AI 工具，自班別紀錄自動產生交班摘要，使用者逐項核對修改後送出。","m3_scope":"研究範圍為北部兩家住宿式長照機構負責交班之護理師與資深照服員，共 62 人，執行期間 12 個月（2026 年 9 月至 2027 年 8 月）。本研究不包含工具之開發與調校，亦不進行成本效益分析，因工具由機構採購且成本資料不在研究者掌握。","m4_frame":"依社會技術模型建立研究架構：自變項為導入狀態（前測／後測）與機構（A 先導入、B 延後導入）；主要依變項為交班準備時間，次要依變項為紀錄完整性與二次確認詢問次數；探索變項為認知負荷與對 AI 摘要之信任；控制變項為當班照顧住民數、職類與年資。未納入機構管理風格，因本研究僅兩家機構，無法估計其效果，於限制中說明。（架構圖見圖 2-1）","m5_design":"本研究採非同期導入之準實驗設計（C 型：介入成效研究）。A 機構於 2026 年 11 月導入 AI 照護紀錄摘要工具，B 機構延後至 2027 年 2 月導入；B 機構延後期間作為 A 機構之同期對照，形成含對照組之前後測結構，可用差異中之差異（DiD）分離導入效果與同期變動。","m5_reject":"不採隨機對照試驗，因導入時程由機構管理階層決定，研究者無分派權；不採單組前後測，因無法排除同期政策與人力變動之影響；不採橫斷面設計，因無法回答導入是否帶來改變。","m5_site":"研究場域為北部兩家住宿式長照機構：A 機構 120 床、護理人員 34 人；B 機構 96 床、護理人員 28 人，兩機構均已同意導入時程與現場觀察（附錄二）。研究對象為兩機構負責交班之護理師與資深照服員，合計 62 人，全體普查、不抽樣。","m5_incl":"納入條件：研究期間在職，且已能獨立負責交班之護理師或資深照服員。排除條件：研究期間預計離職或請長假（連續一個月以上）者。","m5_sample":"主要結果（交班準備時間）以配對 t 檢定估算：效果量 dz = 0.5（無前導資料，採保守中效果）、α = .05 雙尾、檢定力 .80，需至少 34 人（以 G*Power 3.1 核對；Faul et al., 2007）；A 機構 34 人全數納入。次要結果（紀錄完整性）之非劣性檢驗：假設真實差異為 0、差異分數標準差 2.0 分（教學示意，前測後以實際值重算）、非劣性界限 −1.0 分、單尾 α = .025、檢定力 .80，需約 32 人，A 機構人數亦足夠。B 機構 28 人全數納入作為同期對照，不另做檢定力計算，DiD 估計值以 95% CI 呈現。質性階段以資料飽和為判準，預估約 12 人。","m5_tool":"一、交班準備時間：由兩位受訓觀察者以碼錶計時，正式收案前以 30 次交班進行校準並計算觀察者間信度。\n二、紀錄完整性：0–20 分評分表，由兩位不知紀錄時期之評分者獨立評分，正式評分前以 20 份紀錄計算評分者間信度。\n三、二次確認詢問次數：觀察者記錄交班後接班者回頭詢問或查閱原紀錄之次數。\n四、認知負荷量表：自編 8 題，經 5 位專家（護理資訊 2、長照實務 2、健康資訊學者 1）內容效度審查，預試 30 人，其中 15 人於兩週後重測（程序見 2.2A）。\n五、AI 摘要信任量表：4 題。","m5_flow":"一、第 1–2 月：IRB 送審；核准後於兩機構舉辦說明會、簽署同意書、觀察者校準與量表預試。\n二、第 2–3 月：兩機構同步前測，每人觀察 12 次交班；問卷第一波。\n三、第 3 月起：A 機構導入（2026 年 11 月），持續觀察計時，系統使用日誌每月匯出。\n四、第 6 月起：B 機構導入（2027 年 2 月），導入前作為同期對照。\n五、第 9–11 月：依量化結果挑選「時間縮短最多」與「二次確認增加最多」兩端人員進行半結構訪談（案例 L）。\n六、資料於機構內以研究編號取代姓名後才帶離機構；觀察、問卷與系統日誌以研究編號串接。","m5_innov":"利用兩機構導入時程之自然落差，以非同期導入準實驗取得同期對照，使無法隨機的實務場域仍可分離導入效果與同期變動；並以第三方觀察計時與雙人評分取代自陳，提高結果的可信度。","m6_common":"顯著水準 α = .05 雙尾；連續變項先檢查常態性，不符時改用 Wilcoxon 符號等級檢定。交班事件巢套於人員（每人重複測 12 次），主分析以人員平均值進行，另以混合效果模型（人員為隨機截距、時期 × 機構為固定效果）做敏感度分析並估計 DiD。僅兩家機構，機構層級之變異無法以隨機效果估計，機構差異以固定效果處理並於限制說明。缺值比例低於 5% 以完整個案分析，高於 5% 以多重插補並比較結果。量表 Cronbach's α 於正式施測後重新計算。分析以 Python（pandas、statsmodels，版本於論文中寫明）執行，分析腳本存檔以利重現。","m6_qual":"案例 L（後接質性階段）：訪談全程錄音並轉為逐字稿，依 Braun 與 Clarke（2006）主題分析六步驟分析；前 4 份逐字稿由兩位研究者獨立編碼，歧異以協商共識處理，並保留編碼簿修訂紀錄。","m7_irb":"本研究將送〔大學或合作機構〕人體研究倫理審查委員會審查，於第 1 月送審，核准後才開始說明會與前測。","m7_consent":"護理人員與照服員於說明後簽署書面同意。交班紀錄內容涉及住民個資，但研究對象為工作人員、紀錄於機構內去識別化後才使用，將依 7.1 評估是否符合主管機關公告得免取得同意之範圍，並向 IRB 申請免除住民同意。","m7_risk":"本研究屬最小風險，觀察與問卷不涉及侵入性程序。參與者可隨時退出，參與與否不影響其考核或工作權益；招募與說明由研究團隊進行，不由直屬主管邀請。","m7_deid":"交班紀錄於機構內以研究編號取代住民與人員姓名後才帶離機構；研究編號對照表由研究主持人保管，與研究資料分開存放於加密裝置，僅研究團隊可存取。去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；訪談錄音於逐字稿核對完成後刪除。","m7_coi":"研究者與 AI 摘要工具廠商無財務關係；工具由機構採購，研究團隊不參與開發與調校。生成式 AI 僅用於檢索式發想與文字潤飾，不輸入任何可識別資料。","m8_feas":"資料：系統使用日誌與交班紀錄由機構提供，已取得兩機構書面同意（附錄二）。場域：兩機構管理階層已同意導入時程與現場觀察。樣本：A 機構 34 人全數納入即達事前估算之 34 人。時間：IRB 於第 1 月送審，並保留兩個月緩衝。","m9_acad":"補足長照場域導入生成式 AI 摘要工具後，交班「時間＋品質」並測、且有同期對照之量化證據。","m9_prac":"研究結果可供機構主管決定是否全面導入，並提出導入時的教育訓練重點與摘要核對流程建議。","m9_limd":"本研究採非隨機之準實驗設計，雖以同期對照與 DiD 降低偏誤，仍無法完全排除兩機構間未測量之差異；僅兩家機構，DiD 之平行趨勢假設只能以前測期資料初步檢視，機構層級變異無法估計；僅含北部兩家住宿式機構，推論至其他類型或地區之機構時需保守。","m9_lime":"人員知道被計時可能暫時改變行為（觀察者效應），將以前測適應期降低；研究期間工具版本可能更新，將記錄版本變更時點並於分析時納入考量。","m9_train":"參與之碩士生將習得觀察計時與評分者校準、準實驗設計之 DiD 與混合效果模型分析，以及半結構訪談與主題分析（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇，並產出長照機構導入 AI 摘要工具之流程建議一份（教學示意）。","m9_nation":"回應長照人力短缺與數位轉型之政策需求，提供機構導入生成式 AI 時評估成效與品質之可行方法。","t_iv":"AI 照護紀錄摘要工具","t_pop":"長照機構","t_out":"交班效率與紀錄品質","t_des":"非同期導入之準實驗研究","m10_title":"AI 照護紀錄摘要工具對長照機構交班效率與紀錄品質之影響：非同期導入之準實驗研究","m10_title_en":"Effects of an AI-Generated Care Record Summary Tool on Handover Efficiency and Documentation Quality in Long-Term Care Facilities: A Quasi-Experimental Study with Staggered Implementation","m10_kw":"長期照護、交班、生成式人工智慧、護理紀錄、準實驗設計","m10_abs":"住宿式長照機構之交班高度依賴自由文字紀錄，文書負擔排擠直接照護時間，然長照場域缺乏在真實交班流程中同時測量「時間」與「品質」之量化證據。本研究旨在比較 AI 照護紀錄摘要工具導入前後之交班準備時間，檢驗紀錄完整性是否非劣於導入前，並探討照護人員之認知負荷與信任。本研究將採非同期導入之準實驗設計，於北部 2 家住宿式長照機構觀察 62 位負責交班之護理師與資深照服員，以第三方觀察計時與 0–20 分完整性評分表測量，並以配對 t 檢定、差異中之差異與非劣性界限檢驗假設；後接質性訪談以解釋量化結果。預期交班準備時間縮短且紀錄完整性非劣，可作為機構是否全面導入之依據。","m10_refs":"Braun, V., & Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77–101.\nDes Jarlais, D. C., Lyles, C., Crepaz, N., & the TREND Group. (2004). Improving the reporting quality of nonrandomized evaluations of behavioral and public health interventions: The TREND statement. American Journal of Public Health, 94(3), 361–366.\nFaul, F., Erdfelder, E., Lang, A.-G., & Buchner, A. (2007). G*Power 3: A flexible statistical power analysis program for the social, behavioral, and biomedical sciences. Behavior Research Methods, 39(2), 175–191.\nMoy, A. J., et al. (2021). Measurement of clinical documentation burden among physicians and nurses using electronic health records: A scoping review. Journal of the American Medical Informatics Association, 28(5), 998–1008.\nPiaggio, G., et al. (2012). Reporting of noninferiority and equivalence randomized trials: Extension of the CONSORT 2010 statement. JAMA, 308(24), 2594–2604.\nRiesenberg, L. A., Leitzsch, J., & Cunningham, J. M. (2010). Nursing handoffs: A systematic review of the literature. American Journal of Nursing, 110(4), 24–34.\nSittig, D. F., & Singh, H. (2010). A new sociotechnical model for studying health information technology in complex adaptive healthcare systems. Quality & Safety in Health Care, 19(Suppl 3), i68–i74.\nVan Veen, D., et al. (2024). Adapted large language models can outperform medical experts in clinical text summarization. Nature Medicine, 30(4), 1134–1142.","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責資料蒐集、分析與論文撰寫）；觀察者 2 名、評分者 2 名〔姓名〕，均完成研究倫理訓練","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_inst":"〔大學名稱〕〔系所〕；研究場域：北部兩家住宿式長照機構（以 A、B 代稱）","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌；AI 摘要工具由機構自行採購，與本研究經費無關。","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：研究對象為成年工作人員，以觀察計時、問卷與訪談蒐集資料，屬最小風險；交班紀錄於機構內去識別化後使用，並申請免除住民同意。是否符合簡易審查範圍，以送審機構之判定為準。","irb_n":"兩機構負責交班之護理師與資深照服員共 62 人（A 機構 34 人、B 機構 28 人）；其中約 12 人受邀參加質性訪談。","irb_recruit":"由研究團隊於兩機構各舉辦一次說明會，說明後發放同意書，參與者可帶回考慮再交回；不由直屬主管邀請或收回同意書，拒絕參與不影響考核與工作安排。","irb_vuln":"否。參與者為成年工作人員；因與機構有僱傭關係，招募與同意由非主管之研究人員進行，以避免不當壓力。","irb_task":"同意研究期間由觀察者在交班時計時並記錄（每人前後測各 12 次）；填寫一份問卷（認知負荷 8 題、信任 4 題及基本資料）；部分人員受邀接受一次約 45–60 分鐘、全程錄音的訪談，訪談另行說明並可拒絕。","irb_withdraw":"可隨時以口頭或書面告知研究聯絡人撤回同意，無須說明理由，撤回不影響任何權益；撤回後不再蒐集新資料，已蒐集之資料依參與者意願刪除或僅保留去識別化資料。","irb_benefit":"參與者無直接利益，亦不提供金錢報酬；研究結果可作為改善交班流程之參考。","irb_harm":"本研究屬最小風險。若參與者在觀察或訪談中感到不適，可隨時暫停或退出；如對研究有疑問或爭議，可聯絡研究聯絡人或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為觀察紀錄、問卷、去識別化之交班紀錄與訪談錄音。去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；訪談錄音於逐字稿核對完成後刪除；資料不作本計畫以外之用途，如需另作他用將重新送審並取得同意。","irb_commercial":"本研究不涉及商業利益；研究者與 AI 摘要工具廠商無財務關係，研究結果不提供廠商作商業用途。","irb_waive":"部分：工作人員簽署書面同意書；交班紀錄涉及住民資料之部分，於機構內去識別化後使用，依《人體研究法》第 12 條第 2 項但書申請免除住民同意，以審查會認定為準。","irb_ad":"【研究參與邀請】本研究想了解長照機構導入 AI 交班摘要工具後，交班時間與紀錄品質的變化。若您是負責交班的護理師或資深照服員，誠摯邀請您參加說明會（時間地點〔　〕）。參與與否由您自行決定，不會影響您的考核與工作。聯絡人：〔研究生姓名〕〔電話／電子郵件〕。","m10_kw_en":"long-term care; nursing handover; generative artificial intelligence; documentation quality; quasi-experimental design","m10_abs_en":"Handovers in residential long-term care facilities rely heavily on free-text records, and the documentation burden takes time away from direct care, yet there is little quantitative evidence measuring both time and quality in real handover workflows. This study aims to compare handover preparation time before and after the introduction of an AI-generated care record summary tool, to test whether documentation completeness is non-inferior after implementation, and to explore care staff's cognitive load and trust. A quasi-experimental design with staggered implementation will be used in two facilities in northern Taiwan: facility A will implement the tool in November 2026 and facility B in February 2027, with facility B serving as a concurrent control during the delay. All 62 nurses and senior care assistants responsible for handovers will be included. Handover preparation time will be measured by trained third-party observers, and completeness will be rated on a 0–20 scale by two raters blinded to the study period. Data will be analyzed using paired t tests, difference-in-differences with mixed-effects models, and a non-inferiority margin of −1.0 point, followed by qualitative interviews to explain the quantitative results. Shorter preparation time with non-inferior completeness is expected, informing decisions on facility-wide adoption."},"objs":[{"verb":"比較","text":"比較導入前後交班準備時間之變化，並與同期未導入之機構比較","hyp":"H1a：A 機構導入後交班準備時間較導入前縮短（H0：前後無差異）。\nH1b：A 機構前後之降幅大於同期 B 機構之變化（DiD < 0；H0：DiD = 0）。","analysis":"A 機構前後：配對 t 檢定；A 對 B 同期：差異中之差異（DiD）","crit":"α = .05 雙尾；報告效果量 dz 與 95% CI","sens":"混合效果模型（交班事件巢套於人員）；常態不符時改用 Wilcoxon 符號等級檢定","exp":"依社會技術模型，摘要工具減少了翻閱與彙整紀錄的步驟，預期導入後交班準備時間縮短，且降幅大於同期之 B 機構；若未縮短，將以系統使用日誌與質性訪談找出原因，例如人員仍回頭核對原紀錄。"},{"verb":"檢驗","text":"檢驗導入後紀錄完整性是否非劣於導入前","hyp":"H2：完整性差異（後測減前測）之 95% CI 下界高於 −1.0 分（非劣性界限）；H0：差異 ≤ −1.0 分（劣於導入前）。","analysis":"計算完整性差異之 95% CI，與事先訂定之非劣性界限 −1.0 分比較","crit":"CI 下界高於 −1.0 分即判定非劣（Piaggio et al., 2012）","sens":"以評分者平均分與單一評分者分數分別分析，比較結論是否一致","exp":"預期紀錄完整性非劣於導入前；若無法判定非劣，表示摘要可能遺漏應交代項目，需檢視遺漏類型並提出核對建議。"},{"verb":"探討","text":"探討照護人員之認知負荷與對 AI 摘要之信任","hyp":"","analysis":"描述統計，並以相關與多元迴歸探索負荷、信任與交班準備時間之關係（明白標示為探索性）","crit":"探索性分析，不做確認性推論","sens":"","exp":"預期導入後認知負荷下降，但若人員不信任摘要而增加二次確認，負荷可能未如預期下降；此一可能性將由後接之質性訪談（案例 L）解釋。"}],"vars":[{"name":"導入狀態 × 機構","role":"自變項","concept":"是否已導入 AI 摘要工具，及所屬機構之導入時程","oper":"前測／後測；A 機構先導入（2026 年 11 月）、B 機構延後導入（2027 年 2 月）","tool":"機構導入紀錄","scale":"名目","time":"—","rel":"—"},{"name":"交班準備時間","role":"依變項","concept":"交班者為交班所花之彙整與交接時間","oper":"自開始彙整至完成交班之分鐘數","tool":"第三方觀察計時","scale":"比率","time":"前測、後測各 12 次／人","rel":"兩位觀察者先以 30 次交班校準並計算觀察者間信度"},{"name":"紀錄完整性","role":"依變項","concept":"交班內容涵蓋應交代項目之程度","oper":"0–20 分評分表，兩位評分者獨立評分取平均","tool":"交班摘要稽核","scale":"等距","time":"前測、後測","rel":"評分者不知紀錄時期；以 20 份紀錄計算評分者間信度"},{"name":"二次確認詢問次數","role":"依變項","concept":"接班者因資訊不足而回頭確認之頻率","oper":"每次交班後回頭詢問或查閱原紀錄之次數","tool":"第三方觀察","scale":"比率","time":"前測、後測","rel":"觀察者訓練"},{"name":"認知負荷","role":"探索","concept":"交班工作對心智資源之需求","oper":"自編 8 題量表，Likert 5 點，加總分愈高負荷愈大","tool":"問卷","scale":"等距","time":"後測","rel":"5 位專家內容效度、預試 30 人、15 人兩週後重測"},{"name":"對 AI 摘要之信任","role":"探索","concept":"使用者相信摘要正確、可依賴之程度","oper":"4 題量表，Likert 5 點，加總分愈高愈信任","tool":"問卷","scale":"等距","time":"後測","rel":"正式施測後計算 Cronbach's α"},{"name":"照顧住民數、職類、年資","role":"控制","concept":"影響交班工作量與經驗之個人與班別因素","oper":"當班照顧住民數；護理師／資深照服員；服務年資（年）","tool":"排班與人事資料","scale":"比率／名目","time":"前測","rel":"—"}],"bias":[{"name":"觀察者效應（霍桑效應）","why":"人員知道被計時，可能暫時加快或改變交班方式","fix":"正式前測前安排適應期；觀察者固定、不介入交班"},{"name":"同期事件（歷史效應）","why":"研究期間的政策、人力或住民組成變動，可能與導入同時影響結果","fix":"以延後導入之 B 機構作同期對照，並以 DiD 分析；記錄研究期間重大事件"},{"name":"評分者偏差","why":"評分者知道紀錄屬導入前或導入後，可能影響給分","fix":"評分者不知紀錄時期；兩人獨立評分並計算評分者間信度"},{"name":"流失偏差","why":"研究期間有人離職或不再使用工具，留下者可能較適應工具","fix":"以系統日誌追蹤使用與流失；比較留下者與流失者之基本特性"}],"gantt":{"n":15,"rows":[{"t":"IRB 送審與核准","s":1,"e":2},{"t":"說明會、同意書、觀察者校準與預試","s":2,"e":2},{"t":"前測（兩機構）","s":2,"e":3},{"t":"A 機構導入與後測","s":3,"e":12},{"t":"B 機構導入與後測","s":6,"e":12},{"t":"質性訪談（案例 L）","s":9,"e":11},{"t":"資料分析","s":11,"e":12},{"t":"緩衝（IRB 補件、收案延長、論文修訂）","s":13,"e":14},{"t":"論文撰寫與口試","s":13,"e":15}]},"risks":[{"r":"IRB 補件延誤","trig":"第 2 月仍未核准","when":"M2","plan":"第 1 月即送審；前測可順延至第 3 月上旬，仍須在 A 機構導入前完成"},{"r":"B 機構導入再延後","trig":"機構公告延後導入","when":"M5","plan":"延長同期對照期，並以中斷時間序列補充分析（8.3）"},{"r":"問卷回收不足","trig":"第一波回收率偏低","when":"M4","plan":"兩次提醒，並請單位安排填答時間（不由主管收回）"},{"r":"觀察人力不足","trig":"觀察者離職或排班衝突","when":"每月","plan":"事先培訓 1 名備援觀察者並完成校準"}],"kpi":[{"name":"交班準備時間（成果指標）","calc":"每次交班自開始彙整至完成交班之分鐘數，取每人 12 次之平均；第三方觀察計時，前後測各一次","base":"導入前測平均（第 3 月前測收齊時取得）","goal":"較導入前縮短，且紀錄完整性非劣；具體目標值於前測後依基準值訂定"},{"name":"完成前後測觀察人數（產出指標）","calc":"完成前測與後測觀察之人數；每月統計","base":"0","goal":"第 12 月前完成 62 人"}],"ss":{"kind":"paired","eff":0.5,"alpha":0.05,"tails":2,"power":0.8,"drop":0,"moe":0.05,"basis":"無前導資料，採保守中效果"}}},"ED":{"label":"E→D 先訪談再發展量表：家屬對遠距照護科技之顧慮","grp":1,"data":{"meta":{"type":"D","type2":"E 質性研究"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"居家長者使用遠距照護科技（居家感測、視訊關懷、生理量測上傳）時，常由家屬決定是否採用；家屬的顧慮（隱私、可靠度、費用、照顧責任）沒有工具可以測量，推動單位只能憑印象說明。","s1_2":"北部 6 家居家服務單位與 2 家日間照顧中心服務之 65 歲以上長者的主要家庭照顧者；第一階段訪談約 15 人，第二階段問卷約 420 人。","s1_3":"第一階段：家屬對遠距照護科技之顧慮經驗；第二階段：依第一階段主題發展之顧慮量表。","s1_4":"第一階段：顧慮主題；第二階段：量表之內容效度、構念效度（EFA、CFA）、內部一致性、再測信度與已知群體效度。","s1_5":"家屬對居家遠距照護科技有哪些顧慮？能否據此發展具信效度之顧慮量表？","s1_6":"E→D 探索性序列混合方法：先質性訪談界定顧慮內涵，再發展量表並以問卷驗證信效度。","s1_7":"合作單位同意協助轉介；訪談書面同意；問卷匿名，申請以說明單取代書面同意。","s1_8":"12 個月：IRB 2 個月、訪談與分析 3 個月、題項發展與專家效度 2 個月、正式施測 2 個月、分析撰寫，保留兩個月緩衝。","s1_9":"提供一份具信效度之家屬顧慮量表，供長照單位在推動遠距照護前評估與溝通。","m1_scene":"臺灣已於 2025 年進入超高齡社會（國家發展委員會，2024），居家長者人數持續增加，長照單位與廠商積極推動居家感測、跌倒偵測、視訊關懷與生理量測上傳等遠距照護科技，期望減輕照顧者負擔、及早發現異常。然而，是否在家中裝設這些設備，往往不是長者單獨決定，而是由主要照顧者（多為配偶或子女）拍板；實務上常見家屬一聽到「鏡頭」「感測器」就婉拒，或裝了之後很快要求撤除。","m1_gap":"推動單位多以說明會介紹設備功能，卻不知道家屬真正擔心的是什麼：是隱私被看見、設備誤報造成恐慌、費用與後續維修，還是擔心「裝了設備，別人就以為不需要人照顧」。現行沒有工具可以系統性地測量這些顧慮，無法比較不同家庭的顧慮程度，也無法評估說明或試用是否真的降低了顧慮。","m1_new":"Peek 等人（2014）系統性回顧在地老化科技之接受因素，指出使用前之顧慮（如隱私、費用、對科技的不信任、擔心取代人際互動）是重要影響因素；科技接受相關量表多聚焦有用性與易用性，並未涵蓋家庭照顧者的角色與顧慮。當構念內涵尚未被描述、現有量表又不適用時，探索性序列混合方法先以質性研究界定構念，再據以發展與驗證量表，是常用的作法（Creswell & Plano Clark, 2018；Boateng et al., 2018）。","m1_time":"合作的居家服務單位將於 2027 年參與地方政府遠距照護試辦計畫，需要在推動前了解家屬顧慮，並在推動後評估溝通策略是否有效；本研究可在試辦前完成量表，作為前測工具。","m1_stmt":"因此，本研究擬先以質性訪談探索家庭照顧者對居家遠距照護科技之顧慮，再據以發展顧慮量表，並驗證其信效度。","m2_pico":"第一階段 PICo｜P：65 歲以上居家長者之主要家庭照顧者｜I：對居家遠距照護科技之顧慮經驗｜Co：居家照顧情境。第二階段｜P：同上｜I（工具）：自編家屬顧慮量表｜O：內容效度（CVI）、構念效度（EFA、CFA）、信度（α、ω、ICC）、已知群體效度","m2_search":"PubMed：（\"Caregivers\"[Mesh] OR caregiver*[tiab] OR \"family member*\"[tiab]）AND（\"Telemedicine\"[Mesh] OR telecare[tiab] OR \"remote monitoring\"[tiab] OR \"smart home\"[tiab] OR \"assistive technolog*\"[tiab]）AND（concern*[tiab] OR acceptance[tiab] OR attitude*[tiab] OR privacy[tiab]）AND（\"Aged\"[Mesh] OR older[tiab]）\n華藝：（家屬 OR 照顧者）AND（遠距照護 OR 智慧居家 OR 科技輔具）AND（顧慮 OR 接受 OR 態度）\n限制：2010 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、在地老化科技之接受因素。Peek 等人（2014）回顧在地老化科技接受相關研究，將影響因素分為使用前與使用後兩階段，使用前之顧慮包括隱私、費用、對科技能力的疑慮與擔心取代人際照顧；家屬與照顧者的意見常是是否採用的關鍵。對本研究的意義：顧慮是多面向的構念，且家屬的角色需要被獨立描述。\n二、既有測量工具之限制。科技接受模式以有用性與易用性為核心（Davis, 1989），多數量表是從使用者本人角度測量「接受」，不涵蓋照顧者對隱私、責任與照顧關係之擔憂。對本研究的意義：現有量表無法直接借用，需要先界定構念再發展題項。\n三、量表發展方法。Boateng 等人（2018）整理量表發展三階段九步驟：題項發展（構念界定、題項產生、內容效度）、量表建構（預試、題數精簡、因素結構）與量表評估（信度與效度）；COSMIN 對測量特性之定義可作為驗證項目的依據（Mokkink et al., 2010）。本研究初步檢索（附錄一）未見針對臺灣家庭照顧者遠距照護科技顧慮之量表（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已指出隱私、費用、可靠度與照顧關係等顧慮會影響在地老化科技之採用（Peek et al., 2014），並已有成熟的量表發展與測量特性評估準則（Boateng et al., 2018；Mokkink et al., 2010）。","m2_unknown":"然而，從家庭照顧者角度出發、以本土質性資料界定顧慮內涵，並經內容效度、因素結構與信度驗證之量表仍缺乏；既有接受度量表多以使用者本人為對象，無法反映家屬作為決策者的顧慮。","m2_worth":"此缺口使長照單位推動遠距照護時無法評估家屬顧慮、也無法檢驗溝通或試用策略是否有效；本研究以探索性序列設計，產出內容來自本土經驗且具信效度之量表。","m2_theory":"以探索性序列混合方法設計（Creswell & Plano Clark, 2018）為架構：第一階段以質性訪談界定「家屬顧慮」之構念與面向，第二階段依 Boateng 等人（2018）量表發展步驟產生題項並驗證；測量特性依 COSMIN 分類（Mokkink et al., 2010）。初步以 Peek 等人（2014）之使用前顧慮作為敏感概念，但不預設面向數。","m2_orig":"本計畫以家庭照顧者為對象，從本土質性經驗發展遠距照護科技顧慮量表，並以分半樣本進行 EFA 與 CFA、再測信度與已知群體效度，產出可用於推動前評估與成效追蹤之工具。","m3_rq":"家屬對居家遠距照護科技有哪些顧慮？據此發展之顧慮量表信效度如何？","m3_terms":"居家遠距照護科技：裝設於長者住家、以感測、影像或連網量測協助照顧者遠端掌握長者狀況之設備，如活動感測器、跌倒偵測、視訊關懷、生理量測自動上傳。\n家屬顧慮：主要家庭照顧者對採用上述科技可能帶來之負面後果的擔憂，本研究以自編顧慮量表測量，分數愈高顧慮愈多。\n主要家庭照顧者：自述為長者主要照顧責任承擔者之家人。\n已知群體效度：量表能區分理論上應有差異之群體（如已使用與未使用遠距科技者）之程度。","m3_scope":"研究範圍為北部 6 家居家服務單位與 2 家日間照顧中心服務之長者的主要家庭照顧者，研究期間 12 個月。本研究界定顧慮內涵並發展與驗證量表，不評估遠距照護科技之成效，不調查長者本人之觀點，量表亦尚未進行跨地區或跨文化驗證。","m4_frame":"第一階段（E）：以半結構訪談探索家屬顧慮，歸納主題與子主題，作為量表構面與題項來源。第二階段（D）：顧慮量表為主要測量對象；構念效度以 EFA（樣本一）與 CFA（樣本二）檢驗；效標關聯效度以「使用意圖」檢驗（預期負相關）；已知群體效度以「是否已使用遠距科技」檢驗（預期已使用者顧慮較低）；控制變項為照顧者年齡、性別、與長者關係與教育程度。（研究流程見圖 3-1）","m5_design":"本研究採探索性序列混合方法設計（E→D）：第一階段為質性描述性研究，以半結構訪談界定家屬顧慮之內涵；第二階段為量表發展與橫斷式問卷調查，依 Boateng 等人（2018）步驟產生題項、檢驗內容效度、預試，並以正式樣本驗證因素結構與信效度。","m5_reject":"不直接改編既有科技接受量表，因其以使用者本人為對象、未涵蓋家屬的照顧責任與隱私顧慮，內容效度不足；不只做質性訪談，因無法提供可重複測量、可比較之工具；不以同一批樣本同時做 EFA 與 CFA，因會高估模型適配，故將正式樣本隨機分半。","m5_site":"研究場域為北部 6 家居家服務單位與 2 家日間照顧中心（合計服務長者約 1,200 人），各單位已書面同意協助轉介與發放邀請（附錄二）。第一階段：主要家庭照顧者約 15 人；第二階段：專家 6 位（長照實務 2、遠距照護 2、量表發展學者 2）、認知訪談 5 人、預試 30 人、正式樣本約 420 人，其中 50 人於兩週後重測。","m5_incl":"納入條件：20 歲以上、為 65 歲以上居家長者之主要家庭照顧者、能以中文閱讀或由研究人員協助填答。排除條件：受僱之外籍看護或居服員（非家屬）；長者已入住機構者。第一階段受訪者不參加第二階段正式施測（避免題項熟悉）。","m5_sample":"第一階段採立意抽樣並依最大變異原則（照顧者年齡、與長者關係、是否已使用遠距科技、是否同住），以資料飽和為判準：連續兩位受訪者未出現新主題即停止並續訪兩位確認，預估約 15 人（Hennink & Kaiser, 2022）。第二階段：預估經內容效度後保留約 30 題，EFA 依受試者與題數比至少 5:1 需 150 人，CFA 一般建議至少 200 人；正式樣本目標 400 份有效問卷，隨機分半各 200 人，考量 5% 無效問卷，預計發放 420 份；再測信度 50 人（Koo & Li, 2016）。","m5_tool":"一、訪談大綱：如「如果家裡要裝這類設備，您最先想到的擔心是什麼？」「什麼情況會讓您決定不裝或撤掉？」（附錄三）。\n二、題項發展：依第一階段主題與文獻產生題庫約 40 題，5 點量尺（1 非常不擔心～5 非常擔心），措辭避免雙重否定與一題兩問。\n三、內容效度：6 位專家評相關性 4 點量尺，計算 I-CVI 與 S-CVI/Ave，I-CVI ≥ .83（6 位中至少 5 位評 3 或 4 分）、S-CVI/Ave ≥ .90 為標準（Polit et al., 2007）。\n四、認知訪談：5 位照顧者以放聲思考與追問檢查題意理解（Willis, 2005）。\n五、效標與群體變項：使用意圖 3 題（改編自 Venkatesh et al., 2003）、是否已使用遠距照護科技、基本資料。","m5_flow":"一、第 1–2 月：IRB 送審（兩階段一併）；核准後由合作單位轉介有意願之家屬。\n二、第 2–4 月：第一階段訪談（每人 45–60 分鐘，地點由家屬選擇，錄音轉逐字稿），邊蒐集邊分析。\n三、第 4–5 月：主題分析完成後產生題庫，第 5–6 月專家內容效度兩輪、認知訪談 5 人。\n四、第 6 月：預試 30 人，進行項目分析（遺漏率、地板與天花板效應、校正後項目總分相關 ≥ .30）。\n五、第 7–8 月：正式施測，由單位社工或個管員轉交邀請信與問卷（紙本附回郵或 QR code 線上），兩週後邀請 50 位自願者重測；問卷以研究編號串接重測資料，不留姓名。","m5_innov":"以本土質性資料界定構念後再發展量表，使題項貼近家屬語言；以分半樣本分別做 EFA 與 CFA，並加做再測信度與已知群體效度，提供較完整之測量特性證據。","m6_common":"顯著水準 α = .05（雙尾）。項目分析：遺漏率、地板與天花板效應（> 15%）、校正後項目總分相關。EFA（樣本一）：KMO ≥ .70、Bartlett 檢定顯著；以平行分析決定因素數（Horn, 1965），主軸因素法、斜交轉軸（promax），負荷 ≥ .40 且無交叉負荷 ≥ .30 者保留。CFA（樣本二）：以 MLR 估計，適配標準 CFI ≥ .95、TLI ≥ .95、RMSEA ≤ .06、SRMR ≤ .08（Hu & Bentler, 1999），並報組合信度與 AVE。信度：Cronbach's α 與 McDonald's ω ≥ .70；再測以 ICC（2,1）≥ .75（Koo & Li, 2016）。已知群體效度以獨立 t 檢定（或 Mann–Whitney U）並報 Hedges' g；效標關聯效度以 Pearson 相關。缺值低於 5% 以完整個案分析。分析以 R（psych、lavaan，版本寫明）執行。","m6_qual":"第一階段依 Braun 與 Clarke（2006）主題分析六步驟；前 3 份逐字稿由兩位研究者獨立編碼建立編碼簿，其餘由主要研究者編碼、第二位研究者抽檢；主題命名保留家屬原話，作為題項措辭來源，並建立「主題 → 題項」對照表。","m7_irb":"本研究將送〔大學〕人體研究倫理審查委員會審查，屬成年家屬之訪談與匿名問卷、最小風險，預計申請簡易審查，兩階段一併送審；第二階段題項於第一階段完成後確定，屆時以變更案提出。","m7_consent":"第一階段訪談簽署書面同意書（含錄音同意）。第二階段問卷附研究說明單，填答即視為同意（申請免除書面同意），重測自願者另簽署同意以研究編號串接兩次問卷。邀請由單位社工轉交，但是否參與與填答內容不讓單位知悉。","m7_risk":"屬最小風險；談及照顧壓力與家庭決策可能引發情緒，訪談可隨時暫停或退出，並提供合作單位之家庭照顧者支持資源。參與與否不影響長者接受之長照服務，邀請時以書面明確說明。","m7_deid":"逐字稿以代號取代姓名、長者資訊與單位名稱；錄音於逐字稿核對後刪除。問卷不留姓名，重測者以研究編號串接，對照表由研究生加密保管並於重測完成後刪除。資料保存至研究結束後 3 年，期滿以不可回復方式刪除。","m7_coi":"研究者與任何遠距照護科技廠商無財務關係；訪談與問卷不提及特定品牌。生成式 AI 僅用於英文潤稿，不輸入訪談或問卷資料。","m8_feas":"場域：8 家合作單位已書面同意（附錄二），服務長者約 1,200 人，預估主要照顧者可接觸約 900 人，以 50% 回收率可達 420 份。人力：研究者具居家護理經驗，已完成質性研究與心理計量課程；指導教授具量表發展發表經驗。專家：6 位專家已口頭同意。時間：訪談 3 個月、量表發展 2 個月、施測 2 個月，保留兩個月緩衝。","m9_acad":"以本土質性資料界定「家屬對遠距照護科技之顧慮」之構念面向，並提供具內容效度、因素結構、信度與已知群體效度證據之量表，補足既有科技接受量表未涵蓋家屬角色之缺口。","m9_prac":"量表可供長照單位在推動遠距照護前評估家屬顧慮、依面向設計說明與試用策略，並於推動後再測以評估溝通成效；亦可供廠商了解產品設計應優先處理之顧慮。","m9_limd":"第二階段為便利樣本，僅含北部 8 家單位之家屬，量表常模與因素結構推論至其他地區或族群需再驗證；橫斷式設計無法評估量表對改變之反應性。","m9_lime":"已使用與未使用遠距科技者人數可能懸殊，影響已知群體比較之檢定力；家屬可能因社會期許低報顧慮，將以匿名填答並在說明單強調無對錯答案。","m9_train":"參與之碩士生將習得質性訪談與主題分析、題項撰寫、內容效度、認知訪談、探索性與驗證性因素分析及混合方法整合（教學示意）。","m9_output":"預計投稿期刊論文 2 篇（質性結果、量表發展與驗證）、研討會論文 1 篇，並公開量表與計分手冊（教學示意）。","m9_nation":"回應高齡社會推動在地老化與長照數位化之政策需求，提供評估家屬顧慮之工具，協助遠距照護科技更順利地被家庭接受。","t_iv":"居家遠距照護科技","t_pop":"家庭照顧者","t_out":"顧慮量表之發展與驗證","t_des":"探索性序列混合方法研究","m10_title":"家庭照顧者對居家遠距照護科技之顧慮：量表發展與驗證之探索性序列混合方法研究","m10_title_en":"Family Caregivers' Concerns about Home Telecare Technologies: An Exploratory Sequential Mixed Methods Study of Scale Development and Validation","m10_kw":"家庭照顧者、遠距照護、量表發展、心理計量、混合方法","m10_abs":"居家遠距照護科技常由家庭照顧者決定是否採用，但家屬的顧慮缺乏可測量之工具。本研究旨在探索家庭照顧者對居家遠距照護科技之顧慮，並據以發展與驗證顧慮量表。本研究採探索性序列混合方法設計：第一階段以立意與最大變異抽樣訪談約 15 位主要家庭照顧者，以主題分析界定顧慮面向；第二階段依主題產生題項，經 6 位專家內容效度、5 位照顧者認知訪談與 30 人預試後，於北部 8 家長照單位施測約 420 位照顧者，以隨機分半樣本進行探索性與驗證性因素分析，並檢驗內部一致性、兩週再測信度、效標關聯效度與已知群體效度。預期產出具信效度之家屬顧慮量表，供長照單位推動遠距照護前評估與溝通。","m10_kw_en":"family caregivers; telecare; scale development; psychometrics; mixed methods","m10_abs_en":"Family caregivers often decide whether home telecare technologies are adopted for older adults, but no instrument measures their concerns. This study aims to explore family caregivers' concerns about home telecare technologies and to develop and validate a concern scale. An exploratory sequential mixed methods design will be used. In phase one, approximately 15 primary family caregivers will be recruited through purposive sampling with maximum variation and interviewed, and thematic analysis will be used to define the dimensions of concern. In phase two, items will be generated from the themes and refined through content validity assessment by six experts, cognitive interviews with five caregivers, and a pilot test with 30 caregivers. The scale will then be administered to approximately 420 caregivers recruited from eight long-term care agencies in northern Taiwan. The sample will be randomly split for exploratory and confirmatory factor analyses, and internal consistency, two-week test–retest reliability, criterion validity with intention to use, and known-groups validity between users and non-users will be examined. The study is expected to produce a valid and reliable scale that long-term care agencies can use to assess and address caregivers' concerns before introducing telecare.","m10_refs":"國家發展委員會. (2024). 中華民國人口推估（2024 年至 2070 年）. 國家發展委員會.\nBoateng, G. O., Neilands, T. B., Frongillo, E. A., Melgar-Quiñonez, H. R., & Young, S. L. (2018). Best practices for developing and validating scales for health, social, and behavioral research: A primer. Frontiers in Public Health, 6, 149.\nBraun, V., & Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77–101.\nCreswell, J. W., & Plano Clark, V. L. (2018). Designing and conducting mixed methods research (3rd ed.). Sage.\nDavis, F. D. (1989). Perceived usefulness, perceived ease of use, and user acceptance of information technology. MIS Quarterly, 13(3), 319–340.\nHennink, M., & Kaiser, B. N. (2022). Sample sizes for saturation in qualitative research: A systematic review of empirical tests. Social Science & Medicine, 292, 114523.\nHorn, J. L. (1965). A rationale and test for the number of factors in factor analysis. Psychometrika, 30(2), 179–185.\nHu, L., & Bentler, P. M. (1999). Cutoff criteria for fit indexes in covariance structure analysis: Conventional criteria versus new alternatives. Structural Equation Modeling, 6(1), 1–55.\nKoo, T. K., & Li, M. Y. (2016). A guideline of selecting and reporting intraclass correlation coefficients for reliability research. Journal of Chiropractic Medicine, 15(2), 155–163.\nMokkink, L. B., Terwee, C. B., Patrick, D. L., Alonso, J., Stratford, P. W., Knol, D. L., et al. (2010). The COSMIN study reached international consensus on taxonomy, terminology, and definitions of measurement properties for health-related patient-reported outcomes. Journal of Clinical Epidemiology, 63(7), 737–745.\nPeek, S. T. M., Wouters, E. J. M., van Hoof, J., Luijkx, K. G., Boeije, H. R., & Vrijhoef, H. J. M. (2014). Factors influencing acceptance of technology for aging in place: A systematic review. International Journal of Medical Informatics, 83(4), 235–248.\nPolit, D. F., Beck, C. T., & Owen, S. V. (2007). Is the CVI an acceptable indicator of content validity? Appraisal and recommendations. Research in Nursing & Health, 30(4), 459–467.\nVenkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D. (2003). User acceptance of information technology: Toward a unified view. MIS Quarterly, 27(3), 425–478.\nWillis, G. B. (2005). Cognitive interviewing: A tool for improving questionnaire design. Sage.","irb_inst":"〔大學名稱〕〔系所〕；研究場域：北部 6 家居家服務單位與 2 家日間照顧中心","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：成年家庭照顧者之訪談與匿名問卷，內容為照顧經驗與看法，屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"第一階段：主要家庭照顧者約 15 人；第二階段：專家 6 人、認知訪談 5 人、預試 30 人、正式問卷約 420 人（其中 50 人重測）。","irb_recruit":"由合作單位社工或個管員轉交邀請信，有意願者自行聯絡研究者（訪談）或填寫問卷（紙本附回郵信封或線上）；單位人員不知悉誰參與、不經手填答內容。","irb_vuln":"否。參與者為成年家庭照顧者；因其家人正接受合作單位服務，邀請時以書面說明參與與否不影響服務，且單位不知悉誰參與。","irb_task":"第一階段（自願）：一次約 45–60 分鐘訪談，聊聊對家中裝設遠距照護設備的想法與擔心，地點由您選擇，全程錄音。第二階段：填一份約 15 分鐘的問卷；自願者兩週後再填一次相同問卷。","irb_withdraw":"訪談可隨時口頭或書面告知撤回，撤回後刪除錄音與逐字稿。問卷可隨時中止；匿名問卷送出後無法辨識個人，故無法撤回；重測者可於重測前告知撤回，刪除其研究編號資料。","irb_benefit":"無直接利益；受訪者致贈〔　〕元禮券，完成問卷者致贈〔　〕元禮券或小禮物。研究結果可協助長照單位改善遠距照護的說明方式。","irb_harm":"屬最小風險；若談到照顧壓力感到不適，可隨時暫停，研究者將提供家庭照顧者支持專線與單位社工聯絡方式。對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為訪談錄音與逐字稿、匿名問卷與重測問卷。錄音於核對後刪除；去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"部分：第一階段訪談與重測者簽署書面同意書；第二階段一次性匿名問卷申請免除書面同意，改以說明單並以填答視為同意。","irb_ad":"【家庭照顧者意見邀請】家裡長輩如果要裝感測器、視訊或量測上傳的設備，您會有哪些擔心？我們想聽聽您的想法，協助長照單位把說明做得更好。參與方式：訪談（約 1 小時）或問卷（約 15 分鐘），參與與否不影響長輩的任何服務。聯絡人：〔研究生姓名〕〔電話／電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責訪談、量表發展、問卷施測與資料分析）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，量表將公開供非營利使用，研究結果不作商業用途。"},"objs":[{"verb":"探討","text":"探討家庭照顧者對居家遠距照護科技之顧慮內涵","hyp":"","analysis":"主題分析（Braun & Clarke 六步驟），歸納顧慮主題與子主題，建立「主題 → 題項」對照表","crit":"連續 2 份無新主題視為飽和；雙人編碼前 3 份","sens":"依是否已使用遠距科技比較主題分布","exp":"預期歸納出隱私與被監視感、設備可靠度與誤報、費用與維修、照顧責任與人際互動被取代等面向；若出現文獻未提及之面向，將成為量表特有內容。"},{"verb":"開發","text":"依質性主題發展顧慮量表並檢驗內容效度","hyp":"","analysis":"I-CVI、S-CVI/Ave；認知訪談問題清單；預試項目分析","crit":"I-CVI ≥ .83、S-CVI/Ave ≥ .90；校正後項目總分相關 ≥ .30","sens":"第二輪專家評分確認修改後題項","exp":"預期題庫約 40 題經內容效度與預試後保留約 30 題；若某面向題項大量刪除，表示該面向需重新界定。"},{"verb":"檢驗","text":"檢驗顧慮量表之因素結構、信度與已知群體效度","hyp":"H1：量表因素結構經 CFA 檢驗適配良好（CFI ≥ .95、RMSEA ≤ .06）。\nH2：已使用遠距照護科技者之顧慮總分低於未使用者；H0：兩組無差異。\nH3：顧慮總分與使用意圖呈負相關；H0：r = 0。","analysis":"樣本一 EFA（平行分析、主軸因素、promax）；樣本二 CFA（MLR）；α、ω、ICC（2,1）；獨立 t 檢定與 Pearson 相關","crit":"α = .05（雙尾）；CFA 適配依 Hu 與 Bentler（1999）；α、ω ≥ .70；ICC ≥ .75","sens":"以 Mann–Whitney U 取代 t 檢定；排除作答時間過短者重跑 CFA","exp":"預期量表呈 4–5 個因素且適配良好，已使用者顧慮較低、顧慮與使用意圖呈中度負相關；若 CFA 適配不佳，將依修正指標與理論檢討題項，並如實報告。"}],"vars":[{"name":"顧慮主題","role":"探索","concept":"家屬對遠距照護科技之擔憂經驗","oper":"主題分析歸納之主題與子主題","tool":"訪談逐字稿","scale":"","time":"第一階段","rel":"雙人編碼；成員檢核"},{"name":"家屬顧慮（量表總分與各面向）","role":"依變項","concept":"家屬對採用遠距照護科技可能負面後果之擔憂程度","oper":"自編量表約 30 題，5 點量尺，各面向取平均，分數愈高顧慮愈多","tool":"問卷","scale":"等距","time":"正式施測；50 人兩週後重測","rel":"I-CVI、EFA、CFA、α、ω、ICC"},{"name":"是否已使用遠距照護科技","role":"自變項","concept":"已知群體效度之分組","oper":"家中目前或過去 6 個月曾使用至少一項（是／否）","tool":"問卷","scale":"名目","time":"正式施測","rel":"—"},{"name":"使用意圖","role":"探索","concept":"效標：未來願意讓家中使用遠距照護科技之意願","oper":"3 題 7 點量尺平均（改編自 UTAUT）","tool":"問卷","scale":"等距","time":"正式施測","rel":"Venkatesh 等人（2003）"},{"name":"照顧者年齡、性別、與長者關係、教育程度","role":"控制","concept":"照顧者背景","oper":"年齡（歲）；性別；配偶／子女／其他；教育程度","tool":"基本資料表","scale":"比率／名目／次序","time":"正式施測","rel":"—"}],"bias":[{"name":"研究者前理解（質性）","why":"研究者具居家護理經驗，可能預設家屬擔心費用","fix":"反思日誌；雙人編碼；成員檢核"},{"name":"過度擬合因素結構","why":"以同一樣本做 EFA 與 CFA 會高估適配","fix":"正式樣本隨機分半，EFA 與 CFA 使用不同樣本"},{"name":"社會期許偏差","why":"家屬可能因不想顯得排斥科技而低報顧慮","fix":"匿名填答；說明無對錯答案；單位不經手填答內容"},{"name":"選樣偏差","why":"願意填答者可能對科技較有興趣","fix":"依單位配額發放；比較各單位回收者之長者失能程度分布並於限制中說明"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":2},{"t":"第一階段訪談","s":2,"e":4},{"t":"主題分析與題項產生","s":4,"e":5},{"t":"專家內容效度與認知訪談","s":5,"e":6},{"t":"預試與項目分析","s":6,"e":6},{"t":"正式施測與重測（問卷蒐集）","s":7,"e":8},{"t":"因素分析與信效度分析","s":9,"e":9},{"t":"論文撰寫","s":9,"e":11},{"t":"緩衝（施測延長、補收樣本）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"第一階段受訪者同質","trig":"第 3 月受訪者多為已使用科技者","when":"M3","plan":"請單位優先轉介未使用者，並以最大變異面向檢核表補足"},{"r":"內容效度未達標","trig":"第一輪 S-CVI/Ave < .90","when":"M5","plan":"依專家意見修改後進行第二輪評分"},{"r":"正式樣本不足","trig":"第 8 月有效問卷少於 300 份","when":"M8","plan":"延長施測 1 個月並增加 2 家合作單位；若仍不足，EFA 與 CFA 改以交叉驗證並說明"},{"r":"CFA 適配不佳","trig":"CFI < .90 或 RMSEA > .08","when":"M9","plan":"依理論與修正指標檢討題項，如實報告並建議後續再驗證"}],"kpi":[{"name":"有效問卷數（產出指標）","calc":"通過注意力檢核之正式問卷數","base":"0","goal":"第 8 月前 400 份"},{"name":"量表測量特性（成果指標）","calc":"CFA 適配、α、ω、ICC","base":"—","goal":"第 10 月前完成驗證報告"}],"ss":{}}},"DE":{"label":"D→E 問卷後訪談解釋：護理師 AI 決策輔助接受度","grp":1,"data":{"meta":{"type":"D","type2":"E 質性研究"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"醫院導入 AI 臨床決策輔助後，護理師使用率不一；管理者不知道是哪些因素影響使用，也不知道為什麼。","s1_2":"北部某醫學中心已上線 AI 臨床決策輔助之病房護理師。","s1_3":"第一階段：績效期望、努力期望、社會影響、促進條件與對 AI 之信任；第二階段：訪談解釋問卷結果。","s1_4":"使用意圖（主要）；第二階段：影響接受度之經驗主題。","s1_5":"哪些因素影響護理師使用 AI 臨床決策輔助的意圖？為什麼？","s1_6":"D→E：UTAUT 問卷調查（PLS-SEM），再以訪談解釋（解釋性序列設計）。","s1_7":"護理部同意；問卷匿名線上同意；訪談書面同意。","s1_8":"12 個月：問卷發展與預試 3 個月、施測 2 個月、訪談 2 個月、分析撰寫，保留兩個月緩衝。","s1_9":"提供推動 AI 臨床決策輔助之關鍵因素與具體策略。","m1_scene":"醫院導入 AI 臨床決策輔助（如壓傷與跌倒風險提示）後，各病房護理師的使用情形差異很大：有些病房幾乎每次評估都參考提示，有些則幾乎不打開，甚至直接關閉提醒視窗。北部某醫學中心上線一年後的系統紀錄顯示，各病房提示查看率從不到兩成到超過八成不等（院內資訊室統計，教學示意）。","m1_gap":"管理者多以教育訓練次數與系統登入次數評估推動成效，只知道「誰用、誰不用」，不知道護理師為何使用或不使用；增加訓練未必能解決「覺得提示不準」「沒時間看」或「主管沒要求」等不同原因，資源可能投錯地方。","m1_new":"整合型科技接受模式（UTAUT）指出，績效期望、努力期望與社會影響影響科技使用意圖（Venkatesh et al., 2003），UTAUT2 並納入促進條件對意圖之影響（Venkatesh et al., 2012）；AI 系統的使用另受使用者對自動化之信任影響（Lee & See, 2004）。問卷可估計各因素影響的大小，但數字只能告訴管理者「哪些因素有關」，無法說明「為什麼」；解釋性序列混合方法以質性訪談追問量性結果，正好補上這一段（Creswell & Plano Clark, 2018）。","m1_time":"本院 AI 臨床決策輔助上線滿一年，護理部正規劃第二年推動策略與預算，需要在年度計畫定案前（6 個月內）找出關鍵因素與原因；同時廠商將於明年改版，護理師的意見可回饋至改版需求。","m1_stmt":"因此，本研究擬以問卷檢驗 UTAUT 構面與對 AI 之信任對護理師使用意圖之影響，再以高低意圖護理師之訪談解釋量性結果背後的原因。","m2_pico":"第一階段｜P：病房護理師｜E：UTAUT 四構面與信任｜O：使用意圖。第二階段 PICo｜P：高分與低分意圖之護理師｜I：使用 AI 臨床決策輔助之經驗｜Co：病房臨床情境","m2_search":"PubMed：（\"Nurses\"[Mesh] OR nurse*[tiab]）AND（\"Decision Support Systems, Clinical\"[Mesh] OR \"artificial intelligence\"[tiab]）AND（acceptance[tiab] OR UTAUT[tiab] OR \"technology acceptance\"[tiab] OR trust[tiab]）\n華藝：（護理師）AND（人工智慧 OR 臨床決策輔助）AND（接受 OR 使用意圖）\n限制：2010 年以後、中英文；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、科技接受理論。Davis（1989）提出有用性與易用性影響使用；Venkatesh 等人（2003）整合八個模型提出 UTAUT。對本研究的意義：以 UTAUT 四構面為主要架構。\n二、對 AI 的信任。Lee 與 See（2004）指出，使用者對自動化的信任需與系統實際能力相符，過高或過低都會造成誤用或不用。對本研究的意義：在 UTAUT 外加入信任構面。\n三、方法學。PLS-SEM 適合以預測為目的之構面模型（Hair et al., 2022），區別效度以 HTMT 檢驗（Henseler et al., 2015），自陳問卷需處理共同方法偏差（Podsakoff et al., 2003）。解釋性序列設計以質性訪談解釋量性結果（Creswell & Plano Clark, 2018），訪談以主題分析（Braun & Clarke, 2006）。","m2_known":"UTAUT 已在多種醫療資訊系統驗證（Venkatesh et al., 2003），信任被認為影響 AI 使用（Lee & See, 2004）。","m2_unknown":"然而，國內護理師使用 AI 臨床決策輔助之意圖，「對 AI 之信任」相較 UTAUT 傳統構面的影響大小，以及這些因素在臨床情境中如何運作，仍缺乏量性與質性整合的證據；既有研究多止於路徑係數，少以質性資料解釋或挑戰量性結果。","m2_worth":"此缺口使護理部只能增加訓練次數，無法針對不同原因設計策略；本研究可指出關鍵因素、解釋其原因，並提出可對應到具體行動（如提示依據說明、主管示範、介面調整）的推動策略。","m2_theory":"以 UTAUT（Venkatesh et al., 2003）為架構並加入對 AI 之信任（Lee & See, 2004）；以解釋性序列設計（Creswell & Plano Clark, 2018）銜接兩階段：第一階段結果決定第二階段訪談對象與大綱。","m2_orig":"本計畫在 UTAUT 中加入對 AI 之信任，並以極端個案抽樣訪談高低意圖者，解釋量性結果背後的原因。","m3_rq":"哪些因素影響護理師使用 AI 臨床決策輔助之意圖？其背後原因為何？","m3_terms":"使用意圖：護理師未來持續使用 AI 臨床決策輔助之意願，以 3 題 7 點量尺測量（Venkatesh et al., 2003）。\n對 AI 之信任：護理師認為系統提示可靠、可依賴之程度，4 題 7 點量尺。\nAI 臨床決策輔助：本院電子病歷中之壓傷與跌倒風險 AI 提示功能。","m3_scope":"研究範圍為北部某醫學中心已上線 AI 臨床決策輔助之 12 個病房的護理師，研究期間 12 個月。第一階段探討使用意圖之影響因素，第二階段解釋其原因；本研究不評估系統對壓傷、跌倒等病人結果之成效，亦不評估系統預測準確度。","m4_frame":"第一階段依 UTAUT（Venkatesh et al., 2003）與 UTAUT2（Venkatesh et al., 2012）：績效期望、努力期望、社會影響、促進條件與對 AI 之信任（Lee & See, 2004）分別正向影響使用意圖（H1–H5）；控制變項為年資與職級。第二階段依使用意圖高低分各選 6–8 人訪談，解釋路徑結果（如信任為何影響最大、社會影響為何不顯著），並以聯合呈現表整合兩階段結果。","m5_design":"本研究採解釋性序列混合方法設計（D→E）：第一階段為橫斷式問卷調查（PLS-SEM），第二階段為描述性質性研究，以半結構訪談解釋量性結果。","m5_reject":"不只做問卷，因無法解釋因素背後的原因；不先做訪談，因 UTAUT 已有成熟架構，宜先以問卷檢驗，再針對結果追問；不採同時進行之聚斂式設計，因第二階段受訪者需依第一階段意圖分數挑選，訪談大綱也需依量性結果擬定。","m5_site":"研究場域為北部某醫學中心已上線 AI 臨床決策輔助之 12 個病房（內科 6、外科 4、加護 2），護理部已書面同意（附錄二），在職護理師約 420 人。系統於 2025 年 10 月上線，提供壓傷與跌倒風險提示。","m5_incl":"問卷納入：上線病房在職護理師、年資 3 個月以上、曾使用系統。排除：護理長與專科護理師。訪談：依問卷使用意圖高分（前 25%）與低分（後 25%）且留下聯絡方式者，各選 6–8 人。","m5_sample":"第一階段：PLS-SEM 依最大箭頭數 5、檢定力 .80、R² = .10、α = .05 至少需約 147 人（Hair et al., 2022）；另以相關係數 r = .20、α = .05 雙尾、檢定力 .80 估算需 194 人，取兩者較大值，目標有效樣本 200 人；預期回收率 60%，邀請 12 個病房全部約 420 人。第二階段：高低分各 6–8 人，依飽和停止（Hennink & Kaiser, 2022）。","m5_tool":"一、UTAUT 量表中文版：績效期望 4 題、努力期望 4 題、社會影響 3 題、促進條件 4 題、使用意圖 3 題，7 點量尺（Venkatesh et al., 2003）。\n二、對 AI 之信任：4 題，依 Lee 與 See（2004）之構念自編，經 6 位專家內容效度檢驗（I-CVI ≥ .78；Polit & Beck, 2006）。\n三、基本資料：年資、職級、病房類型。\n四、訪談大綱：依第一階段結果擬定，如「什麼情況下您會相信或不相信系統的提示？」（附錄三）。","m5_flow":"一、第 1–2 月：問卷翻譯與專家效度；IRB 送審（兩階段一併）。\n二、第 3 月：預試 30 人，計算 Cronbach's α。\n三、第 4–5 月：正式施測，線上匿名問卷，兩次提醒；問卷末詢問是否願意受訪（另留聯絡方式，與問卷分開儲存）。\n四、第 6 月：分析第一階段，擬訂訪談大綱並選取受訪者。\n五、第 7–8 月：個別訪談 45–60 分鐘，錄音轉逐字稿。","m5_innov":"以第一階段結果決定第二階段抽樣與訪談大綱，並以聯合呈現表整合量性路徑與質性主題。","m6_common":"顯著水準 α = .05（雙尾）。以 SmartPLS 4 進行 PLS-SEM：測量模型檢驗負荷 ≥ .70、CR ≥ .70、AVE ≥ .50、HTMT < .85（Henseler et al., 2015）；結構模型以 5,000 次 bootstrap 檢驗路徑係數、R² 與 f²，並檢查結構模型 VIF < 3。共同方法偏差以 Harman 單因子檢定作初步檢查（Podsakoff et al., 2003），並以全共線性 VIF < 3.3 評估（Kock, 2015）。問卷設計上將自變項與依變項分頁呈現、匿名作答以事前降低共同方法偏差。","m6_qual":"第二階段以主題分析（Braun & Clarke, 2006）：前 3 份兩人獨立編碼後建代碼簿；以聯合呈現表將各路徑結果與對應主題並列，判斷質性結果是否支持、補充或與量性結果不一致。","m7_irb":"本研究將送〔醫院〕人體研究倫理審查委員會審查，屬成年工作人員之匿名問卷與訪談、最小風險，預計申請簡易審查，兩階段一併送審，以審查會認定為準；第二階段訪談大綱於第一階段分析後確定，屆時以變更案提出。","m7_consent":"第一階段問卷首頁說明研究目的、匿名方式與權益，勾選同意後作答（申請免除書面同意，改以線上同意）；第二階段訪談簽署書面同意書，含錄音同意。招募不經護理長，問卷連結由護理部統一發送。","m7_risk":"屬最小風險；護理師可能擔心對系統的負面意見被主管知悉。問卷匿名、訪談內容不回饋給主管，結果只以彙總或匿名引述呈現，避免影響考核；可隨時退出。","m7_deid":"問卷匿名；願受訪者之聯絡方式另表儲存，不與問卷答案連結（以研究編號對應分數高低組別）。逐字稿去識別，錄音核對後刪除；資料保存至研究結束後 3 年後刪除。","m7_coi":"研究者與 AI 系統廠商無財務關係。生成式 AI 僅用於英文潤稿，不輸入問卷與訪談資料。","m8_feas":"場域：護理部已書面同意（附錄二），並同意於晨會時段宣導。樣本：上線病房護理師約 420 人，院內過去同類問卷回收率約 60–70%。工具：UTAUT 題項依原作者量表翻譯回譯，使用前確認授權；信任題項 6 位專家已同意審查。時間：問卷 2 個月、訪談 2 個月，保留兩個月緩衝。","m9_acad":"在 UTAUT/UTAUT2 架構中驗證「對 AI 之信任」之角色，並以質性結果解釋或挑戰路徑結果，示範解釋性序列混合方法之整合呈現。","m9_prac":"依關鍵因素與原因提出對應推動策略，如針對信任不足者提供提示依據說明、針對努力期望低者簡化介面、針對社會影響不足者請護理長示範；並回饋廠商改版需求。","m9_limd":"橫斷式設計只能說明相關，不能推論因果；使用意圖不等於實際使用行為；單一醫院、單一系統，推論至其他醫院或其他 AI 功能需保守。","m9_lime":"回收率可能偏低，回覆者可能偏向常用系統者；將比較回覆者與各病房人數結構。訪談對象依意圖兩端挑選，可能忽略中間意圖者的經驗，將於限制中說明。","m9_train":"參與之碩士生將習得問卷翻譯與效度、PLS-SEM、質性訪談與混合方法整合（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇（教學示意）。","m9_nation":"協助醫療機構有效推動 AI 臨床應用，提升護理照護品質。","t_iv":"AI 臨床決策輔助","t_pop":"護理師","t_out":"使用意圖","t_des":"解釋性序列混合方法研究","m10_title":"護理師使用 AI 臨床決策輔助之意圖與影響因素：解釋性序列混合方法研究","m10_title_en":"Nurses' Intention to Use AI-Based Clinical Decision Support and Its Determinants: An Explanatory Sequential Mixed-Methods Study","m10_kw":"護理師、人工智慧、臨床決策輔助、科技接受、混合方法","m10_abs":"醫院導入 AI 臨床決策輔助後，護理師使用率不一，管理者不知影響因素與原因。本研究旨在找出影響護理師使用意圖之因素，並解釋其原因。本研究採解釋性序列混合方法設計：第一階段以 UTAUT 架構加入對 AI 之信任，對北部某醫學中心 12 個病房護理師進行匿名問卷，目標有效樣本 200 人，以 PLS-SEM 分析測量模型與結構模型；第二階段依使用意圖高低分各訪談 6–8 人，以主題分析解釋量性結果，並以聯合呈現表整合兩階段發現。預期信任與績效期望為關鍵因素，可作為護理部擬定推動策略與廠商改版之依據。","m10_refs":"Braun, V., & Clarke, V. (2006). Using thematic analysis in psychology. Qualitative Research in Psychology, 3(2), 77–101.\nCreswell, J. W., & Plano Clark, V. L. (2018). Designing and conducting mixed methods research (3rd ed.). Sage.\nDavis, F. D. (1989). Perceived usefulness, perceived ease of use, and user acceptance of information technology. MIS Quarterly, 13(3), 319–340.\nHair, J. F., Hult, G. T. M., Ringle, C. M., & Sarstedt, M. (2022). A primer on partial least squares structural equation modeling (PLS-SEM) (3rd ed.). Sage.\nHennink, M., & Kaiser, B. N. (2022). Sample sizes for saturation in qualitative research: A systematic review of empirical tests. Social Science & Medicine, 292, 114523.\nHenseler, J., Ringle, C. M., & Sarstedt, M. (2015). A new criterion for assessing discriminant validity in variance-based structural equation modeling. Journal of the Academy of Marketing Science, 43(1), 115–135.\nKock, N. (2015). Common method bias in PLS-SEM: A full collinearity assessment approach. International Journal of e-Collaboration, 11(4), 1–10.\nLee, J. D., & See, K. A. (2004). Trust in automation: Designing for appropriate reliance. Human Factors, 46(1), 50–80.\nPodsakoff, P. M., MacKenzie, S. B., Lee, J.-Y., & Podsakoff, N. P. (2003). Common method biases in behavioral research: A critical review of the literature and recommended remedies. Journal of Applied Psychology, 88(5), 879–903.\nPolit, D. F., & Beck, C. T. (2006). The content validity index: Are you sure you know what's being reported? Critique and recommendations. Research in Nursing & Health, 29(5), 489–497.\nVenkatesh, V., Morris, M. G., Davis, G. B., & Davis, F. D. (2003). User acceptance of information technology: Toward a unified view. MIS Quarterly, 27(3), 425–478.\nVenkatesh, V., Thong, J. Y. L., & Xu, X. (2012). Consumer acceptance and use of information technology: Extending the unified theory of acceptance and use of technology. MIS Quarterly, 36(1), 157–178.","irb_inst":"〔醫院名稱〕護理部（12 個已上線病房）","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：匿名問卷與訪談，內容為工作經驗與看法，屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"第一階段：邀請護理師 420 人，目標有效樣本 200 人；第二階段：高低分各 6–8 人，共 12–16 人。","irb_recruit":"問卷連結由研究生於病房公告與電子郵件發送；護理長不參與發放與催收。訪談對象由研究生依問卷末自願留下之聯絡方式聯繫。","irb_vuln":"參與者為受雇者：主管不知悉誰參與、填答內容不回饋單位；不納入易受傷害族群。","irb_task":"第一階段：填一份匿名線上問卷，約 15 分鐘。第二階段（自願）：一次訪談，約 45–60 分鐘，聊聊使用 AI 提示的經驗（錄音）。","irb_withdraw":"問卷可隨時關閉中止；因匿名，送出後無法撤回。訪談可隨時告知撤回，撤回後刪除錄音與逐字稿。","irb_benefit":"無直接利益；完成問卷可參加〔　〕元禮券抽獎（聯絡方式與答案分開），受訪者致贈〔　〕元禮券。","irb_harm":"屬最小風險；若談到工作壓力感到不適，可隨時暫停。對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為匿名問卷資料、訪談錄音與逐字稿。錄音於核對後刪除；去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"部分：第一階段問卷申請免除書面同意（改以線上勾選同意）；第二階段訪談簽署書面同意書。","irb_ad":"【護理師使用 AI 提示經驗調查】想邀請已使用 AI 風險提示的護理師，填一份約 15 分鐘的匿名問卷；問卷末可自願登記參加訪談。填答內容不會提供給主管。聯絡人：〔研究生姓名〕〔電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責問卷施測、訪談與資料分析）；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。","m10_kw_en":"clinical decision support; artificial intelligence; technology acceptance; trust; explanatory sequential design","m10_abs_en":"After hospitals implement AI-based clinical decision support, nurses' use varies widely, and managers do not know which factors influence use or why. This study aims to identify factors associated with nurses' intention to use AI clinical decision support and to explain the reasons behind them. An explanatory sequential mixed methods design will be used. In phase one, an anonymous online survey based on the Unified Theory of Acceptance and Use of Technology, extended with trust in AI, will be administered to nurses in 12 wards of a medical center in northern Taiwan, targeting 200 valid responses. The measurement and structural models will be assessed with partial least squares structural equation modeling, using 5,000 bootstrap samples, and common method bias will be examined. In phase two, six to eight nurses with high and six to eight with low intention scores will be interviewed, and thematic analysis will be used to explain the quantitative findings, with results integrated in a joint display. Trust in AI and performance expectancy are expected to be key factors, providing a basis for nursing management strategies and vendor improvements."},"objs":[{"verb":"檢驗","text":"檢驗 UTAUT 構面與對 AI 之信任對使用意圖之影響","hyp":"H1–H5：績效期望、努力期望、社會影響、促進條件（依 UTAUT2）與對 AI 之信任分別正向影響使用意圖；H0：各路徑係數為 0。","analysis":"PLS-SEM，5,000 次 bootstrap 檢驗路徑係數、R² 與 f²","crit":"α = .05（雙尾）；路徑係數 95% CI 不含 0","sens":"控制年資、職級；排除作答過快者重跑","exp":"預期績效期望與信任影響最大；若社會影響不顯著，表示使用多屬個人判斷。"},{"verb":"描述","text":"描述問卷測量模型之信效度","hyp":"","analysis":"負荷、CR、AVE、HTMT","crit":"負荷 ≥ .70、CR ≥ .70、AVE ≥ .50、HTMT < .85","sens":"共同方法偏差檢查","exp":"預期各構面信效度達標；信任構面為改編，若未達標將刪題並說明。"},{"verb":"探討","text":"探討高低使用意圖護理師之經驗，解釋量性路徑結果","hyp":"","analysis":"主題分析；聯合呈現表整合","crit":"飽和：連續 2 份無新代碼","sens":"比較高低分組主題差異","exp":"預期低意圖者描述「提示與臨床判斷不一致時不知該信誰」，解釋信任的角色。"}],"vars":[{"name":"使用意圖","role":"依變項","concept":"持續使用之意願","oper":"UTAUT 使用意圖 3 題 7 點量尺平均","tool":"問卷","scale":"等距","time":"施測時","rel":"Venkatesh 等人（2003）"},{"name":"績效期望","role":"自變項","concept":"認為系統有助工作表現","oper":"4 題 7 點量尺","tool":"問卷","scale":"等距","time":"施測時","rel":"同上"},{"name":"努力期望","role":"自變項","concept":"認為系統易用","oper":"4 題 7 點量尺","tool":"問卷","scale":"等距","time":"施測時","rel":"同上"},{"name":"社會影響","role":"自變項","concept":"重要他人期待使用","oper":"3 題 7 點量尺","tool":"問卷","scale":"等距","time":"施測時","rel":"同上"},{"name":"對 AI 之信任","role":"自變項","concept":"認為提示可靠","oper":"4 題 7 點量尺","tool":"問卷","scale":"等距","time":"施測時","rel":"Lee 與 See（2004）；專家 CVI"},{"name":"促進條件","role":"自變項","concept":"可得之資源與支援","oper":"4 題 7 點量尺","tool":"問卷","scale":"等距","time":"施測時","rel":"Venkatesh 等人（2003、2012）"},{"name":"年資、職級","role":"控制","concept":"工作背景","oper":"年資（年）；N1–N4","tool":"基本資料表","scale":"比率／次序","time":"施測時","rel":"—"}],"bias":[{"name":"共同方法偏差","why":"所有構面同一人同時自陳","fix":"構面題目分散排列；Harman 單因子與 VIF 檢查"},{"name":"無回應偏差","why":"常用者較願意填答","fix":"比較回覆者與病房人數結構；兩次提醒"},{"name":"社會期許偏差","why":"擔心主管得知而高估意圖","fix":"匿名填答；主管不參與發放"},{"name":"研究者前理解（質性）","why":"研究者為本院護理師，可能預設原因","fix":"反思日誌；雙人編碼；成員檢核"}],"gantt":{"n":12,"rows":[{"t":"問卷翻譯與專家效度","s":1,"e":2},{"t":"IRB 送審與核准","s":1,"e":2},{"t":"預試與修正","s":3,"e":3},{"t":"正式施測（問卷蒐集）","s":4,"e":5},{"t":"量性分析與擬訪談大綱","s":6,"e":6},{"t":"質性訪談","s":7,"e":8},{"t":"整合分析與撰寫","s":8,"e":10},{"t":"緩衝（回收延長、補訪）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"問卷回收不足","trig":"第 5 月有效樣本少於 150","when":"M5","plan":"延長 1 個月並增加提醒；放寬至曾使用 1 次以上"},{"r":"願受訪者不足","trig":"高或低分組自願者少於 6 人","when":"M6","plan":"放寬至前後 33%"},{"r":"信任構面效度不足","trig":"AVE < .50","when":"M6","plan":"刪除低負荷題並說明"},{"r":"量性與質性結果不一致","trig":"訪談主題與顯著路徑方向相反","when":"M8","plan":"於聯合呈現表標示「不一致」並追訪 2–3 人；討論中說明可能原因，不強行整合"}],"kpi":[{"name":"有效問卷數（產出指標）","calc":"通過注意力檢核之問卷數","base":"0","goal":"第 5 月前 200 份"},{"name":"完成訪談人數（產出指標）","calc":"完成並轉錄之訪談數","base":"0","goal":"第 8 月前 12 人以上"}],"ss":{"kind":"corr","eff":0.2,"alpha":0.05,"tails":2,"power":0.8,"drop":40,"moe":0.05,"basis":"小相關 r = .20；PLS-SEM 另依 Hair et al.（2022）需 147 人，取較大值"}}},"EF":{"label":"E→F 先焦點團體再德菲：失智社區據點服務品質指標","grp":1,"data":{"meta":{"type":"F","type2":"E 質性研究"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"失智社區服務據點數量快速增加，但服務品質缺乏共通指標；考核多看開班數與服務人次，看不出家屬與長者是否真的受益。","s1_2":"第一階段：北部 4 個據點之工作人員與家庭照顧者焦點團體共 4 場（每場 6–8 人）；第二階段：跨職類專家 18 位。","s1_3":"第一階段：工作人員與家屬對「好服務」的看法；第二階段：德菲法評估由第一階段與文獻初擬之指標。","s1_4":"第一階段：品質面向與初擬指標；第二階段：達共識之構面與指標（重要性、可行性）。","s1_5":"失智社區服務據點之服務品質應以哪些指標評估？專家能否對這些指標形成共識？","s1_6":"E→F：焦點團體以內容分析初擬指標，再以修正式德菲法形成共識。","s1_7":"焦點團體書面同意（含錄音）；德菲專家線上同意；不涉及長者個人資料。","s1_8":"12 個月：IRB 2 個月、焦點團體與分析 3 個月、德菲 2–3 回合 4 個月、撰寫，保留兩個月緩衝。","s1_9":"提供兼顧使用者觀點且經專家共識之據點服務品質指標，供據點自評與主管機關考核參考。","m1_scene":"長照 2.0 推動以來，各縣市普設失智社區服務據點，提供認知促進、照顧者支持、家屬照顧課程與共餐等服務，讓輕中度失智長者在社區中延緩退化、家屬獲得喘息與支持。據點數量快速增加，由醫院、基金會、社區協會等不同單位承辦，服務內容與人力配置差異很大：有的據點以課程為主，有的重視家屬支持團體，也有據點每週只開班兩個半天。","m1_gap":"目前對據點的考核多以開班數、服務人次與活動照片為主，屬於「量」的指標；這些數字看不出長者是否在活動中被尊重與參與、家屬是否真的減輕壓力、轉介與追蹤是否到位。承辦單位不知道該往哪裡改善，主管機關也無法區分「人次很多但品質普通」與「人次不多但深度陪伴」的據點。","m1_new":"Donabedian（1988）提出結構、過程、結果三面向的品質評估架構，已廣泛用於照護品質指標；德菲法適合在缺乏實證標準時整合專家意見（Hasson et al., 2000）。然而，若初擬指標只來自文獻與專家，容易忽略服務使用者與第一線人員真正在意的面向；以焦點團體先蒐集使用者與工作人員觀點，再以德菲法讓專家判斷重要性與可行性，可兼顧「使用者觀點」與「專業共識」（Krueger & Casey, 2015）。","m1_time":"地方政府正檢討據點考核制度，預計於 2027 年修訂考核表；本研究可在修訂前提供兼顧使用者觀點且經專家共識之指標草案。","m1_stmt":"因此，本研究擬先以焦點團體探索據點工作人員與家庭照顧者對服務品質之看法並初擬指標，再以修正式德菲法建構失智社區服務據點服務品質指標。","m2_pico":"第一階段 PICo｜P：據點工作人員與失智長者之家庭照顧者｜I：對據點服務品質之看法與經驗｜Co：失智社區服務據點。第二階段｜P：跨職類專家｜I：修正式德菲法｜O：達共識之構面與指標（重要性、可行性）","m2_search":"PubMed：（\"Dementia\"[Mesh] OR dementia[tiab]）AND（\"Community Health Services\"[Mesh] OR \"day care\"[tiab] OR \"community-based\"[tiab]）AND（\"Quality Indicators, Health Care\"[Mesh] OR \"quality indicator*\"[tiab]）AND（Delphi[tiab] OR \"focus group*\"[tiab]）\n華藝：（失智）AND（社區據點 OR 日間照顧 OR 社區服務）AND（品質指標 OR 服務品質）\n限制：2010 年以後、中英文；並檢索衛福部與地方政府之據點計畫與考核文件；檢索日期與篩選流程見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、品質指標架構。Donabedian（1988）主張照護品質可從結構、過程與結果評估。對本研究的意義：以三構面作為內容分析之初始類目與指標分類依據。\n二、使用者觀點與焦點團體。焦點團體透過團體互動引出參與者對經驗與期待的看法，適合探索服務品質的使用者觀點（Krueger & Casey, 2015）；Guest 等人（2017）的實證研究顯示，2–3 場焦點團體可涵蓋多數主題，3–6 場可涵蓋約九成，可作為場次規劃依據。資料以導向式內容分析（directed content analysis）處理，可兼顧既有架構與新出現之類目（Hsieh & Shannon, 2005）。\n三、德菲法與共識判準。Hasson 等人（2000）提出德菲法執行要點；Diamond 等人（2014）建議事先界定並報告共識判準；本研究採重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）之判準（Burnette et al., 2003），於第一回合前寫定，依 CREDES 報告（Jünger et al., 2017）。本研究初步檢索（附錄一）未見國內結合使用者焦點團體與德菲法之據點品質指標研究（教學示意：請以自己的實際檢索結果改寫）。","m2_known":"既有研究已提供品質指標三構面架構（Donabedian, 1988）、焦點團體與內容分析之方法（Krueger & Casey, 2015；Hsieh & Shannon, 2005），以及德菲法之執行與報告準則（Hasson et al., 2000；Jünger et al., 2017）。","m2_unknown":"然而，國內失智社區服務據點缺乏兼顧第一線工作人員與家庭照顧者觀點、並經跨職類專家共識之服務品質指標；既有考核項目多為行政與產出指標，未涵蓋家屬支持與長者參與之品質。","m2_worth":"此缺口使據點無法自我改善、主管機關考核只看人次；本研究以焦點團體加德菲法，產出每項皆可追溯到使用者觀點或文獻來源、且具共識程度之指標。","m2_theory":"以 Donabedian（1988）結構－過程－結果架構為導向式內容分析之初始類目；第一階段焦點團體之類目與文獻、既有考核項目整合為初擬指標；第二階段以修正式德菲法（Hasson et al., 2000）形成共識。","m2_orig":"本計畫以據點工作人員與家庭照顧者之焦點團體作為指標來源，再經跨職類專家德菲共識，產出兼具使用者觀點與專業可行性之失智據點服務品質指標，並保留「焦點團體類目 → 指標」對照表供追溯。","m3_rq":"失智社區服務據點之服務品質應以哪些指標評估？專家能否對這些指標形成共識？","m3_terms":"失智社區服務據點：依長照 2.0 設置，提供認知促進、照顧者支持、照顧課程與共餐等服務之社區據點。\n服務品質指標：可由據點提供文件、紀錄或調查佐證之具體檢核項目。\n共識：重要性（平均數 M ≥ 3.5 或眾數 Mode ≥ 3）且一致性（四分位差 QD < 1 或標準差 SD ≤ 1）兩組皆達成者為達共識（Burnette et al., 2003）；判準與停止規則於第一回合前寫定，保留、修改與刪除條件互斥。","m3_scope":"研究範圍為失智社區服務據點之服務品質指標，第一階段為北部 4 個據點之工作人員與家庭照顧者，第二階段為國內跨職類專家，研究期間 12 個月。本研究建構指標，不以指標實地評核據點、不檢驗指標信效度，亦不直接訪談失智長者（認知能力限制，由家屬代為表達經驗並於限制中說明）。","m4_frame":"第一階段：焦點團體資料以 Donabedian 三構面為初始類目進行導向式內容分析，無法歸入者另立新類目；類目轉寫為可檢核之初擬指標，並與文獻及既有考核項目整合。第二階段：專家評各指標之重要性與可行性，依事先界定判準保留、修改或刪除，形成最終指標體系。","m5_design":"本研究採兩階段設計（E→F）：第一階段為質性焦點團體研究，以導向式內容分析初擬指標；第二階段為修正式德菲法，以第一階段之初擬指標作為第一回合問卷，進行 2–3 回合評分。","m5_reject":"不直接以文獻與既有考核表初擬指標，因容易遺漏使用者在意之品質面向（如家屬被理解、長者被尊重）；不只做焦點團體，因質性結果無法說明哪些指標專家認為重要且可行；不採面對面共識會議，因專家分散且易受權威者影響。","m5_site":"第一階段場域為北部 4 個失智社區服務據點（承辦單位分別為醫院、基金會、社區協會與診所），各據點已同意協助邀請工作人員與家屬並提供場地（附錄二）。第二階段專家透過指導教授、失智症相關學會與地方政府網絡邀請，已有 11 位口頭同意。","m5_incl":"焦點團體工作人員：據點在職之督導、照服員、課程講師，年資 6 個月以上。家庭照顧者：失智長者之主要照顧者，長者使用據點服務 3 個月以上。德菲專家：據點負責人、失智共同照護中心個管師、地方長照主管機關承辦人、失智照護學者、家屬團體代表，相關經驗 5 年以上；排除與研究者有直接僱傭或指導關係者。","m5_sample":"第一階段預計 4 場焦點團體（工作人員 2 場、家庭照顧者 2 場），每場 6–8 人；依 Guest 等人（2017），2–3 場可涵蓋多數主題，若第 4 場仍出現新類目，則每類加開 1 場（最多 6 場）。第二階段專家 18 位，五類各 3–4 位，每回合回收率目標 70% 以上（至少 13 位）。","m5_tool":"一、焦點團體大綱：如「您覺得一個好的據點，最重要的是什麼？」「什麼時候讓您覺得來這裡是值得的？」「什麼事情讓您失望或擔心？」（附錄三），由主持人與記錄者各 1 人。\n二、內容分析類目表：以 Donabedian 三構面為初始類目，記錄新類目與定義。\n三、德菲問卷：每項指標評重要性與可行性各 5 點量尺，附修改建議欄；第二回合起附群體 M、Mode、QD 與專家本人上一回合分數。\n四、基本資料表：職類、年資、據點類型。","m5_flow":"一、第 1–2 月：IRB 送審（兩階段一併）；與據點確認場次與招募方式。\n二、第 3–4 月：4 場焦點團體（每場 90 分鐘，錄音並記錄非語言互動），場後 1 週內完成逐字稿；家屬場次同時提供長者照顧安排。\n三、第 4–5 月：內容分析、初擬指標並與文獻及既有考核項目整合；2 位專家預閱問卷。\n四、第 6–7 月：第一、二回合德菲（線上，每回合回收期 2 週）。\n五、第 8 月：必要時第三回合；定稿指標體系。","m5_innov":"以第一線工作人員與家庭照顧者之焦點團體作為指標來源，讓使用者觀點進入指標體系，並保留類目到指標之追溯紀錄；再以德菲法確保專業可行性。","m6_common":"第一階段質性資料不做統計檢定。第二階段每回合計算各指標重要性與可行性之 M、SD、Mode 與 QD；重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）皆達成者保留，連續兩回合重要性未達（M < 3.5 且 Mode < 3）者刪除，其餘修改後再評（三類互斥）；停止條件：全數達共識或連續兩回合 QD 變化 < 0.1。並報告各回合回收率與專家職類分布。分析以 Excel 與 R（版本寫明）執行。","m6_qual":"焦點團體逐字稿以導向式內容分析處理（Hsieh & Shannon, 2005）：以 Donabedian 三構面為初始類目，兩位研究者獨立編碼前 2 場逐字稿，比對後修訂類目定義，其餘由主要研究者編碼、第二位研究者抽檢；無法歸入既有類目者另立新類目。類目轉寫為指標時，記錄每項指標之來源（焦點團體、文獻、既有考核）。結果依 COREQ 報告（Tong et al., 2007）。","m7_irb":"本研究將送〔大學〕研究倫理審查委員會審查，第一階段為成年工作人員與家庭照顧者之焦點團體、第二階段為專家意見問卷，均屬最小風險，預計申請簡易審查，兩階段一併送審，以審查會認定為準。","m7_consent":"焦點團體參與者簽署書面同意書（含錄音同意與團體保密約定）；說明參與與否不影響長者使用據點服務或工作人員考核。德菲專家於問卷首頁閱讀說明並勾選同意後作答（申請免除書面同意）。","m7_risk":"屬最小風險；家屬談及照顧壓力可能引發情緒，主持人具諮商背景並可暫停討論，並提供家屬支持資源。團體中其他成員可能聽到個人經驗，故事先約定團體內容不外傳；工作人員與家屬分場進行，避免彼此顧忌。","m7_deid":"逐字稿以代號取代姓名、據點名稱與長者資訊；錄音於逐字稿核對後刪除。德菲專家以代號處理，回饋只呈現群體統計與匿名意見。研究資料存於加密裝置，保存至研究結束後 3 年，期滿以不可回復方式刪除。","m7_coi":"研究者與參與據點無財務關係，指導教授所屬醫院之據點不參與第一階段。生成式 AI 僅用於英文潤稿，不輸入逐字稿與問卷資料。","m8_feas":"場域：4 個據點已同意協助招募與提供場地（附錄二），每據點工作人員 4–8 人、服務家庭 30–50 戶。專家：已有 11 位口頭同意，另 7 位邀請中。人力：研究者具社區護理經驗，已完成質性研究方法課程與焦點團體主持訓練；指導教授具德菲法發表經驗。時間：焦點團體 2 個月、德菲 3 個月，保留兩個月緩衝。","m9_acad":"提供兼顧使用者觀點與專家共識之失智社區服務據點品質指標，並示範「焦點團體 → 德菲法」之 E→F 兩階段指標建構與來源追溯方式。","m9_prac":"據點可用指標自評、找出服務缺口；地方政府修訂考核表時可參考，從只看人次轉向兼顧家屬支持與長者參與之品質。","m9_limd":"指標來自焦點團體與專家共識，未實地施測驗證信效度；未直接納入失智長者本人觀點；第一階段僅含北部 4 個據點，可能遺漏其他地區之特殊需求。","m9_lime":"家屬可能因擔心影響服務而只談正面經驗，將以工作人員不在場、匿名約定降低影響；德菲回合間專家流失可能影響共識代表性，將報告每回合回收率。","m9_train":"參與之碩士生將習得焦點團體主持與記錄、導向式內容分析、德菲法設計與共識判準（教學示意）。","m9_output":"預計投稿期刊論文 1 篇、研討會論文 1 篇，並產出據點自評表一份（教學示意）。","m9_nation":"回應失智友善社區與長照 2.0 之政策需求，提供據點服務品質管理之共同語言，協助資源投入真正有助家屬與長者之服務。","t_iv":"服務品質指標","t_pop":"失智社區服務據點","t_out":"之建構","t_des":"焦點團體與德菲法研究","m10_title":"失智社區服務據點服務品質指標之建構：焦點團體與德菲法研究","m10_title_en":"Development of Service Quality Indicators for Community-Based Dementia Service Centers: A Focus Group and Delphi Study","m10_kw":"失智症、社區服務據點、品質指標、焦點團體、德菲法","m10_abs":"失智社區服務據點數量快速增加，但考核多以開班數與服務人次為主，缺乏兼顧使用者觀點之服務品質指標。本研究旨在建構失智社區服務據點服務品質指標。第一階段於北部 4 個據點進行工作人員與家庭照顧者焦點團體共 4 場，以 Donabedian 結構－過程－結果架構為初始類目進行導向式內容分析，並與文獻及既有考核項目整合為初擬指標；第二階段邀請據點負責人、失智共同照護中心個管師、地方主管機關、學者與家屬團體代表共 18 位專家，進行 2–3 回合修正式德菲法，以重要性（平均數 ≥ 3.5 或眾數 ≥ 3）且一致性（四分位差 < 1 或標準差 ≤ 1）為共識判準。預期產出兼顧使用者觀點與專家共識之指標，供據點自評與主管機關修訂考核制度參考。","m10_kw_en":"dementia; community-based services; quality indicators; focus groups; Delphi technique","m10_abs_en":"Community-based dementia service centers have expanded rapidly in Taiwan, but their evaluation focuses on the number of classes and service users, and indicators reflecting users' perspectives on service quality are lacking. This study aims to develop service quality indicators for community-based dementia service centers. In phase one, four focus groups with staff and family caregivers will be held at four centers in northern Taiwan. Transcripts will be analyzed using directed content analysis with Donabedian's structure–process–outcome framework as initial categories, and the resulting categories will be integrated with the literature and existing evaluation items to form draft indicators. In phase two, 18 experts—center directors, dementia care case managers, local government officials, academics, and representatives of family caregiver organizations—will rate the importance and feasibility of each indicator in a two- to three-round modified Delphi study. Consensus is predefined as adequate importance (mean ≥ 3.5 or mode ≥ 3) together with agreement (interquartile deviation < 1 or standard deviation ≤ 1). The study is expected to produce indicators that integrate user perspectives with expert consensus, supporting center self-assessment and the revision of government evaluation systems.","m10_refs":"Burnette, D., Morrow-Howell, N., & Chen, L. M. (2003). Setting priorities for gerontological social work research: A national Delphi study. The Gerontologist, 43(6), 828–838.\nDiamond, I. R., Grant, R. C., Feldman, B. M., Pencharz, P. B., Ling, S. C., Moore, A. M., & Wales, P. W. (2014). Defining consensus: A systematic review recommends methodologic criteria for reporting of Delphi studies. Journal of Clinical Epidemiology, 67(4), 401–409.\nDonabedian, A. (1988). The quality of care: How can it be assessed? JAMA, 260(12), 1743–1748.\nGuest, G., Namey, E., & McKenna, K. (2017). How many focus groups are enough? Building an evidence base for nonprobability sample sizes. Field Methods, 29(1), 3–22.\nHasson, F., Keeney, S., & McKenna, H. (2000). Research guidelines for the Delphi survey technique. Journal of Advanced Nursing, 32(4), 1008–1015.\nHsieh, H.-F., & Shannon, S. E. (2005). Three approaches to qualitative content analysis. Qualitative Health Research, 15(9), 1277–1288.\nJünger, S., Payne, S. A., Brine, J., Radbruch, L., & Brearley, S. G. (2017). Guidance on Conducting and REporting DElphi Studies (CREDES) in palliative care: Recommendations based on a methodological systematic review. Palliative Medicine, 31(8), 684–706.\nKrueger, R. A., & Casey, M. A. (2015). Focus groups: A practical guide for applied research (5th ed.). Sage.\nTong, A., Sainsbury, P., & Craig, J. (2007). Consolidated criteria for reporting qualitative research (COREQ): A 32-item checklist for interviews and focus groups. International Journal for Quality in Health Care, 19(6), 349–357.","irb_inst":"〔大學名稱〕〔系所〕；第一階段場域：北部 4 個失智社區服務據點","irb_period":"2026 年 9 月至 2027 年 8 月（自 IRB 核准日起執行）","irb_review":"建議簡易審查：成年工作人員與家庭照顧者之焦點團體、專家意見問卷，屬最小風險；是否符合，以送審機構之判定為準。","irb_n":"第一階段：焦點團體 4 場（工作人員 2 場、家庭照顧者 2 場），每場 6–8 人，共約 28 人；第二階段：專家 18 人。","irb_recruit":"由據點張貼招募說明並轉交邀請信，有意願者主動聯繫研究者；據點主管不參與名單確認，參與與否不影響長者服務或工作人員考核。","irb_vuln":"否。參與者為成年工作人員與家庭照顧者；失智長者本人不參與。家屬因長者使用據點服務，邀請時以書面說明參與與否不影響服務。","irb_task":"焦點團體：一次約 90 分鐘，與 6–8 位同樣身分的人一起聊聊對據點服務的看法（錄音），家屬場次提供長者照顧安排。德菲專家：2–3 回合線上問卷，每回合約 30 分鐘。","irb_withdraw":"焦點團體結束前可隨時退出；結束後可告知撤回，其發言將自逐字稿刪除（已與他人對話交織之內容將以不可辨識方式處理）。德菲專家可於任一回合前退出。","irb_benefit":"無直接利益；焦點團體參與者致贈〔　〕元禮券，專家致贈〔　〕元審查費。研究結果可協助據點改善服務。","irb_harm":"屬最小風險；若談到照顧壓力感到不適，可隨時暫停，研究者將提供家屬支持資源。對研究有疑問可聯絡研究者或〔送審機構 IRB 名稱與電話〕。","irb_material":"研究材料為焦點團體錄音與逐字稿、專家問卷資料。錄音於核對後刪除；去識別化資料保存至研究結束後 3 年，期滿以不可回復方式刪除；不作本計畫以外之用途。","irb_waive":"部分：焦點團體參與者簽署書面同意書；德菲專家問卷申請免除書面同意，改以線上說明並勾選同意。","irb_ad":"【失智據點服務意見邀請】什麼樣的據點服務才是「好服務」？我們想邀請據點工作人員與家屬參加約 90 分鐘的小團體座談，分享您的看法，協助據點與政府把服務做得更好。參與與否不影響任何服務或考核。聯絡人：〔研究生姓名〕〔電話／電子郵件〕。","irb_pi":"〔指導教授姓名〕，〔職稱〕，〔系所〕；職責：計畫督導、研究倫理與參與者保護之最終責任","irb_copi":"〔研究生姓名〕（協同主持人，負責焦點團體主持、內容分析、德菲法執行）；記錄者〔姓名〕；均已完成研究倫理訓練（證明附後）","irb_contact":"〔研究生姓名〕；電話〔　〕；電子郵件〔　〕","irb_fund":"本研究無外部經費補助，所需經費由研究者自籌。","irb_commercial":"本研究不涉及商業利益，研究結果不作商業用途。"},"objs":[{"verb":"探討","text":"探討據點工作人員與家庭照顧者對失智社區服務據點服務品質之看法","hyp":"","analysis":"導向式內容分析（以 Donabedian 三構面為初始類目），比較工作人員與家屬之類目差異","crit":"雙人編碼前 2 場；第 4 場無新類目視為足夠，否則加開","sens":"依據點承辦單位類型比較","exp":"預期除課程與人力外，出現「家屬被理解與支持」「長者被尊重地參與」「轉介與追蹤」等文獻少見之品質面向。"},{"verb":"開發","text":"整合焦點團體類目、文獻與既有考核項目初擬服務品質指標","hyp":"","analysis":"類目轉寫為可檢核指標，建立「來源 → 指標」對照表；2 位專家預閱","crit":"每項指標可提出文件、紀錄或調查佐證，並標明來源","sens":"—","exp":"預期初擬 3 構面約 30 項指標，其中約三分之一來自焦點團體。"},{"verb":"描述","text":"描述專家對指標重要性與可行性之共識結果","hyp":"","analysis":"每回合 M、SD、Mode、QD；依事先界定判準保留、修改或刪除","crit":"重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）皆達成者保留；停止條件：全數達共識或連續兩回合 QD 變化 < 0.1","sens":"排除家屬團體代表後重算共識；比較來自焦點團體與來自文獻之指標共識率","exp":"預期 2–3 回合內多數指標達共識；若來自焦點團體之結果指標可行性較低，表示需發展簡便之家屬回饋工具。"}],"vars":[{"name":"品質類目","role":"探索","concept":"工作人員與家屬認為之服務品質面向","oper":"導向式內容分析之類目與子類目","tool":"焦點團體逐字稿","scale":"","time":"第一階段","rel":"雙人編碼；COREQ"},{"name":"指標重要性","role":"依變項","concept":"專家認為該指標對據點服務品質之重要程度","oper":"5 點量尺（1 非常不重要～5 非常重要）","tool":"德菲問卷","scale":"次序","time":"每回合","rel":"Hasson 等人（2000）"},{"name":"指標可行性","role":"依變項","concept":"據點蒐集該指標資料之可行程度","oper":"5 點量尺（1 非常不可行～5 非常可行）","tool":"德菲問卷","scale":"次序","time":"每回合","rel":"同上"},{"name":"共識程度","role":"依變項","concept":"專家意見集中程度","oper":"M、Mode、QD","tool":"計算","scale":"等距","time":"每回合","rel":"Burnette 等人（2003）"},{"name":"專家職類","role":"控制","concept":"專家背景","oper":"據點負責人／個管師／主管機關／學者／家屬團體","tool":"基本資料表","scale":"名目","time":"第一回合","rel":"—"}],"bias":[{"name":"團體壓力與從眾","why":"焦點團體中發言較多者可能主導意見","fix":"主持人邀請每位發言；工作人員與家屬分場；記錄非語言互動"},{"name":"社會期許偏差","why":"家屬可能擔心影響服務而只談正面經驗","fix":"據點人員不在場；匿名約定；以具體事件提問"},{"name":"專家選擇偏差","why":"專家來自研究者熟悉之網絡","fix":"五類職類配額並兼顧都會與非都會"},{"name":"從眾效應（德菲）","why":"專家看到群體統計後向中間靠攏","fix":"改分需說明理由；報告各回合分數變化"}],"gantt":{"n":12,"rows":[{"t":"IRB 送審與核准","s":1,"e":2},{"t":"焦點團體（訪談）","s":3,"e":4},{"t":"內容分析與初擬指標","s":4,"e":5},{"t":"第一、二回合德菲","s":6,"e":7},{"t":"第三回合德菲與定稿（如需要）","s":8,"e":8},{"t":"論文撰寫","s":8,"e":11},{"t":"緩衝（加開場次、加開回合）","s":10,"e":11},{"t":"論文口試","s":12,"e":12}]},"risks":[{"r":"家屬焦點團體招募不足","trig":"單場報名少於 5 人","when":"M3","plan":"合併兩據點家屬同場，或改為 2–3 人小團體訪談並說明"},{"r":"新類目持續出現","trig":"第 4 場仍出現新類目","when":"M4","plan":"每類加開 1 場（最多 6 場），使用緩衝月"},{"r":"專家回收率低","trig":"第一回合回收少於 13 位","when":"M6","plan":"電話提醒並延長 1 週；增邀備選專家（僅第一回合可補）"},{"r":"共識難以收斂","trig":"第三回合仍有逾 3 成指標未達共識","when":"M8","plan":"依停止條件結束，如實報告未達共識指標"}],"kpi":[{"name":"完成焦點團體場次（產出指標）","calc":"完成並轉錄之場次","base":"0","goal":"第 4 月前 4 場"},{"name":"達共識指標數（產出指標）","calc":"最後一回合達高度共識之指標數","base":"初擬指標數","goal":"第 8 月前完成"}],"ss":{}}},"GF":{"label":"G→F 回顧初擬再德菲：醫院 AI 治理檢核指標","grp":1,"data":{"meta":{"type":"F","type2":"G 系統性／範域回顧"},"f":{"cv_school":"〔學校名稱〕","cv_dept":"〔系所名稱〕碩士班","cv_student":"〔研究生姓名〕","cv_advisor":"〔指導教授姓名〕　博士","cv_date":"中華民國 115 年 8 月","s1_1":"醫院陸續導入 AI 系統，但缺乏一套可檢核治理是否到位的指標，資訊、醫品與法務各自為政。","s1_2":"第一階段：AI 醫療治理相關文獻與指引；第二階段：資訊、醫品、法務、臨床主管與學者等專家 18 位。","s1_3":"範域回顧整理治理構面與指標；德菲法形成共識。","s1_4":"第一階段：構面與指標清單；第二階段：重要性與可行性評分之共識。","s1_5":"醫院導入 AI 系統之治理檢核應包含哪些構面與指標？","s1_6":"G→F：範域回顧（PRISMA-ScR）初擬指標 → 2–3 回合德菲法。","s1_7":"第一階段不涉及人體研究；第二階段專家線上同意。","s1_8":"12 個月：範域回顧 5 個月、德菲 4 個月、撰寫，保留兩個月緩衝。","s1_9":"產出可供醫院自評之 AI 治理檢核指標。","m1_scene":"醫院導入 AI 影像判讀、風險預測與病歷摘要等系統的速度很快，但導入前是否評估效能與偏誤、上線後誰負責監測表現是否下降、出錯時如何通報與暫停、廠商更新模型時是否重新驗證、何時退場，各院做法差異很大。部分醫院成立 AI 委員會，但委員會該檢核什麼、檢核到什麼程度，仍缺乏共同的語言。","m1_gap":"目前醫院多依單一法規（如個資法、醫療器材管理法）或廠商文件處理，缺乏涵蓋導入前、上線中與退場的整體治理檢核指標；資訊、醫品與法務各自檢核自己的部分，常出現「每個單位都以為別人負責」的缺口，例如上線後表現監測與使用者回報機制。","m1_new":"世界衛生組織（2021）提出健康 AI 之倫理與治理六大原則；美國國家標準與技術研究院發布 AI 風險管理框架，以治理、映射、量測、管理四功能組織 AI 風險管理活動（National Institute of Standards and Technology [NIST], 2023）。然而，原則性文件難以直接作為醫院可操作的檢核指標；範域回顧適合系統性盤點分散於研究、指引與政策文件中的治理做法（Arksey & O'Malley, 2005），再以德菲法讓國內專家判斷其重要性與可行性。","m1_time":"主管機關與醫院評鑑逐步關注 AI 應用的治理，多家醫學中心正成立或調整 AI 委員會；醫院需要在評鑑要求出現前建立自評工具，本研究可於 12 個月內提供具文獻依據與專家共識之版本。","m1_stmt":"因此，本研究擬先以範域回顧整理醫療機構 AI 治理之構面與具體做法，再以修正式德菲法形成醫院可用之 AI 治理檢核指標。","m2_pico":"第一階段 PCC｜P：醫療機構｜C：AI 系統之治理（導入、監測、退場）｜C：政策指引、框架與實證研究。第二階段｜P：跨職類專家｜I：德菲法｜O：達共識之構面與指標","m2_search":"資料庫：PubMed、Embase、Scopus、華藝；灰色文獻：WHO、NIST、各國主管機關網站。\nPubMed 範例：（\"Artificial Intelligence\"[Mesh] OR \"machine learning\"[tiab]）AND（governance[tiab] OR oversight[tiab] OR \"risk management\"[tiab] OR accountability[tiab]）AND（hospital*[tiab] OR \"health care\"[tiab]）\n2015 年以後、中英文。完整檢索式、日期與筆數見附錄一（教學示意：請以自己實際執行的檢索為準）。","m2_body":"一、治理原則。世界衛生組織（2021）提出保護自主、促進福祉與安全、透明與可解釋、問責、包容與公平、可回應與永續等六項原則；NIST（2023）以治理、映射、量測與管理四項功能架構 AI 風險管理。對本研究的意義：兩者提供初擬構面的上位框架。\n二、範域回顧方法。範域回顧適合盤點概念與證據範圍（Arksey & O'Malley, 2005），依 JBI 方法指引（Peters et al., 2020）執行並依 PRISMA-ScR 報告（Tricco et al., 2018）。\n三、德菲法。依 Hasson 等人（2000）之準則執行，共識判準於第一回合前界定並報告（Diamond et al., 2014）。","m2_known":"國際組織已提出 AI 醫療治理原則與風險管理框架（World Health Organization, 2021；NIST, 2023）。","m2_unknown":"然而，將國際原則與框架轉為醫院可操作、可提出佐證、涵蓋 AI 系統全生命週期，且經國內資訊、醫品、法務、臨床與學術跨職類專家共識之檢核指標，仍付之闕如；既有文獻中「上線後監測」與「退場」之具體做法尤其零散。","m2_worth":"此缺口使醫院無法自評治理缺口，委員會運作缺乏依據；本研究以範域回顧加德菲法，產出每項皆有文獻出處且具共識程度之指標，可直接作為醫院自評與評鑑準備之工具。","m2_theory":"以 NIST AI 風險管理框架（National Institute of Standards and Technology [NIST], 2023）之四功能與世界衛生組織（2021）六原則為初擬架構；兩階段銜接：範域回顧萃取之指標清單即為德菲第一回合問卷。","m2_orig":"本計畫將國際治理原則透過範域回顧轉為具體指標，再由國內醫院資訊、醫品、法務與臨床專家形成共識，產出可直接自評的工具。","m3_rq":"醫院導入 AI 系統之治理檢核，專家可形成共識的構面與指標有哪些？","m3_terms":"AI 治理：醫院對 AI 系統之導入評估、上線監測、事件通報、版本變更與退場等管理機制。\n範域回顧：系統性盤點某主題之研究範圍、概念與證據類型，不合併效果（Arksey & O'Malley, 2005；Peters et al., 2020）。\n共識：重要性（平均數 M ≥ 3.5 或眾數 Mode ≥ 3）且一致性（四分位差 QD < 1 或標準差 SD ≤ 1）兩組皆達成者為達共識（Burnette et al., 2003）；判準與停止規則於第一回合前寫定，保留、修改與刪除條件互斥。","m3_scope":"研究範圍為醫院層級之 AI 系統治理，涵蓋導入前評估、上線中監測與事件管理、版本變更與退場；第一階段文獻檢索期間為 2015 年至檢索日。本研究不含 AI 醫療器材之上市審查，不評估個別 AI 系統效能，亦不以指標實地評核醫院。","m4_frame":"第一階段：依 PCC 萃取文獻中的治理構面與具體做法，依 NIST 四功能歸類為初擬指標。第二階段：專家評各指標之重要性與可行性，依判準保留、修改或刪除，形成最終檢核指標。","m5_design":"本研究採兩階段設計（G→F）：第一階段為範域回顧，依 JBI 方法與 PRISMA-ScR；第二階段為修正式德菲法，以第一階段指標清單作為第一回合問卷。","m5_reject":"不只做範域回顧，因文獻指標未必適用國內醫院之法規與資源條件，需要專家判斷；不直接做德菲法，因缺乏系統性整理的初擬指標，專家意見易受個人經驗侷限；不採系統性回顧，因本研究目的在盤點治理做法而非估計效果，且多數來源為指引與政策文件，無法做偏誤評估與合併。","m5_site":"第一階段資料來源為已發表文獻與公開指引。第二階段專家透過指導教授與醫院協會網絡邀請，已有 10 位口頭同意（附錄二）。","m5_incl":"第一階段納入：討論醫療機構 AI 治理機制之研究、指引或框架。排除：只討論演算法技術、無治理內容者。第二階段專家：醫院資訊、醫品、法務、臨床主管或學者，相關經驗 5 年以上。","m5_sample":"第一階段納入文獻數無法事先決定，兩人以 50 篇試篩，κ ≥ 0.6 後正式篩選。第二階段專家 18 位，五類各 3–4 位；每回合回收率目標 70% 以上（至少 13 位）。","m5_tool":"一、範域回顧：檢索紀錄表、Rayyan 篩選、萃取表（文獻類型、治理構面、具體做法、適用階段）。\n二、德菲問卷：每項指標評重要性與可行性 5 點量尺，附修改建議欄；第二回合起附群體 M、Mode、QD。\n三、專家基本資料表。","m5_flow":"一、第 1–2 月：範域回顧計畫書並註冊 OSF；檢索。\n二、第 3–4 月：兩人獨立篩選與萃取。\n三、第 5 月：歸納構面與初擬指標；IRB 送審第二階段。\n四、第 6–8 月：第一、二回合德菲（必要時第三回合）。\n五、第 9 月：定稿指標體系。","m5_innov":"以範域回顧提供可追溯之初擬依據（每項指標附出處），再以跨職類德菲法調整為國內可行版本。","m6_common":"第一階段以敘述統合與構面對照表呈現，計算各構面出現之文獻數與文獻類型。第二階段每回合計算重要性與可行性之 M、SD、Mode 與 QD；重要性（M ≥ 3.5 或 Mode ≥ 3）且一致性（QD < 1 或 SD ≤ 1）皆達成者保留，連續兩回合重要性未達（M < 3.5 且 Mode < 3）者刪除，其餘修改後再評（三類互斥）；停止條件：全數達共識或連續兩回合 QD 變化 < 0.1。分析以 Excel 與 R（版本寫明）執行。","m6_qual":"範域回顧之治理做法以內容分析歸類至 NIST 四功能；德菲修改建議以內容分析整理，作為修正措辭與增刪之依據，記錄每項變更理由。","m7_irb":"第一階段只使用已公開之文獻與指引，不屬人體研究，無須送審。第二階段專家問卷將送〔大學〕研究倫理審查委員會審查，屬專家意見問卷、最小風險，預計申請簡易審查並以線上同意代替書面同意，以審查會認定為準；於第 5 月送審。","m7_consent":"第一階段不適用。第二階段專家於第一回合問卷首頁閱讀研究說明（目的、回合數、每回合約 30 分鐘、匿名方式、可隨時退出），勾選同意後作答（申請免除書面同意）。","m7_risk":"屬最小風險；問卷內容為專業意見，不涉及個人敏感資料。專家可能擔心對所屬醫院治理現況的評論被識別，故全程以代號處理，回饋只呈現群體統計與匿名意見；專家可隨時退出。","m7_deid":"專家以代號處理，回饋只呈現群體統計；對照表加密保管。萃取表與檢索紀錄公開於 OSF；德菲資料保存至研究結束後 3 年後刪除。","m7_coi":"專家中如有 AI 廠商相關人員，將揭露並做排除敏感度分析。生成式 AI 不用於篩選與萃取判斷。","m8_feas":"人力：第二位評估者已同意參與範域回顧，兩人已完成 JBI 範域回顧線上課程。專家：已有 10 位口頭同意（附錄二），另 8 位邀請中，並備有備選名單。文獻：初步試查 PubMed 與國際組織網站已找到 40 篇以上相關文件。時間：範域回顧 5 個月、德菲 4 個月，保留兩個月緩衝。","m9_acad":"將國際 AI 治理原則與框架轉為醫院可操作之指標，每項指標附文獻出處與共識程度，並示範「範域回顧 → 德菲法」之 G→F 兩階段指標建構流程。","m9_prac":"醫院可用指標自評 AI 治理缺口，作為 AI 委員會運作、評鑑準備與採購規格之依據；主管機關可參考作為未來評鑑基準之草案。","m9_limd":"指標來自文獻與專家共識，代表專家判斷而非實證效果，未實地施測信效度與鑑別力；專家組成影響結果，推論至基層醫療院所需保守。","m9_lime":"AI 治理文件更新快速，檢索後新發布之指引無法納入，將於討論中說明檢索截止日；回合間專家流失可能影響共識代表性，將報告各回合回收率。","m9_train":"參與之碩士生將習得範域回顧、文獻萃取、德菲法與共識分析（教學示意）。","m9_output":"預計投稿期刊論文 2 篇（範域回顧、德菲研究各 1 篇），並產出檢核指標草案（教學示意）。","m9_nation":"回應醫療 AI 快速導入之治理需求，提供醫院與主管機關可參考之檢核工具。","t_iv":"範域回顧與德菲法","t_pop":"醫院","t_out":"AI 治理檢核指標","t_des":"兩階段研究","m10_title":"醫院導入 AI 系統之治理檢核指標建構：範域回顧與德菲法研究","m10_title_en":"Developing Governance Checklist Indicators for Hospital Adoption of Artificial Intelligence Systems: A Scoping Review and Delphi Study","m10_kw":"人工智慧、治理、醫院、範域回顧、德菲法","m10_abs":"醫院陸續導入 AI 系統，但缺乏可檢核治理是否到位之指標，資訊、醫品與法務各自檢核常有缺口。本研究旨在建構醫院導入 AI 系統之治理檢核指標。第一階段依 JBI 方法與 PRISMA-ScR 進行範域回顧，檢索資料庫與國際組織指引，兩人獨立篩選與萃取治理構面與具體做法，依 NIST AI 風險管理框架之治理、映射、量測、管理四功能歸類為初擬指標；第二階段邀請醫院資訊、醫品、法務、臨床主管與學者共 18 位專家，進行 2–3 回合修正式德菲法，評估重要性與可行性，以重要性（平均數 ≥ 3.5 或眾數 ≥ 3）且一致性（四分位差 < 1 或標準差 ≤ 1）為共識判準。預期產出具文獻依據且經共識之治理檢核指標，供醫院自評與評鑑準備。","m10_refs":"Arksey, H., & O'Malley, L. (2005). Scoping studies: Towards a methodological framework. International Journal of Social Research Methodology, 8(1), 19–32.\nBurnette, D., Morrow-Howell, N., & Chen, L. M. (2003). Setting priorities for gerontological social work research: A national Delphi study. The Gerontologist, 43(6), 828–838.\nDiamond, I. R., Grant, R. C., Feldman, B. M., Pencharz, P. B., Ling, S. C., Moore, A. M., & Wales, P. W. (2014). Defining consensus: A systematic review recommends methodologic criteria for reporting of Delphi studies. Journal of Clinical E
