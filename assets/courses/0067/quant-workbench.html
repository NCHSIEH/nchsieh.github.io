function fmtP(p){
  if(!isFinite(p) || p<0) return "p < .001";
  if(p < 0.001) return "p < .001";
  return "p ＝ ." + p.toFixed(3).slice(2);
}

function qt975(df){
  const z = 1.959963984540054;
  const g1 = (z*z*z + z) / 4;
  const g2 = (5*Math.pow(z,5) + 16*z*z*z + 3*z) / 96;
  return z + g1/df + g2/(df*df);
}

function calcStatLab(L){
  const dv = L.dv_name || "依變項";
  const u = L.unit || "分";
  if(L.mode==="paired"){
    const n = Math.max(2, parseInt(L.n1)||34);
    const md = parseFloat(L.md);
    const sdd = Math.max(0.0001, parseFloat(L.sdd)||4.97);
    const se = sdd / Math.sqrt(n);
    const t = md / se;
    const df = n - 1;
    const tcrit = qt975(df);
    const ciL = md - tcrit*se, ciU = md + tcrit*se;
    const dz = md / sdd;
    const p = Math.min(0.999, 2 * (1 - pnorm(Math.abs(t) * (1 - 1/(4*df)))));
    const mag = Math.abs(dz)>=0.8 ? "大型" : (Math.abs(dz)>=0.5 ? "中等" : "小型");
    const sentence = `配對樣本 t 檢定結果顯示，介入後之${dv}（M ＝ ${Number(L.m2).toFixed(2)}, SD ＝ ${Number(L.sd2).toFixed(2)} ${u}）與介入前（M ＝ ${Number(L.m1).toFixed(2)}, SD ＝ ${Number(L.sd1).toFixed(2)} ${u}）相比呈現顯著差異，平均配對差值 d̄ ＝ ${md.toFixed(2)} ${u}（SD_d ＝ ${sdd.toFixed(2)}, SE ＝ ${se.toFixed(2)}），95% CI [${ciL.toFixed(2)}, ${ciU.toFixed(2)}]，t(${df}) ＝ ${t.toFixed(2)}, ${fmtP(p)}，效應量 Cohen's dz ＝ ${dz.toFixed(2)}，屬${mag}效應。`;
    return {stat:`t(${df}) ＝ ${t.toFixed(2)}, ${fmtP(p)}`, es:`Cohen's dz ＝ ${dz.toFixed(2)}, 95% CI [${ciL.toFixed(2)}, ${ciU.toFixed(2)}]`, sentence};
  }
  if(L.mode==="ind"){
    const n1 = Math.max(2, parseInt(L.n1)||64), n2 = Math.max(2, parseInt(L.n2)||64);
    const m1 = parseFloat(L.m1)||0, m2 = parseFloat(L.m2)||0;
    const sd1 = Math.max(0.0001, parseFloat(L.sd1)||1), sd2 = Math.max(0.0001, parseFloat(L.sd2)||1);
    const df = n1 + n2 - 2;
    const sp = Math.sqrt(((n1-1)*sd1*sd1 + (n2-1)*sd2*sd2) / df);
    const se = sp * Math.sqrt(1/n1 + 1/n2);
    const diff = m1 - m2;
    const t = diff / se;
    const tcrit = qt975(df);
    const ciL = diff - tcrit*se, ciU = diff + tcrit*se;
    const d = diff / sp;
    const p = Math.min(0.999, 2 * (1 - pnorm(Math.abs(t) * (1 - 1/(4*df)))));
    const mag = Math.abs(d)>=0.8 ? "大型" : (Math.abs(d)>=0.5 ? "中等" : "小型");
    const sentence = `獨立樣本 t 檢定結果顯示，實驗組之${dv}（M ＝ ${m1.toFixed(2)}, SD ＝ ${sd1.toFixed(2)}, n ＝ ${n1}）與對照組（M ＝ ${m2.toFixed(2)}, SD ＝ ${sd2.toFixed(2)}, n ＝ ${n2}）存在顯著差異，兩組平均差 Δ ＝ ${diff.toFixed(2)} ${u}（SE ＝ ${se.toFixed(2)}），95% CI [${ciL.toFixed(2)}, ${ciU.toFixed(2)}]，t(${df}) ＝ ${t.toFixed(2)}, ${fmtP(p)}，效應量 Cohen's d ＝ ${d.toFixed(2)}，屬${mag}效應。`;
    return {stat:`t(${df}) ＝ ${t.toFixed(2)}, ${fmtP(p)}`, es:`Cohen's d ＝ ${d.toFixed(2)}, 95% CI [${ciL.toFixed(2)}, ${ciU.toFixed(2)}]`, sentence};
  }
  if(L.mode==="did"){
    const ne = Math.max(2, parseInt(L.ne)||34), nc = Math.max(2, parseInt(L.nc)||28);
    const de = parseFloat(L.did_e)||0, dc = parseFloat(L.did_c)||0;
    const sde = Math.max(0.0001, parseFloat(L.sde)||1), sdc = Math.max(0.0001, parseFloat(L.sdc)||1);
    const df = ne + nc - 2;
    const se = Math.sqrt(sde*sde/ne + sdc*sdc/nc);
    const did = de - dc;
    const t = did / se;
    const tcrit = qt975(df);
    const ciL = did - tcrit*se, ciU = did + tcrit*se;
    const sp = Math.sqrt(((ne-1)*sde*sde + (nc-1)*sdc*sdc)/df);
    const d = did / sp;
    const p = Math.min(0.999, 2 * (1 - pnorm(Math.abs(t) * (1 - 1/(4*df)))));
    const sentence = `混合設計／雙重差分（DiD）分析顯示，實驗組之前後變化量（M ＝ ${de.toFixed(2)}, SD ＝ ${sde.toFixed(2)}, n ＝ ${ne}）與同期對照組之前後變化量（M ＝ ${dc.toFixed(2)}, SD ＝ ${sdc.toFixed(2)}, n ＝ ${nc}）存在顯著組別 × 時間交互作用，淨效應 DiD ＝ ${did.toFixed(2)} ${u}（SE ＝ ${se.toFixed(2)}），95% CI [${ciL.toFixed(2)}, ${ciU.toFixed(2)}]，t(${df}) ＝ ${t.toFixed(2)}, ${fmtP(p)}，進步量組間效應量 Cohen's d ＝ ${d.toFixed(2)}。`;
    return {stat:`DiD ＝ ${did.toFixed(2)} ${u}, t(${df}) ＝ ${t.toFixed(2)}, ${fmtP(p)}`, es:`95% CI [${ciL.toFixed(2)}, ${ciU.toFixed(2)}], d ＝ ${d.toFixed(2)}`, sentence};
  }
  if(L.mode==="corr"){
    const n = Math.max(5, parseInt(L.r_n)||210);
    const r = Math.min(0.99, Math.max(-0.99, parseFloat(L.r_val)||0.46));
    const df = n - 2;
    const t = r * Math.sqrt(df / (1 - r*r));
    const zr = 0.5 * Math.log((1+r)/(1-r));
    const sez = 1 / Math.sqrt(n - 3);
    const zL = zr - 1.96*sez, zU = zr + 1.96*sez;
    const rL = (Math.exp(2*zL)-1)/(Math.exp(2*zL)+1), rU = (Math.exp(2*zU)-1)/(Math.exp(2*zU)+1);
    const p = Math.min(0.999, 2 * (1 - pnorm(Math.abs(t))));
    const sentence = `Pearson 積差相關分析結果顯示，自變項與${dv}之間呈顯著相關，r(${df}) ＝ ${r.toFixed(2)}，95% CI [${rL.toFixed(2)}, ${rU.toFixed(2)}]，t(${df}) ＝ ${t.toFixed(2)}, ${fmtP(p)}，決定係數 R² ＝ ${(r*r).toFixed(3)}（可解釋 ${(r*r*100).toFixed(1)}% 之變異）。`;
    return {stat:`r(${df}) ＝ ${r.toFixed(2)}, ${fmtP(p)}`, es:`95% CI [${rL.toFixed(2)}, ${rU.toFixed(2)}], R² ＝ ${(r*r).toFixed(3)}`, sentence};
  }
  if(L.mode==="chisq"){
    const a = Math.max(1, parseInt(L.a)||81), b = Math.max(1, parseInt(L.b)||19);
    const c = Math.max(1, parseInt(L.c)||62), d = Math.max(1, parseInt(L.d)||38);
    const N = a + b + c + d;
    const p1 = a/(a+b), p2 = c/(c+d);
    const rd = p1 - p2;
    const chi2 = (N * Math.pow(a*d - b*c, 2)) / ((a+b)*(c+d)*(a+c)*(b+d));
    const phi = Math.sqrt(chi2 / N);
    const or = (a*d)/(b*c);
    const seLnOr = Math.sqrt(1/a + 1/b + 1/c + 1/d);
    const orL = Math.exp(Math.log(or) - 1.96*seLnOr), orU = Math.exp(Math.log(or) + 1.96*seLnOr);
    const z = Math.sqrt(chi2);
    const p = Math.min(0.999, 2 * (1 - pnorm(z)));
    const sentence = `Pearson 卡方獨立性檢定顯示，A 組之${dv}為 ${(p1*100).toFixed(1)}%（${a}/${a+b}），與 B 組之 ${(p2*100).toFixed(1)}%（${c}/${c+d}）達顯著差異，風險差 RD ＝ ${(rd*100).toFixed(1)}%，χ²(1, N ＝ ${N}) ＝ ${chi2.toFixed(2)}, ${fmtP(p)}，勝算比 OR ＝ ${or.toFixed(2)}，95% CI [${orL.toFixed(2)}, ${orU.toFixed(2)}]，效應量 φ ＝ ${phi.toFixed(2)}。`;
    return {stat:`χ²(1, N ＝ ${N}) ＝ ${chi2.toFixed(2)}, ${fmtP(p)}`, es:`OR ＝ ${or.toFixed(2)} [${orL.toFixed(2)}, ${orU.toFixed(2)}], φ ＝ ${phi.toFixed(2)}`, sentence};
  }
  // non-inferiority / TOST
  const n = Math.max(2, parseInt(L.ni_n)||34);
  const md = parseFloat(L.ni_d)||0.60;
  const sdd = Math.max(0.0001, parseFloat(L.ni_sd)||1.82);
  const margin = parseFloat(L.ni_margin)||-1.0;
  const se = sdd / Math.sqrt(n);
  const df = n - 1;
  const tcrit = qt975(df);
  const ciL = md - tcrit*se, ciU = md + tcrit*se;
  const t_ni = (md - margin) / se;
  const p_ni = 1 - pnorm(t_ni * (1 - 1/(4*df)));
  const pass = ciL > margin;
  const sentence = `非劣性檢定結果顯示，導入前後之${dv}平均變化量為 ${md>=0?"+"+md.toFixed(2):md.toFixed(2)} ± ${sdd.toFixed(2)} ${u}，95% CI [${ciL>=0?"+"+ciL.toFixed(2):ciL.toFixed(2)}, ${ciU>=0?"+"+ciU.toFixed(2):ciU.toFixed(2)}]；其 95% 信賴區間下界（${ciL.toFixed(2)} ${u}）${pass?"高於":"未高於"}預設臨床非劣性界限 Δ ＝ ${margin.toFixed(2)} ${u}（非劣性檢定 t(${df}) ＝ ${t_ni.toFixed(2)}, ${fmtP(p_ni)}），${pass?"證實介入在不降低品質下達成非劣性標準":"尚未通過非劣性標準"}。`;
  return {stat:`非劣性 t(${df}) ＝ ${t_ni.toFixed(2)}, ${fmtP(p_ni)}`, es:`95% CI [${ciL.toFixed(2)}, ${ciU.toFixed(2)}] vs 界限 Δ ＝ ${margin.toFixed(2)}`, sentence};
}

// 方法學一致性與常見錯誤自動檢查器
function issues(){
  const list = [];
  const ds = DESIGNS[S.design] || DESIGNS.quasi_did;
  const allSap = JSON.stringify(S.s6_sap||[]) + " " + (S.s5_assump||"") + " " + (S.s6_apa||"");
  const allText = [S.title,S.s1_rq,S.s1_h0h1,S.s2_principle,S.s3_assign,S.s4_power,S.s5_assump,S.s6_apa,S.s6_interp].join(" ");

  // 1. 檢查各步必填
  STEPS.filter(x=>x.id!=="setup" && x.id!=="review").forEach(st=>{
    if(stepPct(st)<100){
      list.push({lvl:"warn", step:st.id, msg:`【${st.code} ${st.name}】尚有未填寫完整之欄位（完成度 ${stepPct(st)}%）。`});
    }
  });

  // 2. 檢查待填括號 〔　〕
  if(/〔[^〕]*?(待填|　|請填)[^〕]*?〕/.test(allText)){
    list.push({lvl:"warn", step:"setup", msg:"內文中仍含有尚未替換之『〔　〕』填空標記，請於匯出前補充具體內容（研究者姓名欄位除外）。"});
  }

  // 3. 檢查 H0 / H1
  if(filled(S.s1_h0h1) && !(/H0|H₀|虛無假設/i.test(S.s1_h0h1) && /H1|H₁|對立假設/i.test(S.s1_h0h1))){
    list.push({lvl:"bad", step:"s1", msg:"【步驟 ① 假設檢查】尚未同時明確寫出虛無假設（H₀）與對立假設（H₁）。"});
  }

  // 4. 檢查研究設計與統計檢定之方法學匹配度
  if((S.design==="within_prepost" || S.design==="within_cross") && /獨立樣本\s*t/.test(allSap) && !/配對|重複測量|Wilcoxon|混合/.test(allSap)){
    list.push({lvl:"bad", step:"s6", msg:"【方法學嚴重衝突】你選擇了「組內設計（同一批人重複測量）」，但統計檢定卻只寫「獨立樣本 t 檢定」！組內設計必須使用「配對樣本 t 檢定、Wilcoxon 符號等級檢定或重複測量 ANOVA／混合模型」。"});
  }
  if((S.design==="rct" || S.design==="between") && /配對樣本\s*t/.test(allSap) && !/獨立樣本|ANCOVA|卡方|Mann|迴歸/.test(allSap)){
    list.push({lvl:"bad", step:"s6", msg:"【方法學嚴重衝突】你選擇了「平行組間設計（兩組不同受試者）」，但統計檢定卻寫「配對樣本 t 檢定」！組間設計應使用「獨立樣本 t 檢定、Welch t、Mann–Whitney U、ANCOVA 或卡方檢定」。"});
  }
  if((S.design==="mixed_rct" || S.design==="mixed_matched" || S.design==="quasi_did") && filled(S.s6_sap) && !/交互作用|Interaction|DiD|雙重差分|ANCOVA|混合/.test(allSap)){
    list.push({lvl:"bad", step:"s6", msg:"【混合／準實驗設計核心提醒】在「分組 × 前後測」設計中，不能只分別在兩組內各跑配對 t 檢定，必須檢驗「組別 × 時間交互作用（Group × Time Interaction）、雙重差分（DiD）或 ANCOVA」（@ 2.5 s47）！"});
  }
  if(S.design==="corr" && /導致|提升|降低|改善了/.test(S.s1_rq)){
    list.push({lvl:"warn", step:"s1", msg:"【觀察性研究因果分寸】你選擇了「觀察性相關與迴歸設計」，研究問題建議使用「相關、關聯、預測、解釋變異」，避免使用「導致、提升、降低」等因果字眼（@ 2.1 s31）。"});
  }

  // 5. 檢查樣本數五要素與流失率
  if(filled(S.s4_power)){
    if(!/(\.05|0\.05)/.test(S.s4_power) || !/(\.80|0\.80|\.85|\.90|80%|85%|90%)/.test(S.s4_power)){
      list.push({lvl:"warn", step:"s4", msg:"【步驟 ④ 樣本數檢查】先驗樣本數說明中建議明確寫出顯著水準（α ＝ .05）與目標統計檢定力（如 Power ＝ .80）。"});
    }
    if(!/流失|無效|停損|1\s*-\s*0\.|招募/.test(S.s4_power) && S.design!=="quasi_its"){
      list.push({lvl:"warn", step:"s4", msg:"【步驟 ④ 招募換算檢查】尚未說明預估流失率／無效問卷緩衝及最終預計招募人數 N ＝ ⌈n / (1 − 流失率)⌉。"});
    }
  }

  // 6. 檢查前提假設與無母數替代方案
  if(filled(S.s5_assump) && !/Shapiro|常態|Levene|Wilcoxon|Mann|Welch|Greenhouse|Fisher|Spearman|自相關|DW/.test(S.s5_assump)){
    list.push({lvl:"warn", step:"s5", msg:"【步驟 ⑤ 前提假設檢查】請明確寫出母數檢定之前提檢查（如 Shapiro–Wilk 常態性、Levene 等變異）及違反時之替代方案（如 Welch t、Wilcoxon、Mann–Whitney U）。"});
  }

  // 7. 檢查 APA 報告規範（效應量與 95% CI、不可寫 p=.000）
  if(/p\s*[=＝]\s*\.?000\b/.test(allText)){
    list.push({lvl:"bad", step:"s6", msg:"【APA 第 7 版格式錯誤】內文出現「p ＝ .000」！p 值永遠大於 0，極小值應寫為「p < .001」（@ 2.5 s75）。"});
  }
  if(filled(S.s6_apa) && (!/CI|信賴區間/.test(S.s6_apa) || !/Cohen|dz|d\s*[=＝]|η|OR|r\(|β|β₂/.test(S.s6_apa))){
    list.push({lvl:"warn", step:"s6", msg:"【步驟 ⑥ APA 報告完整性】結果報告句應同時包含「效應量（d / dz / η²p / r / OR）」與「95% 信賴區間（95% CI）」，不能只寫 p 值。"});
  }

  return list;
}

function fmtApaSlots(escapedStr, highlightSlots){
  if(!highlightSlots) return escapedStr;
  return escapedStr.replace(/〔([^〕]+)〕/g, '<span class="slot">〔$1〕</span>');
}

function renderApaTableHTML(t, highlightSlots){
  const fmt = (s)=>fmtApaSlots(esc(s), highlightSlots);
  return `<div class="apa-twrap">
    <div class="apa-tnum">${fmt(t.num)}</div>
    <div class="apa-ttitle">${fmt(t.title)}</div>
    <table class="apa-tbl">
      <thead>
        <tr>${t.headers.map((h,i)=>`<th style="width:${(t.colPcts&&t.colPcts[i])||Math.floor(100/t.headers.length)}%">${fmt(h)}</th>`).join("")}</tr>
      </thead>
      <tbody>
        ${(t.rows||[]).map(r=>`<tr>${t.headers.map((_,ci)=>{
          const lines = String((r&&r[ci])||"—").split(/\r?\n+/).map(s=>s.trim()).filter(Boolean);
          return `<td>${lines.map(l=>`<div>${fmt(l)}</div>`).join("") || "—"}</td>`;
        }).join("")}</tr>`).join("")}
      </tbody>
    </table>
    ${t.note ? `<div class="apa-tnote">${fmt(t.note)}</div>` : ""}
  </div>`;
}

function renderApaTextHTML(raw, highlightSlots){
  const fmt = (s)=>fmtApaSlots(esc(s), highlightSlots);
  const lines = String(raw || "（尚未填寫）").split(/\r?\n+/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length) return `<p class="apa-p">（尚未填寫）</p>`;
  return lines.map(line=>{
    const m = line.match(/^((?:[0-9]+[\.\、]|[①-⑳]|[\(（][0-9一二三四五六七八九十]+[\)）]|[・•\-]|【[^】]+】|\[[^\]]+\])\s*)(.*)$/);
    if(m){
      return `<p class="apa-item"><b>${fmt(m[1])}</b>${fmt(m[2])}</p>`;
    }
    return `<p class="apa-p">${fmt(line)}</p>`;
  }).join("");
}

function apaPreviewHTML(highlightSlots){
  const spec = apaDocSpec();
  const fmt = (s)=>fmtApaSlots(esc(s), highlightSlots);
  return `<div class="apa-page">
    <div class="apa-runhead">
      <span>${fmt(spec.runningHead)}</span>
      <span>APA 7th Edition Format</span>
    </div>
    <div class="apa-cover">
      <div class="apa-title">${fmt(spec.docTitle)}</div>
      <div class="apa-subtitle">${fmt(spec.studyTitle)}</div>
      <div class="apa-meta">${fmt(spec.authorLine)}<br>${fmt(spec.metaLine)}<br>${fmt(spec.guideLine)}</div>
    </div>
    ${renderApaTableHTML(spec.coverTable, highlightSlots)}
    ${spec.sections.map(sec=>`
      <div class="apa-h1">${fmt(sec.h1)}</div>
      ${sec.items.map(it=>{
        if(it.type==="h2") return `<div class="apa-h2">${fmt(it.text)}</div>`;
        if(it.type==="table") return renderApaTableHTML(it, highlightSlots);
        return renderApaTextHTML(it.text, highlightSlots);
      }).join("")}
    `).join("")}
  </div>`;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
}

  const ds = DESIGNS[S.design] || DESIGNS.quasi_did;

  lines.push("# 研究題目：" + (S.title || "量性研究設計"));

function loadDocxLib(){
  if(window.docx) return Promise.resolve(window.docx);
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js";
    s.onload = ()=>window.docx ? resolve(window.docx) : reject(new Error("docx load failed"));
    s.onerror = ()=>reject(new Error("network error"));
    document.head.appendChild(s);
  });
}

async function exportDocx(){
  const spec = apaDocSpec();
  const fname = `量性研究設計與統計分析計畫書_APA7_${S.design}_${S.date||"2026"}`;
  try{
    const dx = await loadDocxLib();
    const {
      Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
      WidthType, AlignmentType, HeadingLevel, BorderStyle,
      Header, Footer, PageNumber, PageBreak
    } = dx;

    // APA 7th Edition 中英字型設定：英數 Times New Roman、中文標楷體
    const FONT = { ascii: "Times New Roman", hAnsi: "Times New Roman", eastAsia: "標楷體", cs: "Times New Roman" };
    // A4 頁面（寬 11906 DXA，高 16838 DXA），四邊 1 吋（2.54 cm = 1440 DXA）標準邊界，可用內容寬度 9026 DXA
    const CONTENT_W = 9026;
    const LINE_APA = 360; // 1.5 倍行高（360 DXA），兼顧中文計畫書閱讀性與 APA 段落規範

    // APA Level 1 標題：置中、粗體、前後留白
    const mkH1 = (txt)=>new Paragraph({
      heading: HeadingLevel.HEADING_1,
      alignment: AlignmentType.CENTER,
      spacing: { before: 320, after: 160, line: LINE_APA },
      keepNext: true,
      children: [new TextRun({ text: txt, bold: true, size: 28, font: FONT, color: "000000" })]
    });

    // APA Level 2 標題：靠左對齊、粗體、前後留白
    const mkH2 = (txt)=>new Paragraph({
      heading: HeadingLevel.HEADING_2,
      alignment: AlignmentType.LEFT,
      spacing: { before: 240, after: 100, line: LINE_APA },
      keepNext: true,
      children: [new TextRun({ text: txt, bold: true, size: 25, font: FONT, color: "000000" })]
    });

    // APA 內文與條列解析：自動拆行，一般段落首行縮排 2 字元（480 DXA），編號／項目符號採凸排（Hanging Indent 480 DXA）並加粗導引詞
    const mkTextParas = (raw)=>{
      const lines = String(raw || "（尚未填寫）").split(/\r?\n+/).map(s=>s.trim()).filter(Boolean);
      if(!lines.length){
        return [new Paragraph({
          indent: { firstLine: 480 },
          spacing: { before: 40, after: 120, line: LINE_APA },
          children: [new TextRun({ text: "（尚未填寫）", size: 24, font: FONT })]
        })];
      }
      return lines.map(line=>{
        const m = line.match(/^((?:[0-9]+[\.\、]|[①-⑳]|[\(（][0-9一二三四五六七八九十]+[\)）]|[・•\-]|【[^】]+】|\[[^\]]+\])\s*)(.*)$/);
        if(m){
          return new Paragraph({
            alignment: AlignmentType.JUSTIFIED,
            indent: { left: 480, hanging: 480 },
            spacing: { before: 40, after: 120, line: LINE_APA },
            children: [
              new TextRun({ text: m[1], bold: true, size: 24, font: FONT }),
              new TextRun({ text: m[2], size: 24, font: FONT })
            ]
          });
        }
        return new Paragraph({
          alignment: AlignmentType.JUSTIFIED,
          indent: { firstLine: 480 },
          spacing: { before: 40, after: 120, line: LINE_APA },
          children: [new TextRun({ text: line, size: 24, font: FONT })]
        });
      });
    };

    // APA 第 7 版標準三線表（Three-Line Table）：
    // 表號粗體靠左 + 表題斜體靠左 + 頂線 1.5pt (size 12)、表頭底線 0.75pt (size 6)、表格底線 1.5pt (size 12)、無直線與內橫線 + 表註
    const mkApaTableBlock = (t)=>{
      const noneBdr = { style: BorderStyle.NONE, size: 0, color: "FFFFFF" };
      const topRule = { style: BorderStyle.SINGLE, size: 12, color: "000000" };
      const midRule = { style: BorderStyle.SINGLE, size: 6, color: "000000" };
      const botRule = { style: BorderStyle.SINGLE, size: 12, color: "000000" };
      const colPcts = t.colPcts || t.headers.map(()=>Math.floor(100 / t.headers.length));
      const colWidths = colPcts.map(p=>Math.round(CONTENT_W * (p / 100)));
      const safeRows = (t.rows && t.rows.length) ? t.rows : [t.headers.map(()=>"—")];

      const tbl = new Table({
        width: { size: CONTENT_W, type: WidthType.DXA },
        columnWidths: colWidths,
        rows: [
          new TableRow({
            tableHeader: true,
            children: t.headers.map((h, ci)=>new TableCell({
              width: { size: colWidths[ci], type: WidthType.DXA },
              margins: { top: 100, bottom: 100, left: 100, right: 100 },
              borders: { top: topRule, bottom: midRule, left: noneBdr, right: noneBdr },
              children: [new Paragraph({
                alignment: ci===0 ? AlignmentType.LEFT : AlignmentType.LEFT,
                spacing: { before: 20, after: 20, line: 280 },
                children: [new TextRun({ text: String(h || ""), bold: true, size: 21, font: FONT })]
              })]
            }))
          }),
          ...safeRows.map((r, ri)=>{
            const isLast = ri === safeRows.length - 1;
            return new TableRow({
              children: t.headers.map((_, ci)=>{
                const cellLines = String((r && r[ci]) || "—").split(/\r?\n+/).map(s=>s.trim()).filter(Boolean);
                return new TableCell({
                  width: { size: colWidths[ci], type: WidthType.DXA },
                  margins: { top: 80, bottom: 80, left: 100, right: 100 },
                  borders: {
                    top: noneBdr,
                    bottom: isLast ? botRule : noneBdr,
                    left: noneBdr,
                    right: noneBdr
                  },
                  children: (cellLines.length ? cellLines : ["—"]).map(line=>new Paragraph({
                    alignment: AlignmentType.LEFT,
                    spacing: { before: 20, after: 40, line: 280 },
                    children: [new TextRun({ text: line, size: 21, font: FONT })]
                  }))
                });
              })
            });
          })
        ]
      });

      const out = [
        new Paragraph({
          alignment: AlignmentType.LEFT,
          spacing: { before: 220, after: 40, line: 280 },
          keepNext: true,
          children: [new TextRun({ text: t.num, bold: true, size: 22, font: FONT })]
        }),
        new Paragraph({
          alignment: AlignmentType.LEFT,
          spacing: { before: 0, after: 80, line: 280 },
          keepNext: true,
          children: [new TextRun({ text: t.title, italics: true, size: 22, font: FONT })]
        }),
        tbl
      ];
      if(t.note){
        out.push(new Paragraph({
          alignment: AlignmentType.LEFT,
          spacing: { before: 60, after: 180, line: 280 },
          children: [
            new TextRun({ text: "註：", italics: true, bold: true, size: 20, font: FONT }),
            new TextRun({ text: String(t.note).replace(/^註[：:]\s*/, ""), size: 20, font: FONT })
          ]
        }));
      }
      return out;
    };

    const children = [
      // APA 封面標題區
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 120, after: 120, line: LINE_APA },
        children: [new TextRun({ text: spec.docTitle, bold: true, size: 34, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 0, after: 200, line: LINE_APA },
        children: [new TextRun({ text: spec.studyTitle, bold: true, size: 28, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 0, after: 60, line: 300 },
        children: [new TextRun({ text: spec.authorLine, size: 22, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 0, after: 60, line: 300 },
        children: [new TextRun({ text: spec.metaLine, size: 22, font: FONT })]
      }),
      new Paragraph({
        alignment: AlignmentType.CENTER,
        spacing: { before: 0, after: 200, line: 300 },
        children: [new TextRun({ text: spec.guideLine, size: 22, font: FONT })]
      }),
      ...mkApaTableBlock(spec.coverTable)
    ];

    spec.sections.forEach(sec=>{
      children.push(mkH1(sec.h1));
      sec.items.forEach(it=>{
        if(it.type === "h2") children.push(mkH2(it.text));
        else if(it.type === "table") children.push(...mkApaTableBlock(it));
        else children.push(...mkTextParas(it.text));
      });
    });

    const doc = new Document({
      sections: [{
        properties: {
          page: {
            size: { width: 11906, height: 16838 },
            margin: { top: 1440, right: 1440, bottom: 1440, left: 1440 }
          }
        },
        headers: {
          default: new Header({
            children: [
              new Paragraph({
                alignment: AlignmentType.LEFT,
                spacing: { after: 80 },
                children: [
                  new TextRun({ text: spec.runningHead, size: 18, font: FONT, color: "444444" }),
                  new TextRun({ text: "　　Page ", size: 18, font: FONT, color: "444444" }),
                  new TextRun({ children: [PageNumber.CURRENT], size: 18, font: FONT, color: "444444" })
                ]
              })
            ]
          })
        },
        footers: {
          default: new Footer({
            children: [
              new Paragraph({
                alignment: AlignmentType.CENTER,
                children: [
                  new TextRun({ text: "第 ", size: 18, font: FONT, color: "555555" }),
                  new TextRun({ children: [PageNumber.CURRENT], size: 18, font: FONT, color: "555555" }),
                  new TextRun({ text: " 頁 ／ 共 ", size: 18, font: FONT, color: "555555" }),
                  new TextRun({ children: [PageNumber.TOTAL_PAGES], size: 18, font: FONT, color: "555555" }),
                  new TextRun({ text: " 頁（APA 7th Edition Format）", size: 18, font: FONT, color: "555555" })
                ]
              })
            ]
          })
        },
        children
      }]
    });

    const blob = await Packer.toBlob(doc);
    downloadBlob(blob, fname + ".docx");
  }catch(e){
    // 離線備援：輸出完整 APA 第 7 版結構化 HTML 表格與段落給 Word 開啟（絕不使用會被 Word 忽略的 pre-wrap）
    const wordHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>${esc(spec.studyTitle)}</title>
<style>
  @page { size: A4; margin: 2.54cm; }
  body { font-family: "Times New Roman", "標楷體", "DFKai-SB", serif; font-size: 12pt; line-height: 1.8; color: #000; }
  .apa-runhead { font-size: 9.5pt; color: #444; border-bottom: 1px solid #ccc; padding-bottom: 4pt; margin-bottom: 14pt; }
  .apa-cover { text-align: center; margin-bottom: 16pt; }
  .apa-title { font-size: 16pt; font-weight: bold; margin-bottom: 6pt; }
  .apa-subtitle { font-size: 14pt; font-weight: bold; margin-bottom: 10pt; }
  .apa-meta { font-size: 11pt; line-height: 1.6; }
  .apa-h1 { text-align: center; font-size: 14pt; font-weight: bold; margin: 18pt 0 8pt; }
  .apa-h2 { text-align: left; font-size: 12.5pt; font-weight: bold; margin: 14pt 0 6pt; }
  .apa-p { margin: 0 0 8pt; text-indent: 24pt; text-align: justify; line-height: 1.85; }
  .apa-item { margin: 0 0 8pt; padding-left: 24pt; text-indent: -24pt; text-align: justify; line-height: 1.85; }
  .apa-twrap { margin: 14pt 0 16pt; }
  .apa-tnum { font-weight: bold; font-size: 11pt; margin-bottom: 2pt; }
  .apa-ttitle { font-style: italic; font-size: 11pt; margin-bottom: 6pt; }
  table.apa-tbl { width: 100%; border-collapse: collapse; border-top: 1.5pt solid #000; border-bottom: 1.5pt solid #000; font-size: 10.5pt; }
  table.apa-tbl th { border-bottom: 0.75pt solid #000; padding: 5pt 6pt; text-align: left; font-weight: bold; }
  table.apa-tbl td { padding: 5pt 6pt; vertical-align: top; }
  .apa-tnote { font-size: 9.5pt; margin-top: 4pt; }
</style></head>
<body>${apaPreviewHTML(false)}</body></html>`;
    downloadBlob(new Blob(["\uFEFF" + wordHtml], {type:"application/msword;charset=utf-8"}), fname + ".doc");
  }
}

function bindEvents(){
  const w = document.getElementById("work");
  if(!w) return;

  // 步驟切換按鈕
  w.querySelectorAll("[data-nav]").forEach(b=>{
    b.onclick = ()=>{ S.step = b.dataset.nav; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
  });

  // 一鍵範例卡片
  w.querySelectorAll("[data-preset]").forEach(b=>{
    b.onclick = ()=>applyPreset(b.dataset.preset, false);
  });

  // README 頁面情境篩選與設計切換按鈕
  w.querySelectorAll("[data-rm-flt]").forEach(b=>{
    b.onclick = ()=>{
      RM_FLT = b.dataset.rmFlt || "all";
      render();
    };
  });
  w.querySelectorAll("[data-rm-pick]").forEach(b=>{
    b.onclick = ()=>{
      const code = b.dataset.rmPick;
      if(code && DESIGNS[code]){
        S.design = code;
        save(); render();
        const fp = document.getElementById("rm-focus-panel");
        if(fp) fp.scrollIntoView({behavior:"smooth", block:"nearest"});
      }
    };
  });
  w.querySelectorAll("[data-rm-preset]").forEach(b=>{
    b.onclick = ()=>{
      const pid = b.dataset.rmPreset;
      const to = b.dataset.rmTo || "setup";
      applyPreset(pid, false);
      S.step = to;
      save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    };
  });
  w.querySelectorAll("[data-rm-docx]").forEach(b=>{
    b.onclick = ()=>{
      applyPreset(b.dataset.rmDocx, true);
      exportDocx();
    };
  });
  w.querySelectorAll("[data-rm-csv]").forEach(b=>{
    b.onclick = ()=>{
      applyPreset(b.dataset.rmCsv, true);
      exportCsv();
    };
  });

  // 決策樹選單
  ["q1","q2","q3","q4"].forEach(q=>{
    const sel = document.getElementById("dt_"+q);
    if(sel){
      sel.onchange = ()=>{ S.dt[q] = sel.value; save(); render(); };
    }
  });
  const btnRec = document.getElementById("btn_apply_rec");
  if(btnRec){
    btnRec.onclick = ()=>{ S.design = recDesignFromTree().code; save(); render(); };
  }
  const btnPreRec = document.getElementById("btn_preset_rec");
  if(btnPreRec){
    btnPreRec.onclick = ()=>applyPreset(recDesignFromTree().code, false);
  }
  const btnCurPre = document.getElementById("btn_load_cur_preset");
  if(btnCurPre){
    btnCurPre.onclick = ()=>applyPreset(S.design, false);
  }

  // 設計卡片切換
  w.querySelectorAll("[data-dcode]").forEach(c=>{
    c.onclick = ()=>{ S.design = c.dataset.dcode; save(); render(); };
  });

  // 一般文字欄位
  w.querySelectorAll("[data-k]").forEach(inp=>{
    inp.oninput = ()=>{ S[inp.dataset.k] = inp.value; save(); };
  });

  // 動態表格編輯、新增、刪除
  w.querySelectorAll("[data-gr]").forEach(ta=>{
    ta.oninput = ()=>{
      const k = ta.dataset.gr, r = parseInt(ta.dataset.r), c = parseInt(ta.dataset.c);
      if(Array.isArray(S[k]) && S[k][r]){ S[k][r][c] = ta.value; save(); }
    };
  });
  w.querySelectorAll("[data-gadd]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.gadd, cols = parseInt(b.dataset.cols)||3;
      if(!Array.isArray(S[k])) S[k] = [];
      S[k].push(new Array(cols).fill(""));
      save(); render();
    };
  });
  w.querySelectorAll("[data-gdel]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.gdel, r = parseInt(b.dataset.r);
      if(Array.isArray(S[k]) && S[k].length>1){ S[k].splice(r,1); save(); render(); }
    };
  });

  // 句型 Chip 插入
  w.querySelectorAll("[data-ins]").forEach(b=>{
    b.onclick = ()=>{
      const k = b.dataset.ins, txt = b.dataset.txt;
      S[k] = (S[k] ? S[k].trim() + "\n" : "") + txt;
      save(); render();
    };
  });

  // 右側頁籤與打勾
  w.querySelectorAll("[data-stab]").forEach(b=>{
    b.onclick = ()=>{ S.stab = b.dataset.stab; save(); render(); };
  });
  w.querySelectorAll("[data-chk]").forEach(c=>{
    c.onchange = ()=>{ S.chk[c.dataset.chk] = c.checked; save(); };
  });
  w.querySelectorAll("[data-gate]").forEach(c=>{
    c.onchange = ()=>{ S.gate[c.dataset.gate] = c.checked; save(); };
  });
  w.querySelectorAll("[data-fill-step]").forEach(b=>{
    b.onclick = ()=>{
      const sid = b.dataset.fillStep;
      const p = PRESETS[S.design] || PRESETS.quasi_did;
      const st = STEPS.find(x=>x.id===sid);
      if(st && p){
        st.req.forEach(k=>{ S[k] = JSON.parse(JSON.stringify(p.data[k])); });
        save(); render();
      }
    };
  });

  // Step 4 樣本數計算器互動
  w.querySelectorAll("[data-calc]").forEach(el=>{
    el.onchange = el.oninput = ()=>{
      S.calc[el.dataset.calc] = el.value;
      save();
      if(el.tagName==="SELECT") render();
      else{
        const box = document.getElementById("power_tool");
        if(box){
          const tmp = document.createElement("div");
          tmp.innerHTML = powerToolHTML();
          box.querySelector(".tout").replaceWith(tmp.querySelector(".tout"));
        }
      }
    };
  });
  w.querySelectorAll("[data-calc-chk]").forEach(el=>{
    el.onchange = ()=>{ S.calc[el.dataset.calcChk] = el.checked; save(); render(); };
  });
  const btnPow = document.getElementById("btn_apply_power");
  if(btnPow){
    btnPow.onclick = ()=>{
      const res = calcSampleSize(S.calc);
      const c1 = calcSampleSize(Object.assign({}, S.calc, {es: Math.max(0.15, Number(S.calc.es)-0.10)}));
      const c3 = calcSampleSize(Object.assign({}, S.calc, {es: Number(S.calc.es)+0.15}));
      S.s4_power = `本研究以主要依變項之「${res.label}」進行先驗樣本數估算（A-priori power analysis）。設定${res.tail===1?"單尾":"雙尾"}顯著水準 α ＝ ${res.alpha}、目標統計檢定力 Power（1 − β）＝ ${res.power.toFixed(2)}、預期效應量為 ${res.es.toFixed(2)}，經計算所需最小有效樣本數為：${res.detail}。` +
        (S.calc.cluster ? `考量群集抽樣設計效應 DEFF ＝ ${res.deff.toFixed(2)}，校正後有效樣本需 ${res.n_deff} 人。` : "") +
        `考量研究期間預估約 ${(res.drop*100).toFixed(0)}% 之流失或資料不完整率，最終預計招募總人數為 N ＝ ⌈${res.n_deff} / (1 − ${res.drop.toFixed(2)})⌉ ＝ ${res.n_recruit} 人。`;
      S.s4_scenarios = `【不同效應量情境之樣本數對照（α ＝ ${res.alpha}, Power ＝ ${res.power.toFixed(2)}）】\n1. 保守情境（效應量 ${c1.es.toFixed(2)}）：${c1.detail}（加計流失率需招募 ${c1.n_recruit} 人）。\n2. 基準規劃情境（效應量 ${res.es.toFixed(2)}）：${res.detail}（加計流失率需招募 ${res.n_recruit} 人）。\n3. 樂觀情境（效應量 ${c3.es.toFixed(2)}）：${c3.detail}（加計流失率需招募 ${c3.n_recruit} 人）。`;
      save(); render();
    };
  }

  // Step 5 統計檢定配對器互動
  w.querySelectorAll("[data-match]").forEach(el=>{
    el.onchange = ()=>{ S.matcher[el.dataset.match] = el.value; save(); render(); };
  });
  const btnMatch = document.getElementById("btn_apply_matcher");
  if(btnMatch){
    btnMatch.onclick = ()=>{
      const res = getMatcherResult(S.matcher);
      S.s5_assump = `【${res.title}】\n・主要統計檢定：${res.primary}\n・前提假設檢查：${res.assump}\n・違反前提之替代方案：\n${res.fallback}`;
      if(Array.isArray(S.s6_sap) && S.s6_sap.length){
        S.s6_sap[0][1] = res.title;
        S.s6_sap[0][2] = `${res.primary}（替代：${res.fallback.replace(/\n/g,"；")}）`;
        S.s6_sap[0][3] = res.es;
      }
      save(); render();
    };
  }

  // Step 6 推論統計試算器互動
  w.querySelectorAll("[data-lab]").forEach(el=>{
    el.onchange = el.oninput = ()=>{
      S.lab[el.dataset.lab] = el.value;
      save();
      if(el.tagName==="SELECT") render();
      else{
        const box = document.getElementById("stat_lab");
        if(box){
          const tmp = document.createElement("div");
          tmp.innerHTML = statLabHTML();
          box.querySelector(".tout").replaceWith(tmp.querySelector(".tout"));
        }
      }
    };
  });
  const btnLab = document.getElementById("btn_apply_lab");
  if(btnLab){
    btnLab.onclick = ()=>{
      const res = calcStatLab(S.lab);
      S.s6_apa = (S.s6_apa ? S.s6_apa.trim() + "\n\n" : "") + res.sentence;
      save(); render();
    };
  }

  // Step 7 匯出與備份按鈕
  const bDocx = document.getElementById("btn_exp_docx");
  const bDocx2 = document.getElementById("btn_exp_docx2");
  if(bDocx) bDocx.onclick = exportDocx;
  if(bDocx2) bDocx2.onclick = exportDocx;
  const bCsv = document.getElementById("btn_exp_csv");
  if(bCsv) bCsv.onclick = exportCsv;
  const bCopy = document.getElementById("btn_copy_txt");
  if(bCopy){
    bCopy.onclick = ()=>{
      navigator.clipboard.writeText(fullDocText()).then(()=>alert("已複製完整研究設計與統計分析計畫書全文！"));
    };
  }
  const bJson = document.getElementById("btn_exp_json");
  if(bJson){
    bJson.onclick = ()=>{
      downloadBlob(new Blob([JSON.stringify(S,null,2)], {type:"application/json"}), `量性研究設計草稿_${S.design}_${S.date||"2026"}.json`);
    };
  }
  const inpJson = document.getElementById("inp_json");
  if(inpJson){
    inpJson.onchange = (e)=>{
      const f = e.target.files && e.target.files[0];
      if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const o = JSON.parse(r.result);
          S = Object.assign(defState(), o);
          save(); render();
        }catch(err){ alert("JSON 檔案格式不正確！"); }
      };
      r.readAsText(f);
    };
  }
  const bReset = document.getElementById("btn_reset");
  if(bReset){
    bReset.onclick = ()=>{
      if(confirm("確定要清空目前所有填寫內容並恢復空白初始狀態嗎？")){
        S = defState(); save(); render();
      }
    };
  }
}

function render(){
  renderTop();
  renderNav();
  const w = document.getElementById("work");
  if(!w) return;
  if(S.step==="readme") w.innerHTML = readmeHTML();
  else if(S.step==="setup") w.innerHTML = setupHTML();
  else if(S.step==="review") w.innerHTML = reviewHTML();
  else w.innerHTML = stepFormHTML(S.step);
  bindEvents();
}

// 支援網址參數 ?preset=rct&step=setup 直接匯入範例或切換頁籤
try{
  const sp = new URLSearchParams(window.location.search);
  const qp = sp.get("preset");
  const qs = sp.get("step");
  if(qp && PRESETS[qp]) applyPreset(qp, true);
  if(qs && STEPS.some(x=>x.id===qs)){ S.step = qs; save(); }
}catch(e){}

// 暴露測試與外部呼叫介面
window.QW_APP = {getState:()=>S, applyPreset, issues, calcSampleSize, calcStatLab, fullDocText};

initSymp();
render();
})();

</script>
</body>
</html>
