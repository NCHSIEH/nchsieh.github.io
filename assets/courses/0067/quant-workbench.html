<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>量性研究設計工作台｜研究方法論 2.1–2.7</title>
<meta name="description" content="研究方法論課程 2.1–2.7 量性研究設計互動工作台：涵蓋平行組間 RCT、組間比較、組內前後測、組內交叉對抗平衡、混合設計（RCT／配對）、準實驗（雙重差分 DiD／中斷時間序列 ITS）與觀察性相關迴歸共 9 種主流設計與一鍵完整範例、樣本數與統計檢定配對器、APA 結果句試算、七步驟走查檢核、匯出 Word 與空白資料表 CSV。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%231f3a5f'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='56' font-weight='600' fill='%23fff' text-anchor='middle'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#f7f4ed;--panel:#ffffff;--subtle:#efeae0;--line:#dcd5c6;--ink:#1d242b;--muted:#5b6470;--brand:#1f3a5f;--brand-deep:#142943;--brand-soft:#e7eef6;--accent:#9c7538;--accent-soft:#f6efe1;--ok:#1f6f4a;--ok-soft:#e5f3ec;--warn:#a85513;--warn-soft:#fbeee2;--bad:#a2342a;--bad-soft:#fae8e6;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;--serif:"Noto Serif TC","Source Han Serif TC",Georgia,serif}
@media (prefers-color-scheme: dark){:root{--bg:#13171d;--panel:#1b212a;--subtle:#242c38;--line:#313b4a;--ink:#ebe7de;--muted:#9ea8b6;--brand:#7fb0e8;--brand-deep:#a9caf0;--brand-soft:#1e2f44;--accent:#d8b16d;--accent-soft:#2f281a;--ok:#5bc490;--ok-soft:#182e24;--warn:#f0a35e;--warn-soft:#312214;--bad:#eb7c72;--bad-soft:#321b19}}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 1px 6px rgba(0,0,0,.04)}
.top-in{max-width:1440px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:700;font-size:18px;color:var(--brand-deep);letter-spacing:.02em}
.brand small{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);margin-left:8px}
#menu{display:none;border:1px solid var(--line);background:var(--subtle);padding:5px 10px;border-radius:6px;cursor:pointer}
#who{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.pill{background:var(--brand-soft);color:var(--brand-deep);padding:3px 9px;border-radius:999px;font-weight:500;border:1px solid transparent}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:160px}
.prog i{flex:1;height:7px;background:var(--subtle);border-radius:99px;overflow:hidden;display:block;position:relative;border:1px solid var(--line)}
.prog i::after{content:"";display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--brand),var(--ok));transition:width .25s}
#progt{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.oneclick{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.oneclick:hover{background:var(--accent);color:#fff}
#sy{max-width:250px;border:1px solid var(--line);background:var(--subtle);padding:5px 9px;border-radius:6px;font-size:12.5px}
.shell{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:252px minmax(0,1fr);gap:20px;padding:18px}
#side-nav{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.sitem{width:100%;text-align:left;border:0;background:transparent;padding:8px 9px;border-radius:7px;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;cursor:pointer;margin-bottom:2px}
.sitem:hover{background:var(--subtle)}
.sitem.on{background:var(--brand-soft);color:var(--brand-deep);font-weight:700}
.sdot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--panel)}
.sitem.on .sdot{border-color:var(--brand);color:var(--brand)}
.sitem.done .sdot{background:var(--ok);border-color:var(--ok);color:#fff}
.slbl{font-size:13px;line-height:1.3}.slbl small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.s pct{font-size:11px;color:var(--muted)}
.saved{font-size:11.5px;color:var(--muted);margin:10px 6px 2px;border-top:1px dashed var(--line);padding-top:8px}
#work{min-width:0}
.head{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:14px}
.head-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.badge{background:var(--brand);color:#fff;font-weight:700;font-size:12px;padding:2px 9px;border-radius:5px;letter-spacing:.04em}
.head h1{font-family:var(--serif);font-size:21px;margin:0;color:var(--brand-deep)}
.head .q{margin:6px 0 0;color:var(--muted);font-size:14px}
.locbar{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
.loc{background:var(--subtle);border:1px solid var(--line);padding:3px 9px;border-radius:5px}
.loc b{color:var(--brand-deep)}
.loc.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.panes{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(310px,.92fr);gap:16px;align-items:start}
.form,.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.side{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.fld{margin-bottom:15px}
.fld label{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--brand-deep)}
.fld label span.h{font-weight:400;font-size:12px;color:var(--muted)}
.fld textarea,.fld input[type=text],.fld input[type=number],.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;transition:border-color .15s,background .15s}
.fld textarea{resize:vertical;min-height:74px;line-height:1.6}
.fld textarea:focus,.fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);background:var(--panel)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0 2px}
.chip{border:1px dashed var(--brand);background:var(--brand-soft);color:var(--brand-deep);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;text-align:left;line-height:1.4}
.chip:hover{background:var(--brand);color:#fff;border-style:solid}
.chip b{font-weight:700}
.stabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.stab{border:0;background:transparent;padding:6px 10px;font-size:12.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-weight:500}
.stab.on{color:var(--brand-deep);border-bottom-color:var(--brand);font-weight:700}
.sbox{font-size:13.2px}
.sbox h3{font-size:13.5px;margin:12px 0 6px;color:var(--brand-deep);border-left:3px solid var(--brand);padding-left:8px}
.sbox h3:first-child{margin-top:0}
.chk{list-style:none;padding:0;margin:0}
.chk li{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:7px;align-items:flex-start}
.chk input{margin-top:4px}
.err{background:var(--bad-soft);border-left:3px solid var(--bad);padding:7px 10px;border-radius:5px;margin-bottom:6px;font-size:12.8px}
.caseq{background:var(--accent-soft);border:1px solid var(--accent);border-radius:7px;padding:10px 12px;font-size:12.8px;white-space:pre-line}
.caseq .use{margin-top:6px;display:inline-block;font-size:12px;color:var(--brand-deep);text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
.gate{background:var(--ok-soft);border:1px solid var(--ok);border-radius:7px;padding:9px 11px;margin-top:10px}
.gate h4{margin:0 0 6px;font-size:13px;color:var(--ok)}
.gate label{display:flex;gap:7px;align-items:flex-start;font-size:12.6px;padding:3px 0;cursor:pointer}
.fnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover{background:var(--subtle)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.pri:hover{background:var(--brand-deep)}
.btn.ac{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.sm{padding:4px 9px;font-size:12px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:11px 13px;background:var(--bg);cursor:pointer;transition:border-color .15s,transform .1s;text-align:left}
.card:hover{border-color:var(--brand)}
.card.on{border:2px solid var(--brand);background:var(--brand-soft)}
.card h4{margin:0 0 3px;font-size:14px;color:var(--brand-deep);display:flex;justify-content:space-between;align-items:center;gap:6px}
.card p{margin:0;font-size:12.3px;color:var(--muted);line-height:1.45}
.card . cmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.ctag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--subtle);color:var(--ink);border:1px solid var(--line)}
.card.on .ctag{background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700}
.tbl input,.tbl textarea,.tbl select{width:100%;border:1px solid transparent;background:transparent;padding:3px 4px;border-radius:4px;font-size:12.5px}
.tbl input:focus,.tbl textarea:focus,.tbl select:focus{border-color:var(--brand);background:var(--panel);outline:none}
.tbl textarea{min-height:44px;resize:vertical}
.tool{background:var(--subtle);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:12px 0}
.tool h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tout{background:var(--panel);border-left:3px solid var(--accent);padding:9px 12px;border-radius:5px;margin-top:8px;font-size:13px}
.warnbox{background:var(--warn-soft);border-left:3px solid var(--warn);padding:8px 11px;border-radius:5px;font-size:12.6px;margin:6px 0}
.okbox{background:var(--ok-soft);border-left:3px solid var(--ok);padding:8px 11px;border-radius:5px;font-size:12.6px;margin:6px 0}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.mcell{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.mcell.empty{border-color:var(--warn);background:var(--warn-soft)}
.mcell h4{margin:0 0 4px;font-size:13px;color:var(--brand-deep);display:flex;justify-content:space-between}
.mcell p{margin:0;font-size:12.3px;white-space:pre-line;max-height:130px;overflow:auto}
.doc-preview{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 26px;font-family:var(--serif);line-height:1.85;max-height:580px;overflow:auto;white-space:pre-wrap;font-size:14px}
.slot{background:var(--warn-soft);color:var(--warn);padding:0 3px;border-radius:3px;font-weight:700}
.pp{--p:0;width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--line) 0);display:inline-flex;align-items:center;justify-content:center}
.pp i{width:17px;height:17px;border-radius:50%;background:var(--panel);font-style:normal;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.sitem.on .pp i{color:var(--brand)}
/* 2.X 量性研究設計專屬視覺元件 */
.dtree{background:var(--subtle);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:14px}
.dtree h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep)}
.dq-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-bottom:8px}
.dq{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:12.4px}
.dq b{display:block;color:var(--brand-deep);margin-bottom:4px}
.dq select{width:100%;border:1px solid var(--line);background:var(--bg);padding:4px 6px;border-radius:5px;font-size:12.3px}
.flow-viz{background:var(--panel);border:1.5px solid var(--brand);border-radius:9px;padding:13px 15px;margin:10px 0}
.flow-viz h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.fsteps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.fnode{background:var(--brand-soft);border:1px solid var(--brand);color:var(--brand-deep);padding:6px 10px;border-radius:7px;font-size:12.3px;line-height:1.4;font-weight:500}
.fnode.ac{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.fnode.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}
.farr{color:var(--muted);font-weight:700;font-size:14px}
.fnotation{font-family:ui-monospace,Consolas,monospace;background:var(--subtle);border:1px dashed var(--line);padding:6px 10px;border-radius:6px;font-size:12.3px;margin:6px 0;white-space:pre-wrap}
.eff-bars{margin:8px 0;display:grid;gap:6px}
.ebar{display:grid;grid-template-columns:170px 1fr 90px;align-items:center;gap:8px;font-size:12.2px}
.ebar-track{height:14px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.ebar-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px}
.ebar-fill.ok{background:linear-gradient(90deg,var(--ok),var(--brand))}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:8px;margin-top:8px}
.pbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 10px;text-align:left;cursor:pointer;transition:border-color .15s,background .15s}
.pbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.pbtn b{display:block;font-size:12.8px;color:var(--brand-deep);margin-bottom:2px}
.pbtn small{display:block;font-size:11.5px;color:var(--muted);line-height:1.35}
.pbtn .ptag{display:inline-block;font-size:10.8px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--brand-soft);color:var(--brand-deep);margin-bottom:4px}
/* README 總覽網頁專屬樣式（清晰三步結構：選分類 → 看設計與範例 → 橫向比較） */
.rm-doc{display:grid;gap:16px}
.rm-sec{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px 22px;box-shadow:0 1px 6px rgba(0,0,0,.02)}
.rm-sec-hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.rm-sec-hd h2{margin:0;font-family:var(--serif);font-size:18px;color:var(--brand-deep);display:flex;align-items:center;gap:8px}
.rm-sec-hd small{font-size:12.5px;color:var(--muted)}
.rm-step-tag{background:var(--brand);color:#fff;font-family:var(--sans);font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px}
.rm-flts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:8px 11px;background:var(--subtle);border-radius:8px;font-size:12.5px}
.rm-flt{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;border-radius:99px;font-size:12.2px;cursor:pointer;font-weight:500;transition:all .15s}
.rm-flt:hover{border-color:var(--brand)}
.rm-flt.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.rm-fam-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.rm-fam{background:var(--subtle);border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:7px}
.rm-fam-hd{padding-bottom:6px;border-bottom:1px dashed var(--line)}
.rm-fam-hd b{display:block;font-size:13.2px;color:var(--brand-deep)}
.rm-fam-hd span{display:block;font-size:11.4px;color:var(--muted);line-height:1.35;margin-top:2px}
.rm-ditem{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px;text-align:left;cursor:pointer;transition:all .15s;display:block;width:100%}
.rm-ditem:hover{border-color:var(--brand);transform:translateY(-1px)}
.rm-ditem.on{border:2px solid var(--brand);background:var(--brand-soft);box-shadow:0 2px 8px rgba(31,58,95,.12)}
.rm-ditem.dim{opacity:.32}
.rm-ditem-top{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:3px}
.rm-ditem-num{font-weight:700;font-size:12px;color:var(--brand-deep);background:var(--subtle);padding:1px 6px;border-radius:4px}
.rm-ditem.on .rm-ditem-num{background:var(--brand);color:#fff}
.rm-ditem-n{font-size:11px;color:var(--accent);font-weight:700}
.rm-ditem b{display:block;font-size:13px;color:var(--brand-deep);line-height:1.35;margin-bottom:3px}
.rm-ditem small{display:block;font-size:11.4px;color:var(--muted);line-height:1.35}
.rm-focus{border:2px solid var(--brand);border-radius:11px;background:var(--panel);overflow:hidden}
.rm-focus-bar{background:var(--brand-soft);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rm-focus-title h2{margin:4px 0 2px;font-family:var(--serif);font-size:20px;color:var(--brand-deep)}
.rm-focus-title p{margin:0;font-size:13px;color:var(--muted)}
.rm-focus-acts{display:flex;gap:8px;flex-wrap:wrap}
.rm-bento{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 20px}
.rm-bcard{border:1px solid var(--line);border-radius:9px;padding:13px 15px;background:var(--bg)}
.rm-bcard h4{margin:0 0 8px;font-size:14px;color:var(--brand-deep);display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.rm-tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.rm-tbl{width:100%;border-collapse:collapse;font-size:12.6px;min-width:820px}
.rm-tbl th,.rm-tbl td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle;line-height:1.45}
.rm-tbl th:last-child,.rm-tbl td:last-child{border-right:0}
.rm-tbl tr:last-child td{border-bottom:0}
.rm-tbl th{background:var(--subtle);color:var(--brand-deep);font-weight:700;white-space:nowrap}
.rm-tbl tr.on td{background:var(--brand-soft)}
.rm-tbl tr:hover td{background:var(--subtle);cursor:pointer}
/* APA 第 7 版預覽與表格樣式 */
.apa-page{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:32px 42px;font-family:"Times New Roman","標楷體",var(--serif);line-height:1.85;max-height:680px;overflow:auto;font-size:15px;color:var(--ink)}
.apa-rh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:22px}
.apa-cover{text-align:center;padding:24px 0 28px;margin-bottom:24px;border-bottom:2px double var(--line)}
.apa-cover h2{font-size:20px;font-weight:700;margin:0 0 10px;color:var(--brand-deep)}
.apa-cover p{margin:4px 0;font-size:14.5px}
.apa-h1{text-align:center;font-weight:700;font-size:17px;margin:28px 0 12px;color:var(--brand-deep)}
.apa-h2{text-align:left;font-weight:700;font-size:15.5px;margin:18px 0 8px;color:var(--brand-deep)}
.apa-p{margin:0 0 10px;text-indent:2em;text-align:justify}
.apa-item{margin:0 0 8px;padding-left:2em;text-indent:-2em;text-align:justify}
.apa-twrap{margin:16px 0 20px}
.apa-tnum{font-weight:700;font-size:14.5px;margin:0}
.apa-ttitle{font-style:italic;font-size:14.5px;margin:2px 0 6px}
.apa-tbl{width:100%;border-collapse:collapse;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font-size:13.2px}
.apa-tbl th{border-bottom:1px solid var(--ink);padding:6px 8px;text-align:left;font-weight:700;vertical-align:bottom}
.apa-tbl td{padding:6px 8px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.apa-tbl tr:last-child td{border-bottom:0}
.apa-tnote{font-size:12.5px;color:var(--muted);margin:5px 0 0}
@media (max-width:1120px){
  .rm-fam-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rm-bento{grid-template-columns:1fr}
}
@media (max-width:1024px){
  .shell{grid-template-columns:1fr}
  #menu{display:inline-block}
  #side-nav{display:none;position:fixed;left:12px;right:12px;top:58px;z-index:40;max-height:75vh;box-shadow:0 12px 32px rgba(0,0,0,.22)}
  #side-nav.open{display:block}
  .panes{grid-template-columns:1fr}
  .side{position:static;max-height:none}
  .ebar{grid-template-columns:120px 1fr 75px}
  .rm-fam-grid{grid-template-columns:1fr}
  .apa-page{padding:18px 16px}
}
@media print{
  .top,#side-nav,.side,.fnav,.chips,.tool{display:none!important}
  .shell,.panes{display:block;padding:0}
  .doc-preview{max-height:none;border:0;padding:0}
}

<script>window.SOP_DATA={
  "DESIGNS": {
    "rct": {
      "code": "rct",
      "name": "平行隨機對照試驗（Between-Subject RCT）",
      "short": "① 平行組間 RCT",
      "cat": "實驗設計（組間）",
      "sub": "隨機分派受試者至獨立的實驗組與對照組（2 組或 ≥3 組），比較介入後組間差異",
      "evidence": "因果推論黃金標準（Level II）",
      "guideline": "CONSORT 2025 隨機對照試驗報告規範",
      "unit_ref": "@ 2.1 第 22–32、40 張；@ 2.5 第 29–34 張；@ 2.6 第 38–42 張；@ 2.7",
      "flow": [
        "目標母體與納排篩選",
        "知情同意與基線評估（O₀）",
        "隨機分派 R（電腦區組亂數＋分派隱匿）",
        "實驗組（新介入 X）vs 對照組（安慰劑／主動對照 C）",
        "結果評估（O₁，盲法評估）",
        "組間比較（ITT 意圖治療分析）"
      ],
      "notation": "實驗組（Group E）：R  →  (O₀)  →  X（新介入方案）      →  O₁\n對照組（Group C）：R  →  (O₀)  →  C（安慰劑／常規對照） →  O₁\n核心比較式：組間治療效應 Δ ＝ M_E(O₁) − M_C(O₁)（若有基線 O₀，可採 ANCOVA 控制基線共變項）",
      "data_cols": [
        "id",
        "group (1=實驗組,0=對照組)",
        "age",
        "sex",
        "baseline_cov",
        "dv_primary",
        "dv_secondary",
        "adherence_pct",
        "itt_flag"
      ],
      "pros": [
        "隨機分派在期望上同時平衡「已知與未知」的所有混淆變項（Z ⊥ X），可直接推論 X → Y 因果關係",
        "每位受試者只接受一種條件，完全沒有組內順序效應、練習效應或藥物殘留（Carryover）問題",
        "統計模型直觀（獨立樣本 t 檢定、單因子 ANOVA 或 ANCOVA），臨床與實證期刊接受度最高"
      ],
      "cons": [
        "組間個體差異全部進入誤差項（雜訊較大），所需總樣本數較高（例如 d＝0.5 時每組需 64 人、兩組共 128 人）",
        "真實臨床或教育場域可能因倫理、受試者拒絕隨機或同場域跨組污染（Contamination）而難以執行",
        "需嚴格執行分派隱匿（Allocation Concealment）與盲法，否則易受安慰劑效應或評估者期望偏誤影響"
      ],
      "stat_default": "獨立樣本 t 檢定（2 組）或單因子 ANOVA（≥3 組）；若有基線共變項可加做 ANCOVA；違反常態時改用 Mann–Whitney U 或 Kruskal–Wallis 檢定",
      "checklist": [
        "標題或摘要是否明確標示為「隨機對照試驗（Randomized Controlled Trial）」？（CONSORT 1a）",
        "是否清楚交代隨機序列產生方法（如電腦區組隨機）與分派隱匿機制（如密封不透光信封或中央系統）？（CONSORT 8–10）",
        "是否說明受試者、介入執行者、結果評估者與統計分析者之盲法（Blinding）狀態？（CONSORT 11）",
        "是否提供先驗樣本數計算依據（α、Power、預期效應量 d 與流失率加成）？（CONSORT 7a）",
        "是否規劃繪製 CONSORT 受試者流程圖（篩選、排除、隨機分派、失訪、納入分析人數）？（CONSORT 13）",
        "主要分析是否採意圖治療分析（Intention-to-Treat, ITT）並搭配依議定書分析（Per-Protocol）作為敏感度分析？（CONSORT 16）",
        "結果是否同時報告各組敘述統計、組間差值、效應量（Cohen's d 或 OR）與 95% 信賴區間？（CONSORT 17a）"
      ]
    },
    "between": {
      "code": "between",
      "name": "組間比較／線上 A-B 實驗設計（Between-Subject Comparison / A-B Test）",
      "short": "② 組間比較／A-B 實驗",
      "cat": "實驗／比較設計（組間）",
      "sub": "比較兩個以上獨立群組（不同介面版本 A/B 分流、不同方案或自然世代組間比較），探討組間數值或類別轉換率差異",
      "evidence": "組間比較證據（隨機分流為因果、自然分組需統計控制混淆變項 Z）",
      "guideline": "CONSORT（隨機 A/B 分流）或 TREND／STROBE（非隨機組間比較）規範",
      "unit_ref": "@ 2.1 第 26–39 張；@ 2.5 第 29–46、59–69 張；@ 2.7 第 9–18 張",
      "flow": [
        "界定目標母體與納排條件",
        "依版本分流或場域條件分為獨立之 A 組與 B 組",
        "同步記錄潛在混淆變項 Z（年齡、性別、教育程度、基線經驗）",
        "使用一致標準測量主要結果 Y（數值分數或二元轉換率）",
        "檢驗兩組基線可比性（Table 1），執行獨立 t／卡方檢定與多變項迴歸校正 Z"
      ],
      "notation": "群組 A（條件 A）：(R)  →  X_A（方案 A／新版介面） →  O₁\n群組 B（條件 B）：(R)  →  X_B（方案 B／舊版介面） →  O₁\n核心比較式：數值差 Δ ＝ M_A − M_B（獨立 t／ANCOVA）；比例差 Δp ＝ p_A − p_B 與勝算比 OR（Pearson χ²／邏輯斯迴歸）",
      "data_cols": [
        "id",
        "group (1=A組,0=B組)",
        "age",
        "sex",
        "education_yr",
        "dv_score",
        "dv_converted (1=完成,0=未完成)",
        "task_sec"
      ],
      "pros": [
        "每位受試者僅接觸單一版本或單一組別，不會因同時看過 A、B 兩版而猜出研究目的（要求特徵低）",
        "同時支援「連續數值依變項（t 檢定／ANOVA）」與「二元類別依變項（卡方檢定／勝算比 OR）」",
        "在數位醫療介面、衛教教材比較或多群組比較中執行流程單純，無須等待洗滌期或長期追蹤"
      ],
      "cons": [
        "組間個體差異大，統計檢定力低於組內設計（兩組 d＝0.5 需 128 人；卡方 w＝0.3 需 88 人、w＝0.2 需 197 人）",
        "若非隨機分流而是自然群組（如日班 vs 夜班、甲院 vs 乙院），兩組基線可能存在系統性偏差（Selection Bias）",
        "必須事先收集混淆變項 Z 並納入多元線性／邏輯斯迴歸校正，否則易將背景差異誤判為組別效果"
      ],
      "stat_default": "數值 DV：獨立樣本 t 檢定／Welch t 檢定（2 組）或單因子 ANOVA（≥3 組）＋多元線性迴歸；二元類別 DV：Pearson 卡方獨立性檢定（期望次數 <5 用 Fisher 精確檢定）＋多變項邏輯斯迴歸（報 aOR 與 95% CI）",
      "checklist": [
        "是否明確說明分組機制（系統隨機分流 vs 自然群組），以及每位受試者是否僅出現於其中一組（滿足獨立性假設）？（@ 2.5 s60）",
        "若包含類別結果（如完成率、點擊率），是否確認 2×2 列聯表各格期望次數 E ≥ 5，並同時報告百分比差、勝算比 OR 與 Cramér's V / φ？（@ 2.5 s63）",
        "是否預先列出潛在混淆變項 Z 並於 Table 1 檢驗兩組基線平衡？（STROBE 7 / TREND 14）",
        "統計分析是否同時規劃「雙變項組間檢定」與「控制混淆變項後之多元迴歸模型」？（STROBE 12）"
      ]
    },
    "within_prepost": {
      "code": "within_prepost",
      "name": "組內單組前後測設計（Within-Subject Single-Group Pre-Post）",
      "short": "③ 組內單組前後測",
      "cat": "實驗／準實驗設計（組內）",
      "sub": "同一批受試者在介入前（Pre）與介入後（Post，及選配延遲追蹤）接受重複測量，自己當自己的對照",
      "evidence": "高檢定力組內前後變化證據（需防範時間趨勢、練習與均值回歸）",
      "guideline": "TREND 非隨機研究規範／CONSORT 先導研究規範",
      "unit_ref": "@ 2.1 第 26–30、42–44 張；@ 2.3 第 29–35 張；@ 2.5 第 35–38、53–56 張；@ 2.6 第 40–42 張",
      "flow": [
        "目標母體篩選與知情同意",
        "介入前基線測量 O₁（建議可雙次基線確認穩定度）",
        "全體受試者接受標準化介入方案 X（記錄出席率／順從度）",
        "介入結束即刻後測 O₂（及選配延遲追蹤 O₃）",
        "計算個人前後差 dᵢ ＝ O₂ − O₁，以配對 t 檢定／RM-ANOVA 檢驗變化"
      ],
      "notation": "單組重複測量：O₁（前測） →  X（介入方案） →  O₂（後測） 〔→ O₃ 延遲追蹤〕\n核心比較式：個人變化量 dᵢ ＝ Y_post,i − Y_pre,i；組內平均效應 d̄ ＝ (1/n) Σ dᵢ（配對樣本 t 檢定或單因子重複測量 ANOVA）",
      "data_cols": [
        "id",
        "age",
        "sex",
        "dv_pre",
        "dv_post",
        "dv_diff (post-pre)",
        "dv_followup",
        "attendance_pct"
      ],
      "pros": [
        "每位受試者自己跟自己比，徹底消除組間個體差異（性格、基因、基礎能力），殘差變異大幅縮小",
        "樣本數效率極高！同樣中等效應量（dz＝0.5），組間兩組需 128 人，組內前後測僅需 34 人（節省約 73% 樣本）",
        "所有參與者皆能接受介入，無控制組被延遲或剝奪益處之顧慮，非常適合先導研究（Pilot）與臨床訓練評估"
      ],
      "cons": [
        "缺乏同期未介入對照組，無法單靠設計完全排除「歷史事件（History）」「自然成熟／緩解（Maturation）」與「季節波動」",
        "若納入條件只挑「基線最嚴重／最高分者」，後測改善極易混入「均值回歸（Regression to the Mean）」",
        "前後重複施測同一份量表或測驗，可能產生「練習／記憶效應（Practice Effect）」或「作答疲勞」"
      ],
      "stat_default": "2 個時間點：配對樣本 t 檢定（檢查差值 dᵢ 常態性，報 d̄、SD_d、95% CI 與 Cohen's dz / dav），違反常態時改用 Wilcoxon 符號等級檢定；≥3 個時間點：單因子重複測量 ANOVA（違反球形性時用 Greenhouse–Geisser 校正）或 Friedman 檢定",
      "checklist": [
        "是否清楚說明為何採用單組前後測（如全場域同步訓練、倫理上不宜設空白組或先導可行性研究）？（TREND 2）",
        "前後測測量工具、指導語、施測時段與環境是否完全一致，以避免工具誤差與時段干擾？（@ 2.1 s27）",
        "是否採取具體措施降低練習效應（如等值複本、適應練習）與均值回歸（如雙次基線測量取平均）？（@ 2.1 s43）",
        "樣本數是否以配對檢定之效應量 dz（基於前後差之 SD_d）進行先驗計算（如 dz＝0.5 需 34 人），並加上流失率緩衝？（@ 2.6 s40）",
        "統計分析是否正確採用「配對樣本 t 檢定／Wilcoxon 符號等級檢定」，且常態性檢定是針對「差值 dᵢ」而非前測或後測單獨檢定？（@ 2.7 s51）",
        "研究限制中是否誠實交代「缺乏同期對照組，無法完全排除自然時間趨勢與歷史效應」？（@ 2.6 s50）"
      ]
    },
    "within_cross": {
      "code": "within_cross",
      "name": "組內交叉與對抗平衡設計（Within-Subject Crossover & Counterbalancing）",
      "short": "④ 組內交叉對抗平衡",
      "cat": "實驗設計（組內）",
      "sub": "每位受試者依隨機分配之順序（AB vs BA 對抗平衡或拉丁方格）輪流接受實驗條件與對照條件，中間設置洗滌期（Washout）",
      "evidence": "高效率實驗因果推論（適用於短期、可逆、無永久殘留之介入）",
      "guideline": "CONSORT 2019 交叉試驗延伸規範（CONSORT Crossover Extension）",
      "unit_ref": "@ 2.1 第 26–30 張；@ 2.4 第 17 張；@ 2.5 第 35–38、47 張；@ 2.6 第 40–42 張",
      "flow": [
        "受試者篩選、知情同意與基線適應練習",
        "隨機分派施測順序：序列 AB 組（先實驗 X 後對照 C）vs 序列 BA 組（先對照 C 後實驗 X）",
        "第一階段（Period 1）施測與盲法評估 O₁",
        "洗滌期（Washout Period，確保前一條件生理／心理效果完全歸零）",
        "第二階段（Period 2）交換條件施測與盲法評估 O₂",
        "以配對 t／混合模型比較條件 X vs C，並檢驗順序與殘留效應"
      ],
      "notation": "序列 1（AB 組，n/2）：R  →  條件 X（實驗） → O₁  →  〔洗滌期 Washout〕  →  條件 C（對照） → O₂\n序列 2（BA 組，n/2）：R  →  條件 C（對照） → O₁  →  〔洗滌期 Washout〕  →  條件 X（實驗） → O₂\n核心比較式：組內條件差 dᵢ ＝ Y_i(X) − Y_i(C)（同時檢驗階段效應 Period 與順序殘留 Carryover）",
      "data_cols": [
        "id",
        "sequence (1=AB,2=BA)",
        "dv_cond_X",
        "dv_cond_C",
        "dv_diff (X-C)",
        "period1_val",
        "period2_val"
      ],
      "pros": [
        "同時具備「自身對照消除個體差異（高檢定力、僅需約 1/3–1/4 樣本數）」與「擁有真實對照條件 C」雙重優勢",
        "透過對抗平衡（Counterbalancing：AB/BA 隨機平衡；≥3 條件用拉丁方格 Latin Square），將練習效應與疲勞效應平均抵消",
        "極適合感官知覺、人因介面操作、穿戴式輔具即時測試、短期藥理或營養補充（如咖啡因、葡萄糖）實驗"
      ],
      "cons": [

        "s1_rq": "於接受單側全人工膝關節置換術（TKA）之成年患者（P）中，術後採用「新型多模式口服止痛方案（X）」相較於「標準常規止痛方案加安慰劑膠囊（C）」，是否能顯著降低術後 24 小時活動時疼痛視覺類比量表分數（Primary DV，VAS 0–100 mm）及術後 48 小時累積自控式嗎啡消耗量（Secondary DV，mg）？",
        "s1_why": "1. 重要性（Important）：人工膝關節置換術後中重度疼痛高達 60%，若止痛不足將延緩下床復健並增加深層靜脈栓塞風險；若過度依賴鴉片類藥物則易引發噁心嘔吐與呼吸抑制。\n2. 新穎性（Novel）：既有研究多採單一藥物比較，本研究結合非類固醇消炎藥與低劑量神經調控輔助劑之多模式固定配方，並以嚴格雙盲安慰劑對照分離出真實藥理淨效應。\n3. 合時宜（Timely）：呼應術後加速康復（ERAS）國際指引減少鴉片類藥物（Opioid-sparing）之臨床迫切需求。",
        "s1_h0h1": "・主要假設 H1（術後 24 小時疼痛 VAS，雙尾 α ＝ .05）：\n  H₀：μ_實驗組 ＝ μ_對照組（兩組術後 24 小時活動時 VAS 平均分數無顯著差異）\n  H₁：μ_實驗組 ≠ μ_對照組（預期實驗組 VAS 平均分數顯著低於對照組）\n・次要假設 H2（術後 48 小時累積嗎啡消耗量，雙尾 α ＝ .05）：\n  H₀：μ_實驗組 ＝ μ_對照組；H₁：μ_實驗組 ≠ μ_對照組（預期實驗組嗎啡消耗量顯著減少）\n・次要假設 H3（術後噁心嘔吐 PONV 發生率，雙尾 α ＝ .05）：\n  H₀：p_實驗組 ＝ p_對照組；H₁：p_實驗組 ≠ p_對照組\n【單／雙尾理由】雖然臨床預期新方案可減輕疼痛，但為嚴格防範新配方可能產生反常疼痛敏感或副作用，預先註冊一律採用雙尾檢定（α ＝ .05），絕不於檢視數據後改為單尾。",

          [

        "s1_zm": "・必須控制之混淆變項（Confounder Z）：患者年齡、性別、身體質量指數（BMI）、術前基線膝關節疼痛 VAS 分數、美國麻醉醫學會分級（ASA I–II）——透過隨機分派平衡並於 Table 1 檢驗，術前基線 VAS 另納入 ANCOVA 共變項。\n・不可誤控之中介變項（Mediator M）：「術後前 12 小時局部發炎細胞激素（IL-6）濃度下降」與「患者早期主觀舒適感」屬於止痛藥發揮效果之中間生理與心理機轉（X → M → Y）；在估計新止痛方案對 24 小時疼痛之總治療效應（Total Effect）時，絕不將中介變項當作共變項放入迴歸控制，以免產生過度控制偏誤（Overcontrol Bias）。",

        "s2_principle": "完全符合 @ 2.1 第 20 張黃金原則：\n1. 主要依變項（VAS 0–100 mm）與次要依變項（PCA 嗎啡毫克數 mg）皆保留完整連續數值尺度（不人為切成輕／中／重度），最大化統計靈敏度與檢定力；另搭配一項臨床安全性二元指標（PONV 發生率）示範類別變項卡方分析。\n2. 自變項（實驗組 vs 對照組）採高對比二元類別隨機操控，因果歸因最清晰。\n3. 明確指定單一主要依變項（術後 24 小時活動 VAS）作為先驗樣本數估算依據。",
        "s2_rel": "1. 疼痛 VAS 量尺再測與施測一致性：兩位盲化研究護理師於正式收案前對 20 位術後患者進行同步獨立指導與讀數校準，組內相關係數 ICC(2,1) 要求 ≥ .95。\n2. PCA 嗎啡消耗量：由醫療級輸注幫浦自動記錄每次有效按壓時間與毫克數，每週執行幫浦容積校準，無人工主觀評分誤差。",
        "s2_val": "1. 效標與建構效度：100 mm 視覺類比量表（VAS）為國際疼痛研究學會（IASP）認可之急性疼痛黃金標準工具，與數字評分量表（NRS）之收斂效度 r > .88。\n2. 臨床效度基準：文獻確立人工關節術後 VAS 之臨床最小重要差異（MCID）為 13–15 mm（約佔 SD 30 mm 之 0.5 個標準差）。",
        "s3_assign": "採 1:1 平行區組隨機分派（Stratified Block Randomization）：\n1. 隨機序列產生：由不參與臨床收案之獨立生物統計人員，使用 R 軟體以性別（男／女）分層，設定隨機區組大小（Block size ＝ 4 或 6）產生亂數分派表。\n2. 分派隱匿（Allocation Concealment）：由研究藥局依亂數表將實驗膠囊或外觀、顏色、重量與氣味完全一致之安慰劑膠囊裝入貼有連續流水號（S001–S152）之密封不透光藥袋中。臨床醫師與研究護理師在患者簽署同意書並領取對應序號藥袋前，完全無法預測或改變分組結果。",
        "s3_blinding": "採四重盲法（Quadruple-blinded：受試者、手術與照護醫師、結果評估護理師、統計分析師全盲）＋主動基礎止痛對照：\n1. 對照組並非『不給止痛藥』（違反倫理），而是兩組皆提供標準基礎自控式止痛（PCA），對照組搭配外觀完全相同之澱粉安慰劑膠囊，以徹底分離出『服藥心理安慰劑效應』與『新配方真實藥理效應』。\n2. 統計分析師拿到的資料檔僅標示為 Group A 與 Group B，直至主要統計檢定全部完成並鎖定結果後才由藥局解盲（Unblinding）。",
        "s3_bias": [
          [
            "安慰劑效應（Placebo Effect）",
            "患者因知道自己吃到『新止痛藥』而主觀覺得比較不痛，虛假誇大新藥效果。",

        "s3_ext": "・內部效度優勢：透過隨機分派、分派隱匿與雙盲安慰劑控制，本研究具備極高內部效度。\n・外部／生態效度界限：本研究於單一醫學中心針對 ASA I–II 級之單側初次膝關節置換患者進行，故結果可推論至同類型常規關節置換族群；但對於合併嚴重肝腎功能不全、慢性鴉片類藥物成癮或翻修手術患者，外推時需謹慎。",
        "s4_pop": "・目標母體（Target Population）：台灣接受單側初次全人工膝關節置換術（Primary Unilateral TKA）之退化性膝關節炎成年患者。\n・抽樣架構（Sampling Frame）：某醫學中心骨科部預計於 2026 年 11 月至 2027 年 8 月排程住院接受 TKA 手術之患者名冊。\n・納入條件：① 年齡 50–80 歲；② 診斷為原發性退化性膝關節炎並排程單側初次 TKA；③ 麻醉風險分級 ASA I–II 級；④ 能理解中文 VAS 量尺並簽署知情同意書。\n・排除條件：① 對研究藥物成分過敏或有消化道潰瘍出血病史；② 術前長期使用鴉片類止痛藥（>30 天）；③ 嚴重肝腎功能異常（eGFR < 30 mL/min）。",
        "s4_sampling": "採連續立意抽樣（Consecutive Sampling）結合組間隨機分派：凡於收案期間符合納排條件之排程住院患者均逐一邀請，以降低挑選偏誤；並記錄拒絕參與者之年齡與性別比例，檢驗有無無回應偏差（Non-response bias）。",
        "s4_power": "本研究以主要依變項「術後 24 小時活動疼痛 VAS 分數」之兩獨立樣本雙尾 t 檢定進行先驗樣本數計算（A-priori power analysis）：\n・顯著水準：雙尾 α ＝ .05\n・目標統計檢定力：Power（1 − β）＝ .80（β ＝ .20）\n・預期效應量依據：依過去關節置換術後疼痛文獻，VAS 標準差約為 SD ＝ 30 mm，臨床最小重要差異（MCID）為 15 mm，換算標準化效應量 Cohen's d ＝ 15 / 30 ＝ 0.50（中等效應量）。\n・有效樣本數：代入兩獨立樣本 t 檢定公式（G*Power 3.1 核對），每組所需最小有效樣本數為 n ＝ 64 人，兩組合計有效樣本數為 128 人。\n・流失率換算：考量術後可能發生臨時改變麻醉方式、轉入加護病房或撤回同意等約 15% 之流失率，每組預計招募 N ＝ ⌈64 / (1 − 0.15)⌉ ＝ 76 人，兩組總計招募 152 人。",
        "s4_scenarios": "【不同效應量情境之樣本數與檢定力對照表（α ＝ .05 雙尾）】\n1. 保守情境（小至中效應 d ＝ 0.40，差值 12 mm）：若維持每組 n ＝ 64 人，檢定力為 .61；若欲達 Power .80 則每組需 100 人（總計 200 人）。\n2. 基準規劃情境（中等效應 d ＝ 0.50，差值 15 mm＝MCID）：每組有效樣本 n ＝ 64 人（總計 128 人，招募 152 人），檢定力達 .80。\n3. 樂觀情境（中至大效應 d ＝ 0.65，差值 19.5 mm）：在每組 n ＝ 64 人下，統計檢定力高達 .95（即使僅每組 39 人亦達 Power .80）。",
        "s5_layout": "・資料結構：採寬表（Wide format），「1 列 ＝ 1 位受試患者（共 128 列有效樣本）」。\n・核心欄位：`patient_id`（S001–S152）、`group`（1＝實驗組, 0＝對照組）、`age`、`sex`、`bmi`、`vas_pre`（術前基線 0–100）、`vas_24h`（術後 24h 主要結果 0–100）、`morphine_48h`（48h 累積嗎啡 mg）、`ponv_48h`（1＝有噁心嘔吐, 0＝無）、`adherence_pct`（服藥順從率 %）、`itt_flag`（1＝納入 ITT）。\n・缺失值編碼：統一以空白或 `NA` 表示，絕不使用 `999` 或 `-9` 等數值代號以免誤入平均數計算。",
        "s5_clean": "1. 值域與邏輯檢查：確認 `vas_pre` 與 `vas_24h` 均介於 0–100 mm、`morphine_48h` ≥ 0、`age` 介於 50–80 歲。\n2. 離群值處理規則：以箱型圖（Q1 − 1.5×IQR 與 Q3 ＋ 1.5×IQR）及 |z| > 3.0 篩檢嗎啡消耗量與 VAS 極端值；若發現極端高值，先回溯核對 PCA 幫浦原始電子紀錄與病歷，若為輸入筆誤則修正，若為真實極端疼痛反應則予以保留，並執行「納入 vs 排除離群值」之敏感度分析。\n3. 缺失值處理：因觀察期僅住院術後 48 小時，預期缺失率 < 5%；若發生隨機缺失（MAR），主要 ITT 分析採多重插補法（Multiple Imputation, m ＝ 20）處理。",
        "s5_desc": "1. Table 1（兩組基線人口學與臨床特徵表，N ＝ 128）：比較實驗組（n ＝ 64）與對照組（n ＝ 64）之年齡、BMI、手術時間、術前基線 VAS（報 M ± SD）及性別、ASA 分級（報 n [%]），並計算標準化平均數差（SMD < 0.10 代表隨機分派平衡良好）。\n2. Table 2（主要與次要結果摘要表）與視覺化：呈現兩組 `vas_24h` 與 `morphine_48h` 之 M ± SD 及 Median (IQR)，繪製「兩組術後 24 小時疼痛 VAS 箱型圖疊加個人資料點（Jittered Boxplot）」與「48 小時 PONV 發生率直行百分比長條圖」。",
        "s5_assump": "1. 連續依變項（VAS_24h、嗎啡消耗量）：\n   ・常態性檢查：分別對兩組殘差繪製 Q-Q 圖並執行 Shapiro–Wilk 檢定。\n   ・變異數同質性檢查：執行 Levene's test。\n   ・違反前提之替代方案：若違反等變異數（Levene p < .05），改採不假設等變異之 Welch's t 檢定；若嚴重偏態（如嗎啡消耗量常呈右偏），則同時報告無母數 Mann–Whitney U 檢定（Wilcoxon rank-sum test）與 Hodges–Lehmann 中位數差之 95% CI。\n2. 類別依變項（PONV 發生率）：檢查 2×2 列聯表四格期望次數是否皆 ≥ 5；若有任一格期望次數 < 5，改採 Fisher's exact test。",

        "s6_mult": "1. 分析族群定義：主要分析嚴格採用「意圖治療分析（Intention-to-Treat, ITT，N ＝ 128）」，所有完成隨機分派之患者均保留於原分派組別；次要敏感度分析執行「依議定書分析（Per-Protocol, PP）」，僅納入完成全數 4 次膠囊服用且無重大違規之患者，比對 ITT 與 PP 結論是否一致。\n2. 多重比較控制：本研究固定單一主要結果（VAS_24h），兩項次要結果（嗎啡量與 PONV）以 Holm–Bonferroni 逐步校正法控制家族型一錯誤率（FWER ≤ .05）。",
        "s6_apa": "【預期／模擬結果 APA 第 7 版標準報告句】\n1. 主要結果（獨立樣本 t 檢定）：獨立樣本 t 檢定結果顯示，實驗組術後 24 小時活動疼痛 VAS 分數（M ＝ 34.20, SD ＝ 18.50, n ＝ 64）顯著低於安慰劑對照組（M ＝ 49.80, SD ＝ 20.10, n ＝ 64），兩組平均差為 −15.60 mm，95% CI [−22.36, −8.84]，t(126) ＝ −4.57, p < .001，效應量 Cohen's d ＝ −0.81（95% CI [−1.17, −0.45]），達大型效應且超過臨床最小重要差異（MCID ＝ 15 mm）。以術前基線疼痛為共變項之 ANCOVA 結果亦維持一致（調整後平均差 −15.42 mm, F(1, 125) ＝ 21.38, p < .001, 局部 η²p ＝ .146）。\n2. 次要類別結果（卡方檢定）：實驗組術後 48 小時噁心嘔吐發生率為 15.6%（10/64），顯著低於對照組之 34.4%（22/64），χ²(1, N ＝ 128) ＝ 6.00, p ＝ .014，勝算比 OR ＝ 0.35，95% CI [0.15, 0.83]，φ ＝ .22。",
        "s6_interp": "【結果解讀四步驟】\n① 重述問題與假設：本研究檢驗新型多模式口服止痛方案能否在不增加副作用下降低人工膝關節術後急性疼痛與嗎啡消耗。\n② 效應量與 95% CI 先行：實驗組較對照組平均降低 15.60 mm 疼痛分數（95% CI [−22.36, −8.84]，Cohen's d ＝ −0.81, p < .001），且噁心嘔吐勝算降低 65%（OR ＝ 0.35）。\n③ 連結臨床與實務意義：15.60 mm 之降幅已跨過臨床最小重要差異門檻（15 mm），能實質幫助患者於術後第一天順利配合下床彎曲復健並減少鴉片類藥物副作用。\n④ 不顯著預案與研究限制：\n・若主要結果 p ≥ .05：將檢視 95% CI 是否完全落在 [−15, +15] mm 之臨床等效區間內（以 TOST 雙單側檢定判斷是否證實兩方案止痛效果相當），絕不直接將 p > .05 誤稱為『證明無差異』。\n・研究限制：(1) 僅於單一醫學中心收案，外推至地區醫院需多中心驗證；(2) 僅追蹤住院術後 48 小時急性期，未評估出院後 3 個月慢性術後疼痛；(3) 排除長期使用止痛藥與高麻醉風險（ASA ≥ III）患者。"
      }

        "s3_blinding": "採評估者與資料分析者雙重盲化（Assessor- and Analyst-blinded）：\n1. 患者在耳機與防窺螢幕下觀看個人手機介面，隨後進入獨立衛教診間由不知道患者剛才看哪一版介面之研究助理執行 10 題理解度口頭測驗。\n2. HIS 檢驗科抽血人員完全不知患者參與研究或所屬組別，確保「準時完檢」判定百分之百客觀。",

        "s3_ext": "・內部效度：透過獨立組間單一版本呈現、盲化口頭測驗與客觀 HIS 完檢紀錄，排除練習效應與主觀迎合偏差。\n・外部效度：直接於真實醫院門診流程中執行，生態效度極高，結果可直接作為門診 App 改版上線之決策依據。",
        "s4_pop": "・目標母體：台灣區域醫院以上門診定期追蹤且需空腹抽血之 65 歲以上慢性病（糖尿病、高血脂）患者。\n・抽樣架構：某醫院新陳代謝科門診於收案期間（預計 12 週）開立下次回診空腹抽血醫囑之 65 歲以上患者名單。\n・納入條件：① 年滿 65 歲；② 具基本華語或台語聽說能力及基本視力（矯正後可辨識手機螢幕）；③ 本人持有智慧型手機並同意參與。\n・排除條件：① 確診中重度失智症或認知障礙（SPMSQ 錯 4 題以上）；② 居住於住宿型長照機構由專人全權處理就醫者。",

        "s4_power": "本研究同時考量兩項主要結果進行先驗樣本數估算，並取較大者以確保兩項檢定均具充足檢定力：\n1. 針對理解度測驗分數（獨立樣本雙尾 t 檢定）：設定 α ＝ .05、Power ＝ .80、中等效應量 Cohen's d ＝ 0.50，每組需有效樣本 64 人（共 128 人）。\n2. 針對 14 天準時完檢率（Pearson 卡方獨立性檢定 df ＝ 1）：過去傳統文字版完檢率約為 p_B ＝ 60%，預期圖像互動版可提升至 p_A ＝ 80%（絕對提升 20%，對應效應量 w ≈ 0.218），在雙尾 α ＝ .05、Power ＝ .85 下，每組需有效樣本 n ＝ 94 人，取整數為每組有效樣本 n ＝ 100 人，兩組合計有效樣本 N ＝ 200 人。\n3. 招募換算：因主要結果由 HIS 系統自動勾稽 14 天完檢紀錄，僅少數患者可能因轉院或取消門診無法追蹤（預估流失率 10%），故預計招募 N ＝ ⌈200 / (1 − 0.10)⌉ ＝ 224 人（每組 112 人）。",
        "s4_scenarios": "【在有效樣本 N ＝ 200（每組 100 人）、雙尾 α ＝ .05 下之敏感度與檢定力表現】\n1. 對連續變項（獨立 t 檢定）：對中等效應量 d ＝ 0.50 之統計檢定力高達 .94；最小可偵測效應量（MDE, Power .80）為 d ＝ 0.40。\n2. 對二元類別變項（卡方檢定）：若完檢率為 60% vs 80%（差 20%），檢定力達 .87；若為 65% vs 83%（差 18%），檢定力達 .83。",
        "s5_layout": "・資料結構：寬表（Wide format），「1 列 ＝ 1 位門診受試患者（有效樣本 N ＝ 200 列）」。\n・核心欄位：`id`、`group`（1＝A組圖像版, 0＝B組文字版）、`age`、`sex`、`edu_yr`、`phone_freq`、`comp_score`（0–100 分）、`read_sec`（閱讀秒數）、`converted_14d`（1＝14天內準時空腹完檢, 0＝未完成）。",
        "s5_clean": "1. 範圍與一致性檢查：`comp_score` 介於 0–100 且為 10 之倍數、`converted_14d` 僅含 0 與 1、`age` ≥ 65。\n2. 離群值規則：檢查 `read_sec`（閱讀秒數）是否有因手機放置未關螢幕導致之極端長秒數（> Q3 ＋ 1.5×IQR）；經核對後於秒數分析同時報告中位數與 IQR，並執行截尾敏感度分析。\n3. 缺失值處理：HIS 完檢紀錄無主觀漏答問題；若問卷基本資料有零星漏填（< 2%），以多重插補法處理。",
        "s5_desc": "1. Table 1（兩組基線特徵表，N ＝ 200）：比較 A 組（n ＝ 100）與 B 組（n ＝ 100）之年齡、教育年數（M ± SD）及性別、同住狀況、手機使用頻率（n [%]）。\n2. Table 2（2×2 列聯表與理解度分數摘要）：呈現兩組 14 天準時完檢人數與直行百分比（Column %，依 @ 2.4 第 15 張規矩：以各組總人數為分母計算完檢率 %），以及理解度分數之 M ± SD 與 Median (IQR)。",
        "s5_assump": "1. 針對卡方檢定（2×2 列聯表）：檢查四個細格之「期望次數（Expected Count ＝ 列總和 × 行總和 ÷ N）」是否全部 ≥ 5。在 N ＝ 200 下四格期望次數均 > 25，滿足大樣本近似前提（若任一格 < 5 則改用 Fisher 精確檢定）。\n2. 針對獨立樣本 t 檢定（理解度分數）：執行 Shapiro–Wilk 常態性檢定與 Levene 等變異數檢定；若 Levene p < .05 違反等變異則改報告 Welch's t 檢定，若嚴重偏態則加報 Mann–Whitney U 檢定。\n3. 針對多元迴歸：檢查殘差常態性、等分散性與共線性指標（VIF < 5）。",

        "s6_apa": "【預期／模擬結果 APA 第 7 版標準報告句】\n1. 類別完檢率（Pearson 卡方與邏輯斯迴歸）：卡方獨立性檢定顯示，圖像互動版 A 組之 14 天準時空腹完檢率為 81.0%（81/100），顯著高於傳統文字版 B 組之 62.0%（62/100），風險差 RD ＝ +19.0%（95% CI [+6.8%, +31.2%]），χ²(1, N ＝ 200) ＝ 8.86, p ＝ .003，未校正勝算比 OR ＝ 2.61，95% CI [1.38, 4.95]，效應量 φ ＝ .21（小至中等效應）。於多變項邏輯斯迴歸控制年齡、教育年數與手機使用頻率後，A 組之完檢勝算仍顯著高於 B 組（調整後 aOR ＝ 2.74, 95% CI [1.41, 5.32], p ＝ .003）。\n2. 數值理解度（獨立樣本 t 檢定）：A 組之衛教理解度分數（M ＝ 84.60, SD ＝ 12.40, n ＝ 100）顯著高於 B 組（M ＝ 71.20, SD ＝ 15.80, n ＝ 100），平均差 Δ ＝ 13.40 分，95% CI [9.44, 17.36]，Welch's t(187.3) ＝ 6.67, p < .001, Cohen's d ＝ 0.94（大型效應）。",
        "s6_interp": "【結果解讀四步驟】\n① 重述問題：檢驗圖像語音互動介面相較於傳統文字版，能否提升高齡患者衛教理解度與 14 天準時空腹回診完檢率。\n② 效應量與 CI 先行：理解度平均提升 13.40 分（d ＝ 0.94, 95% CI [9.44, 17.36]），14 天準時完檢率由 62.0% 提升至 81.0%（aOR ＝ 2.74, p ＝ .003）。\n③ 連結實務意義：每 100 位門診高齡患者中，改用圖像互動版可減少 19 人次因未空腹而白跑一趟醫院重抽血（益一需治數 NNT ≈ 5.3 人），顯著節省檢驗櫃檯重排成本。\n④ 不顯著預案與限制：(1) 若完檢率未達顯著，將檢視是否僅在低教育程度次族群有效（交互作用次族群探索）；(2) 限制為僅納入持有智慧型手機之長者，對於完全無數位設備之弱勢高齡者仍須保留紙本圖卡衛教；(3) 僅評估單次門診 14 天行為，尚未評估長期半年維持效果。"

        "s3_ext": "・內部效度：組內配對設計彻底排除個人固定特質干擾，雙基線與排班負荷紀錄有助控制均值回歸與工作量混淆；惟缺乏同期未介入對照組，仍無法百分之百排除季節性趨勢。\n・外部效度：線上微課程高度契合台灣醫院三班制輪班生態，具良好實務推廣可行性。",
        "s4_pop": "・目標母體：台灣區域級以上醫院急診室（ER）與加護病房（ICU）之全職輪班臨床護理師。\n・抽樣架構：某區域教學醫院急診與內外科加護病房在職護理師名冊（共約 160 人）。\n・納入條件：① 年滿 20 歲之全職急重症護理師；② 任職於現單位滿 6 個月以上且需輪值小夜或大夜班；③ 自願參與並簽署知情同意書。\n・排除條件：① 過去半年內曾參加結構化正念課程或固定接受心理治療者；② 研究期間預計調離急重症單位或請產假／育嬰假者。",

        "s4_scenarios": "【配對樣本雙尾 t 檢定（α ＝ .05）不同效應量情境對照】\n1. 保守情境（小至中效應 dz ＝ 0.40，約降 2.4 分）：若有效樣本 n ＝ 34，檢定力為 .62；欲達 Power .80 需有效樣本 52 人。\n2. 基準規劃情境（中等效應 dz ＝ 0.50，約降 3.0 分）：有效樣本 n ＝ 34 人（招募 40 人），檢定力達 .80。\n3. 樂觀情境（中至大效應 dz ＝ 0.65，約降 3.9 分）：在 n ＝ 34 人下，檢定力高達 .96。",

        "s5_clean": "1. 值域與反向題檢查：確認 PSS-10 第 4、5、7、8 四題正向題已正確執行反向計分（0↔4、1↔3），總分介於 0–40 分。\n2. 離群值規則：針對個人前後差值 `pss_diff` 繪製箱型圖（Q1 − 1.5×IQR 與 Q3 ＋ 1.5×IQR）；若出現單人差值極端異常（如暴增或暴減 > 18 分），先核對作答時間是否過短（< 30 秒直線作答），真實反應則保留並執行敏感度分析。\n3. 缺失值處理：若少數受試者缺 T₃ 追蹤資料，三時間點分析併採線性混合效應模型（LMM，可納入所有具至少一次測量之受試者）。",
        "s5_desc": "1. Table 1（受試者基線特徵表，n ＝ 34）：呈現年齡、護理科系年資、每月平均夜班數（M ± SD）及單位別、婚姻狀況（n [%]）。\n2. Table 2（T₁、T₂、T₃ 各時間點結果摘要與個人變化量）：呈現 PSS-10 與 CBI 於三時間點之 M ± SD 與 Median (IQR)，並繪製「34 位受試者前後測配對斜率連線圖（Paired Spaghetti / Slope Plot）＋平均趨勢線（±1 SD）」。",
        "s5_assump": "1. 配對樣本 t 檢定（T₁ vs T₂）：\n   ・關鍵注意：常態性前提是檢驗「配對差值 `pss_diff = pss_t2 - pss_t1`」是否呈常態分佈（而非分別檢驗 T₁ 與 T₂）！將對 `pss_diff` 繪製 Q-Q 圖並執行 Shapiro–Wilk 檢定。\n   ・違反前提替代方案：若 `pss_diff` 顯著偏態（Shapiro–Wilk p < .05），改採無母數「Wilcoxon 符號等級檢定（Wilcoxon signed-rank test）」，並報告中位數差與等級雙列相關 r_rb。\n2. 單因子重複測量 ANOVA（T₁、T₂、T₃ 三時間點）：\n   ・球形性前提檢查：執行 Mauchly's test of sphericity（檢驗各時間點兩兩差值之變異數是否相等）。\n   ・違反前提替代方案：若 Mauchly p < .05 違反球形性，自由度改採 Greenhouse–Geisser（當 ε < .75）或 Huynh–Feldt 校正；若嚴重偏態則改採無母數 Friedman 檢定。",

        "s6_mult": "1. 同時報告兩種組內效應量指標：Cohen's dz（以差值標準差 SD_d 為分母，直接對應配對 t 檢定與樣本數計算）與 Cohen's dav（以預後平均標準差為分母，便於與組間文獻直接比較大小，@ 2.6 s41）。\n2. 三時間點事後比較採 Holm–Bonferroni 校正，控制三次兩兩比較的總型一錯誤率 ≤ .05。",
        "s6_apa": "【預期／模擬結果 APA 第 7 版標準報告句】\n1. 主要結果（配對樣本 t 檢定）：配對樣本 t 檢定結果顯示，急重症護理人員完成 8 週正念減壓課程後之知覺壓力 PSS-10 分數（M ＝ 17.20, SD ＝ 5.40）較介入前基線（M ＝ 21.10, SD ＝ 5.80）顯著下降，平均配對差值 d̄ ＝ −3.90 分（SD_d ＝ 5.10, SE ＝ 0.87），95% CI [−5.68, −2.12]，t(33) ＝ −4.46, p < .001，組內效應量 Cohen's dz ＝ −0.76（Cohen's dav ＝ −0.70），達中至大型減壓效應。\n2. 三時間點追蹤（重複測量 ANOVA）：單因子重複測量變異數分析（經 Greenhouse–Geisser 校正，ε ＝ .84）顯示時間主效應達統計顯著，F(1.68, 55.44) ＝ 14.82, p < .001, 局部 η²p ＝ .310；Holm 校正事後比較顯示課後 4 週追蹤期分數（M ＝ 17.85, SD ＝ 5.65）仍顯著低於介入前基線（平均差 −3.25 分, p ＝ .002），顯示減壓效果具良好維持性。",

        "s1_rq": "於健康成年輪班醫護人員（P）中，服用「無水咖啡因膠囊 200 mg（實驗條件 X）」相較於服用「外觀相同之澱粉安慰劑膠囊（對照條件 C）」，於服用後 45 分鐘執行電腦化精神運動警覺度測驗（PVT）時，是否能顯著縮短平均視覺選擇反應時間（Primary DV，單位：毫秒 ms）並降低反應失誤次數（Secondary DV）？",
        "s1_why": "1. 重要性（Important）：醫護人員夜班或長時間值班後警覺度下降，反應時間延長 30–50 ms 即可能增加給藥核對疏失或下班通勤車禍風險。\n2. 新穎性（Novel）：個人基礎反應時間天生差異極大（有人天生 240 ms、有人 360 ms），本研究採雙盲組內交叉對抗平衡設計（AB/BA）搭配 7 天洗滌期，徹底消除個人基礎神經反應差異與練習效應。\n3. 合時宜（Timely）：提供醫療現場輪班疲勞管理與精準咖啡因補充時機之實證依據。",

        "s2_principle": "1. 主要依變項為毫秒級（ms）連續比率尺度，具備極高客觀性與統計靈敏度。\n2. 資料表同時記錄「依條件排列（`rt_caffeine`, `rt_placebo`）」與「依階段排列（`rt_period1`, `rt_period2`）」，以便同時檢驗條件主效應與階段練習效應。",
        "s2_rel": "1. 儀器計時精準度：採用硬體毫秒同步反應盒（Response Box），計時誤差 < 1 ms。\n2. 測驗內部一致性與再測信度：10 分鐘 100 次嘗試之奇偶折半信度（Split-half reliability）r > .92；正式實驗前安排 20 次暖身練習嘗試（Practice trials，不計入正式分數），使受試者熟悉按鍵以穩定基線表現。",
        "s2_val": "電腦化視覺反應時間測驗（PVT）為國際睡眠與警覺度研究之黃金效標工具，對中樞興奮劑與睡眠剝奪具高度敏感效度。",
        "s3_assign": "採 2×2 雙盲交叉對抗平衡設計（AB/BA Crossover with Counterbalancing）：\n1. 對抗平衡分派：34 位有效受試者由電腦區組亂數 1:1 隨機分入「序列 AB 組（n ＝ 17，Day 1 咖啡因 → Day 8 安慰劑）」與「序列 BA 組（n ＝ 17，Day 1 安慰劑 → Day 8 咖啡因）」。\n2. 洗滌期（Washout Period）：兩階段固定間隔 7 天（168 小時）。健康成人咖啡因消除半衰期約 4–6 小時，7 天超過 25 個半衰期，血中藥物殘留量為 0，且同一星期幾上午 09:00 施測可確保週次作息一致。",
        "s3_blinding": "採雙盲設計（受試者與施測研究員雙盲）：無水咖啡因 200 mg 與微晶纖維素安慰劑均封裝於完全不透光之同色號 0 號膠囊內，無苦味外洩，由獨立藥師依流水號與階段貼標（Day 1 藥包、Day 8 藥包）。",

            "實施嚴格 1:1 AB/BA 對抗平衡（一半人 Day 8 吃安慰劑、一半人 Day 8 吃咖啡因），使練習效應在兩條件間完全對稱抵消；並在 Day 1 正式測驗前先做 20 題暖身練習讓學習曲線趨於平緩。"

        "s3_ext": "・內部效度：結合自身配對、AB/BA 對抗平衡、7 天洗滌期、24 小時禁咖啡因與雙盲膠囊，內部效度極高。\n・外部效度：實驗室標準化 PVT 測驗代表基礎視覺運動警覺度，外推至複雜臨床決策時需考量真實病房多重任務情境。",
        "s4_pop": "・目標母體：台灣醫療院所 20–45 歲需要輪值夜班之健康成年醫護人員。\n・抽樣架構：某教學醫院招募公告報名之輪班醫護人員名冊。\n・納入條件：① 年齡 20–45 歲；② 具正常或矯正後正常視力（≥ 0.8）；③ 平時有輕中度咖啡因攝取習慣（每日 50–300 mg，避免從不喝咖啡者產生心悸不適）。\n・排除條件：① 患有心律不整、高血壓、焦慮症、失眠症或胃潰瘍；② 懷孕或哺乳中婦女；③ 正在服用影響中樞神經之鎮靜安眠藥或抗組織胺。",
        "s4_sampling": "採院內立意招募抽樣，符合納排條件者依報名順序由電腦亂數隨機分派至序列 AB 或序列 BA。",
        "s4_power": "本研究以主要結果「咖啡因 vs 安慰劑條件下視覺選擇反應時間差值（配對樣本雙尾 t 檢定）」進行先驗樣本數估算：\n・顯著水準：雙尾 α ＝ .05\n・目標統計檢定力：Power（1 − β）＝ .80\n・預期效應量依據：依過去咖啡因認知警覺度文獻，組內條件反應時間差值之標準差約為 SD_d ＝ 36 ms，預期 200 mg 咖啡因可縮短反應時間 18 ms 以上，對應中等配對效應量 Cohen's dz ＝ 18 / 36 ＝ 0.50。\n・有效樣本數：代入配對樣本雙尾 t 檢定公式，所需最小有效樣本數為 n ＝ 34 人（序列 AB 組 17 人、序列 BA 組 17 人）。\n・招募換算：考量受試者須間隔 7 天到場兩次，預估約 15% 可能因臨時調班或感冒無法完成第二階段，預計招募 N ＝ ⌈34 / (1 − 0.15)⌉ ＝ 40 人（每序列 20 人）。",
        "s4_scenarios": "【組內交叉配對 t 檢定（n ＝ 34，雙尾 α ＝ .05）檢定力與組間效率對照】\n1. 設計效率對照：在相同效應量 0.50 下，平行組間設計需 128 人，本組內交叉設計僅需 34 人（每位受試者提供 2 筆條件數據，共 68 人次測量）。\n2. 敏感度情境：在有效樣本 n ＝ 34 下，對 dz ＝ 0.45（差 16.2 ms）、dz ＝ 0.50（差 18.0 ms）、dz ＝ 0.65（差 23.4 ms）之檢定力分別為 .72、.80、.96。",
        "s5_layout": "・資料結構：主表採寬表（Wide format），「1 列 ＝ 1 位受試者（有效樣本 n ＝ 34 列）」。\n・核心欄位：`id`、`sequence`（1＝AB［先X後C］, 2＝BA［先C後X］）、`age`、`sex`、`habit_caff_mg`、`rt_caffeine`（X 條件平均反應時間 ms）、`rt_placebo`（C 條件平均反應時間 ms）、`rt_diff`（＝ `rt_caffeine - rt_placebo`）、`rt_period1`（Day 1 分數）、`rt_period2`（Day 8 分數）、`lapses_caffeine`、`lapses_placebo`。",
        "s5_clean": "1. 單次嘗試（Trial-level）清理規矩：依認知心理學標準，單次按鍵反應 < 100 ms 視為預期搶答（Anticipation）、> 1500 ms 視為設備或分心極端值，於計算個人 100 次平均前先予剔除（並同時計算個人中位數 RT 作為穩健指標）。\n2. 受試者層級離群值檢查：對 34 人之條件差值 `rt_diff` 繪製箱型圖（1.5 × IQR，參照 @ 2.4 第 17 張箱型圖反應時間實例）；若有極端差值先核對前一晚睡眠時數是否嚴重不足，並執行納入 vs 排除之敏感度分析。",
        "s5_desc": "1. Table 1（受試者基線特徵與兩序列平衡表，n ＝ 34）：比較序列 AB 組（n ＝ 17）與序列 BA 組（n ＝ 17）之年齡、性別、每日習慣咖啡因攝取量與基線睡眠時數（M ± SD / n [%]）。\n2. Table 2 與箱型圖（@ 2.4 第 17 張）：呈現咖啡因條件與安慰劑條件之反應時間（ms）及失誤次數之 M ± SD 與 Median (IQR)，並繪製「兩條件反應時間箱型圖＋個人配對連線圖」。",
        "s5_assump": "1. 配對差值常態性檢查：對 `rt_diff = rt_caffeine - rt_placebo` 執行 Shapiro–Wilk 常態性檢定與 Q-Q 圖檢視；若違反常態（p < .05），改報告無母數 Wilcoxon 符號等級檢定。\n2. 交叉設計專屬前提檢查（無殘留效應 Assumption of No Carryover）：以線性混合效應模型（固定效應：Condition、Period、Sequence；隨機效應：Subject ID）或 Grizzle 兩樣本 t 檢定檢驗「Sequence（AB vs BA）主效應與 Condition × Period 交互作用」是否不顯著（p > .10），確認 7 天洗滌期徹底消除殘留。",

        "s6_apa": "【預期／模擬結果 APA 第 7 版標準報告句】\n1. 主要結果（配對樣本 t 檢定）：配對樣本 t 檢定結果顯示，輪班醫護人員於攝取 200 mg 咖啡因條件下之視覺選擇反應時間（M ＝ 284.50 ms, SD ＝ 32.10）顯著快於安慰劑條件（M ＝ 308.20 ms, SD ＝ 35.40），個人平均條件差 d̄ ＝ −23.70 ms（SD_d ＝ 28.50, SE ＝ 4.89），95% CI [−33.65, −13.75]，t(33) ＝ −4.85, p < .001，組內效應量 Cohen's dz ＝ −0.83（Cohen's dav ＝ −0.70），屬大型促進效應。\n2. 順序與殘留效應檢核（LMM）：2×2 交叉混合模型顯示，第二階段較第一階段平均快 4.80 ms 之練習效應未達顯著（F(1, 32) ＝ 1.84, p ＝ .184），且序列間殘留效應亦不顯著（F(1, 32) ＝ 0.42, p ＝ .521），證實 AB/BA 對抗平衡與 7 天洗滌期成功排除練習與殘留污染。",

        "s4_pop": "・目標母體：台灣發病滿 6 個月以上、遺留單側下肢偏癱且具基本輔助行走能力之慢性期腦中風成年患者。\n・抽樣架構：某醫學中心與合作區域醫院復健科門診於收案期間就診之慢性中風患者名冊。\n・納入條件：① 年齡 20–80 歲；② 初次單側大腦半球缺血性或出血性中風且發病 ≥ 6 個月；③ 功能性行走分類（FAC）第 2–4 級（可在監督或助行器下走 10 公尺）；④ 基線舒適步行速度介於 0.15–0.80 m/s。\n・排除條件：① 下肢關節嚴重攣縮（Modified Ashworth Scale ≥ 3）或骨科骨折未癒合；② 嚴重認知或失語症無法配合指令（MMSE < 20）；③ 不穩定心絞痛或未控制高血壓。",

        "s4_power": "本研究以主要結果「10 公尺步行速度於 2（組別）× 3（時間點）混合設計 ANOVA 之組別 × 時間交互作用」及「T₃ 前後進步量組間比較」進行先驗樣本數估算：\n・顯著水準：雙尾 α ＝ .05；目標統計檢定力：Power（1 − β）＝ .80\n・效應量依據：依中風外骨骼復健文獻，10MWT 臨床最小重要差異（MCID）為 0.14 m/s，前後進步量標準差約為 SD ＝ 0.18 m/s（對應進步量組間效應量 Cohen's d ≈ 0.78，或混合 ANOVA 交互作用中等偏上效應 f ＝ 0.20–0.22，重複測量相關 ρ ＝ .65）。\n・有效樣本數：以保守捕捉進步量組間中大型效應 d ＝ 0.78（或混合交互作用）計算，每組所需最小有效樣本數為 n ＝ 26 人，兩組合計有效樣本 N ＝ 52 人。\n・招募換算：考量 12 週門診復健約 15% 之流失率，每組預計招募 N ＝ ⌈26 / (1 − 0.15)⌉ ＝ 31 人，兩組總計招募 62 人。",
        "s4_scenarios": "【在兩組有效樣本 N ＝ 52（每組 26 人）、雙尾 α ＝ .05、重複測量相關 r ＝ .65 下之檢定力】\n1. 對 2×3 混合設計 Group × Time 交互作用：當交互效應 f ＝ 0.18 時 Power ＝ .81；當 f ＝ 0.22 時 Power ＝ .93。\n2. 對 T₃−T₁ 進步量之兩組比較（或 ANCOVA）：當兩組進步差達 MCID（0.14 m/s, d ＝ 0.78）時，統計檢定力達 .80。",
        "s5_layout": "・資料結構：同時建立寬表（Wide format，1 列 ＝ 1 位患者，N ＝ 52 列，含 `speed_t1`, `speed_t2`, `speed_t3`, `speed_diff_t3_t1`）與長表（Long format，1 列 ＝ 1 位患者 × 1 個時間點，52 × 3 ＝ 156 列，供 LMM 與折線圖使用）。\n・核心欄位：`id`、`group`（1＝Keeogo外骨骼組, 0＝傳統復健組）、`strata_speed`、`age`、`sex`、`stroke_months`、`fma_le_pre`、`speed_t1`、`speed_t2`、`speed_t3`、`speed_diff`（＝ `speed_t3 - speed_t1`）、`tug_t1`、`tug_t2`、`tug_t3`、`sixmwt_t1`、`sixmwt_t2`、`sixmwt_t3`、`attended_sessions`。",
        "s5_clean": "1. 值域與物理合理性檢查：確認步行速度介於 0.05–2.00 m/s、TUG 秒數介於 5–120 秒、出席堂數介於 0–36 堂。\n2. 離群值檢查：檢查各組於各時間點之速度變化量是否超過 Q3 ＋ 1.5×IQR；若患者因施測當日踝關節扭傷導致數據異常，核對評估日誌並執行敏感度分析。\n3. 缺失值機制：若有患者於第 4 週後因交通因素中斷未完成 T₃，於線性混合效應模型（LMM）下利用最大概似估計法（REML）直接納入所有觀測時間點，無須強行剔除個案。",
        "s5_desc": "1. Table 1（兩組基線人口學與中風臨床特徵表，N ＝ 52）：比較外骨骼組（n ＝ 26）與傳統組（n ＝ 26）之年齡、發病月數、基線 FMA-LE、基線 10MWT 速度（M ± SD）及性別、中風類型、偏癱側別（n [%]）。\n2. Table 2 與圖 1（2×3 各時間點結果摘要與交互作用折線圖）：列出兩組於 T₁、T₂、T₃ 之 M ± SD，並繪製「實驗組 vs 對照組於 T₁、T₂、T₃ 之 10MWT 步行速度變化趨勢折線圖（含 ±1 SE / 95% CI 誤差線）」，直觀展現兩條線是否隨時間分岔（交互作用）。",
        "s5_assump": "1. 二因子混合設計 ANOVA 前提檢查：\n   ・各格殘差常態性：Shapiro–Wilk 檢定與殘差 Q-Q 圖。\n   ・組間變異數同質性：各時間點之 Levene's test 與 Box's M 檢定。\n   ・組內球形性假設（Sphericity）：對 3 個時間點執行 Mauchly's test of sphericity；若 Mauchly p < .05 違反球形性，自由度改採 Greenhouse–Geisser 校正。\n2. 穩健與進階替代方案：同步執行「線性混合效應模型（LMM，固定效應：Group、Time、Group×Time；隨機效應：受試者隨機截距）」，LMM 不受嚴格球形性限制且能直接處理隨機缺失資料。",

        "s6_mult": "1. 嚴格遵守 @ 2.5 第 47 張混合設計分析規範：優先檢驗「Group × Time 交互作用項」；當交互作用達顯著時，才拆解檢驗（a）各時間點之兩組單純主要效應与（b）各組內隨時間變化之單純主要效應（以 Holm 法校正）。\n2. 額外計算兩組達到「10MWT 臨床最小重要差異（進步 ≥ 0.14 m/s）」之反應者比例（Responder rate %），報告風險差 RD 與益一需治數（NNT）。",
        "s6_apa": "【預期／模擬結果 APA 第 7 版標準報告句】\n1. 主要結果（2×3 混合設計 ANOVA）：二因子混合設計變異數分析（經 Greenhouse–Geisser 校正，ε ＝ .88）結果顯示，10 公尺步行速度之「組別 × 時間交互作用」達統計顯著，F(1.76, 88.00) ＝ 11.45, p < .001, 局部 η²p ＝ .186（大型交互效應）。單純主要效應分析顯示，兩組於 T₁ 基線步行速度無顯著差異（外骨骼組 0.42 ± 0.15 m/s vs 傳統組 0.43 ± 0.16 m/s, p ＝ .818）；然歷經 12 週訓練後（T₃），外骨骼組之平均進步量（+0.24 ± 0.14 m/s，達 0.66 ± 0.18 m/s）顯著大於傳統復健組（+0.09 ± 0.12 m/s，達 0.52 ± 0.17 m/s），兩組進步量差異 ΔΔ ＝ +0.15 m/s，95% CI [+0.08, +0.22]，t(50) ＝ 4.15, p < .001, Cohen's d ＝ 1.15。\n2. 臨床意義達標率：外骨骼組有 76.9%（20/26）患者之步行速度進步量達到臨床最小重要差異（≥ 0.14 m/s），顯著高於傳統組之 34.6%（9/26），χ²(1, N ＝ 52) ＝ 9.43, p ＝ .002, NNT ＝ 2.4。",
        "s6_interp": "【結果解讀四步驟】\n① 重述問題：檢驗 12 週穿戴式外骨骼（Keeogo）步態訓練相較於等時數傳統物理治療，能否更有效提升慢性中風患者之裸機步行速度。\n② 效應量與 CI 先行：組別 × 時間交互作用顯著（局部 η²p ＝ .186, p < .001），12 週後外骨骼組比傳統組多進步 0.15 m/s（95% CI [0.08, 0.22], d ＝ 1.15）。\n③ 連結臨床意義：外骨骼組平均速度由 0.42 m/s（受限社區行走邊緣）提升至 0.66 m/s，且超過 3/4 患者跨越 0.14 m/s 之臨床最小重要差異門檻，實質改善社區獨立行走能力。\n④ 研究限制：(1) 受限於穿戴式輔具實體外觀，無法對受試者本人與訓練治療師盲化（已透過光電自動計時與評估師盲化補救）；(2) 僅追蹤至 12 週訓練結束當週，尚未評估停訓後 3–6 個月之長期維持效果；(3) 樣本限於可輔助站立之慢性中風患者。"

        "s2_rel": "1. 6 分鐘行走測驗（6MWT）：依美國胸腔學會（ATS）標準化口頭鼓勵語（每滿 1 分鐘固定唸出標準句，不額外加油）施測，於慢性中風患者之再測信度 ICC(3,1) ＝ .97。\n2. 中文版 ABC 平衡信心量表：內部一致性 Cronbach's α 達 .94，再測信度 ICC ＝ .89。",

        "s3_ext": "・內部效度：雖非隨機分派，但透過核心變項 1:1 配對、基線動機量測控制、前後測差分與盲法評估，大幅降低非隨機研究之混淆風險。\n・外部效度：高度反映真實臨床患者自主選擇復健方案之場域情境。",
        "s4_pop": "・目標母體：台灣區域醫院與社區復健中心發病滿 6 個月以上、可行走但耐力受限之慢性腦中風患者。\n・抽樣架構：兩家合作復健中心門診慢性中風患者名冊。\n・納入條件：① 年齡 35–80 歲；② 單側腦中風發病 ≥ 6 個月；③ 可在無他人身體扶持下（可使用單拐或踝足矯具）連續行走至少 3 分鐘；④ 簽署知情同意書。\n・排除條件：① 過去 3 個月內下肢曾施打肉毒桿菌毒素；② 合併嚴重心肺疾病或帕金森氏症。",

        "s4_power": "本研究以主要結果「兩組 6 分鐘行走距離前後進步量（Δ6MWT）之比較（2×2 混合設計 Group × Time 交互作用／ANCOVA）」進行先驗樣本數估算：\n・顯著水準：雙尾 α ＝ .05；目標統計檢定力：Power（1 − β）＝ .80\n・效應量依據：慢性中風 6MWT 之臨床最小重要差異（MCID）為 34.4 公尺，過去文獻前後進步量標準差約為 SD ＝ 45.0 公尺，對應組間進步差效應量 Cohen's d ＝ 34.4 / 45.0 ≈ 0.76（混合設計組內前後相關 r ≈ .75）。為保守確保在控制基線共變項後仍具充足檢定力，設定可偵測中等偏上效應 d ＝ 0.65（混合交互作用 f ≈ 0.18）。\n・有效樣本數：經計算每組需有效樣本 n ＝ 30 人（共 30 對配對、總有效樣本 N ＝ 60 人）。\n・招募換算：考量 8 週訓練約 15% 之流失或配對失敗率，預計招募 N ＝ ⌈60 / (1 − 0.15)⌉ ＝ 72 人（每組 36 人）。",
        "s4_scenarios": "【在 N ＝ 60（每組 30 人，30 對）、雙尾 α ＝ .05 下之檢定力對照】\n1. 保守情境（兩組進步差 28 公尺, d ＝ 0.62）：統計檢定力為 .76（搭配 ANCOVA 控制基線後檢定力提升至 .83）。\n2. 基準臨床意義情境（兩組進步差達 MCID 34.4 公尺, d ＝ 0.76）：統計檢定力達 .88。\n3. 樂觀情境（兩組進步差 40 公尺, d ＝ 0.89）：統計檢定力達 .96。",
        "s5_layout": "・資料結構：寬表（Wide format），「1 列 ＝ 1 位受試者（N ＝ 60 列，含 `pair_id` P01–P30）」。\n・核心欄位：`pair_id`、`id`、`group`（1＝外骨骼組, 0＝配對對照組）、`age`、`sex`、`baseline_speed`、`motivation_rmq`、`sixmwt_t1`、`sixmwt_t2`、`sixmwt_diff`（＝ `sixmwt_t2 - sixmwt_t1`）、`abc_t1`、`abc_t2`、`abc_diff`。",
        "s5_clean": "1. 配對完整性與值域檢查：確認每個 `pair_id` 均含實驗組與對照組各 1 人，且年齡差 ≤ 5 歲、基線步速差 ≤ 0.10 m/s；確認 `sixmwt` 介於 20–600 公尺、`abc` 介於 0–100。\n2. 離群值與缺失值：以 1.5 × IQR 檢查 `sixmwt_diff`；若有單一受試者中途退出導致該對缺 1 人，主要分析採用納入 `pair_id` 隨機截距之線性混合模型（LMM）保留所有可用資料，並以完整配對樣本（Complete pairs）作敏感度分析。",
        "s5_desc": "1. Table 1（配對後兩組基線平衡檢核表，N ＝ 60）：並列呈現外骨骼組（n ＝ 30）與配對對照組（n ＝ 30）之年齡、性別、中風月數、基線步速、基線 6MWT、基線復健動機 RMQ（M ± SD / n [%]），並報告配對後之「標準化平均數差（SMD）」，驗證所有配對變項 |SMD| < 0.10。\n2. Table 2 與折線圖：呈現兩組於 T₁ 與 T₂ 之 6MWT 與 ABC 分數（M ± SD）及前後進步量，繪製兩組前後變化斜率圖。",
        "s5_assump": "1. 混合 ANOVA / ANCOVA 前提檢查：\n   ・殘差常態性：Shapiro–Wilk 檢定與 Q-Q 圖。\n   ・變異數同質性：Levene's test。\n   ・ANCOVA 迴歸斜率同質性：檢驗 `Group × sixmwt_t1` 及 `Group × motivation_rmq` 交互項是否不顯著（p > .05）。\n2. 考量 1:1 配對結構之替代與補強檢定：除標準混合 ANOVA 外，同步執行「將 `pair_id` 設為隨機截距之線性混合模型（LMM）」以及「針對 30 對配對差值之配對 t 檢定 / Wilcoxon 符號等級檢定」，確保配對相依性被妥善建模。",

        "s6_mult": "主要結果（6MWT）與次要結果（ABC）以 Holm–Bonferroni 法控制型一錯誤率；並同時呈現「未控制復健動機之雙重差分」與「控制基線復健動機 RMQ 與中風月數後之 ANCOVA 模型」，證明療效並非僅來自自選組別之初始動機差異。",
        "s6_apa": "【預期／模擬結果 APA 第 7 版標準報告句】\n1. 基線配對平衡：經 1:1 個案配對後，外骨骼組（n ＝ 30）與配對對照組（n ＝ 30）在年齡（61.4 ± 8.2 vs 61.8 ± 7.9 歲, SMD ＝ −0.05）、女性比例（40.0% vs 40.0%, SMD ＝ 0.00）及基線 6MWT 距離（182.5 ± 54.0 vs 180.8 ± 52.6 公尺, SMD ＝ 0.03）均高度平衡。\n2. 主要結果（混合 ANOVA 與 ANCOVA）：2×2 混合設計分析顯示，6MWT 行走距離之組別 × 時間交互作用達統計顯著，F(1, 58) ＝ 16.42, p < .001, 局部 η²p ＝ .221。外骨骼組於 8 週後平均增加 46.80 ± 28.40 公尺（由 182.5 增至 229.3 公尺），顯著大於配對對照組之平均增加 18.20 ± 26.10 公尺（由 180.8 增至 199.0 公尺），兩組進步差距 ΔΔ ＝ +28.60 公尺，95% CI [+14.48, +42.72]，Cohen's d ＝ 1.05。於 ANCOVA 進一步控制基線 6MWT、中風月數與復健動機分數（RMQ）後，組間差異依然顯著（調整後進步差 +26.90 公尺, 95% CI [+12.85, +40.95], F(1, 55) ＝ 14.58, p < .001）。",
        "s6_interp": "【結果解讀四步驟】\n① 重述問題：在無法隨機分派之實務情境下，以 1:1 配對對照混合設計檢驗 8 週外骨骼訓練對慢性中風患者步行耐力與平衡信心之成效。\n② 效應量與 CI 先行：外骨骼組 6MWT 進步量比配對對照組多出 28.60 公尺（控制復健動機後仍多出 26.90 公尺，95% CI [12.85, 40.95], d ＝ 1.05, p < .001），且自身進步量（46.80 公尺）超越臨床最小重要差異（34.4 公尺）。\n③ 連結實務意義：證實在尊重患者自主選擇下，外骨骼訓練仍帶來超越傳統復健之實質行走耐力改善。\n④ 研究限制（必寫）：本研究為配對非隨機設計，雖已嚴格配對年齡、性別與基線步速並統計控制復健動機量表分數，但仍無法像隨機對照試驗（RCT）般完全排除其他未測量之殘餘混淆變項（如家屬支持度或社經狀態），推論時應保持審慎。"

        "s1_rq": "於台灣長照機構（日間照護中心與住宿式護理之家）第一線照護人員（P）中，導入「生成式 AI 語音交班摘要系統（X，實驗場域 A 機構）」相較於「導入前自身基線及同期維持傳統手寫／打字交班流程之對照場域 B 機構（C）」，是否能顯著縮短每班交班文書時間（Primary DV，分鐘／班），且不降低交班紀錄完整性分數（Secondary DV 1，非劣性界限 Δ ＝ −1.0 分）並獲得良好使用者知覺有用性與信任度（Secondary DV 2）？",
        "s1_why": "1. 重要性（Important）：長照第一線護理師與照服員每班耗費大量時間撰寫交班紀錄，壓縮直接照護住民時間並造成延遲下班與職業倦怠。\n2. 新穎性（Novel）：結合語音辨識與大型語言模型自動生成 SBAR 結構化交班摘要，並以「組內前後配對＋跨機構雙重差分（DiD）＋完整性非劣性檢定（Non-inferiority）」三軌驗證「省時且不犧牲品質」。\n3. 合時宜（Timely）：回應台灣長照 2.0 數位轉型與照護人力短缺之實務痛點。",
        "s1_h0h1": "・假設 H1a（實驗場域 A 機構組內導入前後交班文書時間變化，雙尾 α ＝ .05）：\n  H₀：μ_d ＝ 0（A 機構照護人員導入後與導入前之每班交班文書時間平均差值為 0 分鐘）\n  H₁：μ_d ≠ 0（導入前後存在顯著差異，預期導入後文書時間顯著縮短 μ_d < 0）\n・假設 H1b（跨機構雙重差分 DiD 淨效應，雙尾 α ＝ .05）：\n  H₀：β_DiD ＝ (μ_A,post − μ_A,pre) − (μ_B,post − μ_B,pre) ＝ 0（扣除同期對照 B 機構時間趨勢後之淨效應為 0）\n  H₁：β_DiD ≠ 0（預期 A 機構之時間縮短幅度顯著大於 B 機構，β_DiD < 0）\n・假設 H2（交班紀錄完整性分數之非劣性檢定，單尾 α ＝ .025／對應雙側 95% CI 下界）：\n  預設臨床非劣性界限（Non-inferiority margin）為 Δ ＝ −1.0 分（0–20 分量表之 5%）：\n  H₀：μ_d,完整性 ≤ −1.0 分（導入後完整性下降達 1.0 分以上，即劣於傳統交班）\n  H₁：μ_d,完整性 > −1.0 分（導入後完整性分數變化之 95% CI 下界高於 −1.0 分，證實不劣於傳統交班）。",

        "s4_pop": "・目標母體：台灣醫學中心與大型區域醫院門急診開立之所有西醫處方籤。\n・抽樣架構：某醫學中心於研究前後合計 48 週（約 11 個月）內所有門診與急診開立之電子處方紀錄（每週約 35,000 張處方，48 週合計約 168 萬張處方）。\n・納入條件：研究期間於門診或急診開立含 2 種以上全身性作用藥品之成人處方。\n・排除條件：住院常規單一劑量配送處方、外用藥膏或洗劑單方處方、系統例行停機維護時段之紙本備援處方。",

        "s4_power": "依據中斷時間序列方法學文獻（Bernal et al., 2017; Zhang et al., 2011）：\n・時間點數量（Number of time points）：ITS 統計檢定力主要取決於介入前後之時間點數量與一階自我相關係數（ρ_AR1）。文獻指出介入前後各 ≥ 24 個等距時間點（總時間點 T ＝ 48 週），在典型自相關 ρ ＝ .30、雙尾 α ＝ .05 下，偵測中等水準跳躍效應（Level change d ≈ 0.8–1.0 SD）與斜率變化之統計檢定力達 .85 以上。\n・每時間點樣本量：每週涵蓋約 35,000 張處方，單週比率之抽樣標準誤極小，確保時間序列點估計高度精確。",
        "s4_scenarios": "【48 週中斷時間序列（前 24 週＋後 24 週，雙尾 α ＝ .05）在不同自相關係數 ρ 下之檢定力】\n1. 低自相關情境（ρ ＝ .10）：對水準跳躍 1.0 SD 之檢定力為 .92。\n2. 基準中度自相關情境（ρ ＝ .30）：對水準跳躍 1.0 SD（約每萬張減少 8 件）之檢定力為 .85。\n3. 高自相關保守情境（ρ ＝ .50）：檢定力為 .74（搭配控制每週高齡患者佔比與季節共變項後可提升回 .82）。",
        "s5_layout": "・資料結構：時間序列寬表，「1 列 ＝ 1 個日曆週次（t ＝ 1 至 48，共 48 列）」。\n・核心欄位：`week_id`（1..48）、`intervention`（第1–24週＝0, 第25–48週＝1）、`time_after`（第1–24週＝0, 第25–48週＝1..24）、`total_rx`（當週總處方張數）、`high_risk_events`（當週高風險交互作用張數）、`error_rate_per10k`（主要 DV，每萬張件數）、`override_pct`（次要 DV，警示略過率 %）、`elderly_pct`（高齡佔比 %）、`polypharm_pct`（多重用藥佔比 %）、`season`。",
        "s5_clean": "1. 分母穩定度與值域檢查：檢查 48 週之每週總處方張數 `total_rx` 是否有因農曆春節連假停診導致分母異常驟降；因為採用「每萬張處方標準化率」，並將連假週次設為指標共變項控制，可避免張數波動干擾。\n2. 離群週次檢查：檢視殘差是否超過 ±3 SD，並核對該週有無系統異常。",
        "s5_desc": "1. Table 1（導入前 24 週 vs 導入後 24 週之處方結構與結果摘要表）：比較導入前後之每週平均總處方數、高齡患者佔比、多重用藥佔比、每萬張高風險處方率（M ± SD 與 Median [IQR]）及警示略過率（%）。\n2. 圖 1（48 週中斷時間序列散佈與分段迴歸趨勢圖）：橫軸為第 1–48 週，於第 24.5 週畫垂直虛線標示 AI 系統上線，同時繪出 ① 每週實測點、② 導入前實線迴歸線與向後延伸之虛線「反事實預測線（Counterfactual trend）」、③ 導入後實線迴歸線與 95% 信賴區間帶，直觀展現水準跳躍 β₂ 與斜率改變 β₃！",
        "s5_assump": "1. 自我相關檢驗（Autocorrelation check）：對 OLS 殘差計算 Durbin–Watson（DW）統計量並繪製自相關函數圖（ACF / PACF），同時執行 Breusch–Godfrey 檢定（Lag 1–4）。\n2. 違反獨立性之標準處理：時間序列通常存在一階正自相關（DW < 2），本研究預設直接採用「Prais–Winsten 一階自相關廣義最小平方法（AR(1) GLS）」與「Newey–West 異質變異及自相關穩健標準誤（HAC robust SE）」進行參數估計。\n3. 殘差常態性與平穩性：執行 Shapiro–Wilk 與 Augmented Dickey–Fuller（ADF）單根檢定。",

        "s6_apa": "【預期／模擬結果 APA 第 7 版標準報告句】\n1. 主要結果（Prais–Winsten AR(1) 分段迴歸）：導入前 24 週，全院每萬張處方高風險交互作用開立率平均為 42.50 ± 3.80 ‰₀，基線自然趨勢斜率平緩未達顯著（β₁ ＝ −0.05 ‰₀/週, 95% CI [−0.18, +0.08], p ＝ .442）。於第 25 週導入 AI 分級警示系統瞬間，高風險處方率發生顯著不連續水準跳躍下降，β₂ ＝ −11.80 ‰₀，95% CI [−15.12, −8.48]，t(41) ＝ −7.18, p < .001；且導入後之每週變化斜率較導入前顯著加速下降，斜率改變量 β₃ ＝ −0.32 ‰₀/週，95% CI [−0.51, −0.13]，t(41) ＝ −3.41, p ＝ .001（轉換後 Durbin–Watson 統計量 ＝ 1.96，顯示自相關已妥善消除）。至導入後第 24 週（第 48 週），實測值較反事實趨勢預測值共降低 19.48 ‰₀（相對降幅達 47.2%）。\n2. 次要結果（警示略過率）：醫師警示強制略過率於系統上線瞬間由基線平均 86.4% 顯著跳躍下降 28.5 個百分點（β₂ ＝ −28.50%, 95% CI [−32.40%, −24.60%], p < .001）。",
        "s6_interp": "【結果解讀四步驟】\n① 重述問題：以 48 週中斷時間序列檢驗全院導入 AI 處方交互作用分級警示能否降低高風險處方開立率與警示略過率。\n② 效應量與 CI 先行：扣除導入前微幅背景趨勢（β₁ ＝ −0.05）後，系統上線瞬間即減少每萬張 11.80 件高風險處方（95% CI [−15.12, −8.48]），且後續每週再額外減少 0.32 件，半年後累積相對降幅達 47.2%。\n③ 連結臨床意義：以本院每週 3.5 萬張門急診處方計，每週可實質多攔截約 68 張高風險交互作用處方，大幅降低因藥物交互作用導致之急診就醫。\n④ 研究限制：(1) 單一醫學中心時間序列無外院同期對照組（Comparative ITS），雖已控制季節與患者結構，仍無法完全排除第 25 週未知的外部同步事件；(2) 主要指標為處方開立率，尚未直接串聯患者返家服藥後之實際不良藥物反應（ADE）住院率；(3) 系統規則針對本院藥品品項調校，跨院移植需重新校準。"

let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defState();
    const o = JSON.parse(raw);
    return Object.assign(defState(), o, {
      dt: Object.assign(defState().dt, o.dt||{}),
      calc: Object.assign(defState().calc, o.calc||{}),
      matcher: Object.assign(defState().matcher, o.matcher||{}),
      lab: Object.assign(defState().lab, o.lab||{})
    });
  }catch(e){ return defState(); }
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    const el = document.getElementById("saved");
    if(el){
      const d = new Date();
      el.textContent = "已自動儲存於瀏覽器（" + d.toTimeString().slice(0,8) + "）";
    }
  }catch(e){}
  renderTop();
  renderNav();
}
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function filled(v){
  if(Array.isArray(v)) return v.some(r=>Array.isArray(r) && r.slice(1).some(c=>String(c||"").trim().length>1));
  return String(v||"").trim().length > 1;
}
function stepPct(st){
  if(st.id==="review"){
    const main = STEPS.filter(x=>x.id!=="readme" && x.id!=="setup" && x.id!=="review");
    const done = main.filter(x=>stepPct(x)===100).length;
    return Math.round(done/main.length*100);
  }
  if(!st.req || !st.req.length) return 100;
  const n = st.req.filter(k=>filled(S[k])).length;
  return Math.round(n/st.req.length*100);
}
function totalProg(){
  const main = STEPS.filter(x=>x.id!=="readme" && x.id!=="setup" && x.id!=="review");
  const done = main.filter(x=>stepPct(x)===100).length;
  const pct = Math.round(main.reduce((a,x)=>a+stepPct(x),0)/main.length);
  return {done, total:main.length, pct};
}

function applyPreset(pid, silent){
  const p = PRESETS[pid];
  if(!p) return;
  if(!silent && filled(S.title) && S.title !== p.data.title){
    if(!confirm("確定要匯入「" + p.label + "」完整範例嗎？這將覆蓋目前的草稿內容（建議可先至步驟 ⑦ 匯出 JSON 備份）。")) return;
  }
  const d = JSON.parse(JSON.stringify(p.data));
  Object.keys(d).forEach(k=>{ S[k] = d[k]; });
  S.chk = {}; S.gate = {};
  Object.keys(MODS).forEach(m=>{
    (MODS[m].must||[]).forEach((_,i)=>{ S.chk[m+"_"+i]=true; });
    (MODS[m].gate||[]).forEach((_,i)=>{ S.gate[m+"_"+i]=true; });
  });
  const ds = DESIGNS[S.design];
  if(ds && ds.checklist){
    ds.checklist.forEach((_,i)=>{ S.chk["ds_"+i]=true; });
  }
  // 同步更新試算器預設模式
  if(pid==="rct"){ S.calc.test="ind_t"; S.calc.es=0.50; S.calc.drop=15; S.lab.mode="ind"; S.lab.m1=34.2; S.lab.sd1=18.5; S.lab.n1=64; S.lab.m2=49.8; S.lab.sd2=20.1; S.lab.n2=64; S.lab.dv_name="術後 24 小時活動疼痛 VAS"; S.lab.unit="mm"; }
  else if(pid==="between"){ S.calc.test="chisq"; S.calc.es=0.22; S.calc.drop=10; S.lab.mode="chisq"; S.lab.a=81; S.lab.b=19; S.lab.c=62; S.lab.d=38; S.lab.dv_name="14 天準時完檢率"; S.lab.unit="%"; }
  else if(pid==="within_prepost" || pid==="within_cross"){ S.calc.test="paired_t"; S.calc.es=0.50; S.calc.drop=15; S.lab.mode="paired"; }
  else if(pid==="mixed_rct" || pid==="mixed_matched"){ S.calc.test="mixed_anova"; S.calc.es=0.22; S.calc.drop=15; S.lab.mode="did"; }
  else if(pid==="quasi_did"){ S.calc.test="paired_t"; S.calc.es=0.50; S.calc.drop=10; S.lab.mode="paired"; S.lab.m1=18.40; S.lab.sd1=6.42; S.lab.n1=34; S.lab.m2=13.03; S.lab.sd2=3.92; S.lab.md=-5.3676; S.lab.sdd=4.97; S.lab.dv_name="每班交班文書時間"; S.lab.unit="分鐘"; }
  else if(pid==="corr"){ S.calc.test="corr"; S.calc.es=0.25; S.calc.drop=12; S.lab.mode="corr"; S.lab.r_val=0.46; S.lab.r_n=210; }
  save();
  render();
}

function renderTop(){
  const ds = DESIGNS[S.design] || DESIGNS.quasi_did;
  const who = document.getElementById("who");
  if(who){
    who.innerHTML = `<span class="pill">${esc(ds.short)}</span>` +
      `<span class="pill ac">${esc(ds.cat)}</span>` +
      `<span class="pill ok">${esc(ds.guideline.split(" ")[0])}</span>`;
  }
  const p = totalProg();
  const bar = document.querySelector("#prog i");
  const txt = document.getElementById("progt");
  if(bar) bar.style.setProperty("--p", p.pct+"%");
  if(txt) txt.textContent = `已完成 ${p.done}/${p.total} 步（${p.pct}%）`;
}

function renderNav(){
  const box = document.getElementById("stepnav");
  if(!box) return;
  box.innerHTML = STEPS.map(st=>{
    const pct = stepPct(st);
    const done = pct===100 && st.id!=="setup" && st.id!=="readme";
    const on = S.step===st.id;
    return `<button type="button" class="sitem ${on?"on":""} ${done?"done":""}" data-step="${st.id}">
      <span class="${done?"sdot":"pp"}" style="--p:${pct}">${done?"✓":`<i>${st.code}</i>`}</span>
      <span class="slbl">${esc(st.name)}<small>${esc(st.sub)}</small></span>
      <span class="spct" style="font-size:11px;color:var(--muted)">${st.id==="readme"?"手冊":st.id==="setup"?"":pct+"%"}</span>
    </button>`;
  }).join("");
  box.querySelectorAll(".sitem").forEach(b=>{
    b.onclick = ()=>{
      S.step = b.dataset.step;
      document.getElementById("side-nav").classList.remove("open");
      save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    };
  });
}

function initSymp(){
  const sy = document.getElementById("sy");
  if(!sy) return;
  sy.innerHTML = `<option value="">💡 我卡在哪裡／常見問題速查...</option>` +
    SYMP.map((x,i)=>`<option value="${i}">${esc(x.q)}</option>`).join("");
  sy.onchange = ()=>{
    const idx = sy.value;
    if(idx==="") return;
    const item = SYMP[idx];
    sy.value = "";
    if(item){
      S.step = item.to;
      save(); render();
      setTimeout(()=>alert("【指引提示】\n" + item.tip), 60);
    }
  };
  const oc = document.getElementById("oneclick");
  if(oc){
    oc.onclick = ()=>{
      const pid = PRESETS[S.design] ? S.design : "quasi_did";
      applyPreset(pid, false);
    };
  }
  const brm = document.getElementById("btn_readme");
  if(brm){
    brm.onclick = ()=>{
      S.step = "readme";
      save(); render(); window.scrollTo({top:0,behavior:"smooth"});
    };
  }
  const menu = document.getElementById("menu");
  if(menu){
    menu.onclick = ()=>{
      document.getElementById("side-nav").classList.toggle("open");
    };
  }
}

function recDesignFromTree(){
  const {q1,q2,q3,q4} = S.dt;
  if(q1==="no"){
    return {code:"corr", reason:"因無法（或不擬）人為操弄自變項 X，建議採用「⑨ 觀察性橫斷／相關與多元迴歸設計」，透過自然測量搭配多元階層迴歸控制混淆變項 Z。"};
  }
  if(q2==="yes"){
    if(q3==="cross") return {code:"within_cross", reason:"可隨機分派順序且介入效果短期可逆、同一人可經歷所有條件，強烈推薦高效率之「④ 組內交叉與對抗平衡設計（AB/BA Crossover）」！"};
    if(q3==="yes") return {code:"mixed_rct", reason:"可隨機分組且每組皆可進行介入前後（或多時間點）測量，推薦因果力與檢定力兼具之「⑤ 混合設計（一）：隨機分組 × 前後測（Mixed RCT）」！"};
    return {code:"rct", reason:"可隨機分派且每人僅接受單一條件／後測，推薦因果推論黃金標準「① 平行隨機對照試驗（Between-Subject RCT）」！"};
  }else{
    if(q3==="cross") return {code:"within_cross", reason:"同一人可輪流接受兩種可逆條件，建議採用「④ 組內交叉與對抗平衡設計」。"};
    if(q3==="yes"){
      if(q4==="match") return {code:"mixed_matched", reason:"無法隨機抽籤但可依年齡、性別、基線功能尋找 1:1 配對對照組並測前後測，推薦「⑥ 混合設計（二）：配對對照 × 前後測」！"};
      if(q4==="did") return {code:"quasi_did", reason:"以機構／病房為單位導入且有同期未導入之對照場域，推薦課程貫穿案例 Q 所用之「⑦ 準實驗（一）：非對等控制組與雙重差分（DiD）」！"};
      if(q4==="its") return {code:"quasi_its", reason:"單一全院／全區同步上線無外在對照組，但可收集介入前後連續多週歷史資料，推薦「⑧ 準實驗（二）：中斷時間序列（ITS）」！"};
      return {code:"within_prepost", reason:"僅單一場域且無同期對照組，建議採用「③ 組內單組前後測設計」，務必搭配雙基線測量與時間混淆控制。"};
    }else{
      return {code:"between", reason:"無法隨機分派且每人僅單次測量，建議採用「② 組間比較／A-B 實驗設計」，並於多元迴歸或 ANCOVA 控制基線混淆變項 Z。"};
    }
  }
}

function qnorm(p){
  if(p<=0) return -8; if(p>=1) return 8;
  const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.3577518672690,-30.66479806614716,2.506628277459239];
  const b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572];
  const c=[-0.007784894002430293,-0.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783];
  const d=[0.007784695709041462,0.3224671290700398,2.445134137142996,3.754408661907416];
  const pl=0.02425, ph=1-pl;
  let q, r;
  if(p<pl){ q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
  if(p<=ph){ q=p-0.5; r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);
}
function pnorm(z){
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989422804014327*Math.exp(-z*z/2);
  const p = d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0 ? 1-p : p;
}

function calcSampleSize(c){
  const alpha = parseFloat(c.alpha)||0.05;
  const power = parseFloat(c.power)||0.80;
  const tail = c.tail==="1" ? 1 : 2;
  const za = qnorm(1 - alpha/tail);
  const zb = qnorm(power);
  const Z = Math.pow(za + zb, 2);
  const es = Math.max(0.05, parseFloat(c.es)||0.50);
  let n_eff = 34, per_group = 34, label = "", detail = "";

  // 同時算出組間兩組 vs 組內配對在相同 es 下的人數供效率對照圖使用
  const n_between_ref = Math.ceil(2 * Z / (es*es) + za*za/4) * 2;
  const n_within_ref = Math.ceil(Z / (es*es) + za*za/2);

  if(c.test==="paired_t"){
    n_eff = Math.ceil(Z / (es*es) + za*za/2);
    per_group = n_eff;
    label = `配對樣本 t 檢定（組內前後測／交叉設計，Cohen's dz ＝ ${es.toFixed(2)}）`;
    detail = `單組配對有效樣本 n ＝ ${n_eff} 人（每人測 2 次，共 ${n_eff*2} 人次數據）`;
  }else if(c.test==="ind_t"){
    per_group = Math.ceil(2 * Z / (es*es) + za*za/4);
    n_eff = per_group * 2;
    label = `獨立樣本 t 檢定（平行組間 2 組，Cohen's d ＝ ${es.toFixed(2)}）`;
    detail = `每組有效樣本 n ＝ ${per_group} 人 × 2 組 ＝ 總有效樣本 ${n_eff} 人`;
  }else if(c.test==="anova"){
    const k = Math.max(3, parseInt(c.k)||3);
    const mult = k===3 ? 1.225 : (k===4 ? 1.36 : 1.48);
    per_group = Math.ceil((Z * mult) / (es*es * k) + 1.5);
    n_eff = per_group * k;
    label = `單因子變異數分析 One-way ANOVA（組間 ${k} 組，Cohen's f ＝ ${es.toFixed(2)}）`;
    detail = `每組有效樣本 n ＝ ${per_group} 人 × ${k} 組 ＝ 總有效樣本 ${n_eff} 人`;
  }else if(c.test==="mixed_anova"){
    const r = Math.min(0.9, Math.max(0.1, parseFloat(c.r_rep)||0.50));
    per_group = Math.ceil((Z * (1 - r)) / (2 * es * es) + 2);
    n_eff = per_group * 2;
    label = `二因子混合設計 ANOVA（組別 × 時間交互作用，效應量 f ＝ ${es.toFixed(2)}，前後相關 r ＝ ${r.toFixed(2)}）`;
    detail = `每組有效樣本 n ＝ ${per_group} 人 × 2 組 ＝ 總有效樣本 ${n_eff} 人`;
  }else if(c.test==="corr"){
    const r = Math.min(0.95, es);
    const zr = 0.5 * Math.log((1+r)/(1-r));
    n_eff = Math.ceil(Z / (zr*zr) + 3);
    per_group = n_eff;
    label = `雙變項 Pearson 相關分析（預期相關係數 r ＝ ${r.toFixed(2)}）`;
    detail = `所需總有效樣本 n ＝ ${n_eff} 人`;
  }else if(c.test==="chisq"){
    n_eff = Math.ceil(Z / (es*es));
    per_group = Math.ceil(n_eff / 2);
    label = `Pearson 卡方獨立性檢定（效應量 w ＝ ${es.toFixed(2)}）`;
    detail = `所需總有效樣本 N ＝ ${n_eff} 人（若兩組均分則每組約 ${per_group} 人）`;
  }else if(c.test==="prop2"){
    const p1 = Math.min(0.99, Math.max(0.01, parseFloat(c.p1)||0.60));
    const p2 = Math.min(0.99, Math.max(0.01, parseFloat(c.p2)||0.80));
    const pbar = (p1+p2)/2;
    const num = Math.pow(za*Math.sqrt(2*pbar*(1-pbar)) + zb*Math.sqrt(p1*(1-p1)+p2*(1-p2)), 2);
    per_group = Math.ceil(num / Math.pow(p2-p1, 2));
    n_eff = per_group * 2;
    label = `兩獨立組比例比較（p₁ ＝ ${(p1*100).toFixed(0)}% vs p₂ ＝ ${(p2*100).toFixed(0)}%）`;
    detail = `每組有效樣本 n ＝ ${per_group} 人 × 2 組 ＝ 總有效樣本 ${n_eff} 人`;
  }else if(c.test==="tost"){
    const za1 = qnorm(1 - alpha); // TOST uses 1-sided alpha
    const zb2 = qnorm(1 - (1-power)/2);
    n_eff = Math.ceil(Math.pow(za1 + zb2, 2) / (es*es) + 2);
    per_group = n_eff;
    label = `配對非劣性／雙單側等效檢定（TOST，標準化界限 Δ/SD ＝ ${es.toFixed(2)}）`;
    detail = `所需有效樣本 n ＝ ${n_eff} 人`;
  }

  const deff = c.cluster ? (1 + (Math.max(2, parseInt(c.m)||15) - 1) * (parseFloat(c.icc)||0.02)) : 1.0;
  const n_deff = Math.ceil(n_eff * deff);
  const drop = Math.min(50, Math.max(0, parseFloat(c.drop)||10)) / 100;
  const n_recruit = Math.ceil(n_deff / (1 - drop));
  return {n_eff, per_group, deff, n_deff, drop, n_recruit, label, detail, n_between_ref, n_within_ref, alpha, power, tail, es};
}

function getMatcherResult(m){
  const g = m.goal;
  const s = m.dv_scale;
  if(g==="cmp_2_ind"){
    if(s==="num_norm") return {
      title:"兩獨立組間比較 × 數值依變項（預設常態）",
      primary:"獨立樣本雙尾 t 檢定（Independent-samples t-test）",
      assump:"① 觀察值獨立性（一人僅在一組）；② 各組殘差常態性（Shapiro–Wilk 檢定與 Q-Q 圖）；③ 兩組變異數同質性（Levene's test，p > .05）。",
      fallback:"・若違反等變異數（Levene p < .05）：改採不假設等變異之 Welch's t 檢定。\n・若嚴重偏態或為次序尺度：改採無母數 Mann–Whitney U 檢定（Wilcoxon rank-sum test），並同時報告中位數與四分位距 Median (IQR)。",
      es:"兩組平均差 Δ、標準化效應量 Cohen's d（或 Hedges' g）及其 95% 信賴區間（95% CI）。"
    };
    if(s==="ord_skew") return {
      title:"兩獨立組間比較 × 偏態數值或次序依變項",
      primary:"無母數 Mann–Whitney U 檢定（搭配 Welch's t 檢定雙軌呈現）",
      assump:"① 兩組樣本彼此獨立；② 依變項至少為次序尺度，檢驗兩組分佈位置（中位數）是否位移。",
      fallback:"可搭配拔靴法（Bootstrapping）估計平均數／中位數差之 95% 信賴區間。",
      es:"Hodges–Lehmann 中位數差之 95% CI 與等級雙列相關係數（Rank-biserial correlation r_rb）。"
    };
    return {
      title:"兩獨立組間比較 × 二元／名目類別依變項（2×2 或 R×C 列聯表）",
      primary:"Pearson 卡方獨立性檢定（χ² test of independence）",
      assump:"① 觀察值彼此獨立（每人僅歸入一格）；② 80% 以上細格之『期望次數（Expected count）』≥ 5，且無任何一格期望次數 < 1。",
      fallback:"・若 2×2 列聯表有任一格期望次數 < 5：改採 Fisher 精確檢定（Fisher's exact test）。\n・若需控制年齡、性別等混淆變項 Z：採用多變項二元邏輯斯迴歸（Multiple Logistic Regression）。",
      es:"風險差（RD，百分比差）、勝算比（Odds Ratio, OR）與 φ 係數／Cramér's V 及其 95% CI。"
    };
  }
  if(g==="cmp_2_pair"){
    if(s==="cat_bin") return {
      title:"組內配對前後測 × 二元類別依變項（如介入前後及格／不及格）",
      primary:"McNemar 配對卡方檢定（McNemar's test）",
      assump:"成對二元觀察值（2×2 配對表），聚焦於前後狀態改變之不一致細格（Discordant pairs b 與 c）。",
      fallback:"若不一致細格數（b + c）< 25，改採 McNemar 精確二項檢定（Exact binomial test）。",
      es:"配對比例差与配對勝算比（Matched Odds Ratio ＝ b / c）及其 95% CI。"
    };
    return {
      title:"組內配對前後測／交叉設計（2 時間點或 2 條件）× 數值依變項",
      primary:"配對樣本雙尾 t 檢定（Paired-samples t-test）",
      assump:"① 成對觀察值彼此獨立（不同受試者之間獨立）；② 『個人前後配對差值 dᵢ ＝ Y_post − Y_pre』服從常態分佈（以 Shapiro–Wilk 檢定與 Q-Q 圖檢查差值 dᵢ，而非分別檢查前測與後測！）。",
      fallback:"・若配對差值 dᵢ 嚴重違反常態性（Shapiro–Wilk p < .05 且明顯偏態）：改採無母數 Wilcoxon 符號等級檢定（Wilcoxon signed-rank test），並報告中位數與 IQR。\n・若是品質安全不變差指標：搭配單側非劣性檢定或雙單側檢定（TOST）。",
      es:"平均配對差 d̄、標準誤 SE、95% CI，以及組內效應量 Cohen's dz（＝ d̄ / SD_d）與 Cohen's dav（＝ d̄ / SD_avg）。"
    };
  }
  if(g==="cmp_k_ind"){
    return {
      title:"三組以上獨立組間比較（≥3 組）× 數值依變項",
      primary:"單因子獨立樣本變異數分析（One-way between-subjects ANOVA）",
      assump:"① 各組觀察值獨立；② 各組殘差常態分佈（Shapiro–Wilk）；③ 各組變異數同質性（Levene's test）。",
      fallback:"・若違反等變異數：改採 Welch's ANOVA 並搭配 Games–Howell 事後比較。\n・若嚴重偏態或為次序尺度：改採無母數 Kruskal–Wallis H 檢定，事後比較採 Dunn's test（含 Holm / Bonferroni 校正）。",
      es:"整體效應量 η²（Eta-squared）或 ω²，以及事後兩兩比較（Tukey HSD 或 Holm 校正）之 Cohen's d 與 95% CI。"
    };
  }
  if(g==="cmp_k_rep"){
    return {
      title:"組內三個以上時間點／條件重複測量（≥3 時間點）",
      primary:"單因子重複測量變異數分析（One-way Repeated-Measures ANOVA）或線性混合模型（LMM）",
      assump:"① 殘差常態性；② 球形性假設（Sphericity：各時間點兩兩差值之變異數相等，以 Mauchly's test 檢驗）。",
      fallback:"・若違反球形性（Mauchly p < .05）：自由度改採 Greenhouse–Geisser 校正（當 ε < .75）或 Huynh–Feldt 校正。\n・若嚴重偏態：改採無母數 Friedman 檢定（搭配 Wilcoxon + Holm 事後比較）。\n・若有隨機缺失值：改採線性混合效應模型（Linear Mixed Model, LMM）。",
      es:"局部 η²p（Partial eta-squared）及各時間點兩兩差值之 Cohen's dz 與 95% CI。"
    };
  }
  if(g==="mixed_did"){
    return {
      title:"混合設計（組間分組 × 組內前後測）或準實驗雙重差分（DiD）",
      primary:"二因子混合設計 ANOVA（Group × Time 交互作用）／雙重差分迴歸（DiD）／線性混合模型（LMM）",
      assump:"① 各格殘差常態性；② 組間變異數同質性（Levene's test）；③ 若時間點 ≥3 需檢查球形性（Mauchly's test）；④ 若為非隨機準實驗 DiD，需檢視介入前平行趨勢假設（Parallel trends）。",
      fallback:"・若基線存在微小差異或需控制年齡／年資等共變項 Z：採用以基線前測為共變項之 ANCOVA 或納入人員隨機截距之線性混合效應模型（LMM）。",
      es:"Group × Time 交互作用之局部 η²p、雙重差分淨效應點估計（DiD ＝ Δ_E − Δ_C）及其 95% CI 與進步量 Cohen's d。"
    };
  }
  return {
    title:"變項關聯與多變項預測（觀察性相關／多元迴歸）",
    primary:"雙變項 Pearson 積差相關 r ＋ 多元階層線性迴歸（若 DV 為二元則用多元邏輯斯迴歸）",
    assump:"① 線性關係（先畫散佈圖確認，避開 Anscombe 陷阱）；② 雙變項／殘差常態性（Shapiro–Wilk）；③ 殘差等分散性（Homoscedasticity）；④ 無多重共線性（各變項 VIF < 5.0）。",
    fallback:"・若雙變項呈明顯偏態或單調非線性：改報無母數 Spearman 等級相關係數 ρ。\n・若迴歸殘差違反等分散性：改採 HC3 異質變異穩健標準誤（Robust SE）。",
    es:"相關係數 r（95% CI）、多元迴歸未標準化係數 B（95% CI）、標準化係數 β、整體 R²、Adjusted R² 與新增解釋力 ΔR²（Cohen's f²）。"
  };
}
